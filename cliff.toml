[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
**{{ group }}**
{% for commit in commits %}\
- {{ commit.message | upper_first }} \
({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}\
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
commit_preprocessors = [
  { pattern = '\s*\((?:Saga \d+|#\d+)[^)]*\)', replace = "" },
  { pattern = "<what was wrong for the add-on author> no longer happens when <situation>", replace = "a new Uplink's docs script stamps its bundle hash, and new says to rename the placeholder widget" },
]
commit_parsers = [
  { message = "^(revert|chore|test|ci|build|refactor|style)(\\(.*\\))?!?:", skip = true },
  { message = "^[a-z]+\\((test|tests|e2e|ci|rig|fold|scripts)\\)!?:", skip = true },
  { message = "^feat",     group = "Features" },
  { message = "^fix",      group = "Bug Fixes" },
  { message = "^perf",     group = "Performance" },
  { message = "^docs",     group = "Documentation" },
  { message = ".*",        group = "Other" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "newest"
