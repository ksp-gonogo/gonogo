services:
  # The relay serves the main screen on this machine (consent, first-run
  # bootstrap) and runs the station endpoint: one port every station on
  # another network connects through. See docs/NETWORKING.md.
  relay:
    build:
      # Repo-root context so pnpm can resolve workspace deps (@ksp-gonogo/logger).
      context: .
      dockerfile: packages/relay/Dockerfile
    ports:
      # Loopback only: the main screen's browser on this machine is the
      # relay's one HTTP client.
      - "${RELAY_HTTP_BIND:-127.0.0.1}:3002:3002"
      # The station endpoint's one port: UDP for stations, TCP for a network
      # that blocks UDP. Same ENDPOINT_PORT the relay passes to the endpoint,
      # and the port to forward on the router.
      - "${ENDPOINT_PORT:-47100}:${ENDPOINT_PORT:-47100}/udp"
      - "${ENDPOINT_PORT:-47100}:${ENDPOINT_PORT:-47100}/tcp"
    environment:
      PORT: 3002
      # Optional pin for the public IP the endpoint advertises. When unset
      # (the typical case) the relay discovers it at startup.
      PUBLIC_IP: ${PUBLIC_IP:-}
      # Pages beyond the public build and localhost that may use the relay,
      # comma-separated origins, e.g. a main screen opened at this machine's
      # LAN address: http://<lan-address>:5173
      RELAY_APP_ORIGINS: ${RELAY_APP_ORIGINS:-}
      # The station endpoint's port, kept in step with the published `ports:`
      # above and the router forward.
      ENDPOINT_PORT: ${ENDPOINT_PORT:-47100}
      # Set to 1 to let the relay ask your router to open the port above
      # (NAT-PMP, then UPnP) and remove it when it stops. Off by default.
      GONOGO_UPNP: ${GONOGO_UPNP:-}
      # With GONOGO_UPNP=1: the router's address, when the relay cannot find
      # it on its own.
      ROUTER_IP: ${ROUTER_IP:-}
      # This computer's address on the home network: the address the endpoint
      # gives stations on this network, and the one a UPnP router forwards
      # to. The container cannot see it; `pnpm dev` fills it in.
      LAN_IP: ${LAN_IP:-}
      # Axiom log shipping. Empty default → no transport installed
      # (matches the browser pattern). Set in `.env` next to this file
      # to opt in.
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-gonogo}
    restart: unless-stopped
