services:
  # The relay bundles the `/ice-config` endpoint (read by the main screen on
  # boot) and the coturn TURN/STUN server (spawned as a child process).
  # Bundling means one container with one rotated-per-restart secret, no init
  # scripts, no shared volumes: just `podman compose up` and you have a
  # working relay. See packages/relay/src/coturnManager.ts.
  relay:
    build:
      # Repo-root context so pnpm can resolve workspace deps (@ksp-gonogo/logger).
      context: .
      dockerfile: packages/relay/Dockerfile
    ports:
      # Loopback only by default: the main screen's browser on this machine is
      # the relay's one HTTP client, and /ice-config hands out TURN
      # credentials. To let a station on another network fetch them from its
      # link, set RELAY_HTTP_BIND=0.0.0.0 and RELAY_PUBLIC_URL below.
      - "${RELAY_HTTP_BIND:-127.0.0.1}:3002:3002"
      # TURN signalling. UDP is what stations use; TCP is only used when
      # TURN_TCP=1 offers a TCP relay address as well.
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/tcp"
      # TURN relay port range. Every active relay session takes one port
      # in this window, so the whole range must be mappable to the host.
      # Same TURN_MIN_PORT / TURN_MAX_PORT the relay passes to coturn, so
      # widening the window is one pair of env vars rather than a source
      # edit. Sized at 10 ports by default: a relayed station on a
      # single-network device holds 2 of them (one more pair per extra network
      # adapter, such as a VPN), so the window serves up to 5 such players. Consumer routers (Google Wi-Fi etc.) want one
      # port-forward entry per port, so the range stays small.
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49169}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49169}/udp"
    environment:
      PORT: 3002
      # Optional pin for the public IP coturn advertises to clients.
      # When unset (the typical case) the relay auto-discovers it via a
      # public lookup at startup.
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      # Set to 1 on a relay reachable from the internet: coturn then refuses
      # to relay to private, loopback, link-local and CGNAT peers. Leave it
      # unset on a LAN, where those are the peers it serves.
      RELAY_PUBLIC: ${RELAY_PUBLIC:-}
      # Pages beyond the public build and localhost that may use the relay,
      # comma-separated origins, e.g. a main screen opened at this machine's
      # LAN address: http://<lan-address>:5173
      RELAY_APP_ORIGINS: ${RELAY_APP_ORIGINS:-}
      # The address stations on other networks reach port 3002 at, e.g.
      # https://relay.example.com. Setting it puts the relay in the station
      # link and QR once the Add station check passes, and anyone holding the
      # link can then read the time-limited TURN credentials. Empty keeps the
      # relay out of the link.
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-}
      # TURN ports, kept in step with the published `ports:` above. Change
      # them here (or in `.env`) rather than in coturnManager.ts, and widen
      # the router forwards to match.
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49169}
      # Set to 1 to also offer a TCP relay address, for stations on a network
      # that blocks UDP. Doubles the ports each relayed connection holds.
      TURN_TCP: ${TURN_TCP:-}
      # The router's address, when the relay cannot find it to ask it to open
      # the ports above. PORT_MAPPING=0 stops it asking.
      ROUTER_IP: ${ROUTER_IP:-}
      PORT_MAPPING: ${PORT_MAPPING:-}
      # Axiom log shipping. Empty default → no transport installed
      # (matches the browser pattern). Set in `.env` next to this file
      # to opt in.
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-gonogo}
    restart: unless-stopped
