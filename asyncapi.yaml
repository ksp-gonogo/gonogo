        $ref: "#/components/messages/commandResponse.vessel.control.stage"
      commandAccepted:
        $ref: "#/components/messages/commandAccepted"
  vessel.crew:
    address: vessel.crew
    description: |-
      The `vessel.crew` payload: who is aboard the active vessel and how many
      seats it has.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: discrete
