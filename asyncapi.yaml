        $ref: "#/components/messages/commandResponse.vessel.control.setSas"
  vessel.control.setSasMode:
    address: vessel.control.setSasMode
    description: |-
      Takes `SetSasModeArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      `vessel.control.setSasMode`'s arguments: the SAS mode to hold.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.control.setSasMode"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.control.setSasMode"
  vessel.control.setThrottle:
    address: vessel.control.setThrottle
    description: |-
      Takes `SetThrottleArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      `vessel.control.setThrottle`'s arguments: the main throttle setting.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
