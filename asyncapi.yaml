    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.control.setPrecisionControl"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.control.setPrecisionControl"
      commandAccepted:
        $ref: "#/components/messages/commandAccepted"
  vessel.control.setRcs:
    address: vessel.control.setRcs
    description: Turn RCS on or off.
    servers:
