        $ref: "#/components/messages/event"
  vessel.dock:
    address: vessel.dock
    description: |-
      The relative position, velocity and coarse orientation between the active
      vessel's nearest free (undocked) docking port and the targeted docking port,
      for docking-alignment widgets. The whole payload is absent when docking is
      not relevant right now: nothing is targeted, the target is not a docking
      port, or the active vessel has no free port. It is never an old or
      zero-distance placeholder record, the same convention as `VesselTarget`.

      `DockAlignment.forwardDot` is the dot product of the two ports' forward
      (docking-axis) vectors: -1 means the ports face each other head-on (the
      alignment a dock needs), +1 means they point the same way. It is the raw dot
      product, so how to show it (for example as a percentage) is up to the
      widget.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: continuous
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.dock"
      event:
        $ref: "#/components/messages/event"
  vessel.flight:
    address: vessel.flight
    description: |-
      Quantities the game measures, either because they cannot be derived from
      orbital elements (terrain height, aerodynamic state) or because they are the
      measured value to check a prediction against (speeds). One field per
      quantity.

      The channel is absent when there is no active vessel or any of its fields
      could not be read; there is never a `(0,0)` lat/long placeholder. There is
      no mission time field: see `VesselIdentity.launchUt`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: continuous
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.flight"
      event:
        $ref: "#/components/messages/event"
  vessel.identity:
    address: vessel.identity
    description: |-
      Who the active vessel is, what kind of craft it is, and where it is.

      There is no mission time field. `VesselIdentity.launchUt` is fixed after
      liftoff, so mission elapsed time is the current UT (the `meta.validAt` of
      the newest frame) minus `launchUt`, computed by the client.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: discrete
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.identity"
      event:
        $ref: "#/components/messages/event"
  vessel.inventory:
    address: vessel.inventory
    description: |-
      The stock cargo a vessel's parts are carrying: what is aboard, and in which
      part.

      A kerbal's own inventory is not here: it is on `vessel.crew`, beside the
      trait and experience level that decide whether that kerbal can do a job.
      This channel lists only part-hosted stores.

      Each store is reported with its part rather than as one vessel total,
      because a craft can carry plenty of something while the kerbal who needs it
      has none. A kerbal has two slots, 40 units of volume and a 65 kg limit, and
      one slot holds a parachute by default; a cargo container holds far more.

      Stock KSP, with or without any Uplink: stock repairs consume stock cargo, so
      a stock career has inventories worth showing.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: discrete
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.inventory"
      event:
        $ref: "#/components/messages/event"
  vessel.invokePartAction:
    address: vessel.invokePartAction
    description: |-
      Fire one button of one part's right-click Part Action Window, the
      remote-control equivalent of the player clicking it in-game.

      It acts on a part aboard the craft, so it waits on the signal delay, like
      `vessel.control.*` and the robotics commands.

      It has no state field, unlike the other actuation commands (see
      `ServoSetEnabledArgs`). KSP models these as buttons with no settable value,
      and the button's own label is what changes ("Deploy" becomes "Retract").
      Read the result back from `vessel.partActions.<flightId>`, which reports the
      new set of buttons one signal delay later.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.invokePartAction"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.invokePartAction"
      commandAccepted:
        $ref: "#/components/messages/commandAccepted"
  vessel.landing:
    address: vessel.landing
    description: |-
      Landing data for the active vessel that needs the terrain map of the body
      below (slope, roughness and elevation at the touchdown site), plus an
      atmosphere-aware descent estimate built from the vessel's measured drag. The
      vacuum ballistic figures (which need no terrain) are not here; a client
      solves those itself.

      The whole payload is absent unless the vessel is descending toward a solid
      surface: the body must have a solid surface and terrain, and the vessel must
      be descending towards it within the prediction horizon. So it never carries
      a leftover reading from orbit, or a 0 from a body with no terrain.

      Every field is nullable, and null means that input is unavailable this tick
      (no terrain fit, not in an atmosphere, and so on), never an unverified 0.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: continuous
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.landing"
      event:
        $ref: "#/components/messages/event"
  vessel.light:
    address: vessel.light
    description: |-
      Whether the active craft is in sunlight now, and the next two instants at
      which that changes, for a widget that warps to sunrise or sunset or plans
      around a night pass.

      The star counts as hidden when a body between it and the craft covers its
      centre. A craft in orbit is swept along its patched conic; a landed or
      splashed craft is carried round by its body's rotation. The instants are
      universal times, so they hold wherever they are read and need no reckoning
      between samples.

      Whenever no sound answer exists (an open orbit, an orbit of the star itself,
      no body table yet) the payload is absent or its instants are null with
      `VesselLight.basis` saying `withheld`, never a guess.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: discrete
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.light"
      event:
        $ref: "#/components/messages/event"
  vessel.maneuver:
    address: vessel.maneuver
    description: |-
      The active vessel's planned burns. `VesselManeuver.nodes` is always an
      array, empty when no burn is queued, never null.

      `VesselManeuver.nodes` is ordered by execution, earliest `ManeuverNode.ut`
      first, and that order is the plan: burn N is flown after burn N-1 and acts
      on what burn N-1 left behind. There is no ordinal or predecessor field;
      array position says it. The per-burn patch chain expresses the same linkage
      again, in a form only a patched-conic planner can produce; see
      `ManeuverNode.patches`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: discrete
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.maneuver"
      event:
        $ref: "#/components/messages/event"
  vessel.maneuver.add:
    address: vessel.maneuver.add
    description: |-
      Add a manoeuvre node. Takes a new manoeuvre node's time and its delta-v as
      named components in the node's own prograde, normal and radial-out frame,
      the same shape as `ManeuverNode`.

      The result is a `CommandResult<string>` whose `Payload` is the new node's
      opaque id, the same id `ManeuverNode.id` carries on `vessel.maneuver`. A
      client will not send the command if it would arrive at the craft at or after
      `AddManeuverNodeArgs.ut`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.maneuver.add"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.maneuver.add"
      commandAccepted:
        $ref: "#/components/messages/commandAccepted"
  vessel.maneuver.remove:
    address: vessel.maneuver.remove
    description: Delete a manoeuvre node. Takes the manoeuvre node to delete.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.maneuver.remove"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.maneuver.remove"
      commandAccepted:
        $ref: "#/components/messages/commandAccepted"
  vessel.maneuver.update:
    address: vessel.maneuver.update
    description: |-
      Replace an existing node's time and delta-v. The node is named by its opaque
      `UpdateManeuverNodeArgs.nodeId`, never a positional index, so adding or
      removing another node never changes which node an update reaches. A client
      will not send the command if it would arrive at the craft at or after
      `UpdateManeuverNodeArgs.ut`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.maneuver.update"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.maneuver.update"
      commandAccepted:
        $ref: "#/components/messages/commandAccepted"
  vessel.orbit:
    address: vessel.orbit
    description: |-
      The active vessel's orbital elements. Elements are the cause; every
      kinematic quantity (position, velocity, apsides, anomalies, period) is
      derived by the consumer at its view UT through the propagation capability,
      and is not streamed here. The one exception is the pair of apsis countdowns
      under physics, `VesselOrbit.timeToAp` and `VesselOrbit.timeToPe`.

      The apoapsis and periapsis altitudes are on the current patch,
      `patches[0].apA` and `patches[0].peA`, in metres above the body's mean
      radius.

      Units: `VesselOrbit.sma` in metres; `VesselOrbit.inc`, `VesselOrbit.lan` and
      `VesselOrbit.argPe` in degrees; and `VesselOrbit.meanAnomalyAtEpoch` in
      radians. The degrees/radians split is KSP's own and is kept so every value
      matches KSP's `Orbit`.

      A coast moves only `VesselOrbit.meanAnomalyAtEpoch` and `VesselOrbit.epoch`,
      by Kepler propagation; the other elements are constants of the orbit. A burn
      moves every element, by powered integration from `vessel.propulsion`, the
      firing stage's propellant in `dv.stages` and `trackingStation.bodies`. A
      reckoning's `modelled` list says which paths its model moved, and a consumer
      wanting a whole modelled orbit overlays those on the observed payload.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: continuous
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.orbit"
      event:
        $ref: "#/components/messages/event"
  vessel.orbit.truth:
    address: vessel.orbit.truth
    description: |-
      KSP's own maintained state vector for the active vessel (`Orbit.pos` and
      `Orbit.vel`), relative to the body it orbits. Read `vessel.orbit` for
      altitude and velocity.

      Absent when the state vector or the frame flag could not be read.

      `VesselOrbitTruth.frameRotating` says which frame the vectors are in, and a
      comparison must gate on it. When it is false they are in the fixed,
      non-rotating frame the orbital elements are defined against, and are
      directly comparable to a Kepler propagation of those elements. When it is
      true (KSP switches to this below a body's `inverseRotThresholdAltitude`: low
      orbit, atmospheric flight, landed) they are in a frame co-rotating with the
      body's spin, and differ from a fixed-frame propagation by a rotation about
      the polar axis that grows with time.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: continuous
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.orbit.truth"
      event:
        $ref: "#/components/messages/event"
  vessel.parts:
    address: vessel.parts
    description: |-
      The active vessel's full part tree, with each part's position, mass,
      temperatures, resources, module states and action-group bindings. A single
      object, or `null` when there is no active vessel.

      Per-part temperatures ride each `VesselPart` (`VesselPart.currentTemp`,
      `VesselPart.maxTemp`, `VesselPart.skinTemp`, `VesselPart.skinMaxTemp`), so a
      hottest-part, engine or heat-shield rollup can be derived from this channel.
      `vessel.thermal` carries a ready-made hottest-part rollup.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: discrete
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.parts"
      event:
        $ref: "#/components/messages/event"
  vessel.physics.mode:
    address: vessel.physics.mode
    description: |-
      The active vessel's physics regime (`PhysicsMode`). Delayed like every other
      vessel-derived channel: it describes the vessel itself, so the ground learns
      about it at UT+delay, not as a ground-side fact. Absent when there is no
      active vessel.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: discrete
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.physics.mode"
      event:
        $ref: "#/components/messages/event"
  vessel.propulsion:
    address: vessel.propulsion
    description: |-
      The active vessel's mass and thrust, the inputs to thrust-to-weight and
      burn-time figures. Mass is in tonnes and thrust in kN, so `thrust / (mass ·
      g)` is a thrust-to-weight ratio directly.

      TWR, maximum TWR and a vessel-level burn-time estimate are derived by the
      client from these fields, and are not streamed here.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: continuous
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.propulsion"
      event:
        $ref: "#/components/messages/event"
  vessel.resources:
    address: vessel.resources
    description: |-
      What the active vessel carries, keyed by resource name, each with its
      current amount and capacity. Every message holds the whole map. No value is
      ever a sentinel such as `-1`.

      Only these stock resources are reported: `LiquidFuel`, `Oxidizer`,
      `SolidFuel`, `MonoPropellant`, `ElectricCharge`, `XenonGas`, `Ore` and
      `Ablator`.

      **Absence.**

      - **Key absent** from `VesselResources.resources`: structural: this vessel
        does not carry the resource at all (its capacity is zero). Changes only on
        staging/docking.
      - **Key present, `{current: 0, max: > 0}`**, carried but currently empty (a
        real, meaningful reading, not an error).
      - **Whole channel absent**: no vessel at all, the same convention as every
        other `vessel.*` channel.

      Because every emission is the full map (the channel carries the whole map,
      never a delta), a key disappearing between two emissions is itself a real
      structural statement (the vessel stopped carrying that resource, e.g. a tank
      was staged away), never an ambiguous "did it change or did the stream just
      drop it".

      Carries amounts only, no flow or rate: a vessel-total flow would be a number
      that is not the game's own.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: continuous
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.resources"
      event:
        $ref: "#/components/messages/event"
  vessel.structure:
    address: vessel.structure
    description: |-
      The active vessel's stage and part counts. Absent when there is no active
      vessel.

      `VesselStructure.currentStage` uses KSP's own staging numbering unchanged,
      which runs inverted relative to the staging list as drawn: this contract
      does not renumber it. The part tree itself is on `vessel.parts`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: discrete
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.structure"
      event:
        $ref: "#/components/messages/event"
  vessel.surface:
    address: vessel.surface
    description: |-
      Surface data a landing widget needs that `vessel.flight` doesn't already
      carry. `vessel.flight.AltitudeTerrain` is the height of the vessel's root
      part above the terrain; `VesselSurface.heightFromTerrain` is the height of
      the vessel's lowest point, the number a landing-gear or suicide-burn readout
      cares about. The two differ by how far the vessel reaches below its root.

      Whole-channel absence means the vessel has no reference body yet. The
      channel is present in every situation, orbiting included.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: continuous
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.surface"
      event:
        $ref: "#/components/messages/event"
  vessel.target:
    address: vessel.target
    description: |-
      The active vessel's current target only.
      `VesselTarget.relativePosition`/`VesselTarget.relativeVelocity` both use the
      one `Vec3` shape.

      `VesselTarget.orbit` reuses `VesselOrbit` itself (not a separate "target
      orbit" shape), so a client propagates a target the same way as the active
      vessel, at the same time. Its nested `VesselTarget.meta` is stamped with the
      same subject (the active vessel producing this sample), not the target's;
      `VesselTarget.vesselId` and `VesselTarget.bodyIndex` carry the target's own
      identity.

      A null payload means nothing is targeted, the common case, never a
      zero-distance or zero-vector record.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: continuous
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.target"
      event:
        $ref: "#/components/messages/event"
  vessel.target.clear:
    address: vessel.target.clear
    description: Clear the active vessel's target.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.target.clear"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.target.clear"
      commandAccepted:
        $ref: "#/components/messages/commandAccepted"
  vessel.target.set:
    address: vessel.target.set
    description: |-
      Set the active vessel's target. Takes a discriminated union, written as
      `SetTargetArgs.kind` plus the fields that kind uses.
      `SetTargetArgs.vesselId` is the stable vessel id, never an array index, and
      a vessel id and a body index travel in separate fields so they cannot be
      confused.

      A request missing a field its kind needs, or with `TargetKind.Other`, fails
      with `CommandErrorCode.NotFound`, as does a well-formed request that matches
      no live vessel, part, body or position.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.target.set"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.target.set"
      commandAccepted:
        $ref: "#/components/messages/commandAccepted"
  vessel.thermal:
    address: vessel.thermal
    description: |-
      The active vessel's thermal rollup, its hottest part, heat shield and
      engine. Each ratio is null when no part had a valid maximum temperature this
      tick, never 0, so "no valid part" and "coldest possible part" stay distinct.

      The whole payload is null when the vessel has no parts at all, a different,
      coarser absence than an individual null ratio. For every part's temperatures
      rather than a rollup, see `vessel.parts`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-sample-kind: continuous
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.thermal"
      event:
        $ref: "#/components/messages/event"
