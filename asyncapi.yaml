components:
  correlationIds:
    requestId:
      description: "A dispatch and its answer are correlated on `requestId`, never on order: responses may arrive out of the order the requests were sent, and a delayed command's answer can be minutes behind it."
      location: $message.payload#/requestId
  messages:
    commandRequest.alarm.scet.arm:
      name: command-request
      title: Dispatch alarm.scet.arm
      contentType: application/json
      correlationId:
