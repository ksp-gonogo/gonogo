      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.control.setLights"
      commandAccepted:
        $ref: "#/components/messages/commandAccepted"
  vessel.control.setPrecisionControl:
    address: vessel.control.setPrecisionControl
    description: Turn precision control (fine control) on or off.
    servers:
