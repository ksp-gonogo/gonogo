        state:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's `Contract.State` enum name, e.g. `"Active"`, `"Offered"` or
            `"Completed"`.
        fundsAdvance:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
