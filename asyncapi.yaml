    address: vessel.control.setThrottle
    description: |-
      Takes `SetThrottleArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      The contract carries no doc comment for `vessel.control.setThrottle`'s args type. Add a `<summary>` to the C# and it will appear here.
    servers:
