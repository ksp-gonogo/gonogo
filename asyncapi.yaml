        stateOrdinal:
          description: |-
            `CareerContractParameter.state`'s KSP ordinal, typed to `KspParameterState`.
            Branch on this rather than on the spelling of
            `CareerContractParameter.state`: matching a label means an unrecognised
            spelling reads as outstanding, and a contract-parameter alarm set on
            "Complete" never fires.

            `null` when the capture carried no state, which is a third value and must
            not be read as either complete or incomplete.
          anyOf:
            - $ref: "#/components/schemas/KspParameterState"
              x-sitrep-unit: enum
            - type: "null"
        minAltitude:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Lower bound of the altitude band this objective requires, from the stock
            `ReachAltitudeEnvelope` it is or contains (a part test nests its envelope
            under itself). `null` when it carries none.
        maxAltitude:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Upper bound of that same band, `null` exactly when
            `CareerContractParameter.minAltitude` is.
    CareerContracts:
      type: object
      description: |-
        Contracts sub-group of `CareerStatus`. All three lists are always present
        (empty, never null).
      required:
        - active
        - offered
        - completedRecent
        - failedRecent
      properties:
        active:
          type: array
          items:
            $ref: "#/components/schemas/CareerContract"
          description: |-
            Contracts the career has accepted and not yet finished
            (`Contract.State.Active`).
        offered:
          type: array
          items:
            $ref: "#/components/schemas/CareerContract"
          description: Contracts on offer and not yet accepted (`Contract.State.Offered`).
        completedRecent:
          type: array
          items:
            $ref: "#/components/schemas/CareerContract"
          description: |-
            The most recently completed contracts, at most 10: `State.Completed`
            contracts from `ContractSystem.Instance.ContractsFinished`, sorted
            newest-first by `Contract.DateFinished`. Failed, expired, cancelled and
            withdrawn contracts are not included. Same `CareerContract` element shape as
            `CareerContracts.active` / `CareerContracts.offered`: no extra fields;
            `State` is always `"Completed"` here.
        failedRecent:
          type: array
          items:
            $ref: "#/components/schemas/CareerContract"
          description: |-
            The most recently failed contracts, at most 10: `State.Failed` contracts
            from `ContractSystem.Instance.ContractsFinished`, sorted newest-first by
            `Contract.DateFinished`. Same `CareerContract` element shape as
            `CareerContracts.active`; `State` is always `"Failed"` here. A contract
            fails in the same stock call as the objective that failed it, so this is
            where that objective's final state is read.
    CareerFacilities:
      type: object
      description: |-
        The space centre's buildings, each with the level it stands at and the full
        run of levels it can be upgraded through (its tier count and what each
        upgrade costs).

        **When it arrives.** A facility's tier count and prices are readable from
        the building objects, which KSP registers at the space centre, in the editor
        and in flight. The tracking station reads the tier the save holds against
        the ladder last read in one of those scenes. Where no ladder has been read
        there is no reading to take, so this channel goes silent rather than
        reporting a row of nulls. The last reading stands, dated, and the client
        marks it as held.

        A tier count does not change during a save, so a ladder held from an earlier
        scene is still true. The tier standing on it can move, and does when the
        player buys an upgrade, so both travel together and are dated together
        rather than one being trusted further than the other.
      properties:
        facilities:
          type:
            - object
            - "null"
          additionalProperties:
            $ref: "#/components/schemas/CareerFacility"
          description: |-
            A map keyed by `SpaceCenterFacility` name (e.g. `"LaunchPad"`,
            `"VehicleAssemblyBuilding"`), not a fixed record, so enumerate the keys
            rather than reaching for one you expect to be there. A facility the game
            cannot report is left out of the map. Never empty on the wire: the channel
            is absent instead.
    CareerFacility:
      type: object
      description: |-
        One facility entry in `CareerFacilities.facilities`. A facility the game
        cannot currently report is left out of the map rather than sent with null
        fields, so an entry that is present always carries
        `CareerFacility.currentTier` and `CareerFacility.maxTier`.
      properties:
        facilityOrdinal:
          description: |-
            Which facility this entry is, as KSP's `SpaceCenterFacility` ordinal, typed
            to `KspSpaceCenterFacility`.

            `CareerFacilities.facilities` is keyed by the enum name. The identity is
            also inside the entry, so a client can identify the facility without
            recognising the key it arrived under.

            `null` when no ordinal was reported.
          anyOf:
            - $ref: "#/components/schemas/KspSpaceCenterFacility"
              x-sitrep-unit: enum
            - type: "null"
        currentTier:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            The tier the facility stands at, KSP's zero-based
            `UpgradeableFacility.FacilityLevel`: `0` is the first tier. Away from a
            scene that registers the building, this is the tier the save holds, read
            against the ladder last seen.
        maxTier:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            The highest tier this facility can reach, KSP's zero-based
            `UpgradeableFacility.MaxLevel`. The facility is fully upgraded when
            `CareerFacility.currentTier` equals it, and it has `MaxTier + 1` tiers.
        upgradeCost:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            The price of upgrading to the next tier, as KSP's
            `UpgradeableFacility.GetUpgradeCost` prices it (the save's funds difficulty
            multiplier applied). `null` at the top tier, where there is no upgrade to
            price, and when it could not be read.
    CareerMode:
      type: object
      description: |-
        The active save's `GameMode`, as `{ "mode": <int> }`. The whole payload is
        `null` when no game is loaded (main menu, no save). Once a save is loaded
        the mode is always one of the four `GameMode` members.
      required:
        - mode
      properties:
        mode:
          description: The active save's mode, as its integer ordinal.
          allOf:
            - $ref: "#/components/schemas/GameMode"
              x-sitrep-unit: enum
    CareerStatus:
      type: object
      description: |-
        The KSC and career-mode snapshot, in four groups (balances, contracts,
        strategies, tech). The space centre's buildings are not here: they are on
        `CareerFacilities`, which can be held on its own while this channel keeps
        arriving.

        **Three states.** The whole payload is `null` in a sandbox save, where there
        is no career at all. A non-null payload with a sub-group `null` means career
        mode is running and that group is unavailable this tick. All four group keys
        are always present, each nullable, never omitted, so a missing key is a
        protocol error rather than an absent group.

        Every number is nullable and `null` is never a sentinel: a field is `null`
        whenever the raw value is absent or non-finite. The two counts
        (`CareerStrategies.activeCount`, `CareerTech.unlockedCount`) are the only
        non-nullable numbers, because an empty list counts as zero rather than as
        unknown.
      required:
        - meta
      properties:
        balances:
          description: |-
            The career's balances (funds, reputation, science). `null` when none of the
            three could be read this tick.
          anyOf:
            - $ref: "#/components/schemas/CareerBalances"
            - type: "null"
        contracts:
          description: |-
            Active, offered and recently completed contracts. `null` when KSP's contract
            system is not loaded this tick.
          anyOf:
            - $ref: "#/components/schemas/CareerContracts"
            - type: "null"
        strategies:
          description: |-
            The save's strategy roster and which strategies are active. `null` when
            KSP's strategy system is not loaded this tick.
          anyOf:
            - $ref: "#/components/schemas/CareerStrategies"
            - type: "null"
        tech:
          description: |-
            The tech tree and which of it is unlocked. `null` when R&D or the part list
            is not loaded this tick.
          anyOf:
            - $ref: "#/components/schemas/CareerTech"
            - type: "null"
        meta:
          description: |-
            Provenance, and always `"game"`: a career belongs to the save, not to
            anything flying, so switching vessels cannot change which one is being read.

            A SCET alarm compares this stamp against the subject the alarm was set for,
            and refuses a reading that does not match. `"game"` is the same token
            `ScetAlarm.subject` carries for anything the whole simulation shares.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    CareerStrategies:
      type: object
      description: |-
        Strategies sub-group of `CareerStatus`. Both lists are always present
        (empty, never null).
      required:
        - active
        - all
        - activeCount
      properties:
        active:
          type: array
          items:
            $ref: "#/components/schemas/CareerStrategy"
          description: |-
            The strategies currently active, in the same entry shape as
            `CareerStrategies.all`. Not filtered against the Administration Building's
            cap, so a save that carries more active strategies than its building allows
            shows all of them.
        all:
          type: array
          items:
            $ref: "#/components/schemas/CareerStrategy"
          description: Every strategy the save knows about, active or not.
        activeCount:
          type: number
          x-sitrep-unit: count
          description: |-
            How many strategies are active. Never null: it is the length of
            `CareerStrategies.active` when the raw count is absent.
        activationPatched:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether another mod replaces or alters KSP's own strategy activation: `true`
            when it does, `false` when the game's activation is its own, `null` when
            that could not be established.

            With the Administration Building shut, `career.strategy.activate` commits a
            strategy only when this is `false`, and refuses otherwise: a mod that
            changes activation owns the procedure, and offers its own command for it.
            With the building open the game activates as it always does, whatever this
            says.
    CareerStrategy:
      type: object
      description: One strategy in `CareerStrategies.active` / `CareerStrategies.all`.
      properties:
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The strategy's internal config name, KSP's `StrategyConfig.Name` (e.g.
            `"OutsourceRnDStrategy"`): stable across a save, and the id
            `ActivateStrategyArgs.strategyId` takes.
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The strategy's display title, KSP's Strategy.Title.
        description:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The strategy's description text, KSP's Strategy.Description.
        department:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The name of the Administration department the strategy belongs to, KSP's
            Strategy.DepartmentName.
        isActive:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the strategy is active, KSP's Strategy.IsActive.
        factor:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            The strategy's commitment level, KSP's Strategy.Factor: the position of its
            commitment slider as a 0..1 fraction.
        dateActivated:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the strategy was activated, KSP's Strategy.DateActivated. Meaningful
            only while `CareerStrategy.isActive` is `true`.
        requiredReputation:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: |-
            The reputation the career needs before the strategy can be activated, KSP's
            Strategy.RequiredReputation.
        initialCostFunds:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: The funds charged on activation, KSP's Strategy.InitialCostFunds.
        initialCostScience:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: The science charged on activation, KSP's Strategy.InitialCostScience.
        initialCostReputation:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: The reputation charged on activation, KSP's Strategy.InitialCostReputation.
        requiredReputationMin:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: |-
            The reputation the career needs before the strategy can be activated at the
            lowest commitment, KSP's Strategy.RequiredReputationMin. At a commitment
            `CareerStrategy.factor` f the figure is requiredReputationMin plus f times
            (requiredReputationMax minus requiredReputationMin), f held to 0..1, as
            KSP's Strategy.FactorLerp computes it.
        requiredReputationMax:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: |-
            The reputation the career needs before the strategy can be activated at the
            highest commitment, KSP's Strategy.RequiredReputationMax. At a commitment
            `CareerStrategy.factor` f the figure is requiredReputationMin plus f times
            (requiredReputationMax minus requiredReputationMin), f held to 0..1, as
            KSP's Strategy.FactorLerp computes it.
        initialCostFundsMin:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            The funds charged on activation at the lowest commitment, KSP's
            Strategy.InitialCostFundsMin. At a commitment `CareerStrategy.factor` f the
            figure is initialCostFundsMin plus f times (initialCostFundsMax minus
            initialCostFundsMin), f held to 0..1, as KSP's Strategy.FactorLerp computes
            it.
        initialCostFundsMax:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            The funds charged on activation at the highest commitment, KSP's
            Strategy.InitialCostFundsMax. At a commitment `CareerStrategy.factor` f the
            figure is initialCostFundsMin plus f times (initialCostFundsMax minus
            initialCostFundsMin), f held to 0..1, as KSP's Strategy.FactorLerp computes
            it.
        initialCostScienceMin:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            The science charged on activation at the lowest commitment, KSP's
            Strategy.InitialCostScienceMin. At a commitment `CareerStrategy.factor` f
            the figure is initialCostScienceMin plus f times (initialCostScienceMax
            minus initialCostScienceMin), f held to 0..1, as KSP's Strategy.FactorLerp
            computes it.
        initialCostScienceMax:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            The science charged on activation at the highest commitment, KSP's
            Strategy.InitialCostScienceMax. At a commitment `CareerStrategy.factor` f
            the figure is initialCostScienceMin plus f times (initialCostScienceMax
            minus initialCostScienceMin), f held to 0..1, as KSP's Strategy.FactorLerp
            computes it.
        initialCostReputationMin:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: |-
            The reputation charged on activation at the lowest commitment, KSP's
            Strategy.InitialCostReputationMin. At a commitment `CareerStrategy.factor` f
            the figure is initialCostReputationMin plus f times
            (initialCostReputationMax minus initialCostReputationMin), f held to 0..1,
            as KSP's Strategy.FactorLerp computes it.
        initialCostReputationMax:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: |-
            The reputation charged on activation at the highest commitment, KSP's
            Strategy.InitialCostReputationMax. At a commitment `CareerStrategy.factor` f
            the figure is initialCostReputationMin plus f times
            (initialCostReputationMax minus initialCostReputationMin), f held to 0..1,
            as KSP's Strategy.FactorLerp computes it.
        hasFactorSlider:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the strategy offers a commitment slider, so that
            `CareerStrategy.factor` can be chosen, KSP's Strategy.HasFactorSlider.
        factorSliderDefault:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            The 0..1 position the game starts the commitment slider at, KSP's
            Strategy.FactorSliderDefault.
        factorSliderSteps:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            How many discrete positions the commitment slider has, KSP's
            Strategy.FactorSliderSteps.
        canActivate:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether KSP would allow this strategy to be committed to right now. `null`
            means the question could not be put at all, which is not a refusal:
            `CareerStrategy.activateBlockedReason` then says why no check could run
            rather than naming a rule the strategy broke.
        activateBlockedReason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's own wording for the rule that refused, or an installed career mod's
            wording for a rule of its own, or an account of why the question could not
            be put when `CareerStrategy.canActivate` is `null`. Empty when activation is
            allowed.
        activateVerdictSource:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Which route produced `CareerStrategy.canActivate`: `"screened"` when KSP's
            own check ran, `"derived"` when the same rules were checked one at a time
            because the Administration Building was shut, or when the strategy is
            already active, and `"none"` when there is no verdict to carry.

            `"derived"` always accompanies a refusal and never a yes. The game stops at
            its first refusal, so a rule that refuses off-screen would have refused on
            it; but one rule counts the career's running strategies on that screen and
            cannot be checked anywhere else, and permission needs every rule to pass. A
            strategy no rule refused therefore arrives with no verdict and `"none"`
            rather than as allowed.

            Never enable an activation control from a `"derived"` verdict: it can only
            refuse. Whether a strategy without a verdict may be committed is decided by
            `career.strategy.activate` itself, which runs every check again at the
            moment it executes and refuses in the game's words or as unreadable rather
            than guessing.
        canDeactivate:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether KSP would allow this strategy to be ended right now, KSP's
            Strategy.CanBeDeactivated. `false` with a reason beginning `"eligibility
            check failed: "` when the check itself threw.
        deactivateBlockedReason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's own wording for why the strategy cannot be ended, or the failed check
            described in `CareerStrategy.canDeactivate`. Empty or `null` when
            deactivation is allowed.
        effect:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: KSP's text describing what the strategy does while active, Strategy.Effect.
    CareerTech:
      type: object
      description: |-
        Tech sub-group of `CareerStatus`. Both lists are always present (empty,
        never null).
      required:
        - unlockedCount
        - unlockedIds
        - nodes
      properties:
        unlockedCount:
          type: number
          x-sitrep-unit: count
          description: |-
            How many distinct tech nodes are unlocked. Never null: it is the length of
            `CareerTech.unlockedIds` when the raw count is absent.
        unlockedIds:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: |-
            The ids of the unlocked tech nodes, in no particular order. Derived from the
            loaded parts (each part's `TechRequired` whose tech is available), so a node
            that unlocks no part never appears here even when it is researched;
            `CareerTechNode.unlocked` is the per-node reading.
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/CareerTechNode"
          description: |-
            Every node of the tech tree the save is playing, including a tree a mod has
            replaced. Empty when the tree is not loaded yet.
    CareerTechNode:
      type: object
      description: One node in `CareerTech.nodes`.
      required:
        - parents
      properties:
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The node's tech id, KSP's `techID` (e.g. `"basicRocketry"`).
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The node's display title, from `ResearchAndDevelopment.GetTechnologyTitle`.
        description:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The node's flavour line, as the tech tree itself writes it ("How hard can
            Rocket Science be anyway?").

            It comes from the tree's own config rather than from `RDTech`, whose
            `description` field only exists while the R&D Building scene is open. A tech
            tree a mod has replaced is read the same way, so this is the node's
            description in whatever tree the save is playing.
        scienceCost:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: The science it costs to research the node, from the tree's config.
        unlocked:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the node is researched in this save
            (`ResearchAndDevelopment.GetTechnologyState` is `Available`).
        parents:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: |-
            The tech ids of the node's prerequisites, from the tree's parent edges.
            Empty for a root node. Whether a locked node is researchable is left to the
            client, from these edges and each parent's `CareerTechNode.unlocked`.
    CatalogContact:
      type: integer
      description: |-
        Whether the command centre a catalog belongs to is in contact with a craft,
        as that centre knows it, for `CatalogEntry.contact`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: InContact
          description: The newest word to reach the centre says a link reaches it from the craft.
        - const: 1
          title: Silent
          description: |-
            No link reaches the centre, and the ground's expected return, if it has one,
            has not yet passed by more than its allowance.
        - const: 2
          title: Overdue
          description: |-
            No link reaches the centre, and the expected return, allowance included, has
            passed.
        - const: 3
          title: Lost
          description: |-
            The home centre has declared the craft lost, and the declaration has reached
            this centre.
        - const: 4
          title: Gone
          description: |-
            The centre knows the craft is gone, from its last frame over a link or from
            seeing it go.
    CatalogCrew:
      type: integer
      description: |-
        What a command centre knows of a craft's crew, which only a link can tell
        it.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Known
          description: |-
            The centre is in contact with the craft, so its crew is as the craft last
            reported it.
        - const: 1
          title: Unknown
          description: |-
            No link reaches the centre, so the crew it lists is the crew it last heard
            of, which may have changed since.
        - const: 2
          title: PresumedLost
          description: |-
            The home centre has declared the craft lost and the declaration has reached
            this centre, or the centre saw the craft destroyed with no link to say more,
            so its crew is presumed lost with it.
        - const: 3
          title: Lost
          description: |-
            The craft's last report over a link says it was destroyed with its crew
            aboard.
    CatalogEnd:
      type: integer
      description: How a craft that has ended left the game, for `CatalogEntry.endKind`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Destroyed
          description: The craft was destroyed.
        - const: 1
          title: Terminated
          description: |-
            The player ended the craft from the Tracking Station. Its crew went with it
            and no reputation was charged.
    CatalogEntry:
      type: object
      description: |-
        One object in a `TrackingStationCatalog`: a craft, or a space object the
        tracking station follows. An object with no resolvable stable id is left out
        rather than given a made-up one, so `CatalogEntry.vesselId` is always
        present.
      required:
        - vesselId
        - name
        - vesselType
        - situation
      properties:
        vesselId:
          type: string
          x-sitrep-unit: id
          description: |-
            Stable subject id (KSP vessel GUID). Always present, entries without one are
            dropped.
        name:
          type: string
          x-sitrep-unit: text
          description: Display name; defaults to the empty string, never null.
        vesselType:
          description: Vessel type, as the numeric value of `VesselType`.
          allOf:
            - $ref: "#/components/schemas/VesselType"
              x-sitrep-unit: enum
        situation:
          description: Flight situation, as the numeric value of `Situation`.
          allOf:
            - $ref: "#/components/schemas/Situation"
              x-sitrep-unit: enum
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index of this vessel's main body among the bodies `trackingStation.bodies`
            lists; null when absent or unresolved.
        landedAt:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The named launch or landing site the vessel is at, as a player would read it
            (for example "Runway" or "Woomerang Launch Site"). Null when it is on the
            ground somewhere with no named site, and null when it is not on the ground
            at all: an airborne or orbiting vessel has no site.
        latitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Body-fixed surface latitude in degrees while the vessel is landed, splashed
            or pre-launch. Null for a vessel in flight or in orbit, since the point
            beneath it sweeps at orbital rate and is not where it is. Null together with
            `CatalogEntry.longitude`.
        longitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Body-fixed surface longitude in degrees, wrapped to (-180, 180]. Null
            exactly when `CatalogEntry.latitude` is.
        crewCount:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Kerbals aboard right now, read from the loaded vessel when it is loaded and
            from its saved state otherwise, so an unloaded background vessel still
            reports a real count. 0 is an uncrewed vessel; null means only that the read
            failed.
        crewCapacity:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Seat capacity, read the same way as `CatalogEntry.crewCount`. Null only if
            the read failed.
        commsConnected:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether this vessel has a live control link home, as the receiving centre
            has heard it: an outage shows one of the centre's signal delays after the
            vessel's last light, and its return when its light arrives again. Read for
            every roster vessel, loaded or not. This is stock CommNet's reading
            (`Vessel.connection.IsConnected`), not the active vessel's `comms.*`
            channels, which a comms mod may provide.

            Null means unknown, not "no link". Three causes: the vessel's own link
            report has not reached this centre yet; rarely, a scene transition; and
            always, for the `Debris`, `SpaceObject` (asteroids and comets) and `Unknown`
            vessel types, which CommNet never gives a connection
            (`CommNet.CommNetVessel.OnStart`). A debris or asteroid entry carries null
            here on every sample.
        commsControlSource:
          description: |-
            The same connection's control level. Null under the same condition as
            `CatalogEntry.commsConnected`, including the permanent Debris, SpaceObject
            and Unknown vessel-type case described there.
          anyOf:
            - $ref: "#/components/schemas/RosterCommsControlSource"
              x-sitrep-unit: enum
            - type: "null"
        orbit:
          description: |-
            This vessel's own orbital elements, the same shape as `BodyEntry.orbit`,
            about the body at `CatalogEntry.bodyIndex`. This is what positions a roster
            vessel: there is no separate position field, so derive its position from
            this orbit, joined by `CatalogEntry.vesselId`. Null when the vessel has no
            orbit yet (during a scene transition), never a sentinel.
          anyOf:
            - $ref: "#/components/schemas/OrbitEntry"
            - type: "null"
        placeSource:
          description: |-
            How the centre this list belongs to last learned where the vessel is: heard
            over a link, or seen. The place is whichever of the two is newer. A vessel
            can be seen while no link reaches it, so a seen place says nothing about its
            crew or its link. Null where the producer does not say.
          anyOf:
            - $ref: "#/components/schemas/RosterPlaceSource"
              x-sitrep-unit: enum
            - type: "null"
        placeAsOfUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time the place this entry gives was true at: when the vessel
            said it, or when the light the centre saw it by left it. Null exactly when
            `CatalogEntry.placeSource` is.
        contact:
          description: |-
            Whether this centre is in contact with the craft, as this centre knows it.
            Null where no word of any route to the craft has ever reached this centre,
            which is always the case for an object with no radio.

            This is the field that answers "is this centre in contact": `InContact`
            means the craft's signal reaches this centre now.
            `CatalogEntry.commsConnected` answers a different question, whether the
            craft has a control link home at all, which it can have while this centre is
            out of its reach.
          anyOf:
            - $ref: "#/components/schemas/CatalogContact"
              x-sitrep-unit: enum
            - type: "null"
        lastContactUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time this centre last knows it had a link to the craft: now,
            while in contact. Null when it knows of none.
        expectedReturnUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time this centre expects to hear the silent craft again: when
            the ground predicts a link will reopen, plus the light-time from the craft
            to this centre. Null while in contact, when the ground has no prediction,
            and at a crewed centre, whose own line to the craft the ground's geometry
            does not predict.
        overdueAfterUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time past which the craft is overdue at this centre:
            `CatalogEntry.expectedReturnUt` and the allowance the ground gives a late
            return. Null exactly when `CatalogEntry.expectedReturnUt` is.
        declaredLostUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time the home centre declared the craft lost, once that
            declaration has reached this centre. Kept after a declaration is withdrawn,
            beside a `CatalogEntry.contact` that is no longer `CatalogContact.Lost`.
            Null when no declaration has reached this centre.
        crew:
          description: |-
            What this centre knows of the craft's crew: `CatalogEntry.crewCount` is as
            of `CatalogEntry.lastContactUt`, and is known only while the centre is in
            contact. For a destroyed craft it is lost when the centre heard the end over
            a link and presumed lost when it only saw it. Null when the crew this centre
            last heard of is none or unread, and when no word of any route to the craft
            has reached it.
          anyOf:
            - $ref: "#/components/schemas/CatalogCrew"
              x-sitrep-unit: enum
            - type: "null"
        endSource:
          description: |-
            How this centre learned the craft was destroyed: heard, from its last report
            over a link, or seen. A destroyed craft stays listed, with
            `CatalogEntry.contact` `CatalogContact.Gone`, until the player dismisses it
            with `trackingStation.catalog.dismiss`. A recovered craft, one docked into
            another, and debris, flags and other objects nobody flew leave the catalog
            when they go. Null while this centre knows of no end.
          anyOf:
            - $ref: "#/components/schemas/RosterPlaceSource"
              x-sitrep-unit: enum
            - type: "null"
        endedUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time of the report or sighting that told this centre the craft
            was destroyed. A centre that had no line to the craft when it went sees it
            gone only when its place next comes into view, so this can be later than the
            destruction itself. Null exactly when `CatalogEntry.endSource` is.
        endKind:
          description: |-
            Whether the craft this centre knows has ended was destroyed or ended by the
            player from the Tracking Station. Null exactly when `CatalogEntry.endSource`
            is.
          anyOf:
            - $ref: "#/components/schemas/CatalogEnd"
              x-sitrep-unit: enum
            - type: "null"
    CentreDelayEntry:
      type: object
      description: |-
        One command centre's own one-way delay to the active craft, in the
        `commandCentre.activeVesselDelay` channel.
      required:
        - id
        - oneWaySeconds
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: The centre, as a roster `Id`.
        oneWaySeconds:
          type: number
          x-sitrep-unit: s
          description: One-way signal time along the centre's own routed path to the active craft.
    CentreSeparationEntry:
      type: object
      description: |-
        One ordered pair in the `commandCentre.separation` channel: how far
        `CentreSeparationEntry.from` is from `CentreSeparationEntry.to`, in one-way
        seconds along the routed CommNet path.

        Both ends are command-centre ids from `commandCentre.roster`, so a pair is a
        ground station against another ground station, a crewed craft against a
        ground station, or two crewed craft: a crewed control-source vessel is a
        centre like any other.
      required:
        - from
        - to
        - oneWaySeconds
      properties:
        from:
          type: string
          x-sitrep-unit: id
          description: The centre the separation is measured from, as a roster `Id`.
        to:
          type: string
          x-sitrep-unit: id
          description: The centre the separation is measured to, as a roster `Id`.
        oneWaySeconds:
          type: number
          x-sitrep-unit: s
          description: One-way signal time along the routed path between the two.
    ClaimRequest:
      type: object
      description: |-
        Names the commands a client is still waiting on, sent after it reconnects to
        the game: a page reload, a dropped network or a restarted game has closed
        the connection the commands were sent on, and the answers they were owed
        have nowhere to go. For each `requestId` the game holds an answer for, it
        sends that answer now and forgets it; for each command still in flight it
        sends the answer to this connection when it comes; for each one it holds
        nothing for, it sends an `error` carrying `replyNotReceived`, so the client
        can stop waiting. Used by a client that keeps its outstanding commands
        across a reload, such as a command held for a craft out of contact.

        An id is claimed only by the command centre that sent it: send this after
        `SetVantage`, and an id sent from another centre is answered as one the game
        holds nothing for. Answers are never sent to a connection that does not name
        their id.
      required:
        - type
        - requestIds
      properties:
        type:
          type: string
          const: claim
          x-sitrep-unit: id
          description: The frame type, always `"claim"`.
        requestIds:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: The `requestId` of each command the client still waits on, as it sent them.
    ClosestApproach:
      type: object
      description: |-
        Next closest approach between the active vessel and its current target,
        computed by the orbit model in use (stock two-body Kepler by default, an
        n-body physics mod's when one is installed), so an n-body physics mod can
        supply the true encounter rather than a Kepler approximation.

        Because it comes from the same provider as the trajectory, the encounter and
        the trajectory it lies on are always the same physics. Null on
        `VesselTarget` when there is no target, no frame the provider can reach both
        objects in, or no encounter inside the window it was asked about.
      required:
        - time
        - distance
      properties:
        time:
          type: number
          x-sitrep-unit: ut
          description: |-
            Universal Time (seconds) of the minimum separation at or after the sample's
            UT.
        distance:
          type: number
          x-sitrep-unit: m
          description: Separation (metres) at `ClosestApproach.time`.
    CommandAccepted:
      type: object
      description: |-
        Sent the moment a command starts its delayed journey, carrying the one-way
        signal delay it will actually travel. It says the command is on its way and
        when to expect a reply, never that anything executed.

        A client cannot work this out for itself. The delay depends on the craft or
        place the command is for, and on the command centre it was sent from. A loss
        deadline sized from the delay a client can see (the active craft's) is wrong
        for a command addressed to any other node.

        Matched to its request by `CommandAccepted.requestId`, the client's own id
        from its `command-request`, because this frame comes back on the connection
        that sent the request. Entries on `system.uplink.pending` carry an id Gonogo
        assigns instead, since two clients can choose the same request id.

        Absent for a command that never waits on the signal delay (one that takes
        effect when sent, or one whose delay is zero), because there is no flight to
        wait out. Absent also for a refusal, which sends an `ErrorMsg` instead. A
        client must therefore treat "no acceptance yet" as ordinary rather than as
        an error.
      required:
        - type
        - requestId
      properties:
        type:
          type: string
          const: command-accepted
          x-sitrep-unit: id
          description: The frame type, always `"command-accepted"`.
        requestId:
          type: string
          x-sitrep-unit: id
          description: The client's own id, echoed from its `command-request`.
        oneWaySeconds:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            One-way signal delay from the sending vantage to the node this command is
            addressed to, as Gonogo knows it at dispatch. It is never re-sent: the
            sender may never learn of a route change after dispatch.

            For a command held and forwarded on a lane it is how long the sending
            centre's own plan expects it to take to reach the craft, waits included, and
            absent when that plan knows no route, as for a craft the centre has not
            heard from yet. It is what the centre believed when it sent, and says
            nothing of whether the craft is really listening.
        predictedReplyUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When Gonogo predicts the reply will come back, from the routes at dispatch,
            waits included. A client times its loss deadline from this when present,
            since a command held for a window replies long after twice the one-way time.
            Absent when no route was predicted.
        expiresAtUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the command is deleted wherever it is, if it has not run. Absent for a
            command that is not held at all.
        warning:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            What the operator should know about a command that was accepted anyway, as a
            sentence to show them. Present for a continuous input, a throttle or a
            control axis, that the sending centre's plan says would have to wait at a
            node: it is sent, and it is dropped where it would have waited, so it is
            likely to be lost. Absent otherwise.
    CommandCentreActiveVesselDelay:
      type: object
      description: |-
        How far each command centre is from the active craft, one-way, along its own
        routed path: the delay every ordinary channel reaches that centre at, and
        the delay a command from it takes to arrive.

        **Sparse.** A centre is listed only when it has a delay of its own. The home
        centre is never listed: its delay is `comms.delay`, which also carries the
        hold through a loss of signal. A centre other than home that is not listed
        has no route to the craft. Neither absence is a zero, so a client must not
        quote a delay for a centre that is missing from the list.

        A crewed centre that is the active craft is listed at an explicit zero: a
        craft is no distance from itself.

        Each command centre is sent its own. The centres listed are those on the
        receiving centre's own `commandCentre.roster`, and each figure is worked out
        from that centre's own contact plan, as `comms.delay` is: the receiving
        centre's own entry and its `comms.delay` are the same path.
      required:
        - centres
      properties:
        centres:
          type: array
          items:
            $ref: "#/components/schemas/CentreDelayEntry"
          description: Every centre with a delay of its own to the active craft.
    CommandCentreEntry:
      type: object
      description: |-
        One command centre in the `commandCentre.roster` channel: a vantage the
        operator can command from and observe at. The roster is the union of the
        CommNet home nodes (KSC, Extra Ground Stations, Kerbal Konstructs sites) and
        crewed control-source vessels.

        The Topic payload is a bare array of these entries, like
        `SpaceCenterPoiEntry`, one per centre, keyed by `CommandCentreEntry.id`.

        Each command centre is sent its own roster, the centres it knows of. A
        ground station is on every centre's. A vessel that is a command centre joins
        a centre's roster when the vessel's own word that it is one has reached that
        centre, and stays on it until its word that it no longer is, or that it is
        gone, has: a crew boarding a vessel far away does not put a new centre on
        your roster before the light of it could arrive. A centre always lists
        itself.
      required:
        - active
        - isHome
        - isHomeFallback
      properties:
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Stable centre id, the one `SetVantage.centreId` takes: `"ground:<name>"` or
            `"vessel:<guid>"`. Every ground station is `"ground:<name>"`, the home one
            included: which centre is home is `CommandCentreEntry.isHome`, never a
            special id. Ground stations that share a name are told apart as
            `"ground:<name>#2"`, `"#3"` and so on.
        displayName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: Human-facing name.
        kind:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: "One of `GroundStation`, `CrewedVessel` or `Custom`: the kind of centre."
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index of the body this centre sits on among the bodies
            `trackingStation.bodies` lists; null when unknown or not surface-anchored.
        latitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Body-fixed surface latitude of the centre in degrees, when surface-anchored;
            null for a moving vessel centre.

            Null means "not applicable", not "not computed". A `GroundStation` always
            reports coordinates. A `CrewedVessel` reports them only while landed,
            splashed or pre-launch, since a point under a craft in flight sweeps at
            orbital rate and is not a place the centre occupies. So null says the centre
            is airborne or in space, and a client may act on that rather than treating
            it as missing data. The one case where an anchored centre reports null is a
            body that could not be read at all, and then `CommandCentreEntry.bodyIndex`
            is null too: the two travel together, so a null coordinate never appears
            beside a known body.

            Always null or non-null together with `CommandCentreEntry.longitude`.
        longitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Body-fixed surface longitude of the centre in degrees, wrapped to (-180,
            180], matching every other geographic value on the wire. Null under exactly
            the rule `CommandCentreEntry.latitude` documents, and always null together
            with it.
        active:
          type: boolean
          x-sitrep-unit: flag
          description: Whether this centre is a valid command source right now.
        isHome:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether this centre is the home command centre: the one that holds the
            career ledger.

            At most one entry carries it. When the game cannot say which centre is home,
            as on an install whose ground stations all look alike to it, the first
            active ground station in ordinal id order carries it in home's place, with
            `CommandCentreEntry.isHomeFallback` set: the same centre a connection that
            has not chosen a command centre starts at. No entry carries it only when the
            roster holds no ground station at all.

            Not the same fact as `CommsHop.fromIsHome`, which is true of every ground
            station and so cannot say which one is home.
        isHomeFallback:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether this centre is home only because no home was identified: true on the
            one entry that carries `CommandCentreEntry.isHome` in its place, false on
            every other entry and on an identified home.

            A client that shows this centre as home can still tell the operator that it
            is standing in, and name it, without working out the stand-in itself.
        delayQuality:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Whether this centre can be routed to: `"routed"` (it has a CommNet node, so
            a control path can be found, occlusion-aware) or `"unroutable"` (no CommNet
            node, so no command path and no delay). No delay is estimated from position
            alone: commands travel over the relay network, so a centre with no route has
            no delay to quote.
    CommandCentreSeparation:
      type: object
      description: |-
        How far every active command centre is from every other, one-way, along the
        routed CommNet path: how long a message from someone at one centre takes to
        reach someone at another.

        **Sparse.** A pair with no route has no entry, rather than a zero or a
        sentinel: messages travel over the relay network, so an unroutable pair has
        no separation to quote. No entry for a pair means the separation is
        unavailable, which is a different fact from it being large.

        Each centre is always paired with itself at an explicit zero, so the one
        pair that is certain never reads as unavailable.

        Each command centre is sent its own. The pairs are between the centres on
        the receiving centre's own `commandCentre.roster`, and each figure is the
        signal delay of the route that centre's own contact plan has open now, so a
        centre is quoted no separation from a vessel it has not heard is a command
        centre, and a figure moves when the news that moves it has arrived. Every
        ground station is the home centre's own antenna, so home is as far from a
        vessel as its nearest station is.
      required:
        - pairs
      properties:
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/CentreSeparationEntry"
          description: Every ordered pair with a routed path, plus each centre's own zero.
    CommandErrorCode:
      type: string
      description: |-
        The root refusals: the closed set every client can switch on. Each says what
        kind of refusal it was, and so whether waiting, changing the craft, or doing
        something in the game is what makes a retry worthwhile.

        A producer that can say more names a refinement of one of these, a code
        written `owner.name` that travels beside the root's id in the reply's
        `reason`; the root still travels, so nothing a client does with a root
        depends on knowing the refinement.
      oneOf:
        - const: noVessel
          title: NoVessel
          description: There is no active vessel to act on.
          x-sitrep-sentence: there is no vessel to act on
        - const: modeUnavailable
          title: ModeUnavailable
          description: |-
            The requested mode or state is not available, and the game gave no more
            specific reason.
          x-sitrep-sentence: the game would not say why
        - const: range
          title: Range
          description: An argument was out of its valid range.
          x-sitrep-sentence: an argument was outside its valid range
        - const: notFound
          title: NotFound
          description: |-
            The referenced entity (a node id, a vessel or body target, a craft name) did
            not resolve.
          x-sitrep-sentence: nothing here answers to that
        - const: planNotOwned
          title: PlanNotOwned
          description: |-
            The maneuver plan is owned by a trajectory planner other than the game's
            own, such as a mod that plans its own burns, so a node written there would
            never be flown.

            The command is refused and nothing is written. The owning planner is on the
            wire as the `planner` field of the `vessel.maneuver` payload.
          x-sitrep-sentence: another planner owns the flight plan
        - const: limitReached
          title: LimitReached
          description: |-
            A capacity is full: the Astronaut Complex holds its cap of active crew, a
            facility holds its cap of anything else countable.

            A retry succeeds only once something changes, such as a kerbal leaving the
            active roster.

            The `breach` field of the reply carries the numbers, so a client can say "16
            of 16".
          x-sitrep-sentence: a limit has been reached
        - const: alreadyAtMaximum
          title: AlreadyAtMaximum
          description: |-
            The thing is already at the top of an upgradeable scale, so there is nothing
            above it to move to. An example is the Launch Pad at tier 3 of 3.

            Not `CommandErrorCode.LimitReached`: a cap that is full can be freed; a
            maximum tier cannot be exceeded by any action at all.
          x-sitrep-sentence: it is already at its maximum
        - const: insufficientFunds
          title: InsufficientFunds
          description: |-
            The command costs more than the funds on hand.

            The `breach` field of the reply carries the cost as `Actual` against the
            balance as `Limit`, so the client can say how short and in the operator's
            own currency rendering.
          x-sitrep-sentence: there are not enough funds
        - const: insufficientScience
          title: InsufficientScience
          description: |-
            The command costs more science than is banked. Separate from
            `CommandErrorCode.InsufficientFunds`, as the game keeps science and funds
            separate currencies.

            The cost is the one the game itself would charge, with every modifier
            applied.
          x-sitrep-sentence: there is not enough science
        - const: careerModeRequired
          title: CareerModeRequired
          description: |-
            The save is not a career save, so this command's whole subsystem does not
            exist here.

            A permanent property of the save, not a state that may change, so a client
            can hide the control rather than show it refused.
          x-sitrep-sentence: this save is not a career game
        - const: wrongScene
          title: WrongScene
          description: |-
            The game is in a scene this command cannot run from.

            The `detail` field of the reply names the scene when the producer had one.
          x-sitrep-sentence: the game is not in a scene that allows it
        - const: wrongState
          title: WrongState
          description: |-
            The entity is not in a state this transition applies to: an already-active
            strategy asked to activate, an already-researched node asked to unlock, a
            contract asked to accept when it is not offered, an assigned kerbal asked to
            be sacked, a spent experiment asked to deploy.

            The `detail` field of the reply can carry the state in the game's own words.
          x-sitrep-sentence: it is not in a state that allows it
        - const: notClearToProceed
          title: NotClearToProceed
          description: |-
            Right command, wrong moment: the flight is not in a state that permits it
            yet, and will be later.

            The game gives five such reasons: in atmosphere, under acceleration, moving
            over the surface, about to crash, on a ladder; and a revert or a scene
            change can also be switched off by the save's own difficulty settings. The
            game's reason is on the `detail` field of the reply.

            Also returned by the command that sets a SCET alarm (an alarm on the craft's
            own clock, spacecraft event time) when the command centre it names as its
            vantage cannot be checked, because the game has not yet reported any command
            centre: at the main menu, and in the first moments after a save loads. The
            same command refuses a vantage that is known and inactive with
            `CommandErrorCode.Range` instead, because that one does not resolve by
            waiting. Any other command naming an inactive vantage fails with the
            `unknownVantage` fault.

            Distinct from `CommandErrorCode.WrongState`, which is about the entity and
            does not resolve by waiting.
          x-sitrep-sentence: the flight is not clear for it yet
        - const: capabilityMismatch
          title: CapabilityMismatch
          description: |-
            The part or vessel does not have the capability this command needs: a rotor
            asked for a target angle, an unmotorised servo asked to drive, a part with
            no such action, an action present but inert, an autopilot mode this craft
            cannot hold.

            Nothing an operator waits for. The craft would have to be different for this
            to work, which is why it is not `CommandErrorCode.NotClearToProceed` and not
            `CommandErrorCode.WrongState`.
          x-sitrep-sentence: this craft cannot do it
        - const: noConnection
          title: NoConnection
          description: |-
            There is no usable link for what this command needs to send.

            The vessel has no antenna that can carry the payload, such as a science
            transmission.
          x-sitrep-sentence: there is no usable link
        - const: notUnlocked
          title: NotUnlocked
          description: |-
            The capability exists in the game but this save has not unlocked it: fuel
            transfer, custom action groups, flight planning, EVA, the maneuver tool.

            Each switch follows the level of the building that owns it.

            Distinct from `CommandErrorCode.LimitReached`, which is a number against a
            number. This is a switch that is off, and the fix is an upgrade rather than
            making room.
          x-sitrep-sentence: it has not been unlocked yet
        - const: siteOccupied
          title: SiteOccupied
          description: |-
            Another vessel is on the launch site.

            The game's own words for it ride on the `detail` field of the reply.
          x-sitrep-sentence: another vessel is on the launch site
        - const: facilityDamaged
          title: FacilityDamaged
          description: The facility this command needs is destroyed or damaged.
          x-sitrep-sentence: the building is out of action
        - const: insufficientResource
          title: InsufficientResource
          description: |-
            The command consumes a countable item and there are not enough of them
            aboard.

            The command's handler decides how many are needed. This code says only that
            there were too few, never which item.

            Separate from `CommandErrorCode.InsufficientFunds` and
            `CommandErrorCode.InsufficientScience`: a physical item cannot be bought.

            Not `CommandErrorCode.LimitReached`, which is a capacity that is full. This
            is a store that is empty.
          x-sitrep-sentence: there are not enough of what it uses aboard
        - const: unreadable
          title: Unreadable
          description: |-
            The command's handler could not read the state it needed, so the question
            went unanswered. Nothing about the craft, the save or the moment was
            established, and the refusal is no judgement about the command.

            Unlike `CommandErrorCode.CapabilityMismatch`, this says nothing about what
            the craft can do. Waiting does not by itself make it succeed, but sending
            the command again asks the question afresh, and that is the only sound next
            move.

            The `detail` field of the reply names what could not be read when the
            handler had a name for it.
          x-sitrep-sentence: the game would not answer
        - const: outOfReach
          title: OutOfReach
          description: |-
            The command acts at a place, and the command centre it was sent from is not
            in that place's planetary system, so it has no authority there: a launch
            from a pad in another planet's system.

            This refuses the sender, not the moment, so no amount of waiting makes it
            succeed. Sending from a centre in the place's own system does.

            The `detail` field of the reply names the centre and the place, and the
            system each is in, so an operator learns which centre to send from.

            Distinct from `CommandErrorCode.NoConnection`, which is a link that cannot
            carry the command. A centre may be perfectly linked to the place and still
            have no authority over it.
          x-sitrep-sentence: this command centre has no authority over that place
    CommandGroupRequest:
      type: object
      description: |-
        Several commands the client sends as one message: they travel together,
        arrive whole or not at all, are refused together, and run in order within a
        single physics tick. Each member is an ordinary `CommandRequest` with its
        own `requestId`, and each is answered under that id as if it had been sent
        alone.

        Every member must be a delayed command addressed to the same craft and sent
        from the same command centre. A group that breaks either rule, or is empty,
        is refused whole. If any member is refused for any reason, none is sent.
      required:
        - type
        - groupId
        - members
      properties:
        type:
          type: string
          const: command-group
          x-sitrep-unit: id
          description: The frame type, always `"command-group"`.
        groupId:
          type: string
          x-sitrep-unit: id
          description: An id the client chooses for the group as a whole.
        members:
          type: array
          items:
            type: object
            description: |-
              A command the client sends: the command id, its arguments, and a request id
              that the reply carries back.
            required:
              - type
              - requestId
              - command
              - label
              - topic
              - args
              - sentAt
            properties:
              type:
                type: string
                const: command-request
                x-sitrep-unit: id
                description: The frame type, always `"command-request"`.
              requestId:
                type: string
                x-sitrep-unit: id
                description: An id the client chooses; the reply carries it back.
              command:
                type: string
                x-sitrep-unit: id
                description: The command id, such as `vessel.control.setThrottle`.
              label:
                type: string
                x-sitrep-unit: text
                description: |-
                  Any text: the mod shows it back, unchanged, beside this command on
                  `system.uplink.pending`, and never reads it otherwise. Send the command id
                  if there is nothing better. When empty, show `CommandRequest.command`
                  instead.
              topic:
                type: string
                x-sitrep-unit: id
                description: |-
                  A channel to show beside this command on `system.uplink.pending`, unchanged;
                  the mod never reads it otherwise. Send `""` if there is none.
              vantage:
                type:
                  - string
                  - "null"
                x-sitrep-unit: id
                description: |-
                  Per-call vantage override: the command centre id this command dispatches
                  from, which decides its signal delay. Optional: null or empty uses the
                  connection's own vantage (see `SetVantage`). A command about the space
                  program rather than a craft (tech, strategy, contract) sends `"meta"`, which
                  carries no delay whichever centre the operator has selected; sent from a
                  centre instead, it rides that centre's delay to the home command, which is
                  none for a ground station. A centre that is not active is refused with an
                  `unknownVantage` error.
              seenVesselId:
                type:
                  - string
                  - "null"
                x-sitrep-unit: id
                description: |-
                  The vessel the operator was looking at when the command was pressed: the
                  `vesselId` of the newest `vessel.identity` reading the client holds.
                  Optional: null or empty states nothing and the command is not checked
                  against it. A command for the active vessel is refused with `wrongState` at
                  the press when the game's active vessel is not this one, because the
                  operator's screen runs one signal delay behind the game and a switch inside
                  that delay is not yet visible there. Commands that are not addressed to the
                  active vessel ignore it.
              args:
                description: The command's arguments, in the command's own argument type.
              sentAt:
                type: number
                x-sitrep-unit: ut
                description: |-
                  When the client sent the command, in UT seconds (KSP universal time), the
                  same base as `Meta.validAt`. Send 0 if you do not need it.

                  The mod stamps the response's `Meta.deliveredAt` off its own clock, so a
                  caller timing a round trip measures against its own clock rather than
                  reading this back. The field is carried onto the response's `Meta.validAt`,
                  which therefore reads 0 on a command response unless the client fills this
                  in.
          description: The commands, in the order they run.
    CommandRequest:
      type: object
      description: |-
        A command the client sends: the command id, its arguments, and a request id
        that the reply carries back.

        `command` is the channel's `address` and `args` is that command's own args
        type. Each command's `command-request` message fixes both. The answer comes back
        as a `command-response` with the same `requestId`, or as an `error` frame if
        the mod refused it or could not read it. `label` and `topic` are required but
        free, and `sentAt` may be 0.
      required:
        - type
        - requestId
        - command
        - label
        - topic
        - args
        - sentAt
      properties:
        type:
          type: string
          const: command-request
          x-sitrep-unit: id
        requestId:
          type: string
          x-sitrep-unit: id
          description: An id the client chooses; the reply carries it back.
        command:
          type: string
          x-sitrep-unit: id
          description: The command id, such as `vessel.control.setThrottle`.
        label:
          type: string
          x-sitrep-unit: text
          description: |-
            Any text: the mod shows it back, unchanged, beside this command on
            `system.uplink.pending`, and never reads it otherwise. Send the command id
            if there is nothing better. When empty, show `CommandRequest.command`
            instead.
        topic:
          type: string
          x-sitrep-unit: id
          description: |-
            A channel to show beside this command on `system.uplink.pending`, unchanged;
            the mod never reads it otherwise. Send `""` if there is none.
        vantage:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Per-call vantage override: the command centre id this command dispatches
            from, which decides its signal delay. Optional: null or empty uses the
            connection's own vantage (see `SetVantage`). A command about the space
            program rather than a craft (tech, strategy, contract) sends `"meta"`, which
            carries no delay whichever centre the operator has selected; sent from a
            centre instead, it rides that centre's delay to the home command, which is
            none for a ground station. A centre that is not active is refused with an
            `unknownVantage` error.
        seenVesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The vessel the operator was looking at when the command was pressed: the
            `vesselId` of the newest `vessel.identity` reading the client holds.
            Optional: null or empty states nothing and the command is not checked
            against it. A command for the active vessel is refused with `wrongState` at
            the press when the game's active vessel is not this one, because the
            operator's screen runs one signal delay behind the game and a switch inside
            that delay is not yet visible there. Commands that are not addressed to the
            active vessel ignore it.
        args:
          description: The command's own arguments. Each command's `command-request` message narrows this to that command's args schema.
        sentAt:
          type: number
          x-sitrep-unit: ut
          description: |-
            When the client sent the command, in UT seconds (KSP universal time), the
            same base as `Meta.validAt`. Send 0 if you do not need it.

            The mod stamps the response's `Meta.deliveredAt` off its own clock, so a
            caller timing a round trip measures against its own clock rather than
            reading this back. The field is carried onto the response's `Meta.validAt`,
            which therefore reads 0 on a command response unless the client fills this
            in.
      examples:
        - type: command-request
          requestId: 0f3c9a12
          command: vessel.control.setThrottle
          label: Throttle 40%
          topic: vessel.control
          vantage: ground:Kerbal Space Center
          args:
            value: 0.4
          sentAt: 0
    CommandResponse:
      type: object
      description: |-
        The mod's reply to a `CommandRequest`, matched to it by
        `CommandResponse.requestId`.

        `result` is the command's own reply type, fixed by that command's
        `command-response` message. A command that ran and was refused arrives here
        with `success: false` and an `errorCode`. A command the mod could not read
        is answered with an `error` frame instead.

        There is no `command` field. `requestId` is the only link back to the
        command, and a delayed command's answer can arrive minutes after it.
      required:
        - type
        - requestId
        - result
        - meta
      properties:
        type:
          type: string
          const: command-response
          x-sitrep-unit: id
        requestId:
          type: string
          x-sitrep-unit: id
          description: |-
            The id from the request this replies to. It is the only link back to the
            request, and a delayed command's reply can arrive minutes later.
        result:
          description: The command's own reply. Each command's `command-response` message narrows this to that command's reply schema.
        meta:
          $ref: "#/components/schemas/Meta"
      examples:
        - type: command-response
          requestId: 0f3c9a12
          result:
            success: true
          meta:
            source: system
            validAt: 0
            seq: 919
            deliveredAt: 1842006.9
            vantage: ground:Kerbal Space Center
            quality: 1
            active: true
            staleness: 0
            timelineEpoch: 3
            sampleId: 4127
    CommandResult:
      type: object
      description: |-
        What every command returns. A refused command has `CommandResult.success`
        false and a typed `CommandResult.errorCode` saying why, so a client never
        matches on message text.

        This is the result of a command that returns no value. A command that does
        returns the same fields with its value beside them, as `payload` on the
        wire.
      required:
        - success
      properties:
        success:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the command ran. False means the game refused it, and
            `CommandResult.errorCode` says why.
        errorCode:
          description: |-
            Why it was refused, null on success. On the wire this is the root's id, so
            every client can classify it; a refinement's own id travels beside it as
            `CommandResult.reason`.
          anyOf:
            - $ref: "#/components/schemas/CommandErrorCode"
              x-sitrep-unit: enum
            - type: "null"
        reason:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The id of the more specific refusal, when there is one, such as
            `example.notManaging`, a kind of `careerModeRequired`. Absent when the
            refusal is a root. An id this client does not know is still a refusal of
            kind `CommandResult.errorCode`.
        breach:
          description: |-
            The numbers behind the refusal, when the refusal has any: the cap and the
            count, the tier and the top tier, the price and the balance. Null on success
            and on every refusal that is not a comparison.

            `CommandResult.errorCode` says which refusal it is and this holds its
            numbers, as in "16 of 16 active crew".

            The same `LimitBreach` shape a declared gate carries on
            `GateVerdict.breach`, so a refusal reads the same whether it came from a
            gate or from the command's own handler. Omitted from the wire when null.
          anyOf:
            - $ref: "#/components/schemas/LimitBreach"
            - type: "null"
        detail:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The refusal in the game's own words, when the game had any: the member of
            `ClearToSaveStatus` it came back with,
            `Strategies.Strategy.CanBeActivated(out string reason)`'s reason,
            `GameVariables.GetEVALockedReason`'s sentence, a
            `PreFlightTests.IPreFlightTest`'s `GetWarningTitle()`, a
            `[Description]`-tagged state member's name. Null when the refusal had
            nothing to quote, and then omitted from the wire, never sent as an empty
            string.

            The text is the game's own, so it is in the game's language.

            Prose for a human, never parsed: `CommandResult.errorCode` is the
            machine-readable half. The same split, and the same field name, as
            `GateVerdict.detail`.
    CommcastAuthor:
      type: object
      description: |-
        Who is speaking, as the speaking client describes itself. A speaker is the
        screen sending a message, and a listener is a command centre in the group it
        is sent to. Shown to listeners and trusted for nothing else: the vantage a
        thing was said from, the command centre its connection works from, is always
        the one the mod resolved for the connection that said it, never a field
        here.
      required:
        - name
        - stationKey
        - seat
      properties:
        name:
          type: string
          x-sitrep-unit: text
          description: The name a listener reads beside what was said.
        stationKey:
          type: string
          x-sitrep-unit: id
          description: |-
            The speaking device's own stable key, so a screen can recognise its own
            words coming back.
        seat:
          type: string
          x-sitrep-unit: id
          description: |-
            Which end of the light-path the speaker sits at, in the client's own
            vocabulary (`"pilot"`, `"mission-control"`).
    CommcastGroupAddArgs:
      type: object
      description: |-
        Bring more centres into a group. Anyone the speaker can see is a member may
        add; nobody is ever removed. Refused unless the speaker is a member as its
        own vantage currently knows the group.
      required:
        - groupId
        - added
        - author
      properties:
        groupId:
          type: string
          x-sitrep-unit: id
          description: The group, by the id it was opened with.
        added:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: |-
            The centres to bring in, as `commandCentre.roster` ids. One already in the
            group is ignored.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
    CommcastGroupOpenArgs:
      type: object
      description: |-
        Start a group, a set of command centres sharing one thread for messages and
        radio. A centre is a command centre, as listed on `commandCentre.roster`.
        The command centre sending this is always a member, named here or not.

        Never delayed on the way up. What is said crosses once, from the speaker to
        each listener at that pair's signal delay, and the mod times that crossing
        on the way down; delaying the command as well would count the gap twice.
      required:
        - groupId
        - members
        - author
      properties:
        groupId:
          type: string
          x-sitrep-unit: id
          description: |-
            Minted by the client, so a resend opens nothing twice. Refused if another
            group already holds it.
        members:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: Every centre the group starts with, as `commandCentre.roster` ids.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
    CommcastMessageAckArgs:
      type: object
      description: |-
        Tell a message's author it arrived. The acknowledgement travels back to the
        author over the signal delay between the two centres, so the author learns
        of it one signal delay after it was read.
      required:
        - messageId
        - author
      properties:
        messageId:
          type: string
          x-sitrep-unit: id
          description: The message being acknowledged, by its `CommcastMessageSendArgs.id`.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
    CommcastMessageSendArgs:
      type: object
      description: |-
        Say something to a group in text. Refused unless the speaker is a member as
        its own vantage knows the group.
      required:
        - id
        - groupId
        - body
        - to
        - author
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            Minted by the client and kept across a resend, so a listener holding both
            copies holds one message.
        groupId:
          type: string
          x-sitrep-unit: id
          description: The group, by the id it was opened with.
        body:
          type: string
          x-sitrep-unit: text
          description: The words.
        to:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: |-
            The members to say it to, as `commandCentre.roster` ids: for saying a
            message again to those who did not receive it, and to nobody else. Empty or
            absent means every member the speaker knows of. Refused if it names a centre
            that is not a member as the speaker's vantage knows the group.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
    CommcastRadioTransmitArgs:
      type: object
      description: |-
        One batch of live push-to-talk audio, spoken to a group.

        Each chunk is one raw Opus packet of 20 ms, base64-encoded. Send about 200
        ms per batch: each batch leaves the mod as one binary frame per listener on
        `commcast.radio`, and the per-frame header is what costs, not the audio.
      required:
        - transmissionId
        - groupId
        - seq
        - chunks
        - end
        - author
      properties:
        transmissionId:
          type: string
          x-sitrep-unit: id
          description: Minted by the client at key-down and carried on every batch of that keying.
        groupId:
          type: string
          x-sitrep-unit: id
          description: The group, by the id it was opened with.
        seq:
          type: number
          x-sitrep-unit: count
          description: |-
            The 0-based index, within the transmission, of the first chunk in this
            batch.
        chunks:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            Opus packets, 20 ms each, base64. May be empty on the batch that ends a
            keying.
        end:
          type: boolean
          x-sitrep-unit: flag
          description: True on the last batch of a keying.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
    CommcastSendReceipt:
      type: object
      description: |-
        What `commcast.message.send` (args `CommcastMessageSendArgs`) did with a
        message: which command centres it left for, and which it could not leave
        for. `commcast.message.send` is the command, of the core mod's Commcast
        group messaging and radio, that sends a text message to a group of command
        centres. A centre is a `commandCentre.roster` entry, a place commands are
        sent from. It says nothing of arrival: a listener is a centre that receives
        the message, and arrival is known only when that listener sends
        `commcast.message.ack` (`CommcastMessageAckArgs`) back.
      required:
        - addressed
        - unreached
      properties:
        addressed:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: |-
            Every centre the message left for, the speaker's own included, sorted by id.
            The same list its listeners read as the message's `to`.
        unreached:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: |-
            Every member it was meant for that no signal from the speaker could reach
            when it was said, sorted by id. The message was never sent to these centres,
            so none of them will ever acknowledge it; to reach them, send it again later
            naming them in `to`.
    CommcastTraffic:
      type: object
      description: |-
        One item of `commcast.traffic`: something said to a group this vantage
        belongs to, delivered one signal delay after it was said from where it was
        said.

        **Addressed, never broadcast.** A connection receives only the items
        addressed to its own vantage. A group's members are addressed as the speaker
        could see them when it spoke, so a centre added far away starts receiving
        once word of it has reached the speaker, and a member with no path from the
        speaker misses what was said.

        **A stream, not state.** Nothing is replayed to a connection that subscribes
        after an item reached it, as with anything heard on a radio.

        Three kinds, by `CommcastTraffic.kind`:

        - `"members"`: a group opened or grew. `CommcastTraffic.members` is its
          whole membership after the change, `CommcastTraffic.added` who came in
        - `"text"`: a message, `CommcastTraffic.id` and `CommcastTraffic.body`
        - `"ack"`: a member acknowledging `CommcastTraffic.messageId`, addressed to
          that message's author alone
      required:
        - kind
        - groupId
        - from
        - author
        - sentUt
        - to
      properties:
        kind:
          type: string
          x-sitrep-unit: enum
          description: "`\"members\"`, `\"text\"` or `\"ack\"`."
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: A text message's own id, or a membership change's. Absent from an ack.
        groupId:
          type: string
          x-sitrep-unit: id
          description: The group, by the id it was opened with.
        from:
          type: string
          x-sitrep-unit: id
          description: |-
            The centre it was said from, as the mod resolved it for the speaker's
            connection.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
        sentUt:
          type: number
          x-sitrep-unit: ut
          description: The UT it was said at, which is also this delivery's `meta.validAt`.
        to:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: |-
            Everyone it was addressed to, the speaker included, as the speaker could see
            the group.
        members:
          type:
            - array
            - "null"
          items:
            type: string
            x-sitrep-unit: id
          description: The group's whole membership after a `"members"` change. Absent otherwise.
        added:
          type:
            - array
            - "null"
          items:
            type: string
            x-sitrep-unit: id
          description: Who a `"members"` change brought in. Absent otherwise.
        body:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: A `"text"` message's words. Absent otherwise.
        messageId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The message an `"ack"` acknowledges. Absent otherwise.
    CommcastTransmissionRow:
      type: object
      description: |-
        One row of `commcast.transmissions`: a radio transmission this vantage can
        detect.

        **Detectable** means a signal from the speaker has a routed path to this
        vantage, the same path its audio would take. The row reaches a vantage at
        exactly the delay the transmission's audio does, so the instant a
        transmission begins here is the same whichever of the two is read.

        Rows are sent when a keying begins, again at most once a second of game time
        while it continues (so a connection that subscribes partway through learns
        of it), and once when it ends. Nothing is replayed to a connection that
        subscribes after a row reached it.

        **Detection only.** A transmission's audio on
        `CommcastTransmissionRow.topic` is addressed to the members of its group
        only, and this row grants no access to it: a group is joined by invitation,
        never by a vantage adding itself, whatever it can detect.
      required:
        - phase
        - transmissionId
        - groupId
        - from
        - author
        - startedUt
        - to
        - topic
      properties:
        phase:
          type: string
          x-sitrep-unit: enum
          description: "`\"open\"` while the speaker is keyed, `\"ended\"` on the last row of a keying."
        transmissionId:
          type: string
          x-sitrep-unit: id
          description: The keying, by the id the speaking client minted at key-down.
        groupId:
          type: string
          x-sitrep-unit: id
          description: The group it is spoken to.
        from:
          type: string
          x-sitrep-unit: id
          description: The centre it is spoken from.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
        startedUt:
          type: number
          x-sitrep-unit: ut
          description: The UT the keying's first batch reached the mod.
        to:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: Who the speaker addressed when this row was sent, the speaker included.
        topic:
          type: string
          x-sitrep-unit: id
          description: "The binary-lane topic its audio rides: `commcast.radio`."
    CommsCommandCentre:
      type: object
      description: |-
        The `comms.commandCentre` payload: which command centre the active route
        ends at as it stands now, so a client can show its own stats against the
        right name instead of assuming KSC. It is where `comms.path`'s last hop
        ends: the receiving centre itself, or, for the home centre, whichever ground
        station the signal reaches first. Shares its id and kind scheme with
        `CommandCentreEntry` (the `commandCentre.roster` entries).

        As with `comms.path`, each command centre is sent its own, made from what
        that centre has heard.

        Every field is null when the centre knows of no open path.
      properties:
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Stable centre key, same scheme as `CommandCentreEntry.id`: `"ground:<name>"`
            or `"vessel:<guid>"`. Null when no remote centre resolved.
        displayName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The centre's human-facing name. Null when no remote centre resolved.
        kind:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            `GroundStation` or `CrewedVessel`, as `CommandCentreEntry.kind` spells them.
            Null when no remote centre resolved.
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index into `trackingStation.bodies` of the body this centre sits on. Null
            when unknown, not surface-anchored, or the centre is a moving vessel.
    CommsConnectivity:
      type: object
      description: |-
        Whether the active vessel has a control link home right now, and the degree
        of control it has. Read from the comms mod in force: ground-side truth, with
        all three fields describing the same tick. Nothing is published while no
        craft is on screen (an editor, the space centre, the tracking station): a
        link report is about a craft.
      required:
        - connected
        - controlSource
        - hasLocalControl
      properties:
        connected:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when the backend resolved a control path home for the active vessel.
            False when it has none, and also when no link state could be read (then
            `CommsConnectivity.controlSource` is `CommsControlSource.None`).
        controlSource:
          description: The degree of control the vessel has.
          allOf:
            - $ref: "#/components/schemas/CommsControlSource"
              x-sitrep-unit: enum
        hasLocalControl:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when the vessel's control level is crewed partial control or full
            control. Independent of `CommsConnectivity.connected`: a crewed craft can be
            flown with no link home. Full control sets it too, including full control an
            uncrewed probe has over its link. False alongside
            `CommsControlSource.Unknown`.
    CommsContactPair:
      type: object
      description: Two nodes and the windows the plan predicts contact between them.
      required:
        - a
        - b
        - horizonUt
        - windows
        - retargetWindows
        - lowConfidence
      properties:
        a:
          type: string
          x-sitrep-unit: id
          description: |-
            One end, in the `commandCentre.roster` vocabulary: `"ground:<name>"` or
            `"vessel:<guid>"`.
        b:
          type: string
          x-sitrep-unit: id
          description: The other end, in the same vocabulary.
        horizonUt:
          type: number
          x-sitrep-unit: ut
          description: |-
            The last instant predicted for this pair: the plan's horizon, or sooner
            where either end's motion cannot be trusted that far ahead.
        windows:
          type: array
          items:
            $ref: "#/components/schemas/CommsContactWindow"
          description: |-
            Every window of contact up to `CommsContactPair.horizonUt`, in time order.
            Empty when none is predicted.
        retargetWindows:
          type: array
          items:
            $ref: "#/components/schemas/CommsRetargetWindow"
          description: |-
            The stretches in which either end could turn an idle dish to the other and
            carry a message, in time order: the dish has no contact on its own aim then,
            the turned dish would close the link, and the other end could already
            receive. A message held at the turning node may use one; nothing else does.
            Empty when no dish would be turned or the backend turns none.
        lowConfidence:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True while either end was last heard of with its orbit still changing. It is
            reckoned on the orbit it reported mid-burn, which it has since left, so
            these windows are a rough guide until its next report.
    CommsContactWindow:
      type: object
      description: One predicted stretch of contact.
      properties:
        openUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: When contact begins, or `null` when it is already open at the plan's start.
        closeUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: When contact ends, or `null` when it is still open at the pair's horizon.
        fromDish:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The dish on the pair's `CommsContactPair.a` end that carries this stretch of
            contact, as `"<nodeId>#<partPersistentId>/<ordinal>"`, or absent when that
            end has no steered dish on it.
        toDish:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The dish on the pair's `CommsContactPair.b` end that carries this stretch,
            or absent.
    CommsContacts:
      type: object
      description: |-
        One command centre's contact plan: for each pair of nodes that could hold a
        link (a ground station and a craft, or two craft), the windows over the
        coming hours when that centre predicts nothing blocks it and it is within
        reach.

        A prediction, and the receiving centre's own. Every craft is reckoned
        forward from the last orbit that centre has heard it report, so the plan
        holds nothing the centre could not know: a distant craft's burn moves the
        plan one signal delay after it happened, and a craft the centre has never
        heard of is not in it. Two centres can hold different plans at the same
        moment, and each session is sent only the plan of the centre it sits at.

        The live link the game reports always decides what actually gets through;
        this says when that link is expected to exist. A pair absent from
        `CommsContacts.pairs` was not predicted at all, which is different from a
        pair listed with no windows: that one is predicted never to be in contact
        before its `CommsContactPair.horizonUt`.
      required:
        - horizonUt
        - pairs
      properties:
        horizonUt:
          type: number
          x-sitrep-unit: ut
          description: The universal time the plan reaches to; nothing is predicted past it.
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/CommsContactPair"
          description: Every pair predicted, each with its windows.
    CommsControl:
      type: object
      description: |-
        What the active vessel can be commanded to do right now, which is a
        different question from whether it is connected. Always present, and read
        from the comms mod in force.
      required:
        - level
      properties:
        level:
          description: |-
            The vessel's control level. `CommsControlStateKind.None` when no link state
            could be read.
          allOf:
            - $ref: "#/components/schemas/CommsControlStateKind"
              x-sitrep-unit: enum
        reason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            A human-readable annotation on the control state, or null for none (never an
            empty string). The shipped backends set `"no connection to a command
            source"` when the vessel has no link home, and null when it is connected.
    CommsControlSource:
      type: integer
      description: |-
        The degree of control a vessel currently has, the `controlSource` axis of
        `CommsConnectivity`. The game's control level collapsed to three tiers:
        partial covers both crewed and uncrewed partial control, and whether a crew
        is aboard shows on `CommsConnectivity.hasLocalControl` instead.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: None
          description: |-
            The craft has no control source. A reading, unlike
            `CommsControlSource.Unknown`.
        - const: 1
          title: Partial
          description: |-
            Partial control, crewed or uncrewed: stock's `PARTIAL_MANNED` or
            `PARTIAL_UNMANNED` level.
        - const: 2
          title: Full
          description: Full control.
        - const: 3
          title: Unknown
          description: |-
            The game reported a control level this build does not name. Not
            `CommsControlSource.None`: the craft may well have control, but its level
            has no tier here. `CommsConnectivity.hasLocalControl` is false alongside it
            and says nothing.
    CommsControlStateKind:
      type: integer
      description: |-
        What the active vessel can be commanded to do, for `CommsControl`. The
        game's control level collapsed to three tiers, crewed and uncrewed partial
        control sharing one.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: None
          description: |-
            The craft cannot be commanded. A reading, unlike
            `CommsControlStateKind.Unknown`.
        - const: 1
          title: PartialManoeuvre
          description: |-
            Partial control, crewed or uncrewed: stock's `PARTIAL_MANNED` or
            `PARTIAL_UNMANNED` level.
        - const: 2
          title: Full
          description: Full control.
        - const: 3
          title: Unknown
          description: |-
            The game reported a control level this build does not name, so whether the
            craft can be commanded is not known. Not `CommsControlStateKind.None`.
    CommsDegrade:
      type: object
      description: |-
        The `comms.degrade` payload: how degraded the active vessel's link home is
        right now, on one fixed scale, as the comms backend in force grades it.

        `CommsDegrade.level` runs from 0, nothing wrong, to 1, nothing usable
        getting through. It is absent when nothing graded the link, and absent is a
        third case rather than a low one: "nobody rated this" and "this link is
        perfect" are opposite instructions to anything choosing a quality, so branch
        on the absence rather than defaulting it to a number.

        Read this rather than deriving a quality from `comms.signal`. That field is
        0..1 too, and it is a different quantity on a stock install than on a
        RealAntennas one: a range fraction against an antenna curve versus spare
        room on a data-rate ladder. Nothing on the wire distinguishes them, so `1 -
        strength` is two different quality curves on two saves. This channel names
        its rule, so a consumer acting on the number can see which grading produced
        it.

        Each command centre is sent its own, with `comms.signal` and from the same
        reading of the vessel's radio. A rating is of the vessel's whole path at one
        instant, so it reaches a centre no sooner than light leaving the farthest
        node on that path could. Absent until the first reading arrives. Through a
        blackout it keeps its last value; the disconnect itself reaches a client on
        `comms.link`.
      required:
        - modelId
        - modelName
      properties:
        modelId:
          type: string
          x-sitrep-unit: id
          description: The grading rule's id; `"unknown"` when nothing graded the link.
        modelName:
          type: string
          x-sitrep-unit: text
          description: |-
            The grading rule's display name, so a surface can say which grading is in
            play.
        level:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            The rating: 0 pristine, 1 unusable, absent when unrated. Never outside that
            range, and never a NaN: an arithmetic that overshot is clamped to the end it
            overshot, and one that failed to resolve arrives absent.
    CommsDelay:
      type: object
      description: |-
        The `comms.delay` payload: the one-way signal delay to the active vessel,
        gated by the `comms.signalDelay.enabled` setting. `CommsDelay.oneWaySeconds`
        tells two different "no delay" cases apart by value:

        - **null**: no measurable `CommsPath` (no path home, or incomplete hop
          geometry). There is nothing to measure, so nothing is reported.
          `CommsDelay.source` is `CommsDelaySource.None`.
        - **0**: the delay feature is disabled (`comms.signalDelay.enabled =
          false`). A genuine "zero delay applied", not an absence.
          `CommsDelay.source` is also `CommsDelaySource.None` here: the two cases
          share the same `Source` and are told apart only by whether the value is
          null.
        - a real number: `CommsDelay.source` is `CommsDelaySource.SignalDelay`, a
          signal delay computed over the hop geometry of the comms model in use.

        One zero names its own reason instead of sharing `CommsDelaySource.None`:
        `CommsDelaySource.NoCommsModel`, which is what tells a client that a board
        showing no path and no relay graph is a save with the CommNet difficulty
        option off, not a craft in a permanent blackout: the blackout reports `null`
        here and `connected:false` on `CommsLink`, and this reports `0` and
        `connected:true`.

        Each command centre is sent its own, and no other centre's. It is the signal
        delay of the active vessel's path that centre is sent on `comms.path`, so
        the two always agree. Where the game routes the vessel's samples to the
        centre (at home, the vessel's own path to the ground), that path is the
        game's route and this is the delay the samples arrive by. Wherever the game
        states no route, it is the path the centre's own plan has, worked out from
        what the centre has heard of each craft, so the figure moves only once the
        news that moves it has reached the centre. A zero that is a setting (delay
        switched off, or a save with no comms network) is sent at once.
      required:
        - source
        - meta
      properties:
        oneWaySeconds:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            The one-way signal delay to the command centre, in seconds. Null when
            nothing is measurable, 0 for a measured or applied zero; this type's summary
            says which case is which.

            **Reckoning.** Between samples the value is carried forward by re-measuring
            only the route's first hop, the one with the craft on one end: `(route -
            firstHop + |craft - peer|) / c`. The other hops join ground stations and
            relays that barely move against each other in that time, so their lengths
            are kept as measured. The craft is propagated on `@vessel.orbit`, and its
            peer is placed from `@commandCentre.roster`, whose body-fixed latitude and
            longitude need the rotation phase on `@trackingStation.bodies`.

            A first hop that ends at a relay places the relay from its entry on
            `@trackingStation.catalog`: the orbit the command centre last heard for it,
            about the body whose gravitational parameter `@trackingStation.bodies`
            carries.

            `CommsDelay.source` is an input because two of its members are a zero that
            does not mean "no distance": delay switched off, or a save with no comms
            network. Neither changes as the craft moves, so only
            `CommsDelaySource.SignalDelay` is carried forward.
        source:
          description: Why `CommsDelay.oneWaySeconds` has the value it has; see `CommsDelaySource`.
          allOf:
            - $ref: "#/components/schemas/CommsDelaySource"
              x-sitrep-unit: enum
        meta:
          description: The payload's provenance (`"vessel:<guid>"` or `"game"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    CommsDelaySource:
      type: integer
      description: Why `CommsDelay.oneWaySeconds` has the value it has.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: None
          description: |-
            No delay measured: either there is no measurable path (the value is null) or
            delay is switched off (the value is 0).
        - const: 1
          title: SignalDelay
          description: A signal delay computed over the route's hop geometry.
        - const: 2
          title: NoCommsModel
          description: |-
            Zero, because this save models no comms network at all: the stock CommNet
            difficulty option is off, so there are no ground stations, no relay graph
            and no path to measure a signal delay over. Control reaches a craft
            directly, from anywhere, instantly.

            Not the same as a null `CommsDelay.oneWaySeconds`, which means there is a
            comms model and it can measure nothing right now: a blackout. A save with no
            comms model reports this alongside `connected:true`, and its channels keep
            arriving with nothing held back; a blackout reports null and they stop.
    CommsHop:
      type: object
      description: |-
        One ordered hop toward home in the active vessel's path. Per-hop
        RealAntennas facts are not fields on this shared shape: the forward band
        rate rides the RealAntennas Uplink's own `realantennas.hopRates` channel (a
        per-hop annotation keyed by these same node ids, joined onto the route
        client-side), and the other RealAntennas per-hop facts ride
        `CommsHop.extensions` under `"realantennas"`.

        A ground station carries its own name in `CommsHop.from` and `CommsHop.to`,
        not a shared "home" label, and an install with RealAntennas can have a dozen
        of them. Two consecutive samples that each show a one-hop direct link, one
        to Kourou and one to Canberra, are a handoff between stations, not one
        station whose range changed.
      required:
        - from
        - to
        - fromIsHome
        - toIsHome
        - kind
      properties:
        from:
          type: string
          x-sitrep-unit: id
          description: |-
            The node id at the end of the hop nearer the vessel, in the same id space as
            `CommsNetworkNode.id`: a vessel's persistent id for a craft, the station's
            own name for a ground station.
        to:
          type: string
          x-sitrep-unit: id
          description: |-
            The node id at the end of the hop nearer home, in the same id space as
            `CommsHop.from`.
        fromIsHome:
          type: boolean
          x-sitrep-unit: flag
          description: True when the `CommsHop.from` end is a ground station.
        toIsHome:
          type: boolean
          x-sitrep-unit: flag
          description: True when the `CommsHop.to` end is a ground station.
        kind:
          description: |-
            `CommsHopKind.Home` when either end is a ground station, otherwise
            `CommsHopKind.Relay`. One value for the whole hop, so read
            `CommsHop.fromIsHome` and `CommsHop.toIsHome` for which end.
          allOf:
            - $ref: "#/components/schemas/CommsHopKind"
              x-sitrep-unit: enum
        distanceMeters:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Straight-line distance the signal crosses on this hop, in metres. Null when
            the hop's geometry is not known, never 0.
        strength:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            What this hop's link is worth at the distance it crosses, from 0 to 1, in
            the comms backend's own terms (see `CommsSignal`). On `comms.path` it is
            worked out for this hop of the active route, from what the receiving command
            centre has heard of the two ends' antennas, so it is a model and not a
            measurement. Null when the backend states no strength for the hop, or the
            centre has not heard enough to work one out.
        quantity:
          description: |-
            Which quantity `CommsHop.strength` is, as the comms backend stated it for
            this hop. Null exactly when `CommsHop.strength` is.
          anyOf:
            - $ref: "#/components/schemas/SignalQuantity"
              x-sitrep-unit: enum
            - type: "null"
        extensions:
          type:
            - object
            - "null"
          description: |-
            Per-hop facts the comms mod in use reports beyond this shape, keyed by that
            mod's name. A RealAntennas install fills `Extensions["realantennas"]` with
            band, tech level, modulation, encoder, required Eb/N0, beamwidth, EC draw
            and the reverse-direction rate, typed by the RealAntennas client's own
            `RealAntennasHopExt`.

            On `comms.path` a hop carries the facts the active vessel's radio last
            reported of that same hop, as the receiving command centre heard them, and a
            report reaches a centre no sooner than light from the farthest node on the
            path it was measured over. A hop of the active route the centre has heard no
            report of carries the facts the backend works out for it, from what the
            centre has heard of the two ends' antennas, or none where the backend states
            none.
          additionalProperties: true
    CommsHopKind:
      type: integer
      description: |-
        Whether a comms node is a ground station, or whether a hop touches one.
        Carried by `CommsHop.kind` and `CommsNetworkNode.kind`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Home
          description: A ground station, or a hop with a ground station at either end.
        - const: 1
          title: Relay
          description: A vessel node (the active craft included), or a hop between two vessels.
        - const: 2
          title: Vessel
          description: |-
            Not reported by the shipped backends: vessel nodes, the active craft
            included, arrive as `CommsHopKind.Relay`.
    CommsJourney:
      type: object
      description: |-
        Journey reports for this vantage's commands in the current timeline: where
        each was held, sent on, stopped or run, as reports from those nodes arrive
        back here.

        Every report has already travelled from the node that made it to this
        centre, at light speed and through any holds of its own, so a report arrives
        on this topic when this centre could first know it. Order a command's events
        by `CommsJourneyEvent.atUt`, not by arrival: two reports from different
        nodes travel different routes. A terminal event is never undone by an
        earlier one arriving late.

        A report made here, by this centre, says only what this centre could know.
        It reports a command held while its own plan says the way is shut, and sent
        on when its plan says the way is open, whatever the far end is doing; and it
        reports a command that went unanswered only once twice the signal delay it
        expected has passed.

        Each session receives only its own vantage's events.
      required:
        - epoch
        - events
      properties:
        epoch:
          type: number
          x-sitrep-unit: count
          description: |-
            The timeline these events belong to; events from an earlier timeline are
            dropped.
        events:
          type: array
          items:
            $ref: "#/components/schemas/CommsJourneyEvent"
          description: |-
            Every event received so far in this timeline, oldest arrival first, up to a
            bounded number.
    CommsJourneyEvent:
      type: object
      description: One journey report.
      required:
        - id
        - about
        - craft
        - kind
        - at
        - atUt
        - missing
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: The report's own id.
        about:
          type: string
          x-sitrep-unit: id
          description: |-
            The command it is about, as its `system.uplink.pending` `PendingUplink.id`,
            or for a copy sent again, the `UplinkActionReply.id` that send again
            returned; for a cancel's events, the cancel's id.
        craft:
          type: string
          x-sitrep-unit: id
          description: The craft the command's lane runs to.
        laneSeq:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            The command's place on its lane, the ordered run of delayed commands one
            command centre sends to one craft, as `PendingUplink.laneSeq`. Null for a
            command that never took a place on a lane: a continuous input dropped where
            it would have waited.
        kind:
          description: What happened.
          allOf:
            - $ref: "#/components/schemas/JourneyEventKind"
              x-sitrep-unit: enum
        at:
          type: string
          x-sitrep-unit: id
          description: The node that made the report, as a roster or vessel id.
        atUt:
          type: number
          x-sitrep-unit: ut
          description: When the thing it reports happened, at that node.
        untilUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            For a hold, when the node predicts the command will leave; for a departure,
            when it lands; for a late cancel, when the command ran or left. Null
            otherwise.
        detail:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: A short reason, for a discard or a late cancel. Null otherwise.
        missing:
          type: array
          items:
            type: number
            x-sitrep-unit: count
          description: |-
            For a waiting report, the places on the lane (see
            `CommsJourneyEvent.laneSeq`) of the earlier commands the craft is still
            missing. Empty otherwise.
    CommsLink:
      type: object
      description: |-
        The `comms.link` payload: the one statement a client should read for "is
        there a control link home right now?". Read `comms.link.connected` for that
        question rather than any raw `comms.*` observation such as
        `CommsConnectivity`.

        **Delayed, and never frozen.** This channel is what reports a signal-loss
        freeze, so it keeps arriving through one. It reports a disconnect one signal
        delay after it happens and goes on reporting `connected:false` through the
        blackout, so a "no signal" indicator changes at the right delayed instant.
        The `VesselComms` readings (signal strength, control state) are delayed too,
        but do freeze: they hold their last value through the outage.
      required:
        - connected
        - meta
      properties:
        connected:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True while the active vessel has a control link home, as of one signal delay
            ago; false through a blackout.
        meta:
          description: The payload's provenance (`"vessel:<guid>"` or `"game"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    CommsMeasuredPath:
      type: object
      description: |-
        A path a vessel's radio reported a strength on, as the nodes it runs
        through. It is the path the game had the vessel on when the radio was read,
        which may not be the active route.
      required:
        - nodes
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/CommsNetworkNode"
          description: |-
            The vessel first, then the far end of each hop in order. A ground station is
            named by its own name, and a vessel as the receiving command centre last
            heard it named. One node, the vessel alone, means the radio reported a
            strength and named no route.
    CommsNetwork:
      type: object
      description: |-
        The `comms.network` payload: the nodes and edges of the active route as it
        stands now, which is `comms.path` in graph form with each node named. The
        graph is empty when the centre knows of no open path.

        As with `comms.path`, each command centre is sent its own, made from what
        that centre has heard.
      required:
        - nodes
        - edges
        - meta
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/CommsNetworkNode"
          description: Every node in the graph, each `CommsNetworkNode.id` once. Never null.
        edges:
          type: array
          items:
            $ref: "#/components/schemas/CommsNetworkEdge"
          description: Every edge in the graph. Never null.
        meta:
          description: The payload's provenance (`"vessel:<guid>"` or `"game"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    CommsNetworkEdge:
      type: object
      description: |-
        One edge in the `CommsNetwork` relay graph, joining two
        `CommsNetworkNode.id` values.
      required:
        - a
        - b
        - active
      properties:
        a:
          type: string
          x-sitrep-unit: id
          description: The `CommsNetworkNode.id` of the end nearer the vessel.
        b:
          type: string
          x-sitrep-unit: id
          description: The `CommsNetworkNode.id` of the end nearer home.
        active:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when the edge carries the vessel's path. Only the path's own edges are
            sent, so every edge is true.
    CommsNetworkNode:
      type: object
      description: |-
        One node in the `CommsNetwork` relay graph. `CommsNetworkNode.displayName`
        carries the label and `CommsNetworkNode.kind` carries home-ness, so nothing
        has to read meaning out of `CommsNetworkNode.id`.
      required:
        - id
        - displayName
        - kind
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            A unique, stable join key in the same id space `CommsHop.from` and
            `CommsHop.to` use: a vessel's persistent id for a craft, the station's own
            name for a ground station. Never a vessel's display name, which two craft
            can share.
        displayName:
          type: string
          x-sitrep-unit: text
          description: |-
            The node's human-facing name: the vessel's name as the receiving centre last
            heard it, or the ground station's. The node's `CommsNetworkNode.id` when no
            name is known.
        kind:
          description: "`CommsHopKind.Home` for a ground station, `CommsHopKind.Relay` for a vessel."
          allOf:
            - $ref: "#/components/schemas/CommsHopKind"
              x-sitrep-unit: enum
    CommsNextLoss:
      type: object
      description: |-
        When the active craft is next predicted to drop out of contact with one
        command centre, on `comms.nextLoss`: the first moment its contact plan has
        no open route between the two, relays included.

        A prediction, and the receiving centre's own, made over the `comms.contacts`
        plan that centre holds. A craft held in contact by one relay after another
        stays in contact across a handover, so this is the end of the whole route
        and never the end of one window. The live link the game reports decides what
        actually gets through.

        Each session is sent only the figure of the centre it sits at.
      required:
        - basis
        - coveredToUt
        - lowConfidence
      properties:
        ut:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time the plan first has no open route between the centre and
            the active craft, or null when none is predicted: see `CommsNextLoss.basis`
            for which.
        basis:
          type: string
          x-sitrep-unit: enum
          description: |-
            What `CommsNextLoss.ut` rests on. One of `predicted-loss` (the plan closes
            the last open route at `CommsNextLoss.ut`), `no-loss-in-window` (in contact
            through `CommsNextLoss.coveredToUt`), `out-of-contact` (no route is open
            now; the craft's `trackingStation.catalog` entry says when it is expected
            back), `not-planned` (the centre holds no plan that includes the craft) or
            `no-craft` (there is no active craft).
        coveredToUt:
          type: number
          x-sitrep-unit: ut
          description: |-
            The last universal time the plan reaches. A null `CommsNextLoss.ut` with
            `no-loss-in-window` means no loss before it.
        lowConfidence:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True while an end of the route was last heard of with its orbit still
            changing, so the instant is a rough guide until its next report.
    CommsOcclusion:
      type: object
      description: |-
        The model of which bodies block a radio path, named, with its rule already
        applied to every celestial body the game knows about: each body's blocking
        radius. Always present, and read from the comms mod in force.

        Not delayed by signal delay: it is not an observation of the vessel but the
        solar system's geometry and the rule the comms model in use applies to it.

        Effectively static within a session: the body set does not change and the
        multipliers change only if the player edits the difficulty settings. An
        unchanged declaration is not re-sent, so the channel costs a keyframe and
        nothing else.
      required:
        - modelId
        - modelName
        - bodies
      properties:
        modelId:
          type: string
          x-sitrep-unit: id
          description: |-
            The id of the occlusion model in use; `"unknown"` when no comms model is in
            use.
        modelName:
          type: string
          x-sitrep-unit: text
          description: |-
            The occlusion model's display name, so a UI can say which geometry is in
            play.
        bodies:
          type: array
          items:
            $ref: "#/components/schemas/CommsOcclusionBody"
          description: |-
            Every known celestial body, with the model applied. Empty before the game
            has populated a body list, never null.
    CommsOcclusionBody:
      type: object
      description: |-
        One body's occlusion geometry, as the comms model in use resolves it.
        `CommsOcclusionBody.index` matches `BodyEntry.Index` on
        `trackingStation.bodies` (both are `CelestialBody.flightGlobalsIndex`), so a
        consumer joins the two without name-matching.

        Both radii ride the wire: `CommsOcclusionBody.radiusMeters` is what the rock
        measures and `CommsOcclusionBody.occludingRadiusMeters` is what the backend
        treats it as. Carrying both keeps the difference visible (and the multiplier
        derivable) without asking any consumer to apply one.
      required:
        - index
        - radiusMeters
        - hasAtmosphere
        - occludingRadiusMeters
      properties:
        index:
          type: number
          x-sitrep-unit: id
          description: |-
            The body's `CelestialBody.flightGlobalsIndex`: the join key onto
            `BodyEntry.Index` in `trackingStation.bodies`.
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The body's name, e.g. `"Kerbin"`; `null` when unread. Display only: join on
            `CommsOcclusionBody.index`.
        radiusMeters:
          type: number
          x-sitrep-unit: m
          description: |-
            The body's own mean radius (`CelestialBody.Radius`). `0` when the radius has
            not been read yet, and then `CommsOcclusionBody.occludingRadiusMeters` is
            `0` too: the body blocks nothing.
        hasAtmosphere:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the body has an atmosphere, which selects the multiplier a
            scaled-radius model applies. `false` when unread.
        occludingRadiusMeters:
          type: number
          x-sitrep-unit: m
          description: |-
            What the comms model in use treats as blocking a radio path through this
            body.
    CommsPath:
      type: object
      description: |-
        The `comms.path` payload: the route the active vessel's samples take to the
        receiving command centre. Ordered hops from the active vessel to the
        receiving centre itself, or, for the home centre, to whichever ground
        station the signal reaches first. An empty `CommsPath.hops` means the centre
        knows of no path that is open all the way now, which includes a path that
        would have the signal wait at a relay (`comms.route` says where it would
        wait).

        Each command centre is sent its own, and no other centre's. Where the game
        routes the vessel's samples to the centre (at home, the vessel's own path to
        the ground), the hops are that route, the one `comms.delay` and the arrival
        of every sample are timed over. Where the game states no route, they are
        worked out from that centre's contact plan, which is made of what the centre
        has heard of each craft, so a hop changes here only once the news of it has
        reached the centre: a relay that drops out is still on the path until its
        silence has crossed to you. Predictions (`comms.route`, held commands,
        cancel deadlines) are always the plan's. Nothing is sent until the centre
        has a contact plan or a game route, so the topic is absent, not empty, for
        the first moments of a session.

        The route sent here is the active route: the route this command centre has
        the active vessel on. The other comms topics use the term in this sense.

        Not reckonable: a route changes in steps (a relay drops below the horizon
        and the whole chain re-solves to different hops), and every reckoning basis
        moves a continuous quantity.
      required:
        - hops
      properties:
        hops:
          type: array
          items:
            $ref: "#/components/schemas/CommsHop"
          description: |-
            The hops in order, the first starting at the active vessel and the last
            ending at the receiving centre, or at a ground station for the home centre.
            Empty when the centre knows of no open path, never null.
    CommsRetargetWindow:
      type: object
      description: |-
        A stretch in which a node could turn an idle dish to a peer to carry a
        message.
      required:
        - node
        - dish
        - peer
        - openUt
        - closeUt
      properties:
        node:
          type: string
          x-sitrep-unit: id
          description: The node that would turn, in the `commandCentre.roster` vocabulary.
        dish:
          type: string
          x-sitrep-unit: id
          description: The dish it would turn, as `"<nodeId>#<partPersistentId>/<ordinal>"`.
        peer:
          type: string
          x-sitrep-unit: id
          description: The node it would turn the dish to.
        openUt:
          type: number
          x-sitrep-unit: ut
          description: When the turn may start.
        closeUt:
          type: number
          x-sitrep-unit: ut
          description: When the turned dish must be back on its own aim.
    CommsRoute:
      type: object
      description: |-
        The route from one node to another for a message sent at
        `CommsRoute.sentUt`.
      required:
        - from
        - to
        - sentUt
        - live
        - holds
      properties:
        from:
          type: string
          x-sitrep-unit: id
          description: |-
            Where the message leaves from, in the `commandCentre.roster` vocabulary:
            `"ground:<name>"` or `"vessel:<guid>"`.
        to:
          type: string
          x-sitrep-unit: id
          description: Where it is going, in the same vocabulary.
        sentUt:
          type: number
          x-sitrep-unit: ut
          description: The send instant the route was planned for.
        arrivalUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the message would arrive, waits included, or `null` when no route is
            predicted before the plan's horizon.
        live:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether every hop leaves the moment the message reaches its node, so nothing
            would wait anywhere. False when there is no route.
        holds:
          type: array
          items:
            $ref: "#/components/schemas/CommsRouteHold"
          description: |-
            Every node the message would wait at, in route order: where it is held, when
            it gets there and when it is predicted to leave. Empty for a live route and
            for no route. The sender itself is the first hold when the message has to
            wait before its first hop.
    CommsRouteHold:
      type: object
      description: |-
        One stretch a routed message would spend held at a node, waiting for its
        next window.
      required:
        - at
        - arriveUt
        - departUt
      properties:
        at:
          type: string
          x-sitrep-unit: id
          description: The node holding it, in the `commandCentre.roster` vocabulary.
        arriveUt:
          type: number
          x-sitrep-unit: ut
          description: When the message reaches the node, or is sent from it.
        departUt:
          type: number
          x-sitrep-unit: ut
          description: When it is predicted to leave on its next hop.
    CommsRoutes:
      type: object
      description: |-
        The route a message sent now would take between one command centre and the
        active craft, in both directions, predicted from that centre's own contact
        plan: the earliest arrival over every relay, waiting at a node for its next
        window where that arrives sooner.

        A prediction, and the receiving centre's own: it is planned over the
        `comms.contacts` plan that centre holds, so it knows of nothing the centre
        has not heard. The live link the game reports decides what actually gets
        through.

        Every ground station is the home centre's own antenna. Its rows run through
        whichever station reaches the craft first, as its `comms.path` does, and a
        wait for a station's window is a wait at the home centre itself. Every other
        centre is quoted its own antenna only.

        Each session is sent only the rows of the centre it sits at, the two between
        that centre and the active craft.
      required:
        - routes
      properties:
        routes:
          type: array
          items:
            $ref: "#/components/schemas/CommsRoute"
          description: One row per direction between a command centre and the active craft.
    CommsSignal:
      type: object
      description: |-
        The `comms.signal` payload: the active vessel's own reading of its link,
        from the comms backend in use (stock CommNet, or a replacement an Uplink
        provides). A strength from 0 to 1 whose meaning depends on the backend:
        stock CommNet reports KSP's own signal strength for the path, which falls
        off smoothly towards the range edge of each link and is multiplied across
        relays, RealAntennas how far up its data-rate ladder the path's links close.
        `CommsSignal.quantity` says which, so a client names the figure correctly
        and does not compare two that are different quantities.

        Each command centre is sent its own, the newest reading to have reached it.
        A reading is of the vessel's whole path at one instant, so it reaches a
        centre no sooner than light leaving the farthest node on that path at that
        instant could: it never tells a centre what a relay's link is doing before
        the relay's own light has. Absent until the first reading arrives. The path
        it was measured over is the game's, which is not always the active route on
        `comms.path`.

        A save with the stock CommNet difficulty option off models no link budget at
        all, so `CommsSignal.strength` is null there and `CommsSignal.quantity` is
        `SignalQuantity.NoModel`.
      required:
        - quantity
        - modelled
        - otherPath
      properties:
        strength:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            Link strength from 0 to 1, in the backend's own terms (see this type's
            summary), so compare values only within one install. Null when no link state
            could be read, and where no link budget is modelled.
        quantity:
          description: |-
            Which quantity `CommsSignal.strength` is: KSP's signal strength for the
            path, a position on the data-rate ladder, or a stand-in where no link is
            modelled. A strength worked out for a path carries the quantity its hops
            were stated in, and `SignalQuantity.Unknown` where they disagree.
          allOf:
            - $ref: "#/components/schemas/SignalQuantity"
              x-sitrep-unit: enum
        modelled:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether `CommsSignal.strength` is worked out and not measured. A command
            centre is sent the strength of the active route. Where the active vessel's
            radio last reported on the active route itself, the reported strength is
            sent and this is false. Where it reported on another route, or has not
            reported, the strength is what the backend works out for the active route
            from what the centre has heard, and this is true. Where nothing can be
            worked out either, see `CommsSignal.otherPath`.
        otherPath:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether `CommsSignal.strength` was measured on a route other than the active
            route. The active vessel's radio reports the strength of whatever route the
            game has it on. Where that is not the active route and the comms backend can
            work nothing out for the active route, the reported strength is still sent,
            with this set, so it is never read as the active route's own. False whenever
            `CommsSignal.modelled` is true, and false for a centre that has no active
            route yet, which is sent the reported strength as it is.
        measuredPath:
          description: |-
            The route `CommsSignal.strength` was measured on, where that is not the
            active route. Set whenever `CommsSignal.otherPath` is true and null
            otherwise, so a client can name the route the figure belongs to beside the
            mark that says it is of another path. It is as old as the strength beside
            it, and names each vessel as the receiving centre last heard it named.
          anyOf:
            - $ref: "#/components/schemas/CommsMeasuredPath"
            - type: "null"
    ContractActionArgs:
      type: object
      description: |-
        Accept, decline or cancel a contract. Args shared by
        `career.contract.accept`/`decline`/`cancel`: the contract's stable
        `ContractID` as a string, the same id `career.status` publishes for each
        contract as `contracts[].id`. Which of the three verbs is valid depends on
        the contract's current state (accept/decline require an offered contract,
        cancel an active one); an out-of-state request comes back
        `CommandErrorCode.ModeUnavailable`.
      required:
        - contractId
      properties:
        contractId:
          type: string
          x-sitrep-unit: id
          description: |-
            The contract to act on: its KSP `ContractID` as a string, as
            `career.status`'s `contracts[].id` carries it.
    ControlFrame:
      type: object
      description: |-
        The frame the game's own navigation view is expressed in, which is what the
        player is looking at. A burn given relative to the control frame holds its
        direction fixed against this frame.

        This is not a widget's own read frame, which nothing else sees. It belongs
        to the game, there is one at a time, and it can be written as well as read
        (`SetControlFrameArgs`), so a command centre can put the player's view where
        a plan is being discussed.

        Bodies are named by `bodyName`, the key of every other body table on the
        wire, `trackingStation.bodies` included.

        A pulsating frame turns about two groups of bodies, and its origin is
        defined by the mass of each whole group, so the sets travel as well as the
        pair. `ControlFrame.primaryBodies` always leads with
        `ControlFrame.primaryBody`: take the heads for the pair, or the sets to
        compute the frame.

        The whole payload is `null` when the frame could not be read. With stock KSP
        the frame is always `ControlFrameKind.BodyCentredInertial` about the active
        vessel's reference body.
      required:
        - kind
      properties:
        kind:
          description: |-
            The kind of frame. `ControlFrameKind.Unspecified` for the target frame,
            which has no kind.
          allOf:
            - $ref: "#/components/schemas/ControlFrameKind"
              x-sitrep-unit: enum
        centreBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The `bodyName` the frame is centred on, or `null` when it has none. The
            rotating frames are defined by their pair rather than by a centre.
        primaryBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The `bodyName` a rotating frame turns about. `null` for the centred frames.
        secondaryBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The `bodyName` a rotating frame is anchored to. `null` for the centred
            frames.
        primaryBodies:
          type:
            - array
            - "null"
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            Every body on the primary side, by `bodyName`, leading with
            `ControlFrame.primaryBody`. `null` when the head is the whole side, never an
            empty array.
        secondaryBodies:
          type:
            - array
            - "null"
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            Every body on the secondary side, by `bodyName`, leading with
            `ControlFrame.secondaryBody`. `null` when the head is the whole side, never
            an empty array.
        targetFrameSelected:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            `true` when the frame is defined against the current target rather than
            against a body. This sits beside `ControlFrame.kind` rather than inside it.
            Closest approach is computed only in this frame, and apsides do not exist in
            it. `null` when the source did not say.
        targetId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The id of the target vessel the frame is defined against, when it is a
            target frame; otherwise `null`.
        settableFrames:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ControlFrameOption"
          description: |-
            Every frame `system.frame.set` can put the view in, each named exactly as
            the command takes it. Empty when the view cannot be moved at all, which is
            stock; `null` when the source did not say. Either way there is nothing to
            offer: a frame not listed here is one the command will refuse.
    ControlFrameKind:
      type: integer
      description: |-
        The kinds of reference frame a control frame can be: the five frame types an
        n-body physics mod offers, plus `ControlFrameKind.Unspecified`.

        This is a superset of the frames a widget can draw in, which cover three of
        these. A control frame outside that subset is a real state, not an error: a
        widget set to follow the control frame then resolves to nothing.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Unspecified
          description: |-
            No kind was stated, including for the target frame (see
            `ControlFrame.targetFrameSelected`).
        - const: 1
          title: BodyCentredInertial
          description: Centred on a body, axes fixed against the stars.
        - const: 2
          title: BodyCentredBodyDirection
          description: |-
            Centred on a body, one axis held towards another body: the frame a widget's
            read frame calls "parent direction".
        - const: 3
          title: BarycentricRotating
          description: Turning with the barycentre of two bodies.
        - const: 4
          title: RotatingPulsating
          description: |-
            Turning with a pair of bodies and holding the separation of their two mass
            centres fixed, so a transfer between them draws the same shape whatever
            their current distance.
        - const: 5
          title: BodySurface
          description: Centred on a body and turning with its surface.
    ControlFrameOption:
      type: object
      description: |-
        One frame the navigation view can be put in, named the way
        `system.frame.set` takes it: send it back as the command's args unchanged.
        The pair is named by its heads, never by its sets.
      required:
        - kind
      properties:
        kind:
          description: The kind of frame. `ControlFrameKind.Unspecified` for the target frame.
          allOf:
            - $ref: "#/components/schemas/ControlFrameKind"
              x-sitrep-unit: enum
        centreBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The `bodyName` the frame is centred on, or `null` for the rotating frames.
        primaryBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The `bodyName` a rotating frame turns about. `null` for the centred frames.
        secondaryBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The `bodyName` a rotating frame is anchored to. `null` for the centred
            frames.
        targetFrameSelected:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            `true` for the target frame, which sits beside `ControlFrameOption.kind`
            rather than inside it.
    ControlState:
      type: integer
      description: |-
        KSP's `VesselControlState`, carried by name: what is controlling the vessel
        (a probe core, a kerbal) and how much control it has (none, partial, full).
        Mirrors the stock member names; `ControlState.Unknown` covers any name the
        mod does not recognise.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: None
          description: No control.
        - const: 1
          title: Probe
          description: Controlled by a probe core.
        - const: 2
          title: Kerbal
          description: Controlled by a kerbal.
        - const: 3
          title: Partial
          description: Partial control.
        - const: 4
          title: Full
          description: Full control.
        - const: 5
          title: ProbeNone
          description: A probe-controlled vessel with no control.
        - const: 6
          title: ProbePartial
          description: |-
            A probe-controlled vessel with partial control, typically without a
            connection home.
        - const: 7
          title: ProbeFull
          description: A probe-controlled vessel with full control.
        - const: 8
          title: KerbalNone
          description: A kerbal-controlled vessel with no control.
        - const: 9
          title: KerbalPartial
          description: A kerbal-controlled vessel with partial control.
        - const: 10
          title: KerbalFull
          description: A kerbal-controlled vessel with full control.
        - const: 11
          title: Unknown
          description: A state name the mod does not recognise.
    CrashFlightStats:
      type: object
      description: |-
        Per-flight statistics accumulated across the whole flight up to the crash,
        `CrashReport.flightStats`. Maxima and distances are sampled from the active
        vessel at the telemetry cadence, so they are approximate, and since the
        flight was last loaded: a quickload or a revert starts them again. A vessel
        that was never sampled, such as one that crashed while another was flown,
        reports null for every accumulated value; its mission time and lift-off are
        read at the crash.
      required:
        - flightEndMode
        - missionEnd
      properties:
        kerbalsKilled:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: Kerbals killed earlier in the flight (before the final crash).
        partsLost:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: Cumulative parts destroyed across the flight.
        flightEndMode:
          type: string
          x-sitrep-unit: text
          description: How the flight ended. Always `"CATASTROPHIC_FAILURE"` on a crash record.
        highestSpeedOverLand:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            The highest surface speed (`Vessel.srfSpeed`) reached while not splashed
            down, in m/s. Flight over water counts; only samples taken while splashed
            are excluded.
        missionEnd:
          type: boolean
          x-sitrep-unit: flag
          description: Whether the mission has ended. Always `true` on a crash record.
        highestGee:
          type:
            - number
            - "null"
          x-sitrep-unit: g
          description: The highest g-force (`Vessel.geeForce`) sampled during the flight, in g.
        highestAltitude:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            The highest altitude above sea level (`Vessel.altitude`) sampled during the
            flight, in metres.
        totalDistance:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Distance travelled relative to the surface, in metres: surface speed
            integrated over UT between samples. A gap of more than 10 s between samples
            (a warp jump, a quickload) is skipped rather than integrated.
        missionTime:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            Mission time (seconds since launch) at the crash, `Vessel.missionTime` read
            as it was destroyed.
        highestSpeed:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            The highest surface speed (`Vessel.srfSpeed`) sampled during the flight, in
            m/s.
        groundDistance:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Horizontal distance travelled over the surface, in metres: horizontal
            surface speed integrated over UT between samples, with the same 10 s gap
            rule as `CrashFlightStats.totalDistance`.
        liftOff:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            `true` once the vessel's mission clock has started, i.e. it has left the
            launch site, as read at the crash.
    CrashPartLost:
      type: object
      description: "One part lost in a crash: an entry of `CrashReport.partsLost`."
      required:
        - partId
        - partName
        - partTitle
        - msg
      properties:
        partId:
          type: number
          x-sitrep-unit: id
          description: The part's `flightID`.
        partName:
          type: string
          x-sitrep-unit: text
          description: The part's `partInfo.name` (e.g. `"mk1pod.v2"`).
        partTitle:
          type: string
          x-sitrep-unit: text
          description: The part's `partInfo.title` (e.g. `"Mk1 Command Pod"`).
        msg:
          type: string
          x-sitrep-unit: text
          description: "Destruction message for this part: often empty."
    CrashRecent:
      type: object
      description: |-
        The payload for the `crash.hasRecent` channel: one flag saying a notable
        crash is on record for the current save, published beside `CrashReport` on
        `crash.lastCrash` and reaching each command centre with it. It is true from
        the first crash a flight records and is not published before one.
      required:
        - recent
      properties:
        recent:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when a notable crash is on record, so `crash.lastCrash` has a report to
            read.
    CrashReport:
      type: object
      description: |-
        The last notable crash of the current save. A subscriber that joins late
        still receives the most recent record, since every value is delivered, in
        order. Every field is captured from the crashed vessel at the moment of the
        crash.

        It is the crashed craft's own report, so it reaches each command centre at
        the signal delay of that craft's link as of its last contact, whichever
        craft is being flown. A centre that had no route to the craft when it
        crashed is sent nothing; if it saw the craft go, its
        `trackingStation.catalog` lists the end, with when and how it learned of it,
        and nothing of the crew or the parts.
      required:
        - vesselId
        - eventKind
        - what
        - vesselType
        - msg
        - latitude
        - longitude
        - partsLost
        - body
        - flightStats
        - vesselName
        - events
        - kerbalsKilled
        - situation
        - crewAboard
        - altitude
        - ut
      properties:
        vesselId:
          type: string
          x-sitrep-unit: id
          description: The crashed vessel's stable id (`Vessel.id` as a string GUID).
        eventKind:
          type: string
          x-sitrep-unit: id
          description: "Which detector fired: `CrashSplashdown` / `Destroyed` / `Crash`."
        what:
          type: string
          x-sitrep-unit: text
          description: |-
            The colliding object's name (`EventReport.other`): empty for a non-collision
            death.
        vesselType:
          type: string
          x-sitrep-unit: id
          description: The crashed vessel's `VesselType` name (e.g. `"Ship"`).
        msg:
          type: string
          x-sitrep-unit: text
          description: "The detector's message (`EventReport.msg`): often empty."
        latitude:
          type: number
          x-sitrep-unit: °
          description: The vessel's latitude at the crash (`Vessel.latitude`), in degrees.
        longitude:
          type: number
          x-sitrep-unit: °
          description: The vessel's longitude at the crash (`Vessel.longitude`), in degrees.
        partsLost:
          type: array
          items:
            $ref: "#/components/schemas/CrashPartLost"
          description: Parts lost in the destroying event.
        body:
          type: string
          x-sitrep-unit: text
          description: Name of the body the crash happened on (`mainBody.bodyName`).
        flightStats:
          description: Per-flight statistics accumulated up to the crash.
          allOf:
            - $ref: "#/components/schemas/CrashFlightStats"
        vesselName:
          type: string
          x-sitrep-unit: text
          description: The crashed vessel's name (`Vessel.vesselName`); empty when KSP had none.
        events:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            The vessel's flight-event log (liftoff, staging, the crash line), oldest
            first, each line `[HH:MM:SS]: message` stamped with mission time. Holds at
            most the 200 most recent lines.
        kerbalsKilled:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: "Names of the kerbals lost in this crash: everyone aboard at the crash."
        situation:
          type: string
          x-sitrep-unit: text
          description: |-
            The vessel's flight situation at the crash (`Vessel.Situations` name, e.g.
            `"FLYING"`).
        crewAboard:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: Names of the crew aboard at the crash.
        altitude:
          type: number
          x-sitrep-unit: m
          description: |-
            The vessel's altitude above sea level at the crash (`Vessel.altitude`), in
            metres.
        ut:
          type: number
          x-sitrep-unit: ut
          description: When the crash was captured, in UT seconds.
    CrewMember:
      type: object
      description: |-
        One crew member aboard the active vessel, in `VesselCrew.crew`, from KSP's
        `ProtoCrewMember`. Every field is nullable: an absent value is null, never a
        sentinel.
      properties:
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The kerbal's name (`ProtoCrewMember.name`), which is also their roster key.
        trait:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The kerbal's career trait (`ProtoCrewMember.trait`), e.g. `"Pilot"`,
            `"Engineer"`, `"Scientist"` or `"Tourist"`.
        experienceLevel:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            The kerbal's experience level (`ProtoCrewMember.experienceLevel`), 0 to 5 in
            stock.
        type:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The kerbal's `KerbalType` member name: `"Crew"`, `"Tourist"`, `"Applicant"`
            or `"Unowned"` in stock.
        rosterStatus:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The kerbal's `RosterStatus` member name: `"Available"`, `"Assigned"`,
            `"Dead"` or `"Missing"` in stock. A kerbal aboard a vessel is normally
            `"Assigned"`.
        carrying:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/InventoryItem"
          description: |-
            What this kerbal is personally carrying, from their own
            `ModuleInventoryPart`.

            Distinct from `vessel.inventory`, which is what is aboard and where. This is
            what this kerbal, with the trait and experience level above, has to hand for
            a job right now without anything being fetched first.

            Null when the crew source could not read inventories at all, which is not
            the same as an empty list, meaning they are carrying nothing.
        slots:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            The kerbal's own slot count, stock default 2, one of which usually holds a
            parachute.
        packedVolumeLimit:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Their packed-volume limit, stock default 40, in KSP's own cargo-volume unit:
            a number with no physical dimension. A repair kit takes 5 of it, so this is
            what actually bounds how many kits they can carry.
        packedVolumeUsed:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Packed volume they are currently using, same unit as the limit.
    CrewRosterEntry:
      type: object
      description: |-
        One kerbal in the `spaceCenter.crewRoster` channel (the hired-crew roster:
        KSP's `KerbalRoster.Crew`, owned crew that is either available or currently
        assigned to a mission), and the same shape for every entry in
        `AstronautComplexInfo.applicants`: one shape for a kerbal whether hired or
        still a candidate.

        The `spaceCenter.crewRoster` channel is a bare array of these entries, one
        per crew member keyed by `CrewRosterEntry.name`. The whole payload is `null`
        (not an empty array) when no sample has arrived yet, which tells "no data
        yet" apart from "zero crew".

        Kept at the home command centre, like `LaunchSiteEntry`: the one that holds
        the career ledger, so a screen working from another command centre sees a
        change after the signal delay from home.
      properties:
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Kerbal name (`ProtoCrewMember.name`): the id the hire command resolves
            against the live applicant pool.
        trait:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Specialisation (`ProtoCrewMember.trait`):
            `"Pilot"`/`"Engineer"`/`"Scientist"`/`"Tourist"`.
        experienceLevel:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Experience level (`ProtoCrewMember.experienceLevel`), 0 to 5 (0 for a fresh
            applicant).
        available:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the kerbal can be assigned to a flight today.

            **Branch on this for a yes or no.** It is derived from
            `CrewRosterEntry.standing`: only `Available` and `Applicant` can fly, so a
            standing added to `CrewStanding` later reads as unavailable here. An
            applicant counts as free because nothing blocks hiring one, but it is not
            yet crew: check `CrewRosterEntry.isApplicant` before offering one a flight.

            A mod that knows better about a kerbal's availability, such as a career mod,
            may set it outright.
        unavailableReason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Why the kerbal can't fly, in prose: `Assigned` reads "On mission", `Resting`
            reads "Standing down", and every other blocking standing reads its own name.
            Empty string when `CrewRosterEntry.available` is true. A mod that knows
            better may set the wording.

            **No date, ever.** The end is on `CrewRosterEntry.standingEndsAtUt` as a
            `ut` value, so the client formats it in its own calendar. This is the only
            text on the payload written as a sentence by the mod, so a client cannot
            reformat it.
        standing:
          description: |-
            The kerbal's standing, as the dashboard means it: the field to branch on.
            The reading of a mod that supplies its own where there is one, otherwise
            Gonogo's own rule applied to every axis KSP exposes (roster status,
            applicant and the stand-down flag).

            The roster status alone is not enough: an applicant has none, and a kerbal
            standing down still reads `Available` there. See `CrewStanding`.
          anyOf:
            - $ref: "#/components/schemas/CrewStanding"
              x-sitrep-unit: enum
            - type: "null"
        standingEndsAtUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the kerbal's unavailability lapses, as universal time: the rest
            period's end for `Resting`, or whatever end the crew mod in use quotes.
            Absent when there is no scheduled end, which is most of the time.

            Read with `CrewRosterEntry.unavailableReason` to say why a kerbal cannot fly
            and until when. The two are separate fields so the client formats the date
            in its own calendar.
        situation:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            `CrewRosterEntry.standing`'s display label: its enum name, or `"Applicant"`
            for a hireable candidate. Text for an operator, never a branch: compare
            `CrewRosterEntry.standing` instead.
        situationOrdinal:
          description: |-
            KSP's own ordinal: `(int)ProtoCrewMember.rosterStatus`, typed to
            `KspRosterStatus`, whose members mirror KSP's numbering.

            The game's field, unchanged; Gonogo's crew commands check against it. It is
            not the field to branch on: it reads `Available` for a kerbal standing down.
            Branch on `CrewRosterEntry.standing`.

            `null` for an applicant, and that is a real distinction rather than a
            missing value: an applicant is not in the roster, so it has no
            `RosterStatus` at all, and `CrewRosterEntry.standing` carries
            `CrewStanding.Applicant` instead. Use `CrewRosterEntry.isApplicant` to tell
            the two apart. Also `null` when the capture carried no status.
          anyOf:
            - $ref: "#/components/schemas/KspRosterStatus"
              x-sitrep-unit: enum
            - type: "null"
        inactive:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the kerbal is standing down rather than on duty
            (`ProtoCrewMember.inactive`): KSP's own field, published beside the derived
            standing the way `CrewRosterEntry.situationOrdinal` is.

            **Not the field to branch on.** It is one input to
            `CrewRosterEntry.standing`: a kerbal standing down has roster status
            `Available`, and this flag is what turns that into `CrewStanding.Resting`
            with `CrewRosterEntry.available` false. Present on every install.
        inactiveUntilUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the stand-down ends (`ProtoCrewMember.inactiveTimeEnd`), as universal
            time. Absent when `CrewRosterEntry.inactive` is false, because the field
            then holds the end of an earlier rest that is already over.
        isApplicant:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether this entry is a hireable candidate (`ProtoCrewMember.type ==
            KerbalType.Applicant`) rather than owned crew. Carried so a client never has
            to recognise the `"Applicant"` spelling of `CrewRosterEntry.situation` to
            know which channel it is reading.
        courage:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: Courage, 0 to 1 (`ProtoCrewMember.courage`), fixed when the kerbal is hired.
        stupidity:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            Stupidity, 0 to 1 (`ProtoCrewMember.stupidity`), fixed when the kerbal is
            hired.
        experience:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Raw experience points (`ProtoCrewMember.experience`), 0 for a fresh
            applicant.
        experienceLevelDelta:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            Progress toward the next rank, 0 to 1 (the computed
            `ProtoCrewMember.ExperienceLevelDelta`); `1` at max rank (5).
        roleDescription:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The role's stock tooltip description
            (`ProtoCrewMember.experienceTrait.Description`): the exact string the
            in-game Astronaut Complex shows, sourced from `Traits.cfg`.
        descriptionEffects:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The role's current-rank effects text
            (`ProtoCrewMember.experienceTrait.DescriptionEffects`): rank-aware, it
            changes as the kerbal is promoted. Reflects this kerbal's own rank today
            only; there is no fetchable "effects at another rank" preview.
    CrewStanding:
      type: integer
      description: |-
        What a kerbal's place on the books is, as the dashboard means it: this
        contract's own vocabulary, not a mirror of any game enum.

        The roster-status members line up with `KspRosterStatus` in meaning but not
        in numbering, so never cast one to the other. `CrewStanding.Applicant` is a
        standing KSP expresses as a KerbalType rather than a RosterStatus, and it
        sits in one enumeration with the rest so "what is this kerbal's standing" is
        one value.

        Behind `spaceCenter.crewRoster[].standing`, and it is the field to branch
        on; see `CrewRosterEntry.situationOrdinal` for what the raw KSP ordinal
        beside it is still good for.

        **Order.** The numbering is the reading order: sorted by value, a crew list
        reads free to fly, then committed, then off the books. A new member is
        inserted at its place in that order rather than appended, so a member's
        number can change between versions: never store or compare a raw number,
        compare members by name through the generated enum.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Unknown
          description: |-
            No backend could say. Distinct from every member below, and never a stand-in
            for one: a roster entry for which the game reported no roster status at all
            gets this rather than guessing at Available.
        - const: 1
          title: Applicant
          description: A hireable candidate, not yet on the books.
        - const: 2
          title: Available
          description: On the books and free to fly.
        - const: 3
          title: Assigned
          description: On the books and currently crewing a vessel.
        - const: 4
          title: Resting
          description: |-
            On the books, standing down after a flight, and not assignable until the
            rest period ends. `CrewRosterEntry.standingEndsAtUt` carries its end.

            Derived from KSP's own `ProtoCrewMember.inactive`, so the stock backend
            reports it and every install gets it.
        - const: 5
          title: Dead
          description: "Killed: KSP's own `Dead` roster status."
        - const: 6
          title: Missing
          description: |-
            Missing: KSP's own `Missing` roster status, kept separate from
            `CrewStanding.Dead`.
    DeactivateStrategyArgs:
      type: object
      description: |-
        Deactivate an active strategy. Takes the strategy's stable
        `StrategyConfig.Name` id (see `ActivateStrategyArgs.strategyId`).
      required:
        - strategyId
      properties:
        strategyId:
          type: string
          x-sitrep-unit: id
          description: |-
            The active strategy to deactivate: its `StrategyConfig.Name`, as
            `career.status`'s `strategies[].id` carries it.
    DeployedEntry:
      type: object
      description: |-
        One entry in the `deployed.bases` Topic payload: a Breaking Ground
        deployed-science experiment, a science instrument set down on the surface.
        The Topic payload is a bare array (`DeployedEntry[]`) or `null` when
        Breaking Ground is not installed and no loaded vessel carries a deployed
        experiment.

        Unlike the `science.*` channels, `deployed.bases` covers the whole save, not
        just the active vessel: a deployed cluster is its own ground vessel, so an
        entry normally describes a vessel other than the active one, named by
        `DeployedEntry.vesselName`. An experiment on a vessel that is not loaded is
        read from Breaking Ground's cluster registry and carries no power or
        connection sentence. One that belongs to no cluster is listed only while its
        vessel is loaded.

        Every field is nullable, and is `null` whenever the raw value is absent or
        could not be read.
      properties:
        vesselName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Name of the vessel carrying the experiment (KSP's `Vessel.vesselName`). A
            deployed cluster is its own vessel, so this is normally not the active
            vessel's name.
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Display title of the experiment part (the part's `partInfo.title`, or its
            internal name when that is missing).
        body:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Name of the body the carrying vessel orbits or sits on (its orbit's
            reference body). `null` when the vessel has no orbit.
        situation:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The carrying vessel's situation, KSP's `Vessel.situation` enum name (for
            example `LANDED`).
        biome:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Biome at the carrying vessel's current position on `DeployedEntry.body`.
            `null` when the body has no biome map.
        experimentId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The experiment's id (KSP's `ModuleGroundExperiment.experimentId`).
        scienceCompletedPercentage:
          type:
            - number
            - "null"
          x-sitrep-unit: "%"
          description: |-
            How far the experiment has progressed, in percent (KSP's
            `ModuleGroundExperiment.ScienceCompletedPercentage`).
        scienceTransmittedPercentage:
          type:
            - number
            - "null"
          x-sitrep-unit: "%"
          description: |-
            How much of the experiment's science has been transmitted, in percent (KSP's
            `ModuleGroundExperiment.ScienceTransmittedPercentage`).
        scienceValue:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            The science value KSP reports for the experiment
            (`ModuleGroundExperiment.ScienceValue`).
        scienceLimit:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            The experiment's science limit as KSP reports it
            (`ModuleGroundExperiment.ScienceLimit`). Compare against
            `DeployedEntry.scienceValue`.
        powerState:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            `ModuleGroundSciencePart.PowerState` verbatim: KSP's own words for the power
            state, for display. Do not branch on this.

            It is not an enum name, it is localised prose. The module assigns it from
            `Localizer` in `UpdateModuleUI()`, so the value is in whatever language the
            player runs KSP in, and it is only written when the part action window
            refreshes, so it can be a held value. `DeployedEntry.power` is the field to
            read.
        connectionState:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            `ModuleGroundSciencePart.ConnectionState` verbatim, for display. Localised
            prose on the same terms as `DeployedEntry.powerState`; read
            `DeployedEntry.controllerConnected` instead.
        power:
          description: |-
            The cluster's power state, derived from the same facts `UpdateModuleUI()`
            itself branches on (`DeployedScienceCluster.IsPowered` and
            `.ControllerPartEnabled`, the module's `Enabled` and `DeployedOnGround`)
            rather than parsed out of the sentence that method writes. This is the field
            to branch on, not `DeployedEntry.powerState`.

            `null` when the cluster could not be read at all, which is a third state and
            must not be read as either powered or unpowered.
          anyOf:
            - $ref: "#/components/schemas/DeployedPowerState"
              x-sitrep-unit: enum
            - type: "null"
        controllerConnected:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the experiment is attached to a controller cluster at all, the fact
            behind `DeployedEntry.connectionState`'s "Connected"/"Not Connected". `null`
            when it could not be determined.
        powerAvailable:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Power units the cluster's parts produce
            (`DeployedScienceCluster.PowerAvailable`), against
            `DeployedEntry.powerRequired`. Breaking Ground's own integral power scale
            summed over the cluster's parts: not electric charge, and not a rate.
            Available at or above required is what makes the cluster powered.

            `null` when the cluster could not be read, on the same terms as
            `DeployedEntry.power`. Zero is a real reading a live cluster holds while its
            panels are dark, so it must not stand in for absence.
        powerRequired:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Power units the cluster's parts require
            (`DeployedScienceCluster.PowerRequired`). Same scale and same null rule as
            `DeployedEntry.powerAvailable`, the demand side of the balance.
        deployedOnGround:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the experiment part is deployed on the ground (KSP's
            `ModuleGroundSciencePart.DeployedOnGround`).
    DeployedPowerState:
      type: integer
      description: |-
        A deployed-science cluster's power state, defined by this contract rather
        than by KSP.

        KSP has no enum for this. `ModuleGroundSciencePart` carries the state as a
        localised sentence, so this reproduces the five outcomes `UpdateModuleUI()`
        distinguishes, derived from the booleans it reads rather than from the
        sentence it writes. It is an ordinal on the wire and a closed union on the
        client like every other enum in this contract.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Powered
          description: "Powered and working: the cluster reports `IsPowered`."
        - const: 1
          title: Unpowered
          description: Deployed and switched on, but the cluster has no power.
        - const: 2
          title: ControllerDisabled
          description: The cluster's controller is switched off, so nothing is powered.
        - const: 3
          title: Disabled
          description: This experiment is switched off, or is not deployed on the ground.
        - const: 4
          title: NotConnected
          description: |-
            Attached to no cluster at all. Distinct from `DeployedPowerState.Unpowered`:
            there is nothing to supply power, rather than a supply that is empty.
    DockAlignment:
      type: object
      description: |-
        The relative position, velocity and coarse orientation between the active
        vessel's nearest free (undocked) docking port and the targeted docking port,
        for docking-alignment widgets. The whole payload is absent when docking is
        not relevant right now: nothing is targeted, the target is not a docking
        port, or the active vessel has no free port. It is never an old or
        zero-distance placeholder record, the same convention as `VesselTarget`.

        `DockAlignment.forwardDot` is the dot product of the two ports' forward
        (docking-axis) vectors: -1 means the ports face each other head-on (the
        alignment a dock needs), +1 means they point the same way. It is the raw dot
        product, so how to show it (for example as a percentage) is up to the
        widget.
      required:
        - relativePosition
        - relativeVelocity
        - distance
        - meta
      properties:
        relativePosition:
          type: object
          description: |-
            The target port's position relative to the own port (target minus own),
            metres.
          required:
            - x
            - y
            - z
          properties:
            x: &a1
              type: number
              x-sitrep-unit: m
            y: *a1
            z: *a1
        relativeVelocity:
          type: object
          description: The target port's velocity relative to the own port, m/s.
          required:
            - x
            - y
            - z
          properties:
            x: &a2
              type: number
              x-sitrep-unit: m/s
            y: *a2
            z: *a2
        distance:
          type: number
          x-sitrep-unit: m
          description: |-
            Metres: `DockAlignment.relativePosition`'s magnitude, provided directly so a
            widget does not have to derive it every frame.
        forwardDot:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Dot product of the own port's and target port's forward vectors, -1..1: -1
            facing head-on, +1 pointing the same way. Null only when either port's
            transform was unavailable this tick.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    ErrorMsg:
      type: object
      description: |-
        A request the mod could not carry out: a frame it could not read, an unknown
        command, a command whose provider has stopped working, a result or payload
        that could not be written, a subscription to a Topic nothing declares, or a
        `set-vantage` naming a command centre that is not active. Nothing about the
        game was decided, so there is no game reason to report.

        A command the game refused is not an error: it ran and said no, and that
        arrives as a `command-response` whose result has `success: false` and an
        `errorCode` from `CommandErrorCode`. That vocabulary never appears here.

        `ErrorMsg.requestId` is set when the error is about a command, and
        `ErrorMsg.topic` when it is about a subscription. `ErrorMsg.code` is a
        `FaultCode`, whose full list gives the sentence an operator reads for each.
        A client's own transport adds its own members to the same field, and the mod
        never sends those.
      required:
        - type
        - code
        - message
      properties:
        type:
          type: string
          const: error
          x-sitrep-unit: id
          description: The frame type, always `"error"`.
        requestId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The id of the command request this error is about, or null.
        topic:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The Topic this error is about, or null.
        code:
          description: |-
            Which fault: always a fault, never a refusal, since a command the game
            refused gets a `command-response` instead.
          allOf:
            - $ref: "#/components/schemas/FaultCode"
              x-sitrep-unit: id
        message:
          type: string
          x-sitrep-unit: text
          description: |-
            The machinery's own account of what went wrong, for a log rather than an
            operator.
    EvaCrew:
      type: object
      description: |-
        Every kerbal currently outside a craft.

        The vessel Topics stay with the craft the kerbal left; this Topic carries
        what is true of the kerbal.

        An empty list is a real reading: nobody is outside. The Topic has no reading
        only until its first sample arrives.
      required:
        - count
        - kerbals
      properties:
        count:
          type: number
          x-sitrep-unit: count
          description: |-
            How many kerbals are outside, so a client need not count to know whether to
            draw anything.
        kerbals:
          type: array
          items:
            $ref: "#/components/schemas/EvaKerbal"
          description: One entry per kerbal on EVA. Never null; empty when nobody is outside.
    EvaKerbal:
      type: object
      description: |-
        One kerbal currently outside a craft, on the `eva.crew` channel.

        A kerbal on EVA is a vessel in KSP's model, with its own id, so it already
        appears on `trackingStation.catalog` and on its own per-craft Topics
        (`trackingStation.vessel.<guid>.link` and `.resources`). What is here and
        nowhere else is the suit: what it is carrying, what it can do, and whether
        the place it is standing in would kill the wearer without it.

        Every field is `null` when the value could not be read. Absence is never a
        zero: a kerbal whose propellant could not be read is not a kerbal with an
        empty tank.
      properties:
        kerbalVesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The kerbal's own vessel id, the same guid `trackingStation.catalog` carries
            for it.
        parentVesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The vessel id of the craft this kerbal stepped out of, or `null` when that
            is not known (the step-out was not recorded, or the craft has since gone).

            This is the vessel Gonogo goes on reporting as active while they are
            outside, so a client that follows the active vessel sees no discontinuity
            when a kerbal steps out.
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The kerbal's name, from the EVA vessel's `GetName()`.
        situation:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: KSP's own situation name for the kerbal (`FLYING`, `LANDED`, ...).
        propellantAmount:
          type:
            - number
            - "null"
          x-sitrep-unit: units
          description: EVA propellant remaining in the pack.
        propellantCapacity:
          type:
            - number
            - "null"
          x-sitrep-unit: units
          description: |-
            What the pack holds when full, so a client can draw a fraction without
            knowing the model.
        hasJetpack:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether this kerbal has a jetpack at all: without one the propellant figures
            describe nothing.
        jetpackDeployed:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the jetpack is switched on (KSP's `KerbalEVA.JetpackDeployed`).
        jetpackIsThrusting:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the pack is firing right now, which is the only signal that a kerbal
            is under thrust.
        onALadder:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the kerbal is on a ladder (KSP's `KerbalEVA.OnALadder`).
        lampOn:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the suit's helmet lamp is on (KSP's `KerbalEVA.lampOn`).
        visorState:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: KSP's own visor state name, from `KerbalEVA.VisorState`.
        willDieWithoutHelmet:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether removing the helmet here would kill this kerbal, from
            `KerbalEVA.WillDieWithoutHelmet()`.

            Nothing else on the wire says whether the place a kerbal is standing in is
            survivable without a helmet.
        canSafelyRemoveHelmet:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the helmet can come off here and now, from
            `KerbalEVA.CanSafelyRemoveHelmet()`. A stricter test than
            `EvaKerbal.willDieWithoutHelmet`.
        helmetUnsafeReason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's own words for why the helmet cannot come off, passed through verbatim
            from `KerbalEVA.HelmetUnsafeReason`, or `null` when it can.
    EventMsg:
      type: object
      description: |-
        Something that happened to a subscription, sent on the Topic it happened to.

        An event carries no payload of its own: `EventMsg.name` is the whole of what
        happened, and `EventMsg.meta` describes the delivery as it does on any other
        frame. The mod sends two names:

        - `subscribed` confirms a `subscribe`, once per subscribe. Wait for it
          rather than for the first `stream-data`: a channel with nothing to say yet
          sends the confirmation and then nothing. A `subscribe` to a channel
          nothing declares is answered with an `error` frame carrying `unknownTopic`
          and the topic instead
        - `timeline-reset` says the game quickloaded and time went backwards. It is
          sent for every Topic the connection holds, and anything built from frames
          before it should be discarded
      required:
        - type
        - topic
        - name
        - meta
      properties:
        type:
          type: string
          const: event
          x-sitrep-unit: id
          description: The frame type, always `"event"`.
        topic:
          type: string
          x-sitrep-unit: id
          description: The subscribed Topic the event happened to.
        name:
          type: string
          x-sitrep-unit: text
          description: "What happened: `subscribed` or `timeline-reset`."
        meta:
          description: The delivery metadata, as on any other frame.
          allOf:
            - $ref: "#/components/schemas/Meta"
        keyframeIntervalUt:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            On `subscribed`, the most game time the Topic's channel lets pass between
            two samples before it sends one unconditionally, even when the value has not
            changed. A client judges a quiet change-driven Topic as overdue only once it
            has been silent longer than this. Absent when the channel declares no
            keyframe cadence, and on `timeline-reset`; absent means unknown, never zero.
    ExperimentActionArgs:
      type: object
      description: |-
        Deploy or transmit a science experiment on a part. Args shared by every
        science-experiment actuation command (`science.experiment.deploy` and
        `science.experiment.transmit`): the experiment is named by
        `ExperimentActionArgs.partId`, the part's flight id as a string, the same id
        `science.instruments` carries on each experiment entry. It is looked up
        among the active vessel's parts, never by array index. An empty or unknown
        `ExperimentActionArgs.partId` fails with `CommandErrorCode.NotFound`.
      required:
        - partId
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The experiment's part, as its flight id in a string: the same id
            `science.instruments` keys its entries by. Resolved against the active
            vessel's parts; empty or unknown yields `CommandErrorCode.NotFound`.
    ExperimentBreakdownEntry:
      type: object
      description: |-
        One entry in the `science.experimentBreakdown` Topic payload: a per-subject
        rollup of the stored science results that `science.experiments` lists one
        row per result. One row per distinct subject id: several stored results for
        the same subject (for example two crew reports from the same biome) collapse
        into one entry with `ExperimentBreakdownEntry.dataMits` summed across them.

        The Topic payload is a bare array (`ExperimentBreakdownEntry[]`) or `null`,
        never a wrapper object. The whole array is `null` when there is no active
        vessel or the vessel holds no stored science data; there is no separate
        empty-array state. Every field is nullable, and is `null` whenever the raw
        value is absent or non-finite.

        `ExperimentBreakdownEntry.biome` and `ExperimentBreakdownEntry.situation`
        are parsed from the subject id by KSP's
        `ScienceUtil.GetExperimentFieldsFromScienceID`, not from the vessel's
        current position, so a subject collected earlier in the flight keeps its own
        biome and situation.
      properties:
        subjectId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The science subject id this row rolls up (KSP's `ScienceData.subjectID`),
            unique within the array. Joins to `ExperimentEntry.subjectId` and
            `ArchiveEntry.subjectId`.
        biome:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The biome part of `ExperimentBreakdownEntry.subjectId`: where the subject
            was collected, not where the vessel is now.
        situation:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The situation part of `ExperimentBreakdownEntry.subjectId` (a KSP
            `ExperimentSituations` name such as `SrfLanded`): the situation the subject
            was collected in, not the vessel's current one.
        expTitle:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Display title of the first stored result seen for this subject (KSP's
            `ScienceData.title`).
        dataMits:
          type:
            - number
            - "null"
          x-sitrep-unit: Mit
          description: |-
            Summed `ScienceData.dataAmount` (mits) across every stored result for this
            subject.
        remainingPotential:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            Absolute science still recoverable from this subject (`scienceCap - science`
            from R&D). `0` in Sandbox (no R&D) and when R&D holds no subject with this
            id.
        valueModel:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Which value model produced `ExperimentBreakdownEntry.remainingPotential`,
            and which unit `ExperimentBreakdownEntry.dataMits` is really in. See
            ScienceValueModels.

            Stock's rollup is a snapshot: one summed data figure and one "how much is
            left". A provider with a full per-subject ledger (collected vs retrieved,
            in-flight split, times completed) projects it down to those two and carries
            the ledger in `ExperimentBreakdownEntry.extensions`: stock's pair is a lossy
            view of the richer set, never the other way round.
        extensions:
          type:
            - object
            - "null"
          description: |-
            The provider-namespaced extension bag, per-subject-rollup half. Same
            mechanism and same rule as `ExperimentEntry.extensions`.
          additionalProperties: true
    ExperimentEntry:
      type: object
      description: |-
        One entry in the `science.experiments` Topic payload: a single stored
        science result on the active vessel, held either by the science module that
        collected it or by a container part. The channel payload is a bare array of
        these (`ExperimentEntry[]`) or `null`, never a wrapper object. The whole
        array is `null` when there is no active vessel or the vessel holds no stored
        science data; there is no separate empty-array state.

        One row per stored `ScienceData`: a module that holds no data produces no
        row (see `InstrumentEntry` for one row per module). Every field is nullable,
        and is `null` whenever the raw value is absent or non-finite.
      properties:
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Display title of the part holding the result (the part's `partInfo.title`,
            or its internal name when that is missing).
        location:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            "experiment" (still held by the science module that collected it) or
            "container" (already collected into an onboard science container). KSP keeps
            no "already transmitted" flag on a result, so this is the closest available
            "stored vs not yet collected" signal.
        experimentId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The collecting module's experiment id (KSP's
            `ModuleScienceExperiment.experimentID`, for example `crewReport`). `null` on
            a `"container"` row, where the result no longer sits in its experiment
            module.
        subjectId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The science subject this result was recorded against (KSP's
            `ScienceData.subjectID`), the join key into
            `ExperimentBreakdownEntry.subjectId` and `ArchiveEntry.subjectId`.
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The result's display title (KSP's `ScienceData.title`).
        dataAmount:
          type:
            - number
            - "null"
          x-sitrep-unit: Mit
          description: |-
            Size of the stored result in mits (KSP's `ScienceData.dataAmount`). `null`
            under a `ExperimentEntry.valueModel` whose data is not measured in mits.
        scienceValueRatio:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            KSP's `ScienceData.scienceValueRatio` for this result. Its meaning depends
            on `ExperimentEntry.valueModel`: do not compare it across models.
        baseTransmitValue:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            KSP's `ScienceData.baseTransmitValue` for this result. Its meaning depends
            on `ExperimentEntry.valueModel`.
        transmitBonus:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            Transmit-value multiplier for this result (KSP's
            `ScienceData.transmitBonus`), a bounded ratio.
        labValue:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            KSP's `ScienceData.labValue` for this result: its value to a Mobile
            Processing Lab. Its meaning depends on `ExperimentEntry.valueModel`.
        deployed:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the collecting experiment module is deployed (KSP's
            `ModuleScienceExperiment.Deployed`). `null` on a `"container"` row.
        inoperable:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the collecting experiment module is inoperable until reset (KSP's
            `ModuleScienceExperiment.Inoperable`). `null` on a `"container"` row.
        situation:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The active vessel's current situation, KSP's `Vessel.situation` enum name
            (for example `LANDED`, `ORBITING`). It describes where the vessel is now,
            not where the result was collected; the collection situation is encoded in
            `ExperimentEntry.subjectId`.
        valueModel:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Which value model produced `ExperimentEntry.scienceValueRatio`,
            `ExperimentEntry.baseTransmitValue` and `ExperimentEntry.labValue`, and
            which unit `ExperimentEntry.dataAmount` is really in. A token from
            ScienceValueModels, or one it does not list.

            This is the one field on the payload that is not simply "what the game
            says". A provider whose data is not in mits leaves
            `ExperimentEntry.dataAmount` null rather than putting another unit's figure
            in a mits-typed field, and carries the real figure in its own
            `ExperimentEntry.extensions` namespace.
        extensions:
          type:
            - object
            - "null"
          description: |-
            Per-experiment facts the science mod in use reports beyond this shape, keyed
            by that mod's name.

            Everything a richer science model knows that stock has no concept of belongs
            here: storage capacity, file-vs-sample, transmit rate, per-unit science
            rate. Absent from the payload when no provider filled it.
          additionalProperties: true
    FaultCode:
      type: string
      description: |-
        Why a command, or any other request, could not be carried: nothing about the
        game was decided. The refused/failed split is the kind of code, not a
        judgement a client makes: a refusal (`CommandErrorCode`) says the game said
        no, this says the machinery did not get that far, and a retry may work.

        Closed, and declared only here: the error codes an Uplink adds are refusals,
        refinements of a `CommandErrorCode` root, never faults.

        A command that was sent and never answered is neither a refusal nor one of
        these: no answer ever comes.
      oneOf:
        - const: invalidEnvelope
          title: InvalidEnvelope
          description: |-
            A frame of a known type that could not be read, including a
            `command-request` whose `args` do not fit the command. Only that call is
            refused; the command stays available.
          x-sitrep-sentence: the request could not be read
        - const: unknownEnvelopeType
          title: UnknownEnvelopeType
          description: A frame whose `type` this build does not recognise.
          x-sitrep-sentence: the mod does not recognise that kind of request
        - const: unhandledEnvelope
          title: UnhandledEnvelope
          description: A frame that parsed as a type this build has nothing to do with.
          x-sitrep-sentence: the mod has nothing to do with that request
        - const: binaryFrameNotAccepted
          title: BinaryFrameNotAccepted
          description: A binary frame sent up the socket, which nothing accepts.
          x-sitrep-sentence: the mod accepts no binary frames
        - const: commandUnavailable
          title: CommandUnavailable
          description: |-
            A command that is unknown or unavailable, or whose handler threw. A handler
            that threw leaves its command unavailable for the session.
          x-sitrep-sentence: the command is not available
        - const: mainThreadTimeout
          title: MainThreadTimeout
          description: |-
            A command the host could not run in time: it was handed to the game's main
            thread and the game did not take it before the host stopped waiting, as
            during a scene load. Nothing was decided, and the command may still run
            later.
          x-sitrep-sentence: the game did not get to it in time
        - const: resultSerializationError
          title: ResultSerializationError
          description: A command that ran and whose result could not be written.
          x-sitrep-sentence: its answer could not be sent
        - const: unknownTopic
          title: UnknownTopic
          description: A subscription to a topic nothing declares.
          x-sitrep-sentence: nothing publishes that
        - const: payloadSerializationError
          title: PayloadSerializationError
          description: A topic whose payload could not be written.
          x-sitrep-sentence: its value could not be sent
        - const: unknownVantage
          title: UnknownVantage
          description: |-
            A `set-vantage`, or a command's `vantage`, naming a command centre that is
            not active. A vantage is the command centre a view is taken from or a
            command is sent from. The command that sets a SCET alarm (an alarm on the
            craft's own clock, spacecraft event time) is the exception: it refuses an
            inactive vantage with the `range` refusal instead.
          x-sitrep-sentence: that command centre is not active
        - const: commandExpired
          title: CommandExpired
          description: |-
            A held command reached its expiry, or its place on the lane passed, before
            it could run. A lane is the numbered sequence of commands to one craft,
            which the craft settles in number order.
          x-sitrep-sentence: it expired before it could run
        - const: replyNotReceived
          title: ReplyNotReceived
          description: |-
            No reply came home before the centre gave the command up: it left, and
            nothing was heard from the craft, a relay or a report in all the time one
            could have taken. The command may have run, and its answer may be waiting at
            a craft that has no link home; the centre cannot tell which.
          x-sitrep-sentence: no reply came home, so it is not known whether it ran
        - const: groupRefused
          title: GroupRefused
          description: |-
            A command sent in a group was not sent because another command in the same
            group was refused, or because the group itself could not be sent. A group
            goes whole or not at all, so every member is refused with this one, and the
            message names the member that decided it.
          x-sitrep-sentence: a command sent with it was refused, so it was not sent or run
        - const: groupStopped
          title: GroupStopped
          description: |-
            A command sent in a group did not run because an earlier command in the same
            group failed at the craft. The earlier commands stay done, since a game
            action cannot be taken back; the message says which ran.
          x-sitrep-sentence: an earlier command sent with it failed, so it did not run
        - const: commandCancelled
          title: CommandCancelled
          description: A cancel stopped the command before it ran.
          x-sitrep-sentence: it was cancelled before it ran
        - const: undoneByLoad
          title: UndoneByLoad
          description: |-
            A game load started a new timeline while the command was on its way, and the
            save it loaded does not carry the command, so it will not run. A quickload
            to before the command was sent is the common case. A command the loaded save
            does carry stays on its way and is answered as usual.
          x-sitrep-sentence: a game load undid it before it ran
        - const: continuousInputWouldWait
          title: ContinuousInputWouldWait
          description: |-
            A continuous input, a throttle or a control axis, was dropped at a node, a
            ground station or relay on the route to the craft, because the link onward
            was down there and it would have had to be held until it came back. Held and
            sent on later it would arrive as a run of out-of-date values, so a node that
            cannot send it on at once drops it. It was accepted with a warning when it
            was sent, and this is the news of its loss, arriving at the command centre
            that sent it once a report from that node could have reached it at light
            speed.
          x-sitrep-sentence: it would wait on its way, and a continuous input cannot
        - const: undelivered
          title: Undelivered
          description: |-
            The transport held the command for a link that never came back, and has
            stopped retrying. It never left this machine.
          x-sitrep-sentence: it was never sent
        - const: disposed
          title: Disposed
          description: The client was shut down while the command waited for an answer.
          x-sitrep-sentence: the connection closed before an answer came
        - const: sendQueueFull
          title: SendQueueFull
          description: |-
            The transport's queue of commands waiting for a link is full, so this one
            was not queued.
          x-sitrep-sentence: too many commands are waiting for the link
        - const: peerDisconnected
          title: PeerDisconnected
          description: A station's link to the main screen dropped while the command was on it.
          x-sitrep-sentence: the link to the main screen dropped
        - const: noClient
          title: NoClient
          description: |-
            The main screen had no connection to the mod to relay a station's command
            over.
          x-sitrep-sentence: the main screen is not connected to the game
        - const: unclassified
          title: Unclassified
          description: |-
            A rejection that carried no code a client could read, such as a throw from
            inside a handler on the client.
          x-sitrep-sentence: something went wrong
    FireCrewArgs:
      type: object
      description: |-
        Fire a hired kerbal, returning them to the applicant pool. Takes a hired
        kerbal's `ProtoCrewMember.name`, the same id `spaceCenter.crewRoster`
        publishes for each roster entry. Firing costs nothing and returns the kerbal
        to the applicant pool, so it is reversible: a re-hire brings them back with
        the same stats. Valid only on a kerbal whose roster status is Available; a
        name not on the hired-crew roster fails with `CommandErrorCode.NotFound`,
        and one that is but is not Available (Assigned, Dead or Missing) with
        `CommandErrorCode.ModeUnavailable`.
      required:
        - kerbalName
      properties:
        kerbalName:
          type: string
          x-sitrep-unit: id
          description: |-
            The kerbal to fire: their name, as a `spaceCenter.crewRoster` entry carries
            it.
    FlightCurrent:
      type: object
      description: |-
        Which flight is active and what phase it is in, for the vessel gonogo is
        reporting as active. Only the newest value matters, and it is delayed by the
        link's signal delay like every `vessel.*` Topic. That is the vessel the game
        is flying, with one exception: a kerbal on EVA does not become the subject
        of this reading, the craft they stepped out of stays it for as long as that
        craft is in the world.

        Nothing is published while there is no active vessel; the last value is
        held.
      required:
        - flightId
        - vesselId
        - vesselName
        - phase
      properties:
        flightId:
          type: string
          x-sitrep-unit: id
          description: |-
            The stable flight id: KSP's `Vessel.id` GUID as a string, the same value as
            `FlightCurrent.vesselId` and as `VesselIdentity.VesselId` and
            `CrashReport.VesselId`, so it joins against those directly.
        vesselId:
          type: string
          x-sitrep-unit: id
          description: |-
            KSP's `Vessel.id` GUID of the active vessel, as a string. Always equal to
            `FlightCurrent.flightId`.
        vesselName:
          type: string
          x-sitrep-unit: text
          description: The active vessel's display name.
        phase:
          description: |-
            The vessel's current flight phase, as its `Situation` (PreLaunch, Flying,
            Landed and so on).
          allOf:
            - $ref: "#/components/schemas/Situation"
              x-sitrep-unit: enum
    FlightEndReason:
      type: integer
      description: |-
        Why a flight ended, carried on `FlightEnded`. The detail of a crash or a
        recovery is on the `crash.lastCrash` and `recovery.lastSummary` channels;
        this is only the coarse reason.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Recovered
          description: The vessel was recovered.
        - const: 1
          title: Crashed
          description: The vessel was lost to a collision or a hard splashdown.
        - const: 2
          title: Reverted
          description: |-
            The game rewound (a revert or a quickload) to before the flight's end, or
            the flight was still open when the rewind happened. Also sent for a flight
            that had already ended by crash or recovery on the timeline the rewind
            discarded.
        - const: 3
          title: Destroyed
          description: |-
            The vessel was destroyed without a collision, for example burning up on
            re-entry.
        - const: 4
          title: Terminated
          description: |-
            The player ended the vessel from the Tracking Station. It was neither lost
            nor recovered.
    FlightEnded:
      type: object
      description: |-
        An event that is always delivered, in the order it happened, and held back
        by the signal delay like any value about a craft, sent once per flight when
        it stops being trackable: recovered, crashed, destroyed or reverted. It
        shares the delay class of `crash.lastCrash` and `recovery.lastSummary`, so
        an end that a rewind discards before its signal delay has elapsed is never
        revealed.

        A crash or a destruction is the lost craft's own report: it reaches each
        command centre at the signal delay of that craft's link as of its last
        contact, whichever craft is being flown, and a centre that had no route to
        it is sent nothing. A centre that saw the craft go has the end in its
        `trackingStation.catalog`.

        Debris, flags and vessels of unknown type never end a flight.
      required:
        - flightId
        - vesselId
        - vesselName
        - reason
        - ut
      properties:
        flightId:
          type: string
          x-sitrep-unit: id
          description: |-
            The id of the flight that ended: KSP's `Vessel.id` GUID as a string. Always
            equal to `FlightEnded.vesselId`.
        vesselId:
          type: string
          x-sitrep-unit: id
          description: KSP's `Vessel.id` GUID of the vessel whose flight ended, as a string.
        vesselName:
          type: string
          x-sitrep-unit: text
          description: The vessel's display name at the end of the flight.
        reason:
          description: |-
            Why the flight ended. When a crash and a destruction are both detected for
            one loss, the first detected wins.
          allOf:
            - $ref: "#/components/schemas/FlightEndReason"
              x-sitrep-unit: enum
        ut:
          type: number
          x-sitrep-unit: ut
          description: |-
            Universal time the flight ended. For `FlightEndReason.Reverted` this is the
            revert-target UT, not the moment the player chose to revert.
    FlightStarted:
      type: object
      description: |-
        An event that is always delivered, in the order it happened, and held back
        by the signal delay like any value about a craft, sent when a new flight
        begins. A flight is new when its vessel id has not been started before in
        this game session (a launch, or a first switch onto a vessel), and every
        vessel active just after a revert or a quickload starts a new flight, even
        one with the same id.

        A client that subscribes while a flight is already open receives that
        flight's `flight.started`, carrying its original start `FlightStarted.ut`. A
        repeat with an unchanged `FlightStarted.ut` is the same flight announced
        again; a new `FlightStarted.ut` for the same vessel id is a new flight after
        a rewind.
      required:
        - flightId
        - vesselId
        - vesselName
        - ut
      properties:
        flightId:
          type: string
          x-sitrep-unit: id
          description: |-
            The stable flight id: KSP's `Vessel.id` GUID as a string. Always equal to
            `FlightStarted.vesselId`.
        vesselId:
          type: string
          x-sitrep-unit: id
          description: KSP's `Vessel.id` GUID of the vessel flying this flight, as a string.
        vesselName:
          type: string
          x-sitrep-unit: text
          description: The vessel's display name when the flight was announced.
        ut:
          type: number
          x-sitrep-unit: ut
          description: |-
            Universal time this flight began: when the vessel was first observed active,
            or the revert-target UT for a flight started by a rewind.
    FlightVesselChanged:
      type: object
      description: |-
        An event that is always delivered, in the order it happened, and held back
        by the signal delay like any value about a craft, sent whenever the active
        vessel changes after the first observation of the session (docking,
        undocking, a tracking-station reselect). Switching away from a vessel that
        is still flying does not end its flight, and switching back to a known one
        does not start a new one. Switching onto a vessel for the first time also
        sends `FlightStarted`. Going on EVA does not change the active vessel (see
        `FlightCurrent`).
      required:
        - flightId
        - vesselId
        - vesselName
        - ut
      properties:
        flightId:
          type: string
          x-sitrep-unit: id
          description: |-
            The flight now active: KSP's `Vessel.id` GUID as a string. Always equal to
            `FlightVesselChanged.vesselId`.
        vesselId:
          type: string
          x-sitrep-unit: id
          description: KSP's `Vessel.id` GUID of the vessel focus moved to, as a string.
        vesselName:
          type: string
          x-sitrep-unit: text
          description: The display name of the vessel focus moved to.
        previousVesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The vessel id focus moved from, or null when there was no previous vessel.
        ut:
          type: number
          x-sitrep-unit: ut
          description: Universal time of the switch.
    GameDlc:
      type: object
      description: |-
        Which KSP expansions ("DLC") are installed. A fact about the install,
        independent of scene, so a widget can tell "the player has no DLC" from "the
        DLC is present but nothing is deployed yet" (deployed science, for instance,
        needs Breaking Ground).

        The whole payload is `null`, not an all-false object, when no sample has
        been taken yet, so "no data yet" and "DLC absent" stay distinct. A widget
        sees that `null` as a reading whose `state` is `"absent"` and which carries
        no value. This is a fact about the ground, so it is never delayed by any
        vessel's comms link.
      required:
        - breakingGround
        - makingHistory
      properties:
        breakingGround:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the Breaking Ground expansion is installed: deployed science,
            robotics and surface features.
        makingHistory:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the Making History expansion is installed: the mission builder and
            extra parts.
    GameMode:
      type: integer
      description: |-
        The game's save mode, from KSP's `Game.Modes`. It decides which career
        surfaces (funds, tech tree, contracts, strategies, facility upgrades) mean
        anything. `CareerStatus` is `null` outside career, so the mode is its own
        Topic, `career.mode`, emitted in every mode.

        On the wire an enum is its integer ordinal: `Sandbox` 0, `Career` 1,
        `Science` 2, `Unknown` 3.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Sandbox
          description: "A sandbox save (`SANDBOX`): no funds, science or reputation."
        - const: 1
          title: Career
          description: |-
            A career save (`CAREER`): funds, contracts, reputation and the tech tree all
            apply.
        - const: 2
          title: Science
          description: |-
            A science save (`SCIENCE_SANDBOX`): the tech tree and science apply, funds
            and contracts do not.
        - const: 3
          title: Unknown
          description: |-
            Any other KSP mode (a scenario or a mission), which has no player-career
            surface.
    GameState:
      type: object
      description: |-
        What the game is doing, sent on its own and not through any topic. Sent
        straight after `Hello` on every connection that has anything to learn, and
        again at every change.

        It is not delayed by signal delay at any command centre: a load is a fact
        about the game on the machine, not about anything in flight.

        While `GameState.state` is `"loading"` or `"no-game"`, nothing the stream
        last said is current. Readings received before the frame are still the
        latest there are, and none of them is a live one. A `"ready"` that follows a
        load which started a new timeline arrives after that timeline's
        `timeline-reset`.

        A client that reads no `game-state` frame (an older client, or a host that
        never sends one) is not wrong, only unaware: it drops a frame type it does
        not know.
      required:
        - type
        - state
        - scene
      properties:
        type:
          type: string
          const: game-state
          x-sitrep-unit: id
          description: The frame type, always `"game-state"`.
        state:
          type: string
          x-sitrep-unit: id
          description: |-
            `"loading"`, `"ready"` or `"no-game"`. A client treats a value it does not
            know as `"ready"`.
        scene:
          type: string
          x-sitrep-unit: id
          description: |-
            The scene being loaded while `GameState.state` is `"loading"`, otherwise the
            scene that stands: one of KSP's scene names, such as `"FLIGHT"`,
            `"SPACECENTER"`, `"TRACKSTATION"`, `"EDITOR"` or `"MAINMENU"`.
    GateCheckRequest:
      type: object
      description: |-
        Asks what a command's gate says about one particular call, from the command
        centre asking, without sending it. The reply is the `GateVerdict` a dispatch
        of the same call would meet.

        This answers what `system.uplink.gates` cannot: a verdict that depends on
        the arguments the operator has chosen (a launch site, a time warp rate) or
        on the command centre they are sending from. A control asks when the
        operator's choice changes, not on every tick, and draws a `GateOutcome.Fail`
        dark with the verdict's own reason. The dispatch remains the authority:
        nothing here is a permission, and the answer can be out of date by the time
        the operator presses.

        A command with no declared gate answers `GateOutcome.Pass`. An argument the
        gate needs and the call leaves out answers `GateOutcome.Abstain`. A command
        the host does not know is refused as not found.
      required:
        - command
        - args
      properties:
        command:
          type: string
          x-sitrep-unit: id
          description: The command whose gate is asked about, e.g. `ksp.launch`.
        args:
          type: object
          additionalProperties:
            description: "Opaque at this layer: the contract declares no shape for it, so nothing here constrains it."
          description: |-
            The arguments the call would carry, keyed by their wire names. Empty asks
            about the command with nothing chosen yet.
    GateOutcome:
      type: integer
      description: |-
        What a command gate concluded about one precondition: passed, failed, could
        not be decided from the arguments supplied, or could not be decided from the
        game's state.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Pass
          description: Nothing blocks this.
        - const: 1
          title: Fail
          description: Blocked, with the comparison that says why.
        - const: 2
          title: Abstain
          description: |-
            Cannot be decided from the arguments supplied, because one it needs is
            missing. Not a refusal: a client that treats this as blocked disables every
            argument-dependent control permanently.
        - const: 3
          title: Unknown
          description: |-
            Decidable in principle, but the live state needed is missing, e.g. a
            facility KSP does not track under the name declared. Distinct from
            `GateOutcome.Abstain` because nothing further the caller supplies will
            resolve it, and distinct from `GateOutcome.Pass` because an unreadable limit
            is not the same as no limit.
    GateVerdict:
      type: object
      description: |-
        The verdict of a command gate on one call or one command, plus its evidence:
        the `GateOutcome`, and for a refusal which refusal it is and why.
      required:
        - outcome
        - detail
      properties:
        outcome:
          description: What the gate concluded. Defaults to `GateOutcome.Pass`.
          allOf:
            - $ref: "#/components/schemas/GateOutcome"
              x-sitrep-unit: enum
        errorCode:
          description: |-
            Which refusal, for a `GateOutcome.Fail`: the same error code a command
            handler's own refusal carries, so one client sentence serves a declared gate
            and a handler that got far enough to look.

            Set by the evaluator, because only the evaluator knows what it checked: a
            full pad and an un-upgraded Tracking Station are both a gate saying no, and
            they are not the same refusal. `CommandErrorCode.ModeUnavailable` is what
            GateVerdict.Fail names for an evaluator that says nothing more. Null on
            every outcome but a Fail.

            On the wire the root's id, with a refinement's own id beside it as
            `GateVerdict.reason`, as on `CommandResult`.
          anyOf:
            - $ref: "#/components/schemas/CommandErrorCode"
              x-sitrep-unit: enum
            - type: "null"
        reason:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The refinement's id when `GateVerdict.errorCode` is more specific than its
            root; absent otherwise.
        breach:
          description: |-
            Set only for a numeric `GateOutcome.Fail`. Null is the shape a client keys
            on: an Abstain or an Unknown has nothing to compare, so it must not arrive
            carrying zeroes that render as a real limit of 0.
          anyOf:
            - $ref: "#/components/schemas/LimitBreach"
            - type: "null"
        detail:
          type: string
          x-sitrep-unit: text
          description: |-
            Why, when the outcome carries no numeric comparison: a
            `GateOutcome.Unknown`'s cause, or a discrete prerequisite's name. Prose for
            a human, never parsed.
        missing:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/MissingUnlock"
          description: |-
            For a `CommandErrorCode.NotUnlocked` Fail, each unlock this save is missing:
            a tech node not researched, or a building below the level it needs. Absent
            on every other outcome, and on a refusal whose evaluator could not say which
            unlock it was.
    Hello:
      type: object
      description: |-
        The first frame on every connection, sent before anything is asked for.
        `Hello.bootId` names the run of the mod the connection has reached.

        A client that reconnects and reads the id it read before has reached the
        same run: every `meta.timelineEpoch` it remembers still counts on from where
        it was, and only the connection's own state has to be set up again, which is
        each subscription and, where one was chosen, the vantage (see `SetVantage`:
        a new connection starts at the home command centre whatever the last one
        chose). A different id is another run, whose epochs count from zero, so
        nothing remembered of the old one can be compared with it.
      required:
        - type
        - bootId
        - contractMajor
        - contractMinor
      properties:
        type:
          type: string
          const: hello
          x-sitrep-unit: id
          description: The frame type, always `"hello"`.
        bootId:
          type: string
          x-sitrep-unit: id
          description: |-
            An opaque id made afresh each time the mod starts its stream, the same on
            every connection until it next does. Compare it for equality only.
        modVersion:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The mod's release label: `v1.4.0` for a release, `rc-<sha>` for a release
            candidate. Absent from the frame for a build that carries no label, such as
            one built from source.
        contractMajor:
          type: number
          x-sitrep-unit: id
          description: |-
            The major number of the wire contract the mod speaks. A client built for a
            different major cannot read this stream correctly.
        contractMinor:
          type: number
          x-sitrep-unit: id
          description: |-
            The minor number of the wire contract the mod speaks. A client built for an
            older minor misses what the mod added since; a client built for a newer
            minor asks for what the mod does not yet have.
    HireApplicantArgs:
      type: object
      description: |-
        Hire an applicant into the crew roster. Takes the applicant's
        `ProtoCrewMember.name`, the same id `spaceCenter.astronautComplex` publishes
        for each applicant as `applicants[].name`, so a client hires the applicant
        it read. Hiring debits the current recruit cost from funds and moves the
        applicant into the crew roster. An applicant that has left the pool since it
        was read (someone else hired them, or KSP refreshed the pool) fails with
        `CommandErrorCode.NotFound`; an unaffordable hire with
        `CommandErrorCode.Range`; a full roster (Astronaut Complex cap) or a
        non-career save `CommandErrorCode.ModeUnavailable`.
      required:
        - applicantName
      properties:
        applicantName:
          type: string
          x-sitrep-unit: id
          description: |-
            The applicant to hire: their name, as `spaceCenter.astronautComplex`'s
            `applicants[].name` carries it.
    InboundFrame:
      description: |-
        Every frame the mod sends, told apart by `type`.

        - `stream-data`: a subscribed topic's value
        - `stream-binary`: a subscribed topic's value as raw bytes, for a channel that uses the binary lane
        - `event`: something that happened to a subscription
        - `command-response`: the result of a command
        - `command-accepted`: the receipt for a delayed command, sent before its result
        - `error`: a request the mod refused or could not read
        - `hello`: the first frame on every connection
        - `game-state`: what the game is doing: loading, ready or no game
        - `pong`: the answer to a ping

        Each one fixes `type` to a constant, so a JSON Schema validator selects the
        right one from `type` alone. The `discriminator` beside this is the AsyncAPI
        Schema keyword, a plain string naming that property. It is not OpenAPI 3's
        `discriminator` object, so `propertyName` and `mapping` do not apply here.
        `stream-binary` is described by its JSON header; see the document description
        for the bytes that follow it.
      discriminator: type
      oneOf:
        - $ref: "#/components/schemas/StreamData"
        - $ref: "#/components/schemas/StreamBinary"
        - $ref: "#/components/schemas/EventMsg"
        - $ref: "#/components/schemas/CommandResponse"
        - $ref: "#/components/schemas/CommandAccepted"
        - $ref: "#/components/schemas/ErrorMsg"
        - $ref: "#/components/schemas/Hello"
        - $ref: "#/components/schemas/GameState"
        - $ref: "#/components/schemas/Pong"
    InstrumentEntry:
      type: object
      description: |-
        One entry in the `science.instruments` Topic payload: a single
        `ModuleScienceExperiment` on the active vessel, as an inventory and status
        row keyed by `InstrumentEntry.partId` (the part's flight id, a number the
        game assigns each part of a flight, written as a string).

        Distinct from `ExperimentEntry`: `science.experiments` walks the same
        modules but yields one row per stored result (a module with no data produces
        no row), whereas `science.instruments` yields one row per module whether or
        not it holds data. It is the operability picture (deployed, inoperable,
        rerunnable, resettable, collectable) an operator needs to decide what to run
        next.

        The Topic payload is a bare array (`InstrumentEntry[]`) or `null` when there
        is no active vessel or it carries no experiment module. Every field is
        nullable, and is `null` whenever the raw value is absent.
      properties:
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The part's KSP `flightID` as a string: the stable join key for this
            instrument. `null` when the part has no flight id yet (KSP's unset value,
            0).
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Display title of the part carrying the module (the part's `partInfo.title`,
            or its internal name when that is missing).
        experimentId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The module's experiment id (KSP's `ModuleScienceExperiment.experimentID`,
            for example `crewReport`).
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The experiment's display title (KSP's `ScienceExperiment.experimentTitle`).
            `null` when the module's experiment definition has not resolved.
        deployed:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the experiment is deployed (KSP's
            `ModuleScienceExperiment.Deployed`).
        inoperable:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the experiment cannot be run again until it is reset (KSP's
            `ModuleScienceExperiment.Inoperable`).
        rerunnable:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the experiment can be run more than once without a reset (KSP's
            `ModuleScienceExperiment.rerunnable`).
        resettable:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the experiment can be reset (KSP's
            `ModuleScienceExperiment.resettable`).
        dataIsCollectable:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether a kerbal on EVA can collect the experiment's data (KSP's
            `ModuleScienceExperiment.dataIsCollectable`).
        extensions:
          type:
            - object
            - "null"
          description: |-
            The provider-namespaced extension bag, instrument half. Same mechanism and
            same rule as `ExperimentEntry.extensions`. This payload carries no number
            whose meaning depends on the value model (it is pure operability), so it has
            the bag but no `valueModel` tag.

            Stock's operability picture is a flat pair of flags
            (`InstrumentEntry.deployed` and `InstrumentEntry.inoperable`). A provider
            that models running as a state machine with a reason ("shrouded", "no EC",
            "sample depleted") projects it down to those flags and carries the state and
            the reason here.
          additionalProperties: true
    InventoryItem:
      type: object
      description: One kind of thing stored in an `InventoryStore`, with how many of it.
      required:
        - name
        - quantity
      properties:
        name:
          type: string
          x-sitrep-unit: id
          description: |-
            `AvailablePart.name`, the config id (e.g. `"evaRepairKit"`). The id a
            consumer matches on, never the title, which is localised.
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The part's display title, already localised by KSP.
        quantity:
          type: number
          x-sitrep-unit: count
          description: How many of this kind are in this store, summed across slots.
        packedVolume:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Packed volume of one of these, same unit as the store's limits.
    InventoryStore:
      type: object
      description: "One part's `ModuleInventoryPart`: a cargo hold aboard."
      required:
        - partId
        - partName
        - items
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's flight id, as a string, so a store id-joins to `vessel.parts` and
            the other per-part channels.
        partName:
          type: string
          x-sitrep-unit: text
          description: The part's display title.
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
          description: |-
            What is actually in it. Empty is meaningful and is not the same as an absent
            store: an empty hold is a place to put something.
        slots:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            `ModuleInventoryPart.InventorySlots`. Null when the module did not report
            one.
        slotsUsed:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Slots with something in them, so a consumer can say "2 of 4" without summing
            quantities that share a slot.
        packedVolumeLimit:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            `packedVolumeLimit`, in KSP's own cargo-volume unit, not cubic metres: it is
            a config number with no physical dimension (a kerbal holds 40, a repair kit
            takes 5).
        packedVolumeUsed:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Packed volume currently used, same unit as
            `InventoryStore.packedVolumeLimit`.
        massLimit:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: |-
            `massLimit` in tonnes. A kerbal's is 0.065, which is the binding constraint
            on how much they can carry long before slots are.
    InvokePartActionArgs:
      type: object
      description: |-
        Fire one button of one part's right-click Part Action Window, the
        remote-control equivalent of the player clicking it in-game.

        It acts on a part aboard the craft, so it waits on the signal delay, like
        `vessel.control.*` and the robotics commands.

        It has no state field, unlike the other actuation commands (see
        `ServoSetEnabledArgs`). KSP models these as buttons with no settable value,
        and the button's own label is what changes ("Deploy" becomes "Retract").
        Read the result back from `vessel.partActions.<flightId>`, which reports the
        new set of buttons one signal delay later.
      required:
        - partId
        - eventName
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's flight id, as a string: the same id `PartActions.partId` and
            `VesselPart.id` carry, so a widget sends back the id it already holds. An id
            that no longer resolves (the part was staged away or undocked, or the vessel
            unloaded) fails with `CommandErrorCode.NotFound` rather than doing nothing.
        eventName:
          type: string
          x-sitrep-unit: id
          description: |-
            The `PartActionEntry.name` of the button to fire (`BaseEvent.name`, the
            stable code id, never the localized `PartActionEntry.label`). An event name
            the part no longer offers fails with `CommandErrorCode.ModeUnavailable`: the
            part is there but that button is not, where a missing part fails with
            `CommandErrorCode.NotFound`.
    IsruConverterEntry:
      type: object
      description: |-
        One chemical converter on the active vessel. Field set matches stock's
        surface: whether it is running, and the recipe it is running, at live rates.
        The `isru.converters` payload is an array of these; empty when the vessel
        has no converters.
      required:
        - inputs
        - outputs
      properties:
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The part's flight id, as a string: the same join key as
            `IsruDrillEntry.partId`.
        partTitle:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: Part.partInfo.title, for display without a vessel.parts join.
        running:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Actively converting this tick.
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/IsruResourceFlow"
          description: |-
            Recipe inputs at their live rate. Empty list, not null, when the converter
            carries no recipe.
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/IsruResourceFlow"
          description: |-
            Recipe outputs at their live rate. Empty list, not null, when the converter
            carries no recipe.
        extensions:
          type:
            - object
            - "null"
          description: |-
            The provider-namespaced extension bag, converter half. Same mechanism and
            same rule as `IsruDrillEntry.extensions`.

            A starved recipe has no blocking-reason field: a converter that is on but
            moving nothing is `IsruConverterEntry.running` true alongside zero rates, so
            derive that condition from the shared fields.
          additionalProperties: true
    IsruDrillEntry:
      type: object
      description: |-
        One drill (resource harvester) on the active vessel. The field set is what
        every ISRU model shares, which is exactly what stock ISRU has: resource,
        abundance, rate, deploy and running, plus the two identification fields.
        Anything one provider knows and another does not goes in
        `IsruDrillEntry.extensions`.

        The `isru.drills` payload is an array of these. An empty array means the
        vessel has no drills, never that ISRU is not tracked.
      properties:
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The part's flight id, as a string: the same join key `vessel.parts` and
            `parts.power` use.
        partTitle:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: Part.partInfo.title, for display without a vessel.parts join.
        resource:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Resource this drill extracts (e.g. "Ore"). Free text, not a closed enum:
            whatever the running install's configs and profiles name, as with every
            resource name in this contract.
        deployed:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Drill head deployed. Null for a harvester with no deploy animation, e.g.
            some asteroid drills.
        running:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Actively extracting this tick.
        abundance:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            Local abundance of `IsruDrillEntry.resource` at the drill's current
            position, 0..1. Stock reads the same resource map the part's right-click
            menu does. A mod that samples its own abundance reports that instead, and
            for asteroid or comet mining the remaining-mass ratio of the source rock
            lands here: the same 0..1 shape from a different source. Null when the
            backend has no abundance concept for this harvest type.
        rate:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            Effective current extraction rate, already abundance- and
            efficiency-adjusted rather than the static config rate, so it matches what
            the part's own readout shows. Zero rather than null when
            `IsruDrillEntry.running` is false: the drill genuinely extracts nothing,
            which is a number, not an absence.
        extensions:
          type:
            - object
            - "null"
          description: |-
            Per-drill facts the ISRU mod in use reports beyond this shape, keyed by that
            mod's name. Null for the vanilla backend, which has nothing stock does not
            already say. A blocking-reason string, an EC draw, an asteroid's remaining
            mass: all of those belong here rather than as nullable members above.
          additionalProperties: true
    IsruResourceFlow:
      type: object
      description: |-
        One resource flow in a converter's recipe, input or output side. The rate is
        live (already scaled by whatever the part's current efficiency or capacity
        multiplier is), not the raw recipe ratio, so an operator reads what is
        actually moving rather than what the config asked for.
      properties:
        resource:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The resource's name as the install's configs name it (for example "Ore",
            "LiquidFuel"). Free text, not a closed enum. `null` when the recipe entry
            names no resource.
        rate:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            The live rate this resource is consumed (on an input) or produced (on an
            output) at, already scaled by the converter's current efficiency.
    JourneyEventKind:
      type: integer
      description: What one journey report says happened to a command, or to a cancel.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Held
          description: |-
            A node is holding the command for its next window;
            `CommsJourneyEvent.untilUt` is when it predicts the command will leave. A
            node also reports this when a command it sent went unanswered and is its to
            send again.
        - const: 1
          title: Departed
          description: |-
            A node that had held the command sent it on; `CommsJourneyEvent.untilUt` is
            when that node expects the light to land at its next node.
        - const: 2
          title: Expired
          description: The command reached its expiry where it was and was deleted there.
        - const: 3
          title: Cancelled
          description: A cancel stopped the command at the node reporting.
        - const: 4
          title: Waiting
          description: |-
            The command reached the craft and waits for earlier lane numbers, named in
            `CommsJourneyEvent.missing`.
        - const: 5
          title: Discarded
          description: |-
            The craft discarded the command because its lane number had already settled;
            `CommsJourneyEvent.detail` says how.
        - const: 6
          title: CancelStored
          description: |-
            A cancel reached the craft before the command; the craft refuses the command
            whenever it arrives.
        - const: 7
          title: CancelLate
          description: |-
            A cancel reached the craft after the command ran;
            `CommsJourneyEvent.untilUt` is when it ran.
        - const: 8
          title: CancelLateHere
          description: A cancel reached a node after the command left it, and follows it on.
        - const: 9
          title: Ran
          description: The command ran at the craft; its result travels on the command's own reply.
        - const: 10
          title: LostOnLanding
          description: |-
            A copy of the command was sent on and never landed, because the link it
            needed was gone when it arrived. The node still holds the command,
            `CommsJourneyEvent.detail` says which attempt was lost, and
            `CommsJourneyEvent.untilUt` is when that node tries again, or null when it
            waits for its plan to change.
    KspEditorFacility:
      type: integer
      description: |-
        KSP's `EditorFacility`: which editor a craft was built in. Behind
        `spaceCenter.savedShips[].facilityOrdinal`, beside the name in
        `SavedShipEntry.facility`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: None
          description: No editor recorded.
        - const: 1
          title: VAB
          description: The Vehicle Assembly Building.
        - const: 2
          title: SPH
          description: The Spaceplane Hangar.
    KspParameterState:
      type: integer
      description: |-
        KSP's `Contracts.ParameterState`: whether one objective of a contract is
        done. Behind `career.status.contracts[].parameters[].stateOrdinal`, beside
        the name in `CareerContractParameter.state`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Incomplete
          description: Not yet met.
        - const: 1
          title: Complete
          description: Met.
        - const: 2
          title: Failed
          description: Failed, and can no longer be met.
    KspPartCategory:
      type: integer
      description: |-
        KSP's `PartCategories`: the editor category a part filters into. Behind
        `vessel.parts[].categoryOrdinal`, beside the name in `VesselPart.category`.

        `KspPartCategory.none` is `-1`, not `0`, so resolve an ordinal with
        `namesByValue`, not `namesOf`, which assumes members numbered from zero. The
        lower-case spelling is KSP's, and the name on the wire is exactly `"none"`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Propulsion
          description: Propulsion.
        - const: 1
          title: Control
          description: "Control: reaction wheels, RCS thrusters and similar."
        - const: 2
          title: Structural
          description: Structural.
        - const: 3
          title: Aero
          description: "Aerodynamics: wings, control surfaces, nose cones, intakes."
        - const: 4
          title: Utility
          description: Utility.
        - const: 5
          title: Science
          description: Science.
        - const: 6
          title: Pods
          description: Command pods and probe cores.
        - const: 7
          title: FuelTank
          description: Fuel tanks.
        - const: 8
          title: Engine
          description: Engines.
        - const: 9
          title: Communication
          description: "Communication: antennas and relays."
        - const: 10
          title: Electrical
          description: "Electrical: batteries, generators, solar panels."
        - const: 11
          title: Ground
          description: "Ground: landing gear, legs and wheels."
        - const: 12
          title: Thermal
          description: "Thermal: heat shields and radiators."
        - const: 13
          title: Payload
          description: "Payload: fairings and cargo bays."
        - const: 14
          title: Coupling
          description: "Coupling: decouplers, separators and docking ports."
        - const: 15
          title: Cargo
          description: "Cargo: inventory parts."
        - const: 16
          title: Robotics
          description: Robotics (Breaking Ground servos and rotors).
        - const: -1
          title: none
          description: No category. KSP spells it in lower case.
    KspRosterStatus:
      type: integer
      description: |-
        KSP's `ProtoCrewMember.RosterStatus`: a kerbal's standing in the roster.
        Behind `spaceCenter.crewRoster[].situationOrdinal`, beside the name in
        `CrewRosterEntry.situation`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Available
          description: In the roster and free to be assigned to a flight.
        - const: 1
          title: Assigned
          description: Assigned to a vessel.
        - const: 2
          title: Dead
          description: Killed.
        - const: 3
          title: Missing
          description: |-
            Lost with a vessel. In a save with respawn enabled, a missing kerbal returns
            to `KspRosterStatus.Available` after a delay.
    KspSpaceCenterFacility:
      type: integer
      description: |-
        KSP's `SpaceCenterFacility`: one building at the space centre. Behind
        `career.status.facilities[].facilityOrdinal` and
        `LimitBreach.facilityOrdinal`.

        `career.status.facilities` is keyed by the facility name, not the ordinal.
        The ordinal is carried inside each entry, so a client can branch on it
        without relying on the key it arrived under.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Administration
          description: The Administration building.
        - const: 1
          title: AstronautComplex
          description: The Astronaut Complex.
        - const: 2
          title: LaunchPad
          description: The Launch Pad.
        - const: 3
          title: MissionControl
          description: Mission Control.
        - const: 4
          title: ResearchAndDevelopment
          description: Research and Development.
        - const: 5
          title: Runway
          description: The Runway.
        - const: 6
          title: TrackingStation
          description: The Tracking Station.
        - const: 7
          title: SpaceplaneHangar
          description: The Spaceplane Hangar.
        - const: 8
          title: VehicleAssemblyBuilding
          description: The Vehicle Assembly Building.
    LabEntry:
      type: object
      description: |-
        One entry in the `science.lab` Topic payload: a Mobile Processing Lab (KSP's
        `ModuleScienceLab`) on the active vessel. The channel payload is a bare
        array (`LabEntry[]`) or `null` when there is no active vessel or it carries
        no lab. Every field is nullable, and is `null` whenever the raw value is
        absent or non-finite.
      properties:
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The part's KSP `flightID` as a string: the stable join key for this lab, and
            what tells one lab from another across samples. `null` when the part has no
            flight id yet (KSP's unset value, 0).
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Display title of the lab part (the part's `partInfo.title`, or its internal
            name when that is missing).
        dataStored:
          type:
            - number
            - "null"
          x-sitrep-unit: Mit
          description: |-
            Data currently stored in the lab for processing, in mits (KSP's
            `ModuleScienceLab.dataStored`). Compare against `LabEntry.dataStorage`.
        dataStorage:
          type:
            - number
            - "null"
          x-sitrep-unit: Mit
          description: The lab's data capacity in mits (KSP's `ModuleScienceLab.dataStorage`).
        storedScience:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            Science the lab has generated and is holding, not yet transmitted (KSP's
            `ModuleScienceLab.storedScience`). While the lab is processing it grows at
            `LabEntry.scienceRate` up to `LabEntry.scienceCap`, so a model carries it
            forward from there; a lab that is not processing holds it exactly as
            observed.
        scienceCap:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            The most science the lab holds: generation stops once
            `LabEntry.storedScience` reaches it (KSP's
            `ModuleScienceConverter.scienceCap`). `null` when the lab has no converter
            or it could not be read.
        processingData:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the lab is currently processing data (KSP's
            `ModuleScienceLab.processingData`).
        statusText:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's own status line for the lab (`ModuleScienceLab.statusText`), for
            display. Game-authored prose, so do not branch on it.
        scientistCount:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Number of crew with the Scientist trait aboard the lab part. `0` is a real
            reading: a lab with no scientist.
        scienceRate:
          type:
            - number
            - "null"
          x-sitrep-unit: science/day
          description: |-
            Science generated per game day, not per second, at the lab's current stored
            data (KSP's `ModuleScienceConverter.CalculateScienceRate`, which scales the
            per-tick rate to a full day). `null` when the lab has no converter or the
            rate could not be read.
        isOperational:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the lab can operate right now (KSP's
            `ModuleScienceLab.IsOperational()`).
        valueModel:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Which value model produced `LabEntry.scienceRate` and
            `LabEntry.storedScience`, and which unit `LabEntry.dataStored` and
            `LabEntry.dataStorage` are really in. See ScienceValueModels.

            A lab is not the same kind of thing under every model. Stock's is terminal:
            it turns stored data into science per game-day. A provider whose lab is an
            intermediate pipeline stage (analysing a sample into a transmissible file,
            which then still has to be sent) produces no science itself, leaves
            `LabEntry.scienceRate` null, and carries its own rate in
            `LabEntry.extensions`. This tag is what tells that null apart from an idle
            lab.
        extensions:
          type:
            - object
            - "null"
          description: |-
            The provider-namespaced extension bag, lab half. Same mechanism and same
            rule as `ExperimentEntry.extensions`.
          additionalProperties: true
    LaunchArgs:
      type: object
      description: |-
        Load a saved craft onto a launch site. The craft is identified by
        `LaunchArgs.shipName` plus the `LaunchArgs.facility` it was saved from
        (`"VAB"` or `"SPH"`, case-insensitive); Gonogo finds the `.craft` file
        itself, so a client never sends a file path. An empty ship name fails with
        `CommandErrorCode.NotFound` and an unrecognised facility with
        `CommandErrorCode.Range`, before the game is ever touched.

        `LaunchArgs.crew` is an array of kerbal names (empty to launch unmanned),
        each assigned to a free craft seat.
      required:
        - shipName
        - facility
        - site
        - crew
      properties:
        shipName:
          type: string
          x-sitrep-unit: text
          description: |-
            The saved craft's name: its `.craft` file name without the extension, under
            the save's `Ships/VAB` or `Ships/SPH` folder. No such file fails with
            `CommandErrorCode.NotFound`.
        facility:
          type: string
          x-sitrep-unit: text
          description: |-
            `"VAB"` or `"SPH"` (case-insensitive). Any other value yields
            `CommandResult.errorCode` `CommandErrorCode.Range`.
        site:
          type: string
          x-sitrep-unit: text
          description: |-
            The KSP launch site name to launch from, `"LaunchPad"` by default. Refused
            unless the sending command centre is in the same planetary system (a planet
            and its moons) as the site.
        crew:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: Kerbal names to seat, in order. Empty to launch unmanned.
    LaunchSiteEntry:
      type: object
      description: |-
        One launch site in the `spaceCenter.launchSites` channel: the stock KSC pad
        and runway, any Making History sites, and any Kerbal Konstructs sites, which
        is every launch site the game has registered.

        The channel is a bare array of these entries, not a wrapper object and not a
        single KSC record: KSP has many launch sites, keyed by
        `LaunchSiteEntry.name`. The whole payload is `null` (not an empty array)
        when no sample has arrived yet, which tells "no data yet" apart from "zero
        sites". It carries no `meta` of its own.

        Kept at the home command centre, the one that holds the career ledger (see
        `CommandCentreEntry`). A screen working from another command centre, which
        is its vantage, sees a change after the signal delay from home to that
        centre, and at once when both are on the ground network.
      properties:
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Internal launch-site id (`LaunchSite.name`): the stable key used with
            `PSystemSetup`'s lookup APIs; null when the live game hasn't populated it.
        displayName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Human-facing display name, as the game's own screens show it in the player's
            language, or the site's `name` when the game has none it can resolve.
        editorFacility:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Which editor this site launches from (the pad-vs-runway distinction) as the
            `EditorFacility` enum name (`"None"`/`"VAB"`/`"SPH"`); a VAB site is a pad,
            an SPH site a runway.
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index of the body this site sits on among the bodies
            `trackingStation.bodies` lists; null when absent or unresolved (never a
            sentinel like -1).
        latitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Latitude of the site's spawn point on its body (`LaunchSite.SpawnPoint`);
            null when the site has no set spawn coordinate (never a fabricated `0`).
            Pairs with `LaunchSiteEntry.longitude` to give the site a location for the
            command-delay geometry (a launch is a command to this location).
        longitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Longitude of the site's spawn point on its body; null when the site has no
            set spawn coordinate. Pairs with `LaunchSiteEntry.latitude`.
        isStock:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether this is a stock KSP launch site (`PSystemSetup.IsStockLaunchSite`),
            false for Making History / Kerbal Konstructs sites.
        padOccupied:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether a vessel holds this site, by the rule the game's own launch
            admission applies: a saved vessel, active or not, whose landed-at site
            matches this one, debris excepted. Holds in any scene. True exactly when a
            launch from here would be refused as occupied; null when the save's vessel
            list is not loaded.
        padVesselTitle:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Name of the vessel holding this site (`LaunchSiteEntry.padOccupied` true),
            the one the game names in its own refusal; null when the site is clear or
            occupancy is unknown.
    LimitBreach:
      type: object
      description: |-
        The comparison behind a `GateOutcome.Fail`: the limit and the actual value,
        never a verdict on its own.

        "Too heavy" does not tell an operator whether to shed 200 kg or redesign.
        With both numbers a client can write "1.4 t over the 18 t Launch Pad limit"
        in the operator's own units.
      required:
        - facility
        - facilityName
        - facilityLevel
        - quantity
        - unit
      properties:
        facility:
          type: string
          x-sitrep-unit: id
          description: |-
            The facility whose limit was exceeded, as its KSP `SpaceCenterFacility`
            member name (e.g. `LaunchPad`). An id for matching; show
            `LimitBreach.facilityName` to an operator. Empty for a limit that belongs to
            no facility, such as a time-warp rate.
        facilityName:
          type: string
          x-sitrep-unit: text
          description: |-
            The facility's name as the game writes it ("Astronaut Complex"), for the
            sentence an operator reads. Empty when no display name was available.

            This is the only place the display name is published, so use it rather than
            mapping `LimitBreach.facility` to English on the client, which would be
            wrong in every other language and miss any facility KSP adds.
        facilityLevel:
          type: number
          x-sitrep-unit: ratio
          description: Normalised facility level, as KSP reports it. Not a tier index.
        quantity:
          type: string
          x-sitrep-unit: id
          description: |-
            Which limit was exceeded, e.g. `mass`, `partCount`, `activeCrew` or
            `warpRate`. For a declared gate this is the CommandRequirement.Quantity of
            the requirement that failed; the vocabulary is set by whoever produced the
            breach, so it is open-ended.
        limit:
          type:
            - number
            - "null"
          x-sitrep-unit: n/a
          description: |-
            The limit, in `LimitBreach.unit`. Null when the facility is unlimited.

            Never a sentinel: KSP reports `float.MaxValue` (and `int.MaxValue`, and a
            `Vector3` of them) at maximum level, and those arrive here as null. A breach
            with no limit should not occur, since nothing can exceed an unlimited limit.
        actual:
          type:
            - number
            - "null"
          x-sitrep-unit: n/a
          description: What the call actually asked for, same unit as `LimitBreach.limit`.
        unit:
          type: string
          x-sitrep-unit: id
          description: |-
            The unit token `LimitBreach.limit` and `LimitBreach.actual` are in, e.g. `t`
            for a mass limit, `count` for a part count.

            Carried as data because one breach type serves limits with different
            dimensions, so `LimitBreach.limit` and `LimitBreach.actual` have no fixed
            unit of their own. Read it from here, and render the comparison in the
            operator's own units.
    LockedValue:
      type: object
      description: |-
        What a field arrives as, in place of its value, while the save has not
        unlocked what it needs: the unlocks it is missing, so a client can say why
        it has nothing to show instead of drawing an empty value as if there were
        none. A field that can arrive this way has `LockedValue` among the types it
        is declared with.
      required:
        - locked
      properties:
        locked:
          type: array
          items:
            $ref: "#/components/schemas/MissingUnlock"
          description: Every unlock the field is waiting on. Never empty.
    ManeuverFrame:
      type: integer
      description: |-
        The basis a planned burn's delta-v components are expressed in. Read this
        before interpreting a burn vector: a basis this contract does not recognise
        gives components that cannot be labelled.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: RadialNormalPrograde
          description: |-
            KSP's own maneuver-node basis: radial-out, normal, prograde, taken against
            the patch the node sits on at its own UT.
        - const: 1
          title: Unknown
          description: A frame this contract does not recognise.
    ManeuverNode:
      type: object
      description: |-
        One planned burn: named delta-v components in a named frame
        (`ManeuverNode.frame`), with the burn's impulsive instant and, when a burn
        time is modelled, its start and end.

        `ManeuverNode.ut` is the impulsive instant a stock node has;
        `ManeuverNode.ignitionUt` and `ManeuverNode.cutoffUt` are the finite burn's
        start and end. When no burn time is modelled those two are absent, never
        equal to each other or to `ManeuverNode.ut`: an absent duration means "not
        modelled", while a zero duration with a thrust would mean infinite
        acceleration.
      required:
        - id
        - ut
        - patches
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            Stable, opaque id: the `nodeId` that `vessel.maneuver.update` and
            `vessel.maneuver.remove` take. It round-trips into those commands whether
            the node was created through `vessel.maneuver.add` or placed by hand in the
            map view. A live capture always carries one; the empty string appears only
            on a node replayed from a recording that carries no ids.
        ut:
          type: number
          x-sitrep-unit: ut
          description: |-
            The instant of the burn's impulsive equivalent: the one instant a
            zero-duration model has, in UT seconds. Stock's `ManeuverNode.UT` is exactly
            this.

            It is not the ignition time: a finite burn starts before this and ends after
            it. `ManeuverNode.ignitionUt` and `ManeuverNode.cutoffUt` carry those two
            instants directly, so there is no "UT minus half the burn time" convention
            to guess.
        ignitionUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the engines light, in UT seconds, or null when nothing supplies a
            burn-duration model for this craft.

            Null is a real reading, not a failure. Stock computes a burn time only for a
            loaded vessel, so a queued burn on an unloaded craft has no ignition time
            rather than a guessed one.

            Never set equal to `ManeuverNode.ut` as a stand-in, so "when to light the
            engines is not known" stays distinct from "this burn is instantaneous".
        cutoffUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the engines cut, in UT seconds, or null on the same terms as
            `ManeuverNode.ignitionUt`. Burn duration is `CutoffUt - IgnitionUt`; there
            is no separate duration field.

            Not in general `Ut` plus half the duration: that symmetry holds only while
            the craft's mass is constant, and a long burn changes it.
        frame:
          description: |-
            The basis `ManeuverNode.dvRadial`/`ManeuverNode.dvNormal`/
            `ManeuverNode.dvPrograde` are expressed in. Null only on a node replayed
            from a recording that does not carry it, on the same terms as
            `ManeuverNode.id`. Do not read null as the stock basis.
          anyOf:
            - $ref: "#/components/schemas/ManeuverFrame"
              x-sitrep-unit: enum
            - type: "null"
        dvRadial:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            First delta-v component in `ManeuverNode.frame`'s basis, in m/s (radial
            under the stock basis). Null only if KSP's own dv component was non-finite
            (NaN/Infinity) this tick; the node is still sent, never dropped because one
            component came back bad.
        dvNormal:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            Second delta-v component in `ManeuverNode.frame`'s basis (normal). Null only
            if KSP's own dv component was non-finite this tick, as for
            `ManeuverNode.dvRadial`.
        dvPrograde:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            Third delta-v component in `ManeuverNode.frame`'s basis (prograde under the
            stock basis). Null only if KSP's own dv component was non-finite this tick,
            as for `ManeuverNode.dvRadial`.
        dvTotal:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            Magnitude of the burn's delta-v, in m/s. Null only if KSP's own dv magnitude
            was non-finite this tick, as for `ManeuverNode.dvRadial`.
        patches:
          type: array
          items:
            $ref: "#/components/schemas/OrbitPatch"
          description: |-
            This node's post-burn patch chain: element 0 is the orbit the vessel is on
            immediately after the burn (KSP's own `ManeuverNode.nextPatch`), followed by
            any later SOI-transition patches, built the same way as
            `VesselOrbit.patches` but starting from the node's own `nextPatch`. Always
            an array, never null: empty when the solver has not produced a post-burn
            patch yet (a just-added node mid-tick).

            **How one burn links to the next.** A burn's input trajectory is the patch
            in the previous burn's chain whose `PatchEndTransition` is
            `TransitionType.Maneuver`, equivalently the one whose `EndUt` equals this
            burn's `ManeuverNode.ut`. For the first burn it is the craft's own
            `vessel.orbit`. Every chain is a suffix of the previous one, but the number
            of patches skipped varies with how many SOI crossings fall between the two
            burns, so counting positions is not the rule and gets it wrong the first
            time a crossing appears.

            KSP re-parents strictly sequentially: inserting a burn ahead of an existing
            one re-derives every later chain, so a burn's input is always the previous
            burn's result.

            **Patched conics only.** A stock plan is a sequence of conics joined at SOI
            boundaries. A planner that integrates has no such boundaries and leaves this
            empty while still describing a valid burn, so an empty chain is never a
            malformed node.
    Meta:
      type: object
      description: |-
        The envelope every stream sample, event and command reply carries: where it
        was observed from, when it was true in the game, when it was delivered, and
        how current it is.
      required:
        - source
        - validAt
        - seq
        - deliveredAt
        - vantage
        - active
        - staleness
        - timelineEpoch
      properties:
        source:
          type: string
          x-sitrep-unit: id
          description: The node the sample was read from.
        validAt:
          type: number
          x-sitrep-unit: ut
          description: |-
            When the payload was true in the game, in seconds of KSP universal time, the
            same base every `*Ut` field on every payload uses. This is the instant a
            reading is "as of", and the one a client compares against the current UT to
            decide currency.
        seq:
          type: number
          x-sitrep-unit: id
          description: A number that rises by one with every frame the mod sends.
        deliveredAt:
          type: number
          x-sitrep-unit: ut
          description: |-
            When the mod handed the message to the transport, in the same universal time
            seconds as `Meta.validAt`. The two differ by the signal delay the vantage is
            under, so subtracting one from the other is how old the payload was when it
            arrived, and they are equal on a zero-delay link.
        vantage:
          type: string
          x-sitrep-unit: id
          description: |-
            The place the payload was observed from: a `commandCentre.roster` id,
            `"meta"` for an instant-class topic no distance applies to, or empty when
            the connection is at no command centre because none is active.
        quality:
          description: |-
            Whether the payload's subject is under physics: `Quality.Loaded` while KSP
            simulates the craft, when its orbital elements are osculating and a conic
            cannot be advanced from them, and `Quality.OnRails` while it coasts. Copied
            from the payload's own `meta.quality`, which only `vessel.orbit` states;
            absent from the wire on every other Topic.
          anyOf:
            - $ref: "#/components/schemas/Quality"
              x-sitrep-unit: enum
            - type: "null"
        active:
          type: boolean
          x-sitrep-unit: flag
          description: Always true on a frame the mod sends.
        staleness:
          description: How current the sample is.
          allOf:
            - $ref: "#/components/schemas/Staleness"
              x-sitrep-unit: enum
        timelineEpoch:
          type: number
          x-sitrep-unit: id
          description: |-
            Generation counter for the current timeline: `0` when the mod starts,
            incremented once for every quickload or rewind. Carried on every envelope,
            streams and command responses alike, so a sample from an abandoned
            pre-rewind timeline can be told apart. A client compares it against its own
            last-seen epoch to detect a rewind, rather than inferring one from a
            backward `validAt` jump, which a reordered or coalesced delivery could mask.
        gapSinceUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The `Meta.validAt` of the last sample on this topic that precedes a known
            break in the record, set only on the first sample delivered after that break
            and `null` on every other sample.

            Non-null is a positive claim, not an absence: data existed between this
            universal time and the carrying sample's own `Meta.validAt`, and it is gone.
            Two things produce one. A blackout recording that overran its storage bound
            had its oldest span dropped, so the replay resumes mid-hole. A channel that
            does not record at all (a session fact, never aboard the craft: see
            ChannelDeclaration.Recordable) has no replay, so its first post-blackout
            sample carries the whole outage as the gap.

            A client draws it as a break rather than joining across it: a line
            interpolated through an outage looks like data. Omitted from the wire when
            there is no gap, as `Meta.quality` is when unstated.
        sampleId:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Which recorded sample the payload is. Every delivery of one sample carries
            the same number, including the copy sent again when a client subscribes or
            resubscribes, and two samples recorded on one node never share one, even
            with the same instant and an identical payload. A client tells a repeated
            delivery from a repeated event by it: two frames with equal
            `Meta.timelineEpoch` and `Meta.sampleId` are the same sample.

            Set on every `stream-data` frame and binary frame header, and omitted from
            the wire on events and command replies, which are not recorded samples.
            Unrelated to `Meta.seq`, which numbers frames rather than samples.
    MissingUnlock:
      type: object
      description: |-
        One unlock a save is missing, named the way the game names it, so a client
        can say "Missing tech: Flight Control" or "Mission Control, needs Building
        level 2" without mapping an id to English.
      required:
        - kind
        - id
        - name
      properties:
        kind:
          description: Whether this is a tech node or a building.
          allOf:
            - $ref: "#/components/schemas/UnlockKind"
              x-sitrep-unit: enum
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            The game's own id for the unlock: a tech node's id in the research tree
            (such as `"basicRocketry"`), or a building's name (such as
            `"MissionControl"`). Use `MissingUnlock.name` for what to show.
        name:
          type: string
          x-sitrep-unit: text
          description: "The game's own title for it: \"Flight Control\", \"Mission Control\"."
        tier:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            For a building, the level it needs, counted from 1 as the game shows it.
            Absent for a tech node.
        scienceCost:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: For a tech node, the science it costs to research. Absent for a building.
    MissionObjectiveEntry:
      type: object
      description: |-
        One objective of a Making History mission. A mission is a flow chart of
        nodes, each node a step that leads to the next, and each objective is one
        node. Objectives are listed in the order the flow chart leads through them.
      properties:
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The objective's node id (a GUID string), stable for the life of the mission.
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: What the objective asks for, localised, as the mission author wrote it.
        description:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The author's longer description of the objective. `null` when it has none.
        state:
          description: |-
            Where the objective stands. `null` when the mission's state could not be
            read.
          anyOf:
            - $ref: "#/components/schemas/MissionObjectiveState"
              x-sitrep-unit: enum
            - type: "null"
    MissionObjectiveState:
      type: integer
      description: |-
        Where one Making History mission objective stands, worked out from how far
        the mission has progressed.

        On the wire it is an integer ordinal.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Pending
          description: The mission has not reached this objective yet.
        - const: 1
          title: Active
          description: |-
            The mission is on this objective now and is still running. Once the mission
            ends, the objective it ended on is `MissionObjectiveState.Reached` or
            `MissionObjectiveState.Failed` instead.
        - const: 2
          title: Reached
          description: |-
            The mission reached this objective and has moved past it, or ended
            successfully on it.
        - const: 3
          title: Failed
          description: The mission ended without success before this objective was met.
    MissionStatus:
      type: object
      description: |-
        The Making History mission that is running, or has just ended, in the
        current game. The whole payload is `null` when there is no mission game,
        when no mission has been set up, or when the expansion is not installed. The
        `game.dlc` Topic (`GameDlc`) says only whether the expansion is installed;
        with it installed, a `null` payload is one of the other two, and nothing on
        the stream says which. A `null` payload reaches a widget as a reading whose
        `state` is `"absent"` and which carries no value, so test the state rather
        than the value for `null`.

        A mission that has ended stays in the payload with `MissionStatus.finished`
        true until the game leaves the mission, so a client can show the outcome.

        Every field except `MissionStatus.objectives` is `null` whenever the raw
        value is absent or could not be read. Score fields are meaningful only when
        `MissionStatus.scoreEnabled` is true: a mission author can switch scoring
        off.
      required:
        - objectives
      properties:
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The mission's title, localised.
        phase:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The title of the mission's active node, the step of the mission's flow chart
            the mission is on now. `null` when it has no active node.
        started:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the mission has started.
        finished:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the mission has ended, in success or failure.
        succeeded:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the mission ended in success. Meaningful once
            `MissionStatus.finished` is true.
        scoreEnabled:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the mission awards a score at all.
        score:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: The score earned so far.
        maxScore:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: The most score the mission can award.
        objectives:
          type: array
          items:
            $ref: "#/components/schemas/MissionObjectiveEntry"
          description: |-
            The mission's objectives in the order its flow chart leads through them. A
            node that nothing in the flow chart leads to is left out. Empty when it has
            none.
    NoCommandArgs:
      type: object
      description: |-
        Take no args: stage, clear the target, recover, revert to launch, or go to
        the Tracking Station or Space Center. The empty args shape, for the core
        commands that operate on the current flight or the active vessel and so take
        nothing: `vessel.control.stage`, `vessel.target.clear`, `ksp.recover`,
        `ksp.revertToLaunch`, `ksp.toTrackingStation` and `ksp.toSpaceCenter`.

        Takes no arguments: send `args: {}`. Anything sent in `args` is ignored.
      properties: {}
      x-sitrep-empty: true
    OrbitEncounter:
      type: object
      description: |-
        The next sphere-of-influence transition on the vessel's trajectory: see
        `VesselOrbit.encounter`.
      required:
        - transitionType
        - transitionUt
      properties:
        transitionType:
          description: |-
            The kind of transition: always `TransitionType.Encounter` (entering another
            body's sphere of influence) or `TransitionType.Escape` (leaving the current
            one).
          allOf:
            - $ref: "#/components/schemas/TransitionType"
              x-sitrep-unit: enum
        transitionUt:
          type: number
          x-sitrep-unit: ut
          description: Universal time at which the vessel crosses the sphere-of-influence boundary.
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index into `trackingStation.bodies` of the body being transitioned into;
            null if that body couldn't be resolved.
    OrbitEntry:
      type: object
      description: |-
        A body's Keplerian orbital elements, present on every `BodyEntry` except the
        root star. Each element is independently `null` when its value is absent or
        non-finite, never a NaN token on the wire. Every orbit has a defined node
        and periapsis, an equatorial or circular one included, so a `null`
        `OrbitEntry.lan` or `OrbitEntry.argPe` is a genuine absence and never stands
        for either shape.

        Units follow KSP's own, which are mixed: `OrbitEntry.sma` in metres;
        `OrbitEntry.inc`, `OrbitEntry.lan` and `OrbitEntry.argPe` in degrees;
        `OrbitEntry.meanAnomalyAtEpoch` in radians; `OrbitEntry.epoch` in UT
        seconds. There is no eccentric anomaly field (see `BodyEntry`).
      properties:
        sma:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: Semi-major axis, metres.
        ecc:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Eccentricity.
        inc:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: Inclination, degrees.
        lan:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: Longitude of ascending node, degrees.
        argPe:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: Argument of periapsis, degrees.
        meanAnomalyAtEpoch:
          type:
            - number
            - "null"
          x-sitrep-unit: rad
          description: Mean anomaly at epoch, radians.
        epoch:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: Epoch UT, seconds.
    OrbitPatch:
      type: object
      description: |-
        One conic segment of a vessel's future trajectory, a patched-conic "patch"
        in KSP's own sense (`Orbit.nextPatch`/`previousPatch`). A patch carries
        everything needed to propagate and draw it with no `trackingStation.bodies`
        join: its Keplerian elements, KSP's own already-computed shape fields
        (`OrbitPatch.peA`, `OrbitPatch.apA`, `OrbitPatch.semiLatusRectum`,
        `OrbitPatch.semiMinorAxis`), its body's gravitational parameter
        (`OrbitPatch.mu`) and the transitions at each end.

        Bodies are carried twice. `OrbitPatch.referenceBodyIndex` and
        `OrbitPatch.closestEncounterBodyIndex` are the identity, the
        `trackingStation.bodies` index every other body reference in this contract
        uses (`VesselOrbit.referenceBodyIndex` among them).
        `OrbitPatch.referenceBody` and `OrbitPatch.closestEncounterBody` are the
        body's name, for display.

        `OrbitPatch.lan`, `OrbitPatch.argPe` and `OrbitPatch.meanAnomalyAtEpoch` are
        null when KSP's value for them is undefined, as `VesselOrbit.lan` and
        `VesselOrbit.argPe` are, and the patch is still sent. A patch with a null
        element cannot be propagated, so a client that propagates one declines to,
        and does not substitute a value.

        An open patch (`OrbitPatch.ecc` of 1 or more) is sent like any other, with
        `OrbitPatch.period` and `OrbitPatch.apA` null. Its mean motion is `sqrt(Mu /
        |Sma|^3)`.
      required:
        - sma
        - ecc
        - inc
        - epoch
        - startUt
        - endUt
        - patchStartTransition
        - patchEndTransition
        - peA
        - semiLatusRectum
        - semiMinorAxis
        - referenceBody
      properties:
        sma:
          type: number
          x-sitrep-unit: m
          description: |-
            Semi-major axis in metres, KSP's `Orbit.semiMajorAxis`. Negative on an open
            patch.
        ecc:
          type: number
          x-sitrep-unit: "1"
          description: |-
            Eccentricity, KSP's `Orbit.eccentricity`: below 1 for a closed patch, 1 or
            more for an open one, as on a flyby or an escape.
        inc:
          type: number
          x-sitrep-unit: °
          description: Inclination in degrees, KSP's `Orbit.inclination`.
        lan:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Longitude of the ascending node in degrees, KSP's `Orbit.LAN`. Null when
            KSP's value is undefined (NaN).
        argPe:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Argument of periapsis in degrees, KSP's `Orbit.argumentOfPeriapsis`. Null
            when KSP's value is undefined (NaN).
        meanAnomalyAtEpoch:
          type:
            - number
            - "null"
          x-sitrep-unit: rad
          description: |-
            Mean anomaly at `OrbitPatch.epoch` in radians, KSP's
            `Orbit.meanAnomalyAtEpoch`. Null when KSP's value is undefined (NaN).
        epoch:
          type: number
          x-sitrep-unit: ut
          description: |-
            The universal time at which `OrbitPatch.meanAnomalyAtEpoch` holds, KSP's
            `Orbit.epoch`.
        period:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            Orbital period in seconds, KSP's `Orbit.period`. Null on an open patch
            (`OrbitPatch.ecc` of 1 or more), which has no period; always finite and
            positive on a closed one.
        startUt:
          type: number
          x-sitrep-unit: ut
          description: |-
            Universal time at which the trajectory enters this patch, KSP's
            `Orbit.StartUT`.
        endUt:
          type: number
          x-sitrep-unit: ut
          description: |-
            Universal time at which the trajectory leaves this patch, KSP's
            `Orbit.EndUT`.
        patchStartTransition:
          description: How the trajectory enters this patch, KSP's `Orbit.patchStartTransition`.
          allOf:
            - $ref: "#/components/schemas/TransitionType"
              x-sitrep-unit: enum
        patchEndTransition:
          description: |-
            How the trajectory leaves this patch, KSP's `Orbit.patchEndTransition`.
            `TransitionType.Final` when it does not leave it.
          allOf:
            - $ref: "#/components/schemas/TransitionType"
              x-sitrep-unit: enum
        peA:
          type: number
          x-sitrep-unit: m
          description: |-
            Periapsis altitude above `OrbitPatch.referenceBody`'s mean radius in metres,
            KSP's `Orbit.PeA`.
        apA:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Apoapsis altitude above `OrbitPatch.referenceBody`'s mean radius in metres,
            KSP's `Orbit.ApA`. Null on an open patch (`OrbitPatch.ecc` of 1 or more),
            which has no apoapsis.
        semiLatusRectum:
          type: number
          x-sitrep-unit: m
          description: Semi-latus rectum in metres, KSP's `Orbit.semiLatusRectum`.
        semiMinorAxis:
          type: number
          x-sitrep-unit: m
          description: Semi-minor axis in metres, KSP's `Orbit.semiMinorAxis`.
        referenceBody:
          type: string
          x-sitrep-unit: text
          description: |-
            Name of the body this patch orbits, as `trackingStation.bodies` names it.
            For display; `OrbitPatch.referenceBodyIndex` is the identity.
        closestEncounterBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Name of the body this patch's trajectory most closely encounters, KSP's
            `Orbit.closestEncounterBody`; null when there is none. For display;
            `OrbitPatch.closestEncounterBodyIndex` is the identity.
        mu:
          type:
            - number
            - "null"
          x-sitrep-unit: m³/s²
          description: |-
            Parent body's standard gravitational parameter (GM), read off the same body
            the elements are relative to, so a patch can be propagated from what it
            carries, as `VesselOrbit.mu` does for a vessel's own orbit.

            Null only on a patch read off a recording that does not carry it, on the
            same terms as `ManeuverNode.id`. Never 0.
        referenceBodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Body this patch orbits, as its `trackingStation.bodies` index (KSP's
            `CelestialBody.flightGlobalsIndex`). This is the identity, where
            `OrbitPatch.referenceBody` is the display name, and it is the key every
            other body reference in this contract uses
            (`VesselOrbit.referenceBodyIndex`, `VesselTarget`, `TargetAvailable`,
            `VesselIdentity.ParentBodyIndex`).

            Null only on a patch read off a recording that does not carry it, as for
            `OrbitPatch.mu`. `0` is a real index (the star), so null is the only absent
            value.
        closestEncounterBodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            `OrbitPatch.closestEncounterBody`'s `trackingStation.bodies` index, on the
            same terms as `OrbitPatch.referenceBodyIndex`. Null when there is no
            encounter, and also null on a recording that does not carry it; read
            `OrbitPatch.closestEncounterBody` to tell the two apart.
    OrbitPayloadMeta:
      type: object
      description: |-
        `vessel.orbit`'s provenance stamp, which also says whether the craft is
        under physics. The orbit is the one payload that states it, because a conic
        can advance a coast and cannot advance osculating elements.
      required:
        - source
        - quality
      properties:
        source:
          type: string
          x-sitrep-unit: id
          description: "`\"vessel:<guid>\"` for the craft the orbit belongs to."
        quality:
          description: Whether the craft is on rails or loaded under physics.
          allOf:
            - $ref: "#/components/schemas/Quality"
              x-sitrep-unit: enum
    PartBounds:
      type: object
      description: |-
        A `VesselPart`'s local bounding box: `PartBounds.size` is the part's
        `prefabSize` (a per-part-type constant approximating its rendered bounds),
        `PartBounds.center` the mesh-centre offset from the part's own origin
        (`Part.boundsCentroidOffset`). A fuel-line part reports bounds wrapping the
        whole conduit, as KSP does.

        Both are in the part's own frame (`part-local`), never the vessel's: they
        are authored fields of the part's config node, so one value has to serve
        every instance of that part however it was assembled. A consumer placing the
        box on a ship rotates both by that part's `orgRot` before adding
        `VesselPart.position`, which is `vessel-local`.
      required:
        - size
      properties:
        size:
          type: object
          description: "`Part.prefabSize`: the part's untransformed bounding-box extents (metres)."
          required:
            - x
            - y
            - z
          properties:
            x: &a3
              type: number
              x-sitrep-unit: m
            y: *a3
            z: *a3
        center:
          type:
            - object
            - "null"
          description: |-
            `Part.boundsCentroidOffset`: mesh-centre offset from the part's own origin
            (metres, part-local); `null` when absent.

            Part-local, not vessel-local: an authored per-part-type constant like
            `PartBounds.size` beside it, so one value serves every instance of the part
            at whatever attitude it was assembled at. `VesselPart.position` is
            `vessel-local`, so adding the two raw mixes frames and lands the box
            somewhere the part is not; rotate this one by the part's `orgRot` first.
          required:
            - x
            - y
            - z
          properties:
            x: &a4
              type: number
              x-sitrep-unit: m
            y: *a4
            z: *a4
    PartModuleState:
      type: object
      description: |-
        One module's behavioural state in `VesselPart.moduleStates`.
        `PartModuleState.type` discriminates the module and `PartModuleState.state`
        carries the standardised deploy/activation word, whose vocabulary is on that
        property.
      required:
        - type
        - state
      properties:
        type:
          type: string
          x-sitrep-unit: id
          description: |-
            Discriminator: `solarPanel` / `radiator` / `antenna` / `parachute` /
            `engine` / `drill` / `landingGear`. `cargoBay` is a defined vocabulary value
            that no module currently produces.
        state:
          type: string
          x-sitrep-unit: text
          description: |-
            The standardised deploy/activation state, one closed vocabulary across every
            `PartModuleState.type` rather than each module's own enum spelling.

            - `extended` / `retracted` / `deploying` / `retracting`, for anything that
              animates: solar panels, radiators, antennas, landing gear.
            - `stowed` / `armed` / `extended` / `broken`, the parachute lifecycle.
              `armed` means staged and waiting for its atmospheric trigger, which is not
              the same as deployed.
            - `active` / `inactive`, for engines and drills.
            - `unknown` when the underlying game enum maps to none of the above, which
              is a statement that the state was read and not recognised rather than a
              stand-in for retracted.
        tracking:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: "Solar-panel-only: sun-tracking gimbal active. `null` for every other type."
        flameout:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Engine-only: fuel-starved. `null` unless `true` (never emitted as a bare
            `false`).
    PartResourceFlow:
      type: object
      description: |-
        One resource row in `VesselPart.resources`: storage
        (`PartResourceFlow.amount`/`PartResourceFlow.maxAmount`) plus live flow
        (`PartResourceFlow.flow`/`PartResourceFlow.nominalFlow`).

        **Flow scope.** `PartResourceFlow.flow` and `PartResourceFlow.nominalFlow`
        are populated only for modules whose live rate can be read directly: solar
        panels (`ModuleDeployableSolarPanel.flowRate` and `chargeRate`), alternators
        (`ModuleAlternator.outputRate`), and engine propellant consumption
        (`Propellant.currentRequirement`, signed negative). Resource converters,
        fuel cells and drills report storage only, with no rate.
        `PartResourceFlow.nominalFlow` is `null` whenever it would equal
        `PartResourceFlow.flow`.
      properties:
        amount:
          type:
            - number
            - "null"
          x-sitrep-unit: units
          description: |-
            `PartResource.amount`: current stored amount. Null when it could not be
            read.
        maxAmount:
          type:
            - number
            - "null"
          x-sitrep-unit: units
          description: "`PartResource.maxAmount`: storage capacity. Null when it could not be read."
        flow:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            Signed units per second: positive is producing, negative is consuming.
            `null` when no module with a readable rate contributes.
        nominalFlow:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            The rate at 100% efficiency, with the same sign as `PartResourceFlow.flow`
            (a solar panel's rated output). `null` when no module has a nominal rate, or
            when it would equal `PartResourceFlow.flow`.
        unratedProcess:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            `true` when a running module on the part draws or yields this resource
            through a process and no rate for it can be read: a resource converter, fuel
            cell or ISRU unit, a drill's harvest, or a generator. Never true on a row
            with a non-zero `PartResourceFlow.flow` or `PartResourceFlow.nominalFlow`,
            nor for storage alone. Absent otherwise.
    PartsPower:
      type: object
      description: |-
        The active vessel's rolled-up electric-charge production. A single object,
        or `null` when there is no active vessel or it carries no solar panel,
        battery, electric-charge converter or alternator. The parts themselves are
        itemised on `vessel.parts`.
      properties:
        totalProductionEc:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            Total electric-charge production in EC per second: the sum of every solar
            panel's live flow rate and every alternator's live output rate. Fuel cells
            are not included. Null when no finite total could be read.
    PayloadMeta:
      type: object
      description: |-
        The provenance stamp carried inside a payload that describes one subject,
        such as most `vessel.*` payloads and `time.warp` (`VesselIdentity.Meta` and
        so on).

        It says what the payload is about, and nothing about its delivery: `seq`,
        `deliveredAt`, `vantage` and `validAt` are on the envelope `Meta`, one per
        `stream-data` frame.

        `PayloadMeta.source` takes one of two forms: `"vessel:<guid>"` when the
        payload describes one craft, or `"game"` when it describes the session. A
        SCET threshold alarm accepts a reading only from a payload whose source is
        the alarm's own subject.
      required:
        - source
      properties:
        source:
          type: string
          x-sitrep-unit: id
          description: |-
            `"vessel:<guid>"` when the payload describes one craft, or `"game"` when it
            describes the session.
    PhysicsMode:
      type: integer
      description: |-
        The active vessel's physics-simulation regime, derived from KSP's own
        `Vessel.loaded` and `Vessel.packed` flags. It is a discrete enum in its own
        right, not a quality band on `OrbitPayloadMeta.quality`. A widget that
        switches propagation or dead-reckoning strategy reads it to know whether the
        craft is on-rails conics, a packed cluster, or a fully physics-simulated
        vessel.

        Mapping:

        - `!loaded` ⇒ `PhysicsMode.OnRails`: the vessel is unloaded, its motion is
          pure on-rails conic propagation, no PhysX at all.
        - `loaded && packed` ⇒ `PhysicsMode.Packed`: loaded into the scene but still
          packed (rails-following near the active vessel, not yet unpacked into full
          physics).
        - `loaded && !packed` ⇒ `PhysicsMode.Unpacked`: fully physics-simulated
          (off-rails).

        `PhysicsMode.Unknown` covers a raw value this contract does not recognise
        (same convention as `SasMode` and `VesselType`).
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: OnRails
          description: "Not loaded: pure on-rails conic propagation, no physics simulation."
        - const: 1
          title: Packed
          description: |-
            Loaded into the scene but still packed, following rails near the active
            vessel.
        - const: 2
          title: Unpacked
          description: "Loaded and unpacked: fully physics-simulated, off rails."
        - const: 3
          title: Unknown
          description: A raw value this contract does not recognise.
    Ping:
      type: object
      description: |-
        Asks for a `Pong`, to tell a connection that is quiet from one that is dead.
        A subscribed connection can be silent for as long as nothing it subscribed
        to changes, so silence alone says nothing; a ping that goes unanswered does.
        It is replied to at once and in every scene, changes nothing, and needs no
        subscription.
      required:
        - type
        - nonce
      properties:
        type:
          type: string
          const: ping
          x-sitrep-unit: id
          description: The frame type, always `"ping"`.
        nonce:
          type: string
          x-sitrep-unit: id
          description: |-
            Anything the client likes, returned unchanged in the reply `Pong` so it can
            tell which ping was answered. May be omitted, in which case the reply
            carries an empty one.
    Pong:
      type: object
      description: The answer to a `Ping`.
      required:
        - type
        - nonce
      properties:
        type:
          type: string
          const: pong
          x-sitrep-unit: id
          description: The frame type, always `"pong"`.
        nonce:
          type: string
          x-sitrep-unit: id
          description: The `Ping.nonce` of the ping this replies to.
    PropagationCertification:
      type: integer
      description: |-
        Whether a caller accepts a result past the span the provider vouches for. It
        chooses certification, not which model runs: both values get the same model
        from the same provider.

        `PropagationCertification.Unspecified` is zero and means nothing was chosen,
        so a default value never grants the permissive setting.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Unspecified
          description: |-
            Nothing was chosen. A request carrying this is refused rather than given a
            default.
        - const: 1
          title: Unbounded
          description: |-
            Return a result wherever the solver can reach, past any horizon. For a
            planning search, such as a transfer grid, which asks a two-body question
            about future instants on purpose.
        - const: 2
          title: CertifiedOnly
          description: |-
            Return results only across spans the provider vouches for, and decline past
            them. For an operational prediction, such as when a link will be reacquired,
            where a time read off an unvouched arc would look certain without being so.
    PropagationDepartureKnot:
      type: object
      description: |-
        The largest distance the published conic may be from the path anywhere
        between the sample instant and `PropagationDepartureKnot.untilUt`.

        Each knot is a running maximum, so reading the list as a step function is a
        cap at every instant even though the drift itself is not monotonic.
      required:
        - untilUt
        - metres
        - metresPerSecond
      properties:
        untilUt:
          type: number
          x-sitrep-unit: ut
          description: The last UT this knot covers.
        metres:
          type: number
          x-sitrep-unit: m
          description: |-
            The largest position drift up to `PropagationDepartureKnot.untilUt`, in
            metres.
        metresPerSecond:
          type: number
          x-sitrep-unit: m/s
          description: The largest velocity drift up to `PropagationDepartureKnot.untilUt`, in m/s.
    PropagationHorizon:
      type: object
      description: |-
        The window over which an element set is authoritative, as stated by
        whichever propagation provider produced it.

        Measured from the sample's observation instant, not from
        `VesselOrbit.epoch`. `Epoch` is the mean-anomaly reference epoch and can sit
        far from when the sample was taken.
      required:
        - kind
        - trajectoryKind
      properties:
        kind:
          description: |-
            How far the elements may be carried forward. When
            `PropagationHorizonKind.Until`, `PropagationHorizon.untilUt` says where the
            window ends.
          allOf:
            - $ref: "#/components/schemas/PropagationHorizonKind"
              x-sitrep-unit: enum
        trajectoryKind:
          description: |-
            What kind of trajectory these elements describe: a conic that is the path,
            or a snapshot of an integrated one.

            The horizon says how far a client may extrapolate; this says whether a conic
            is the right renderer at all, and the one cannot be inferred from the other.
            An analytic provider reports `PropagationHorizonKind.Unbounded`, and so may
            an integrating provider where perturbations are small and the horizon is
            genuinely long. A client that reasons "unbounded, therefore analytic" draws
            a closed conic for an integrated trajectory: right at the sample instant,
            wrong as a path.

            To identify the provider for diagnostics, read `system.uplinks`, which
            carries each Uplink's id, version and availability.
          allOf:
            - $ref: "#/components/schemas/TrajectoryKind"
              x-sitrep-unit: enum
        untilUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The last UT these elements are authoritative for. Set if and only if
            `PropagationHorizon.kind` is `PropagationHorizonKind.Until`; null otherwise,
            never a sentinel standing in for "forever".
        departure:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/PropagationDepartureKnot"
          description: |-
            How far the published conic may be from the path, at most, ahead of the
            sample instant: a step function of knots in ascending
            `PropagationDepartureKnot.untilUt`. A client at some UT takes the first knot
            whose `UntilUt` is at or after it.

            Null when the provider stated no error, in which case no interval is drawn
            about the conic. It is never an empty list and never zeros standing in for
            "not stated". Set only when `PropagationHorizon.kind` is
            `PropagationHorizonKind.Until`, and the last knot's `UntilUt` then equals
            `PropagationHorizon.untilUt`.
    PropagationHorizonKind:
      type: integer
      description: |-
        How far an element set may be carried forward.

        `PropagationHorizonKind.Unspecified` is 0, so a producer that does not set
        the horizon gets the refusing value rather than the permissive one.

        `PropagationHorizonKind.Unbounded` is a claim, made by a provider that
        genuinely has no limit (an analytic two-body solver). It is its own value
        rather than an infinite `PropagationHorizon.untilUt`, so "forever" never has
        to be recognised as an extreme number.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Unspecified
          description: No provider stated one. Treat as unpropagatable.
        - const: 1
          title: Unbounded
          description: "Authoritative for all future UT: an analytic solver with no horizon."
        - const: 2
          title: Until
          description: Authoritative until `PropagationHorizon.untilUt`.
    Quality:
      type: integer
      description: |-
        Whether a payload's subject is simulated under physics (`Quality.Loaded`) or
        moving on rails (`Quality.OnRails`).
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: OnRails
          description: "Moving on rails: KSP is not simulating it, and its orbit is a fixed conic."
        - const: 1
          title: Loaded
          description: Loaded and simulated under physics.
    RecoveryCrewEntry:
      type: object
      description: |-
        One crew member aboard at recovery: an entry of
        `RecoveryReport.crewBreakdown`.
      required:
        - name
        - trait
        - isTourist
        - newLevel
      properties:
        name:
          type: string
          x-sitrep-unit: text
          description: The kerbal's name, which is also their roster key.
        trait:
          type: string
          x-sitrep-unit: text
          description: The kerbal's career trait (e.g. `"Pilot"`).
        isTourist:
          type: boolean
          x-sitrep-unit: flag
          description: Whether the kerbal is a tourist, who earns no experience.
        xpGained:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Experience points this flight added. Null in a save that awards no
            experience (Sandbox).
        levelsGained:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            How many experience levels this flight added: `RecoveryCrewEntry.newLevel`
            minus the level before. Null in a save that awards no experience (Sandbox).
        newLevel:
          type: number
          x-sitrep-unit: count
          description: The kerbal's experience level after this flight, 0 to 5 in stock.
    RecoveryPartEntry:
      type: object
      description: |-
        One recovered-part group: an entry of `RecoveryReport.partBreakdown`. Parts
        of the same kind and the same recovered value are grouped, hence
        `RecoveryPartEntry.count`. Every value is already scaled by the recovery
        factor.
      required:
        - partName
        - partTitle
        - count
      properties:
        partName:
          type: string
          x-sitrep-unit: text
          description: The part's `partInfo.name` (e.g. `"mk1pod.v2"`).
        partTitle:
          type: string
          x-sitrep-unit: text
          description: The part's `partInfo.title` (e.g. `"Mk1 Command Pod"`).
        count:
          type: number
          x-sitrep-unit: count
          description: How many parts are in this group. At least 1.
        partValue:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            The recovered dry value of one part in the group, excluding its resources.
            Null in a save with no funds.
        resourcesValue:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            The recovered value of the resources the group's parts held, summed over the
            group. Null in a save with no funds.
        totalValue:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            The group's recovered dry value: `RecoveryPartEntry.partValue` times
            `RecoveryPartEntry.count`. Does not include
            `RecoveryPartEntry.resourcesValue`. Null in a save with no funds.
    RecoveryRecent:
      type: object
      description: |-
        The payload for the `recovery.hasRecent` channel: one flag saying a vessel
        recovery is on record for the current save, published beside
        `RecoveryReport` on `recovery.lastSummary`. It is true from the first
        recovery of a real craft and is not published before one.
      required:
        - recent
      properties:
        recent:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when a recovery is on record, so `recovery.lastSummary` has a summary
            to read.
    RecoveryReport:
      type: object
      description: |-
        The payload for the `recovery.lastSummary` channel: the most recent vessel
        recovery in the current save, as KSP's mission recovery dialog reports it.
        Every value is delivered, in order, so a late subscriber is sent the last
        recovery. The recovery-side counterpart of `CrashReport`.

        Published only for a real craft: recovering debris, a flag or a vessel of
        unknown type publishes nothing. The four breakdown lists can be empty while
        the totals are present, if KSP's dialog could not be read for them.

        A figure the save cannot award is `null`, never 0: funds and science are
        null in a Sandbox save (and funds in a Science save). A Sandbox recovery
        still produces a record, with the craft, where it came down, its parts and
        its crew, and nothing awarded.
      required:
        - capturedAtUT
        - vesselName
        - recoveryLocation
        - recoveryFactor
        - displayReputation
        - scienceBreakdown
        - partBreakdown
        - resourceBreakdown
        - crewBreakdown
      properties:
        capturedAtUT:
          type: number
          x-sitrep-unit: ut
          description: When the recovery was captured, in UT seconds.
        vesselName:
          type: string
          x-sitrep-unit: text
          description: The recovered vessel's name, as KSP holds it (`ProtoVessel.vesselName`).
        recoveryLocation:
          type: string
          x-sitrep-unit: text
          description: |-
            Where the vessel came down: KSP's own recovery-location string (e.g.
            `"KSC"`, `"Water"`).
        recoveryFactor:
          type: string
          x-sitrep-unit: text
          description: |-
            KSP's own recovery-factor display string (e.g. `"100%"`), the payout
            multiplier for landing precision.
        scienceEarned:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            Science this recovery earned, as KSP's recovery dialog totals it. Null in a
            save with no science (Sandbox).
        totalScience:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            The career's science balance as the recovery dialog reports it. Null in a
            save with no science (Sandbox).
        fundsEarned:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            Funds this recovery earned, after the recovery factor and any strategy
            modifiers KSP applies to a recovery. Null in a save with no funds (Science
            or Sandbox).
        totalFunds:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            The career's funds balance as the recovery dialog reports it. Null in a save
            with no funds (Science or Sandbox).
        reputationEarned:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: |-
            Reputation this recovery earned, after any strategy modifiers KSP applies.
            Null in a save with no reputation (Science or Sandbox), where
            `RecoveryReport.displayReputation` is false.
        totalReputation:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: |-
            The career's reputation as the recovery dialog reports it. Null in a save
            with no reputation (Science or Sandbox), where
            `RecoveryReport.displayReputation` is false.
        displayReputation:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether reputation applies to this save: false in Science and Sandbox, where
            the reputation fields carry nothing meaningful.
        scienceBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryScienceEntry"
          description: |-
            Each science subject recovered, in the order KSP's dialog lists them. Empty
            when nothing was recovered or the dialog could not be read.
        partBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryPartEntry"
          description: |-
            Each group of recovered parts, in the order KSP's dialog lists them. Empty
            when the dialog could not be read.
        resourceBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryResourceEntry"
          description: |-
            Each recovered resource, in the order KSP's dialog lists them. Empty when
            there were none or the dialog could not be read.
        crewBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryCrewEntry"
          description: |-
            Each crew member aboard at recovery. Empty for an uncrewed vessel or when
            the dialog could not be read.
    RecoveryResourceEntry:
      type: object
      description: |-
        One recovered-resource group: an entry of
        `RecoveryReport.resourceBreakdown`.
      required:
        - resourceName
        - amount
        - unitValue
        - totalValue
      properties:
        resourceName:
          type: string
          x-sitrep-unit: text
          description: The resource's KSP definition name, e.g. `LiquidFuel`.
        amount:
          type: number
          x-sitrep-unit: units
          description: How much of the resource was recovered, summed over every part that held it.
        unitValue:
          type: number
          x-sitrep-unit: funds
          description: |-
            The recovered value of one unit of the resource, already scaled by the
            recovery factor.
        totalValue:
          type: number
          x-sitrep-unit: funds
          description: |-
            The recovered value of the whole amount: `RecoveryResourceEntry.unitValue`
            times `RecoveryResourceEntry.amount`.
    RecoveryScienceEntry:
      type: object
      description: |-
        One science subject recovered: an entry of
        `RecoveryReport.scienceBreakdown`.
      required:
        - subjectId
        - subjectTitle
        - dataGathered
        - scienceAmount
      properties:
        subjectId:
          type: string
          x-sitrep-unit: id
          description: The KSP science subject id, e.g. `crewReport@KerbinSrfLandedLaunchPad`.
        subjectTitle:
          type: string
          x-sitrep-unit: text
          description: The subject's display title, as KSP writes it.
        dataGathered:
          type: number
          x-sitrep-unit: Mit
          description: How much data was recovered for this subject.
        scienceAmount:
          type: number
          x-sitrep-unit: science
          description: Science earned for this subject by this recovery.
    RemoveManeuverNodeArgs:
      type: object
      description: Delete a manoeuvre node. Takes the manoeuvre node to delete.
      required:
        - nodeId
      properties:
        nodeId:
          type: string
          x-sitrep-unit: id
          description: "The node to delete: a `ManeuverNode.id` from `vessel.maneuver`."
    ResourceAmount:
      type: object
      description: |-
        One resource's amounts aboard the vessel. See `VesselResources` for what an
        absent key and an absent channel mean.
      required:
        - current
        - max
        - active
      properties:
        current:
          type: number
          x-sitrep-unit: units
          description: |-
            How much of the resource the vessel holds now, the amount
            `Vessel.GetConnectedResourceTotals` reports. `0` with a positive
            `ResourceAmount.max` is a real reading: carried and empty.
        max:
          type: number
          x-sitrep-unit: units
          description: |-
            The vessel's capacity for the resource, the maximum
            `Vessel.GetConnectedResourceTotals` reports. Always greater than zero: a
            resource with no capacity is left out of the map.
        active:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Presence flag: `true` for every resource reported this tick, so a
            present-but-zero resource (`{current: 0, max: > 0, active: true}`) is
            distinguishable from one that is not reported. Treat a missing or `false`
            entry as "not reported", never as a zero reading. This is presence only: it
            says nothing about flow or rate.
    RevertAvailability:
      type: object
      description: |-
        Whether the two stock in-flight revert actions are available right now, so a
        widget can enable its Revert to Launch and Revert to Editor controls exactly
        when KSP's own pause menu shows them.

        The whole payload is `null` (no key emitted) outside the flight scene, where
        the flags mean nothing. In flight both bools are always present: `false`
        means that revert is not available right now.

        Not delayed by signal delay: it is a fact about the game, not vessel
        telemetry, and carries no per-payload `Meta` of its own (the envelope's
        applies).
      required:
        - canRevertToEditor
        - canRevertToLaunch
      properties:
        canRevertToEditor:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the active flight can be reverted to the editor (VAB or SPH), KSP's
            `FlightDriver.CanRevertToPrelaunch`.
        canRevertToLaunch:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the active flight can be reverted to its launch (on-the-pad) state,
            KSP's `FlightDriver.CanRevertToPostInit`.
    RevertToEditorArgs:
      type: object
      description: |-
        Revert the flight back into the VAB or SPH. Takes the editor the flight
        reverts back into. `RevertToEditorArgs.editor` is a small opaque string
        (`"vab"` or `"sph"`, case-insensitive) rather than the KSP `EditorFacility`
        enum; an unrecognised value fails with `CommandErrorCode.Range` before the
        game is ever touched.

        `ksp.revertToLaunch`, `ksp.toTrackingStation`, `ksp.toSpaceCenter` and
        `ksp.recover` take no args (they operate on the current flight / active
        vessel), so they have no arg type here.
      required:
        - editor
      properties:
        editor:
          type: string
          x-sitrep-unit: text
          description: |-
            `"vab"` or `"sph"` (case-insensitive). Any other value yields
            `CommandResult.errorCode` `CommandErrorCode.Range`.
    RoboticsAvailability:
      type: object
      description: |-
        A single object (or `null` when there is no active vessel) whose one field
        states whether the active vessel carries any Breaking Ground robotic servo.
        It is its own Topic because the `robotics.servos` array is `null` both when
        the vessel has no robotic parts and when there is no vessel, and a widget
        needs to tell "no robotics on this craft" from "nothing to show".

        Not the same as the Breaking Ground DLC-presence fact
        (`deployed.available`): this reflects parts on this vessel, so it is delayed
        by signal delay, whereas DLC presence is known on the ground at once.

        `RoboticsAvailability.available` is three-state. `null` means the craft
        could not be surveyed: a recording that does not carry this field, or a live
        read where one part could not be read, since "no robotic parts" is a claim
        about every part. `false` is the definite "this craft carries none". A
        client that treats null as false tells the operator there are no robotic
        parts on a craft that may be full of them.
      properties:
        available:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            True when the vessel carries at least one robotic servo, false when it
            definitely carries none, null when it could not be surveyed.
    RosterCommsControlSource:
      type: integer
      description: |-
        A roster vessel's control level, as stock CommNet reports it
        (`Vessel.connection.GetControlLevel()`), for
        `CatalogEntry.commsControlSource`. Not the same type as
        `CommsControlSource`, which belongs to the active vessel's `comms.*`
        channels and whatever comms mod provides them.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: None
          description: "A measurement: the vessel has no control source."
        - const: 1
          title: Partial
          description: |-
            Partial control: KSP's `PARTIAL_MANNED` or `PARTIAL_UNMANNED` level, such as
            a probe core with no link home.
        - const: 2
          title: Full
          description: "Full control: KSP's `FULL` level."
        - const: 3
          title: Unknown
          description: |-
            The game reported a control level this build does not name. Not
            `RosterCommsControlSource.None`: nothing was measured to be absent, the
            level simply has no tier here yet.
    RosterPlaceSource:
      type: integer
      description: |-
        How a command centre last learned where an object in its
        `TrackingStationCatalog` is.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Heard
          description: The vessel said where it is, over a link that reached the centre.
        - const: 1
          title: Seen
          description: The centre saw the vessel there, with nothing between them.
    RotorReverseArgs:
      type: object
      description: |-
        Args for `robotics.rotor.reverse`: flips the rotor's spin direction. It is
        the one robotics command that is a toggle, reversing whichever way the rotor
        spins now, so it carries no state field, only the `RotorReverseArgs.partId`
        to act on.
      required:
        - partId
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's flight id, as a string: the id each `parts.robotics` entry
            carries.
    RotorSetBrakeArgs:
      type: object
      description: |-
        Set a rotor's brake strength. Args for `robotics.rotor.setBrake`: the
        absolute brake strength to apply, keyed by `RotorSetBrakeArgs.partId`. A
        value outside 0 to 200 fails with `CommandErrorCode.Range`.
      required:
        - partId
        - percent
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's flight id, as a string: the id each `parts.robotics` entry
            carries.
        percent:
          type: number
          x-sitrep-unit: "%"
          description: The brake strength as KSP's brake percentage, 0 to 200.
    RotorSetRpmLimitArgs:
      type: object
      description: |-
        Set a rotor's rpm cap. Args for `robotics.rotor.setRpmLimit`: the absolute
        rpm cap to apply, keyed by `RotorSetRpmLimitArgs.partId`.
      required:
        - partId
        - rpm
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's flight id, as a string: the id each `parts.robotics` entry
            carries.
        rpm:
          type: number
          x-sitrep-unit: rpm
          description: The rpm cap to apply, in revolutions per minute.
    RotorSetTorqueLimitArgs:
      type: object
      description: |-
        Set a rotor's torque limit. Args for `robotics.rotor.setTorqueLimit`: the
        absolute torque limit to apply, keyed by `RotorSetTorqueLimitArgs.partId`. A
        value outside 0 to 100 fails with `CommandErrorCode.Range`.
      required:
        - partId
        - percent
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's flight id, as a string: the id each `parts.robotics` entry
            carries.
        percent:
          type: number
          x-sitrep-unit: "%"
          description: The torque limit as a percentage of the rotor's maximum torque, 0 to 100.
    SasMode:
      type: integer
      description: |-
        The SAS autopilot's hold mode, KSP's `VesselAutopilot.AutopilotMode` with
        the same member names. The directional modes follow the navball's current
        speed mode (orbit, surface or target). `SasMode.Unknown` stands for a value
        this contract does not recognise.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: StabilityAssist
          description: Holds the vessel's current attitude.
        - const: 1
          title: Prograde
          description: Points along the velocity vector.
        - const: 2
          title: Retrograde
          description: Points against the velocity vector.
        - const: 3
          title: Normal
          description: Points along the orbit normal.
        - const: 4
          title: Antinormal
          description: Points against the orbit normal.
        - const: 5
          title: RadialIn
          description: Points towards the body being orbited.
        - const: 6
          title: RadialOut
          description: Points away from the body being orbited.
        - const: 7
          title: Target
          description: Points towards the current target.
        - const: 8
          title: AntiTarget
          description: Points away from the current target.
        - const: 9
          title: Maneuver
          description: Points along the burn vector of the next maneuver node.
        - const: 10
          title: Unknown
          description: A mode this contract does not recognise.
    SaveSettingsArgs:
      type: object
      description: |-
        Apply the settings from one Save press together and write the settings file
        once. Arguments to `settings.save`: one Save press, applied together and
        written to the settings file once. Never delayed by signal delay.

        Safe to send again. A save sets each row to the value named, so repeating
        one that already landed changes nothing. That matters because a save that
        times out may still land.

        Refused, with nothing changed, when any row is not declared or any value is
        not one its row can hold. A save that changes the values but cannot write
        the file is not refused: the values are in force, and `settings.gonogo`'s
        `SettingsModel.persistence` says the file was not written.
      required:
        - changes
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SettingsChange"
          description: |-
            Every row to change, each with its new value. Rows not listed keep their
            values.
    SavedShipEntry:
      type: object
      description: |-
        One craft file in the `spaceCenter.savedShips` channel, a saved VAB or SPH
        design the player can launch, read from the save's craft folders via the
        stock `CraftProfileInfo` metadata loader.

        The channel is a bare array of these entries, one per `.craft` file keyed by
        `SavedShipEntry.file`. The whole payload is `null` (not an empty array) when
        no sample has arrived yet. Held at the home command.
      properties:
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: Craft name (`CraftProfileInfo.shipName`).
        file:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The `.craft` file name without its extension, under the save's `Ships/VAB`
            or `Ships/SPH` folder. Unique within a facility, which `SavedShipEntry.name`
            is not: two files can carry the same ship name. It is what `ksp.launch`'s
            `shipName` resolves, so send this back rather than `SavedShipEntry.name`.
        partCount:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: Part count (`CraftProfileInfo.partCount`).
        totalMass:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: Total mass in tonnes (`CraftProfileInfo.totalMass`).
        facility:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Which editor built it: the `EditorFacility` enum name, `"VAB"` or `"SPH"`
            (`CraftProfileInfo.shipFacility`). A display label; see
            `SavedShipEntry.facilityOrdinal`.
        facilityOrdinal:
          description: |-
            `SavedShipEntry.facility`'s KSP ordinal, typed to `KspEditorFacility`.

            This one is not a display concern. A client sends the facility straight back
            as the `ksp.launch` command's `facility` argument, so never substitute a
            default editor for a value it does not recognise: the craft would launch
            from the wrong facility. KSP's enum also declares `None`.

            `null` when the capture carried no facility, which is a third value and must
            not be read as either editor.
          anyOf:
            - $ref: "#/components/schemas/KspEditorFacility"
              x-sitrep-unit: enum
            - type: "null"
        requiresFunds:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            Funds needed before this can launch, the full craft cost
            (`CraftProfileInfo.totalCost`).
        missingParts:
          type:
            - array
            - "null"
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            Parts referenced by the craft that are not yet unlocked/purchased
            (`CraftProfileInfo.UnavailableShipParts`); an empty array when the craft is
            buildable as-is.
    ScetAddressableTopic:
      type: object
      description: |-
        One Topic a SCET (spacecraft event time) threshold alarm may be armed
        against: a row of the `alarm.scet.topics` channel.

        The channel is the whole table of what the game can read for a threshold, so
        a picker offers exactly those Topics, and `alarm.scet.arm` naming any other
        is refused. Any listed Topic is usable at any vantage.

        A Topic the table does not list is not addressable even when it is on the
        wire.
      required:
        - topic
      properties:
        topic:
          type: string
          x-sitrep-unit: id
          description: The Topic id a threshold's condition may name, such as `vessel.flight`.
    ScetAlarm:
      type: object
      description: |-
        One SCET alarm (an alarm on the craft's own clock, spacecraft event time) as
        the game holds it: the `alarm.activeList` Topic is a bare array of these.

        The roster exists so an operator can see which alarms are still set after a
        reconnect, and so a client can remove an entry it no longer remembers. The
        roster is held in memory for the game session and is not written to the
        save: when the session ends it is gone, and a client sets its alarms again.
        It is a list of what somebody asked for, not a reading of any craft, so the
        channel is not delayed by signal delay.
      required:
        - id
        - name
        - armedBy
        - vantage
        - subject
        - withheld
        - state
        - onFire
        - actsOn
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            The client's own id for the alarm, minted where the alarm was created and
            carried unchanged. Setting an alarm under an id already held replaces it, so
            repeating `alarm.scet.arm` is idempotent and a reconnect cannot duplicate a
            row.
        name:
          type: string
          x-sitrep-unit: text
          description: |-
            What the operator called it. Echoed so a roster row a client no longer
            recognises can still be named on screen.
        armedBy:
          type: string
          x-sitrep-unit: id
          description: |-
            The command centre the `alarm.scet.arm` command was sent from, as a
            `commandCentre.roster` id.

            Who asked for the alarm, never where it is read: that is
            `ScetAlarm.vantage`. A screen at a different vantage gets this field in
            full, unlike the condition and target, which would tell it about a craft
            before the signal delay from that craft has passed (see
            `ScetAlarm.withheld`).
        vantage:
          type: string
          x-sitrep-unit: id
          description: |-
            The place whose knowledge the condition is read against, and therefore the
            place that decides when this alarm comes due. A `commandCentre.roster` id
            (`"ground:<name>"`, `"vessel:<guid>"`). An empty vantage in the command is
            resolved to the alarm's own `ScetAlarm.subject` when the alarm is set.

            A vantage that is the subject reads the craft's true state, so the alarm
            comes due at the instant the condition is met. Any other vantage reads what
            that place has been told, which is a signal delay old and different
            everywhere, so the same condition comes due there after that place's signal
            delay. Every vantage sees the alarm come due; only the time differs.

            This is not the sender: `ScetAlarm.armedBy` says where the command came from
            and nothing else. An operator at one centre may ask when another centre will
            know, which where the command entered cannot express.

            A vantage is a place, not a connection: two operators sharing a command
            centre share its knowledge and its result.

            This empty-means-subject default belongs to the `alarm.scet.arm` command.
        subject:
          type: string
          x-sitrep-unit: id
          description: |-
            What the condition is about: `"vessel:<guid>"` for a craft, or `"game"` for
            something the whole game shares. The same vocabulary `meta.source` uses.

            A time condition is always `"game"`: universal time is the game's, and a
            clock has no craft to belong to. A threshold names the craft, and this is
            what stops it re-aiming without notice when the player switches vessels: the
            game compares this against the `meta.source` stamped on the payload it read,
            and a reading about somebody else's craft is ignored.

            A threshold on something the save owns rather than a craft is `"game"` too,
            such as `career.status`, and so is one on a Topic an Uplink contributes
            about the save.
        condition:
          description: |-
            What the alarm watches for, as it was set, or `null` when
            `ScetAlarm.withheld` is true.
          anyOf:
            - $ref: "#/components/schemas/ScetAlarmCondition"
            - type: "null"
        withheld:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether this row reached a session whose vantage is not the one that armed
            the alarm, and so carries only what that vantage may know.

            A withheld row keeps `ScetAlarm.id`, `ScetAlarm.armedBy`, `ScetAlarm.state`
            and `ScetAlarm.firedAtUt`, and carries `ScetAlarm.condition` as `null` and
            `ScetAlarm.name`, `ScetAlarm.vantage`, `ScetAlarm.subject`,
            `ScetAlarm.onFire` and `ScetAlarm.actsOn` empty: what another place is
            watching would otherwise reach here faster than light could carry it. A time
            alarm is never withheld, because a universal time names no craft and is the
            same instant everywhere.
        state:
          description: |-
            Where the alarm has got to: still watching, fired, unreachable or cancelled.
            See `ScetAlarmState`.
          allOf:
            - $ref: "#/components/schemas/ScetAlarmState"
              x-sitrep-unit: enum
        firedAtUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time the alarm fired at, or `null` until it has fired. On the
            craft's clock, like `ScetAlarmCondition.ut`.
        onFire:
          type: array
          items:
            $ref: "#/components/schemas/ScetAlarmAction"
          description: |-
            What the craft does when this alarm fires, in order. Empty for an alarm that
            only stops the warp and says so. See `ScetAlarmAction`.
        actsOn:
          type: string
          x-sitrep-unit: id
          description: |-
            The craft `ScetAlarm.onFire` acts on, as `"vessel:<guid>"`, or empty while
            there are no actions.

            The actions run only if this craft is the one being flown when the alarm
            fires, and are withheld otherwise: a time condition belongs to the game
            rather than to any craft, so after a vessel switch its actions would
            otherwise land on whatever happened to be active.
    ScetAlarmAction:
      type: object
      description: |-
        One thing the craft does in the frame its alarm fires, as a flight computer
        would: evaluated aboard, fired aboard, acted aboard.

        Held only by an alarm read at its own subject's vantage. `alarm.scet.arm`
        refuses actions on an alarm judged against what a command centre has been
        told, since acting on the craft in that frame would carry the ground's
        decision to it faster than light. A ground-side alarm's action travels as an
        ordinary command instead.

        Every kind but `ScetAlarmActionKind.Stage` toggles, against the state the
        craft reports at the moment of the fire, which is what pressing the group's
        key does.
      required:
        - kind
        - group
      properties:
        kind:
          description: |-
            What the action does: a stock singleton such as staging or SAS, or the
            custom group named by `ScetAlarmAction.group`.
          allOf:
            - $ref: "#/components/schemas/ScetAlarmActionKind"
              x-sitrep-unit: enum
        group:
          type: number
          x-sitrep-unit: id
          description: |-
            `ScetAlarmActionKind.ActionGroup` only: the custom group's 1-based index, as
            `vessel.control.setActionGroup` takes it. Zero for every other kind.
    ScetAlarmActionKind:
      type: integer
      description: |-
        What a SCET alarm's onboard action does to the craft when the alarm fires.

        A typed member for each stock singleton and one for every custom group, so
        no name ever crosses the wire. A player may call a custom group "Stage", and
        two custom groups may share a name, so a name is not an identity: a custom
        group is addressed by its index in `ScetAlarmAction.group`, and cannot be
        read as the stage command however it is labelled.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: ActionGroup
          description: Toggle the custom action group whose index is `ScetAlarmAction.group`.
        - const: 1
          title: Stage
          description: Activate the next stage.
        - const: 2
          title: Sas
          description: Toggle SAS.
        - const: 3
          title: Rcs
          description: Toggle RCS.
        - const: 4
          title: Lights
          description: Toggle the lights.
        - const: 5
          title: Gear
          description: Toggle the landing gear.
        - const: 6
          title: Brakes
          description: Toggle the brakes.
        - const: 7
          title: Abort
          description: Toggle the abort action group.
    ScetAlarmArmArgs:
      type: object
      description: |-
        Register an alarm with the game, or replace one already registered under the
        same `ScetAlarmArmArgs.id`.

        Never delayed by signal delay: setting an alarm changes nothing aboard the
        craft, so like `time.setWarpIndex` it is a control on the game, not a signal
        to a spacecraft. An alarm can therefore be set for an event less than one
        signal delay away, and during a blackout.
      required:
        - id
        - name
        - vantage
        - subject
        - condition
        - onFire
        - actsOn
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            The client's own id for the alarm, echoed as `ScetAlarm.id`. An id already
            held is replaced rather than duplicated.
        name:
          type: string
          x-sitrep-unit: text
          description: What the operator called the alarm, echoed as `ScetAlarm.name`.
        vantage:
          type: string
          x-sitrep-unit: id
          description: |-
            See `ScetAlarm.vantage`. Empty is accepted and resolved to
            `ScetAlarmArmArgs.subject` when the alarm is set, so the alarm is read at
            its own subject.
        subject:
          type: string
          x-sitrep-unit: id
          description: See `ScetAlarm.subject`. Empty is read as `"game"`.
        condition:
          description: What the alarm watches for. See `ScetAlarmCondition`.
          allOf:
            - $ref: "#/components/schemas/ScetAlarmCondition"
        onFire:
          type: array
          items:
            $ref: "#/components/schemas/ScetAlarmAction"
          description: |-
            See `ScetAlarm.onFire`. Non-empty only where the alarm is read at its own
            subject's vantage and that subject is a craft, or the condition is a time on
            the game's clock; any other alarm carrying actions is refused rather than
            accepted with them dropped.
        actsOn:
          type: string
          x-sitrep-unit: id
          description: |-
            See `ScetAlarm.actsOn`. A time condition carrying actions must name the
            craft the operator means them for. A threshold on a craft acts on that
            craft, so empty resolves to its subject and any other craft is refused.
    ScetAlarmCondition:
      type: object
      description: |-
        What a SCET alarm watches for, on the craft's own clock.

        Every field is always present, and `ScetAlarmCondition.kind` says which of
        them carry meaning; the rest sit at their defaults and are ignored. For
        `ScetAlarmConditionKind.Time` that is `ScetAlarmCondition.ut` and
        `ScetAlarmCondition.leadSeconds`; for `ScetAlarmConditionKind.Threshold` it
        is `ScetAlarmCondition.topic`, `ScetAlarmCondition.fieldPath`,
        `ScetAlarmCondition.op`, `ScetAlarmCondition.threshold` and
        `ScetAlarmCondition.sustainSeconds`; for
        `ScetAlarmConditionKind.ContractParameter` it is
        `ScetAlarmCondition.contractId`, `ScetAlarmCondition.parameterTitle`,
        `ScetAlarmCondition.targetState` and `ScetAlarmCondition.sustainSeconds`;
        for `ScetAlarmConditionKind.TopicInstant` it is `ScetAlarmCondition.topic`,
        `ScetAlarmCondition.fieldPath` (a universal time) and
        `ScetAlarmCondition.leadSeconds`, and `ScetAlarmCondition.ut` is filled in
        by the simulation with the instant it last read.
      required:
        - kind
        - ut
        - leadSeconds
        - topic
        - fieldPath
        - op
        - threshold
        - sustainSeconds
        - contractId
        - parameterTitle
        - targetState
      properties:
        kind:
          description: |-
            Which kind of condition this is, and so which of the other fields carry
            meaning. The rest are left at their defaults and ignored.
          allOf:
            - $ref: "#/components/schemas/ScetAlarmConditionKind"
              x-sitrep-unit: enum
        ut:
          type: number
          x-sitrep-unit: ut
          description: |-
            The instant the alarm is set for, as a universal time on the craft's clock
            rather than on the clock the command centre is reading. For a
            `ScetAlarmConditionKind.TopicInstant` it is the instant the simulation last
            read from the Topic, written by it and ignored on arm.

            The difference between the two is the one-way signal delay, which changes as
            the craft moves. This field is the instant itself, compared against the
            game's own clock every tick, so it stays right however the distance changes
            between setting the alarm and its firing.
        leadSeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            How long before `ScetAlarmCondition.ut` warp is stopped, in seconds, so the
            operator has real time in hand before the instant they set the alarm for.
            Zero stops the warp at the instant itself.

            Warp halts at `Ut - LeadSeconds`, and the alarm fires at `Ut`.
        topic:
          type: string
          x-sitrep-unit: id
          description: |-
            Threshold and topic instant: the Topic whose payload carries the value to
            watch, as the client spells a Topic (`"vessel.flight"`).

            A Topic and a path into it address a reading the way the wire does, so an
            operator can point at a value they can already see on screen.
        fieldPath:
          type: string
          x-sitrep-unit: id
          description: |-
            Threshold and topic instant: the dotted path to the value inside
            `ScetAlarmCondition.topic`'s payload (`"altitudeAsl"`,
            `"relativePosition.x"`). Empty addresses the payload itself, which is never
            a number, so it never matches.
        op:
          description: |-
            Threshold only: how the reading is compared to
            `ScetAlarmCondition.threshold`.
          allOf:
            - $ref: "#/components/schemas/ScetAlarmThresholdOp"
              x-sitrep-unit: enum
        threshold:
          type: number
          x-sitrep-unit: n/a
          description: |-
            Threshold only: the number the operator chose, in whatever unit
            `ScetAlarmCondition.fieldPath` is published in.

            It has no unit of its own: the same field is metres for one alarm and
            kilonewtons for the next. To render it, use the unit of the field it names,
            from that channel's schema.
        sustainSeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            Threshold and contract parameter: how long the condition must hold, in
            seconds, before the alarm fires. Zero fires on the first reading that
            matches.

            **Warp is stopped at the first match, not at the fire.** A condition that
            matches once and then stops matching has therefore still stopped the warp.
        contractId:
          type: string
          x-sitrep-unit: id
          description: |-
            Contract parameter only: the contract's id, as
            `career.status.contracts.active` carries it.
        parameterTitle:
          type: string
          x-sitrep-unit: text
          description: |-
            Contract parameter only: the objective's title within that contract, matched
            exactly. The first objective with the title is the one watched.
        targetState:
          description: "Contract parameter only: the state the objective must reach."
          allOf:
            - $ref: "#/components/schemas/KspParameterState"
              x-sitrep-unit: enum
    ScetAlarmConditionKind:
      type: integer
      description: |-
        Which kind of condition a SCET alarm watches for.

        Every alarm has a vantage (see `ScetAlarm.vantage`), so a kind says only
        what is watched. A threshold follows a dotted path to a number; a contract
        parameter, which sits in a list no path can index, finds its contract and
        objective by id and title.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Time
          description: An instant on the craft's own clock, as a universal time.
        - const: 1
          title: Threshold
          description: |-
            A value aboard the craft crossing a number the operator chose, compared
            against the reading the game actually holds rather than against the one the
            command centre has been told.

            Only the game can check this. A time alarm needs only a clock, which a
            client has; a threshold needs the craft's true state, which reaches the
            ground a signal delay late and by then no longer says whether the craft is
            above 100 km now.
        - const: 2
          title: ContractParameter
          description: |-
            One objective of one contract reaching a state the operator chose, as
            `career.status.contracts` reports it.

            Level rather than edge, like the threshold: an objective already in its
            target state when the alarm is set is a condition that holds. An objective
            that finishes its contract, completing or failing it, is read from the
            recently completed or failed contracts, so it still comes due. A contract
            that finished with the objective in another state, or that left the career
            any other way, makes the alarm `ScetAlarmState.Unreachable`.
        - const: 3
          title: TopicInstant
          description: |-
            A Topic's own universal time, followed as it moves: the warp stops
            `ScetAlarmCondition.leadSeconds` before the instant the Topic currently
            publishes and the alarm fires when the clock reaches it.

            The instant is read again on every tick, so an alarm on "the next project to
            finish" re-aims by itself when a shorter project overtakes the one it was
            following, with nobody watching and no client to re-arm it. While the field
            is absent or null the condition is unmet and the alarm stays armed. Always
            judged on the craft's own clock, at the subject's vantage.
    ScetAlarmDisarmArgs:
      type: object
      description: |-
        Forget the alarm with this id. Succeeds without an error for an id the host
        does not hold, so a client reconciling its list against the roster never has
        to ask first.

        Never delayed, like `alarm.scet.arm`, so removing an alarm is never slower
        than setting one.
      required:
        - id
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: The `ScetAlarm.id` of the alarm to remove.
    ScetAlarmFired:
      type: object
      description: |-
        The notice that an alarm judged on the craft's own clock (a SCET alarm, for
        spacecraft event time) has fired and the warp has been stopped.

        **Nothing about the craft.** It says which alarm fired and when. The stop is
        immediate, because warp is; the telemetry is not, and stays a signal delay
        behind. Readings shown beside this notice may still show the craft as it was
        minutes ago, so a widget should not treat the notice as a reading: what the
        craft was doing at `ScetAlarmFired.firedAtUt` arrives with its telemetry.

        The other fields say where it was learned and whether its actions were
        withheld for want of the right craft; neither is a reading of the craft.

        The condition is not echoed: for a threshold it would be a claim about the
        craft ahead of the light that carries it. A client that wants to name the
        alarm reads the roster.
      required:
        - id
        - firedAtUt
        - vantage
        - actionsWithheld
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: Which alarm, as the `ScetAlarm.id` it was set under.
        firedAtUt:
          type: number
          x-sitrep-unit: ut
          description: The universal time it fired at, on the craft's clock.
        vantage:
          type: string
          x-sitrep-unit: id
          description: |-
            The place that learned it, echoing the alarm's `ScetAlarm.vantage`.

            A notice at the subject's own vantage is a fact about the craft at the
            instant it happened; a notice anywhere else is a statement about what that
            place has been told, true only there.
        actionsWithheld:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the alarm held onboard actions and they were withheld because the
            craft named by `ScetAlarm.actsOn` was not the one being flown. False for an
            alarm with no actions.

            Says nothing about how the craft responded to an action that was sent. That
            is a fact aboard the craft, and it reaches the ground the way every other
            one does, a signal delay later in the craft's own telemetry: this notice
            travels at once and must not carry it.
    ScetAlarmState:
      type: integer
      description: |-
        Where a SCET alarm has got to.

        `ScetAlarmState.Fired` is reached once and stays: an alarm whose condition
        keeps holding does not stop the warp again.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Armed
          description: Watching. The condition has not been met.
        - const: 1
          title: Fired
          description: The condition was met, warp was stopped, and the notice went out.
        - const: 2
          title: Unreachable
          description: |-
            The condition can never be met: the craft a threshold or a followed instant
            watches no longer exists, or a contract objective's contract finished with
            it in another state or left the career.

            A time condition never reaches this: it has no subject to lose, because
            universal time belongs to the game. Show such a row as dead rather than as
            pending.
        - const: 3
          title: Cancelled
          description: |-
            The player switched to a different craft before the alarm came due, so it
            will never fire. An alarm belongs to the craft being flown when it was set,
            whatever its condition reads, and a switch ends every alarm still watching.
            A kerbal on EVA counts as the craft they stepped out of.
    ScetAlarmThresholdOp:
      type: integer
      description: |-
        How a threshold condition compares the reading to the operator's number.

        The same six the client's own alarm list offers, so an alarm set on the
        command vantage and the same alarm set on the craft's clock mean the same
        thing and can be checked against each other at zero delay.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: GreaterThan
          description: Reading is greater than the threshold.
        - const: 1
          title: GreaterThanOrEqual
          description: Reading is greater than or equal to the threshold.
        - const: 2
          title: LessThan
          description: Reading is less than the threshold.
        - const: 3
          title: LessThanOrEqual
          description: Reading is less than or equal to the threshold.
        - const: 4
          title: Equal
          description: |-
            Reading equals the threshold exactly.

            Rarely what is wanted on a continuous value: readings are samples, and under
            warp they are thousands of game-seconds apart, so a craft can pass straight
            through the value without one landing on it. An inequality is almost always
            the condition an operator means.
        - const: 5
          title: NotEqual
          description: |-
            Reading differs from the threshold. The inverse of
            `ScetAlarmThresholdOp.Equal`, and just as much a knife edge on anything
            continuous.
    ScienceTransmission:
      type: object
      description: |-
        A science result the craft has started sending home, as
        `science.experiment.transmit` returns it: when the stream began at the craft
        and how long the transmitter needs to send all of it. The result has left
        the craft at `ScienceTransmission.startedAt` plus
        `ScienceTransmission.streamSeconds`, and it lands one signal delay after
        that.

        Absent from the reply when the backend cannot say, as a modelling mod that
        drains results continuously cannot. A client then has nothing to draw the
        transmission from, which is the truth: an absent transmission is never a
        zero-length one.
      required:
        - subjectId
        - title
        - startedAt
        - streamSeconds
        - dataAmount
      properties:
        subjectId:
          type: string
          x-sitrep-unit: id
          description: |-
            The research subject's id (`ScienceSubject.id`), the same key
            `currency.<guid>.science` credits it under.
        title:
          type: string
          x-sitrep-unit: text
          description: The result's human title, e.g. "Crew Report from Kerbin's Shores".
        startedAt:
          type: number
          x-sitrep-unit: ut
          description: Universal Time at the craft when the transmitter was handed the result.
        streamSeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            How long the transmitter takes to send every packet, from its packet size
            and interval. It takes at least this long: a transmitter starved of charge
            holds between packets, and one already busy sends this after what it is
            holding.
        dataAmount:
          type: number
          x-sitrep-unit: Mit
          description: The amount of data sent.
    SensorEntry:
      type: object
      description: |-
        One entry in the `science.sensors` Topic payload: a single
        environmental-sensor module (`ModuleEnviroSensor`: thermometer, barometer,
        gravioli detector, accelerometer, and any modded sensor sharing the module)
        on the active vessel. The Topic payload is a bare array (`SensorEntry[]`) or
        `null` when there is no active vessel or it carries no sensor module.

        One entry per sensor module, with `SensorEntry.type` carrying the raw
        `SensorType` enum name (`TEMP`/`PRES`/`GRAV`/`ACC`/...) as a string, so
        modded sensor types and several instances of the same type each get their
        own row. Group and label by `SensorEntry.type`.

        Every field is nullable, and is `null` whenever the raw value is absent.
      properties:
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Flight-scoped `part.flightID` as a string (null when it is KSP's unset
            value, 0), the join key that tells symmetric same-named sensor parts apart.
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Display title of the sensor part (the part's `partInfo.title`, or its
            internal name when that is missing).
        type:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The raw `SensorType` enum name (`TEMP`/`PRES`/`GRAV`/`ACC`/...) passed
            through as a string so modded types survive.
        readout:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The sensor's current human-readable readout string (KSP's `readoutInfo`,
            e.g. "293.1K" or "Off").
        active:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the sensor is switched on (KSP's `ModuleEnviroSensor.sensorActive`).
    ServoEntry:
      type: object
      description: |-
        One entry in the `robotics.servos` Topic payload, a single Breaking Ground
        robotic servo on the active vessel. The payload is a bare array of these, or
        `null` when there is no active vessel or it carries no servo; read
        `robotics.available` to tell those two apart.

        `ServoEntry.type` is the servo kind as a plain string, not an enum. The
        kinds are `"rotor"`, `"hinge"`, `"rotationServo"` and `"piston"`, plus
        `"servo"` for a servo of a kind not recognised (a part pack's own, or one a
        later KSP adds), which carries only the readings every servo has.

        **Open set.** The kinds follow KSP's own `BaseServo` types, so more may
        appear. Switch on the kinds you can draw and ignore the rest.

        Fields that belong to one kind are `null` on every other kind: angles on
        hinges and rotation servos, extensions on pistons, and the rpm, output,
        brake, direction and torque fields on rotors.
      properties:
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The part's display title (KSP's `Part.partInfo.title`), or its internal name
            when it has no part info.
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The part's `Part.flightID` as a string: unique per part for the life of the
            flight, so it tells apart symmetric servos that share a name. Null when the
            part has no flight id yet.
        type:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The servo kind: `"rotor"`, `"hinge"`, `"rotationServo"`, `"piston"`, or
            `"servo"` for a kind not recognised. See this type's summary.
        servoIsLocked:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: True when the servo is locked in place (KSP's `BaseServo.servoIsLocked`).
        servoIsMotorized:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: True when the servo has a motor (KSP's `BaseServo.servoIsMotorized`).
        servoMotorIsEngaged:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            True when the servo's motor is engaged (KSP's
            `BaseServo.servoMotorIsEngaged`).
        servoMotorLimit:
          type:
            - number
            - "null"
          x-sitrep-unit: "%"
          description: |-
            The motor's torque limit as a percentage (KSP's
            `BaseServo.servoMotorLimit`). On a rotor it is a percentage of
            `ServoEntry.maxTorque`.
        motorState:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The motor's state text as KSP displays it (`BaseServo.motorState`). Free
            text, not a fixed vocabulary.
        currentAngle:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: Current angle in degrees. Hinges and rotation servos only.
        targetAngle:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: Angle the servo is driving to, in degrees. Hinges and rotation servos only.
        traverseVelocity:
          type:
            - number
            - "null"
          x-sitrep-unit: n/a
          description: |-
            KSP's `traverseVelocity` setting for hinges, rotation servos and pistons.
            Its unit follows the kind (KSP drives angles for the first two and an
            extension for a piston), so no single unit is declared.
        currentRPM:
          type:
            - number
            - "null"
          x-sitrep-unit: rpm
          description: The rotor's current speed in revolutions per minute. Rotors only.
        rpmLimit:
          type:
            - number
            - "null"
          x-sitrep-unit: rpm
          description: The rotor's rpm limit setting. Rotors only.
        normalizedOutput:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            The rotor's normalised output (KSP's
            `ModuleRoboticServoRotor.normalizedOutput`). Rotors only.
        brakePercentage:
          type:
            - number
            - "null"
          x-sitrep-unit: "%"
          description: |-
            The rotor's brake setting as a percentage (KSP's `brakePercentage`). Rotors
            only.
        currentExtension:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: The piston's current extension in metres. Pistons only.
        targetExtension:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: The extension the piston is driving to, in metres. Pistons only.
        counterClockwise:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Rotor spin direction (rotor entries only, `null` for every other kind).
            KSP's `ModuleRoboticServoRotor.rotateCounterClockwise`: `true` means the
            rotor spins counter-clockwise.
        maxTorque:
          type:
            - number
            - "null"
          x-sitrep-unit: kN
          description: |-
            Rotor torque ceiling in kN (rotor entries only, `null` for every other
            kind). KSP's `ModuleRoboticServoRotor.maxTorque`: the scale
            `ServoEntry.servoMotorLimit` (a percentage) is a fraction of.

            kN is the unit KSP's editor shows for it, although the value acts as a
            torque on the rotor's joint.
    ServoSetAngleArgs:
      type: object
      description: |-
        Drive a hinge or rotation servo to an angle. Args for
        `robotics.servo.setAngle`: the absolute angle a hinge or rotation servo is
        to drive to, keyed by the part's `ServoSetAngleArgs.partId`.
        `ServoSetAngleArgs.partId` is the same `flightID` string `parts.robotics`
        publishes on each servo entry, so a widget sends back the exact id it
        displays. A piston has no angle and a rotor no target: a `setAngle` aimed at
        either fails with `CommandResult.errorCode`
        `CommandErrorCode.CapabilityMismatch`.
      required:
        - partId
        - degrees
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's flight id, as a string: the id each `parts.robotics` entry
            carries.
        degrees:
          type: number
          x-sitrep-unit: °
          description: The absolute target angle.
    ServoSetEnabledArgs:
      type: object
      description: |-
        Switch a robotics servo or rotor motor or lock on or off. Args shared by
        every robotics boolean actuation (`robotics.servo.setMotor`/`setLock` and
        `robotics.rotor.setMotor`/`setLock`): an absolute state to apply, never a
        toggle, like every other actuation command (see `SetEnabledArgs`). Keyed by
        `ServoSetEnabledArgs.partId`, the `flightID` string `parts.robotics`
        publishes.
      required:
        - partId
        - enabled
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's flight id, as a string: the id each `parts.robotics` entry
            carries.
        enabled:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            The state to apply: for `setMotor`, `true` engages the part's motor and
            `false` disengages it; for `setLock`, `true` locks the part and `false`
            unlocks it. `setMotor` on a servo with no motor fails with
            `CommandErrorCode.CapabilityMismatch`.
    ServoSetExtensionArgs:
      type: object
      description: |-
        Drive a piston to an extension. Args for `robotics.servo.setExtension`: the
        absolute extension a piston is to drive to, keyed by the part's
        `ServoSetExtensionArgs.partId`. A hinge or rotation servo has no extension
        and a rotor no target: a `setExtension` aimed at one fails with
        `CommandResult.errorCode` `CommandErrorCode.CapabilityMismatch`.
      required:
        - partId
        - metres
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's flight id, as a string: the id each `parts.robotics` entry
            carries.
        metres:
          type: number
          x-sitrep-unit: m
          description: The absolute target extension.
    SetActionGroupArgs:
      type: object
      description: |-
        Set a numbered custom action group on or off. Gear, brakes, lights and abort
        are not set through this: each has its own command (`SetEnabledArgs`).
      required:
        - group
        - state
      properties:
        group:
          type: number
          x-sitrep-unit: id
          description: |-
            The custom action group number, from 1. The upper bound belongs to the
            installed action-groups provider: 10 in stock KSP (ag1 to ag10), and more
            where a mod adds them. A group below 1 or beyond that bound fails with
            `CommandErrorCode.Range`.
        state:
          type: boolean
          x-sitrep-unit: flag
          description: "`true` to switch the group on, `false` to switch it off."
    SetControlAxesArgs:
      type: object
      description: |-
        Drive the held control axes of the fly-by-wire override. Takes a partial
        update of the held fly-by-wire override. Every field is nullable, and only
        the fields you set change their held value, so one axis can be driven on its
        own without disturbing the others.

        Every value is -1..1 and analog: a value between the ends gives a
        proportional input (for example proportional RCS from a mapped analog
        stick). A value outside -1..1 is clamped rather than refused. The trims are
        re-applied every frame alongside the axes while the override is on, so SAS
        does not overwrite them.

        Held values only act on the vessel while the override is on (see
        `vessel.control.setFlyByWire`); values set while it is off are held and take
        effect when it is turned on. The command fails when there is no active
        vessel or the vessel cannot currently be controlled. The applied axes read
        back on `vessel.control`.
      properties:
        pitch:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Pitch input, -1..1. Null leaves the held value unchanged.
        yaw:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Yaw input, -1..1. Null leaves the held value unchanged.
        roll:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Roll input, -1..1. Null leaves the held value unchanged.
        x:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Translation X input (RCS right/left), -1..1. Null leaves the held value
            unchanged.
        y:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Translation Y input (RCS up/down), -1..1. Null leaves the held value
            unchanged.
        z:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Translation Z input (RCS forward/back), -1..1. Null leaves the held value
            unchanged.
        pitchTrim:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Pitch trim, -1..1. Null leaves the held value unchanged.
        yawTrim:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Yaw trim, -1..1. Null leaves the held value unchanged.
        rollTrim:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Roll trim, -1..1. Null leaves the held value unchanged.
    SetControlFrameArgs:
      type: object
      description: |-
        Put the view in a different reference frame. Takes the frame to put the view
        in.

        It names the two head bodies, not the sets: where `ControlFrame` reports
        `PrimaryBodies` and `SecondaryBodies`, the mod that owns the view works out
        which bodies fall on each side of a pulsating frame.

        Refusal is normal: stock KSP's frame follows the active vessel's reference
        body and cannot be set, so the command fails with `ModeUnavailable`.
      required:
        - kind
      properties:
        kind:
          description: The kind of frame to select.
          allOf:
            - $ref: "#/components/schemas/ControlFrameKind"
              x-sitrep-unit: enum
        centreBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The `bodyName` to centre on. Required for the centred frames.
        primaryBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The `bodyName` a rotating frame turns about. Required for the rotating
            frames.
        secondaryBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The `bodyName` a rotating frame is anchored to. Required for the rotating
            frames.
        targetFrameSelected:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            `true` to ask for the target frame, which sits beside
            `SetControlFrameArgs.kind` rather than inside it.
    SetEnabledArgs:
      type: object
      description: |-
        Switch SAS, RCS, landing gear, brakes, lights, the abort group or precision
        control on or off. Args shared by every plain on/off actuation command
        (`setSas`, `setRcs`, `setGear`, `setBrakes`, `setLights`, `setAbort`,
        `setPrecisionControl`): an absolute state to apply, never a toggle. Under
        signal delay a toggle that arrives after unknown intervening changes would
        race them, so there are no toggle commands.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          x-sitrep-unit: flag
          description: "`true` to switch the system on (or fire abort), `false` to switch it off."
    SetFlyByWireArgs:
      type: object
      description: |-
        Turn the fly-by-wire override on or off. Unlike the other `vessel.control.*`
        commands this is not a one-shot actuation: KSP resets the raw control axes
        every physics frame, so while the override is on the mod re-applies the held
        axes and trims (set with `vessel.control.setAxes`) every frame.

        Turning it on resumes the held values (0 until an axis has been set).
        Turning it off stops the override and resets every held axis and trim to 0,
        so control returns to the player and SAS with nothing left over. Turning it
        on fails when there is no active vessel or the vessel cannot currently be
        controlled; turning it off is never refused for control reasons.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            `true` turns the override on, `false` turns it off and resets the held axes
            and trims to 0.
    SetPausedArgs:
      type: object
      description: Pause or resume the game. Takes whether the game is paused.
      required:
        - paused
      properties:
        paused:
          type: boolean
          x-sitrep-unit: flag
          description: True to pause the game, false to resume it.
    SetSasModeArgs:
      type: object
      description: Set the SAS mode to hold. Takes the SAS mode to hold.
      required:
        - mode
      properties:
        mode:
          description: The SAS mode to hold.
          allOf:
            - $ref: "#/components/schemas/SasMode"
              x-sitrep-unit: enum
    SetTargetArgs:
      type: object
      description: |-
        Set the active vessel's target. Takes a discriminated union, written as
        `SetTargetArgs.kind` plus the fields that kind uses.
        `SetTargetArgs.vesselId` is the stable vessel id, never an array index, and
        a vessel id and a body index travel in separate fields so they cannot be
        confused.

        A request missing a field its kind needs, or with `TargetKind.Other`, fails
        with `CommandErrorCode.NotFound`, as does a well-formed request that matches
        no live vessel, part, body or position.
      required:
        - kind
      properties:
        kind:
          description: |-
            What kind of thing to target; decides which of the other fields are
            required.
          allOf:
            - $ref: "#/components/schemas/TargetKind"
              x-sitrep-unit: enum
        vesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The target vessel's guid. Required when `SetTargetArgs.kind` is
            `TargetKind.Vessel`, and also when it is `TargetKind.Part`, where it names
            the vessel that owns the target part (a part id is unique only within its
            vessel).
        partId:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            The docking port's KSP `Part.flightID`, looked up among the parts of the
            vessel named by `SetTargetArgs.vesselId`. Required when `SetTargetArgs.kind`
            is `TargetKind.Part`; `null` for every other kind.
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            The body's `trackingStation.bodies` index, the same index
            `VesselOrbit.referenceBodyIndex` uses. Required when `SetTargetArgs.kind` is
            `TargetKind.Body`, and also when it is `TargetKind.Position`, where it names
            the body `SetTargetArgs.latitude` and `SetTargetArgs.longitude` are measured
            on.
        latitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            The target position's latitude, in degrees. Required when
            `SetTargetArgs.kind` is `TargetKind.Position` (a surface point picked on a
            map, e.g. a `spaceCenter.pois` entry's coordinate).
        longitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            The target position's longitude, in degrees. Required when
            `SetTargetArgs.kind` is `TargetKind.Position`.
    SetThrottleArgs:
      type: object
      description: Set the main throttle. Takes the main throttle setting.
      required:
        - value
      properties:
        value:
          type: number
          x-sitrep-unit: ratio
          description: |-
            The throttle from 0 to 1. A value outside that range is refused with
            `CommandErrorCode.Range` rather than clamped.
    SetVantage:
      type: object
      description: |-
        Selects the command centre this connection commands from and observes at. It
        sets both where the connection's telemetry is observed from and where its
        commands are sent from. The id must name a currently-active command centre,
        or the request is refused with an `unknownVantage` error and the connection
        keeps the vantage it had.

        A connection that has never sent one observes at the home command centre
        (the roster entry whose `isHome` is true), and follows it if home moves.
        When no home is identified it observes at the first ground station in
        ordinal id order, and while no command centre is active at all (the main
        menu) at none, stamping its frames with an empty `vantage`. Every frame's
        `meta.vantage` says which of these is in force.
      required:
        - type
        - centreId
      properties:
        type:
          type: string
          const: set-vantage
          x-sitrep-unit: id
          description: The frame type, always `"set-vantage"`.
        centreId:
          type: string
          x-sitrep-unit: id
          description: The command centre Id to adopt as this connection's vantage.
    SetWarpIndexArgs:
      type: object
      description: |-
        Select a time-warp rate. This is a control of the simulation, not of a
        craft, so it is never delayed by signal delay.
      required:
        - index
      properties:
        index:
          type: number
          x-sitrep-unit: id
          description: |-
            The index into this install's high (on-rails) warp rate table, the
            `time.warp` `WarpRates` array, where 0 is normal time. An index below 0 or
            beyond the table fails with `CommandErrorCode.Range`.
    SettingKind:
      type: integer
      description: |-
        What a setting may hold, the mod's own or an Uplink's.

        The set is small and closed. A setting that needs more than these is a
        `SettingKind.Text` row that the Uplink checks when it reads it.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Text
          description: |-
            A single line of text. Also the fallback for anything the other kinds cannot
            express.
        - const: 1
          title: Bool
          description: True or false.
        - const: 2
          title: Number
          description: |-
            A number, written with a full stop for the decimal point whatever the locale
            of the machine the game runs on.
    SettingsChange:
      type: object
      description: One row's new value in a `SaveSettingsArgs`.
      required:
        - path
        - value
      properties:
        path:
          type: string
          x-sitrep-unit: id
          description: The row, as `SettingsRowState.path` names it.
        value:
          type: string
          x-sitrep-unit: text
          description: The new value, spelled as `SettingsRowState.value` is.
    SettingsDeclarationFailure:
      type: object
      description: An Uplink whose settings could not be declared this session.
      required:
        - uplinkId
        - reason
      properties:
        uplinkId:
          type: string
          x-sitrep-unit: id
          description: |-
            The id of the Uplink, as its `system.uplinks` entry names it, whose settings
            could not be declared.
        reason:
          type: string
          x-sitrep-unit: text
          description: Why the declaration failed, as a sentence to show the operator as it is.
    SettingsModel:
      type: object
      description: |-
        Every setting the mod and its Uplinks declared, what each holds now, and
        whether the settings file on the KSP machine holds the same.

        The whole model is on one Topic. A client draws a control per row from the
        row's own description, so a setting an Uplink adds needs no client code of
        its own.

        It is never delayed by signal delay, the time a signal takes to cross
        between a craft and the command centre (the screen an operator sends
        commands from): a setting configures the system the operator is sitting at,
        not a craft.

        This is where a client learns whether a save landed. The `settings.save`
        command (`SaveSettingsArgs`) can time out and still land, so read the
        outcome here, never from the command's reply.
      required:
        - rows
        - persistence
        - undeclared
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SettingsRowState"
          description: |-
            Every declared setting, in declaration order: the mod's own first, then each
            Uplink's.
        persistence:
          description: Whether the values here are the ones the settings file holds.
          allOf:
            - $ref: "#/components/schemas/SettingsPersistence"
        undeclared:
          type: array
          items:
            $ref: "#/components/schemas/SettingsDeclarationFailure"
          description: |-
            Uplinks that are running but whose settings could not be declared this
            session. Their settings are at their defaults and are not listed in
            `SettingsModel.rows`; what the file holds for them is kept as it is.
    SettingsPersistence:
      type: object
      description: Whether the settings file holds what is in force.
      required:
        - state
        - path
      properties:
        state:
          description: Where the settings in force stand against the file.
          allOf:
            - $ref: "#/components/schemas/SettingsPersistenceState"
              x-sitrep-unit: enum
        path:
          type: string
          x-sitrep-unit: text
          description: The path of the settings file on the KSP machine.
        savedAtUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The UT of the last save that wrote the file, or `null` when none has this
            session.
        reason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Why the file could not be written or read, for an operator to read. `null`
            when nothing went wrong.
    SettingsPersistenceState:
      type: integer
      description: Where the settings in force stand against the settings file.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Saved
          description: |-
            The file holds these values: it was read at start-up, or the last save wrote
            it.
        - const: 1
          title: MemoryOnly
          description: |-
            The last save could not write the file. The values are in force for this
            session only and revert when KSP restarts; `SettingsPersistence.reason` says
            why.
        - const: 2
          title: Recovered
          description: |-
            The file was missing, empty or damaged at start-up, and its backup was read
            instead. Anything saved after that backup was taken is lost. Clears at the
            next successful save.
        - const: 3
          title: Defaults
          description: |-
            No settings file exists yet: a first run, every setting at its default until
            the first save.
        - const: 4
          title: Unreadable
          description: |-
            A settings file exists but neither it nor a backup could be read, so every
            setting is at its default. Clears at the next successful save, which
            replaces the unreadable file.
    SettingsRowState:
      type: object
      description: |-
        One declared setting, described well enough for a client to draw its
        control.
      required:
        - path
        - owner
        - kind
        - label
        - description
        - value
        - default
      properties:
        path:
          type: string
          x-sitrep-unit: id
          description: |-
            Where the setting lives, as the name of a block of the settings file and the
            setting's name inside it, separated by `/`: `SIGNAL_DELAY/enabled`, or
            `Uplinks/<id>/<name>` for an Uplink's own. This is the path a save names.
        owner:
          type: string
          x-sitrep-unit: id
          description: "Who declared it: `\"gonogo\"` for the mod itself, or the Uplink's id."
        kind:
          description: What the value may be, and so which control draws it.
          allOf:
            - $ref: "#/components/schemas/SettingKind"
              x-sitrep-unit: enum
        label:
          type: string
          x-sitrep-unit: text
          description: What an operator reads beside the control. May be empty.
        description:
          type: string
          x-sitrep-unit: text
          description: |-
            Why the setting matters or what it needs, read under the label. May be
            empty.
        value:
          type: string
          x-sitrep-unit: text
          description: |-
            The value in force, as text: `True` or `False` for a `SettingKind.Bool`, a
            number written with a full stop for a `SettingKind.Number`.
        default:
          type: string
          x-sitrep-unit: text
          description: |-
            The value in force when the settings file holds none for this row, in the
            same spelling as `SettingsRowState.value`.
    SignalQuantity:
      type: integer
      description: |-
        Which quantity a signal strength from 0 to 1 is. Two backends that both
        report "0 to 1" are not saying the same thing, and a figure is only
        comparable with another of the same quantity.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Unknown
          description: |-
            Nothing says which: the hops of a worked-out path disagree, or a read
            failed.
        - const: 1
          title: RangeFraction
          description: |-
            KSP's signal strength for the path, the figure the game's own signal readout
            shows: each link's strength falls off smoothly towards the edge of its
            range, and a path's is the product of its links', so relays compound. Stock
            CommNet's. Not the share of range left: a link with 59% of its range left
            reads about 63%.
        - const: 2
          title: DataRateHeadroom
          description: |-
            How far up its data-rate ladder the path's links close: 1 at the top rate,
            one rung less for each halving of the data rate, 0 where a link does not
            close, multiplied across the path's links. RealAntennas'.
        - const: 3
          title: NoModel
          description: |-
            The save models no comms network, so there is no link to grade and the
            strength is null.
    Situation:
      type: integer
      description: |-
        A vessel's flight situation, KSP's `Vessel.situation` (the
        `Vessel.Situations` enum) in this contract's PascalCase spelling.
        `Situation.Unknown` stands for a value this contract does not recognise,
        such as a situation added by a later KSP version.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Landed
          description: Resting on the surface of a body (KSP `LANDED`).
        - const: 1
          title: Splashed
          description: Floating on water (KSP `SPLASHED`).
        - const: 2
          title: PreLaunch
          description: On the launch pad or runway and not yet launched (KSP `PRELAUNCH`).
        - const: 3
          title: Orbiting
          description: |-
            In a closed orbit that does not intersect the surface or atmosphere (KSP
            `ORBITING`).
        - const: 4
          title: Escaping
          description: |-
            On a trajectory that leaves the current body's sphere of influence (KSP
            `ESCAPING`).
        - const: 5
          title: Flying
          description: In the atmosphere and off the ground (KSP `FLYING`).
        - const: 6
          title: SubOrbital
          description: |-
            Above the atmosphere on a trajectory that meets the surface or atmosphere
            again (KSP `SUB_ORBITAL`).
        - const: 7
          title: Docked
          description: Docked to another vessel (KSP `DOCKED`).
        - const: 8
          title: Unknown
          description: A situation this contract does not recognise.
    SpaceCenterPartsAvailable:
      type: object
      description: |-
        A wrapper carrying the count of parts the player can place right now
        (tech-unlocked and purchased in career; the full `PartLoader` catalogue in
        sandbox).

        A wrapper object, because a bare scalar has no Topic shape: read
        `spaceCenter.partsAvailable.count`. The whole payload is `null` when no
        sample has arrived yet. Kept at the home command centre.
      properties:
        count:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            How many parts the player can place right now. `null` when it could not be
            counted.
    SpaceCenterPoiEntry:
      type: object
      description: |-
        One point of interest in the `spaceCenter.pois` channel: the union of every
        launch site (`ksc`/`launchSite` kinds, the same sites as `LaunchSiteEntry`,
        limited to sites with a set spawn-point coordinate) and every surface
        contract waypoint whose contract is Active or Offered (`contractTarget`
        kind, from `FinePrint.WaypointManager`).

        The channel is a bare array of these entries, one per POI keyed by
        `SpaceCenterPoiEntry.id`. The whole payload is `null` (not an empty array)
        when no sample has arrived yet, which tells "no data yet" apart from "zero
        POIs". Kept at the home command centre, like `LaunchSiteEntry`.
      properties:
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            `"launchSite:<LaunchSite.name>"` for `ksc`/`launchSite` kinds,
            `"contract:<Waypoint.navigationId>"` for `contractTarget`.
        kind:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: "`\"ksc\"` | `\"launchSite\"` | `\"contractTarget\"`."
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index of the body among the bodies `trackingStation.bodies` lists; null when
            absent or unresolved (never a sentinel like -1).
        latitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Latitude on the body: the spawn point for a launch site (always present,
            since sites without one are left out), the waypoint's latitude for a
            contract target. `null` when a waypoint's value is unreadable.
        longitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Longitude on the body, from the same source as
            `SpaceCenterPoiEntry.latitude` and with the same null rule.
        label:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: "Display label: the launch site's display name, or the contract's title."
        status:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: "`\"active\"` | `\"available\"` (null for `ksc`/`launchSite` kinds)."
        contractAgent:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: Contract-issuing agent name; null for `ksc`/`launchSite` kinds.
        contractFundsAdvance:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            Funds the contract pays on acceptance (`Contract.FundsAdvance`); null for
            `ksc`/`launchSite` kinds.
        contractFundsCompletion:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            Funds the contract pays on completion (`Contract.FundsCompletion`); null for
            `ksc`/`launchSite` kinds.
        contractDateDeadline:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the contract must be completed by (`Contract.DateDeadline`). `null`
            when the contract has no deadline (KSP stores that as `0`, which is never
            passed through), and for `ksc`/`launchSite` kinds.
    SpaceCenterScene:
      type: object
      description: |-
        The single current KSP game scene. `SpaceCenterScene.scene` carries exactly
        one of the six strings
        `{"Flight","SpaceCenter","Editor","TrackingStation","MainMenu","Other"}`:
        KSP's `GameScenes` enum folded onto that fixed set, with any scene outside
        the five named ones (`LOADING`, `PSYSTEM`, `MISSIONBUILDER`, ...) mapped to
        `"Other"`.

        An object holding the scene and, in the editor, the launch site picked
        there. The whole payload is `null` when no sample has arrived yet. Its
        `meta` is on the envelope. Never delayed: it is a fact about the game, not a
        craft.
      properties:
        scene:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The current scene, one of
            `"Flight"`/`"SpaceCenter"`/`"Editor"`/`"TrackingStation"`/`"MainMenu"`/`"Other"`.
        launchSite:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The launch site currently selected in the editor
            (`EditorLogic.launchSiteName`). Null outside the editor scene, never a
            fabricated default.
    StageDeltaVEntry:
      type: object
      description: |-
        One ΔV-producing stage of the active vessel, from the game's own stage
        simulation: the same numbers the in-game ΔV app shows, with atmosphere, ISP,
        crossfeed and staging all handled by the game. Only the stages that actually
        produce ΔV appear, the same set the in-game app lists rather than the raw
        stage list, so stage numbers can be sparse.

        The `dv.stages` payload is a plain array of these, or `null`, never a
        wrapper object. The whole array is `null` when the stock simulation is not
        ready or there is no active vessel.

        Every field is nullable, and `null` is never a sentinel: a field is `null`
        whenever the raw value is absent or non-finite, so a stage the simulation
        reports as `NaN` or `Infinity` reaches you as `null` rather than as a number
        you would have to test.

        Carries no `meta` of its own: provenance rides the envelope
        (`StreamData.Meta`), never the payload body.
      properties:
        stage:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: "`DeltaVStageInfo.stage`: the stage number this entry describes."
        dvVac:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: "`DeltaVStageInfo.deltaVinVac`: stage ΔV in vacuum (m/s)."
        dvAsl:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: "`DeltaVStageInfo.deltaVatASL`: stage ΔV at sea level (m/s)."
        dvActual:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: "`DeltaVStageInfo.deltaVActual`: stage ΔV at the current situation (m/s)."
        burnTime:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: "`DeltaVStageInfo.stageBurnTime`: full-throttle burn time for the stage (s)."
        twrVac:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: "`DeltaVStageInfo.TWRVac`: thrust-to-weight ratio in vacuum."
        twrAsl:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: "`DeltaVStageInfo.TWRASL`: thrust-to-weight ratio at sea level."
        twrActual:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            `DeltaVStageInfo.TWRActual`: thrust-to-weight ratio at the current
            situation.
        thrustVac:
          type:
            - number
            - "null"
          x-sitrep-unit: kN
          description: "`DeltaVStageInfo.thrustVac`: stage thrust in vacuum (kN)."
        thrustAsl:
          type:
            - number
            - "null"
          x-sitrep-unit: kN
          description: "`DeltaVStageInfo.thrustASL`: stage thrust at sea level (kN)."
        thrustActual:
          type:
            - number
            - "null"
          x-sitrep-unit: kN
          description: "`DeltaVStageInfo.thrustActual`: stage thrust at the current situation (kN)."
        startMass:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: "`DeltaVStageInfo.startMass`: stage start mass (tonnes)."
        endMass:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: "`DeltaVStageInfo.endMass`: stage end (burnout) mass (tonnes)."
        dryMass:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: "`DeltaVStageInfo.dryMass`: stage dry mass (tonnes)."
        fuelMass:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: "`DeltaVStageInfo.fuelMass`: stage fuel mass (tonnes)."
        resources:
          type:
            - object
            - "null"
          additionalProperties:
            $ref: "#/components/schemas/ResourceAmount"
          description: |-
            Per-resource current and maximum amounts for the parts active in this stage,
            keyed by resource name, as opposed to `vessel.resources`'s vessel-wide
            totals. Summed from each part's `DeltaVPartInfo.stageFuelMass` for this
            stage number, since `DeltaVStageInfo` itself has only aggregate masses. Sent
            as an empty map, never null, when no tracked resource is active in this
            stage.
    StageDeltaVSummary:
      type: object
      description: |-
        The whole-vessel ΔV rollup the game's own ΔV simulation (`VesselDeltaV`)
        exposes alongside the per-stage `StageDeltaVEntry` list: the ΔV-producing
        stage count plus the vacuum, sea-level and current totals and total burn
        time. A single object, or `null` when the stock simulation is not ready or
        there is no active vessel. Every field is `null` when its raw value is
        absent or non-finite. Carries no `meta` of its own: provenance rides the
        envelope.
      properties:
        stageCount:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: "`VesselDeltaV.OperatingStageInfo.Count`: the number of ΔV-producing stages."
        totalDvVac:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: "`VesselDeltaV.TotalDeltaVVac`: total vessel ΔV in vacuum (m/s)."
        totalDvAsl:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: "`VesselDeltaV.TotalDeltaVASL`: total vessel ΔV at sea level (m/s)."
        totalDvActual:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            `VesselDeltaV.TotalDeltaVActual`: total vessel ΔV at the current situation
            (m/s).
        totalBurnTime:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            `VesselDeltaV.TotalBurnTime`: total full-throttle burn time across all
            stages (s).
    Staleness:
      type: integer
      description: |-
        How current a delivered sample is, as the mod knows it (a client infers the
        rest from its own heartbeat tracking).

        `Staleness.Fresh` is a sample delivered on its own schedule.
        `Staleness.Held` and `Staleness.LastBeforeBlackout` are catch-up grades for
        a late or reconnecting subscriber. `Staleness.Recorded` is different in kind
        from all three: the sample is exact as of its own `Meta.validAt`, it simply
        did not travel at the time it was taken. It was held aboard through a loss
        of signal and dumped on acquisition, so it arrives long after the instant it
        describes, and its `Meta.deliveredAt` is the real arrival, not `validAt +
        light-time`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Fresh
          description: |-
            Delivered on its own schedule. An old `validAt` on a Topic that sends only
            on change is still fresh.
        - const: 1
          title: Held
          description: |-
            Sent to a subscriber that joined while contact was lost, and taken after
            contact was lost.
        - const: 2
          title: LastBeforeBlackout
          description: |-
            Sent to a subscriber that joined while contact was lost: the last sample
            that got out before contact was lost.
        - const: 3
          title: Recorded
          description: |-
            Recovered from the subject's own recorder: taken while it was out of
            contact, replayed on reacquisition. Precisely dated and never a guess, but
            not a live reading, and never the subject's current state.
    StreamBinary:
      type: object
      description: |-
        The JSON header of a binary frame: everything about the delivery except the
        bytes themselves.

        It carries the same `StreamBinary.meta` as `StreamData`, so a binary
        delivery is subject to the signal delay, the vantage and the timeline epoch
        exactly as a JSON channel is, and cannot opt out of the delay. The
        difference is that the payload is not in the JSON. `StreamBinary.segments`
        is the length table for the bytes that follow the header.

        A frame whose segment lengths do not sum to exactly the bytes remaining
        after the header is not read: a truncated or over-long frame is dropped with
        a named reason and never replaced by an empty payload, since zero segments
        would read as "nothing was transmitted".
      required:
        - type
        - topic
        - segments
        - meta
      properties:
        type:
          type: string
          const: stream-binary
          x-sitrep-unit: id
          description: The frame type, always `"stream-binary"`.
        topic:
          type: string
          x-sitrep-unit: id
          description: The Topic id this delivery belongs to.
        segments:
          type: array
          items:
            type: number
            x-sitrep-unit: count
          description: |-
            Byte length of each segment, in the order they appear after the header. An
            empty table is valid and means "nothing this frame"; it is told apart from a
            broken frame because the sum still matches.
        meta:
          description: |-
            When the payload was true, when it arrived, and where it was observed from,
            as on a `stream-data` frame.
          allOf:
            - $ref: "#/components/schemas/Meta"
    StreamData:
      type: object
      description: |-
        One Topic sample as the mod sends it: the Topic id, its payload, and the
        envelope `StreamData.meta` saying when the payload was true and when it
        arrived.

        `topic` is the channel's `address` and `payload` is that channel's own
        shape. Each channel's `stream-data` message fixes both. `meta` is stamped by
        the mod on every frame and describes the delivery, not the value: `validAt`,
        `deliveredAt` and staleness are there.
      required:
        - type
        - topic
        - payload
        - meta
      properties:
        type:
          type: string
          const: stream-data
          x-sitrep-unit: id
        topic:
          type: string
          x-sitrep-unit: id
          description: The Topic id this sample belongs to.
        payload:
          description: The topic's own value. Each channel's `stream-data` message narrows this to that channel's payload schema.
        meta:
          $ref: "#/components/schemas/Meta"
      examples:
        - type: stream-data
          topic: vessel.flight
          payload:
            latitude: -0.0972
            longitude: -74.5577
            altitudeAsl: 72840.31
            altitudeTerrain: 72837.02
            verticalSpeed: -4.2
            surfaceSpeed: 2287.4
            orbitalSpeed: 2301.8
            gForce: 0.02
            dynamicPressureKPa: 0.0004
            mach: 7.63
            atmDensity: 0.0000012
            externalTemperature: 231.4
            atmosphericTemperature: 228.9
            meta:
              source: vessel:8f2c1d40-97ab-4a2e-9c1f-6d0b3e5a7c11
          meta:
            source: system
            validAt: 1842006.5
            seq: 918
            deliveredAt: 1842006.5
            vantage: ground:Kerbal Space Center
            quality: 1
            active: true
            staleness: 0
            timelineEpoch: 3
            sampleId: 4127
    Subscribe:
      type: object
      description: Asks the mod to start sending a Topic to this connection.
      required:
        - type
        - topic
      properties:
        type:
          type: string
          const: subscribe
          x-sitrep-unit: id
          description: The frame type, always `"subscribe"`.
        topic:
          type: string
          x-sitrep-unit: id
          description: The Topic id to start receiving.
    SwitchVesselArgs:
      type: object
      description: |-
        Switch the flight to another tracked vessel. Takes the stable vessel id
        (`vessel.id.ToString()`, the same id `SetTargetArgs.vesselId` uses), never a
        roster array index. An empty id fails with `CommandErrorCode.NotFound`
        before the game is ever touched. Works from the flight scene, where it
        changes the active vessel, and from the Space Center and the Tracking
        Station, where it saves and then loads the vessel's flight. Refused with
        `CommandErrorCode.WrongScene` from the editors and wherever there is no game
        to switch in (the main menu, the loading screens), and with
        `CommandErrorCode.NotClearToProceed` for a vessel that is not tracked as
        ours.
      required:
        - vesselId
      properties:
        vesselId:
          type: string
          x-sitrep-unit: id
          description: |-
            The vessel to switch to: KSP's `Vessel.id` guid as a string, as
            `trackingStation.catalog` carries it.
    SystemBodies:
      type: object
      description: |-
        Every celestial body in the game, as a tree, wrapped as `{ "bodies": [ ... ]
        }`. The whole payload is `null`, not an empty list, when no sample has been
        taken yet, so "no data yet" and "zero bodies" stay distinct.

        Carries no `Meta` field: unlike the `vessel.*` family, its `Meta` rides the
        envelope (`StreamData.Meta`), never the payload body.
      required:
        - bodies
      properties:
        bodies:
          type: array
          items:
            $ref: "#/components/schemas/BodyEntry"
          description: Every body. The tree is expressed through `BodyEntry.parentIndex`.
    TargetAvailable:
      type: object
      description: |-
        The list of everything targetable from the active vessel, as the active
        vessel knows it. Wrapper object `{ "entries": [ ... ] }`, like
        `trackingStation.catalog`.

        A vessel is on the list once the active vessel has come to know of it, by
        whichever of three ways tells it soonest: it is within physics range and
        seen as it is; its radio reaches the active vessel directly, one signal
        delay of that link ago; or the active vessel's command centre knows of it
        and has said so over the control route, that route's signal delay ago. Each
        entry says which (`TargetListEntry.source`) and how old
        (`TargetListEntry.asOfUt`). A vessel with no route home and nothing in range
        keeps the list it last had: entries age, none is added. A vessel the active
        vessel has been told is gone leaves the list.

        Delayed like the rest of the active vessel's telemetry: a centre reads the
        list one of its own signal delays after the vessel held it.
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TargetListEntry"
          description: |-
            Every current target candidate. Empty, never null, when there is none.

            A model can carry part of this list forward: the range to a vessel the
            active one only knows of, which has no measured `TargetListEntry.distance`,
            follows from that vessel's `TargetListEntry.orbit` and the active vessel's
            own orbit. Every other field of every entry is the observation.
    TargetKind:
      type: integer
      description: |-
        Coarse classification of what `vessel.target` points at: a vessel, a
        celestial body, a part of a vessel (a docking port), or `TargetKind.Other`
        for anything not classified more finely (a waypoint, for instance). A more
        specific kind may be added later; treat an unrecognised value as
        `TargetKind.Other`.

        `TargetKind.Position` is used only as an input to `vessel.target.set` (see
        `SetTargetArgs.latitude` and `SetTargetArgs.longitude`): a map-picked
        latitude and longitude that no live KSP target object backs, so it never
        appears as `vessel.target`'s own reported `VesselTarget.kind`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Vessel
          description: A vessel. `VesselTarget.vesselId` carries its guid.
        - const: 1
          title: Body
          description: |-
            A celestial body. `VesselTarget.bodyIndex` carries its
            `trackingStation.bodies` index.
        - const: 2
          title: Other
          description: Anything not classified more finely, such as a waypoint. Carries no id.
        - const: 3
          title: Position
          description: |-
            A surface latitude and longitude, used only as a `vessel.target.set` input
            and never reported.
        - const: 4
          title: Part
          description: |-
            A part of a vessel: in practice a docking port (`ModuleDockingNode`, which
            implements `ITargetable`). Identity is the owning vessel's
            `VesselTarget.vesselId` guid plus the part's `VesselTarget.partId` (KSP
            `Part.flightID`): a part id alone is not globally unique, only within its
            vessel.
    TargetKnowledge:
      type: integer
      description: |-
        How the active vessel comes to know of another vessel on `target.available`,
        which is also how old what it knows can be.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: InRange
          description: |-
            The other vessel is within physics range of the active vessel, which sees it
            as it is.
        - const: 1
          title: DirectLink
          description: |-
            The other vessel's radio reaches the active vessel directly, so what is
            known of it is one signal delay of that link old.
        - const: 2
          title: CommandCentre
          description: |-
            The active vessel's command centre knows of the other vessel, by tracking it
            or by hearing from it, and has told the active vessel over its control
            route. What is known is as old as the centre's own knowledge plus that
            route's signal delay.
    TargetListEntry:
      type: object
      description: |-
        One entry in the `target.available` list: anything the active vessel could
        set as its target right now. Built from KSP's `ITargetable` (Vessel /
        CelestialBody / ModuleDockingNode all implement it) and classified by
        concrete type into a `TargetListEntry.kind` plus its stable id, so a modded
        `ITargetable` appears as `TargetKind.Other`. The stable id per kind
        (`TargetListEntry.vesselId` guid / `TargetListEntry.bodyIndex` /
        `TargetListEntry.partId` flightID) is the same id `SetTargetArgs` takes, so
        a widget hands an entry straight back into `vessel.target.set` with no
        lookup.
      required:
        - kind
        - name
        - isCurrent
      properties:
        kind:
          description: |-
            What sort of target this is, which says which id field is set:
            `TargetListEntry.vesselId` for a vessel, `TargetListEntry.bodyIndex` for a
            body, `TargetListEntry.partId` (with `TargetListEntry.vesselId`) for a part.
          allOf:
            - $ref: "#/components/schemas/TargetKind"
              x-sitrep-unit: enum
        name:
          type: string
          x-sitrep-unit: text
          description: Clean display name (KSP `GetDisplayName()`, falling back to `GetName()`).
        vesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Stable vessel guid: set for `TargetKind.Vessel`, and the owning vessel for a
            `TargetKind.Part`. Null otherwise.
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index into `trackingStation.bodies`: set for `TargetKind.Body`. Null
            otherwise.
        partId:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            KSP `Part.flightID`: set for `TargetKind.Part` (scoped by
            `TargetListEntry.vesselId`). Null otherwise.
        vesselType:
          description: |-
            Vessel type: set for `TargetKind.Vessel` / `TargetKind.Part` (the owning
            vessel's type). Null otherwise.
          anyOf:
            - $ref: "#/components/schemas/VesselType"
              x-sitrep-unit: enum
            - type: "null"
        situation:
          description: "Flight situation: set for `TargetKind.Vessel`. Null otherwise."
          anyOf:
            - $ref: "#/components/schemas/Situation"
              x-sitrep-unit: enum
            - type: "null"
        distance:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Distance from the active vessel, as of the last emission. A coarse sort aid
            for a picker, not a live readout: it moves every tick but is only refreshed
            on the channel's slow periodic re-send, and a change in it alone does not
            trigger an emission. Live distance for the current target comes off
            `vessel.target`. Null when a position was not available this tick.
        isCurrent:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when this entry is the active vessel's current target
            (`FlightGlobals.fetch.VesselTarget`) right now.
        source:
          description: |-
            How the active vessel knows of this vessel: see `TargetKnowledge`. Set for
            `TargetKind.Vessel` and for a `TargetKind.Part`, which is always in range.
            Null for a body, whose place is an ephemeris and not something learned.
          anyOf:
            - $ref: "#/components/schemas/TargetKnowledge"
              x-sitrep-unit: enum
            - type: "null"
        asOfUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time what is known of this vessel was true at: now for one in
            range, and otherwise when the newest word or sighting of it the active
            vessel holds was made. The vessel's `TargetListEntry.situation` and
            `TargetListEntry.orbit` are as of this instant. Null for a body.
        unchangedToUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time up to which the vessel is taken not to have changed since
            `TargetListEntry.asOfUt`. A vessel says so when its state changes, so a link
            that is up and silent is word that it has not. This is worked out from
            silence and not heard, so an age counted from it is shown as modelled.

            For a vessel known over a direct radio link (`TargetKnowledge.DirectLink`)
            that is up, it is now less that link's signal delay.

            For a vessel known through the command centre
            (`TargetKnowledge.CommandCentre`), it is what the centre knew one
            control-route signal delay ago, which is what the active vessel has been
            told. Where the centre then held the vessel's link as up, it is the latest
            moment a word could have left the vessel and, by the centre's own plan of
            the route at that moment, relays and waits for a window included, already
            have reached the centre. It is never later than the centre's moment less the
            time the vessel's last word was measured to take. Where the centre had
            planned no route for the vessel yet, the larger of that measured time and
            the plan's straight line stands in for the route.

            It does not claim the vessel is unchanged now, or that its link is up now:
            it is the centre's belief, as old as the control route is long, resting on
            the centre's plan and on the link as the centre last heard it. A word the
            plan has still on its way is not counted, so the figure can stand well short
            of the centre's moment less the signal delay, and it is null until some word
            sent after `TargetListEntry.asOfUt` would have arrived.

            It stops advancing once the link it rests on is held as down, or the control
            route drops, and is null again once newer word arrives. Null for a vessel in
            range, a part and a body.
        via:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The display name of the command centre that told the active vessel of this
            one, for `TargetKnowledge.CommandCentre`. Null otherwise.
        orbit:
          description: |-
            The vessel's orbit as of `TargetListEntry.asOfUt`, so its place now can be
            worked out from where it was last known to be going. Null for a vessel not
            on an orbit, one whose orbit the active vessel has not been told, a part and
            a body.
          anyOf:
            - $ref: "#/components/schemas/OrbitEntry"
            - type: "null"
        orbitBodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index into `trackingStation.bodies` of the body `TargetListEntry.orbit` is
            around. Null wherever `TargetListEntry.orbit` is.
    ThermalHottestPart:
      type: object
      description: |-
        Raw readings for whichever part is hottest by internal-temperature ratio;
        see `VesselThermal.hottestPart`.
      required:
        - internalTemp
        - maxTemp
        - skinTemp
        - name
      properties:
        internalTemp:
          type: number
          x-sitrep-unit: K
          description: |-
            Kelvin (KSP's `Part.temperature`). All four readings on this record share
            the unit, which is what makes the ratios on `VesselThermal` dimensionless.
        maxTemp:
          type: number
          x-sitrep-unit: K
          description: |-
            The part's maximum internal temperature, Kelvin (`Part.maxTemp`). Always
            greater than 0, since only a part with a valid maximum can be the hottest.
        skinTemp:
          type: number
          x-sitrep-unit: K
          description: The part's current skin temperature, Kelvin (`Part.skinTemperature`).
        skinMaxTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            The part's maximum skin temperature, Kelvin (`Part.skinMaxTemp`); `null` for
            a part with no skin-thermal model, where KSP reports `-1`.
        name:
          type: string
          x-sitrep-unit: text
          description: |-
            Display name of the hottest part (`Part.partInfo.title`, falling back to
            `Part.name`, same convention as `VesselPart.title`). Never null when
            `VesselThermal.hottestPart` itself is non-null.
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The part's flight id, as a string: the same join key as `VesselPart.id`, so
            a client can tell which part is hottest where several share
            `ThermalHottestPart.name` (a symmetric craft). `null` when the part has no
            live flight id yet.
    TimeCalendar:
      type: object
      description: |-
        How long a minute, hour, day and year are, and what real-world instant UT 0
        is (when the game has one), as the running game defines them.

        Every duration on the wire is SI seconds. To express one in days or years,
        divide by these values rather than by a constant: 21,600 seconds per day is
        right only for stock KSP on Kerbin time.

        Three things change them:

        - **Stock, no mods.** The game's Kerbin time setting is one a player can
          turn off, and KSP's own UI then reads in 24-hour days and 365-day years.
        - **A planet pack.** A planet-pack mod replaces the game's date formatter,
          the code that prints its clock, so a day becomes 86,400 s and a year 365
          days.
        - **Anything else.** Any mod can put its own calendar behind the game's date
          formatter.

        Whatever the game uses to print its own clock is what this channel carries:
        each duration is the count of seconds the date formatter gives for a minute,
        hour, day and year.

        It can change mid-session: the Kerbin time setting is reachable from the
        in-game settings menu at any time.

        The whole payload is `null` when the calendar cannot be read or any of the
        four durations is missing or not positive, so a consumer never divides by
        zero. There is no days-per-year field: divide `TimeCalendar.yearSeconds` by
        `TimeCalendar.daySeconds`, which is exact.
      required:
        - minuteSeconds
        - hourSeconds
        - daySeconds
        - yearSeconds
        - kerbinTime
        - meta
      properties:
        minuteSeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            Seconds in one minute, as the game's date formatter defines it. 60 in every
            known calendar. Always positive.
        hourSeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            Seconds in one hour, as the game's date formatter defines it. Always
            positive.
        daySeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            Seconds in one day: 21,600 on stock Kerbin time, 86,400 under Earth time or
            a planet pack. Always positive.
        yearSeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            Seconds in one year: 9,201,600 on stock Kerbin time (426 days), 31,536,000
            under a 365-day Earth calendar. Always positive.
        epoch:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The real-world instant UT 0 corresponds to, ISO-8601 in UTC
            (`1951-01-01T00:00:00Z`), or `null` when the running game has no such
            instant. Never an empty string.

            The durations say how long a day is; this says which day it is. Every
            `Units.UniversalTime` field is an offset from UT 0, so with an epoch a
            deadline can be shown as `14 Mar 1957` rather than `Y3 D122`.

            It is read from the date formatter itself. A formatter that models a real
            calendar holds an anchor date, as a planet-pack mod's does; the stock
            formatter holds none.

            `null` means the game has no real-world calendar, which is the normal case
            and is not the same as an epoch of zero. Stock KSP has no real calendar: its
            own UI prints Year 1, Day 1, and so should every consumer. A planet pack
            that changes the day length without installing a date-based formatter has no
            anchor either. Do not render a default anchor for those games.
        kerbinTime:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            The game's Kerbin time setting, for a consumer that wants to label the
            calendar ("Kerbin time" against "Earth time"). Do not do arithmetic with it:
            the seconds fields above already account for this flag and for anything a
            planet pack did on top of it. `true` when the setting cannot be read.
        meta:
          description: |-
            Payload provenance. `Source` is always `"game"`: the calendar describes the
            session, not a craft.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    TrackingStationCatalog:
      type: object
      description: |-
        Every object the receiving command centre knows of, craft and tracked space
        objects alike, one entry each, wrapped as `{ "entries": [ ... ] }`. Like
        `SystemBodies`, it carries no per-payload `Meta`: that rides the envelope.

        Each command centre is sent its own catalog and no other centre's. A centre
        knows an object in two ways, and an entry is made of both.

        **By sight: where it is.** An object's orbit, its situation and its body are
        tracked by looking at it, whether or not it has a radio and whether or not
        it is in contact. That reaches a centre in a straight line at light speed,
        through no relay, so a burn far away shows here after the distance between
        the craft and this centre and no sooner. An object with no radio at all
        (debris, an asteroid, a flag, a crewed craft with no antenna) is known this
        way only: it is listed, with its name and kind, once light from it has had
        time to reach this centre, and removed the same delay after it is gone.

        **By radio: everything else.** A craft's crew and its link are its own to
        say, and arrive over its radio's route at that route's signal delay. A craft
        that has been seen and not yet heard has no crew count and no link state,
        which are absent and not zero. Where a craft has a radio its location is as
        fresh as the newer of the two.

        **Contact.** Whether this centre is in contact with each craft is what has
        reached this centre: in contact, silent, overdue, lost or gone. Only the
        home centre declares a craft lost, and a centre shows the declaration once
        it has reached it.

        What can be tracked by sight is the game's own tracking station rule at the
        station's current level. Where the game lets the station place no object at
        all, nothing is known by sight and every entry is what was heard.
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEntry"
          description: |-
            Every object this centre knows of, loaded or not, in id order. Debris and
            asteroids are included.
    TrackingStationDismissArgs:
      type: object
      description: |-
        Take a destroyed craft off the catalog of the command centre the command is
        sent from. Every other centre keeps listing it until it is dismissed there.
        A craft that centre knows of no end for stays listed, so a dismissal sent
        before the news has arrived changes nothing.

        Never delayed: the catalog is the ground's own record.
      required:
        - vesselId
      properties:
        vesselId:
          type: string
          x-sitrep-unit: id
          description: The craft, by `CatalogEntry.vesselId`.
    TrajectoryKind:
      type: integer
      description: |-
        What kind of thing an element set describes: a closed-form conic, or a
        snapshot of an integrated path.

        `TrajectoryKind.Unspecified` is 0 for the same reason as
        `PropagationHorizonKind.Unspecified`: a producer that does not set the field
        gets the value that withholds rather than the one that permits.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Unspecified
          description: No provider stated one. Treat the shape as unknown.
        - const: 1
          title: Analytic
          description: |-
            A closed-form conic. The orbit is that conic, so a conic renderer is exactly
            right and stays right for as long as the horizon allows.
        - const: 2
          title: Integrated
          description: |-
            A numerically integrated path. The osculating conic on the wire is a
            snapshot of it, true at the sample instant and never the path itself, so a
            client that draws a closed ellipse from it is drawing something the craft
            will not fly.
    TransitionType:
      type: integer
      description: |-
        How an orbit patch begins or ends, KSP's `Orbit.PatchTransitionType` (read
        from `Orbit.patchStartTransition` and `Orbit.patchEndTransition`). Member
        names follow KSP's except `TransitionType.Collision`, which is KSP's
        `IMPACT`. `TransitionType.Unknown` stands for a value this contract does not
        recognise.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Initial
          description: |-
            The patch starts at the vessel's current position: the first patch of a
            trajectory.
        - const: 1
          title: Final
          description: |-
            The patch does not end in a transition: the trajectory continues on it
            indefinitely.
        - const: 2
          title: Encounter
          description: The trajectory enters another body's sphere of influence.
        - const: 3
          title: Escape
          description: The trajectory leaves the current body's sphere of influence.
        - const: 4
          title: Maneuver
          description: The patch ends or begins at a planned maneuver node.
        - const: 5
          title: Collision
          description: |-
            The trajectory meets the body's surface (KSP `IMPACT`), with or without an
            atmosphere.
        - const: 6
          title: Unknown
          description: A transition this contract does not recognise.
    UnlockKind:
      type: integer
      description: Which kind of unlock a `MissingUnlock` names.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Tech
          description: A tech node in the save's research tree.
        - const: 1
          title: Facility
          description: A space centre building's level.
    UnlockTechArgs:
      type: object
      description: |-
        Unlock a tech node, spending its science cost. Takes the tech node's
        `techID`, the same id `career.status` publishes for each tech node as
        `tech.nodes[].id`. Unlocking deducts the node's science cost.
      required:
        - techId
      properties:
        techId:
          type: string
          x-sitrep-unit: id
          description: |-
            The tech node to unlock: its KSP `techID` (e.g. `"basicRocketry"`), as
            `career.status`'s `tech.nodes[].id` carries it.
    UnreachableCentreEntry:
      type: object
      description: |-
        One command centre that was on `commandCentre.roster` earlier in this
        session and is not now, in the `commandCentre.unreachable` channel: a ground
        station whose node went away, a crewed vessel that lost its crew or was
        destroyed or recovered.

        The Topic payload is a bare array of these entries, one per remembered
        centre that is currently off the roster, keyed by
        `UnreachableCentreEntry.id`. A centre that comes back leaves this channel
        and rejoins the roster, and a centre that has not been on the roster since
        the mod started is not listed at all: an absent id is a fact about what is
        unknown, not about what is reachable.

        Each command centre is sent its own: the centres that have left its own
        `commandCentre.roster`. A vessel centre that is destroyed or loses its crew
        is listed here when its own word of that, or its silence, has reached the
        receiving centre, and `UnreachableCentreEntry.lastReachableUt` is when it
        was last on that centre's roster.
      required:
        - id
        - displayName
        - kind
        - lastReachableUt
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            The centre's roster `Id` (`"ground:<name>"` | `"vessel:<guid>"`), the key it
            had while it was reachable.
        displayName:
          type: string
          x-sitrep-unit: text
          description: |-
            The name the centre had on the roster, kept so a client can name it after it
            has gone.
        kind:
          type: string
          x-sitrep-unit: text
          description: |-
            One of `GroundStation`, `CrewedVessel` or `Custom`, as the roster reported
            it.
        lastReachableUt:
          type: number
          x-sitrep-unit: ut
          description: Universal time at which this centre was last on `commandCentre.roster`.
        reason:
          description: |-
            Why the centre left the roster, as far as the receiving centre has been
            told. Null when the centre's own word does not say, so absence is not a
            reason.
          anyOf:
            - $ref: "#/components/schemas/UnreachableReason"
              x-sitrep-unit: enum
            - type: "null"
    UnreachableReason:
      type: integer
      description: |-
        Why a command centre is no longer on a roster: the two ways a centre leaves
        it that the game tells apart.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: NoLongerExists
          description: |-
            The centre no longer exists: a crewed vessel destroyed or recovered, or a
            ground station the game no longer lists.
        - const: 1
          title: NoLongerCentre
          description: |-
            The vessel still exists but has reported that it is no longer a command
            centre.
    Unsubscribe:
      type: object
      description: Asks the mod to stop sending a Topic to this connection.
      required:
        - type
        - topic
      properties:
        type:
          type: string
          const: unsubscribe
          x-sitrep-unit: id
          description: The frame type, always `"unsubscribe"`.
        topic:
          type: string
          x-sitrep-unit: id
          description: The Topic id to stop receiving.
    UpdateManeuverNodeArgs:
      type: object
      description: |-
        Replace an existing node's time and delta-v. The node is named by its opaque
        `UpdateManeuverNodeArgs.nodeId`, never a positional index, so adding or
        removing another node never changes which node an update reaches. A client
        will not send the command if it would arrive at the craft at or after
        `UpdateManeuverNodeArgs.ut`.
      required:
        - nodeId
        - ut
        - prograde
        - normal
        - radialOut
      properties:
        nodeId:
          type: string
          x-sitrep-unit: id
          description: |-
            The node to update: the id `vessel.maneuver.add` returned, or a
            `ManeuverNode.id` from `vessel.maneuver`. An unknown id fails with
            `CommandErrorCode.NotFound`.
        ut:
          type: number
          x-sitrep-unit: ut
          description: The node's new time, in UT seconds.
        prograde:
          type: number
          x-sitrep-unit: m/s
          description: |-
            The delta-v component along the orbit's prograde direction at the node, in
            m/s.
        normal:
          type: number
          x-sitrep-unit: m/s
          description: The delta-v component along the orbit normal at the node, in m/s.
        radialOut:
          type: number
          x-sitrep-unit: m/s
          description: The delta-v component along the radial-out direction at the node, in m/s.
    UpgradeFacilityArgs:
      type: object
      description: |-
        Raise a Space Center facility by one tier. Takes the facility's
        `SpaceCenterFacility` enum name (e.g. `"VehicleAssemblyBuilding"`,
        `"LaunchPad"`), the same key `CareerFacilities`'s `facilities` map uses on
        the `career.facilities` channel (the buildings are not on `career.status`).
        Upgrading raises the facility one tier and deducts its upgrade cost from
        funds.
      required:
        - facilityId
      properties:
        facilityId:
          type: string
          x-sitrep-unit: id
          description: |-
            The facility to upgrade: its `SpaceCenterFacility` enum name, as a key of
            `career.facilities`' `facilities` map.
    UplinkActionReply:
      type: object
      description: |-
        The reply to `system.uplink.cancel` (`UplinkCancelRequest`, stop a delayed
        command still on its way to the craft) and to `system.uplink.resend`
        (`UplinkResendRequest`, send a held or overdue command again). It reports
        what the command centre that asked did, not what happened at the craft; that
        arrives later as `comms.journey` reports (`CommsJourneyEvent`). A lane here
        is the ordered run of delayed commands one centre sends to one craft, and a
        lane number is a command's place in it (`PendingUplink.laneSeq`); it is not
        the lane byte of a binary frame.
      required:
        - throughSeq
        - id
        - expiresAtUt
      properties:
        throughSeq:
          type: number
          x-sitrep-unit: count
          description: |-
            For a cancel, the last lane number it covers. It can be higher than the lane
            number the client saw, when another screen sent on the lane in the meantime.
            For a send again, the lane number the request named.
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            For a send again, the new copy's id, which its journey reports name; empty
            for a cancel.
        expiresAtUt:
          type: number
          x-sitrep-unit: ut
          description: |-
            The universal time after which the cancel, or the new copy, is dropped if it
            has not reached the craft. Both travel to the craft like any delayed
            command.
    UplinkCancelRequest:
      type: object
      description: |-
        Cancels a held or travelling command, named by its lane number, alone or
        with every later number this centre had sent on the lane when it was
        pressed. A lane is the ordered run of delayed commands one centre sends to
        one craft, and a lane number is a command's place in it. A command this
        centre is still holding stops at once; for one it has sent, a cancel goes to
        the craft, stopping the command wherever it is held and refusing it at the
        craft if it arrives there first. What it stopped arrives as journey reports.

        The reply says the cancel was sent, never that the command was stopped. A
        command sent less than twice its signal delay ago may have been lost on the
        way, in which case it is still this centre's, but the centre cannot know
        that yet, so the cancel is sent after it all the same and the command is
        reported cancelled here only once it is known to have come back.
      required:
        - epoch
        - craft
        - laneSeq
        - andBehind
      properties:
        epoch:
          type: number
          x-sitrep-unit: count
          description: |-
            The timeline the command was sent in; a cancel naming another timeline is
            refused.
        craft:
          type: string
          x-sitrep-unit: id
          description: The craft its lane runs to, as `PendingUplink.craft`.
        laneSeq:
          type: number
          x-sitrep-unit: count
          description: |-
            Its place on its lane, the ordered run of delayed commands one command
            centre sends to one craft, as `PendingUplink.laneSeq`.
        andBehind:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether to cancel every later number on the lane too, up to the newest this
            centre has sent.
    UplinkResendRequest:
      type: object
      description: |-
        Sends a held or overdue command again in its own place on its lane: a new
        copy with the same lane number, which must arrive before the commands behind
        it stop waiting for it. Whichever copy reaches the craft first runs; any
        other is discarded.
      required:
        - epoch
        - craft
        - laneSeq
      properties:
        epoch:
          type: number
          x-sitrep-unit: count
          description: |-
            The timeline the command was sent in; a send again naming another timeline
            is refused.
        craft:
          type: string
          x-sitrep-unit: id
          description: The craft its lane runs to.
        laneSeq:
          type: number
          x-sitrep-unit: count
          description: |-
            Its place on its lane, the ordered run of delayed commands one command
            centre sends to one craft, as `PendingUplink.laneSeq`.
    VesselAttitude:
      type: object
      description: |-
        Pitch, heading and roll of the vessel's control reference, the orientation
        the pilot steers by, against the local surface up and north, in two named
        frames.

        `VesselAttitude.pitch`, `VesselAttitude.heading` and `VesselAttitude.roll`
        are the primary frame, with up and north measured at the vessel's centre of
        mass. `VesselAttitude.pitchRootFrame`, `VesselAttitude.headingRootFrame` and
        `VesselAttitude.rollRootFrame` measure up and north at the root part's
        position instead. The orientation is the same in both; the two differ only
        when the root part sits away from the centre of mass. Without a root part
        the root frame repeats the primary one.

        Absent when the vessel has no reference body. Attitude is not derivable from
        orbital elements, so it is streamed raw.
      required:
        - pitch
        - heading
        - roll
        - pitchRootFrame
        - headingRootFrame
        - rollRootFrame
        - meta
      properties:
        pitch:
          type: number
          x-sitrep-unit: °
          description: |-
            Pitch above the horizon, measured at the centre of mass. Degrees, -90 (nose
            down) to 90 (nose up).
        heading:
          type: number
          x-sitrep-unit: °
          description: |-
            Compass heading, measured at the centre of mass. Degrees, 0 to 360,
            clockwise from north.
        roll:
          type: number
          x-sitrep-unit: °
          description: Roll, measured at the centre of mass. Degrees, -180 to 180.
        pitchRootFrame:
          type: number
          x-sitrep-unit: °
          description: As `VesselAttitude.pitch`, measured at the root part. Degrees, -90 to 90.
        headingRootFrame:
          type: number
          x-sitrep-unit: °
          description: As `VesselAttitude.heading`, measured at the root part. Degrees, 0 to 360.
        rollRootFrame:
          type: number
          x-sitrep-unit: °
          description: As `VesselAttitude.roll`, measured at the root part. Degrees, -180 to 180.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselComms:
      type: object
      description: |-
        The active vessel's own CommNet connection, from KSP's `vessel.connection`.
        The whole payload is null when the vessel has no CommNet connection object;
        there is no zero or disconnected placeholder reading.

        This is what the vessel itself reports. Signal delay and link modelling are
        on the `comms.*` channels (`comms.delay` for the delay), not here.
      required:
        - connected
        - signalStrength
        - signalQuantity
        - controlState
        - meta
      properties:
        connected:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the vessel has a CommNet connection home, from
            `vessel.connection.IsConnected`.
        signalStrength:
          type: number
          x-sitrep-unit: ratio
          description: |-
            The connection's signal strength, from `vessel.connection.SignalStrength`: a
            ratio from `0` (none) to `1` (full).
        signalQuantity:
          description: |-
            Which quantity `VesselComms.signalStrength` is, as the comms backend in
            force declares it: `SignalQuantity.Unknown` while no backend has answered.
          allOf:
            - $ref: "#/components/schemas/SignalQuantity"
              x-sitrep-unit: enum
        controlState:
          description: |-
            What is controlling the vessel and how much control it has, from
            `vessel.connection.ControlState`.
          allOf:
            - $ref: "#/components/schemas/ControlState"
              x-sitrep-unit: enum
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselControl:
      type: object
      description: |-
        The active vessel's control state (the stock toggles, SAS mode, throttle,
        the commanded fly-by-wire axes and the custom action groups). The payload is
        present whenever there is an active vessel; each field is individually
        nullable, and `null` means that input could not be read this tick (for
        example no flight input state, or no action-group data), never a default.

        Each control field that can be changed is paired with its command through
        its control channel, so the confirmed state and the command that changes it
        are one handle. The confirmed value lags a command by the round trip,
        including any comms delay.

        `VesselControl.throttle` is 0..1 nominally, but KSP does not clamp
        `Vessel.ctrlState.mainThrottle`: a throttle driven by kOS or another mod can
        read above 1. The value is passed through unclamped.
      required:
        - meta
      properties:
        sas:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether SAS is on. Changed with `vessel.control.setSas`.
        sasAvailable:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the vessel has a source that can hold SAS on: a Pilot aboard, or a
            probe core whose SAS tier allows it (KSP's `VesselSAS.CanEngageSAS`). When
            false, `vessel.control.setSas` refuses to turn SAS on, so a client can show
            the control unavailable before it is pressed; turning SAS off is never
            refused. Null when the vessel has no autopilot to ask.
        sasUnavailableReason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Why SAS cannot be turned on, in the words the refusal uses, when
            `VesselControl.sasAvailable` is false. Null whenever SAS is available or
            unknown.
        sasMode:
          description: The SAS hold mode. Changed with `vessel.control.setSasMode`.
          anyOf:
            - $ref: "#/components/schemas/SasMode"
              x-sitrep-unit: enum
            - type: "null"
        rcs:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether RCS is on. Changed with `vessel.control.setRcs`.
        gear:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the Gear action group is engaged (landing gear deployed). Changed
            with `vessel.control.setGear`.
        brakes:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the Brakes action group is engaged. Changed with
            `vessel.control.setBrakes`.
        lights:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the Lights action group is engaged. Changed with
            `vessel.control.setLights`.
        abort:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the Abort action group is engaged. Changed with
            `vessel.control.setAbort`.
        precisionControl:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Precision-control (fine-control / caps-lock) mode. Mirrors KSP's
            `FlightInputHandler.fetch.precisionMode`. Null when there is no active
            flight scene. Changed with `vessel.control.setPrecisionControl`.
        flyByWire:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the fly-by-wire override is on for this vessel. Changed with
            `vessel.control.setFlyByWire`. The override belongs to the craft it was
            turned on for, so this is `false` on any other craft even while the override
            is on elsewhere, and it reads `true` again only on the craft that carries
            it. Unlike a client's own record of the commands it sent, it survives a page
            reload.
        throttle:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            Main throttle, KSP's `Vessel.ctrlState.mainThrottle`: 0..1 nominally, but
            not clamped, so a mod-driven throttle can read above 1. Changed with
            `vessel.control.setThrottle`.
        pitch:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The applied pitch axis input, -1..1, from KSP's `Vessel.ctrlState.pitch`.
            Null when the vessel has no control state. Set with
            `vessel.control.setAxes`.
        yaw:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The applied yaw axis input, -1..1, from KSP's `Vessel.ctrlState.yaw`. Null
            when the vessel has no control state. Set with `vessel.control.setAxes`.
        roll:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The applied roll axis input, -1..1, from KSP's `Vessel.ctrlState.roll`. Null
            when the vessel has no control state. Set with `vessel.control.setAxes`.
        translationX:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The applied translation X input (RCS right/left), -1..1, from KSP's
            `Vessel.ctrlState.X`. Null when the vessel has no control state. Set with
            `vessel.control.setAxes`.
        translationY:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The applied translation Y input (RCS up/down), -1..1, from KSP's
            `Vessel.ctrlState.Y`. Null when the vessel has no control state. Set with
            `vessel.control.setAxes`.
        translationZ:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The applied translation Z input (RCS forward/back), -1..1, from KSP's
            `Vessel.ctrlState.Z`. Null when the vessel has no control state. Set with
            `vessel.control.setAxes`.
        actionGroups:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ActionGroupState"
          description: |-
            Every custom action group the vessel has, each named and carrying its own
            index (see `ActionGroupState`). Stock KSP yields ten entries (`AG1..AG10`);
            an AGX backend may yield up to 250 with the player's own names. Null when
            action-group data wasn't available this tick; never a partial list. Order is
            by `ActionGroupState.index` ascending, but read `ActionGroupState.index`
            rather than relying on array position: position does not carry identity
            here.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselCrew:
      type: object
      description: |-
        The `vessel.crew` payload: who is aboard the active vessel and how many
        seats it has.
      required:
        - count
        - crew
        - meta
      properties:
        count:
          type: number
          x-sitrep-unit: count
          description: How many crew are aboard.
        capacity:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: How many crew seats the vessel has. Null when the seats could not be read.
        crew:
          type: array
          items:
            $ref: "#/components/schemas/CrewMember"
          description: Each crew member aboard.
        meta:
          description: Which vessel this describes.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselFlight:
      type: object
      description: |-
        Quantities the game measures, either because they cannot be derived from
        orbital elements (terrain height, aerodynamic state) or because they are the
        measured value to check a prediction against (speeds). One field per
        quantity.

        The channel is absent when there is no active vessel or any of its fields
        could not be read; there is never a `(0,0)` lat/long placeholder. There is
        no mission time field: see `VesselIdentity.launchUt`.
      required:
        - latitude
        - longitude
        - altitudeAsl
        - altitudeTerrain
        - verticalSpeed
        - surfaceSpeed
        - orbitalSpeed
        - gForce
        - dynamicPressureKPa
        - mach
        - atmDensity
        - externalTemperature
        - atmosphericTemperature
        - meta
      properties:
        latitude:
          type: number
          x-sitrep-unit: °
          description: |-
            Latitude of the vessel's position on its reference body, degrees (KSP's
            `Vessel.latitude`). Present means valid: there is no `(0,0)` no-data
            placeholder, and absence is the whole channel being unavailable.
        longitude:
          type: number
          x-sitrep-unit: °
          description: |-
            Longitude of the vessel's position on its reference body, degrees (KSP's
            `Vessel.longitude`, passed through without normalising its range). Same
            presence rule as `VesselFlight.latitude`.
        altitudeAsl:
          type: number
          x-sitrep-unit: m
          description: Altitude above sea level, metres (KSP's `Vessel.altitude`).
        altitudeTerrain:
          type: number
          x-sitrep-unit: m
          description: |-
            Height above terrain (AGL, KSP's `Vessel.radarAltitude`), metres. Not
            derivable from orbital elements, so it is streamed as measured.
        verticalSpeed:
          type: number
          x-sitrep-unit: m/s
          description: |-
            Metres per second (KSP's `Vessel.verticalSpeed`), signed: negative is
            descending.
        surfaceSpeed:
          type: number
          x-sitrep-unit: m/s
          description: |-
            Speed relative to the ground beneath the vessel, which turns with the body,
            metres per second (KSP's `Vessel.srfSpeed`). It can be higher than
            `VesselFlight.orbitalSpeed`: far above the synchronous altitude a craft in a
            prograde orbit moves more slowly than the ground below it turns.
        orbitalSpeed:
          type: number
          x-sitrep-unit: m/s
          description: |-
            Speed relative to the parent body's centre, ignoring its rotation, metres
            per second (KSP's `Vessel.obt_speed`). This is the speed of the orbit.
        gForce:
          type: number
          x-sitrep-unit: g
          description: Multiples of standard gravity (KSP's `Vessel.geeForce`).
        dynamicPressureKPa:
          type: number
          x-sitrep-unit: kPa
          description: |-
            Dynamic pressure on the vessel, kilopascals (KSP's
            `Vessel.dynamicPressurekPa`). `0` outside an atmosphere.
        mach:
          type: number
          x-sitrep-unit: "1"
          description: Mach number (KSP's `Vessel.mach`), dimensionless.
        atmDensity:
          type: number
          x-sitrep-unit: kg/m³
          description: |-
            Atmospheric density at the vessel's position, kg/m³ (KSP's
            `Vessel.atmDensity`).
        externalTemperature:
          type: number
          x-sitrep-unit: K
          description: |-
            Skin/ambient external temperature the vessel is exposed to, Kelvin
            (Vessel.externalTemperature).
        atmosphericTemperature:
          type: number
          x-sitrep-unit: K
          description: |-
            Ambient atmospheric temperature at the vessel's position, Kelvin
            (Vessel.atmosphericTemperature).
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselIdentity:
      type: object
      description: |-
        Who the active vessel is, what kind of craft it is, and where it is.

        There is no mission time field. `VesselIdentity.launchUt` is fixed after
        liftoff, so mission elapsed time is the current UT (the `meta.validAt` of
        the newest frame) minus `launchUt`, computed by the client.
      required:
        - vesselId
        - name
        - vesselType
        - situation
        - meta
      properties:
        vesselId:
          type: string
          x-sitrep-unit: id
          description: |-
            The stable subject id: KSP's `Vessel.id` GUID as a string. The id
            vessel-scoped commands take, and the `<guid>` in `VesselIdentity.meta`'s
            `"vessel:<guid>"` source.
        name:
          type: string
          x-sitrep-unit: text
          description: |-
            The vessel's name, KSP's `Vessel.vesselName`. Empty when it could not be
            read.
        vesselType:
          description: The vessel's type, from KSP's `Vessel.vesselType`.
          allOf:
            - $ref: "#/components/schemas/VesselType"
              x-sitrep-unit: enum
        situation:
          description: |-
            The vessel's situation (landed, flying, orbiting and so on), from KSP's
            `Vessel.situation`.
          allOf:
            - $ref: "#/components/schemas/Situation"
              x-sitrep-unit: enum
        parentBodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index into `trackingStation.bodies` of the body the vessel orbits; null when
            the vessel has no orbit yet (for example a just-spawned EVA kerbal).
        launchUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time the vessel's mission clock started from, fixed from
            liftoff. `null` while the vessel is in `PreLaunch` and whenever the clock is
            unknown, never the current time.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselInventory:
      type: object
      description: |-
        The stock cargo a vessel's parts are carrying: what is aboard, and in which
        part.

        A kerbal's own inventory is not here: it is on `vessel.crew`, beside the
        trait and experience level that decide whether that kerbal can do a job.
        This channel lists only part-hosted stores.

        Each store is reported with its part rather than as one vessel total,
        because a craft can carry plenty of something while the kerbal who needs it
        has none. A kerbal has two slots, 40 units of volume and a 65 kg limit, and
        one slot holds a parachute by default; a cargo container holds far more.

        Stock KSP, with or without any Uplink: stock repairs consume stock cargo, so
        a stock career has inventories worth showing.
      required:
        - stores
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/InventoryStore"
          description: |-
            Every part-hosted inventory on the active vessel this tick, in vessel
            part-list order. Always present (possibly empty); a vessel-less tick, or one
            whose holds could not be read, yields a `null` payload, not an empty list.
    VesselLanding:
      type: object
      description: |-
        Landing data for the active vessel that needs the terrain map of the body
        below (slope, roughness and elevation at the touchdown site), plus an
        atmosphere-aware descent estimate built from the vessel's measured drag. The
        vacuum ballistic figures (which need no terrain) are not here; a client
        solves those itself.

        The whole payload is absent unless the vessel is descending toward a solid
        surface: the body must have a solid surface and terrain, and the vessel must
        be descending towards it within the prediction horizon. So it never carries
        a leftover reading from orbit, or a 0 from a body with no terrain.

        Every field is nullable, and null means that input is unavailable this tick
        (no terrain fit, not in an atmosphere, and so on), never an unverified 0.
      required:
        - meta
      properties:
        outcome:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Which class of landing readout is valid this tick, so a client can render
            the state rather than infer it from which fields are null. One of
            `"atmospheric-aware"` (the atmospheric descent fields are solved),
            `"terrain-assessed"` (no atmospheric solution, but a terrain slope fit
            exists) or `"vacuum-solved"` (neither). `"no-solution"` is part of the
            vocabulary but not currently produced.
        sampleSource:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Where the terrain fields were sampled this tick: `"predicted"` (at the mod's
            predicted touchdown point, the site the vessel is heading for) or
            `"sub-vessel"` (directly under the vessel, when there is no touchdown
            prediction). Show it, so the operator knows whether they are seeing
            downrange or under-ship terrain. Null when no terrain was sampled.
        predictedLatitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Latitude in degrees of the point the terrain fields were sampled at: the
            predicted touchdown point, or the vessel's own latitude when
            `VesselLanding.sampleSource` is `"sub-vessel"`.
        predictedLongitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Longitude in degrees of the sampled point, on the same terms as
            `VesselLanding.predictedLatitude` and always present together with it.
        predictedTerrainElevation:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Terrain elevation in metres at the sampled point, KSP's
            `CelestialBody.TerrainAltitude(lat, lon, allowNegative: true)`, so ocean
            floor reads as negative rather than clamping to 0.
        predictedSlopeAngle:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Terrain slope in degrees at the sampled point, from a plane fit over sampled
            heights (so a bowl is not mistaken for an incline). The tip-over risk
            readout, available while still descending. Null when the plane fit fails.
        predictedSlopeHeading:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            The downhill direction at the sampled point in degrees, 0 north, clockwise:
            which way the lander falls if it tips. Null when the slope is too slight to
            give a direction.
        predictedRoughness:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            The residual standard deviation, in metres, of sampled terrain height at the
            sampled point after the fitted slope plane is removed (so tilt is not
            counted as roughness), over `VesselLanding.roughnessFootprintMeters`. The
            boulder-risk proxy.
        roughnessFootprintMeters:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            The footprint radius in metres that `VesselLanding.predictedRoughness` was
            sampled over, so a client can label and grade it.
        slopeSampleRadiusMeters:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: The radius in metres the slope plane-fit samples span.
        predictedBiome:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's biome name at the sampled point (for the vessel's current position,
            read `vessel.surface.biome`), from `ScienceUtil.GetExperimentBiome`. Null
            when the body has no biome map.
        groundTrackDistances:
          type:
            - array
            - "null"
          items:
            type: number
            x-sitrep-unit: m
          description: |-
            The distance in metres of each `VesselLanding.groundTrackElevations` sample
            along the predicted ground track, signed: 0 is the point on the ground
            beneath the vessel, positive is toward the predicted site and on past it,
            negative is behind the vessel. Ascending, the same length as
            `VesselLanding.groundTrackElevations`. The strip always holds the ground
            directly beneath the vessel, with at least one vessel height (and never less
            than 120 m) of ground behind it, and runs on to the far edge of the
            footprint of a cone of 60 degrees either side of the vessel's travel vector:
            where the cone's two edges, in the plane of the vessel's motion, meet the
            ground. A flat or climbing approach has an edge that never meets it, and
            that edge is cut at the horizon. The strip also reaches the predicted site
            and a tenth of its distance past it. The number of samples is fixed, so they
            are closer together the narrower the strip, which narrows as the vessel
            descends. Null when no track could be sampled.
        groundTrackElevations:
          type:
            - array
            - "null"
          items:
            type: number
            x-sitrep-unit: m
          description: |-
            Terrain elevation in metres at each `VesselLanding.groundTrackDistances`
            entry, from the body's terrain model (ocean floor reads negative). Null when
            no track could be sampled.
        siteHeights:
          type:
            - array
            - "null"
          items:
            type: number
            x-sitrep-unit: m
          description: |-
            A square of terrain elevations in metres around the predicted site, for a
            top-down view of it: `VesselLanding.siteHeightsSize` by
            `VesselLanding.siteHeightsSize` values row by row, the northern row first
            and the western column first in each row, so laying them out in that order
            puts north at the top. The grid is centred on the site and its width is
            `VesselLanding.siteHeightsExtentMeters`: wide enough to hold the ground
            between the vessel and the site, and about the vessel's height of it either
            side, so it narrows as the vessel descends and closes on the site, and it
            may be a second old. Null when no site could be sampled.
        horizonAngles:
          type:
            - array
            - "null"
          items:
            type: number
            x-sitrep-unit: °
          description: |-
            The skyline the vessel sees, for a view from the vessel: 72 values, entry
            `i` looking along bearing `i * 5` degrees clockwise from north, each the
            highest angle above the level, in degrees, at which terrain is seen along
            that bearing out to about 30 km (or the horizon, if nearer). The ground
            curves away below the level by `range / (2 * radius)`, which is included. It
            carries the relief beyond `VesselLanding.siteHeights`, which holds only the
            ground around the vessel and the site: a view uses it to draw distant hills
            and to tell far ground from sky. It says nothing of what hides a nearer
            point, since the grid already holds all the ground between the vessel and
            the site. Taken from where the vessel was up to a couple of seconds ago.
            Null when no site could be sampled.
        siteHeightsSize:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            The number of values along each side of `VesselLanding.siteHeights`. Null
            when there is no grid.
        siteHeightsExtentMeters:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            The full width in metres that `VesselLanding.siteHeights` spans. Null when
            there is no grid.
        terminalVelocity:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            Terminal velocity in m/s at the current altitude and configuration, from the
            measured aggregate drag force against local gravity. An estimate that
            assumes the current configuration holds (same attitude, no parachute yet to
            open). Null outside an atmosphere, or when the vessel's parts could not be
            read.
        projectedTouchdownSpeed:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            Projected touchdown speed in m/s under a terminal descent to the ground
            (terminal velocity scaled to ground-level density). In an atmosphere, use
            this rather than a vacuum impact speed. Null outside an atmosphere.
        atmosphericTimeToImpact:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            Atmosphere-aware time to impact in seconds, integrating the
            terminal-velocity profile down the density column. Null outside an
            atmosphere.
        descentRegime:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The instantaneous descent regime: `"at-terminal"`, `"decelerating"` or
            `"accelerating"`. Null outside an atmosphere.
        dragToWeightRatio:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The aggregate aerodynamic drag force divided by the vessel's weight (local
            gravity): the numeric form of `VesselLanding.descentRegime`. >1 decelerating
            (drag beats gravity), 1 at terminal, <1 still accelerating. A dimensionless
            ratio from 0 upward like TWR, not a 0..1 fraction. Null outside an
            atmosphere, and for a weightless vessel.
        parachuteState:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Parachute state affecting the estimate: `"none"` (no parachute is staged or
            open), `"armed"` (a parachute is staged and waiting to open: a future jump
            in drag the estimate cannot see, so flag it) or `"deployed"` (a parachute is
            open or semi-deployed, so its drag is already in the measurement). Null
            outside an atmosphere.
        parachuteDeployment:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            How far the craft's parachutes have opened, taken from the one furthest
            along: `"none"` (the craft carries no parachute), `"stowed"` (packed, not
            yet staged), `"armed"` (staged and waiting for air thick enough to open in),
            `"semi-deployed"` (open as a streamer, slowing the craft a little),
            `"deployed"` (fully open) or `"cut"` (every one cut away). Unlike
            `VesselLanding.parachuteState` it tells semi-deployed from fully deployed,
            and a packed parachute from none. Null outside an atmosphere, and when a
            parachute whose arming could not be read might be the furthest along.
        parachuteDeploySafety:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Whether opening the parachutes not yet open would survive the current speed
            and air, as the game rates it from the heating a canopy would take:
            `"safe"`, `"risky"` (the canopy would heat but hold for a few seconds) or
            `"unsafe"` (it would burn through). The worst rating among the stowed and
            armed parachutes. Null outside an atmosphere, when every parachute is
            already open or cut, and for a parachute the game does not rate.
        parachuteFullDeployAltitude:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            The height above the ground or the sea at which an armed or semi-deployed
            parachute opens fully, the greatest when there are several, since that one
            opens first. Null when none is armed or semi-deployed, outside an
            atmosphere, and for a parachute the game does not report one for.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselLight:
      type: object
      description: |-
        Whether the active craft is in sunlight now, and the next two instants at
        which that changes, for a widget that warps to sunrise or sunset or plans
        around a night pass.

        The star counts as hidden when a body between it and the craft covers its
        centre. A craft in orbit is swept along its patched conic; a landed or
        splashed craft is carried round by its body's rotation. The instants are
        universal times, so they hold wherever they are read and need no reckoning
        between samples.

        Whenever no sound answer exists (an open orbit, an orbit of the star itself,
        no body table yet) the payload is absent or its instants are null with
        `VesselLight.basis` saying `withheld`, never a guess.
      required:
        - sweptToUt
        - basis
      properties:
        sunlit:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            True while the star is above the craft's horizon and no body covers it,
            false in shadow. Null when the geometry could not be solved this tick.
        nextSunriseUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The next universal time the craft leaves shadow, or null when it stays lit
            through `VesselLight.sweptToUt`, is lit now and no sunrise is predicted, or
            no prediction was made.
        nextSunsetUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The next universal time the craft enters shadow, or null when it stays lit
            through `VesselLight.sweptToUt` or no prediction was made.
        sweptToUt:
          type: number
          x-sitrep-unit: ut
          description: |-
            The last universal time the search reached. A null instant means no change
            before it.
        basis:
          type: string
          x-sitrep-unit: enum
          description: |-
            What the instants rest on: `orbit` (the craft swept along its orbit),
            `surface` (the craft carried round by its body's rotation) or `withheld` (no
            sound prediction, so both instants are null).
    VesselManeuver:
      type: object
      description: |-
        The active vessel's planned burns. `VesselManeuver.nodes` is always an
        array, empty when no burn is queued, never null.

        `VesselManeuver.nodes` is ordered by execution, earliest `ManeuverNode.ut`
        first, and that order is the plan: burn N is flown after burn N-1 and acts
        on what burn N-1 left behind. There is no ordinal or predecessor field;
        array position says it. The per-burn patch chain expresses the same linkage
        again, in a form only a patched-conic planner can produce; see
        `ManeuverNode.patches`.
      required:
        - nodes
        - meta
      properties:
        nodes:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/ManeuverNode"
            - $ref: "#/components/schemas/LockedValue"
          description: |-
            Every queued burn, earliest `ManeuverNode.ut` first. Empty when none is
            queued, never null. A `LockedValue` while the Tracking Station does not show
            patched conics, since a craft then carries no solver to hold a node.
        planner:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The id of the maneuver-plan provider in use, or null when there is no
            planner at all.

            Null is not the same as an empty plan, and stock reaches it on its own: an
            un-upgraded Tracking Station leaves the craft with no solver, so an
            early-career craft cannot hold a plan at all. Both arrive as `Nodes: []`,
            and this field tells "cannot plan" from "nothing planned".

            Test only whether it is null. The value is for naming the provider in a
            readout or a diagnostic, never for special-casing one.
        meta:
          description: The payload's provenance (`"vessel:<guid>"` or `"game"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselOrbit:
      type: object
      description: |-
        The active vessel's orbital elements. Elements are the cause; every
        kinematic quantity (position, velocity, apsides, anomalies, period) is
        derived by the consumer at its view UT through the propagation capability,
        and is not streamed here. The one exception is the pair of apsis countdowns
        under physics, `VesselOrbit.timeToAp` and `VesselOrbit.timeToPe`.

        The apoapsis and periapsis altitudes are on the current patch,
        `patches[0].apA` and `patches[0].peA`, in metres above the body's mean
        radius.

        Units: `VesselOrbit.sma` in metres; `VesselOrbit.inc`, `VesselOrbit.lan` and
        `VesselOrbit.argPe` in degrees; and `VesselOrbit.meanAnomalyAtEpoch` in
        radians. The degrees/radians split is KSP's own and is kept so every value
        matches KSP's `Orbit`.

        A coast moves only `VesselOrbit.meanAnomalyAtEpoch` and `VesselOrbit.epoch`,
        by Kepler propagation; the other elements are constants of the orbit. A burn
        moves every element, by powered integration from `vessel.propulsion`, the
        firing stage's propellant in `dv.stages` and `trackingStation.bodies`. A
        reckoning's `modelled` list says which paths its model moved, and a consumer
        wanting a whole modelled orbit overlays those on the observed payload.
      required:
        - referenceBodyIndex
        - sma
        - ecc
        - inc
        - meanAnomalyAtEpoch
        - epoch
        - mu
        - patches
        - horizon
        - meta
      properties:
        referenceBodyIndex:
          type: number
          x-sitrep-unit: id
          description: Index into `trackingStation.bodies` of the body this orbit is around.
        sma:
          type: number
          x-sitrep-unit: m
          description: Semi-major axis, in metres.
        ecc:
          type: number
          x-sitrep-unit: "1"
          description: |-
            Eccentricity. Below 1 for a closed orbit, 1 or above for an escape
            trajectory.
        inc:
          type: number
          x-sitrep-unit: °
          description: Inclination, in degrees (KSP's `Orbit.inclination`).
        lan:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Longitude of ascending node, degrees; `null` only when absent, never NaN and
            never 0 as a stand-in. An equatorial orbit still has one.
        argPe:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Argument of periapsis, degrees; `null` only when absent, never NaN and never
            0 as a stand-in. A circular orbit still has one.
        meanAnomalyAtEpoch:
          type: number
          x-sitrep-unit: rad
          description: |-
            Mean anomaly at `VesselOrbit.epoch`, in radians, not degrees, matching KSP's
            `Orbit.meanAnomalyAtEpoch`. Reckonable by Kepler propagation, from
            `VesselOrbit.sma`, `VesselOrbit.mu`, `VesselOrbit.horizon` and
            `trackingStation.bodies`, and under a burn by powered integration with the
            other elements.
        epoch:
          type: number
          x-sitrep-unit: ut
          description: |-
            The reference epoch of `VesselOrbit.meanAnomalyAtEpoch`, as a universal time
            in seconds (KSP's `Orbit.epoch`). Reckonable with
            `VesselOrbit.meanAnomalyAtEpoch` by the same model.
        mu:
          type: number
          x-sitrep-unit: m³/s²
          description: |-
            The reference body's standard gravitational parameter (GM), so the elements
            propagate without a separate body lookup.
        timeToAp:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            Seconds from this sample's `validAt` until the craft next reaches apoapsis
            on the orbit these elements describe, as KSP computes it (`Orbit.timeToAp`).
            Carried only while the craft is under physics (`meta.quality` `Loaded`): on
            rails the same figure follows exactly from the elements, and the field is
            null. Also null on a hyperbolic orbit, which has no apoapsis. Never a
            sentinel in place of null.

            True at `validAt`. A client at a later instant subtracts the elapsed time,
            wrapping by the period once the apsis has passed.
        timeToPe:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            Seconds from this sample's `validAt` until the craft next reaches periapsis,
            as KSP computes it (`Orbit.timeToPe`). Carried under the same rule as
            `VesselOrbit.timeToAp`: only while `meta.quality` is `Loaded`, null on
            rails. On a hyperbolic orbit it is null once the periapsis has been passed,
            since there is no next one. Never a sentinel in place of null.
        encounter:
          oneOf:
            - $ref: "#/components/schemas/OrbitEncounter"
            - $ref: "#/components/schemas/LockedValue"
            - type: "null"
          description: |-
            The next sphere-of-influence transition on the current trajectory. Null when
            there is none (the common case), never a sentinel. A `LockedValue` while the
            Tracking Station does not show patched conics, since the game then computes
            no transition at all.
        patches:
          type: array
          items:
            $ref: "#/components/schemas/OrbitPatch"
          description: |-
            The vessel's future-orbit patch chain. Element 0 is the current patch (the
            same elements as the fields above, restated in `OrbitPatch`'s shape so a
            client walks one list), followed by any later sphere-of-influence patches
            KSP's patched-conic solver has already resolved. Always an array, empty
            rather than null when there is no chain.
        horizon:
          description: |-
            How far ahead these elements may be propagated before they stop being
            trustworthy. Never null: a producer that does not state a horizon leaves it
            `PropagationHorizonKind.Unspecified`, which reads as unpropagatable.

            A client cannot compute this: it depends on the perturbation environment
            (which bodies are near, how massive, how far), so it arrives on the sample.
            It rides here, beside the elements, because a horizon and the elements it
            bounds share one `validAt`; carried separately, a client could hold one
            sample's elements beside another's horizon.
          allOf:
            - $ref: "#/components/schemas/PropagationHorizon"
        meta:
          description: |-
            Payload provenance. `Source` is `"vessel:<guid>"` for the active vessel;
            `Quality` is `Loaded` under physics and `OnRails` otherwise.
          allOf:
            - $ref: "#/components/schemas/OrbitPayloadMeta"
    VesselOrbitTruth:
      type: object
      description: |-
        KSP's own maintained state vector for the active vessel (`Orbit.pos` and
        `Orbit.vel`), relative to the body it orbits. Read `vessel.orbit` for
        altitude and velocity.

        Absent when the state vector or the frame flag could not be read.

        `VesselOrbitTruth.frameRotating` says which frame the vectors are in, and a
        comparison must gate on it. When it is false they are in the fixed,
        non-rotating frame the orbital elements are defined against, and are
        directly comparable to a Kepler propagation of those elements. When it is
        true (KSP switches to this below a body's `inverseRotThresholdAltitude`: low
        orbit, atmospheric flight, landed) they are in a frame co-rotating with the
        body's spin, and differ from a fixed-frame propagation by a rotation about
        the polar axis that grows with time.
      required:
        - position
        - velocity
        - frameRotating
        - meta
      properties:
        position:
          type: object
          description: |-
            Position in metres relative to the body the vessel orbits, KSP's
            `Orbit.pos`, in the frame `VesselOrbitTruth.frameRotating` names.

            To check element-to-position math, compare against the reported value, never
            a reckoned one: reckoning applies the same Kepler propagator being checked,
            so it agrees with itself by construction.
          required:
            - x
            - y
            - z
          properties:
            x: &a5
              type: number
              x-sitrep-unit: m
            y: *a5
            z: *a5
        velocity:
          type: object
          description: |-
            Velocity in m/s relative to the body the vessel orbits, KSP's `Orbit.vel`,
            in the frame `VesselOrbitTruth.frameRotating` names.
          required:
            - x
            - y
            - z
          properties:
            x: &a6
              type: number
              x-sitrep-unit: m/s
            y: *a6
            z: *a6
        frameRotating:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            The reference body's `CelestialBody.inverseRotation`: true when
            `VesselOrbitTruth.position` and `VesselOrbitTruth.velocity` are in a frame
            co-rotating with the body, false when they are in the fixed inertial frame.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselPart:
      type: object
      description: |-
        One part in the `VesselParts.parts` tree. `VesselPart.id`,
        `VesselPart.name`, `VesselPart.position`, `VesselPart.dryMass`,
        `VesselPart.inverseStage` and `VesselPart.maxTemp` are always present;
        `VesselPart.parentId` (null for the root), `VesselPart.up`, the current and
        skin temperatures (unset before physics runs) and
        `VesselPart.fuelLineTargetId` are nullable.

        **Join key.** `VesselPart.id` is `Part.flightID` as a string, the same form
        the `partId` of `parts.power` and `parts.robotics` uses, so a part can be
        joined across those channels. `VesselPart.parentId` and
        `VesselPart.fuelLineTargetId` use the same form. Whether a flightID survives
        docking and undocking is up to KSP.
      required:
        - id
        - name
        - title
        - position
        - bounds
        - category
        - modules
        - isPowerRelated
        - resources
        - moduleStates
        - actionBindings
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            `Part.flightID` as a string: the join key within the tree and across
            channels. Empty only when KSP has not yet assigned a flight id (its
            uninitialised 0).
        parentId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The parent part's `flightID` as a string; `null` for the root part.
        name:
          type: string
          x-sitrep-unit: text
          description: |-
            `Part.partInfo.name` (the `AvailablePart.name` config id, e.g.
            `"solarPanels1"`).
        title:
          type: string
          x-sitrep-unit: text
          description: |-
            `Part.partInfo.title` (the display title, e.g. `"OX-STAT Photovoltaic
            Panels"`).
        position:
          type: object
          description: |-
            `Part.orgPos`: the part's original vessel-local position (metres, vessel
            frame).
          required:
            - x
            - y
            - z
          properties:
            x: &a7
              type: number
              x-sitrep-unit: m
            y: *a7
            z: *a7
        up:
          type:
            - object
            - "null"
          description: |-
            The part's local up axis (`Part.orgRot * Vector3.up`), for orienting flow or
            thrust glyphs, as a unit vector in the vessel's frame. `null` when absent.
          required:
            - x
            - y
            - z
          properties:
            x: &a8
              type: number
              x-sitrep-unit: "1"
            y: *a8
            z: *a8
        bounds:
          description: The part's bounding box, in the part's own frame. Always present.
          allOf:
            - $ref: "#/components/schemas/PartBounds"
        dryMass:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: "`Part.mass`: dry mass (tonnes). Null when it could not be read."
        inverseStage:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            `Part.inverseStage`, in KSP's own inverted staging numbering, unchanged; see
            `VesselStructure.currentStage`. Null when it could not be read.
        maxTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            `Part.maxTemp`: internal max temperature (K). Null when it could not be
            read.
        skinMaxTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            `Part.skinMaxTemp`: maximum skin temperature (K); `null` where KSP reports
            `-1`, no skin-thermal model.
        currentTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            `Part.temperature`: current internal temperature (K); `null` where KSP
            reports `-1`, not yet simulated.
        skinTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            `Part.skinTemperature`: current skin temperature (K); `null` when absent,
            such as before physics runs.
        category:
          type: string
          x-sitrep-unit: text
          description: |-
            `Part.partInfo.category` (`PartCategories` enum name, e.g. `"Engine"`). A
            display label; see `VesselPart.categoryOrdinal`.
        categoryOrdinal:
          description: |-
            `VesselPart.category`'s KSP ordinal, typed to `KspPartCategory`.

            Classify by this rather than by `VesselPart.category`'s name, which is a
            display label and changes if KSP renames a member.

            `null` when the part had no `partInfo` to read, the same case that leaves
            `VesselPart.category` empty. `PartCategories.none` is `-1` and is a real
            value, not an absence.
          anyOf:
            - $ref: "#/components/schemas/KspPartCategory"
              x-sitrep-unit: enum
            - type: "null"
        modules:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            Each `PartModule`'s CLR class name (e.g. `"ModuleEngines"`,
            `"CModuleFuelLine"`), which is what a client classifies a part by.
        isRobotics:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            `Part.isRobotic()`: a Breaking Ground robotic servo part. Null when it could
            not be read.
        isPowerRelated:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when the part carries a solar panel, alternator, EC-producing
            converter, or an ElectricCharge resource capacity.
        fuelLineTargetId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            For a fuel-line part, the flight id, as a string, of the part it feeds;
            `null` otherwise.
        resources:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PartResourceFlow"
          description: |-
            Every resource this part carries, keyed by resource name (e.g.
            `"ElectricCharge"`): storage plus live production or consumption. Empty when
            the part carries no resources.
        moduleStates:
          type: array
          items:
            $ref: "#/components/schemas/PartModuleState"
          description: |-
            Per-module behavioural state (solar panel deployed, engine firing, parachute
            waiting to deploy, and so on): one entry per module on the part that maps to
            `PartModuleState`'s vocabulary, in `Part.Modules` order. Empty when the part
            carries no module of a mapped type.
        actionBindings:
          type: array
          items:
            $ref: "#/components/schemas/ActionBinding"
          description: |-
            Action-group bindings on this part: one entry per bound part action
            (`ActionBinding.action` = `BaseAction.guiName`, and the named groups its
            `BaseAction.actionGroup` Flags bitmask decodes to). Per action, not per
            part. Empty when no action on the part is bound to any group. Derive an
            action group's human-readable caption from this.
    VesselParts:
      type: object
      description: |-
        The active vessel's full part tree, with each part's position, mass,
        temperatures, resources, module states and action-group bindings. A single
        object, or `null` when there is no active vessel.

        Per-part temperatures ride each `VesselPart` (`VesselPart.currentTemp`,
        `VesselPart.maxTemp`, `VesselPart.skinTemp`, `VesselPart.skinMaxTemp`), so a
        hottest-part, engine or heat-shield rollup can be derived from this channel.
        `vessel.thermal` carries a ready-made hottest-part rollup.
      required:
        - parts
        - meta
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/VesselPart"
          description: |-
            Every part on the active vessel this tick, in vessel part-list order. Always
            present (possibly empty); a tick with no vessel yields a `null` payload, not
            an empty list.
        meta:
          description: The payload's provenance, always `"vessel:<guid>"` for the active vessel.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselPhysicsMode:
      type: object
      description: |-
        The active vessel's physics regime (`PhysicsMode`). Delayed like every other
        vessel-derived channel: it describes the vessel itself, so the ground learns
        about it at UT+delay, not as a ground-side fact. Absent when there is no
        active vessel.
      required:
        - mode
        - meta
      properties:
        mode:
          description: The active vessel's physics regime.
          allOf:
            - $ref: "#/components/schemas/PhysicsMode"
              x-sitrep-unit: enum
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselPropulsion:
      type: object
      description: |-
        The active vessel's mass and thrust, the inputs to thrust-to-weight and
        burn-time figures. Mass is in tonnes and thrust in kN, so `thrust / (mass ·
        g)` is a thrust-to-weight ratio directly.

        TWR, maximum TWR and a vessel-level burn-time estimate are derived by the
        client from these fields, and are not streamed here.
      required:
        - totalMass
        - dryMass
        - currentThrust
        - availableThrust
        - meta
      properties:
        totalMass:
          type: number
          x-sitrep-unit: t
          description: |-
            The vessel's total mass including resources, in tonnes (KSP's
            `Vessel.totalMass`).
        dryMass:
          type: number
          x-sitrep-unit: t
          description: |-
            The vessel's mass without resources, in tonnes: the sum of every part's
            `Part.mass`.
        currentThrust:
          type: number
          x-sitrep-unit: kN
          description: |-
            The thrust every engine on the vessel is producing now, in kN (the sum of
            `ModuleEngines.finalThrust`). Zero when nothing is firing.
        availableThrust:
          type: number
          x-sitrep-unit: kN
          description: |-
            The thrust the vessel can produce right now, in kN: the maximum thrust
            (`ModuleEngines.GetMaxThrust`) of every engine that is ignited and not
            flamed out. A shut-down or flamed-out engine contributes nothing, so this is
            not the vessel's rated maximum.
        massFlow:
          type:
            - number
            - "null"
          x-sitrep-unit: kg/s
          description: |-
            The propellant every running engine is drawing now, in kg/s: the sum of each
            ignited, unflamed engine's `ModuleEngines.requestedMassFlow`, scaled by the
            share of that request its tanks met (`propellantReqMet`). Zero when nothing
            is firing.

            With `VesselPropulsion.currentThrust` and `VesselPropulsion.totalMass` this
            is the whole of a burn's mass budget: the vessel's mass at a later instant
            is the mass now less this rate over the interval, so a burn can be carried
            forward with its rising acceleration rather than a constant one.

            Null when the engines cannot be read: an on-rails or packed craft has no
            running modules to sum, and a zero there would claim the engines are cold.
        thrustStartedUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            UT the craft's current continuous period of thrust began, or null when it is
            not under thrust as of the last measurable reading.

            **An observation instant.** It says when something was seen to be true,
            which is a different kind of UT from a plan's `ManeuverNode.Ut` or an
            orbit's `epoch`, although all three carry the same unit. Subtracting this
            from a planned instant compiles and means nothing; measure a duration from
            it only against the client's own view clock.

            It is repeated on every frame until it changes, not sent once when thrust
            starts, so a client that missed a frame still sees it.

            Held, not cleared, while thrust is unmeasurable (an on-rails or packed craft
            has no parts to read). Otherwise switching away from a burning craft would
            read as its engines quitting.
        lastThrustEndUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            UT the craft's most recent period of thrust ended, or null when no period of
            thrust has been observed to end since this craft became the subject. Same
            observation-instant reading as `VesselPropulsion.thrustStartedUt`.

            Set here with a null `VesselPropulsion.thrustStartedUt`, it says the engines
            ran and have stopped, which no other field can say.
            `VesselPropulsion.currentThrust` at zero reads the same for a craft that
            never lit, and `vessel.control.throttle` is where the pilot left the lever,
            which stays at full through a flameout, a dry tank and an unlit stage.

            It does not say why the engines stopped, and no reading can. A burn paused
            to be re-planned and a burn abandoned produce the same instant, because the
            difference between them is whether the operator comes back, which has not
            happened yet. A consumer may report that thrust ceased with delta-v owed; it
            may not report a shortfall.
        meta:
          description: Payload provenance. `Source` is `"vessel:<guid>"` for the active vessel.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselResources:
      type: object
      description: |-
        What the active vessel carries, keyed by resource name, each with its
        current amount and capacity. Every message holds the whole map. No value is
        ever a sentinel such as `-1`.

        Only these stock resources are reported: `LiquidFuel`, `Oxidizer`,
        `SolidFuel`, `MonoPropellant`, `ElectricCharge`, `XenonGas`, `Ore` and
        `Ablator`.

        **Absence.**

        - **Key absent** from `VesselResources.resources`: structural: this vessel
          does not carry the resource at all (its capacity is zero). Changes only on
          staging/docking.
        - **Key present, `{current: 0, max: > 0}`**, carried but currently empty (a
          real, meaningful reading, not an error).
        - **Whole channel absent**: no vessel at all, the same convention as every
          other `vessel.*` channel.

        Because every emission is the full map (the channel carries the whole map,
        never a delta), a key disappearing between two emissions is itself a real
        structural statement (the vessel stopped carrying that resource, e.g. a tank
        was staged away), never an ambiguous "did it change or did the stream just
        drop it".

        Carries amounts only, no flow or rate: a vessel-total flow would be a number
        that is not the game's own.
      required:
        - resources
        - meta
      properties:
        resources:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ResourceAmount"
          description: |-
            A map keyed by KSP resource name (e.g. `"LiquidFuel"`): enumerate the keys
            rather than reaching for one you expect. Empty, never null, for a vessel
            carrying none of the reported resources.
        meta:
          description: "Provenance: `\"vessel:<guid>\"` for the vessel the amounts belong to."
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselStructure:
      type: object
      description: |-
        The active vessel's stage and part counts. Absent when there is no active
        vessel.

        `VesselStructure.currentStage` uses KSP's own staging numbering unchanged,
        which runs inverted relative to the staging list as drawn: this contract
        does not renumber it. The part tree itself is on `vessel.parts`.
      required:
        - currentStage
        - meta
      properties:
        currentStage:
          type: number
          x-sitrep-unit: id
          description: |-
            KSP's own `Vessel.currentStage` numbering (capsule and upper stages have low
            numbers); see the class doc comment.
        stageCount:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Number of stages: the highest `Part.inverseStage` on the vessel plus one.
            Null when the vessel has no parts this tick.
        partCount:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Number of parts on the vessel. Null when the vessel's part list could not be
            read this tick.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselSurface:
      type: object
      description: |-
        Surface data a landing widget needs that `vessel.flight` doesn't already
        carry. `vessel.flight.AltitudeTerrain` is the height of the vessel's root
        part above the terrain; `VesselSurface.heightFromTerrain` is the height of
        the vessel's lowest point, the number a landing-gear or suicide-burn readout
        cares about. The two differ by how far the vessel reaches below its root.

        Whole-channel absence means the vessel has no reference body yet. The
        channel is present in every situation, orbiting included.
      required:
        - meta
      properties:
        biome:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's biome name at the vessel's current lat/long (e.g. "Highlands",
            "Shores"). Null when the body has no biome map (e.g. gas giants) or the
            lookup failed this tick.
        landedAt:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The named launch/landing site the vessel is currently at (e.g.
            "KSC_LaunchPad", "Runway"), null when landed/splashed somewhere with no
            named site, or when not landed/splashed at all.
        heightFromTerrain:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Metres from the vessel's lowest point down to the terrain, never below 0.
            Null whenever KSP did not measure the terrain beneath the vessel this tick:
            its terrain raycast found nothing below, or the vessel is packed or unloaded
            and KSP is holding an earlier value.
        meta:
          description: Payload provenance. `Source` is `"vessel:<guid>"` for the active vessel.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselTarget:
      type: object
      description: |-
        The active vessel's current target only.
        `VesselTarget.relativePosition`/`VesselTarget.relativeVelocity` both use the
        one `Vec3` shape.

        `VesselTarget.orbit` reuses `VesselOrbit` itself (not a separate "target
        orbit" shape), so a client propagates a target the same way as the active
        vessel, at the same time. Its nested `VesselTarget.meta` is stamped with the
        same subject (the active vessel producing this sample), not the target's;
        `VesselTarget.vesselId` and `VesselTarget.bodyIndex` carry the target's own
        identity.

        A null payload means nothing is targeted, the common case, never a
        zero-distance or zero-vector record.
      required:
        - name
        - kind
        - meta
      properties:
        name:
          type: string
          x-sitrep-unit: text
          description: |-
            The target's name as KSP gives it (`ITargetable.GetName()`). Empty string
            when none was read.
        kind:
          description: What kind of thing is targeted. Never `TargetKind.Position`.
          allOf:
            - $ref: "#/components/schemas/TargetKind"
              x-sitrep-unit: enum
        vesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The target's own stable id, populated when `VesselTarget.kind` is
            `TargetKind.Vessel` (KSP's `Vessel.id` guid) or `TargetKind.Part` (the
            owning vessel's guid). The same opaque id `trackingStation.catalog`' roster
            and `SetTargetArgs.vesselId` use, so a widget can hand it straight back into
            a re-target command with no extra lookup. Null for a body or other target;
            see `VesselTarget.bodyIndex` for the body case.
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            The target's `trackingStation.bodies` index, populated only when
            `VesselTarget.kind` is `TargetKind.Body`, matching
            `SetTargetArgs.bodyIndex`. Null for any other target, or when the body name
            could not be resolved against `trackingStation.bodies` this tick.
        partId:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            The target part's KSP `Part.flightID`: populated only when
            `VesselTarget.kind` is `TargetKind.Part` (a docking port), scoped by
            `VesselTarget.vesselId` (which carries the owning vessel's guid in the Part
            case). Null for every other kind. A widget reads this pair straight off
            `vessel.target` and hands it back into `SetTargetArgs.partId` to re-target
            the same port.
        relativePosition:
          type:
            - object
            - "null"
          description: |-
            The target's position relative to the active vessel, in metres. Null only
            when the transform data needed to compute it was not available this tick.
          required:
            - x
            - y
            - z
          properties:
            x: &a9
              type: number
              x-sitrep-unit: m
            y: *a9
            z: *a9
        relativeVelocity:
          type:
            - object
            - "null"
          description: |-
            The target's velocity relative to the active vessel, in m/s. Null (never
            `(0,0,0)`) when the transform data needed to compute it was not available
            this tick.
          required:
            - x
            - y
            - z
          properties:
            x: &a10
              type: number
              x-sitrep-unit: m/s
            y: *a10
            z: *a10
        orbit:
          description: |-
            The target's orbit. Null when the target has no orbit (it is landed, say, or
            its orbit could not be resolved this tick).
          anyOf:
            - $ref: "#/components/schemas/VesselOrbit"
            - type: "null"
        closestApproach:
          description: |-
            Next closest approach, from the orbit model in use. Null when there is no
            encounter to report; see `ClosestApproach`.
          anyOf:
            - $ref: "#/components/schemas/ClosestApproach"
            - type: "null"
        meta:
          description: |-
            The payload's provenance, stamped with the active vessel
            (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselThermal:
      type: object
      description: |-
        The active vessel's thermal rollup, its hottest part, heat shield and
        engine. Each ratio is null when no part had a valid maximum temperature this
        tick, never 0, so "no valid part" and "coldest possible part" stay distinct.

        The whole payload is null when the vessel has no parts at all, a different,
        coarser absence than an individual null ratio. For every part's temperatures
        rather than a rollup, see `vessel.parts`.
      required:
        - meta
      properties:
        maxSkinTempRatio:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            The highest skin-temperature ratio (`skinTemperature / skinMaxTemp`) of any
            part this tick; 1 is at the limit. Not necessarily
            `VesselThermal.hottestPart`'s. Null when no part had a valid (> 0)
            `skinMaxTemp`, never 0.
        maxInternalTempRatio:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            The highest internal-temperature ratio (`temperature / maxTemp`) of any part
            this tick, which is `VesselThermal.hottestPart`'s; 1 is at the limit. Null
            when no part had a valid (> 0) `maxTemp`, never 0.
        hottestPart:
          description: |-
            The part with the highest internal-temperature ratio. Null when no part
            qualified, the same condition as a null
            `VesselThermal.maxInternalTempRatio`.
          anyOf:
            - $ref: "#/components/schemas/ThermalHottestPart"
            - type: "null"
        heatShieldTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            Hottest heat-shield part's internal temperature (K, raw: the part carrying a
            `ModuleAblator`, `Part.temperature`). Null when the vessel carries no
            ablative heat shield this tick.
        heatShieldFlux:
          type:
            - number
            - "null"
          x-sitrep-unit: kW
          description: |-
            The same heat shield's ablative heat flux (`ModuleAblator.flux`, kW). Null
            when the vessel carries no ablative heat shield this tick.
        hottestEngineTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            Internal temperature (K) of whichever part carrying a `ModuleEngines` or
            `ModuleEnginesFX` module has the highest internal-temperature ratio. Null
            when the vessel carries no engine part with a valid `maxTemp` this tick.
        hottestEngineMaxTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            That same engine part's max internal temperature (K, raw). Null under the
            same no-engine-parts condition as `VesselThermal.hottestEngineTemp`.
        hottestEngineTempRatio:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            That same engine part's internal-temperature ratio (`temperature /
            maxTemp`). Null under the same no-engine-parts condition as
            `VesselThermal.hottestEngineTemp`.
        anyEnginesOverheating:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            True when any engine part's internal-temperature ratio is at or above 0.9.
            False, not null, whenever the vessel has an engine part and none crosses it;
            null only alongside a null `VesselThermal.hottestEngineTempRatio`, when no
            engine part with a valid `maxTemp` was found this tick.
        meta:
          description: The payload's provenance, `"vessel:<guid>"` for the active vessel.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselType:
      type: integer
      description: |-
        A vessel's type, KSP's `Vessel.vesselType` (the `VesselType` enum), with the
        same member names. `VesselType.Unknown` is both KSP's own `Unknown` type and
        the value for a type this contract does not recognise.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Ship
          description: A crewed or general-purpose ship.
        - const: 1
          title: Station
          description: A space station.
        - const: 2
          title: Lander
          description: A lander.
        - const: 3
          title: Probe
          description: An uncrewed probe.
        - const: 4
          title: Rover
          description: A rover.
        - const: 5
          title: Base
          description: A surface base.
        - const: 6
          title: Relay
          description: A communications relay.
        - const: 7
          title: EVA
          description: A kerbal on EVA.
        - const: 8
          title: Flag
          description: A planted flag.
        - const: 9
          title: Debris
          description: Debris, such as a spent stage or a jettisoned fairing.
        - const: 10
          title: SpaceObject
          description: An asteroid or comet.
        - const: 11
          title: DeployedScienceController
          description: A deployed science station's central control unit (Breaking Ground).
        - const: 12
          title: DeployedSciencePart
          description: |-
            A deployed science experiment or power part other than the controller
            (Breaking Ground).
        - const: 13
          title: DroppedPart
          description: A part dropped from a vessel, such as a piece of ground equipment.
        - const: 14
          title: Unknown
          description: KSP's own unknown type, or a type this contract does not recognise.
    WarpMode:
      type: integer
      description: |-
        KSP's time-warp mode, mirroring its `TimeWarp.Modes` enum, which has only
        `HIGH` and `LOW`. `WarpMode.Unknown` covers a raw value KSP reports that
        neither matches.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: High
          description: On-rails time warp (KSP's `HIGH` mode).
        - const: 1
          title: Low
          description: Physics warp (KSP's `LOW` mode).
        - const: 2
          title: Unknown
          description: KSP reported a mode this contract does not know.
    WarpState:
      type: object
      description: |-
        The game's time-warp and pause state, as separate typed fields.

        Current UT is not a field here, nor on any other Topic of the wire contract:
        `meta.validAt` stamps every sample with the UT it describes, so the current
        UT is the `meta.validAt` of the newest frame.

        Warp and pause are game-wide state, not a craft's: the payload's
        `meta.source` is `"game"` rather than `"vessel:<guid>"`, and the Topic emits
        at the Space Center and Tracking Station as well as in flight, with or
        without an active vessel.
      required:
        - warpRate
        - warpRateIndex
        - warpMode
        - paused
        - keyframeFloorSec
        - sampleIntervalUt
        - meta
      properties:
        warpRate:
          type: number
          x-sitrep-unit: "1"
          description: |-
            The current time-warp multiplier (KSP's `TimeWarp.CurrentRate`): `1` is real
            time, `1000` is game time passing a thousand times faster. A pure ratio, so
            its unit is the dimensionless `"1"`.
        warpRateIndex:
          type: number
          x-sitrep-unit: id
          description: |-
            The current rung (one step) of the warp rate table (KSP's
            `TimeWarp.CurrentRateIndex`), `0` at real time. Under `WarpMode.High` it
            indexes `WarpState.warpRates`.
        warpMode:
          description: |-
            Which warp mode is in force, on-rails or physics (KSP's
            `TimeWarp.WarpMode`).
          allOf:
            - $ref: "#/components/schemas/WarpMode"
              x-sitrep-unit: enum
        paused:
          type: boolean
          x-sitrep-unit: flag
          description: Whether the game is paused (KSP's `FlightDriver.Pause`).
        warpRates:
          type:
            - array
            - "null"
          items:
            type: number
            x-sitrep-unit: "1"
          description: |-
            What every on-rails warp rung of this install actually runs at, indexed by
            `WarpState.warpRateIndex`, so `warpRates[i]` is the multiplier
            `time.setWarpIndex` (`SetWarpIndexArgs`) with `index = i` produces. Null
            when the game has no warp controller to read it off (no scene that can
            warp).

            The table is configuration, not a constant: Kopernicus and RealSolarSystem
            both republish it, so a rung stock runs at 100x may run at 10000x on another
            install. Read the rate here rather than assuming stock's table.
        keyframeFloorSec:
          type: number
          x-sitrep-unit: s
          description: |-
            The shortest real time the mod leaves between two periodic keyframes on one
            channel, in seconds. A keyframe is a full sample sent on a schedule even
            when nothing changed, so a client can tell a quiet channel from a dead one.

            Keyframe cadences are declared in UT, and under warp UT can pass a cadence
            on every tick, so the mod also waits at least this long in real time. The
            gap a client sees between two keyframes of a quiet channel is therefore at
            least `keyframeFloorSec × warpRate` UT. A client that judges how current a
            channel is from the gap between its keyframes should allow for that much.
        observationQuantumUt:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            The UT that actually passes between two samples at the current warp rate, in
            seconds, or `null` where the host did not report its physics step.

            Equal to `WarpState.sampleIntervalUt` up to 10x warp. Above that the mod
            samples at most ten times a real second, so this is the game time that
            passes in a tenth of a real second at the current rate (0.1 s x 100,000 =
            10,000 s at 100,000x), or one physics tick where a tick advances the game
            further than that. Nothing between two consecutive samples was observed, so
            a line drawn between two samples that differ would claim a path across this
            span that only a reckoner's model of the value (see the Reckoners page) can
            support. Two samples further apart than this are a channel that did not
            change in between.

            It changes only when the warp rate does. A client judging a gap reads the
            quantum in force when the later sample was taken.
        sampleIntervalUt:
          type: number
          x-sitrep-unit: s
          description: |-
            The UT between two samples while warp is not thinning them, in seconds: the
            finest spacing the record ever has, and `WarpState.observationQuantumUt` at
            1x. Constant for the life of the mod.

            The chord between two samples this far apart is the resolution every channel
            is sampled at, and a chart can draw it. Where the quantum is wider, the span
            beyond this is one the sampling skipped because of warp, and a line across
            it that no model of the value carries asserts a path nothing observed.
        meta:
          description: The payload's provenance (always `"game"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    WriteModSettingArgs:
      type: object
      description: |-
        Arguments to `settings.mod.write`: change one of a host mod's own settings
        through its Uplink, at once.

        Safe to send again: it sets the value named, so repeating one that already
        landed changes nothing.

        Refused, with nothing changed, when the Uplink lists no such setting, when
        the setting is not writable, when the value is not one its kind can hold, or
        when the Uplink refuses it. What the mod holds after any of those is on
        `settings.<uplink>`.
      required:
        - uplink
        - id
        - value
      properties:
        uplink:
          type: string
          x-sitrep-unit: id
          description: The Uplink the setting is read through.
        id:
          type: string
          x-sitrep-unit: id
          description: The setting, as `ModSettingRow.id` names it.
        value:
          type: string
          x-sitrep-unit: text
          description: The new value, spelled as `ModSettingRow.value` is.
