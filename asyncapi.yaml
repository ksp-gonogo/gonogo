    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.control.setLights"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.control.setLights"
  vessel.control.setRcs:
    address: vessel.control.setRcs
    description: |-
      Takes `SetEnabledArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      Args shared by every plain on/off actuation command (`setSas`, `setRcs`,
      `setGear`, `setBrakes`, `setLights`, `setAbort`): an absolute state to
      apply, never a toggle. Under light-time delay a toggle that arrives after
      unknown intervening changes would race them, so there are no toggle
      commands.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.control.setRcs"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.control.setRcs"
  vessel.control.setSas:
    address: vessel.control.setSas
    description: |-
      Takes `SetEnabledArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      Args shared by every plain on/off actuation command (`setSas`, `setRcs`,
      `setGear`, `setBrakes`, `setLights`, `setAbort`): an absolute state to
      apply, never a toggle. Under light-time delay a toggle that arrives after
      unknown intervening changes would race them, so there are no toggle
