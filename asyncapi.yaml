    action: receive
    channel:
      $ref: "#/channels/session"
    title: The greeting, the game state, the answer to a ping, and connection-scoped errors
    description: An `event` frame is not here. It names a topic and is sent only for a topic this connection has subscribed to, so it is on the topic channels beside their `stream-data`.
    tags:
      - name: session
    messages:
      - $ref: "#/channels/session/messages/hello"
      - $ref: "#/channels/session/messages/gameState"
      - $ref: "#/channels/session/messages/pong"
      - $ref: "#/channels/session/messages/error"
components:
  correlationIds:
    requestId:
      description: "A command and its answer are matched on `requestId`, not on order: responses may arrive in a different order from the commands, and a delayed command's answer can arrive minutes after it."
      location: $message.payload#/requestId
  messages:
    claim:
      name: claim
      title: Claim the answers to commands sent on an earlier connection
      payload:
        $ref: "#/components/schemas/ClaimRequest"
    commandAccepted:
      name: command-accepted
      title: The receipt for a delayed command, sent before its result
      payload:
        $ref: "#/components/schemas/CommandAccepted"
      correlationId:
        $ref: "#/components/correlationIds/requestId"
    commandGroup:
      name: command-group
      title: Send several delayed commands to one craft as a unit
      payload:
        $ref: "#/components/schemas/CommandGroupRequest"
    commandRequest.alarm.scet.arm:
      name: command-request
      title: Dispatch alarm.scet.arm
      contentType: application/json
      correlationId:
        $ref: "#/components/correlationIds/requestId"
      payload:
        description: The `command-request` envelope for `alarm.scet.arm`, with its typed `args`.
        allOf:
          - $ref: "#/components/schemas/CommandRequest"
          - properties:
              command:
                const: alarm.scet.arm
              args:
                $ref: "#/components/schemas/ScetAlarmArmArgs"
    commandRequest.alarm.scet.disarm:
      name: command-request
      title: Dispatch alarm.scet.disarm
      contentType: application/json
