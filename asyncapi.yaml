    subscribe:
      name: subscribe
      title: Open delivery on a topic
      payload:
        $ref: "#/components/schemas/Subscribe"
      examples:
        - name: open-vessel-flight
          summary: The first frame a client sends. Until it does the socket stays silent, and the mod answers this one with an `event` named `subscribed` on the `vessel.flight` channel.
          payload:
            type: subscribe
            topic: vessel.flight
    unsubscribe:
      name: unsubscribe
      title: Close delivery on a topic
      payload:
        $ref: "#/components/schemas/Unsubscribe"
  schemas:
    ActionBinding:
      type: object
      description: |-
        One action-group binding in `VesselPart.actionBindings`: a single part
        action and the named action groups it fires with. `ActionBinding.groups` are
        the `KSPActionGroup` enum member names (`SAS`/`RCS`/
        `Brakes`/`Gear`/`Light`/`Abort`/`Stage`/ `Custom01`...) the action's Flags
        bitmask decodes to (`None` excluded).
      required:
        - action
        - groups
        - groupsMask
      properties:
        action:
          type: string
          x-sitrep-unit: text
          description: |-
            The action's PAW label: `BaseAction.guiName` (e.g. "Toggle", "Extend
            Panel").
        groups:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            Named `KSPActionGroup` groups this action is bound to (e.g.
            `["SAS","Custom01"]`). Never empty: an action bound to no group is not
            emitted. Display labels, and possibly incomplete; see
            `ActionBinding.groupsMask`.
        groupsMask:
          type: number
          x-sitrep-unit: enum
          description: |-
            `BaseAction.actionGroup`'s raw `[Flags]` BITMASK, the whole of it.
            `KspActionGroup` names the bits.

            A mask rather than an ordinal because `KSPActionGroup` is a flags enum: one
            action can fire with several groups. Prefer it to `ActionBinding.groups`,
            which lists only the groups this build knows by name, so a group KSP adds is
            missing from the names but present in the mask.
    ActionGroupState:
      type: object
      description: |-
        One custom action group: its number, its display name and its live state.
        Stock KSP has ten anonymous custom groups; Action Groups Extended (AGX)
        gives the player up to 250 groups they name themselves ("Solar Panels",
        "Science Bay"), so identify a group by `ActionGroupState.index` and label it
        with `ActionGroupState.name`, never by its position in a list.

        Custom groups only. The stock singletons (SAS, RCS, Gear, Brakes, Lights,
        Abort) have their own `VesselControl` fields and their own commands
        (`vessel.control.setGear` and so on).
      required:
        - index
        - name
      properties:
        index:
          type: number
          x-sitrep-unit: id
          description: |-
            1-based group number: the same number `vessel.control.setActionGroup` takes.
            Stock KSP: 1..10 (`KSPActionGroup.Custom01..Custom10`). An AGX backend may
            report indices up to 250. Do not assume 10 groups, nor that the indices are
            dense or sorted.
        name:
          type: string
          x-sitrep-unit: text
          description: |-
            Human display name. Stock KSP has no per-group naming, so stock groups are
            named `"AG1".."AG10"`. With AGX installed, the player's own names.
        state:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the group is currently engaged. `null` means the backend knows this
            group exists (it has an index and a name) but could not read whether it is
            engaged: it does NOT mean the group is disengaged. Treating null as off
            draws an OFF toggle for a group whose state nobody knows, and toggling from
            that reading commands the wrong way.
    ActivateStrategyArgs:
      type: object
      description: |-
        `career.strategy.activate`'s args: the strategy's stable id plus the slider
        fraction to activate it at. `ActivateStrategyArgs.strategyId` is
        `StrategyConfig.Name` (e.g. `"OutsourceRnDStrategy"`): the same id
        `career.status` publishes for each strategy as `strategies[].id`, so a
        client activates using the id it read. `ActivateStrategyArgs.factor` is the
        0 to 1 slider fraction the strategy is committed at (its up-front funds,
        science and reputation cost scales with it); a strategy with no factor
        slider ignores it and activates at its fixed factor.
      required:
        - strategyId
        - factor
      properties:
        strategyId:
          type: string
          x-sitrep-unit: id
          description: |-
            The strategy to activate: its `StrategyConfig.Name`, as `career.status`'s
            `strategies[].id` carries it.
        factor:
          type: number
          x-sitrep-unit: ratio
          description: 0 to 1 slider fraction; ignored by strategies without a factor slider.
    AddManeuverNodeArgs:
      type: object
      description: |-
        `vessel.maneuver.add`'s args: a new manoeuvre node's time and its delta-v as
        named components in the node's own prograde, normal and radial-out frame,
        the same shape as `ManeuverNode`. Raw KSP `ManeuverNode.DeltaV` orders them
        `x = radialOut, y = normal, z = prograde`; the names here remove that
        ordering from the wire.

        The result is a `CommandResult<string>` whose `Payload` is the new node's
        opaque id, the same id `ManeuverNode.id` carries on `vessel.maneuver`. A
        client will not send the command if it would arrive at the craft at or after
        `AddManeuverNodeArgs.ut`.
      required:
        - ut
        - prograde
        - normal
        - radialOut
      properties:
        ut:
          type: number
          x-sitrep-unit: ut
          description: The node's time, in UT seconds.
        prograde:
          type: number
          x-sitrep-unit: m/s
          description: |-
            The delta-v component along the orbit's prograde direction at the node, in
            m/s.
        normal:
          type: number
          x-sitrep-unit: m/s
          description: The delta-v component along the orbit normal at the node, in m/s.
        radialOut:
          type: number
          x-sitrep-unit: m/s
          description: The delta-v component along the radial-out direction at the node, in m/s.
    AlternatorEntry:
      type: object
      description: |-
        One engine alternator module in the `parts.power` payload's `alternators`
        array. Every field is `null` when its value could not be read.
      properties:
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The part's display title (KSP's `Part.partInfo.title`), or its internal name
            when it has no part info.
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The part's `Part.flightID` as a string, the same join key as
            `SolarPanelEntry.partId`. Null when the part has no flight id yet.
        outputRate:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            The alternator's current electric-charge output (KSP's
            `ModuleAlternator.outputRate`), in EC per second.
    ArchiveEntry:
      type: object
      description: |-
        One entry in the `science.archive` channel payload: a single SUBJECT out of
        the whole-career R&D archive (`ResearchAndDevelopment.GetSubjects()`). That
        is every subject the career has ever collected or recovered, across every
        mission and every body, not scoped to the active vessel.

        The channel payload is a BARE ARRAY (`ArchiveEntry[]`), or `null` when the
        save has no R&D to walk (Sandbox mode). A save with R&D but nothing
        collected yet emits an EMPTY array, so an empty array and `null` mean
        different things here.

        Distinct from `ExperimentBreakdownEntry`: that one rolls up the ACTIVE
        VESSEL's currently stored results and is null with no vessel flying; this
        one is career-wide and streams at the Space Center with nothing flying at
        all.
      properties:
        subjectId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The subject's id (KSP's `ScienceSubject.id`, in the form
            `experimentId@BodySituationBiome`), unique within the array. Joins to
            `ExperimentEntry.subjectId` and `ExperimentBreakdownEntry.subjectId`.
        experimentId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: "The experiment id: the part of `ArchiveEntry.subjectId` before the `@`."
        experimentTitle:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The experiment's display title from R&D. Falls back to
            `ArchiveEntry.experimentId` when the experiment is no longer defined (for
            example a modded experiment that has been uninstalled).
        body:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The body the subject belongs to, parsed from `ArchiveEntry.subjectId` by
            KSP's `ScienceUtil.GetExperimentBodyName`.
        situation:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The situation part of `ArchiveEntry.subjectId` (a KSP `ExperimentSituations`
            name such as `SrfLanded`).
        biome:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The biome part of `ArchiveEntry.subjectId`.
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The subject's display title (KSP's `ScienceSubject.title`).
        science:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: Science banked for this subject so far.
        scienceCap:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: Max science this subject can ever yield.
        remainingPotential:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            Absolute science still recoverable from this subject (`scienceCap -
            science`).
        subjectValue:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Region multiplier KSP applies to this subject's yield.
    AstronautComplexInfo:
      type: object
      description: |-
        The `spaceCenter.astronautComplex` channel payload: the Astronaut Complex
        hire tab, the rolling pool of applicants the operator can recruit, plus the
        roster-cap context a hire is gated on.

        A wrapper object (not a bare array) because the applicant list rides
        alongside the facility-level cap and the current active-crew count, both of
        which the hire affordance needs: the current roster comes from the separate
        `spaceCenter.crewRoster` channel, this one carries the hire side. The whole
        payload is `null` in the SANDBOX / no-career / no-game case (no applicant
        pool exists), distinct from a career save whose pool is genuinely empty (a
        non-null payload with an empty `AstronautComplexInfo.applicants` list).

        Held at the home command, like `CrewRosterEntry`.
      required:
        - applicants
      properties:
        applicants:
          type: array
          items:
            $ref: "#/components/schemas/CrewRosterEntry"
          description: |-
            The hireable applicant pool (`KerbalRoster.Applicants`), sharing
            `CrewRosterEntry`'s full shape (with `CrewRosterEntry.situation` always
            `"Applicant"`) so the Astronaut Complex's applicant and active-crew rows
            render off one type. Always present (empty, never null) once the payload
            itself is non-null.
        activeCrew:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Current active (Crew-type) count (`KerbalRoster.GetActiveCrewCount`): the
            number counted against `AstronautComplexInfo.crewCapacity`. Null when the
            roster isn't queryable.
        crewCapacity:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Active-crew cap set by the Astronaut Complex facility tier
            (`GameVariables.GetActiveCrewLimit` over the facility's NORMALISED level). A
            hire is blocked once `AstronautComplexInfo.activeCrew` reaches it.
            `int.MaxValue` at the top facility tier (unlimited); preserved as-is on the
            wire, never clamped, so the client can render "unlimited". Null when the
            facility isn't queryable.
        nextHireCost:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            Funds cost to hire the next applicant (`GameVariables.GetRecruitHireCost`):
            one figure for the whole pool, the same for every applicant this tick and
            rising with the current roster size.
    AtmosphereEntry:
      type: object
      description: |-
        A body's atmosphere, present on a `BodyEntry` only when the body actually
        has one (null otherwise, never an all-null placeholder).
      properties:
        depth:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Atmosphere height, metres (`CelestialBody.atmosphereDepth`); null when
            absent.
        hasOxygen:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the atmosphere is breathable / oxygenated
            (`CelestialBody.atmosphereContainsOxygen`); null when absent.
        seaLevelPressure:
          type:
            - number
            - "null"
          x-sitrep-unit: kPa
          description: |-
            Sea-level pressure, kPa (`CelestialBody.atmospherePressureSeaLevel`); null
            when absent.
        pressureAltitudes:
          type:
            - array
            - "null"
          items:
            type: number
            x-sitrep-unit: m
          description: |-
            Altitudes of the `AtmosphereEntry.pressures` samples, metres above sea
            level, ascending from 0; null when the stream does not report a profile.
            Same length as `AtmosphereEntry.pressures`. Fixed for the session.

            Spacing is chosen per body rather than fixed, because the shape varies
            enormously: RSS Earth's table runs to 94 km and Saturn's to 1,270 km. Points
            are placed so that linear interpolation of log pressure between neighbouring
            samples stays within about 1% of the game's curve, up to 48 points per body.
            Interpolate in log pressure, not linearly.

            The table ends six decades below sea level, not at `AtmosphereEntry.depth`.
            Above that the game's own curve is a cubic plunging into a hard zero at the
            ceiling, which no interpolation in log space can follow and which carries no
            pressure worth stating. A consumer draws to the last sample and takes
            `AtmosphereEntry.depth` as where the air formally ends.
        pressures:
          type:
            - array
            - "null"
          items:
            type: number
            x-sitrep-unit: kPa
          description: |-
            Pressure at each `AtmosphereEntry.pressureAltitudes` entry, kPa, as the
            game's own `CelestialBody.GetPressure` returns it; null when the stream does
            not report a profile.

            Sampled rather than modelled because the exponential `P0·exp(-h/H)` a client
            can build from sea-level pressure and a scale height is not what KSP
            evaluates, and `CelestialBody` has no scale-height field to build it from. A
            body with `atmosphereUsePressureCurve` set follows a tabulated curve, as
            stock's own atmospheres and RealAtmospheres-style packs do; against the RSS
            Earth curve the exponential is out by a factor of sixteen at altitude. The
            sampled values are correct for stock and for any planet pack.

            Rounded to six significant figures. The curve path evaluates in float32
            inside Unity's own `AnimationCurve`, so more digits would be inventing
            precision, and six is far below the 1% spacing tolerance.
    BatteryEntry:
      type: object
      description: |-
        One electric-charge store in the `parts.power` payload's `batteries` array:
        every part with an `ElectricCharge` capacity above zero, so command pods and
        probe cores appear here as well as batteries. Every field is `null` when its
        value could not be read.
      properties:
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The part's display title (KSP's `Part.partInfo.title`), or its internal name
            when it has no part info.
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The part's `Part.flightID` as a string, the same join key as
            `SolarPanelEntry.partId`. Null when the part has no flight id yet.
        current:
          type:
            - number
            - "null"
          x-sitrep-unit: units
          description: Electric charge currently held in this part, in EC.
        max:
          type:
            - number
            - "null"
          x-sitrep-unit: units
          description: This part's electric-charge capacity, in EC.
    BodyEntry:
      type: object
      description: |-
        One celestial body in the `SystemBodies` tree: an explicit parent-index
        tree, with null rather than a numeric sentinel for any missing value. There
        is no eccentric anomaly field; solve it from `BodyEntry.orbit` at the time
        you need it.
      required:
        - index
        - horizon
      properties:
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: Body name (e.g. "Kerbin"); null when the game has not populated it.
        index:
          type: number
          x-sitrep-unit: id
          description: |-
            This body's position in the list, stable for the session and the key
            `BodyEntry.parentIndex` and `VesselRosterEntry.bodyIndex` refer to. Never
            null.
        parentIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index of the body this one orbits; null only for the root star, never a
            sentinel like -1.
        radius:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Mean radius, metres; null when the game does not have it yet (never 0 or -1
            as a stand-in).
        orbit:
          description: |-
            Orbital elements about the parent body; null only for the root star, which
            has no parent to orbit.
          anyOf:
            - $ref: "#/components/schemas/OrbitEntry"
            - type: "null"
        horizon:
          description: |-
            How far `BodyEntry.orbit` may be carried forward, and what kind of
            prediction that is. Never null, and the same `PropagationHorizon` a craft's
            elements carry: `UntilUt` is an absolute UT here exactly as it is there.

            **Under stock this is always Unbounded and Analytic, and that is not a
            placeholder.** A body rides a fixed conic about a fixed parent, so where it
            is at any UT can be computed on demand from `BodyEntry.orbit`, with no drift
            to bound.

            **Under n-body physics a body's elements drift like a craft's.** The
            elements are then the conic osculating an integrated ephemeris at the sample
            instant, and extrapolating them past this horizon draws a moon where no
            model put it. The horizon comes from the installed physics mod, through
            IBodyEphemerisHorizon.

            Per body rather than once for the system, because the bound is local: a moon
            deep in a giant's satellite system and a lone planet are perturbed by orders
            of magnitude differently.
          allOf:
            - $ref: "#/components/schemas/PropagationHorizon"
        gravParameter:
          type:
            - number
            - "null"
          x-sitrep-unit: m³/s²
          description: |-
            Standard gravitational parameter μ = G·M, m³/s² (KSP
            `CelestialBody.gravParameter`). Null when the game has not populated it.
        mass:
          type:
            - number
            - "null"
          x-sitrep-unit: kg
          description: |-
            Body mass, kilograms (`CelestialBody.Mass`). Null when the game has not
            populated it.
        surfaceGravity:
          type:
            - number
            - "null"
          x-sitrep-unit: g
          description: |-
            Surface gravity in multiples of g₀ (`CelestialBody.GeeASL`), verbatim. Null
            when the game has not populated it.

            This is the configured value, not a derived one: KSP computes mass and
            gravParameter from it (`Mass = Radius² · (GeeASL ·
            PhysicsGlobals.GravitationalAcceleration) / G`), so reconstructing it as
            μ/r²/g₀ runs the game's arithmetic backwards and can only lose precision.
        hillSphere:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Hill-sphere radius, metres (`CelestialBody.hillSphere`).

            Null for the root star, where KSP's own value is `double.PositiveInfinity`
            and there is no parent to be bound by.

            Use this rather than computing it: KSP's expression is
            `a·(1−e)·(m/M)^(1/3)`, while the textbook form carries a factor of three
            under the root, `a·(1−e)·∛(m/3M)`, which comes out about 31% smaller than
            the game's.
        sphereOfInfluence:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Sphere-of-influence radius, metres (`CelestialBody.sphereOfInfluence`); null
            when absent.
        rotationPeriod:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            Sidereal rotation period, seconds (`CelestialBody.rotationPeriod`); a
            negative value denotes retrograde rotation. Null when absent. A body rotates
            exactly when this is finite and non-zero; there is no separate flag.
        initialRotation:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            The body's rotation angle at UT 0, degrees
            (`CelestialBody.initialRotation`); null when absent.

            The PHASE that `BodyEntry.rotationPeriod`'s rate is measured from, and the
            pair is what makes a body-fixed coordinate into a place: the angle at any UT
            is `initialRotation + 360 · ut / rotationPeriod`, and turning a
            latitude/longitude by it gives a position in the same frame this payload's
            orbital elements are measured in. The turn is about the reference +Z pole
            alone, so no separate spin axis is needed.

            Zero is a real value, not a stand-in: a body whose prime meridian happens to
            face the reference direction at UT 0 reports it.
        tidallyLocked:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the body is tidally locked to its parent
            (`CelestialBody.tidallyLocked`); null when absent.
        atmosphere:
          description: |-
            Atmosphere descriptor; null when the body has no atmosphere
            (`CelestialBody.atmosphere` is false), never an all-null placeholder.
          anyOf:
            - $ref: "#/components/schemas/AtmosphereEntry"
            - type: "null"
        hasOcean:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the body has a liquid ocean (`CelestialBody.ocean`); null when
            absent.
        description:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's per-body flavour text (`CelestialBody.bodyDescription`); null when
            absent. May be a raw, unresolved `#autoLOC...` localization tag, which is
            not text to show.
        isHome:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether KSC and the launch sites sit on this body
            (`CelestialBody.isHomeWorld`); true on exactly one body, null when absent.
            The authoritative home-body marker: a client locates home by this flag,
            never by index.
    BodyState:
      type: object
      description: |-
        One body's position and velocity at one instant, relative to the request's
        centre body, in a non-rotating, Z-up inertial frame centred on that body.

        Flat keys rather than nested vectors, because these arrive in bulk.
      required:
        - ut
        - x
        - y
        - z
        - vx
        - vy
        - vz
      properties:
        ut:
          type: number
          x-sitrep-unit: ut
          description: The instant this state is at, echoing the request.
        x:
          type: number
          x-sitrep-unit: m
          description: Position along the frame's X axis, metres from the centre body.
        y:
          type: number
          x-sitrep-unit: m
          description: Position along the frame's Y axis, metres from the centre body.
        z:
          type: number
          x-sitrep-unit: m
          description: Position along the frame's Z (up) axis, metres from the centre body.
        vx:
          type: number
          x-sitrep-unit: m/s
          description: Velocity along the frame's X axis, m/s, relative to the centre body.
        vy:
          type: number
          x-sitrep-unit: m/s
          description: Velocity along the frame's Y axis, m/s, relative to the centre body.
        vz:
          type: number
          x-sitrep-unit: m/s
          description: Velocity along the frame's Z (up) axis, m/s, relative to the centre body.
    BodyStatesReply:
      type: object
      description: |-
        The reply to `system.bodies.statesAt`: the solved states, or why there are
        none.

        Branch on `BodyStatesReply.solved`, never on an empty list: a body the
        provider could not place and a request that named no instants are different
        facts, and reading them the same draws an empty plot for an install problem.
      required:
        - solved
        - states
      properties:
        solved:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when the provider solved every requested instant and
            `BodyStatesReply.states` holds them; false when the request was refused,
            with the reason in `BodyStatesReply.refusal`.
        states:
          type: array
          items:
            $ref: "#/components/schemas/BodyState"
          description: |-
            One state per requested instant, in the order asked. Empty when
            `BodyStatesReply.solved` is false.
        providerId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Id of the propagation provider that solved the request, so a reading that
            looks wrong can be attributed to it. Null on a refusal.
        refusal:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Why the request was refused, in words a reader can act on, when
            `BodyStatesReply.solved` is false; null when it is true.
    BodyStatesRequest:
      type: object
      description: |-
        Args for `system.bodies.statesAt`: where one body is at each of a list of
        instants, from the propagation provider elected on this install.

        A command rather than a channel because the instants are the caller's: a
        transfer search asks about departure and arrival times nobody has reached,
        and nothing publishes a position for an instant nobody asked about.

        There is no vantage field: the vantage is resolved from the connection the
        command arrives on, so a client cannot name somebody else's.

        **A centre body must be named.** The reply is expressed relative to whatever
        body you name, and there is no default: a transfer search wants both
        endpoints about the parent they share, and saying which body that is also
        lets one request serve a moon system as readily as a solar one.

        **The bound is asked for, never inherited.** Every provider computes a body
        from the same analytical model, so the caller states whether it will read
        that model past the span anyone vouches for, in
        `BodyStatesRequest.certification`. A request that does not name one is
        refused.

        No ephemeris horizon applies to the result: a horizon bounds how long
        osculating elements stand in for an integrated path, and this is a conic
        (two-body) solve, not a claim to be that path.
      required:
        - bodyIndex
        - centreBodyIndex
        - uts
        - certification
      properties:
        bodyIndex:
          type: number
          x-sitrep-unit: id
          description: The body, by its `system.bodies` index.
        centreBodyIndex:
          type: number
          x-sitrep-unit: id
          description: |-
            The body the reply is expressed relative to, by the same index. For a
            transfer search this is the parent both endpoints orbit.
        uts:
          type: array
          items:
            type: number
            x-sitrep-unit: ut
          description: |-
            The instants to solve for, in UT seconds. Returned in the order given, so a
            caller can zip the reply against its own grid without matching on a time it
            would have to compare as a float.
        certification:
          description: |-
            Whether this caller accepts a result past the span the provider vouches for.
            Only `PropagationCertification.Unbounded` is accepted: a transfer search is
            a two-body question about instants nobody has reached, and a bound on how
            long osculating elements stand in for an integrated path says nothing about
            it.

            `PropagationCertification.Unspecified` is refused rather than defaulted, and
            so is `PropagationCertification.CertifiedOnly`, because the request carries
            instants with no origin to measure a span from.
          allOf:
            - $ref: "#/components/schemas/PropagationCertification"
              x-sitrep-unit: enum
    CareerBalances:
      type: object
      description: |-
        Balances sub-group of `CareerStatus`: the funds, reputation and science
        balances, each `null` when unreadable.
      properties:
        funds:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            The career's funds balance, KSP's `Funding.Funds`. `null` when the funding
            module is not loaded.
        reputation:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: |-
            The career's reputation, KSP's `Reputation.reputation`. `null` when the
            reputation module is not loaded.
        science:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            The career's science balance, KSP's `ResearchAndDevelopment.Science`. `null`
            when the R&D module is not loaded.
    CareerContract:
      type: object
      description: |-
        One contract in `CareerContracts.active`, `CareerContracts.offered` or
        `CareerContracts.completedRecent`.
      required:
        - parameters
      properties:
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            KSP's `Contract.ContractID` as a decimal string: the id save files and other
            mods key contracts by, and stable for the contract's life. A string because
            the value routinely exceeds JavaScript's safe integer range.
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The contract's display title, `Contract.Title`.
        agent:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The name of the agency offering the contract. `null` when the contract has
            no agent.
        state:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's `Contract.State` enum NAME, e.g. `"Active"`, `"Offered"` or
            `"Completed"`.
        fundsAdvance:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: Funds paid when the contract is accepted.
        fundsCompletion:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: Funds paid when the contract is completed.
        fundsFailure:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: Funds taken when the contract fails.
        scienceCompletion:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: Science awarded when the contract is completed.
        reputationCompletion:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: Reputation awarded when the contract is completed.
        reputationFailure:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: Reputation lost when the contract fails.
        dateAccepted:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: When the contract was accepted, KSP's `Contract.DateAccepted`.
        dateDeadline:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When an accepted contract must be completed by, KSP's
            `Contract.DateDeadline`. Passed through as KSP holds it, so a contract with
            no deadline carries `0` here rather than `null`.
        dateExpire:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When an offered contract is withdrawn if not accepted, KSP's
            `Contract.DateExpire`.
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/CareerContractParameter"
          description: |-
            The contract's top-level objectives, in KSP's order. Nested sub-parameters
            are not listed. Always present, empty when the contract has none.
    CareerContractParameter:
      type: object
      description: One parameter (objective) of a `CareerContract`.
      properties:
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The objective's display title, KSP's ContractParameter.Title.
        state:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            `Contracts.ParameterState`'s enum NAME (`Incomplete`/`Complete`/`Failed`): a
            display label. `CareerContractParameter.stateOrdinal` is the field to branch
            on.
        stateOrdinal:
          description: |-
            `CareerContractParameter.state`'s KSP ORDINAL, typed to `KspParameterState`.
            Branch on this rather than on the spelling of
            `CareerContractParameter.state`: matching a label means an unrecognised
            spelling reads as outstanding, and a contract-parameter alarm set on
            "Complete" never fires.

            `null` when the capture carried no state, which is a third value and must
            not be read as either complete or incomplete.
          anyOf:
            - $ref: "#/components/schemas/KspParameterState"
              x-sitrep-unit: enum
            - type: "null"
        minAltitude:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Lower bound of the altitude band this objective requires, from the stock
            `ReachAltitudeEnvelope` it is or contains (a part test nests its envelope
            under itself). `null` when it carries none.
        maxAltitude:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Upper bound of that same band, `null` exactly when
            `CareerContractParameter.minAltitude` is.
    CareerContracts:
      type: object
      description: |-
        Contracts sub-group of `CareerStatus`. All three lists are always present
        (empty, never null).
      required:
        - active
        - offered
        - completedRecent
      properties:
        active:
          type: array
          items:
            $ref: "#/components/schemas/CareerContract"
          description: |-
            Contracts the career has accepted and not yet finished
            (`Contract.State.Active`).
        offered:
          type: array
          items:
            $ref: "#/components/schemas/CareerContract"
          description: Contracts on offer and not yet accepted (`Contract.State.Offered`).
        completedRecent:
          type: array
          items:
            $ref: "#/components/schemas/CareerContract"
          description: |-
            BOUNDED recently-completed list: the last N (currently 10) `State.Completed`
            contracts from `ContractSystem.Instance.ContractsFinished`, sorted
            newest-first by `Contract.DateFinished`. Failed, expired, cancelled and
            withdrawn contracts are not included. Same `CareerContract` element shape as
            `CareerContracts.active` / `CareerContracts.offered`: no extra fields;
            `State` is always `"Completed"` here.
    CareerFacilities:
      type: object
      description: |-
        The `career.facilities` channel payload: the space centre's buildings, each
        with the tier it stands at and the ladder it stands on.

        **It arrives only while the game can report it, and stops otherwise.** A
        facility's tier count and prices are readable from the building objects,
        which KSP registers at the space centre, in the editor and in flight. The
        tracking station reads the tier the save holds against the ladder last read
        in one of those scenes. Where no ladder has been read there is no reading to
        take, so this channel goes SILENT rather than reporting a row of nulls. The
        last reading stands, dated, and the client marks it as held: a whole channel
        can be held and said to be held, where a nullable field on a channel that
        keeps ticking cannot.

        A tier count does not change during a save, so a ladder held from an earlier
        scene is still true. The tier standing on it can move, and does when the
        player buys an upgrade, so both travel together and are dated together
        rather than one being trusted further than the other.
      properties:
        facilities:
          type:
            - object
            - "null"
          additionalProperties:
            $ref: "#/components/schemas/CareerFacility"
          description: |-
            DYNAMIC-KEY MAP keyed by `SpaceCenterFacility` name (e.g. `"LaunchPad"`,
            `"VehicleAssemblyBuilding"`): not a fixed record, so enumerate the keys
            rather than reaching for one you expect to be there. A facility the game
            cannot report is left out of the map. Never empty on the wire: the channel
            is absent instead.
    CareerFacility:
      type: object
      description: |-
        One facility entry in `CareerFacilities.facilities`. A facility the game
        cannot currently report is left out of the map rather than sent with null
        fields, so an entry that is present always carries
        `CareerFacility.currentTier` and `CareerFacility.maxTier`.
      properties:
        facilityOrdinal:
          description: |-
            Which facility this entry is, as KSP's `SpaceCenterFacility` ORDINAL, typed
            to `KspSpaceCenterFacility`.

            `CareerFacilities.facilities` is keyed by the enum NAME. The identity also
            rides INSIDE the entry, so a client can identify the facility without
            recognising the key it arrived under.

            `null` when the producer sent no ordinal.
          anyOf:
            - $ref: "#/components/schemas/KspSpaceCenterFacility"
              x-sitrep-unit: enum
            - type: "null"
        currentTier:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            The tier the facility stands at, KSP's zero-based
            `UpgradeableFacility.FacilityLevel`: `0` is the first tier. Away from a
            scene that registers the building, this is the tier the save holds, read
            against the ladder last seen.
        maxTier:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            The highest tier this facility can reach, KSP's zero-based
            `UpgradeableFacility.MaxLevel`. The facility is fully upgraded when
            `CareerFacility.currentTier` equals it, and it has `MaxTier + 1` tiers.
        upgradeCost:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            The price of upgrading to the next tier, as KSP's
            `UpgradeableFacility.GetUpgradeCost` prices it (the save's funds difficulty
            multiplier applied). `null` when it could not be read.
    CareerMode:
      type: object
      description: |-
        The `career.mode` channel payload: the active save's `GameMode`, as `{
        "mode": <int> }`. The whole payload is `null` when no game is loaded (main
        menu, no save). Once a save is loaded the mode is always one of the four
        `GameMode` members.
      required:
        - mode
      properties:
        mode:
          description: The active save's mode, as its integer ordinal.
          allOf:
            - $ref: "#/components/schemas/GameMode"
              x-sitrep-unit: enum
    CareerStatus:
      type: object
      description: |-
        The `career.status` channel payload: the KSC and career-mode snapshot, in
        four groups (balances, contracts, strategies, tech). The space centre's
        buildings are NOT here: they ride `CareerFacilities`, which can be held on
        its own while this channel keeps arriving.

        **Three states, and they mean different things.** The whole payload is
        `null` in SANDBOX, where there is no career at all. A non-null payload with
        a sub-group `null` means career mode is running and that group is genuinely
        unavailable this tick. All four group keys are ALWAYS present, each
        nullable, never omitted, so a missing key is a protocol error rather than an
        absent group.

        Every number is nullable and `null` is never a sentinel: a field is `null`
        whenever the raw value is absent or non-finite. The two counts
        (`CareerStrategies.activeCount`, `CareerTech.unlockedCount`) are the only
        non-nullable numbers, because an empty list counts as zero rather than as
        unknown.
      required:
        - meta
      properties:
        balances:
          description: |-
            The career's balances (funds, reputation, science). `null` when none of the
            three could be read this tick.
          anyOf:
            - $ref: "#/components/schemas/CareerBalances"
            - type: "null"
        contracts:
          description: |-
            Active, offered and recently completed contracts. `null` when KSP's contract
            system is not loaded this tick.
          anyOf:
            - $ref: "#/components/schemas/CareerContracts"
            - type: "null"
        strategies:
          description: |-
            The save's strategy roster and which strategies are active. `null` when
            KSP's strategy system is not loaded this tick.
          anyOf:
            - $ref: "#/components/schemas/CareerStrategies"
            - type: "null"
        tech:
          description: |-
            The tech tree and which of it is unlocked. `null` when R&D or the part list
            is not loaded this tick.
          anyOf:
            - $ref: "#/components/schemas/CareerTech"
            - type: "null"
        meta:
          description: |-
            Provenance, and always `"game"`: a career belongs to the save, not to
            anything flying, so switching vessels cannot change which one is being read.

            A SCET alarm compares this stamp against the subject the alarm was set for,
            and refuses a reading that does not match. Without it a threshold on a
            career figure could be set and would then never come due, which an operator
            cannot tell apart from a condition that has not been met. `"game"` is the
            same token `ScetAlarm.subject` carries for anything the whole simulation
            shares.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    CareerStrategies:
      type: object
      description: |-
        Strategies sub-group of `CareerStatus`. Both lists are always present
        (empty, never null).
      required:
        - active
        - all
        - activeCount
      properties:
        active:
          type: array
          items:
            $ref: "#/components/schemas/CareerStrategy"
          description: |-
            The strategies currently active, in the same entry shape as
            `CareerStrategies.all`. Not filtered against the Administration Building's
            cap, so a save that carries more active strategies than its building allows
            shows all of them.
        all:
          type: array
          items:
            $ref: "#/components/schemas/CareerStrategy"
          description: Every strategy the save knows about, active or not.
        activeCount:
          type: number
          x-sitrep-unit: count
          description: |-
            How many strategies are active. Never null: it is the length of
            `CareerStrategies.active` when the raw count is absent.
        activationPatched:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether another mod replaces or alters KSP's own strategy activation: `true`
            when it does, `false` when the game's activation is its own, `null` when
            that could not be established.

            With the Administration Building shut, `career.strategy.activate` commits a
            strategy only when this is `false`, and refuses otherwise: a mod that
            changes activation owns the procedure, and offers its own command for it.
            With the building open the game activates as it always does, whatever this
            says.
    CareerStrategy:
      type: object
      description: One strategy in `CareerStrategies.active` / `CareerStrategies.all`.
      properties:
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The strategy's internal config name, KSP's `StrategyConfig.Name` (e.g.
            `"OutsourceRnDStrategy"`): stable across a save, and the id
            `ActivateStrategyArgs.strategyId` takes.
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The strategy's display title, KSP's Strategy.Title.
        description:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The strategy's description text, KSP's Strategy.Description.
        department:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The name of the Administration department the strategy belongs to, KSP's
            Strategy.DepartmentName.
        isActive:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the strategy is active, KSP's Strategy.IsActive.
        factor:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            The strategy's commitment level, KSP's Strategy.Factor: the position of its
            commitment slider as a 0..1 fraction.
        dateActivated:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the strategy was activated, KSP's Strategy.DateActivated. Meaningful
            only while `CareerStrategy.isActive` is `true`.
        requiredReputation:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: |-
            The reputation the career needs before the strategy can be activated, KSP's
            Strategy.RequiredReputation.
        initialCostFunds:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: The funds charged on activation, KSP's Strategy.InitialCostFunds.
        initialCostScience:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: The science charged on activation, KSP's Strategy.InitialCostScience.
        initialCostReputation:
          type:
            - number
            - "null"
          x-sitrep-unit: rep
          description: The reputation charged on activation, KSP's Strategy.InitialCostReputation.
        hasFactorSlider:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the strategy offers a commitment slider, so that
            `CareerStrategy.factor` can be chosen, KSP's Strategy.HasFactorSlider.
        factorSliderDefault:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            The 0..1 position the game starts the commitment slider at, KSP's
            Strategy.FactorSliderDefault.
        factorSliderSteps:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            How many discrete positions the commitment slider has, KSP's
            Strategy.FactorSliderSteps.
        canActivate:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether KSP would allow this strategy to be committed to right now. `null`
            means the question could not be put at all, which is NOT a refusal:
            `CareerStrategy.activateBlockedReason` then says why no check could run
            rather than naming a rule the strategy broke.
        activateBlockedReason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's own wording for the rule that refused, or an installed career mod's
            wording for a rule of its own, or an account of why the question could not
            be put when `CareerStrategy.canActivate` is `null`. Empty when activation is
            allowed.
        activateVerdictSource:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Which route produced `CareerStrategy.canActivate`: `"screened"` when KSP's
            own check ran, `"derived"` when the same rules were checked one at a time
            because the Administration Building was shut, or when the strategy is
            already active, and `"none"` when there is no verdict to carry.

            `"derived"` always accompanies a refusal and never a yes. The game stops at
            its first refusal, so a rule that refuses off-screen would have refused on
            it; but one rule counts the career's running strategies on that screen and
            cannot be checked anywhere else, and permission needs every rule to pass. A
            strategy no rule refused therefore arrives with no verdict and `"none"`
            rather than as allowed.

            Never enable an activation control from a `"derived"` verdict: it can only
            refuse. Whether a strategy without a verdict may be committed is decided by
            `career.strategy.activate` itself, which runs every check again at the
            moment it executes and refuses in the game's words or as unreadable rather
            than guessing.
        canDeactivate:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether KSP would allow this strategy to be ended right now, KSP's
            Strategy.CanBeDeactivated. `false` with a reason beginning `"eligibility
            check failed: "` when the check itself threw.
        deactivateBlockedReason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's own wording for why the strategy cannot be ended, or the failed check
            described in `CareerStrategy.canDeactivate`. Empty or `null` when
            deactivation is allowed.
        effect:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: KSP's text describing what the strategy does while active, Strategy.Effect.
    CareerTech:
      type: object
      description: |-
        Tech sub-group of `CareerStatus`. Both lists are always present (empty,
        never null).
      required:
        - unlockedCount
        - unlockedIds
        - nodes
      properties:
        unlockedCount:
          type: number
          x-sitrep-unit: count
          description: |-
            How many distinct tech nodes are unlocked. Never null: it is the length of
            `CareerTech.unlockedIds` when the raw count is absent.
        unlockedIds:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: |-
            The ids of the unlocked tech nodes, in no particular order. Derived from the
            loaded parts (each part's `TechRequired` whose tech is available), so a node
            that unlocks no part never appears here even when it is researched;
            `CareerTechNode.unlocked` is the per-node reading.
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/CareerTechNode"
          description: |-
            Every node of the tech tree the save is playing, including a tree a mod has
            replaced. Empty when the tree is not loaded yet.
    CareerTechNode:
      type: object
      description: One node in `CareerTech.nodes`.
      required:
        - parents
      properties:
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The node's tech id, KSP's `techID` (e.g. `"basicRocketry"`).
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The node's display title, from `ResearchAndDevelopment.GetTechnologyTitle`.
        description:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The node's flavour line, as the tech tree itself writes it ("How hard can
            Rocket Science be anyway?").

            It comes from the tree's own config rather than from `RDTech`, whose
            `description` field only exists while the R&D Building scene is open. A tech
            tree a mod has replaced is read the same way, so this is the node's
            description in whatever tree the save is playing.
        scienceCost:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: The science it costs to research the node, from the tree's config.
        unlocked:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the node is researched in this save
            (`ResearchAndDevelopment.GetTechnologyState` is `Available`).
        parents:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: |-
            The tech ids of the node's prerequisites, from the tree's parent edges.
            Empty for a root node. Whether a locked node is researchable is left to the
            client, from these edges and each parent's `CareerTechNode.unlocked`.
    CentreDelayEntry:
      type: object
      description: |-
        One command centre's own one-way delay to the active craft, in the
        `commandCentre.activeVesselDelay` channel.
      required:
        - id
        - oneWaySeconds
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: The centre, as a roster `Id`.
        oneWaySeconds:
          type: number
          x-sitrep-unit: s
          description: One-way signal time along the centre's own routed path to the active craft.
    CentreSeparationEntry:
      type: object
      description: |-
        One ordered pair in the `commandCentre.separation` channel: how far
        `CentreSeparationEntry.from` is from `CentreSeparationEntry.to`, in one-way
        seconds along the routed CommNet path.

        Both ends are command-centre ids from `commandCentre.roster`, so a pair is a
        ground station against another ground station, a crewed craft against a
        ground station, or two crewed craft: a crewed control-source vessel IS a
        centre, so no separate vocabulary is needed for it.
      required:
        - from
        - to
        - oneWaySeconds
      properties:
        from:
          type: string
          x-sitrep-unit: id
          description: The centre the separation is measured FROM, as a roster `Id`.
        to:
          type: string
          x-sitrep-unit: id
          description: The centre the separation is measured TO, as a roster `Id`.
        oneWaySeconds:
          type: number
          x-sitrep-unit: s
          description: One-way signal time along the routed path between the two.
    ClosestApproach:
      type: object
      description: |-
        Next closest approach between the active vessel and its current target,
        computed by the mod's elected IPropagationProvider (stock two-body Kepler by
        default, an n-body provider when one is elected over it), so an n-body
        physics mod can supply the true encounter rather than a Kepler
        approximation.

        It comes from the propagation provider rather than a solver of its own so
        that the encounter and the trajectory it is an encounter ON are always the
        same physics. Null on `VesselTarget` when there is no target, no frame the
        provider can reach both objects in, or no encounter inside the window it was
        asked about.
      required:
        - time
        - distance
      properties:
        time:
          type: number
          x-sitrep-unit: ut
          description: |-
            Universal Time (seconds) of the minimum separation at or after the sample's
            UT.
        distance:
          type: number
          x-sitrep-unit: m
          description: Separation (metres) at `ClosestApproach.time`.
    CommandCentreActiveVesselDelay:
      type: object
      description: |-
        How far each command centre is from the active craft, one-way, along its own
        routed path: the delay every ordinary channel reaches that centre at, and
        the delay a command from it takes to arrive.

        **Sparse, and that is the contract.** A centre is listed only when it has a
        delay of its own. The home centre is never listed: its delay is
        `comms.delay`, which also carries the hold through a loss of signal. A
        centre other than home that is not listed has no route to the craft. Neither
        absence is a zero, and a reader that finds a centre missing must not quote
        one for it.

        The crewed centre that IS the active craft is listed at an explicit zero: a
        craft is no distance from itself.

        DELAYED, on the same reasoning as `comms.delay`: each centre learns the
        figures one of its own light-times after they held, so a centre's own entry
        is the delay it was under when the frame left.
      required:
        - centres
      properties:
        centres:
          type: array
          items:
            $ref: "#/components/schemas/CentreDelayEntry"
          description: Every centre with a delay of its own to the active craft.
    CommandCentreEntry:
      type: object
      description: |-
        One command centre in the `commandCentre.roster` channel: a vantage the
        operator can command from and observe at. The roster is the union of the
        CommNet home nodes (KSC, Extra Ground Stations, Kerbal Konstructs sites) and
        crewed control-source vessels.

        The channel payload is a bare array of these entries, like
        `SpaceCenterPoiEntry`, one per centre, keyed by `CommandCentreEntry.id`.
      required:
        - active
        - isHome
        - isHomeFallback
      properties:
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Stable authority/vantage key: `"ground:<name>"` | `"vessel:<guid>"`. Every
            ground station is `"ground:<name>"`, the home one included: which centre is
            home is `CommandCentreEntry.isHome`, never a special id. Ground stations
            that share a name are told apart as `"ground:<name>#2"`, `"#3"` and so on.
        displayName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: Human-facing name.
        kind:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: "One of `GroundStation`, `CrewedVessel` or `Custom`: the kind of centre."
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index into `SystemBodies` of the body this centre sits on; null when unknown
            or not surface-anchored.
        latitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Body-fixed surface latitude of the centre in degrees, when surface-anchored;
            null for a moving vessel centre.

            **Null is "not applicable", not "not computed".** A `GroundStation` always
            reports coordinates. A `CrewedVessel` reports them only while landed,
            splashed or pre-launch: off the ground the only thing derivable is a
            sub-vessel ground point that sweeps at orbital rate, which is not a place
            the centre occupies. So null says the centre is airborne or in space, and a
            client may act on that rather than treating it as missing data. The one case
            where an anchored centre reports null is a body that could not be read at
            all, and then `CommandCentreEntry.bodyIndex` is null too: the two travel
            together, so a null coordinate never appears beside a known body.

            Always null or non-null together with `CommandCentreEntry.longitude`.
        longitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Body-fixed surface longitude of the centre in degrees, wrapped to (-180,
            180], matching every other geographic value on the wire. Null under exactly
            the rule `CommandCentreEntry.latitude` documents, and always null together
            with it.
        active:
          type: boolean
          x-sitrep-unit: flag
          description: Whether this centre is a valid command source right now.
        isHome:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether this centre is the home command: the one centre that holds the
            career ledger, as the mod's home-command claimant identifies it.

            At most one entry carries it. When the claimant cannot say which centre is
            home, as on an install whose ground stations all look alike to it, the first
            active ground station in ordinal id order carries it in home's place, with
            `CommandCentreEntry.isHomeFallback` set: the same centre a connection that
            has not chosen a vantage starts at. No entry carries it only when the roster
            holds no ground station at all.

            Not the same fact as `CommsHop.fromIsHome`, which is true of every ground
            station and so cannot say which one is home.
        isHomeFallback:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether this centre is home only because no home was identified: true on the
            one entry that carries `CommandCentreEntry.isHome` in its place, false on
            every other entry and on an identified home.

            A client that shows this centre as home can still tell the operator that it
            is standing in, and name it, without working out the stand-in itself.
        delayQuality:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Whether this centre can be routed to: `"routed"` (it has a CommNet node, so
            a control path can be found, occlusion-aware) or `"unroutable"` (no CommNet
            node, so no command path and no delay). There is no position-only
            approximation: commands ride the relay network, and a centre with no route
            has no delay to quote.
    CommandCentreSeparation:
      type: object
      description: |-
        How far every active command centre is from every other, one-way, along the
        routed CommNet path. The number a human at one vantage needs to know how
        long their words take to reach a human at another.

        **Sparse, and that is the contract.** A pair with no route has NO entry
        rather than a zero or a sentinel: commands and messages ride the relay
        network, so an unroutable pair has no separation to quote, and inventing one
        would make an unreachable correspondent look merely distant. A reader that
        finds no entry for a pair knows the separation is unavailable, which is a
        different fact from it being large.

        Each centre against ITSELF is always present as an explicit zero: a node is
        exactly no distance from itself, and without the row a reader would fall
        through to "unavailable" for the one pair it is most certain about.

        DELAYED, on the same reasoning as `comms.delay`: a separation is measured
        between two places a signal has to cross, so the figure a reader holds is
        the one their own light has brought them. It is the separation as OBSERVED,
        never as it is at this instant, and a pair whose geometry has changed since
        says so one light-time later.
      required:
        - pairs
      properties:
        pairs:
          type: array
          items:
            $ref: "#/components/schemas/CentreSeparationEntry"
          description: Every ordered pair with a routed path, plus each centre's own zero.
    CommandErrorCode:
      type: string
      description: |-
        The root refusals: the closed set every client can switch on. Each says what
        kind of refusal it was, and so whether waiting, changing the craft, or doing
        something in the game is what makes a retry worthwhile.

        A producer that can say more names a refinement of one of these (see
        `RefusalCode.Refine`); the root still travels, so nothing a client does with
        a root depends on knowing the refinement.
      oneOf:
        - const: noVessel
          title: NoVessel
          description: There is no active vessel to act on.
          x-sitrep-sentence: there is no vessel to act on
        - const: modeUnavailable
          title: ModeUnavailable
          description: |-
            The requested mode or state is not available, and the game gave no more
            specific reason.
          x-sitrep-sentence: the game would not say why
        - const: range
          title: Range
          description: An argument was out of its valid range.
          x-sitrep-sentence: an argument was outside its valid range
        - const: notFound
          title: NotFound
          description: |-
            The referenced entity (a node id, a vessel or body target, a craft name) did
            not resolve.
          x-sitrep-sentence: nothing here answers to that
        - const: planNotOwned
          title: PlanNotOwned
          description: |-
            The maneuver plan is owned by a planner other than stock's
            `patchedConicSolver`, so a node written there would never be used.

            Refused rather than attempted: an n-body planner clears stock's node list
            every frame and writes its own guidance node into it, so a written node
            would show on the board and do nothing. The owning planner is on the wire as
            `VesselManeuver.Planner`.
          x-sitrep-sentence: another planner owns the flight plan
        - const: limitReached
          title: LimitReached
          description: |-
            A capacity is full: the Astronaut Complex holds its cap of active crew, a
            facility holds its cap of anything else countable.

            A retry succeeds only once something changes, such as freeing a slot.

            `CommandResult.breach` carries the numbers, so a client can say "16 of 16".
          x-sitrep-sentence: a limit has been reached
        - const: alreadyAtMaximum
          title: AlreadyAtMaximum
          description: |-
            Already at the top of an upgradeable scale, so there is nothing above this
            to move to. The Launch Pad at tier 3 of 3.

            Not `CommandErrorCode.LimitReached`: a cap that is full can be freed; a
            maximum tier cannot be exceeded by any action at all.
          x-sitrep-sentence: it is already at its maximum
        - const: insufficientFunds
          title: InsufficientFunds
          description: |-
            The command costs more than the funds on hand.

            `CommandResult.breach` carries the cost as `Actual` against the balance as
            `Limit`, so the client can say how short and in the operator's own currency
            rendering.
          x-sitrep-sentence: there are not enough funds
        - const: insufficientScience
          title: InsufficientScience
          description: |-
            The command costs more science than is banked. Separate from
            `CommandErrorCode.InsufficientFunds`, as the game keeps science and funds
            separate currencies.

            Authority: `CurrencyModifierQuery.RunQuery(reason,
            ...).CanAfford(Currency.Science)`, which is what `RDTech.ResearchTech`
            checks, modifiers included.
          x-sitrep-sentence: there is not enough science
        - const: careerModeRequired
          title: CareerModeRequired
          description: |-
            The save is not a career save, so this command's whole subsystem does not
            exist here.

            Authority: `HighLogic.CurrentGame.Mode`, and in practice the null `Instance`
            of the `ScenarioModule` that would have served it (`Funding`,
            `ContractSystem`, `StrategySystem`, `ResearchAndDevelopment`,
            `ScenarioUpgradeableFacilities`).

            A permanent property of the save, not a state that may change, so a client
            can hide the control rather than show it refused.
          x-sitrep-sentence: this save is not a career game
        - const: wrongScene
          title: WrongScene
          description: |-
            The game is in a scene this command cannot run from.

            Authority: `HighLogic.LoadedScene` (`GameScenes`). `CommandResult.detail`
            names the scene when the producer had one.
          x-sitrep-sentence: the game is not in a scene that allows it
        - const: wrongState
          title: WrongState
          description: |-
            The entity is not in a state this transition applies to: an already-active
            strategy asked to activate, an already-researched node asked to unlock, a
            contract asked to accept when it is not offered, an assigned kerbal asked to
            be sacked, a spent experiment asked to deploy.

            Authority: the entity's own state enum. `Strategies.Strategy.IsActive`,
            `RDTech.State`, `Contract.State`, `ProtoCrewMember.RosterStatus`,
            `ModuleScienceExperiment.Deployed`/`Inoperable`. Every one of those is
            `[Description]`-tagged or otherwise nameable, so `CommandResult.detail` can
            carry the state in the game's own words.
          x-sitrep-sentence: it is not in a state that allows it
        - const: notClearToProceed
          title: NotClearToProceed
          description: |-
            Right command, wrong moment: the flight is not in a state that permits it
            yet, and will be later.

            Authority: `FlightGlobals.ClearToSave()`, which returns one of five refusals
            (in atmosphere, under acceleration, moving over the surface, about to crash,
            on a ladder), plus `FlightDriver.CanRevertToPostInit`/`CanRevertToPrelaunch`
            and the `GameParameters` flags for leaving to the space center and to the
            tracking station. The game's reason is on `CommandResult.detail`.

            Also returned by the SCET alarm command for a vantage it cannot check
            because no command centre is known to the simulation yet: the main menu, and
            the ticks before the first capture. A vantage that is known and inactive is
            `CommandErrorCode.Range` instead, because that one does not resolve by
            waiting.

            Distinct from `CommandErrorCode.WrongState`, which is about the entity and
            does not resolve by waiting.
          x-sitrep-sentence: the flight is not clear for it yet
        - const: capabilityMismatch
          title: CapabilityMismatch
          description: |-
            The part or vessel does not have the capability this command needs: a rotor
            asked for a target angle, an unmotorised servo asked to drive, a part with
            no such action, an action present but inert, an autopilot mode this craft
            cannot hold.

            Authority: the part's own module list and fields
            (`ModuleRoboticServoRotor`/`Hinge`/`Piston`, `servoIsMotorized`,
            `BaseEvent.active`, `BaseEvent.EventIsDisabledByVariant`) and
            `VesselAutopilot.CanSetMode`.

            Nothing an operator waits for. The craft would have to be different for this
            to work, which is why it is not `CommandErrorCode.NotClearToProceed` and not
            `CommandErrorCode.WrongState`.
          x-sitrep-sentence: this craft cannot do it
        - const: noConnection
          title: NoConnection
          description: |-
            There is no usable link for what this command needs to send.

            Authority: `ScienceUtil.GetBestTransmitter(Vessel)` and
            `IScienceDataTransmitter.CanTransmit()`: the vessel has no antenna that can
            carry the payload. This is not the comms-loss refusal that stops a command
            before it reaches the vessel.
          x-sitrep-sentence: there is no usable link
        - const: notUnlocked
          title: NotUnlocked
          description: |-
            The capability exists in the game but this save has not unlocked it: fuel
            transfer, custom action groups, flight planning, EVA, the maneuver tool.

            Authority: `GameVariables.UnlockedFuelTransfer`,
            `UnlockedActionGroupsStock`/`Custom`, `UnlockedFlightPlanning`,
            `UnlockedEVA`/`Flags`/`Clamber`, `ManeuverToolAvailable`, each read at the
            owning facility's normalised level.

            Distinct from `CommandErrorCode.LimitReached`, which is a number against a
            number. This is a switch that is off, and the fix is an upgrade rather than
            freeing a slot.
          x-sitrep-sentence: it has not been unlocked yet
        - const: siteOccupied
          title: SiteOccupied
          description: |-
            Another vessel is on the launch site.

            Authority: `PreFlightTests.LaunchSiteClear`, whose
            `GetWarningTitle()`/`GetWarningDescription()` are the game's own words for
            it and ride on `CommandResult.detail`.
          x-sitrep-sentence: another vessel is on the launch site
        - const: facilityDamaged
          title: FacilityDamaged
          description: |-
            The facility this command needs is destroyed or damaged.

            Authority: `PreFlightTests.FacilityOperational`, over
            `PSystemSetup.Instance.GetSpaceCenterFacility(name).GetFacilityDamage()`.
          x-sitrep-sentence: the building is out of action
        - const: insufficientResource
          title: InsufficientResource
          description: |-
            The command consumes a countable ITEM and there are not enough of them
            aboard.

            Authority: the provider's own charge, which it should also state wherever it
            shows the cost, so the cost shown and the cost taken agree. The item is the
            provider's to name: this code says only that there were too few, never which
            item.

            Separate from `CommandErrorCode.InsufficientFunds` and
            `CommandErrorCode.InsufficientScience`: a physical item cannot be bought.

            Not `CommandErrorCode.LimitReached`, which is a capacity that is full. This
            is a store that is empty.
          x-sitrep-sentence: there are not enough of what it uses aboard
        - const: unreadable
          title: Unreadable
          description: |-
            The provider was asked and could not read the state it needed. Nothing about
            the craft, the save or the moment was established, so the one fact this
            refusal carries is that the question went unresolved.

            Not `CommandErrorCode.CapabilityMismatch`, which is an established fact
            about the craft (a genuine omni antenna asked to aim). Not
            `CommandErrorCode.NotFound`, which says the craft carries nothing this
            command could act on. Not `CommandErrorCode.NotClearToProceed`, which
            resolves by waiting; this does not, and a retry is a second attempt at the
            same question.

            `CommandResult.detail` names what could not be read when the producer had a
            name for it, and never says what the result would have been. Nothing was
            learned about the vehicle, so offering the command again is the only sound
            next move.
          x-sitrep-sentence: the game would not answer
        - const: outOfReach
          title: OutOfReach
          description: |-
            The command acts at a PLACE, and the command centre it was sent from has no
            authority there: a launch from a pad in another planet's system.

            Authority, never delay. The command itself is still instant; what this
            refuses is the sender, not the moment, so no amount of waiting makes it
            succeed. Sending from a centre in the place's own system does.

            `CommandResult.detail` names the centre and the place, and the system each
            is in, so an operator learns which seat to move to rather than seeing a
            control that simply does nothing.

            Distinct from `CommandErrorCode.NoConnection`, which is a link that cannot
            carry the command. A centre may be perfectly linked to the place and still
            have no authority over it.
          x-sitrep-sentence: this command centre has no authority over that place
    CommandRequest:
      type: object
      description: |-
        A command the client sends: the command id, its arguments, and a request id
        that the reply carries back.

        The envelope every dispatch is sent in.

        `command` is the channel's `address` and `args` is that command's own args
        type; each command's `command-request` message pins both. The answer comes back
        as a `command-response` correlated on `requestId`, or as an `error` frame if
        the dispatch was never carried.
      required:
        - type
        - requestId
        - command
        - label
        - topic
        - args
        - sentAt
      properties:
        type:
          type: string
          const: command-request
          x-sitrep-unit: id
        requestId:
          type: string
          x-sitrep-unit: id
          description: An id the client chooses; the reply carries it back.
        command:
          type: string
          x-sitrep-unit: id
          description: The command id, such as `vessel.control.setThrottle`.
        label:
          type: string
          x-sitrep-unit: text
          description: |-
            A display label the caller chooses for this dispatch, carried verbatim into
            the matching `PendingUplink.label` on `system.uplink.pending`. When empty,
            show `CommandRequest.command` instead. The mod never reads or parses it.
        topic:
          type: string
          x-sitrep-unit: id
          description: |-
            A Topic the caller associates with this dispatch, carried verbatim into the
            matching `PendingUplink.topic` on `system.uplink.pending`. The mod never
            reads or parses it.
        vantage:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Per-call vantage override: the command centre id this command dispatches
            from, which decides its signal delay. Optional: null or empty uses the
            connection's own vantage (see `SetVantage`). A program-level command (tech,
            strategy, contract) sends `"meta"`, which carries no delay whichever centre
            the operator has selected. A centre that is not active is refused with an
            `unknown-vantage` error.
        args:
          description: The command's own arguments. Each command's `command-request` message narrows this to that command's args schema.
        sentAt:
          type: number
          x-sitrep-unit: ut
          description: |-
            When the client dispatched, in UT seconds (KSP universal time), the same
            base as `Meta.validAt`. A bare number in the TypeScript type, like every
            envelope field; its unit is declared in the SDK's units map.

            **The shipped clients send 0.** The server stamps the response's
            `Meta.deliveredAt` off its own clock, so a caller wanting a round-trip
            measures against its own view time rather than reading this back. The field
            is carried onto the response's `Meta.validAt`, which therefore reads 0 on a
            command response unless the client fills this in.
      examples:
        - type: command-request
          requestId: 0f3c9a12
          command: vessel.control.setThrottle
          label: Throttle 40%
          topic: vessel.control
          vantage: ground:Kerbal Space Center
          args:
            value: 0.4
          sentAt: 0
    CommandResponse:
      type: object
      description: |-
        The server's reply to a `CommandRequest`, matched to it by
        `CommandResponse.requestId`.

        The envelope every answer to a dispatch arrives in.

        `result` is the command's own reply type, pinned by that command's
        `command-response` message. A resolved response is a command that RAN: a
        refusal arrives here with `success: false` and an `errorCode`, and a fault
        arrives as an `error` frame on the session channel instead.

        There is no `command` field. `requestId` is the only link back to the
        dispatch, and a delayed command's answer can be minutes behind it.
      required:
        - type
        - requestId
        - result
        - meta
      properties:
        type:
          type: string
          const: command-response
          x-sitrep-unit: id
        requestId:
          type: string
          x-sitrep-unit: id
          description: |-
            The id from the request this replies to. It is the only link back to the
            request, and a delayed command's reply can arrive minutes later.
        result:
          description: The command's own reply. Each command's `command-response` message narrows this to that command's reply schema.
        meta:
          $ref: "#/components/schemas/Meta"
      examples:
        - type: command-response
          requestId: 0f3c9a12
          result:
            success: true
          meta: &a5
            source: gonogo
            validAt: 1842006.5
            seq: 918
            deliveredAt: 1842006.5
            vantage: ground:Kerbal Space Center
            active: true
            staleness: 0
            timelineEpoch: 3
    CommandResult:
      type: object
      description: |-
        What every command returns. A refused command has `CommandResult.success`
        false and a typed `CommandResult.errorCode` saying why, so a client never
        matches on message text.

        This is the result of a command that returns no value. A command that does
        returns `CommandResult`, which adds a `Payload`.
      required:
        - success
      properties:
        success:
          type: boolean
          x-sitrep-unit: flag
          description: Whether the command ran. False means the game refused it.
        errorCode:
          description: |-
            Why it was refused, null on success. On the wire this is the ROOT's id, so
            every client can classify it; a refinement's own id travels beside it as
            `CommandResult.reason`.
          anyOf:
            - $ref: "#/components/schemas/CommandErrorCode"
              x-sitrep-unit: enum
            - type: "null"
        reason:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The refinement's id, when the refusal is more specific than its root:
            `example.notManaging` under `careerModeRequired`. Absent when the refusal is
            a root. An id this client does not know is still a refusal of kind
            `CommandResult.errorCode`.
        breach:
          description: |-
            The numbers behind the refusal, when the refusal has any: the cap and the
            count, the tier and the top tier, the price and the balance. Null on success
            and on every refusal that is not a comparison.

            `CommandResult.errorCode` picks the sentence and this fills in its numbers,
            as in "16 of 16 active crew".

            The same `LimitBreach` shape a declared gate carries on
            `GateVerdict.breach`, so a refusal reads the same whether it came from a
            gate or from the command's own handler. Omitted from the wire when null.
          anyOf:
            - $ref: "#/components/schemas/LimitBreach"
            - type: "null"
        detail:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The refusal in the GAME's own words, when the game had any: the member of
            `ClearToSaveStatus` it came back with,
            `Strategies.Strategy.CanBeActivated(out string reason)`'s reason,
            `GameVariables.GetEVALockedReason`'s sentence, a
            `PreFlightTests.IPreFlightTest`'s `GetWarningTitle()`, a
            `[Description]`-tagged state member's name. Empty when the refusal had
            nothing to quote: omitted from the wire, never an empty string.

            The text is the game's own, so it is in the game's language.

            Prose for a human, never parsed: `CommandResult.errorCode` is the
            machine-readable half. The same split, and the same field name, as
            `GateVerdict.detail`.
    CommcastAuthor:
      type: object
      description: |-
        Who is speaking, as the speaking client describes itself. Shown to listeners
        and trusted for nothing else: the vantage a thing was said FROM is always
        the one the mod resolved for the connection that said it, never a field
        here.
      required:
        - name
        - stationKey
        - seat
      properties:
        name:
          type: string
          x-sitrep-unit: text
          description: The name a listener reads beside what was said.
        stationKey:
          type: string
          x-sitrep-unit: id
          description: |-
            The speaking device's own stable key, so a screen can recognise its own
            words coming back.
        seat:
          type: string
          x-sitrep-unit: id
          description: |-
            Which end of the light-path the speaker sits at, in the client's own
            vocabulary (`"pilot"`, `"mission-control"`).
    CommcastGroupAddArgs:
      type: object
      description: |-
        `commcast.group.add`'s args: bring more centres into a group. Anyone the
        speaker can see is a member may add; nobody is ever removed. Refused unless
        the speaker is a member as its own vantage currently knows the group.
      required:
        - groupId
        - added
        - author
      properties:
        groupId:
          type: string
          x-sitrep-unit: id
          description: The group, by the id it was opened with.
        added:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: |-
            The centres to bring in, as `commandCentre.roster` ids. One already in the
            group is ignored.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
    CommcastGroupOpenArgs:
      type: object
      description: |-
        `commcast.group.open`'s args: start a group, a set of command centres
        sharing one thread for messages and radio. The speaker is always a member,
        named here or not.

        Never delayed on the way up. What is said crosses once, from the speaker to
        each listener at that pair's light-time, and the mod times that crossing on
        the way down; delaying the command as well would count the gap twice.
      required:
        - groupId
        - members
        - author
      properties:
        groupId:
          type: string
          x-sitrep-unit: id
          description: |-
            Minted by the client, so a resend opens nothing twice. Refused if another
            group already holds it.
        members:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: Every centre the group starts with, as `commandCentre.roster` ids.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
    CommcastMessageAckArgs:
      type: object
      description: |-
        `commcast.message.ack`'s args: tell a message's author it arrived. The
        acknowledgement crosses back to the author at their pair's light-time, so
        the author learns it was read one crossing after it was.
      required:
        - messageId
        - author
      properties:
        messageId:
          type: string
          x-sitrep-unit: id
          description: The message being acknowledged, by its `CommcastMessageSendArgs.id`.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
    CommcastMessageSendArgs:
      type: object
      description: |-
        `commcast.message.send`'s args: say something to a group in text. Refused
        unless the speaker is a member as its own vantage knows the group.
      required:
        - id
        - groupId
        - body
        - author
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            Minted by the client and kept across a resend, so a listener holding both
            copies holds one message.
        groupId:
          type: string
          x-sitrep-unit: id
          description: The group, by the id it was opened with.
        body:
          type: string
          x-sitrep-unit: text
          description: The words.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
    CommcastRadioTransmitArgs:
      type: object
      description: |-
        `commcast.radio.transmit`'s args: one batch of live push-to-talk audio,
        spoken to a group.

        Each chunk is one raw Opus packet of 20 ms, base64-encoded. Send about 200
        ms per batch: each batch leaves the mod as one binary frame per listener on
        `commcast.radio`, and the per-frame header is what costs, not the audio.
      required:
        - transmissionId
        - groupId
        - seq
        - chunks
        - end
        - author
      properties:
        transmissionId:
          type: string
          x-sitrep-unit: id
          description: Minted by the client at key-down and carried on every batch of that keying.
        groupId:
          type: string
          x-sitrep-unit: id
          description: The group, by the id it was opened with.
        seq:
          type: number
          x-sitrep-unit: count
          description: |-
            The 0-based index, within the transmission, of the first chunk in this
            batch.
        chunks:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            Opus packets, 20 ms each, base64. May be empty on the batch that ends a
            keying.
        end:
          type: boolean
          x-sitrep-unit: flag
          description: True on the last batch of a keying.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
    CommcastTraffic:
      type: object
      description: |-
        One item of `commcast.traffic`: something said to a group this vantage
        belongs to, delivered one light-time after it was said from where it was
        said.

        **Addressed, never broadcast.** A connection receives only the items
        addressed to its own vantage. A group's members are addressed as the speaker
        could see them when it spoke, so a centre added far away starts receiving
        once word of it has reached the speaker, and a member with no path from the
        speaker misses what was said.

        **A stream, not state.** Nothing is replayed to a connection that subscribes
        after an item reached it, as with anything heard on a radio.

        Three kinds, by `CommcastTraffic.kind`:

        - `"members"`: a group opened or grew. `CommcastTraffic.members` is its
          whole membership after the change, `CommcastTraffic.added` who came in
        - `"text"`: a message, `CommcastTraffic.id` and `CommcastTraffic.body`
        - `"ack"`: a member acknowledging `CommcastTraffic.messageId`, addressed to
          that message's author alone
      required:
        - kind
        - groupId
        - from
        - author
        - sentUt
        - to
      properties:
        kind:
          type: string
          x-sitrep-unit: enum
          description: "`\"members\"`, `\"text\"` or `\"ack\"`."
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: A text message's own id, or a membership change's. Absent from an ack.
        groupId:
          type: string
          x-sitrep-unit: id
          description: The group, by the id it was opened with.
        from:
          type: string
          x-sitrep-unit: id
          description: |-
            The centre it was said from, as the mod resolved it for the speaker's
            connection.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
        sentUt:
          type: number
          x-sitrep-unit: ut
          description: The UT it was said at, which is also this delivery's `meta.validAt`.
        to:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: |-
            Everyone it was addressed to, the speaker included, as the speaker could see
            the group.
        members:
          type:
            - array
            - "null"
          items:
            type: string
            x-sitrep-unit: id
          description: The group's whole membership after a `"members"` change. Absent otherwise.
        added:
          type:
            - array
            - "null"
          items:
            type: string
            x-sitrep-unit: id
          description: Who a `"members"` change brought in. Absent otherwise.
        body:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: A `"text"` message's words. Absent otherwise.
        messageId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The message an `"ack"` acknowledges. Absent otherwise.
    CommcastTransmissionRow:
      type: object
      description: |-
        One row of `commcast.transmissions`: a radio transmission this vantage can
        detect.

        **Detectable** means a signal from the speaker has a routed path to this
        vantage, the same path its audio would take. The row reaches a vantage at
        exactly the delay the transmission's audio does, so the instant a
        transmission begins here is the same whichever of the two is read.

        Rows are sent when a keying begins, again at most once a second of game time
        while it continues (so a connection that subscribes partway through learns
        of it), and once when it ends. Nothing is replayed to a connection that
        subscribes after a row reached it.

        **Detection only.** A transmission's audio on
        `CommcastTransmissionRow.topic` is addressed to the members of its group
        only, and this row grants no access to it: a group is joined by invitation,
        never by a vantage adding itself, whatever it can detect.
      required:
        - phase
        - transmissionId
        - groupId
        - from
        - author
        - startedUt
        - to
        - topic
      properties:
        phase:
          type: string
          x-sitrep-unit: enum
          description: "`\"open\"` while the speaker is keyed, `\"ended\"` on the last row of a keying."
        transmissionId:
          type: string
          x-sitrep-unit: id
          description: The keying, by the id the speaking client minted at key-down.
        groupId:
          type: string
          x-sitrep-unit: id
          description: The group it is spoken to.
        from:
          type: string
          x-sitrep-unit: id
          description: The centre it is spoken from.
        author:
          description: How the speaker describes itself, for display only.
          allOf:
            - $ref: "#/components/schemas/CommcastAuthor"
        startedUt:
          type: number
          x-sitrep-unit: ut
          description: The UT the keying's first batch reached the mod.
        to:
          type: array
          items:
            type: string
            x-sitrep-unit: id
          description: Who the speaker addressed when this row was sent, the speaker included.
        topic:
          type: string
          x-sitrep-unit: id
          description: "The binary-lane topic its audio rides: `commcast.radio`."
    CommsCommandCentre:
      type: object
      description: |-
        The `comms.commandCentre` payload: WHICH command centre the active vessel's
        control path currently terminates at, a ground station or a crewed
        control-source vessel (the stock "command center" mechanic), so a client can
        show its own stats against the right name instead of assuming KSC. Shares
        its id and kind scheme with `CommandCentreEntry` (the `commandCentre.roster`
        entries): it names ONE entry from that same set, whichever one the vessel's
        control path resolved to this tick. A ground station is preferred when the
        last hop touches both.

        Every field is null when there is no live remote centre right now (no
        connection, or the last hop touches neither a ground station nor a crewed
        control source); `comms.link` already reports that case as no signal.
      properties:
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Stable centre key, same scheme as `CommandCentreEntry.id`: `"ground:<name>"`
            or `"vessel:<guid>"`. Null when no remote centre resolved.
        displayName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The centre's human-facing name. Null when no remote centre resolved.
        kind:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            One of `GroundStation`, `CrewedVessel` or `Custom`, same as
            `CommandCentreEntry.kind`. Null when no remote centre resolved.
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index into `system.bodies` of the body this centre sits on. Null when
            unknown, not surface-anchored, or the centre is a moving vessel.
    CommsConnectivity:
      type: object
      description: |-
        The `comms.connectivity` payload: always present, sourced from the elected
        comms backend. Ground-side truth about whether the active vessel has a
        control link home right now. All three fields describe the same tick.
      required:
        - connected
        - controlSource
        - hasLocalControl
      properties:
        connected:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when the backend resolved a control path home for the active vessel.
            False when it has none, and also when no link state could be read (then
            `CommsConnectivity.controlSource` is `CommsControlSource.None`).
        controlSource:
          description: The degree of control the vessel has.
          allOf:
            - $ref: "#/components/schemas/CommsControlSource"
              x-sitrep-unit: enum
        hasLocalControl:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when the vessel's control level is crewed partial control or full
            control. Independent of `CommsConnectivity.connected`: a crewed craft can be
            flown with no link home. Full control sets it too, including full control an
            uncrewed probe has over its link. False alongside
            `CommsControlSource.Unknown`.
    CommsControl:
      type: object
      description: |-
        The `comms.control` payload: always present, sourced from the elected comms
        backend. What the active vessel can be commanded to do right now, which is a
        different question from whether it is connected.
      required:
        - level
      properties:
        level:
          description: |-
            The vessel's control level. `CommsControlStateKind.None` when no link state
            could be read.
          allOf:
            - $ref: "#/components/schemas/CommsControlStateKind"
              x-sitrep-unit: enum
        reason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            A human-readable annotation on the control state, or null for none (never an
            empty string). The shipped backends set `"no connection to a command
            source"` when the vessel has no link home, and null when it is connected.
    CommsControlSource:
      type: integer
      description: |-
        The degree of control a vessel currently has, the `controlSource` axis of
        `CommsConnectivity`. The game's control level collapsed to three tiers:
        partial covers both crewed and uncrewed partial control, and whether a crew
        is aboard shows on `CommsConnectivity.hasLocalControl` instead.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: None
          description: "A measurement: the craft has no control source."
        - const: 1
          title: Partial
          description: |-
            Partial control, crewed or uncrewed: stock's `PARTIAL_MANNED` or
            `PARTIAL_UNMANNED` level.
        - const: 2
          title: Full
          description: Full control.
        - const: 3
          title: Unknown
          description: |-
            The game reported a control level this build does not name. Not
            `CommsControlSource.None`: nothing was measured to be absent, the level
            simply has no tier here yet. `CommsConnectivity.hasLocalControl` is false
            alongside it and says nothing.
    CommsControlStateKind:
      type: integer
      description: |-
        What the active vessel can be commanded to do, for `CommsControl`. The
        game's control level collapsed to three tiers, crewed and uncrewed partial
        control sharing one.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: None
          description: "A measurement: the craft cannot be commanded."
        - const: 1
          title: PartialManoeuvre
          description: |-
            Partial control, crewed or uncrewed: stock's `PARTIAL_MANNED` or
            `PARTIAL_UNMANNED` level.
        - const: 2
          title: Full
          description: Full control.
        - const: 3
          title: Unknown
          description: |-
            The game reported a control level this build does not name, so whether the
            craft can be commanded is not known. Not `CommsControlStateKind.None`.
    CommsDegrade:
      type: object
      description: |-
        The `comms.degrade` payload: how degraded the active vessel's link home is
        right now, on one fixed scale, as the comms backend in force grades it.

        `CommsDegrade.level` runs from 0, nothing wrong, to 1, nothing usable
        getting through. It is absent when nothing graded the link, and absent is a
        third case rather than a low one: "nobody rated this" and "this link is
        perfect" are opposite instructions to anything choosing a quality, so branch
        on the absence rather than defaulting it to a number.

        **Read this rather than deriving a quality from `comms.signal`.** That field
        is 0..1 too, and it is a different quantity on a stock install than on a
        RealAntennas one: a range fraction against an antenna curve versus spare
        room on a data-rate ladder. Nothing on the wire distinguishes them, so `1 -
        strength` is two different quality curves on two saves. This channel names
        its rule, so a consumer acting on the number can see which grading produced
        it.

        Delayed, like the link observations it grades and unlike the always-live
        `comms.delay`. A rating is an observation of the craft's link, so an
        operator learns of a degradation one light-time after it happened, at the
        same instant the telemetry that suffered it arrives. Through a blackout it
        holds its last-known value; the disconnect itself reaches a client on
        `comms.link`, which is not held.
      required:
        - modelId
        - modelName
      properties:
        modelId:
          type: string
          x-sitrep-unit: id
          description: The grading rule's id; `"unknown"` when nothing graded the link.
        modelName:
          type: string
          x-sitrep-unit: text
          description: |-
            The grading rule's display name, so a surface can say which grading is in
            play.
        level:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            The rating: 0 pristine, 1 unusable, absent when unrated. Never outside that
            range, and never a NaN: an arithmetic that overshot is clamped to the end it
            overshot, and one that failed to resolve arrives absent.
    CommsDelay:
      type: object
      description: |-
        The `comms.delay` payload: the one-way signal delay to the active vessel,
        gated by the `comms.signalDelay.enabled` setting. `CommsDelay.oneWaySeconds`
        distinguishes two DIFFERENT "no delay" cases by value, never by one
        overloaded sentinel:

        - **null**: no measurable `CommsPath` (no path home, or incomplete hop
          geometry). There is nothing to measure, so nothing is reported.
          `CommsDelay.source` is `CommsDelaySource.None`.
        - **0**: the delay feature is disabled (`comms.signalDelay.enabled =
          false`). A genuine "zero delay applied", not an absence.
          `CommsDelay.source` is also `CommsDelaySource.None` here: the two cases
          share the same `Source` and are told apart only by whether the value is
          null.
        - a real number: `CommsDelay.source` is `CommsDelaySource.SignalDelay`, a
          light-time computed over the elected backend's hop geometry.

        One zero names its own reason instead of sharing `CommsDelaySource.None`:
        `CommsDelaySource.NoCommsModel`, which is what tells a client that a board
        showing no path and no relay graph is a save with the CommNet difficulty
        option off, not a craft in a permanent blackout: the blackout reports `null`
        here and `connected:false` on `CommsLink`, and this reports `0` and
        `connected:true`.

        DELAYED, like the telemetry it describes. A light-time is measured over the
        route a signal actually took, so the figure that reaches an operator is the
        delay as it WAS when the light left, and a craft whose delay has grown says
        so one light-time after it grew. Read it as an observation rather than as
        the current state of the link.
      required:
        - source
        - meta
      properties:
        oneWaySeconds:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            The one-way light-time to the command centre, seconds. See this type's own
            summary for the null/zero split, which is the whole discriminator: null is
            "nothing measurable", 0 is a measured or applied zero.

            **Carried forward by re-measuring ONE leg of the route.** A delay is the
            whole route's length over the speed light travels at, and almost none of
            that route changes between the instant the light left and the instant it is
            read: every hop except the first joins two ground stations, or a station and
            a relay, or two relays, none of which move appreciably against each other on
            a telemetry timescale. So their measured lengths carry forward as the sum
            they already were, and only the FIRST hop, the one with the craft on one
            end, is re-derived: `(route - firstHop + |craft - peer|) / c`, the craft
            propagated on `@vessel.orbit` and its peer placed from
            `@commandCentre.roster`, whose latitude and longitude are body-fixed and so
            need the rotation phase on `@system.bodies`.

            Declared for a route whose first hop ends at a GROUND STATION, which is the
            direct link and the common case. A first hop ending at a RELAY needs that
            relay's own elements, which ride the per-vessel `fleet.<guid>.orbit` channel
            under a guid not known until the route arrives; an input here is a Topic id
            resolved against the declared set, so there is no way to name it and no
            promise made about it. A client reading a relayed route gets an honest
            refusal naming that channel rather than a modelled number.

            The `CommsDelay.source` is an input because two of its three members are a
            zero that means something other than "no distance": delay is switched off,
            or the save models no comms network. Neither stops being true as the craft
            moves, so only `CommsDelaySource.SignalDelay` is carried forward.
        source:
          description: Why `CommsDelay.oneWaySeconds` has the value it has; see `CommsDelaySource`.
          allOf:
            - $ref: "#/components/schemas/CommsDelaySource"
              x-sitrep-unit: enum
        meta:
          description: The payload's provenance (`"vessel:<guid>"` or `"game"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    CommsDelaySource:
      type: integer
      description: Why `CommsDelay.oneWaySeconds` has the value it has.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: None
          description: |-
            No delay measured: either there is no measurable path (the value is null) or
            delay is switched off (the value is 0).
        - const: 1
          title: SignalDelay
          description: A light-time computed over the route's hop geometry.
        - const: 2
          title: NoCommsModel
          description: |-
            Zero, because this save models no comms network AT ALL: the stock CommNet
            difficulty option is off, so there are no ground stations, no relay graph
            and no path to measure a light-time over. Control reaches a craft directly,
            from anywhere, instantly.

            A POSITIVE FACT, and the reason it is a member here rather than a null
            `CommsDelay.oneWaySeconds`: null means "there is a comms model and it can
            measure nothing right now", which is a permanent blackout and the exact
            opposite prognosis. This is what distinguishes the two ON THE WIRE. A save
            with no comms model reports this alongside `connected:true`, so the channel
            keeps arriving with nothing held back, where a real blackout reports null
            and stops.
    CommsHop:
      type: object
      description: |-
        One ordered hop toward home in the control path. Per-hop RealAntennas facts
        are not fields on this shared shape: the forward band rate rides the
        RealAntennas Uplink's own `realantennas.hopRates` channel (a per-hop
        annotation keyed by these same node ids, joined onto the route client-side),
        and the other RealAntennas per-hop facts ride `CommsHop.extensions` under
        `"realantennas"`.

        Ground stations carry their OWN name in `CommsHop.from` and `CommsHop.to`
        (RSS/RealAntennas fly a dozen of them), not a single shared "home" label:
        two consecutive samples both showing a one-hop direct link, one to Kourou
        and one to Canberra, are a STATION HANDOFF, not one station whose range
        changed.
      required:
        - from
        - to
        - fromIsHome
        - toIsHome
        - kind
      properties:
        from:
          type: string
          x-sitrep-unit: id
          description: |-
            The node id at the end of the hop nearer the vessel, in the same id space as
            `CommsNetworkNode.id`: a vessel's persistent id for a craft, the station's
            own name for a ground station.
        to:
          type: string
          x-sitrep-unit: id
          description: |-
            The node id at the end of the hop nearer home, in the same id space as
            `CommsHop.from`.
        fromIsHome:
          type: boolean
          x-sitrep-unit: flag
          description: True when the `CommsHop.from` end is a ground station.
        toIsHome:
          type: boolean
          x-sitrep-unit: flag
          description: True when the `CommsHop.to` end is a ground station.
        kind:
          description: |-
            `CommsHopKind.Home` when either end is a ground station, otherwise
            `CommsHopKind.Relay`. One value for the whole hop, so read
            `CommsHop.fromIsHome` and `CommsHop.toIsHome` for which end.
          allOf:
            - $ref: "#/components/schemas/CommsHopKind"
              x-sitrep-unit: enum
        distanceMeters:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Straight-line distance between the two endpoints, in metres: the geometry
            the signal delay's light-time is computed over. Null when the backend cannot
            supply per-hop geometry, never 0.
        extensions:
          type:
            - object
            - "null"
          description: |-
            The provider-namespaced extension bag: how the elected comms backend carries
            per-hop facts this shared shape does not declare (see
            ProviderExtensionBagAttribute for the whole mechanism). Absent under the
            stock CommNet backend, which has nothing stock does not already say; a
            RealAntennas install fills `Extensions["realantennas"]` with band, tech
            level, modulation, encoder, required Eb/N0, beamwidth, EC draw and the
            reverse-direction rate, typed by the RealAntennas client's own
            `RealAntennasHopExt`. It rides `comms.path`, so it is Delayed like that
            channel.
          additionalProperties: true
    CommsHopKind:
      type: integer
      description: |-
        Whether a comms node is a ground station, or whether a hop touches one.
        Carried by `CommsHop.kind` and `CommsNetworkNode.kind`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Home
          description: A ground station, or a hop with a ground station at either end.
        - const: 1
          title: Relay
          description: A vessel node (the active craft included), or a hop between two vessels.
        - const: 2
          title: Vessel
          description: |-
            Not reported by the shipped backends: vessel nodes, the active craft
            included, arrive as `CommsHopKind.Relay`.
    CommsLink:
      type: object
      description: |-
        The `comms.link` payload: the one statement a client should read for "is
        there a control link home right now?". Read `comms.link.connected` for that
        question rather than any raw `comms.*` observation such as
        `CommsConnectivity`.

        **Delayed, and exempt from the freeze.** The link state is what reports a
        signal-loss freeze, so it cannot be frozen by it. It reveals a disconnect at
        `T+delay` (you learn of the outage one light-time after it happens) and
        keeps reporting `connected:false` through the blackout, so a "no signal"
        indicator flips at the correct delayed instant. The `VesselComms`
        observations (signal strength, control state) are Delayed and DO freeze:
        they hold their last value through the outage.
      required:
        - connected
        - meta
      properties:
        connected:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True while the active vessel has a control link home, as of one light-time
            ago; false through a blackout.
        meta:
          description: The payload's provenance (`"vessel:<guid>"` or `"game"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    CommsNetwork:
      type: object
      description: |-
        The `comms.network` payload: always emitted, the network as the elected
        comms backend sees it from the active vessel. The shipped backends report
        the nodes and edges of the vessel's control path, so the graph is empty when
        there is no path home.
      required:
        - nodes
        - edges
        - meta
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/CommsNetworkNode"
          description: Every node in the graph, each `CommsNetworkNode.id` once. Never null.
        edges:
          type: array
          items:
            $ref: "#/components/schemas/CommsNetworkEdge"
          description: Every edge in the graph. Never null.
        meta:
          description: The payload's provenance (`"vessel:<guid>"` or `"game"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    CommsNetworkEdge:
      type: object
      description: |-
        One edge in the `CommsNetwork` relay graph, joining two
        `CommsNetworkNode.id` values.
      required:
        - a
        - b
        - active
      properties:
        a:
          type: string
          x-sitrep-unit: id
          description: The `CommsNetworkNode.id` of the end nearer the vessel.
        b:
          type: string
          x-sitrep-unit: id
          description: The `CommsNetworkNode.id` of the end nearer home.
        active:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when the edge carries the vessel's current control path. The shipped
            backends report only the control path's edges, so every edge they emit is
            true.
    CommsNetworkNode:
      type: object
      description: |-
        One node in the `CommsNetwork` relay graph. `CommsNetworkNode.displayName`
        carries the label and `CommsNetworkNode.kind` carries home-ness, so nothing
        has to read meaning out of `CommsNetworkNode.id`.
      required:
        - id
        - displayName
        - kind
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            A unique, stable join key in the same id space `CommsHop.from` and
            `CommsHop.to` use: a vessel's persistent id for a craft, the station's own
            name for a ground station. Never a vessel's display name, which two craft
            can share.
        displayName:
          type: string
          x-sitrep-unit: text
          description: "The node's human-facing name: the vessel's name, or the ground station's."
        kind:
          description: "`CommsHopKind.Home` for a ground station, `CommsHopKind.Relay` for a vessel."
          allOf:
            - $ref: "#/components/schemas/CommsHopKind"
              x-sitrep-unit: enum
    CommsOcclusion:
      type: object
      description: |-
        The `comms.occlusion` payload: always present, sourced from the elected
        comms backend. The declared occlusion model, named, with its rule already
        applied to every celestial body the game knows about.

        TRUE-NOW like the rest of the comms family, and for a stronger reason than
        most: this is not an observation of the vessel at all, it is a statement
        about the universe's geometry and the rule the elected backend applies to
        it. Delaying it would mean a predictor computing tomorrow's blackout from
        yesterday's model.

        Effectively static within a session: the body set does not change and the
        multipliers change only if the player edits the difficulty settings. An
        unchanged declaration is not re-sent, so the channel costs a keyframe and
        nothing else.
      required:
        - modelId
        - modelName
        - bodies
      properties:
        modelId:
          type: string
          x-sitrep-unit: id
          description: |-
            The elected model's ICommsOcclusionModel.ModelId; `"unknown"` when no
            backend is elected.
        modelName:
          type: string
          x-sitrep-unit: text
          description: The elected model's display name, so a UI can say which geometry is in play.
        bodies:
          type: array
          items:
            $ref: "#/components/schemas/CommsOcclusionBody"
          description: |-
            Every known celestial body, with the model applied. Empty before the game
            has populated a body list, never null.
    CommsOcclusionBody:
      type: object
      description: |-
        One body's occlusion geometry, as resolved by the elected model.
        `CommsOcclusionBody.index` matches `BodyEntry.Index` on `system.bodies`
        (both are `CelestialBody.flightGlobalsIndex`), so a consumer joins the two
        without name-matching.

        Both radii ride the wire: `CommsOcclusionBody.radiusMeters` is what the rock
        measures and `CommsOcclusionBody.occludingRadiusMeters` is what the backend
        treats it as. Carrying both keeps the difference visible (and the multiplier
        derivable) without asking any consumer to apply one.
      required:
        - index
        - radiusMeters
        - hasAtmosphere
        - occludingRadiusMeters
      properties:
        index:
          type: number
          x-sitrep-unit: id
          description: |-
            The body's `CelestialBody.flightGlobalsIndex`: the join key onto
            `BodyEntry.Index` in `system.bodies`.
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The body's name, e.g. `"Kerbin"`; `null` when unread. Display only: join on
            `CommsOcclusionBody.index`.
        radiusMeters:
          type: number
          x-sitrep-unit: m
          description: |-
            The body's own mean radius (`CelestialBody.Radius`). `0` when the radius has
            not been read yet, and then `CommsOcclusionBody.occludingRadiusMeters` is
            `0` too: the body blocks nothing.
        hasAtmosphere:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the body has an atmosphere, which selects the multiplier a
            scaled-radius model applies. `false` when unread.
        occludingRadiusMeters:
          type: number
          x-sitrep-unit: m
          description: What the elected backend treats as blocking a radio path through this body.
    CommsPath:
      type: object
      description: |-
        The `comms.path` payload: always present, sourced from the elected comms
        backend. Ordered hops from the active vessel home. An empty `CommsPath.hops`
        means no path home, a real control-loss state rather than missing data.

        DELAYED, and NEVER RECKONABLE. The route is the one the arriving signal
        took, so it reveals with the telemetry that came down it. It carries no
        forward model and cannot be given one: a route changes DISCRETELY (a relay
        drops below the horizon and the whole chain re-solves to different hops),
        and every reckoning basis moves a continuous quantity. What you are shown is
        the topology as observed; nothing may extrapolate it forward.
      required:
        - hops
      properties:
        hops:
          type: array
          items:
            $ref: "#/components/schemas/CommsHop"
          description: |-
            The hops in order, the first starting at the active vessel and the last
            ending at home. Empty when there is no path home, never null.
    CommsSignal:
      type: object
      description: |-
        The `comms.signal` payload: always present, sourced from the elected comms
        backend. A strength from 0 to 1 whose meaning depends on the backend: stock
        CommNet reports a coarse range fraction, RealAntennas a link-budget-derived
        value.

        A save with the stock CommNet difficulty option off models no link budget at
        all and reports 1 here: nothing attenuates a link that is not modelled. A
        reader that needs to know this is not a grading has
        `CommsDelaySource.NoCommsModel` on `comms.delay`, which is the one
        discriminator for the whole family rather than a second one per field.
      required:
        - strength
      properties:
        strength:
          type: number
          x-sitrep-unit: ratio
          description: |-
            Link strength from 0 to 1, in the backend's own terms (see this type's
            summary), so compare values only within one install. 0 when no link state
            could be read.
    ContractActionArgs:
      type: object
      description: |-
        Args shared by `career.contract.accept`/`decline`/`cancel`: the contract's
        stable `ContractID` as a string, the same id `career.status` publishes for
        each contract as `contracts[].id`. Which of the three verbs is valid depends
        on the contract's current state (accept/decline require an offered contract,
        cancel an active one); an out-of-state request comes back
        `CommandErrorCode.ModeUnavailable`.
      required:
        - contractId
      properties:
        contractId:
          type: string
          x-sitrep-unit: id
          description: |-
            The contract to act on: its KSP `ContractID` as a string, as
            `career.status`'s `contracts[].id` carries it.
    ControlFrame:
      type: object
      description: |-
        The frame the game's own navigation view is expressed in: what the player is
        looking at, and what a burn expressed relative to the control frame is held
        fixed against.

        This is not a widget's own read frame, which nothing else sees. It belongs
        to the game, there is one at a time, and it can be written as well as read
        (`SetControlFrameArgs`), so a command centre can put the player's view where
        a plan is being discussed.

        Bodies are named by `bodyName`, the key of every other body table on the
        wire, `system.bodies` included.

        A pulsating frame turns about two groups of bodies, and its origin is
        defined by the mass of each whole group, so the sets travel as well as the
        pair. `ControlFrame.primaryBodies` always leads with
        `ControlFrame.primaryBody`: take the heads for the pair, or the sets to
        compute the frame.

        The whole payload is `null` when the frame could not be read. With stock KSP
        the frame is always `ControlFrameKind.BodyCentredInertial` about the active
        vessel's reference body.
      required:
        - kind
      properties:
        kind:
          description: |-
            The kind of frame. `ControlFrameKind.Unspecified` for the target frame,
            which has no kind.
          allOf:
            - $ref: "#/components/schemas/ControlFrameKind"
              x-sitrep-unit: enum
        centreBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The `bodyName` the frame is centred on, or `null` when it has none. The
            rotating frames are defined by their pair rather than by a centre.
        primaryBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The `bodyName` a rotating frame turns about. `null` for the centred frames.
        secondaryBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The `bodyName` a rotating frame is anchored to. `null` for the centred
            frames.
        primaryBodies:
          type:
            - array
            - "null"
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            Every body on the primary side, by `bodyName`, leading with
            `ControlFrame.primaryBody`. `null` when the head is the whole side, never an
            empty array.
        secondaryBodies:
          type:
            - array
            - "null"
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            Every body on the secondary side, by `bodyName`, leading with
            `ControlFrame.secondaryBody`. `null` when the head is the whole side, never
            an empty array.
        targetFrameSelected:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            `true` when the frame is defined against the current target rather than
            against a body. This sits beside `ControlFrame.kind` rather than inside it.
            Closest approach is computed only in this frame, and apsides do not exist in
            it. `null` when the source did not say.
        targetId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The id of the target vessel the frame is defined against, when it is a
            target frame; otherwise `null`.
        settableFrames:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ControlFrameOption"
          description: |-
            Every frame `system.frame.set` can put the view in, each named exactly as
            the command takes it. Empty when the view cannot be moved at all, which is
            stock; `null` when the source did not say. Either way there is nothing to
            offer: a frame not listed here is one the command will refuse.
    ControlFrameKind:
      type: integer
      description: |-
        The kinds of reference frame a control frame can be: the five frame types an
        n-body producer constructs, plus `ControlFrameKind.Unspecified`.

        This is a superset of the frames a widget can draw in, which cover three of
        these. A control frame outside that subset is a real state, not an error: a
        widget set to follow the control frame then resolves to nothing.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Unspecified
          description: |-
            No kind was stated, including for the target frame (see
            `ControlFrame.targetFrameSelected`).
        - const: 1
          title: BodyCentredInertial
          description: Centred on a body, axes fixed against the stars.
        - const: 2
          title: BodyCentredBodyDirection
          description: |-
            Centred on a body, one axis held towards another body. What "parent
            direction" names on the read side.
        - const: 3
          title: BarycentricRotating
          description: Turning with the barycentre of two bodies.
        - const: 4
          title: RotatingPulsating
          description: |-
            Turning with a pair of bodies AND holding the separation of their two mass
            centres fixed, so a transfer between them draws the same shape whatever
            their current distance.
        - const: 5
          title: BodySurface
          description: Centred on a body and turning with its surface.
    ControlFrameOption:
      type: object
      description: |-
        One frame the navigation view can be put in, named the way
        `system.frame.set` takes it: send it back as the command's args unchanged.
        The pair is named by its heads, never by its sets.
      required:
        - kind
      properties:
        kind:
          description: The kind of frame. `ControlFrameKind.Unspecified` for the target frame.
          allOf:
            - $ref: "#/components/schemas/ControlFrameKind"
              x-sitrep-unit: enum
        centreBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The `bodyName` the frame is centred on, or `null` for the rotating frames.
        primaryBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The `bodyName` a rotating frame turns about. `null` for the centred frames.
        secondaryBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The `bodyName` a rotating frame is anchored to. `null` for the centred
            frames.
        targetFrameSelected:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            `true` for the target frame, which sits beside `ControlFrameOption.kind`
            rather than inside it.
    ControlState:
      type: integer
      description: |-
        KSP's `VesselControlState`, carried by name: what is controlling the vessel
        (a probe core, a kerbal) and how much control it has (none, partial, full).
        Mirrors the stock member names; `ControlState.Unknown` covers any name the
        mod does not recognise.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: None
          description: No control.
        - const: 1
          title: Probe
          description: Controlled by a probe core.
        - const: 2
          title: Kerbal
          description: Controlled by a kerbal.
        - const: 3
          title: Partial
          description: Partial control.
        - const: 4
          title: Full
          description: Full control.
        - const: 5
          title: ProbeNone
          description: A probe-controlled vessel with no control.
        - const: 6
          title: ProbePartial
          description: |-
            A probe-controlled vessel with partial control, typically without a
            connection home.
        - const: 7
          title: ProbeFull
          description: A probe-controlled vessel with full control.
        - const: 8
          title: KerbalNone
          description: A kerbal-controlled vessel with no control.
        - const: 9
          title: KerbalPartial
          description: A kerbal-controlled vessel with partial control.
        - const: 10
          title: KerbalFull
          description: A kerbal-controlled vessel with full control.
        - const: 11
          title: Unknown
          description: A state name the mod does not recognise.
    CrashFlightStats:
      type: object
      description: |-
        Per-flight statistics accumulated across the whole flight up to the crash,
        `CrashReport.flightStats`. Maxima and distances are sampled from the active
        vessel at the telemetry cadence, so they are approximate. A vessel that was
        never sampled reports zero for every accumulated value.
      required:
        - kerbalsKilled
        - partsLost
        - flightEndMode
        - highestSpeedOverLand
        - missionEnd
        - highestGee
        - highestAltitude
        - totalDistance
        - missionTime
        - highestSpeed
        - groundDistance
        - liftOff
      properties:
        kerbalsKilled:
          type: number
          x-sitrep-unit: count
          description: Kerbals killed earlier in the flight (before the final crash).
        partsLost:
          type: number
          x-sitrep-unit: count
          description: Cumulative parts destroyed across the flight.
        flightEndMode:
          type: string
          x-sitrep-unit: text
          description: How the flight ended. Always `"CATASTROPHIC_FAILURE"` on a crash record.
        highestSpeedOverLand:
          type: number
          x-sitrep-unit: m/s
          description: |-
            The highest surface speed (`Vessel.srfSpeed`) reached while not splashed
            down, in m/s. Flight over water counts; only samples taken while splashed
            are excluded.
        missionEnd:
          type: boolean
          x-sitrep-unit: flag
          description: Whether the mission has ended. Always `true` on a crash record.
        highestGee:
          type: number
          x-sitrep-unit: g
          description: The highest g-force (`Vessel.geeForce`) sampled during the flight.
        highestAltitude:
          type: number
          x-sitrep-unit: m
          description: |-
            The highest altitude above sea level (`Vessel.altitude`) sampled during the
            flight, in metres.
        totalDistance:
          type: number
          x-sitrep-unit: m
          description: |-
            Distance travelled relative to the surface, in metres: surface speed
            integrated over UT between samples. A gap of more than 10 s between samples
            (a warp jump, a quickload) is skipped rather than integrated.
        missionTime:
          type: number
          x-sitrep-unit: s
          description: |-
            Mission time (seconds since launch) at the crash: the highest
            `Vessel.missionTime` sampled.
        highestSpeed:
          type: number
          x-sitrep-unit: m/s
          description: |-
            The highest surface speed (`Vessel.srfSpeed`) sampled during the flight, in
            m/s.
        groundDistance:
          type: number
          x-sitrep-unit: m
          description: |-
            Horizontal distance travelled over the surface, in metres: horizontal
            surface speed integrated over UT between samples, with the same 10 s gap
            rule as `CrashFlightStats.totalDistance`.
        liftOff:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            `true` once the vessel's mission clock has started, i.e. it has left the
            launch site.
    CrashPartLost:
      type: object
      description: "One part lost in a crash: an entry of `CrashReport.partsLost`."
      required:
        - partId
        - partName
        - partTitle
        - msg
      properties:
        partId:
          type: number
          x-sitrep-unit: id
          description: The part's `flightID`.
        partName:
          type: string
          x-sitrep-unit: text
          description: The part's `partInfo.name` (e.g. `"mk1pod.v2"`).
        partTitle:
          type: string
          x-sitrep-unit: text
          description: The part's `partInfo.title` (e.g. `"Mk1 Command Pod"`).
        msg:
          type: string
          x-sitrep-unit: text
          description: "Destruction message for this part: often empty."
    CrashReport:
      type: object
      description: |-
        The payload for the `crash.lastCrash` channel: a single "last notable crash"
        record for the current save, delivered on the Delivery.ReliableOrdered event
        lane, so a late subscriber receives the most recent record. Every field is
        captured from the crashed vessel at the moment of the crash.
      required:
        - vesselId
        - eventKind
        - what
        - vesselType
        - msg
        - latitude
        - longitude
        - partsLost
        - body
        - flightStats
        - vesselName
        - events
        - kerbalsKilled
        - situation
        - crewAboard
        - altitude
        - ut
      properties:
        vesselId:
          type: string
          x-sitrep-unit: id
          description: The crashed vessel's stable id (`Vessel.id` as a string GUID).
        eventKind:
          type: string
          x-sitrep-unit: id
          description: "Which detector fired: `CrashSplashdown` / `Destroyed` / `Crash`."
        what:
          type: string
          x-sitrep-unit: text
          description: |-
            The colliding object's name (`EventReport.other`): empty for a non-collision
            death.
        vesselType:
          type: string
          x-sitrep-unit: id
          description: The crashed vessel's `VesselType` name (e.g. `"Ship"`).
        msg:
          type: string
          x-sitrep-unit: text
          description: "The detector's message (`EventReport.msg`): often empty."
        latitude:
          type: number
          x-sitrep-unit: °
          description: The vessel's latitude at the crash (`Vessel.latitude`), in degrees.
        longitude:
          type: number
          x-sitrep-unit: °
          description: The vessel's longitude at the crash (`Vessel.longitude`), in degrees.
        partsLost:
          type: array
          items:
            $ref: "#/components/schemas/CrashPartLost"
          description: Parts lost in the destroying event.
        body:
          type: string
          x-sitrep-unit: text
          description: Name of the body the crash happened on (`mainBody.bodyName`).
        flightStats:
          description: Per-flight statistics accumulated up to the crash.
          allOf:
            - $ref: "#/components/schemas/CrashFlightStats"
        vesselName:
          type: string
          x-sitrep-unit: text
          description: The crashed vessel's name (`Vessel.vesselName`); empty when KSP had none.
        events:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            The vessel's flight-event log (liftoff, staging, the crash line), oldest
            first, each line `[HH:MM:SS]: message` stamped with mission time. Holds at
            most the 200 most recent lines.
        kerbalsKilled:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: "Names of the kerbals lost in this crash: everyone aboard at the crash."
        situation:
          type: string
          x-sitrep-unit: text
          description: |-
            The vessel's flight situation at the crash (`Vessel.Situations` name, e.g.
            `"FLYING"`).
        crewAboard:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: Names of the crew aboard at the crash.
        altitude:
          type: number
          x-sitrep-unit: m
          description: |-
            The vessel's altitude above sea level at the crash (`Vessel.altitude`), in
            metres.
        ut:
          type: number
          x-sitrep-unit: ut
          description: Universal time of the crash capture.
    CrewMember:
      type: object
      description: |-
        One crew member aboard the active vessel, in `VesselCrew.crew`, from KSP's
        `ProtoCrewMember`. Every field is nullable: an absent value is null, never a
        sentinel.
      properties:
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The kerbal's name (`ProtoCrewMember.name`), which is also their roster key.
        trait:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The kerbal's career trait (`ProtoCrewMember.trait`), e.g. `"Pilot"`,
            `"Engineer"`, `"Scientist"` or `"Tourist"`.
        experienceLevel:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            The kerbal's experience level (`ProtoCrewMember.experienceLevel`), 0 to 5 in
            stock.
        type:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The kerbal's `KerbalType` member name: `"Crew"`, `"Tourist"`, `"Applicant"`
            or `"Unowned"` in stock.
        rosterStatus:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The kerbal's `RosterStatus` member name: `"Available"`, `"Assigned"`,
            `"Dead"` or `"Missing"` in stock. A kerbal aboard a vessel is normally
            `"Assigned"`.
        carrying:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/InventoryItem"
          description: |-
            What this kerbal is personally carrying, from their own
            `ModuleInventoryPart`.

            Distinct from `vessel.inventory`, which is what is aboard and where. This is
            what this kerbal, with the trait and experience level above, has to hand for
            a job right now without anything being fetched first.

            Null when the crew source could not read inventories at all, which is not
            the same as an empty list, meaning they are carrying nothing.
        slots:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            The kerbal's own slot count, stock default 2, one of which usually holds a
            parachute.
        packedVolumeLimit:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Their packed-volume limit, stock default 40 in KSP's own cargo-volume unit.
            With a repair kit at 5, this is what actually bounds how many they can
            carry.
        packedVolumeUsed:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Packed volume they are currently using, same unit as the limit.
    CrewRosterEntry:
      type: object
      description: |-
        One kerbal in the `spaceCenter.crewRoster` channel (the hired-crew roster:
        KSP's `KerbalRoster.Crew`, owned crew that is either available or currently
        assigned to a mission), and the same shape for every entry in
        `AstronautComplexInfo.applicants`: ONE shape for a kerbal whether hired or
        still a candidate.

        The `spaceCenter.crewRoster` channel is a BARE ARRAY of these entries, one
        per crew member keyed by `CrewRosterEntry.name`. The whole payload is `null`
        (not an empty array) when no sample has arrived yet, which tells "no data
        yet" apart from "zero crew".

        Held at the home command, like `LaunchSiteEntry`.
      properties:
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Kerbal name (`ProtoCrewMember.name`): the id the hire command resolves
            against the live applicant pool.
        trait:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Specialisation (`ProtoCrewMember.trait`):
            `"Pilot"`/`"Engineer"`/`"Scientist"`/`"Tourist"`.
        experienceLevel:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Experience level (`ProtoCrewMember.experienceLevel`), 0 to 5 (0 for a fresh
            applicant).
        available:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the kerbal can be assigned to a flight today.

            **The field to branch on when all a client needs is yes or no.** It is
            derived from EVERY axis the derivation knows about, by CrewStandings.CanFly,
            which is a whitelist: only `Available` and `Applicant` are free, so a
            standing added to `CrewStanding` later reads as unavailable here without
            anybody editing a consumer.

            A backend may override it outright.
        unavailableReason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Why the kerbal can't fly, in prose: `Assigned` reads "On mission", `Resting`
            reads "Standing down", and every other blocking standing reads its own name.
            Empty string when `CrewRosterEntry.available` is true. A backend may
            override the wording.

            **No date, ever.** The when rides `CrewRosterEntry.standingEndsAtUt` as a
            `ut` value, because a date formatted here would be formatted in the mod's
            idea of a calendar, and the client owns the calendar. This is the only
            string on the payload a client could not re-render.
        standing:
          description: |-
            The kerbal's standing, as the dashboard means it: the field to BRANCH on.
            The elected ICrewStandingBackend's reading where it has one, otherwise
            derived by the stock backend from every axis KSP exposes.

            The roster status alone is not enough: an applicant has none, and a kerbal
            standing down still reads `Available` there. See `CrewStanding`.
          anyOf:
            - $ref: "#/components/schemas/CrewStanding"
              x-sitrep-unit: enum
            - type: "null"
        standingEndsAtUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the kerbal's unavailability lapses, as universal time: the rest
            period's end for `Resting`, or whatever end the elected backend quotes.
            Absent when there is no scheduled end, which is most of the time.

            Read with `CrewRosterEntry.unavailableReason` to say why a kerbal cannot fly
            AND until when. The two are separate fields so the client formats the date
            in its own calendar.
        situation:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            `CrewRosterEntry.standing`'s display LABEL: its enum name, or `"Applicant"`
            for a hireable candidate. Text for an operator, never a branch: compare
            `CrewRosterEntry.standing` instead.
        situationOrdinal:
          description: |-
            KSP's OWN ordinal: `(int)ProtoCrewMember.rosterStatus`, typed to
            `KspRosterStatus`, whose members mirror KSP's numbering.

            A truthful read of the game field and nothing more, kept because what KSP
            itself holds is worth knowing and because a command core dispatches is
            arbitrated against this value. It is NOT the field to branch on: it reads
            `Available` for a kerbal standing down. `CrewRosterEntry.standing` is the
            field to branch on.

            `null` for an APPLICANT, and that is a real distinction rather than a
            missing value: an applicant is not in the roster, so it has no
            `RosterStatus` at all, and `CrewRosterEntry.standing` carries
            `CrewStanding.Applicant` instead. Use `CrewRosterEntry.isApplicant` to tell
            the two apart. Also `null` when the capture carried no status.
          anyOf:
            - $ref: "#/components/schemas/KspRosterStatus"
              x-sitrep-unit: enum
            - type: "null"
        inactive:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the kerbal is standing down rather than on duty
            (`ProtoCrewMember.inactive`): KSP's own field, published beside the derived
            standing the way `CrewRosterEntry.situationOrdinal` is.

            **Not the field to branch on.** It is an INPUT to the derivation: a kerbal
            standing down has roster status `Available`, and this flag is what turns
            that into `CrewStanding.Resting` with `CrewRosterEntry.available` false.

            The field is KSP's, so it goes on the wire on every install and reading it
            costs nothing.
        inactiveUntilUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the stand-down ends (`ProtoCrewMember.inactiveTimeEnd`), as universal
            time. Absent when `CrewRosterEntry.inactive` is false: KSP leaves the field
            at whatever the last rest period set, so quoting it for a kerbal on duty
            would date a rest that is already over.
        isApplicant:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether this entry is a hireable candidate (`ProtoCrewMember.type ==
            KerbalType.Applicant`) rather than owned crew. Carried so a client never has
            to recognise the `"Applicant"` spelling of `CrewRosterEntry.situation` to
            know which channel it is reading.
        courage:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: Courage, 0 to 1 (`ProtoCrewMember.courage`), fixed when the kerbal is hired.
        stupidity:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            Stupidity, 0 to 1 (`ProtoCrewMember.stupidity`), fixed when the kerbal is
            hired.
        experience:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Raw experience points (`ProtoCrewMember.experience`), 0 for a fresh
            applicant.
        experienceLevelDelta:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            Progress toward the next rank, 0 to 1 (the computed
            `ProtoCrewMember.ExperienceLevelDelta`); `1` at max rank (5).
        roleDescription:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The role's stock tooltip description
            (`ProtoCrewMember.experienceTrait.Description`): the exact string the
            in-game Astronaut Complex shows, sourced from `Traits.cfg`.
        descriptionEffects:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The role's current-rank effects text
            (`ProtoCrewMember.experienceTrait.DescriptionEffects`): rank-aware, it
            changes as the kerbal is promoted. Reflects this kerbal's own rank today
            only; there is no fetchable "effects at another rank" preview.
    CrewStanding:
      type: integer
      description: |-
        What a kerbal's place on the books IS, as the dashboard means it: this
        contract's own vocabulary, not a mirror of any game enum.

        The roster-status members line up with `KspRosterStatus` in meaning but NOT
        in numbering, so never cast one to the other. `CrewStanding.Applicant` is a
        standing KSP expresses as a KerbalType rather than a RosterStatus, and it
        sits in one enumeration with the rest so "what is this kerbal's standing" is
        one value.

        Behind `spaceCenter.crewRoster[].standing`, and it is the field to branch
        on; see `CrewRosterEntry.situationOrdinal` for what the raw KSP ordinal
        beside it is still good for.

        **The numbering IS the reading order**: sorted by value, a crew surface
        reads free to fly, then committed, then off the books. The SDK's
        `CREW_STANDING_ORDER` is derived from it. A new member is inserted at its
        place in that order rather than appended.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Unknown
          description: |-
            No backend could say. Distinct from every member below, and never a stand-in
            for one: a capture that read no roster status at all reports this rather
            than guessing at Available.
        - const: 1
          title: Applicant
          description: A hireable candidate, not yet on the books.
        - const: 2
          title: Available
          description: On the books and free to fly.
        - const: 3
          title: Assigned
          description: On the books and currently crewing a vessel.
        - const: 4
          title: Resting
          description: |-
            On the books, standing down after a flight, and not assignable until the
            rest period ends. CrewStandingReading.StandingEndsAtUt carries its end.

            Derived from KSP's own `ProtoCrewMember.inactive`, so the stock backend
            reports it and every install gets it.
        - const: 5
          title: Dead
          description: "Killed: KSP's own `Dead` roster status."
        - const: 6
          title: Missing
          description: |-
            Missing: KSP's own `Missing` roster status, kept separate from
            `CrewStanding.Dead`.
    DeactivateStrategyArgs:
      type: object
      description: |-
        `career.strategy.deactivate`'s args: the strategy's stable
        `StrategyConfig.Name` id (see `ActivateStrategyArgs.strategyId`).
      required:
        - strategyId
      properties:
        strategyId:
          type: string
          x-sitrep-unit: id
          description: |-
            The active strategy to deactivate: its `StrategyConfig.Name`, as
            `career.status`'s `strategies[].id` carries it.
    DeployedEntry:
      type: object
      description: |-
        One entry in the `deployed.bases` channel payload: a Breaking Ground
        deployed-science experiment (`ModuleGroundExperiment`). The channel payload
        is a BARE ARRAY (`DeployedEntry[]`) or `null` when no loaded vessel carries
        a deployed experiment (including an install without Breaking Ground).

        Unlike the `science.*` channels, `deployed.bases` covers every LOADED
        vessel, not just the active one: a deployed cluster is its own ground
        vessel, so an entry normally describes a vessel other than the active one,
        named by `DeployedEntry.vesselName`. A cluster whose vessel is not loaded
        does not appear.

        Every field is nullable, and is `null` whenever the raw value is absent or
        could not be read.
      properties:
        vesselName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Name of the vessel carrying the experiment (KSP's `Vessel.vesselName`). A
            deployed cluster is its own vessel, so this is normally not the active
            vessel's name.
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Display title of the experiment part (the part's `partInfo.title`, or its
            internal name when that is missing).
        body:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Name of the body the carrying vessel orbits or sits on (its orbit's
            reference body). `null` when the vessel has no orbit.
        situation:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The carrying vessel's situation, KSP's `Vessel.situation` enum name (for
            example `LANDED`).
        biome:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Biome at the carrying vessel's current position on `DeployedEntry.body`.
            `null` when the body has no biome map.
        experimentId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The experiment's id (KSP's `ModuleGroundExperiment.experimentId`).
        scienceCompletedPercentage:
          type:
            - number
            - "null"
          x-sitrep-unit: "%"
          description: |-
            How far the experiment has progressed, in percent (KSP's
            `ModuleGroundExperiment.ScienceCompletedPercentage`).
        scienceTransmittedPercentage:
          type:
            - number
            - "null"
          x-sitrep-unit: "%"
          description: |-
            How much of the experiment's science has been transmitted, in percent (KSP's
            `ModuleGroundExperiment.ScienceTransmittedPercentage`).
        scienceValue:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            The science value KSP reports for the experiment
            (`ModuleGroundExperiment.ScienceValue`).
        scienceLimit:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            The experiment's science limit as KSP reports it
            (`ModuleGroundExperiment.ScienceLimit`). Compare against
            `DeployedEntry.scienceValue`.
        powerState:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            `ModuleGroundSciencePart.PowerState` verbatim: KSP's own words for the power
            state, for display. Do not branch on this.

            It is not an enum name, it is localised prose. The module assigns it from
            `Localizer` in `UpdateModuleUI()`, so the value is in whatever language the
            player runs KSP in, and it is only written when the part action window
            refreshes, so it can be a held value. `DeployedEntry.power` is the field to
            read.
        connectionState:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            `ModuleGroundSciencePart.ConnectionState` verbatim, for display. Localised
            prose on the same terms as `DeployedEntry.powerState`; read
            `DeployedEntry.controllerConnected` instead.
        power:
          description: |-
            The cluster's power state, derived from the same facts `UpdateModuleUI()`
            itself branches on (`DeployedScienceCluster.IsPowered` and
            `.ControllerPartEnabled`, the module's `Enabled` and `DeployedOnGround`)
            rather than parsed out of the sentence that method writes. This is the field
            to branch on, not `DeployedEntry.powerState`.

            `null` when the cluster could not be read at all, which is a third state and
            must not be read as either powered or unpowered.
          anyOf:
            - $ref: "#/components/schemas/DeployedPowerState"
              x-sitrep-unit: enum
            - type: "null"
        controllerConnected:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the experiment is attached to a controller cluster at all, the fact
            behind `DeployedEntry.connectionState`'s "Connected"/"Not Connected". `null`
            when it could not be determined.
        powerAvailable:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Power units the cluster's parts PRODUCE
            (`DeployedScienceCluster.PowerAvailable`), against
            `DeployedEntry.powerRequired`. Breaking Ground's own integral power scale
            summed over the cluster's parts: NOT electric charge, and not a rate.
            Available at or above required is what makes the cluster powered.

            `null` when the cluster could not be read, on the same terms as
            `DeployedEntry.power`. Zero is a real reading a live cluster holds while its
            panels are dark, so it must not stand in for absence.
        powerRequired:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Power units the cluster's parts REQUIRE
            (`DeployedScienceCluster.PowerRequired`). Same scale and same null rule as
            `DeployedEntry.powerAvailable`, the demand side of the balance.
        deployedOnGround:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the experiment part is deployed on the ground (KSP's
            `ModuleGroundSciencePart.DeployedOnGround`).
    DeployedPowerState:
      type: integer
      description: |-
        A deployed-science cluster's power state, defined by this contract rather
        than by KSP.

        KSP has no enum for this. `ModuleGroundSciencePart` carries the state as a
        localised sentence, so this reproduces the five outcomes `UpdateModuleUI()`
        distinguishes, derived from the booleans it reads rather than from the
        sentence it writes. It is an ordinal on the wire and a closed union on the
        client like every other enum in this contract.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Powered
          description: "Powered and working: the cluster reports `IsPowered`."
        - const: 1
          title: Unpowered
          description: Deployed and switched on, but the cluster has no power.
        - const: 2
          title: ControllerDisabled
          description: The cluster's CONTROLLER is switched off, so nothing is powered.
        - const: 3
          title: Disabled
          description: This experiment is switched off, or is not deployed on the ground.
        - const: 4
          title: NotConnected
          description: |-
            Attached to no cluster at all. Distinct from `DeployedPowerState.Unpowered`:
            there is nothing to supply power, rather than a supply that is empty.
    DockAlignment:
      type: object
      description: |-
        The `vessel.dock` channel payload: the relative position, velocity and
        coarse orientation between the active vessel's nearest free (undocked)
        docking port and the targeted docking port, for docking-alignment widgets.
        The whole payload is absent when docking is not relevant right now: nothing
        is targeted, the target is not a docking port, or the active vessel has no
        free port. It is never an old or zero-distance placeholder record, the same
        convention as `VesselTarget`.

        `DockAlignment.forwardDot` is the dot product of the two ports' forward
        (docking-axis) vectors: -1 means the ports face each other head-on (the
        alignment a dock needs), +1 means they point the same way. It is the raw dot
        product, so how to show it (for example as a percentage) is up to the
        widget.
      required:
        - relativePosition
        - relativeVelocity
        - distance
        - meta
      properties:
        relativePosition:
          type: object
          description: |-
            The target port's position relative to the own port (target minus own),
            metres.
          required:
            - x
            - y
            - z
          properties:
            x: &a1
              type: number
              x-sitrep-unit: m
            y: *a1
            z: *a1
        relativeVelocity:
          type: object
          description: The target port's velocity relative to the own port, m/s.
          required:
            - x
            - y
            - z
          properties:
            x: &a2
              type: number
              x-sitrep-unit: m/s
            y: *a2
            z: *a2
        distance:
          type: number
          x-sitrep-unit: m
          description: |-
            Metres: `DockAlignment.relativePosition`'s magnitude, provided directly so a
            widget does not have to derive it every frame.
        forwardDot:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Dot product of the own port's and target port's forward vectors, -1..1: -1
            facing head-on, +1 pointing the same way. Null only when either port's
            transform was unavailable this tick.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    ErrorMsg:
      type: object
      description: |-
        A request the mod could not carry out: a frame it could not read, an unknown
        command, a command whose provider has stopped working, a result or payload
        that could not be written, a subscription to a Topic nothing declares, or a
        `set-vantage` naming a command centre that is not active. Nothing about the
        game was decided, so there is no game reason to report.

        A command the game refused is not an error: it ran and said no, and that
        arrives as a `command-response` whose result has `success: false` and an
        `errorCode` from `CommandErrorCode`. That vocabulary never appears here.

        `ErrorMsg.requestId` is set when the error is about a command, and
        `ErrorMsg.topic` when it is about a subscription. `ErrorMsg.code` is a
        `FaultCode`, whose full list gives the sentence an operator reads for each.
        A client's own transport adds its own members to the same field, and the mod
        never sends those.
      required:
        - type
        - code
        - message
      properties:
        type:
          type: string
          const: error
          x-sitrep-unit: id
          description: The frame type, always `"error"`.
        requestId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The id of the command request this error is about, or null.
        topic:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The Topic this error is about, or null.
        code:
          description: |-
            Which fault: always a fault, never a refusal, since a command the game
            refused answers with a `command-response` instead.
          allOf:
            - $ref: "#/components/schemas/FaultCode"
              x-sitrep-unit: id
        message:
          type: string
          x-sitrep-unit: text
          description: |-
            The machinery's own account of what went wrong, for a log rather than an
            operator.
    EvaCrew:
      type: object
      description: |-
        Every kerbal currently outside a craft.

        A channel of its own so that a kerbal stepping out does not change what the
        vessel channels report: those stay with the craft they left, and this
        carries what is true of the kerbal.

        An empty list is a real reading: nobody is outside. The channel is absent
        only before anything has been captured.
      required:
        - count
        - kerbals
      properties:
        count:
          type: number
          x-sitrep-unit: count
          description: |-
            How many kerbals are outside, so a reader need not count to know whether to
            draw anything.
        kerbals:
          type: array
          items:
            $ref: "#/components/schemas/EvaKerbal"
          description: One entry per kerbal on EVA. Never null; empty when nobody is outside.
    EvaKerbal:
      type: object
      description: |-
        One kerbal currently outside a craft, on the `eva.crew` channel.

        A kerbal on EVA is a vessel in KSP's model, with its own id, so it already
        appears on `system.vessels` and on its own `fleet.` topics. What is here and
        nowhere else is the suit: what it is carrying, what it can do, and whether
        the place it is standing in would kill the wearer without it.

        Every field is `null` when the value could not be read. Absence is never a
        zero: a kerbal whose propellant could not be read is not a kerbal with an
        empty tank.
      properties:
        kerbalVesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The kerbal's own vessel id, the same guid `system.vessels` carries for it.
        parentVesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The vessel id of the craft this kerbal stepped out of, or `null` when that
            is not known (the step-out was not recorded, or the craft has since gone).

            This is the vessel the mod goes on reporting as active while they are
            outside, so a reader that follows the active vessel sees no discontinuity
            when a kerbal steps out.
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The kerbal's name, from the EVA vessel's `GetName()`.
        situation:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: KSP's own situation name for the kerbal (`FLYING`, `LANDED`, ...).
        propellantAmount:
          type:
            - number
            - "null"
          x-sitrep-unit: units
          description: EVA propellant remaining in the pack.
        propellantCapacity:
          type:
            - number
            - "null"
          x-sitrep-unit: units
          description: |-
            What the pack holds when full, so a reader can draw a fraction without
            knowing the model.
        hasJetpack:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether this kerbal has a jetpack at all: without one the propellant figures
            describe nothing.
        jetpackDeployed:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the jetpack is switched on (KSP's `KerbalEVA.JetpackDeployed`).
        jetpackIsThrusting:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the pack is firing right now, which is the only signal that a kerbal
            is under thrust.
        onALadder:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the kerbal is on a ladder (KSP's `KerbalEVA.OnALadder`).
        lampOn:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the suit's helmet lamp is on (KSP's `KerbalEVA.lampOn`).
        visorState:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: KSP's own visor state name, from `KerbalEVA.VisorState`.
        willDieWithoutHelmet:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether removing the helmet here would kill this kerbal, from
            `KerbalEVA.WillDieWithoutHelmet()`.

            Nothing else on the wire says whether the place a kerbal is standing in is
            survivable without a helmet.
        canSafelyRemoveHelmet:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the helmet can come off here and now, from
            `KerbalEVA.CanSafelyRemoveHelmet()`. A stricter test than
            `EvaKerbal.willDieWithoutHelmet`.
        helmetUnsafeReason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's own words for why the helmet cannot come off, passed through verbatim
            from `KerbalEVA.HelmetUnsafeReason`, or `null` when it can.
    EventMsg:
      type: object
      description: |-
        Something that happened to a subscription, sent on the Topic it happened to.

        An event carries no payload of its own: `EventMsg.name` is the whole of what
        happened, and `EventMsg.meta` describes the delivery as it does on any other
        frame. The mod sends two names:

        - `subscribed` confirms a `subscribe`, once per subscribe. Wait for it
          rather than for the first `stream-data`: a channel with nothing to say yet
          sends the confirmation and then nothing. A `subscribe` naming a Topic
          nothing owns gets no reply at all, not an error, so a missing confirmation
          is how a client learns the Topic is unowned
        - `timeline-reset` says the game quickloaded and time went backwards. It is
          sent for every Topic the connection holds, and anything built from frames
          before it should be discarded
      required:
        - type
        - topic
        - name
        - meta
      properties:
        type:
          type: string
          const: event
          x-sitrep-unit: id
          description: The frame type, always `"event"`.
        topic:
          type: string
          x-sitrep-unit: id
          description: The subscribed Topic the event happened to.
        name:
          type: string
          x-sitrep-unit: text
          description: "What happened: `subscribed` or `timeline-reset`."
        meta:
          description: The delivery metadata, as on any other frame.
          allOf:
            - $ref: "#/components/schemas/Meta"
    ExperimentActionArgs:
      type: object
      description: |-
        Args shared by every science-experiment actuation command
        (`science.experiment.deploy`/`science.experiment.transmit`): the experiment
        is addressed by `ExperimentActionArgs.partId`, the part's
        `flightID.ToString()`, the SAME opaque id the read side emits in
        `science.instruments` (one entry per `ModuleScienceExperiment`, keyed by
        `flightID`). The host resolves it against the active vessel's live parts; a
        client never supplies a live array index. An empty
        `ExperimentActionArgs.partId` resolves to nothing and yields
        `CommandResult.errorCode` `CommandErrorCode.NotFound`.
      required:
        - partId
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The experiment's part, as `Part.flightID.ToString()`: the same id
            `science.instruments` keys its entries by. Resolved against the active
            vessel's parts; empty or unknown yields `CommandErrorCode.NotFound`.
    ExperimentBreakdownEntry:
      type: object
      description: |-
        One entry in the `science.experimentBreakdown` channel payload: a
        per-SUBJECT rollup of the stored science results that `science.experiments`
        lists one row per result. One row per distinct subject id: several stored
        results for the same subject (for example two crew reports from the same
        biome) collapse into one entry with `ExperimentBreakdownEntry.dataMits`
        summed across them.

        The channel payload is a BARE ARRAY (`ExperimentBreakdownEntry[]`) or
        `null`, never a wrapper object. The whole array is `null` when there is no
        active vessel or the vessel holds no stored science data; there is no
        separate empty-array state. Every field is nullable, and is `null` whenever
        the raw value is absent or non-finite.

        `ExperimentBreakdownEntry.biome` and `ExperimentBreakdownEntry.situation`
        are parsed from the subject id by KSP's
        `ScienceUtil.GetExperimentFieldsFromScienceID`, not from the vessel's
        current position, so a subject collected earlier in the flight keeps its own
        biome and situation.
      properties:
        subjectId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The science subject id this row rolls up (KSP's `ScienceData.subjectID`),
            unique within the array. Joins to `ExperimentEntry.subjectId` and
            `ArchiveEntry.subjectId`.
        biome:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The biome part of `ExperimentBreakdownEntry.subjectId`: where the subject
            was collected, not where the vessel is now.
        situation:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The situation part of `ExperimentBreakdownEntry.subjectId` (a KSP
            `ExperimentSituations` name such as `SrfLanded`): the situation the subject
            was collected in, not the vessel's current one.
        expTitle:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Display title of the first stored result seen for this subject (KSP's
            `ScienceData.title`).
        dataMits:
          type:
            - number
            - "null"
          x-sitrep-unit: Mit
          description: |-
            Summed `ScienceData.dataAmount` (mits) across every stored result for this
            subject.
        remainingPotential:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            Absolute science still recoverable from this subject (`scienceCap - science`
            from R&D). `0` in Sandbox (no R&D) and when R&D holds no subject with this
            id.
        valueModel:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Which value model produced `ExperimentBreakdownEntry.remainingPotential`,
            and which unit `ExperimentBreakdownEntry.dataMits` is really in. See
            ScienceValueModels.

            Stock's rollup is a snapshot: one summed data figure and one "how much is
            left". A provider with a full per-subject ledger (collected vs retrieved,
            in-flight split, times completed) projects it down to those two and carries
            the ledger in `ExperimentBreakdownEntry.extensions`: stock's pair is a lossy
            view of the richer set, never the other way round.
        extensions:
          type:
            - object
            - "null"
          description: |-
            The provider-namespaced extension bag, per-subject-rollup half. Same
            mechanism and same rule as `ExperimentEntry.extensions`.
          additionalProperties: true
    ExperimentEntry:
      type: object
      description: |-
        One entry in the `science.experiments` channel payload: a single stored
        science result on the ACTIVE vessel, held either by the science module that
        collected it or by a container part. The channel payload is a BARE ARRAY of
        these (`ExperimentEntry[]`) or `null`, never a wrapper object. The whole
        array is `null` when there is no active vessel or the vessel holds no stored
        science data; there is no separate empty-array state.

        One row per stored `ScienceData`: a module that holds no data produces no
        row (see `InstrumentEntry` for one row per module). Every field is nullable,
        and is `null` whenever the raw value is absent or non-finite.
      properties:
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Display title of the part holding the result (the part's `partInfo.title`,
            or its internal name when that is missing).
        location:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            "experiment" (still held by the science module that collected it) or
            "container" (already collected into an onboard science container). KSP keeps
            no "already transmitted" flag on a result, so this is the closest available
            "stored vs not yet collected" signal.
        experimentId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The collecting module's experiment id (KSP's
            `ModuleScienceExperiment.experimentID`, for example `crewReport`). `null` on
            a `"container"` row, where the result no longer sits in its experiment
            module.
        subjectId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The science subject this result was recorded against (KSP's
            `ScienceData.subjectID`), the join key into
            `ExperimentBreakdownEntry.subjectId` and `ArchiveEntry.subjectId`.
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The result's display title (KSP's `ScienceData.title`).
        dataAmount:
          type:
            - number
            - "null"
          x-sitrep-unit: Mit
          description: |-
            Size of the stored result in mits (KSP's `ScienceData.dataAmount`). `null`
            under a `ExperimentEntry.valueModel` whose data is not measured in mits.
        scienceValueRatio:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            KSP's `ScienceData.scienceValueRatio` for this result. Its meaning depends
            on `ExperimentEntry.valueModel`: do not compare it across models.
        baseTransmitValue:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            KSP's `ScienceData.baseTransmitValue` for this result. Its meaning depends
            on `ExperimentEntry.valueModel`.
        transmitBonus:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            Transmit-value multiplier for this result (KSP's
            `ScienceData.transmitBonus`), a bounded ratio.
        labValue:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            KSP's `ScienceData.labValue` for this result: its value to a Mobile
            Processing Lab. Its meaning depends on `ExperimentEntry.valueModel`.
        deployed:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the collecting experiment module is deployed (KSP's
            `ModuleScienceExperiment.Deployed`). `null` on a `"container"` row.
        inoperable:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the collecting experiment module is inoperable until reset (KSP's
            `ModuleScienceExperiment.Inoperable`). `null` on a `"container"` row.
        situation:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The active vessel's CURRENT situation, KSP's `Vessel.situation` enum name
            (for example `LANDED`, `ORBITING`). It describes where the vessel is now,
            not where the result was collected; the collection situation is encoded in
            `ExperimentEntry.subjectId`.
        valueModel:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Which value model produced `ExperimentEntry.scienceValueRatio`,
            `ExperimentEntry.baseTransmitValue` and `ExperimentEntry.labValue`, and
            which unit `ExperimentEntry.dataAmount` is really in. A token from
            ScienceValueModels, or one it does not list.

            This is the one field on the payload that is not simply "what the game
            says". A provider whose data is not in mits leaves
            `ExperimentEntry.dataAmount` null rather than putting another unit's figure
            in a mits-typed field, and carries the real figure in its own
            `ExperimentEntry.extensions` namespace.
        extensions:
          type:
            - object
            - "null"
          description: |-
            The provider-namespaced extension bag: how a science provider carries a
            per-experiment field this shared shape does not declare. See
            ProviderExtensionBagAttribute for the mechanism.

            Everything a richer science model knows that stock has no concept of belongs
            here: storage capacity, file-vs-sample, transmit rate, per-unit science
            rate. Absent from the payload when no provider filled it.
          additionalProperties: true
    FaultCode:
      type: string
      description: |-
        Why a command, or any other request, could not be CARRIED: nothing about the
        game was decided. The refused/failed split is the kind of code, not a
        judgement a client makes: a `RefusalCode` says the game said no, this says
        the machinery did not get that far, and a retry may work.

        Closed, and declared only here. An Uplink never mints a fault: a handler
        that throws already becomes `FaultCode.CommandUnavailable`, and
        `CommandFaultException` is how a handler raises one of these deliberately.
      oneOf:
        - const: invalidEnvelope
          title: InvalidEnvelope
          description: |-
            A frame of a known type that could not be read, including a
            `command-request` whose `args` do not fit the command. Only that call is
            refused; the command stays available.
          x-sitrep-sentence: the request could not be read
        - const: unknownEnvelopeType
          title: UnknownEnvelopeType
          description: A frame whose `type` this build does not recognise.
          x-sitrep-sentence: the mod does not recognise that kind of request
        - const: unhandledEnvelope
          title: UnhandledEnvelope
          description: A frame that parsed as a type this build has nothing to do with.
          x-sitrep-sentence: the mod has nothing to do with that request
        - const: binaryFrameNotAccepted
          title: BinaryFrameNotAccepted
          description: A binary frame sent up the socket, which nothing accepts.
          x-sitrep-sentence: the mod accepts no binary frames
        - const: commandUnavailable
          title: CommandUnavailable
          description: |-
            A command that is unknown or unavailable, or whose handler threw. A handler
            that threw leaves its command unavailable for the session.
          x-sitrep-sentence: the command is not available
        - const: mainThreadTimeout
          title: MainThreadTimeout
          description: |-
            A command the host could not run in time: it was handed to the game's main
            thread and the game did not take it before the host stopped waiting, as
            during a scene load. Nothing was decided, and the command may still run
            later.
          x-sitrep-sentence: the game did not get to it in time
        - const: resultSerializationError
          title: ResultSerializationError
          description: A command that ran and whose result could not be written.
          x-sitrep-sentence: its answer could not be sent
        - const: unknownTopic
          title: UnknownTopic
          description: A subscription to a topic nothing declares.
          x-sitrep-sentence: nothing publishes that
        - const: payloadSerializationError
          title: PayloadSerializationError
          description: A topic whose payload could not be written.
          x-sitrep-sentence: its value could not be sent
        - const: unknownVantage
          title: UnknownVantage
          description: |-
            A `set-vantage`, or a command's `vantage`, naming a command centre that is
            not active.
          x-sitrep-sentence: that command centre is not active
        - const: undelivered
          title: Undelivered
          description: |-
            The transport held the command for a link that never came back, and has
            stopped retrying. It never left this machine.
          x-sitrep-sentence: it was never sent
        - const: disposed
          title: Disposed
          description: The client was shut down while the command waited for an answer.
          x-sitrep-sentence: the connection closed before an answer came
        - const: sendQueueFull
          title: SendQueueFull
          description: |-
            The transport's queue of commands waiting for a link is full, so this one
            was not queued.
          x-sitrep-sentence: too many commands are waiting for the link
        - const: peerDisconnected
          title: PeerDisconnected
          description: A station's link to the main screen dropped while the command was on it.
          x-sitrep-sentence: the link to the main screen dropped
        - const: noClient
          title: NoClient
          description: |-
            The main screen had no connection to the mod to relay a station's command
            over.
          x-sitrep-sentence: the main screen is not connected to the game
        - const: unclassified
          title: Unclassified
          description: |-
            A rejection that carried no code a client could read, such as a throw from
            inside a handler on the client.
          x-sitrep-sentence: something went wrong
    FireCrewArgs:
      type: object
      description: |-
        `career.crew.fire`'s args: a hired kerbal's `ProtoCrewMember.name`, the same
        id `spaceCenter.crewRoster` publishes for each roster entry. Firing
        (`KerbalRoster.SackAvailable`) costs nothing and returns the kerbal to the
        applicant pool, so it is reversible: a re-hire brings them back with the
        same stats. Valid only on a kerbal whose roster status is Available; a name
        not on the hired-crew roster fails with `CommandErrorCode.NotFound`, and one
        that is but is not Available (Assigned, Dead or Missing) with
        `CommandErrorCode.ModeUnavailable`.
      required:
        - kerbalName
      properties:
        kerbalName:
          type: string
          x-sitrep-unit: id
          description: |-
            The kerbal to fire: their name, as a `spaceCenter.crewRoster` entry carries
            it.
    FleetSilence:
      type: object
      description: |-
        The fleet-wide silence roster on `fleet.silence`: every vessel the tracker
        holds a reckoning for, in one payload.

        A per-vessel topic can only be read by something that already knows which
        vessel to ask for. This one static topic lists every vessel, so a consumer
        that has to work the fleet out for itself (a contribution, which declares
        its topics statically, or a Processor) can fan out over entries that exist.

        Delayed as one payload on the stream's main delay, not on each vessel's own
        light-time, as with `SystemVessels`. `FleetVesselSilence` on
        `silence.<guid>.state` stays authoritative for one vessel on that vessel's
        own light-time; this is the fleet-wide index, and is not a substitute for
        it.
      required:
        - vessels
      properties:
        vessels:
          type: array
          items:
            $ref: "#/components/schemas/FleetSilenceEntry"
          description: |-
            One entry per vessel the tracker holds a reckoning for, in no guaranteed
            order. Never null; empty when there are none.
    FleetSilenceEntry:
      type: object
      description: |-
        One vessel's reckoning inside the fleet-wide `FleetSilence` roster: the same
        fields `FleetVesselSilence` carries, plus the vessel id that the per-vessel
        topic gets from its own topic string.
      required:
        - vesselId
        - state
      properties:
        vesselId:
          type: string
          x-sitrep-unit: id
          description: The KSP vessel GUID, the same id the `fleet.` and `silence.` topics key on.
        state:
          type: string
          x-sitrep-unit: enum
          description: |-
            One of `"Nominal"` (in contact), `"Silent"` (out of contact, not yet
            eligible to be declared lost) or `"Lost"`.
        silenceSinceUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: UT the current silence run began. Null while Nominal.
        deadlineUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            UT at which this silence run becomes eligible to be declared Lost. Null
            while Nominal, or for a destroyed vessel.
        deadlineBasis:
          type:
            - string
            - "null"
          x-sitrep-unit: enum
          description: |-
            What `FleetSilenceEntry.deadlineUt` was based on. One of `orbital-period` /
            `policy-floor` / `policy-ceiling` / `no-orbit` / `destroyed` /
            `predicted-reacquisition` / `no-occultation` / `no-emergence-in-window` /
            `warp-limited` / `grace-exceeds-ceiling` / `horizon-limited`. Null while
            Nominal.
        predictedReacquisitionUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the radio path is predicted to re-open, in universal time. Null is a
            prediction withheld, never an emergence of "now".
        predictionGraceSeconds:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            The error budget the deadline was set with, in seconds: how long past the
            predicted return this craft may stay quiet before its silence is something
            other than a late reappearance.

            The only value on the wire that says how much confidence to place in
            `FleetSilenceEntry.predictedReacquisitionUt` beside it.

            One-sided, not a symmetric uncertainty: it is an allowance after the
            predicted moment, so render "allowing 5 min of slack", never "+/- 5 min".
            Null wherever the prediction is null.
    FlightCurrent:
      type: object
      description: |-
        The `flight.current` channel payload: a UT-indexed value, delivered
        latest-wins and delayed like every `vessel.*` channel. It says which flight
        is active and what phase it is in, for the vessel gonogo is reporting as
        active. That is the vessel the game is flying, with one exception: a kerbal
        on EVA does not become the subject of this reading, the craft they stepped
        out of stays it for as long as that craft is in the world.

        Nothing is published while there is no active vessel; the last value is
        held.
      required:
        - flightId
        - vesselId
        - vesselName
        - phase
      properties:
        flightId:
          type: string
          x-sitrep-unit: id
          description: |-
            The stable flight id: KSP's `Vessel.id` GUID as a string, the same value as
            `FlightCurrent.vesselId` and as `VesselIdentity.VesselId` and
            `CrashReport.VesselId`, so it joins against those directly.
        vesselId:
          type: string
          x-sitrep-unit: id
          description: |-
            KSP's `Vessel.id` GUID of the active vessel, as a string. Always equal to
            `FlightCurrent.flightId`.
        vesselName:
          type: string
          x-sitrep-unit: text
          description: The active vessel's display name.
        phase:
          description: |-
            The vessel's current flight phase, as its `Situation` (PreLaunch, Flying,
            Landed and so on).
          allOf:
            - $ref: "#/components/schemas/Situation"
              x-sitrep-unit: enum
    FlightEndReason:
      type: integer
      description: |-
        Why a flight ended, carried on `FlightEnded`. The detail of a crash or a
        recovery is on the `crash.lastCrash` and `recovery.lastSummary` channels;
        this is only the coarse reason.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Recovered
          description: The vessel was recovered.
        - const: 1
          title: Crashed
          description: The vessel was lost to a collision or a hard splashdown.
        - const: 2
          title: Reverted
          description: |-
            The game rewound (a revert or a quickload) to before the flight's end, or
            the flight was still open when the rewind happened. Also sent for a flight
            that had already ended by crash or recovery on the timeline the rewind
            discarded.
        - const: 3
          title: Destroyed
          description: |-
            The vessel was destroyed without a collision, for example burning up on
            re-entry.
    FlightEnded:
      type: object
      description: |-
        The `flight.ended` channel payload: a reliable, ordered, delayed event sent
        once per flight when it stops being trackable: recovered, crashed, destroyed
        or reverted. It shares the delay class of `crash.lastCrash` and
        `recovery.lastSummary`, so an end that a rewind discards before its
        light-time has elapsed is never revealed.

        Debris, flags and vessels of unknown type never end a flight.
      required:
        - flightId
        - vesselId
        - vesselName
        - reason
        - ut
      properties:
        flightId:
          type: string
          x-sitrep-unit: id
          description: |-
            The id of the flight that ended: KSP's `Vessel.id` GUID as a string. Always
            equal to `FlightEnded.vesselId`.
        vesselId:
          type: string
          x-sitrep-unit: id
          description: KSP's `Vessel.id` GUID of the vessel whose flight ended, as a string.
        vesselName:
          type: string
          x-sitrep-unit: text
          description: The vessel's display name at the end of the flight.
        reason:
          description: |-
            Why the flight ended. When a crash and a destruction are both detected for
            one loss, the first detected wins.
          allOf:
            - $ref: "#/components/schemas/FlightEndReason"
              x-sitrep-unit: enum
        ut:
          type: number
          x-sitrep-unit: ut
          description: |-
            Universal time the flight ended. For `FlightEndReason.Reverted` this is the
            revert-target UT, not the moment the player chose to revert.
    FlightStarted:
      type: object
      description: |-
        The `flight.started` channel payload: a reliable, ordered, delayed event
        sent when a new flight begins. A flight is new when its vessel id has not
        been started before in this game session (a launch, or a first switch onto a
        vessel), and every vessel active just after a revert or a quickload starts a
        new flight, even one with the same id.

        A client that subscribes while a flight is already open receives that
        flight's `flight.started`, carrying its original start `FlightStarted.ut`. A
        repeat with an unchanged `FlightStarted.ut` is the same flight announced
        again; a new `FlightStarted.ut` for the same vessel id is a new flight after
        a rewind.
      required:
        - flightId
        - vesselId
        - vesselName
        - ut
      properties:
        flightId:
          type: string
          x-sitrep-unit: id
          description: |-
            The stable flight id: KSP's `Vessel.id` GUID as a string. Always equal to
            `FlightStarted.vesselId`.
        vesselId:
          type: string
          x-sitrep-unit: id
          description: KSP's `Vessel.id` GUID of the vessel flying this flight, as a string.
        vesselName:
          type: string
          x-sitrep-unit: text
          description: The vessel's display name when the flight was announced.
        ut:
          type: number
          x-sitrep-unit: ut
          description: |-
            Universal time this flight began: when the vessel was first observed active,
            or the revert-target UT for a flight started by a rewind.
    FlightVesselChanged:
      type: object
      description: |-
        The `flight.vesselChanged` channel payload: a reliable, ordered, delayed
        event sent whenever the active vessel changes after the first observation of
        the session (docking, undocking, a tracking-station reselect). Switching
        away from a vessel that is still flying does not end its flight, and
        switching back to a known one does not start a new one. Switching onto a
        vessel for the first time also sends `FlightStarted`. Going on EVA does not
        change the active vessel (see `FlightCurrent`).
      required:
        - flightId
        - vesselId
        - vesselName
        - ut
      properties:
        flightId:
          type: string
          x-sitrep-unit: id
          description: |-
            The flight now active: KSP's `Vessel.id` GUID as a string. Always equal to
            `FlightVesselChanged.vesselId`.
        vesselId:
          type: string
          x-sitrep-unit: id
          description: KSP's `Vessel.id` GUID of the vessel focus moved TO, as a string.
        vesselName:
          type: string
          x-sitrep-unit: text
          description: The display name of the vessel focus moved to.
        previousVesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The vessel id focus moved FROM, or null when there was no previous vessel.
        ut:
          type: number
          x-sitrep-unit: ut
          description: Universal time of the switch.
    FuelCellEntry:
      type: object
      description: |-
        One electric-charge-producing converter in the `parts.power` payload's
        `fuelCells` array: every `ModuleResourceConverter` whose outputs include
        `ElectricCharge`, one entry per module. Every field is `null` when its value
        could not be read.
      properties:
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The part's display title (KSP's `Part.partInfo.title`), or its internal name
            when it has no part info.
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The part's `Part.flightID` as a string, the same join key as
            `SolarPanelEntry.partId`. Null when the part has no flight id yet.
        active:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: True when the converter is switched on (KSP's `IsActivated`).
        status:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The converter's own status text as KSP displays it
            (`ModuleResourceConverter.status`). Free text, not a fixed vocabulary.
    GameDlc:
      type: object
      description: |-
        The `game.dlc` channel payload: which KSP expansions ("DLC") are installed.
        A fact about the install, independent of scene, so a widget can tell "the
        player has no DLC" from "the DLC is present but nothing is deployed yet"
        (deployed science, for instance, needs Breaking Ground).

        The whole payload is `null`, not an all-false object, when no sample has
        been taken yet, so "no data yet" and "DLC absent" stay distinct. Like
        `SystemBodies` it carries no per-payload `Meta`: its `Meta` rides the
        envelope (`StreamData.Meta`). A ground-side fact, so the channel is
        DelayRole.TrueNow, independent of any vessel's comms link.
      required:
        - breakingGround
        - makingHistory
      properties:
        breakingGround:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the Breaking Ground expansion ("Serenity") is installed: deployed
            science, robotics and surface features.
        makingHistory:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the Making History expansion is installed: the mission builder and
            extra parts.
    GameMode:
      type: integer
      description: |-
        The game's save mode, from KSP's `Game.Modes`. It decides which career
        surfaces (funds, tech tree, contracts, strategies, facility upgrades) mean
        anything. `CareerStatus` is `null` outside career, so the mode is its own
        Topic, `career.mode`, emitted in every mode.

        On the wire an enum is its integer ordinal: `Sandbox` 0, `Career` 1,
        `Science` 2, `Unknown` 3.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Sandbox
          description: "A sandbox save (`SANDBOX`): no funds, science or reputation."
        - const: 1
          title: Career
          description: |-
            A career save (`CAREER`): funds, contracts, reputation and the tech tree all
            apply.
        - const: 2
          title: Science
          description: |-
            A science save (`SCIENCE_SANDBOX`): the tech tree and science apply, funds
            and contracts do not.
        - const: 3
          title: Unknown
          description: |-
            Any other KSP mode (a scenario or a mission), which has no player-career
            surface.
    HireApplicantArgs:
      type: object
      description: |-
        `career.crew.hire`'s args: the applicant's `ProtoCrewMember.name`, the same
        id `spaceCenter.astronautComplex` publishes for each applicant as
        `applicants[].name`, so a client hires the applicant it read. Hiring debits
        the current recruit cost from funds and moves the applicant into the crew
        roster. An applicant that has left the pool since it was read (someone else
        hired them, or KSP refreshed the pool) fails with
        `CommandErrorCode.NotFound`; an unaffordable hire with
        `CommandErrorCode.Range`; a full roster (Astronaut Complex cap) or a
        non-career save `CommandErrorCode.ModeUnavailable`.
      required:
        - applicantName
      properties:
        applicantName:
          type: string
          x-sitrep-unit: id
          description: |-
            The applicant to hire: their name, as `spaceCenter.astronautComplex`'s
            `applicants[].name` carries it.
    InboundFrame:
      description: |-
        Every frame the mod sends, discriminated on `type`.

        The first thing a client writes is a router over these four, and they are the
        whole of the inbound surface: `stream-data` carries a subscribed topic's value,
        `command-response` answers a dispatch, `event` reports something that happened
        to a subscription, and `error` reports a request that could not be carried.
        Every per-channel message below narrows one of these; none of them adds a fifth
        `type`.

        Each arm pins `type` with a `const`, and that is what the discrimination is
        made of: a plain JSON Schema validator picks the right arm from the constants
        alone. The `discriminator` beside this is the AsyncAPI Schema keyword, a bare
        string naming that property, and it is a LABEL on the constants rather than the
        mechanism. Two things follow. It is not OpenAPI 3's `discriminator` object, so
        `propertyName` and `mapping` do not belong here and the object form does not
        validate. And a JSON Schema tool that has never heard of it loses nothing,
        because the constants are still there.
      discriminator: type
      oneOf:
        - $ref: "#/components/schemas/StreamData"
        - $ref: "#/components/schemas/CommandResponse"
        - $ref: "#/components/schemas/EventMsg"
        - $ref: "#/components/schemas/ErrorMsg"
    InstrumentEntry:
      type: object
      description: |-
        One entry in the `science.instruments` channel payload: a single
        `ModuleScienceExperiment` on the ACTIVE vessel, as an inventory and status
        row keyed by `InstrumentEntry.partId` (the part's KSP `flightID`).

        Distinct from `ExperimentEntry`: `science.experiments` walks the same
        modules but yields one row per STORED result (a module with no data produces
        no row), whereas `science.instruments` yields one row per module whether or
        not it holds data. It is the operability picture (deployed, inoperable,
        rerunnable, resettable, collectable) an operator needs to decide what to run
        next.

        The channel payload is a BARE ARRAY (`InstrumentEntry[]`) or `null` when
        there is no active vessel or it carries no experiment module. Every field is
        nullable, and is `null` whenever the raw value is absent.
      properties:
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The part's KSP `flightID` as a string: the stable join key for this
            instrument. `null` when the part has no flight id yet (KSP's unset value,
            0).
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Display title of the part carrying the module (the part's `partInfo.title`,
            or its internal name when that is missing).
        experimentId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The module's experiment id (KSP's `ModuleScienceExperiment.experimentID`,
            for example `crewReport`).
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The experiment's display title (KSP's `ScienceExperiment.experimentTitle`).
            `null` when the module's experiment definition has not resolved.
        deployed:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the experiment is deployed (KSP's
            `ModuleScienceExperiment.Deployed`).
        inoperable:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the experiment cannot be run again until it is reset (KSP's
            `ModuleScienceExperiment.Inoperable`).
        rerunnable:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the experiment can be run more than once without a reset (KSP's
            `ModuleScienceExperiment.rerunnable`).
        resettable:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the experiment can be reset (KSP's
            `ModuleScienceExperiment.resettable`).
        dataIsCollectable:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether a kerbal on EVA can collect the experiment's data (KSP's
            `ModuleScienceExperiment.dataIsCollectable`).
        extensions:
          type:
            - object
            - "null"
          description: |-
            The provider-namespaced extension bag, instrument half. Same mechanism and
            same rule as `ExperimentEntry.extensions`. This payload carries no number
            whose meaning depends on the value model (it is pure operability), so it has
            the bag but no `valueModel` tag.

            Stock's operability picture is a flat pair of flags
            (`InstrumentEntry.deployed` and `InstrumentEntry.inoperable`). A provider
            that models running as a state machine with a reason ("shrouded", "no EC",
            "sample depleted") projects it down to those flags and carries the state and
            the reason here.
          additionalProperties: true
    InventoryItem:
      type: object
      description: One kind of thing stored in an `InventoryStore`, with how many of it.
      required:
        - name
        - quantity
      properties:
        name:
          type: string
          x-sitrep-unit: id
          description: |-
            `AvailablePart.name`, the config id (e.g. `"evaRepairKit"`). The id a
            consumer matches on, never the title, which is localised.
        title:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The part's display title, already localised by KSP.
        quantity:
          type: number
          x-sitrep-unit: count
          description: How many of this kind are in this store, summed across slots.
        packedVolume:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Packed volume of ONE of these, same unit as the store's limits.
    InventoryStore:
      type: object
      description: "One part's `ModuleInventoryPart`: a cargo hold aboard."
      required:
        - partId
        - partName
        - items
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            `Part.flightID` stringified, so a store id-joins to `vessel.parts` and the
            other per-part channels.
        partName:
          type: string
          x-sitrep-unit: text
          description: The part's display title.
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
          description: |-
            What is actually in it. Empty is meaningful and is NOT the same as an absent
            store: an empty hold is a place to put something.
        slots:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            `ModuleInventoryPart.InventorySlots`. Null when the module did not report
            one.
        slotsUsed:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Slots with something in them, so a consumer can say "2 of 4" without summing
            quantities that share a slot.
        packedVolumeLimit:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            `packedVolumeLimit`, in KSP's own cargo-volume unit rather than cubic
            metres: it is a config number (a kerbal is 40, a repair kit is 5) and
            presenting it as a physical volume would be inventing a dimension the game
            does not attach to it.
        packedVolumeUsed:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Packed volume currently used, same unit as
            `InventoryStore.packedVolumeLimit`.
        massLimit:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: |-
            `massLimit` in tonnes. A kerbal's is 0.065, which is the binding constraint
            on how much they can carry long before slots are.
    InvokePartActionArgs:
      type: object
      description: |-
        Args for `vessel.invokePartAction`: fire one button of one part's
        right-click Part Action Window, the remote-control equivalent of the player
        clicking it in-game.

        This is an actuation of a part ON the craft, so the command rides light-time
        (DelayRole.Delayed) exactly like `vessel.control.*` and the robotics
        commands.

        **No state field, unlike every other actuation command.** The contract's
        usual discipline is "absolute set, never toggle" (see
        `ServoSetEnabledArgs`), but a `BaseEvent` has no settable value: KSP models
        these as fire-this-button, and the button's own label is what changes
        ("Deploy" becomes "Retract"). So this command is a pure invoke, like
        `robotics.rotor.reverse`, for a reason that comes from KSP. The operator's
        read-back is the `vessel.partActions.<flightId>` channel re-reporting the
        new button set one light-time later.
      required:
        - partId
        - eventName
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's `flightID.ToString()`: the same id the read side stamps on
            `PartActions.partId` and `VesselPart.id`, so a widget round-trips the exact
            id it already holds with no correlation step. An id that no longer resolves
            (the part was staged away, undocked, or the vessel unloaded) comes back
            `CommandResult.errorCode` `CommandErrorCode.NotFound` rather than silently
            doing nothing.
        eventName:
          type: string
          x-sitrep-unit: id
          description: |-
            The `PartActionEntry.name` of the button to fire (`BaseEvent.name`, the
            stable code id, NEVER the localized `PartActionEntry.label`). An event name
            the resolved part no longer exposes comes back
            `CommandErrorCode.ModeUnavailable`: the part is there but that button is
            not, which is a genuinely different failure from an unresolvable part.
    IsruConverterEntry:
      type: object
      description: |-
        One chemical converter on the active vessel. Field set matches stock's
        surface: whether it is running, and the recipe it is running, at live rates.
        The `isru.converters` payload is an array of these; empty when the vessel
        has no converters.
      required:
        - inputs
        - outputs
      properties:
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: "Part.flightID stringified: the same join key as `IsruDrillEntry.partId`."
        partTitle:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: Part.partInfo.title, for display without a vessel.parts join.
        running:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Actively converting this tick.
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/IsruResourceFlow"
          description: |-
            Recipe inputs at their live rate. Empty list, not null, when the converter
            carries no recipe.
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/IsruResourceFlow"
          description: |-
            Recipe outputs at their live rate. Empty list, not null, when the converter
            carries no recipe.
        extensions:
          type:
            - object
            - "null"
          description: |-
            The provider-namespaced extension bag, converter half. Same mechanism and
            same rule as `IsruDrillEntry.extensions`.

            A starved recipe has no blocking-reason field: a converter that is on but
            moving nothing is `IsruConverterEntry.running` true alongside zero rates, so
            derive that condition from the shared fields.
          additionalProperties: true
    IsruDrillEntry:
      type: object
      description: |-
        One drill (resource harvester) on the active vessel. The field set is what
        every ISRU model shares, which is exactly what stock ISRU has: resource,
        abundance, rate, deploy and running, plus the two identification fields.
        Anything one provider knows and another does not goes in
        `IsruDrillEntry.extensions`.

        The `isru.drills` payload is an array of these. An empty array means the
        vessel has no drills, never that ISRU is not tracked.
      properties:
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: "Part.flightID stringified: the same join key vessel.parts/parts.power use."
        partTitle:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: Part.partInfo.title, for display without a vessel.parts join.
        resource:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Resource this drill extracts (e.g. "Ore"). Free text, not a closed enum:
            whatever the running install's configs and profiles name, the same posture
            every other resource-identity field in this contract takes.
        deployed:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Drill head deployed. Null for a harvester with no deploy animation, e.g.
            some asteroid drills.
        running:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Actively extracting this tick.
        abundance:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            Local abundance of `IsruDrillEntry.resource` at the drill's current
            position, 0..1. Stock reads the same resource map the right-click PAW does.
            A mod that samples its own abundance reports that instead, and for asteroid
            or comet mining the remaining-mass ratio of the source rock lands here: the
            same 0..1 shape from a different source. Null when the backend has no
            abundance concept for this harvest type.
        rate:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            EFFECTIVE current extraction rate, already abundance- and
            efficiency-adjusted rather than the static config rate, so it matches what
            the part's own readout shows. Zero rather than null when
            `IsruDrillEntry.running` is false: the drill genuinely extracts nothing,
            which is a number, not an absence.
        extensions:
          type:
            - object
            - "null"
          description: |-
            The provider-namespaced extension bag: how an ISRU backend carries a
            per-drill field this shared shape does not declare. See
            ProviderExtensionBagAttribute for the whole mechanism. Null for the vanilla
            backend, which has nothing stock does not already say. A blocking-reason
            string, an EC draw, an asteroid's remaining mass: all of those belong here
            rather than as nullable members above.
          additionalProperties: true
    IsruResourceFlow:
      type: object
      description: |-
        One resource flow in a converter's recipe, input or output side. The rate is
        live (already scaled by whatever the part's current efficiency or capacity
        multiplier is), not the raw recipe ratio, so an operator reads what is
        actually moving rather than what the config asked for.
      properties:
        resource:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The resource's name as the install's configs name it (for example "Ore",
            "LiquidFuel"). Free text, not a closed enum. `null` when the recipe entry
            names no resource.
        rate:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            The live rate this resource is consumed (on an input) or produced (on an
            output) at, already scaled by the converter's current efficiency.
    KspEditorFacility:
      type: integer
      description: |-
        KSP's `EditorFacility`: which editor a craft was built in. Behind
        `spaceCenter.savedShips[].facilityOrdinal`, beside the name in
        `SavedShipEntry.facility`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: None
          description: No editor recorded.
        - const: 1
          title: VAB
          description: The Vehicle Assembly Building.
        - const: 2
          title: SPH
          description: The Spaceplane Hangar.
    KspParameterState:
      type: integer
      description: |-
        KSP's `Contracts.ParameterState`: whether one objective of a contract is
        done. Behind `career.status.contracts[].parameters[].stateOrdinal`, beside
        the name in `CareerContractParameter.state`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Incomplete
          description: Not yet met.
        - const: 1
          title: Complete
          description: Met.
        - const: 2
          title: Failed
          description: Failed, and can no longer be met.
    KspPartCategory:
      type: integer
      description: |-
        KSP's `PartCategories`: the editor category a part filters into. Behind
        `vessel.parts[].categoryOrdinal`, beside the name in `VesselPart.category`.

        `KspPartCategory.none` is `-1`, not `0`, so this enum is not dense from zero
        and cannot be resolved with the array-walking `namesOf`. The lower-case
        spelling is KSP's, and the name on the wire is exactly `"none"`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Propulsion
          description: Propulsion.
        - const: 1
          title: Control
          description: "Control: reaction wheels, RCS thrusters and similar."
        - const: 2
          title: Structural
          description: Structural.
        - const: 3
          title: Aero
          description: "Aerodynamics: wings, control surfaces, nose cones, intakes."
        - const: 4
          title: Utility
          description: Utility.
        - const: 5
          title: Science
          description: Science.
        - const: 6
          title: Pods
          description: Command pods and probe cores.
        - const: 7
          title: FuelTank
          description: Fuel tanks.
        - const: 8
          title: Engine
          description: Engines.
        - const: 9
          title: Communication
          description: "Communication: antennas and relays."
        - const: 10
          title: Electrical
          description: "Electrical: batteries, generators, solar panels."
        - const: 11
          title: Ground
          description: "Ground: landing gear, legs and wheels."
        - const: 12
          title: Thermal
          description: "Thermal: heat shields and radiators."
        - const: 13
          title: Payload
          description: "Payload: fairings and cargo bays."
        - const: 14
          title: Coupling
          description: "Coupling: decouplers, separators and docking ports."
        - const: 15
          title: Cargo
          description: "Cargo: inventory parts."
        - const: 16
          title: Robotics
          description: Robotics (Breaking Ground servos and rotors).
        - const: -1
          title: none
          description: No category. KSP spells it in lower case.
    KspRosterStatus:
      type: integer
      description: |-
        KSP's `ProtoCrewMember.RosterStatus`: a kerbal's standing in the roster.
        Behind `spaceCenter.crewRoster[].situationOrdinal`, beside the name in
        `CrewRosterEntry.situation`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Available
          description: In the roster and free to be assigned to a flight.
        - const: 1
          title: Assigned
          description: Assigned to a vessel.
        - const: 2
          title: Dead
          description: Killed.
        - const: 3
          title: Missing
          description: |-
            Lost with a vessel. In a save with respawn enabled, a missing kerbal returns
            to `KspRosterStatus.Available` after a delay.
    KspSpaceCenterFacility:
      type: integer
      description: |-
        KSP's `SpaceCenterFacility`: one building at the space centre. Behind
        `career.status.facilities[].facilityOrdinal` and
        `LimitBreach.facilityOrdinal`.

        `career.status.facilities` is keyed by the facility name, not the ordinal.
        The ordinal is carried inside each entry, so a client can branch on it
        without relying on the key it arrived under.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Administration
          description: The Administration building.
        - const: 1
          title: AstronautComplex
          description: The Astronaut Complex.
        - const: 2
          title: LaunchPad
          description: The Launch Pad.
        - const: 3
          title: MissionControl
          description: Mission Control.
        - const: 4
          title: ResearchAndDevelopment
          description: Research and Development.
        - const: 5
          title: Runway
          description: The Runway.
        - const: 6
          title: TrackingStation
          description: The Tracking Station.
        - const: 7
          title: SpaceplaneHangar
          description: The Spaceplane Hangar.
        - const: 8
          title: VehicleAssemblyBuilding
          description: The Vehicle Assembly Building.
    LabEntry:
      type: object
      description: |-
        One entry in the `science.lab` channel payload: a Mobile Processing Lab
        (KSP's `ModuleScienceLab`) on the active vessel. The channel payload is a
        BARE ARRAY (`LabEntry[]`) or `null` when there is no active vessel or it
        carries no lab. Every field is nullable, and is `null` whenever the raw
        value is absent or non-finite.
      properties:
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Display title of the lab part (the part's `partInfo.title`, or its internal
            name when that is missing).
        dataStored:
          type:
            - number
            - "null"
          x-sitrep-unit: Mit
          description: |-
            Data currently stored in the lab for processing, in mits (KSP's
            `ModuleScienceLab.dataStored`). Compare against `LabEntry.dataStorage`.
        dataStorage:
          type:
            - number
            - "null"
          x-sitrep-unit: Mit
          description: The lab's data capacity in mits (KSP's `ModuleScienceLab.dataStorage`).
        storedScience:
          type:
            - number
            - "null"
          x-sitrep-unit: science
          description: |-
            Science the lab has generated and is holding, not yet transmitted (KSP's
            `ModuleScienceLab.storedScience`).
        processingData:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the lab is currently processing data (KSP's
            `ModuleScienceLab.processingData`).
        statusText:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's own status line for the lab (`ModuleScienceLab.statusText`), for
            display. Game-authored prose, so do not branch on it.
        scientistCount:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Number of crew with the Scientist trait aboard the lab part. `0` is a real
            reading: a lab with no scientist.
        scienceRate:
          type:
            - number
            - "null"
          x-sitrep-unit: science/day
          description: |-
            Science generated per GAME-DAY, not per second, at the lab's current stored
            data (KSP's `ModuleScienceConverter.CalculateScienceRate`, which scales the
            per-tick rate to a full day). `null` when the lab has no converter or the
            rate could not be read.
        isOperational:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the lab can operate right now (KSP's
            `ModuleScienceLab.IsOperational()`).
        valueModel:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Which value model produced `LabEntry.scienceRate` and
            `LabEntry.storedScience`, and which unit `LabEntry.dataStored` and
            `LabEntry.dataStorage` are really in. See ScienceValueModels.

            A lab is not the same kind of thing under every model. Stock's is terminal:
            it turns stored data into science per game-day. A provider whose lab is an
            intermediate pipeline stage (analysing a sample into a transmissible file,
            which then still has to be sent) produces no science itself, leaves
            `LabEntry.scienceRate` null, and carries its own rate in
            `LabEntry.extensions`. This tag is what tells that null apart from an idle
            lab.
        extensions:
          type:
            - object
            - "null"
          description: |-
            The provider-namespaced extension bag, lab half. Same mechanism and same
            rule as `ExperimentEntry.extensions`.
          additionalProperties: true
    LaunchArgs:
      type: object
      description: |-
        `ksp.launch`'s args: load a saved craft onto a launch site. The craft is
        identified by `LaunchArgs.shipName` plus the `LaunchArgs.facility` it was
        saved from (`"VAB"` or `"SPH"`, case-insensitive); the mod rebuilds the
        `.craft` path itself, so the wire never carries a native KSP type or an
        absolute path. An empty ship name fails with `CommandErrorCode.NotFound` and
        an unrecognised facility with `CommandErrorCode.Range`, before the game is
        ever touched.

        `LaunchArgs.crew` is an array of kerbal names (empty to launch unmanned),
        each assigned to a free craft seat.
      required:
        - shipName
        - facility
        - site
        - crew
      properties:
        shipName:
          type: string
          x-sitrep-unit: text
          description: |-
            The saved craft's name: its `.craft` file name without the extension, under
            the save's `Ships/VAB` or `Ships/SPH` folder. No such file fails with
            `CommandErrorCode.NotFound`.
        facility:
          type: string
          x-sitrep-unit: text
          description: |-
            `"VAB"` or `"SPH"` (case-insensitive). Any other value yields
            `CommandResult.errorCode` `CommandErrorCode.Range`.
        site:
          type: string
          x-sitrep-unit: text
          description: |-
            The KSP launch site name to launch from, `"LaunchPad"` by default. Refused
            unless the sending command centre is in the same planetary system (a planet
            and its moons) as the site.
        crew:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: Kerbal names to seat, in order. Empty to launch unmanned.
    LaunchSiteEntry:
      type: object
      description: |-
        One launch site in the `spaceCenter.launchSites` channel: the stock KSC pad
        and runway, any Making History sites, and any Kerbal Konstructs sites, which
        is everything registered in KSP's `PSystemSetup.Instance.LaunchSites`.

        The channel is a BARE ARRAY of these entries, NOT a wrapper object and NOT a
        KSC singleton: KSP has many launch sites, keyed by `LaunchSiteEntry.name`.
        The whole payload is `null` (not an empty array) when no sample has arrived
        yet, which tells "no data yet" apart from "zero sites". No per-payload
        `meta`, the same convention as `SystemBodies`.

        Held at the home command: each vantage receives a change after its own delay
        to home, at once on the ground network.
      properties:
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Internal launch-site id (`LaunchSite.name`): the stable key used with
            `PSystemSetup`'s lookup APIs; null when the live game hasn't populated it.
        displayName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Human-facing display name, as the game's own screens show it in the player's
            language, or the site's `name` when the game has none it can resolve.
        editorFacility:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Which editor this site launches from (the pad-vs-runway distinction) as the
            `EditorFacility` enum name (`"None"`/`"VAB"`/`"SPH"`); a VAB site is a pad,
            an SPH site a runway.
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index into `SystemBodies` of the body this site sits on; null when absent or
            unresolved (never a sentinel like -1).
        latitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Latitude of the site's spawn point on its body (`LaunchSite.SpawnPoint`);
            null when the site has no set spawn coordinate (never a fabricated `0`).
            Pairs with `LaunchSiteEntry.longitude` to give the site a location for the
            command-delay geometry (a launch is a command to this location).
        longitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Longitude of the site's spawn point on its body; null when the site has no
            set spawn coordinate. Pairs with `LaunchSiteEntry.latitude`.
        isStock:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether this is a stock KSP launch site (`PSystemSetup.IsStockLaunchSite`),
            false for Making History / Kerbal Konstructs sites.
        padOccupied:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether a vessel holds this site, by the rule the game's own launch
            admission applies: a saved vessel, active or not, whose landed-at site
            matches this one, debris excepted. Holds in any scene. True exactly when a
            launch from here would be refused as occupied; null when the save's vessel
            list is not loaded.
        padVesselTitle:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Name of the vessel holding this site (`LaunchSiteEntry.padOccupied` true),
            the one the game names in its own refusal; null when the site is clear or
            occupancy is unknown.
    LimitBreach:
      type: object
      description: |-
        The comparison behind a `GateOutcome.Fail`: the limit and the actual value,
        never a verdict on its own.

        "Too heavy" does not tell an operator whether to shed 200 kg or redesign.
        Carrying both numbers lets the CLIENT compose "1.4 t over the 18 t Launch
        Pad limit" through its own unit rendering, rather than the mod baking an
        English sentence in one unit system.
      required:
        - facility
        - facilityName
        - facilityLevel
        - quantity
        - unit
      properties:
        facility:
          type: string
          x-sitrep-unit: id
          description: |-
            The facility whose limit was exceeded, as its KSP `SpaceCenterFacility`
            member name (e.g. `LaunchPad`). An id for matching; show
            `LimitBreach.facilityName` to an operator. Empty for a limit that belongs to
            no facility, such as a time-warp rate.
        facilityName:
          type: string
          x-sitrep-unit: text
          description: |-
            The facility's name as the game writes it ("Astronaut Complex"), for the
            sentence an operator reads. Empty when no display name was available.

            This is the only place the display name is published, so use it rather than
            mapping `LimitBreach.facility` to English on the client, which would be
            wrong in every other language and miss any facility KSP adds.
        facilityLevel:
          type: number
          x-sitrep-unit: ratio
          description: Normalised facility level, as KSP reports it. Not a tier index.
        quantity:
          type: string
          x-sitrep-unit: id
          description: |-
            Which limit was exceeded, e.g. `mass`, `partCount`, `activeCrew` or
            `warpRate`. For a declared gate this is the CommandRequirement.Quantity of
            the requirement that failed; the vocabulary is set by whoever produced the
            breach, so it is open-ended.
        limit:
          type:
            - number
            - "null"
          x-sitrep-unit: n/a
          description: |-
            The limit, in whatever unit `LimitBreach.quantity` implies. NULL when the
            facility is unlimited.

            Never the sentinel. KSP returns `float.MaxValue` (and `int.MaxValue`, and a
            `Vector3` of them) at maximum level, and 3.4e38 rendered beside a craft mass
            is not "unlimited", it is a bug that reads as a units error. No limit is the
            ABSENCE of a limit. A breach with no limit should be unreachable, since
            nothing can exceed an unlimited limit.
        actual:
          type:
            - number
            - "null"
          x-sitrep-unit: n/a
          description: What the call actually asked for, same unit as `LimitBreach.limit`.
        unit:
          type: string
          x-sitrep-unit: id
          description: |-
            The unit token `LimitBreach.limit` and `LimitBreach.actual` are in, e.g. `t`
            for a mass limit, `count` for a part count.

            Carried as data because one breach type serves limits with different
            dimensions, so `LimitBreach.limit` and `LimitBreach.actual` have no fixed
            unit of their own. Read it from here, and render the comparison in the
            operator's own units.
    ManeuverFrame:
      type: integer
      description: |-
        The basis a planned burn's delta-v components are expressed in. Read this
        before interpreting a burn vector: a basis this contract does not recognise
        gives components that cannot be labelled.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: RadialNormalPrograde
          description: |-
            KSP's own maneuver-node basis: radial-out, normal, prograde, taken against
            the patch the node sits on at its own UT.
        - const: 1
          title: Unknown
          description: A frame this contract does not recognise.
    ManeuverNode:
      type: object
      description: |-
        One planned BURN. NAMED delta-v components in a NAMED frame
        (`ManeuverNode.frame`), with the impulsive case as the one where
        `ManeuverNode.ignitionUt` and `ManeuverNode.cutoffUt` are absent rather than
        equal.

        **A burn, not a stock node.** A stock node is an instantaneous impulse and
        real burns are not, which stock KSP itself concedes by computing
        `DeltaVStageInfo.stageBurnTime` and by carrying a burn-time readout on its
        own navball. `ManeuverNode.ut`, `ManeuverNode.ignitionUt` and
        `ManeuverNode.cutoffUt` carry the impulsive instant and the finite burn's
        start and end.

        **The impulsive case is absent duration, never zero duration.** A
        zero-duration burn with a thrust implies infinite acceleration, so any
        consumer computing thrust times duration over mass gets nonsense instead of
        an impulse. Absence says "not modelled", which is the true statement.
      required:
        - id
        - ut
        - patches
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            Stable, opaque id: the `nodeId` that `vessel.maneuver.update` and
            `vessel.maneuver.remove` take. It round-trips into those commands whether
            the node was created through `vessel.maneuver.add` or placed by hand in the
            map view. A live capture always carries one; the empty string appears only
            on a node replayed from a recording that carries no ids.
        ut:
          type: number
          x-sitrep-unit: ut
          description: |-
            The instant the burn's IMPULSIVE EQUIVALENT occurs: the one instant a
            zero-duration model has. Stock's `ManeuverNode.UT` is exactly this.

            **It is not the ignition time.** A finite burn starts before this and ends
            after it. `ManeuverNode.ignitionUt` and `ManeuverNode.cutoffUt` carry those
            two instants directly, so there is no "UT minus half the burn time"
            convention to guess.
        ignitionUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the engines light, or null when nothing supplies a burn-duration model
            for this craft.

            Null is a real reading and not a failure, on the same terms as
            `IPropagationProvider.CharacteristicCycleSeconds`. Stock computes a burn
            time only for a LOADED vessel (`VesselDeltaV.CheckDirtyAndRun` early-returns
            on `!loaded`), so an unloaded craft's queued burn honestly has no ignition
            time rather than a guessed one.

            **Never a sentinel equal to `ManeuverNode.ut`.** Collapsing an unmodelled
            duration onto the impulsive instant would make "we do not know when to light
            the engines" indistinguishable from "this burn is instantaneous", and only
            one of those is ever true.
        cutoffUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the engines cut, or null on the same terms as
            `ManeuverNode.ignitionUt`. Burn duration is `CutoffUt - IgnitionUt`.

            Carried as an instant rather than as a separate duration field on purpose: a
            duration alongside two instants is a third number that can disagree with the
            other two, and there is no reading of a disagreement that helps anybody.

            Not derivable as `Ut` plus half a duration in general. That symmetry holds
            only while the craft's mass is constant, and a burn long enough to be worth
            modelling is long enough to change it.
        frame:
          description: |-
            The basis `ManeuverNode.dvRadial`/`ManeuverNode.dvNormal`/
            `ManeuverNode.dvPrograde` are expressed in. Null only on a node replayed
            from a recording that does not carry it, on the same terms as
            `ManeuverNode.id`. Do not read null as the stock basis.
          anyOf:
            - $ref: "#/components/schemas/ManeuverFrame"
              x-sitrep-unit: enum
            - type: "null"
        dvRadial:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            First delta-v component in `ManeuverNode.frame`'s basis (radial under the
            stock basis). Null only if KSP's own dv component was non-finite
            (NaN/Infinity) this tick; the node is still sent, never dropped because one
            component came back bad.
        dvNormal:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            Second delta-v component in `ManeuverNode.frame`'s basis (normal). Null only
            if KSP's own dv component was non-finite this tick, as for
            `ManeuverNode.dvRadial`.
        dvPrograde:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            Third delta-v component in `ManeuverNode.frame`'s basis (prograde under the
            stock basis). Null only if KSP's own dv component was non-finite this tick,
            as for `ManeuverNode.dvRadial`.
        dvTotal:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            Magnitude of the burn's delta-v. Null only if KSP's own dv magnitude was
            non-finite this tick, as for `ManeuverNode.dvRadial`.
        patches:
          type: array
          items:
            $ref: "#/components/schemas/OrbitPatch"
          description: |-
            This node's post-burn future-orbit patch chain: element 0 is the orbit the
            vessel is on IMMEDIATELY after the burn (KSP's own
            `ManeuverNode.nextPatch`), followed by any subsequent SOI-transition
            patches, built the same way as `VesselOrbit.patches` but starting from the
            node's own `nextPatch`. ALWAYS an array, never null: empty when the solver
            has not produced a post-burn patch yet (a just-added node mid-tick).

            **How one burn links to the next.** A burn's INPUT trajectory is the patch
            in the PREVIOUS burn's chain whose `PatchEndTransition` is
            `TransitionType.Maneuver`, equivalently the one whose `EndUt` equals this
            burn's `ManeuverNode.ut`. For the first burn it is the craft's own
            `vessel.orbit`. Every chain is a suffix of the previous one, but the number
            of patches skipped varies with how many SOI crossings fall between the two
            burns, so counting positions is not the rule and gets it wrong the first
            time a crossing appears.

            KSP re-parents strictly sequentially: inserting a burn ahead of an existing
            one re-derives every later chain, so a burn's input is always the previous
            burn's result.

            **This whole field is a PATCHED-CONIC encoding.** It exists because a stock
            plan IS a sequence of conics joined at SOI boundaries. A planner that
            integrates has no such boundaries and will leave this empty while still
            describing a perfectly good burn, so nothing may treat an empty chain as a
            malformed node.
    Meta:
      type: object
      description: |-
        The envelope every stream sample, event and command reply carries: where it
        was observed from, when it was true in the game, when it was delivered, and
        how current it is.
      required:
        - source
        - validAt
        - seq
        - deliveredAt
        - vantage
        - active
        - staleness
        - timelineEpoch
      properties:
        source:
          type: string
          x-sitrep-unit: id
          description: The node the sample was read from.
        validAt:
          type: number
          x-sitrep-unit: ut
          description: |-
            When the payload was true in the game, in seconds of KSP universal time, the
            same base every `*Ut` field on every payload uses. This is the instant a
            reading is "as of", and the one a client compares against its view time to
            decide currency.

            A plain number in the TypeScript type, not a `Value` wrapper; its unit is
            still `"ut"`.
        seq:
          type: number
          x-sitrep-unit: id
          description: A number that rises by one with every frame the mod sends.
        deliveredAt:
          type: number
          x-sitrep-unit: ut
          description: |-
            When the mod handed the message to the transport, in the same universal time
            seconds as `Meta.validAt`. The two differ by the signal delay the vantage is
            under, so subtracting one from the other is how old the payload was when it
            arrived, and they are equal on a zero-delay link. A plain number in the
            TypeScript type, as `Meta.validAt` is.
        vantage:
          type: string
          x-sitrep-unit: id
          description: |-
            The place the payload was observed from: a `commandCentre.roster` id,
            `"meta"` for an instant-class topic no distance applies to, or empty when
            the connection is at no command centre because none is active.
        quality:
          description: |-
            Whether the payload's subject is under physics: `Quality.Loaded` while KSP
            simulates the craft, when its orbital elements are osculating rather than a
            coast a conic may advance, and `Quality.OnRails` while it coasts. Carried
            from the payload's own `meta.quality`, which only `vessel.orbit` states, and
            omitted from the wire on every other Topic rather than defaulted to a claim
            nothing made.
          anyOf:
            - $ref: "#/components/schemas/Quality"
              x-sitrep-unit: enum
            - type: "null"
        active:
          type: boolean
          x-sitrep-unit: flag
          description: Always true on a frame the mod sends.
        staleness:
          description: How current the sample is.
          allOf:
            - $ref: "#/components/schemas/Staleness"
              x-sitrep-unit: enum
        timelineEpoch:
          type: number
          x-sitrep-unit: id
          description: |-
            Generation counter for the current timeline: `0` when the mod starts,
            incremented once for every quickload or rewind. Carried on every envelope,
            streams and command responses alike, so a sample from an abandoned
            pre-rewind timeline can be told apart. A client compares it against its own
            last-seen epoch to detect a rewind, rather than inferring one from a
            backward `validAt` jump, which a reordered or coalesced delivery could mask.
        gapSinceUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The `Meta.validAt` of the last sample on this topic that precedes a KNOWN
            break in the record, set only on the first sample delivered after that break
            and `null` on every other sample.

            Non-null is a positive claim, not an absence: data existed between this
            universal time and the carrying sample's own `Meta.validAt`, and it is gone.
            Two things produce one. A blackout recording that overran its storage bound
            had its oldest span dropped, so the replay resumes mid-hole. A channel that
            does not record at all (a session fact, never aboard the craft: see
            ChannelDeclaration.Recordable) has no replay, so its first post-blackout
            sample carries the whole outage as the gap.

            A client draws it as a break rather than joining across it: a line
            interpolated through an outage looks like data. Omitted from the wire when
            there is no gap, as `Meta.quality` is when unstated.
    NoCommandArgs:
      type: object
      description: |-
        The empty args shape, for the core commands that operate on the current
        flight or the active vessel and so take nothing: `vessel.control.stage`,
        `vessel.target.clear`, `ksp.recover`, `ksp.revertToLaunch`,
        `ksp.toTrackingStation` and `ksp.toSpaceCenter`.

        **Send no `args` at all for these six.** The SDK's `send()` takes no second
        argument for a command typed this way, and anything you do put on the wire
        is read and discarded. Every other command requires its args.
      properties: {}
      x-sitrep-empty: true
    OrbitEncounter:
      type: object
      description: |-
        The next sphere-of-influence transition on the vessel's trajectory: see
        `VesselOrbit.encounter`.
      required:
        - transitionType
        - transitionUt
      properties:
        transitionType:
          description: |-
            The kind of transition: always `TransitionType.Encounter` (entering another
            body's sphere of influence) or `TransitionType.Escape` (leaving the current
            one).
          allOf:
            - $ref: "#/components/schemas/TransitionType"
              x-sitrep-unit: enum
        transitionUt:
          type: number
          x-sitrep-unit: ut
          description: Universal time at which the vessel crosses the sphere-of-influence boundary.
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index into `system.bodies` of the body being transitioned INTO; null if that
            body couldn't be resolved.
    OrbitEntry:
      type: object
      description: |-
        A body's Keplerian orbital elements, present on every `BodyEntry` except the
        root star. Each element is independently `null` when its value is absent or
        non-finite, never a NaN token on the wire. Every orbit has a defined node
        and periapsis, an equatorial or circular one included, so a `null`
        `OrbitEntry.lan` or `OrbitEntry.argPe` is a genuine absence and never stands
        for either shape.

        Units follow KSP's own, which are mixed: `OrbitEntry.sma` in metres;
        `OrbitEntry.inc`, `OrbitEntry.lan` and `OrbitEntry.argPe` in degrees;
        `OrbitEntry.meanAnomalyAtEpoch` in radians; `OrbitEntry.epoch` in UT
        seconds. There is no eccentric anomaly field (see `BodyEntry`).
      properties:
        sma:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: Semi-major axis, metres.
        ecc:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Eccentricity.
        inc:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: Inclination, degrees.
        lan:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: Longitude of ascending node, degrees.
        argPe:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: Argument of periapsis, degrees.
        meanAnomalyAtEpoch:
          type:
            - number
            - "null"
          x-sitrep-unit: rad
          description: Mean anomaly at epoch, radians.
        epoch:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: Epoch UT, seconds.
    OrbitPatch:
      type: object
      description: |-
        One conic segment of a vessel's future trajectory, a patched-conic "patch"
        in KSP's own sense (`Orbit.nextPatch`/`previousPatch`). A patch carries
        everything needed to propagate and draw it with no `system.bodies` join: its
        Keplerian elements, KSP's own already-computed shape fields
        (`OrbitPatch.peA`, `OrbitPatch.apA`, `OrbitPatch.semiLatusRectum`,
        `OrbitPatch.semiMinorAxis`), its body's gravitational parameter
        (`OrbitPatch.mu`) and the transitions at each end.

        Bodies are carried twice. `OrbitPatch.referenceBodyIndex` and
        `OrbitPatch.closestEncounterBodyIndex` are the identity, the `system.bodies`
        index every other body reference in this contract uses
        (`VesselOrbit.referenceBodyIndex` among them). `OrbitPatch.referenceBody`
        and `OrbitPatch.closestEncounterBody` are the body's name, for display.

        Every element is a plain, non-nullable double, unlike `VesselOrbit.lan` and
        `VesselOrbit.argPe`: a patch missing any element needed to propagate it is
        not sent at all, rather than sent with a stand-in.
      required:
        - sma
        - ecc
        - inc
        - lan
        - argPe
        - meanAnomalyAtEpoch
        - epoch
        - period
        - startUt
        - endUt
        - patchStartTransition
        - patchEndTransition
        - peA
        - apA
        - semiLatusRectum
        - semiMinorAxis
        - referenceBody
      properties:
        sma:
          type: number
          x-sitrep-unit: m
          description: Semi-major axis in metres, KSP's `Orbit.semiMajorAxis`.
        ecc:
          type: number
          x-sitrep-unit: "1"
          description: "Eccentricity, KSP's `Orbit.eccentricity`: below 1 for a closed patch."
        inc:
          type: number
          x-sitrep-unit: °
          description: Inclination in degrees, KSP's `Orbit.inclination`.
        lan:
          type: number
          x-sitrep-unit: °
          description: |-
            Longitude of the ascending node in degrees, KSP's `Orbit.LAN`. `0` when
            KSP's value is undefined (NaN).
        argPe:
          type: number
          x-sitrep-unit: °
          description: |-
            Argument of periapsis in degrees, KSP's `Orbit.argumentOfPeriapsis`. `0`
            when KSP's value is undefined (NaN).
        meanAnomalyAtEpoch:
          type: number
          x-sitrep-unit: rad
          description: |-
            Mean anomaly at `OrbitPatch.epoch` in radians, KSP's
            `Orbit.meanAnomalyAtEpoch`. `0` when KSP's value is undefined (NaN).
        epoch:
          type: number
          x-sitrep-unit: ut
          description: |-
            The universal time at which `OrbitPatch.meanAnomalyAtEpoch` holds, KSP's
            `Orbit.epoch`.
        period:
          type: number
          x-sitrep-unit: s
          description: |-
            Orbital period in seconds, KSP's `Orbit.period`. Always finite: a patch
            whose period is not finite is not carried in the chain.
        startUt:
          type: number
          x-sitrep-unit: ut
          description: |-
            Universal time at which the trajectory enters this patch, KSP's
            `Orbit.StartUT`.
        endUt:
          type: number
          x-sitrep-unit: ut
          description: |-
            Universal time at which the trajectory leaves this patch, KSP's
            `Orbit.EndUT`.
        patchStartTransition:
          description: How the trajectory enters this patch, KSP's `Orbit.patchStartTransition`.
          allOf:
            - $ref: "#/components/schemas/TransitionType"
              x-sitrep-unit: enum
        patchEndTransition:
          description: |-
            How the trajectory leaves this patch, KSP's `Orbit.patchEndTransition`.
            `TransitionType.Final` when it does not leave it.
          allOf:
            - $ref: "#/components/schemas/TransitionType"
              x-sitrep-unit: enum
        peA:
          type: number
          x-sitrep-unit: m
          description: |-
            Periapsis altitude above `OrbitPatch.referenceBody`'s mean radius in metres,
            KSP's `Orbit.PeA`.
        apA:
          type: number
          x-sitrep-unit: m
          description: |-
            Apoapsis altitude above `OrbitPatch.referenceBody`'s mean radius in metres,
            KSP's `Orbit.ApA`.
        semiLatusRectum:
          type: number
          x-sitrep-unit: m
          description: Semi-latus rectum in metres, KSP's `Orbit.semiLatusRectum`.
        semiMinorAxis:
          type: number
          x-sitrep-unit: m
          description: Semi-minor axis in metres, KSP's `Orbit.semiMinorAxis`.
        referenceBody:
          type: string
          x-sitrep-unit: text
          description: |-
            Name of the body this patch orbits, as `system.bodies` names it. For
            display; `OrbitPatch.referenceBodyIndex` is the identity.
        closestEncounterBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Name of the body this patch's trajectory most closely encounters, KSP's
            `Orbit.closestEncounterBody`; null when there is none. For display;
            `OrbitPatch.closestEncounterBodyIndex` is the identity.
        mu:
          type:
            - number
            - "null"
          x-sitrep-unit: m³/s²
          description: |-
            Parent body's standard gravitational parameter (GM), read off the same body
            the elements are relative to, so a patch can be propagated from what it
            carries, as `VesselOrbit.mu` does for a vessel's own orbit.

            Null only on a patch read off a recording that does not carry it, on the
            same terms as `ManeuverNode.id`. Never 0.
        referenceBodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Body this patch orbits, as its `system.bodies` index (KSP's
            `CelestialBody.flightGlobalsIndex`). This is the identity, where
            `OrbitPatch.referenceBody` is the display name, and it is the key every
            other body reference in this contract uses
            (`VesselOrbit.referenceBodyIndex`, `VesselTarget`, `TargetAvailable`,
            `VesselIdentity.ParentBodyIndex`).

            Null only on a patch read off a recording that does not carry it, as for
            `OrbitPatch.mu`. `0` is a real index (the star), so null is the only absent
            value.
        closestEncounterBodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            `OrbitPatch.closestEncounterBody`'s `system.bodies` index, on the same terms
            as `OrbitPatch.referenceBodyIndex`. Null when there is no encounter, and
            also null on a recording that does not carry it; read
            `OrbitPatch.closestEncounterBody` to tell the two apart.
    OrbitPayloadMeta:
      type: object
      description: |-
        `vessel.orbit`'s provenance stamp, which also says whether the craft is
        under physics. The orbit is the one payload that states it, because a conic
        can advance a coast and cannot advance osculating elements.
      required:
        - source
        - quality
      properties:
        source:
          type: string
          x-sitrep-unit: id
          description: "`\"vessel:<guid>\"` for the craft the orbit belongs to."
        quality:
          description: Whether the craft is on rails or loaded under physics.
          allOf:
            - $ref: "#/components/schemas/Quality"
              x-sitrep-unit: enum
    PartBounds:
      type: object
      description: |-
        A `VesselPart`'s local bounding box: `PartBounds.size` is the part's
        `prefabSize` (a per-part-type constant approximating its rendered bounds),
        `PartBounds.center` the mesh-centre offset from the part's own origin
        (`Part.boundsCentroidOffset`). A fuel-line part reports bounds wrapping the
        whole conduit, as KSP does.

        Both are in the PART's own frame (`part-local`), never the vessel's: they
        are authored fields of the part's config node, so one value has to serve
        every instance of that part however it was assembled. A consumer placing the
        box on a ship rotates both by that part's `orgRot` before adding
        `VesselPart.position`, which is `vessel-local`.
      required:
        - size
      properties:
        size:
          type: object
          description: "`Part.prefabSize`: the part's untransformed bounding-box extents (metres)."
          required:
            - x
            - y
            - z
          properties:
            x: &a3
              type: number
              x-sitrep-unit: m
            y: *a3
            z: *a3
        center:
          type:
            - object
            - "null"
          description: |-
            `Part.boundsCentroidOffset`: mesh-centre offset from the part's own origin
            (metres, PART-local); `null` when absent.

            Part-local, not vessel-local: an authored per-part-type constant like
            `PartBounds.size` beside it, so one value serves every instance of the part
            at whatever attitude it was assembled at. `VesselPart.position` is
            `vessel-local`, so adding the two raw mixes frames and lands the box
            somewhere the part is not; rotate this one by the part's `orgRot` first.
          required:
            - x
            - y
            - z
          properties:
            x: &a4
              type: number
              x-sitrep-unit: m
            y: *a4
            z: *a4
    PartModuleState:
      type: object
      description: |-
        One module's behavioural state in `VesselPart.moduleStates`.
        `PartModuleState.type` discriminates the module and `PartModuleState.state`
        carries the standardised deploy/activation word, whose vocabulary is on that
        property.
      required:
        - type
        - state
      properties:
        type:
          type: string
          x-sitrep-unit: id
          description: |-
            Discriminator: `solarPanel` / `radiator` / `antenna` / `parachute` /
            `engine` / `drill` / `landingGear`. `cargoBay` is a defined vocabulary value
            that no module currently produces.
        state:
          type: string
          x-sitrep-unit: text
          description: |-
            The standardised deploy/activation state, one closed vocabulary across every
            `PartModuleState.type` rather than each module's own enum spelling.

            - `extended` / `retracted` / `deploying` / `retracting`, for anything that
              animates: solar panels, radiators, antennas, landing gear.
            - `stowed` / `armed` / `extended` / `broken`, the parachute lifecycle.
              `armed` means staged and waiting for its atmospheric trigger, which is not
              the same as deployed.
            - `active` / `inactive`, for engines and drills.
            - `unknown` when the underlying game enum maps to none of the above, which
              is a statement that the state was read and not recognised rather than a
              stand-in for retracted.
        tracking:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: "Solar-panel-only: sun-tracking gimbal active. `null` for every other type."
        flameout:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Engine-only: fuel-starved. `null` unless `true` (never emitted as a bare
            `false`).
    PartResourceFlow:
      type: object
      description: |-
        One resource row in `VesselPart.resources`: storage
        (`PartResourceFlow.amount`/`PartResourceFlow.maxAmount`) plus live flow
        (`PartResourceFlow.flow`/`PartResourceFlow.nominalFlow`).

        **Flow scope.** `PartResourceFlow.flow` and `PartResourceFlow.nominalFlow`
        are populated only for modules whose live rate can be read directly: solar
        panels (`ModuleDeployableSolarPanel.flowRate` and `chargeRate`), alternators
        (`ModuleAlternator.outputRate`), and engine propellant consumption
        (`Propellant.currentRequirement`, signed negative). Resource converters,
        fuel cells and drills report storage only, with no rate.
        `PartResourceFlow.nominalFlow` is `null` whenever it would equal
        `PartResourceFlow.flow`.
      required:
        - amount
        - maxAmount
      properties:
        amount:
          type: number
          x-sitrep-unit: units
          description: "`PartResource.amount`: current stored amount."
        maxAmount:
          type: number
          x-sitrep-unit: units
          description: "`PartResource.maxAmount`: storage capacity."
        flow:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            Signed units per second: positive is producing, negative is consuming.
            `null` when no module with a readable rate contributes.
        nominalFlow:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            The rate at 100% efficiency, with the same sign as `PartResourceFlow.flow`
            (a solar panel's rated output). `null` when no module has a nominal rate, or
            when it would equal `PartResourceFlow.flow`.
    PartsPower:
      type: object
      description: |-
        The `parts.power` channel payload: the active vessel's electric-charge
        production surface (solar panels, batteries, fuel cells, engine alternators,
        and a rolled-up production total). A single object, or `null` when there is
        no active vessel or it carries none of the four kinds of part.

        When the payload is present all four arrays are present too, each possibly
        empty; they are typed nullable so a client stays safe if one is ever
        missing.
      properties:
        solarPanels:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/SolarPanelEntry"
          description: Every deployable solar panel module on the vessel.
        batteries:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/BatteryEntry"
          description: Every part that stores electric charge.
        fuelCells:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/FuelCellEntry"
          description: Every converter module that produces electric charge.
        alternators:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AlternatorEntry"
          description: Every engine alternator module on the vessel.
        totalProductionEc:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            Total electric-charge production in EC per second: the sum of every solar
            panel's `SolarPanelEntry.flowRate` and every alternator's
            `AlternatorEntry.outputRate`. Fuel cells are not included. Null when no
            finite total could be read.
    PayloadMeta:
      type: object
      description: |-
        The provenance stamp carried inside a payload that describes one subject,
        such as most `vessel.*` payloads and `time.warp` (`VesselIdentity.Meta` and
        so on).

        It says what the payload is about, and nothing about its delivery: `seq`,
        `deliveredAt`, `vantage` and `validAt` are on the envelope `Meta`, one per
        `stream-data` frame.

        `PayloadMeta.source` takes one of two forms: `"vessel:<guid>"` when the
        payload describes one craft, or `"game"` when it describes the session. A
        SCET threshold alarm accepts a reading only from a payload whose source is
        the alarm's own subject.
      required:
        - source
      properties:
        source:
          type: string
          x-sitrep-unit: id
          description: |-
            `"vessel:<guid>"` when the payload describes one craft, or `"game"` when it
            describes the session.
    PhysicsMode:
      type: integer
      description: |-
        The active vessel's physics-simulation regime, derived from KSP's own
        `Vessel.loaded` and `Vessel.packed` flags. It is a discrete enum in its own
        right, NOT a quality band on `OrbitPayloadMeta.quality`. A widget that
        switches propagation or dead-reckoning strategy reads it to know whether the
        craft is on-rails conics, a packed cluster, or a fully physics-simulated
        vessel.

        Mapping:

        - `!loaded` ⇒ `PhysicsMode.OnRails`: the vessel is unloaded, its motion is
          pure on-rails conic propagation, no PhysX at all.
        - `loaded && packed` ⇒ `PhysicsMode.Packed`: loaded into the scene but still
          packed (rails-following near the active vessel, not yet unpacked into full
          physics).
        - `loaded && !packed` ⇒ `PhysicsMode.Unpacked`: fully physics-simulated
          (off-rails).

        `PhysicsMode.Unknown` covers a raw value this contract does not recognise
        (same convention as `SasMode` and `VesselType`).
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: OnRails
          description: "Not loaded: pure on-rails conic propagation, no physics simulation."
        - const: 1
          title: Packed
          description: |-
            Loaded into the scene but still packed, following rails near the active
            vessel.
        - const: 2
          title: Unpacked
          description: "Loaded and unpacked: fully physics-simulated, off rails."
        - const: 3
          title: Unknown
          description: A raw value this contract does not recognise.
    PropagationCertification:
      type: integer
      description: |-
        Whether a caller will accept a result past the span the provider vouches
        for, which is a question about CERTIFICATION and not about which model ran.

        Both values get the same model out of the same provider. Under an
        integrating provider that is the craft's conic either way, because there is
        no integrated point query to select. What differs is whether the caller is
        willing to read it past the point anybody stands behind it, which
        IPropagationProvider.CanPropagate already decides and which the caller has
        to state.

        **`PropagationCertification.Unspecified` is zero and means nothing was
        chosen.** Same rule as `TrajectoryKind`'s zero: a default value must never
        grant the permissive setting without anyone deciding.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Unspecified
          description: Nobody chose. Callers refuse rather than pick on their behalf.
        - const: 1
          title: Unbounded
          description: |-
            Return a result wherever the solver can reach, horizon or no horizon. What a
            PLANNING search wants: a transfer grid asks a two-body question about
            instants nobody has reached, on purpose, and a bound derived from how long
            osculating elements stand in for an integrated path is not a statement about
            that question.
        - const: 2
          title: CertifiedOnly
          description: |-
            Return results only across spans the provider vouches for, and decline past
            them. What an OPERATIONAL prediction wants: a reacquisition sweep quoting a
            UT read off arc nobody stands behind is a confident figure with nothing
            under it.
    PropagationHorizon:
      type: object
      description: |-
        The window over which an element set is authoritative, as stated by
        whichever propagation provider produced it.

        Measured from the sample's observation instant, not from
        `VesselOrbit.epoch`. `Epoch` is the mean-anomaly reference epoch and can sit
        far from when the sample was taken.
      required:
        - kind
        - trajectoryKind
      properties:
        kind:
          description: |-
            How far the elements may be carried forward. When
            `PropagationHorizonKind.Until`, `PropagationHorizon.untilUt` says where the
            window ends.
          allOf:
            - $ref: "#/components/schemas/PropagationHorizonKind"
              x-sitrep-unit: enum
        trajectoryKind:
          description: |-
            What kind of trajectory these elements describe: a conic that is the path,
            or a snapshot of an integrated one.

            The horizon says how far a client may extrapolate; this says whether a conic
            is the right renderer at all, and the one cannot be inferred from the other.
            An analytic provider reports `PropagationHorizonKind.Unbounded`, and so may
            an integrating provider where perturbations are small and the horizon is
            genuinely long. A client that reasons "unbounded, therefore analytic" draws
            a closed conic for an integrated trajectory: right at the sample instant,
            wrong as a path.

            To identify the provider for diagnostics, read `system.uplinks`, which
            carries each Uplink's id, version and availability.
          allOf:
            - $ref: "#/components/schemas/TrajectoryKind"
              x-sitrep-unit: enum
        untilUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The last UT these elements are authoritative for. Set if and only if
            `PropagationHorizon.kind` is `PropagationHorizonKind.Until`; null otherwise,
            never a sentinel standing in for "forever".
    PropagationHorizonKind:
      type: integer
      description: |-
        How far an element set may be carried forward.

        `PropagationHorizonKind.Unspecified` is 0, so a producer that does not set
        the horizon gets the refusing value rather than the permissive one.

        `PropagationHorizonKind.Unbounded` is a claim, made by a provider that
        genuinely has no limit (an analytic two-body solver). It is its own value
        rather than an infinite `PropagationHorizon.untilUt`, so "forever" never has
        to be recognised as an extreme number.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Unspecified
          description: No provider stated one. Treat as unpropagatable.
        - const: 1
          title: Unbounded
          description: "Authoritative for all future UT: an analytic solver with no horizon."
        - const: 2
          title: Until
          description: Authoritative until `PropagationHorizon.untilUt`.
    Quality:
      type: integer
      description: |-
        Whether a payload's subject is simulated under physics (`Quality.Loaded`) or
        moving on rails (`Quality.OnRails`).
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: OnRails
          description: "Moving on rails: KSP is not simulating it, and its orbit is a fixed conic."
        - const: 1
          title: Loaded
          description: Loaded and simulated under physics.
    RecoveryCrewEntry:
      type: object
      description: |-
        One crew member aboard at recovery: an entry of
        `RecoveryReport.crewBreakdown`.
      required:
        - name
        - trait
        - isTourist
        - xpGained
        - levelsGained
        - newLevel
      properties:
        name:
          type: string
          x-sitrep-unit: text
          description: The kerbal's name, which is also their roster key.
        trait:
          type: string
          x-sitrep-unit: text
          description: The kerbal's career trait (e.g. `"Pilot"`).
        isTourist:
          type: boolean
          x-sitrep-unit: flag
          description: Whether the kerbal is a tourist, who earns no experience.
        xpGained:
          type: number
          x-sitrep-unit: count
          description: Experience points this flight added.
        levelsGained:
          type: number
          x-sitrep-unit: count
          description: |-
            How many experience levels this flight added: `RecoveryCrewEntry.newLevel`
            minus the level before.
        newLevel:
          type: number
          x-sitrep-unit: count
          description: The kerbal's experience level after this flight, 0 to 5 in stock.
    RecoveryPartEntry:
      type: object
      description: |-
        One recovered-part group: an entry of `RecoveryReport.partBreakdown`. Parts
        of the same kind and the same recovered value are grouped, hence
        `RecoveryPartEntry.count`. Every value is already scaled by the recovery
        factor.
      required:
        - partName
        - partTitle
        - count
        - partValue
        - resourcesValue
        - totalValue
      properties:
        partName:
          type: string
          x-sitrep-unit: text
          description: The part's `partInfo.name` (e.g. `"mk1pod.v2"`).
        partTitle:
          type: string
          x-sitrep-unit: text
          description: The part's `partInfo.title` (e.g. `"Mk1 Command Pod"`).
        count:
          type: number
          x-sitrep-unit: count
          description: How many parts are in this group. At least 1.
        partValue:
          type: number
          x-sitrep-unit: funds
          description: The recovered dry value of one part in the group, excluding its resources.
        resourcesValue:
          type: number
          x-sitrep-unit: funds
          description: |-
            The recovered value of the resources the group's parts held, summed over the
            group.
        totalValue:
          type: number
          x-sitrep-unit: funds
          description: |-
            The group's recovered dry value: `RecoveryPartEntry.partValue` times
            `RecoveryPartEntry.count`. Does not include
            `RecoveryPartEntry.resourcesValue`.
    RecoveryReport:
      type: object
      description: |-
        The payload for the `recovery.lastSummary` channel: the most recent vessel
        recovery in the current save, as KSP's mission recovery dialog reports it.
        Delivered on the Delivery.ReliableOrdered lane, so a late subscriber is sent
        the last recovery. The recovery-side counterpart of `CrashReport`.

        Published only for a real craft: recovering debris, a flag or a vessel of
        unknown type publishes nothing. The four breakdown lists can be empty while
        the totals are present, if KSP's dialog could not be read for them.
      required:
        - capturedAtUT
        - vesselName
        - recoveryLocation
        - recoveryFactor
        - scienceEarned
        - totalScience
        - fundsEarned
        - totalFunds
        - reputationEarned
        - totalReputation
        - displayReputation
        - scienceBreakdown
        - partBreakdown
        - resourceBreakdown
        - crewBreakdown
      properties:
        capturedAtUT:
          type: number
          x-sitrep-unit: ut
          description: Universal time of the recovery capture.
        vesselName:
          type: string
          x-sitrep-unit: text
          description: The recovered vessel's name, as KSP holds it (`ProtoVessel.vesselName`).
        recoveryLocation:
          type: string
          x-sitrep-unit: text
          description: |-
            Where the vessel came down: KSP's own recovery-location string (e.g.
            `"KSC"`, `"Water"`).
        recoveryFactor:
          type: string
          x-sitrep-unit: text
          description: |-
            KSP's own recovery-factor display string (e.g. `"100%"`), the payout
            multiplier for landing precision.
        scienceEarned:
          type: number
          x-sitrep-unit: science
          description: Science this recovery earned, as KSP's recovery dialog totals it.
        totalScience:
          type: number
          x-sitrep-unit: science
          description: |-
            The career's science balance as the recovery dialog reports it. 0 in a save
            with no science (Sandbox).
        fundsEarned:
          type: number
          x-sitrep-unit: funds
          description: |-
            Funds this recovery earned, after the recovery factor and any strategy
            modifiers KSP applies to a recovery.
        totalFunds:
          type: number
          x-sitrep-unit: funds
          description: |-
            The career's funds balance as the recovery dialog reports it. 0 in a save
            with no funds (Science or Sandbox).
        reputationEarned:
          type: number
          x-sitrep-unit: rep
          description: |-
            Reputation this recovery earned, after any strategy modifiers KSP applies.
            Show it only when `RecoveryReport.displayReputation` is true.
        totalReputation:
          type: number
          x-sitrep-unit: rep
          description: |-
            The career's reputation as the recovery dialog reports it. Show it only when
            `RecoveryReport.displayReputation` is true.
        displayReputation:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether reputation applies to this save: false in Science and Sandbox, where
            the reputation fields carry nothing meaningful.
        scienceBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryScienceEntry"
          description: |-
            Each science subject recovered, in the order KSP's dialog lists them. Empty
            when nothing was recovered or the dialog could not be read.
        partBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryPartEntry"
          description: |-
            Each group of recovered parts, in the order KSP's dialog lists them. Empty
            when the dialog could not be read.
        resourceBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryResourceEntry"
          description: |-
            Each recovered resource, in the order KSP's dialog lists them. Empty when
            there were none or the dialog could not be read.
        crewBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryCrewEntry"
          description: |-
            Each crew member aboard at recovery. Empty for an uncrewed vessel or when
            the dialog could not be read.
    RecoveryResourceEntry:
      type: object
      description: |-
        One recovered-resource group: an entry of
        `RecoveryReport.resourceBreakdown`.
      required:
        - resourceName
        - amount
        - unitValue
        - totalValue
      properties:
        resourceName:
          type: string
          x-sitrep-unit: text
          description: The resource's KSP definition name, e.g. `LiquidFuel`.
        amount:
          type: number
          x-sitrep-unit: units
          description: How much of the resource was recovered, summed over every part that held it.
        unitValue:
          type: number
          x-sitrep-unit: funds
          description: |-
            The recovered value of one unit of the resource, already scaled by the
            recovery factor.
        totalValue:
          type: number
          x-sitrep-unit: funds
          description: |-
            The recovered value of the whole amount: `RecoveryResourceEntry.unitValue`
            times `RecoveryResourceEntry.amount`.
    RecoveryScienceEntry:
      type: object
      description: |-
        One science subject recovered: an entry of
        `RecoveryReport.scienceBreakdown`.
      required:
        - subjectId
        - subjectTitle
        - dataGathered
        - scienceAmount
      properties:
        subjectId:
          type: string
          x-sitrep-unit: id
          description: The KSP science subject id, e.g. `crewReport@KerbinSrfLandedLaunchPad`.
        subjectTitle:
          type: string
          x-sitrep-unit: text
          description: The subject's display title, as KSP writes it.
        dataGathered:
          type: number
          x-sitrep-unit: Mit
          description: How much data was recovered for this subject.
        scienceAmount:
          type: number
          x-sitrep-unit: science
          description: Science earned for this subject by this recovery.
    RemoveManeuverNodeArgs:
      type: object
      description: "`vessel.maneuver.remove`'s arguments: the manoeuvre node to delete."
      required:
        - nodeId
      properties:
        nodeId:
          type: string
          x-sitrep-unit: id
          description: "The node to delete: a `ManeuverNode.id` from `vessel.maneuver`."
    ResourceAmount:
      type: object
      description: |-
        One resource's amounts aboard the vessel. See `VesselResources` for what an
        absent key and an absent channel mean.
      required:
        - current
        - max
        - active
      properties:
        current:
          type: number
          x-sitrep-unit: units
          description: |-
            How much of the resource the vessel holds now, the amount
            `Vessel.GetConnectedResourceTotals` reports. `0` with a positive
            `ResourceAmount.max` is a real reading: carried and empty.
        max:
          type: number
          x-sitrep-unit: units
          description: |-
            The vessel's capacity for the resource, the maximum
            `Vessel.GetConnectedResourceTotals` reports. Always greater than zero: a
            resource with no capacity is left out of the map.
        active:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Presence flag: `true` for every resource reported this tick, so a
            present-but-zero resource (`{current: 0, max: > 0, active: true}`) is
            distinguishable from one that is not reported. Treat a missing or `false`
            entry as "not reported", never as a zero reading. This is presence ONLY: it
            says nothing about flow or rate.
    RevertAvailability:
      type: object
      description: |-
        The `ksp.revertAvailability` Topic payload: whether the two stock in-flight
        "revert" actions are currently available, so a widget can gate its
        Revert-to-Launch and Revert-to-Editor controls exactly as KSP's own pause
        menu does. Read from the two static `FlightDriver` flags KSP reads when it
        draws those buttons.

        The whole payload is `null` (no key emitted) outside the flight scene: the
        two flags are only meaningful in flight, and the backing `FlightDriver`
        statics carry leftover values from the previous flight otherwise. When
        present, both bools are concrete (never null): a `false` means "this revert
        is not available right now".

        **Mapping (as KSP's `PauseMenu.drawStockRevertOptions` draws it):** the
        pause menu shows the "Revert to Launch" button (which calls
        `FlightDriver.RevertToLaunch()`, restoring the `PostInitState`) when
        `FlightDriver.CanRevertToPostInit` is set, and the "Revert to VAB/SPH"
        buttons (which call `FlightDriver.RevertToPrelaunch(...)`, returning to the
        editor) when `FlightDriver.CanRevertToPrelaunch` is set. So
        `RevertAvailability.canRevertToLaunch` maps to `CanRevertToPostInit` and
        `RevertAvailability.canRevertToEditor` maps to `CanRevertToPrelaunch`: the
        KSP field names read backwards to their button labels, so the mapping is the
        inverse of a naive name match.

        A scene-side fact with no per-payload `Meta` (the envelope's applies),
        classified DelayRole.TrueNow: a ground-side game-state fact, not
        comms-delayed vessel telemetry.
      required:
        - canRevertToEditor
        - canRevertToLaunch
      properties:
        canRevertToEditor:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Can the active flight be reverted back to the editor (VAB/SPH)? Mirrors
            `FlightDriver.CanRevertToPrelaunch`.
        canRevertToLaunch:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Can the active flight be reverted to its launch (on-the-pad) state? Mirrors
            `FlightDriver.CanRevertToPostInit`.
    RevertToEditorArgs:
      type: object
      description: |-
        `ksp.revertToEditor`'s args, which editor the flight reverts back into.
        `RevertToEditorArgs.editor` is a small opaque string (`"vab"` or `"sph"`,
        case-insensitive) rather than the KSP `EditorFacility` enum; an unrecognised
        value fails with `CommandErrorCode.Range` before the game is ever touched.

        `ksp.revertToLaunch`, `ksp.toTrackingStation`, `ksp.toSpaceCenter` and
        `ksp.recover` take no args (they operate on the current flight / active
        vessel), so they have no arg type here.
      required:
        - editor
      properties:
        editor:
          type: string
          x-sitrep-unit: text
          description: |-
            `"vab"` or `"sph"` (case-insensitive). Any other value yields
            `CommandResult.errorCode` `CommandErrorCode.Range`.
    RoboticsAvailability:
      type: object
      description: |-
        The `robotics.available` channel payload: a single object (or `null` when
        there is no active vessel) whose one field states whether the active vessel
        carries ANY Breaking Ground robotic servo. It is its own Topic because the
        `robotics.servos` array is `null` both when the vessel has no robotic parts
        and when there is no vessel, and a widget needs to tell "no robotics on this
        craft" from "nothing to show".

        It is DISTINCT from the Breaking Ground DLC-presence fact
        (`deployed.available`): this reflects parts present on THIS vessel, so it is
        Delayed, whereas DLC presence is a ground-side TrueNow fact.

        `RoboticsAvailability.available` is three-state. `null` means the craft
        could not be surveyed: a recording that does not carry this field, or a live
        read where one part could not be read, since "no robotic parts" is a claim
        about every part. `false` is the definite "this craft carries none". A
        reader that treats null as false tells the operator there are no robotic
        parts on a craft that may be full of them.
      properties:
        available:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            True when the vessel carries at least one robotic servo, false when it
            definitely carries none, null when it could not be surveyed.
    RosterCommsControlSource:
      type: integer
      description: |-
        A roster vessel's control level, as stock CommNet reports it
        (`Vessel.connection.GetControlLevel()`), for
        `VesselRosterEntry.commsControlSource`. Not the same type as
        `CommsControlSource`, which belongs to the active vessel's `comms.*`
        channels and whatever comms mod provides them.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: None
          description: "A measurement: the vessel has no control source."
        - const: 1
          title: Partial
          description: |-
            Partial control: KSP's `PARTIAL_MANNED` or `PARTIAL_UNMANNED` level, such as
            a probe core with no link home.
        - const: 2
          title: Full
          description: "Full control: KSP's `FULL` level."
        - const: 3
          title: Unknown
          description: |-
            The game reported a control level this build does not name. Not
            `RosterCommsControlSource.None`: nothing was measured to be absent, the
            level simply has no tier here yet.
    RotorReverseArgs:
      type: object
      description: |-
        Args for `robotics.rotor.reverse`: flips the rotor's spin direction. This is
        the one robotics command that is genuinely a toggle (the widget's intent is
        "spin the other way" relative to whatever the rotor is doing now), so it
        carries no state field, only the `RotorReverseArgs.partId` to act on.
      required:
        - partId
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's `flightID.ToString()`: the id the read side stamps on each
            `parts.robotics` entry.
    RotorSetValueArgs:
      type: object
      description: |-
        Args for the rotor scalar-limit commands
        (`robotics.rotor.setRpmLimit`/`setTorqueLimit`/`setBrake`), the ABSOLUTE
        value to apply, keyed by `RotorSetValueArgs.partId`. The bounded ones
        (torque 0 to 100, brake 0 to 200) are range-checked before they are sent;
        out of range fails with `CommandResult.errorCode` `CommandErrorCode.Range`.
      required:
        - partId
        - value
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's `flightID.ToString()`: the id the read side stamps on each
            `parts.robotics` entry.
        value:
          type: number
          x-sitrep-unit: ratio
          description: |-
            The absolute value to apply: the rpm limit, the torque-limit percent (0 to
            100), or the brake percent (0 to 200).
    SasMode:
      type: integer
      description: |-
        The SAS autopilot's hold mode, KSP's `VesselAutopilot.AutopilotMode` with
        the same member names. The directional modes follow the navball's current
        speed mode (orbit, surface or target). `SasMode.Unknown` stands for a value
        this contract does not recognise.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: StabilityAssist
          description: Holds the vessel's current attitude.
        - const: 1
          title: Prograde
          description: Points along the velocity vector.
        - const: 2
          title: Retrograde
          description: Points against the velocity vector.
        - const: 3
          title: Normal
          description: Points along the orbit normal.
        - const: 4
          title: Antinormal
          description: Points against the orbit normal.
        - const: 5
          title: RadialIn
          description: Points towards the body being orbited.
        - const: 6
          title: RadialOut
          description: Points away from the body being orbited.
        - const: 7
          title: Target
          description: Points towards the current target.
        - const: 8
          title: AntiTarget
          description: Points away from the current target.
        - const: 9
          title: Maneuver
          description: Points along the burn vector of the next maneuver node.
        - const: 10
          title: Unknown
          description: A mode this contract does not recognise.
    SaveSettingsArgs:
      type: object
      description: |-
        Arguments to `settings.save`: one Save press, applied together and written
        to the settings file once. Never delayed by light time.

        Safe to send again. A save sets each row to the value named, so repeating
        one that already landed changes nothing. That matters because a save that
        times out may still land.

        Refused, with nothing changed, when any row is not declared or any value is
        not one its row can hold. A save that changes the values but cannot write
        the file is not refused: the values are in force, and `settings.gonogo`'s
        `SettingsModel.persistence` says the file was not written.
      required:
        - changes
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SettingsChange"
          description: |-
            Every row to change, each with its new value. Rows not listed keep their
            values.
    SavedShipEntry:
      type: object
      description: |-
        One craft file in the `spaceCenter.savedShips` channel, a saved VAB or SPH
        design the player can launch, read from the save's craft folders via the
        stock `CraftProfileInfo` metadata loader.

        The channel is a BARE ARRAY of these entries, one per `.craft` file keyed by
        `SavedShipEntry.file`. The whole payload is `null` (not an empty array) when
        no sample has arrived yet. Held at the home command.
      properties:
        name:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: Craft name (`CraftProfileInfo.shipName`).
        file:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The `.craft` file name without its extension, under the save's `Ships/VAB`
            or `Ships/SPH` folder. Unique within a facility, which `SavedShipEntry.name`
            is not: two files can carry the same ship name. It is what `ksp.launch`'s
            `shipName` resolves, so send this back rather than `SavedShipEntry.name`.
        partCount:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: Part count (`CraftProfileInfo.partCount`).
        totalMass:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: Total mass in tonnes (`CraftProfileInfo.totalMass`).
        facility:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Which editor built it: the `EditorFacility` enum name, `"VAB"` or `"SPH"`
            (`CraftProfileInfo.shipFacility`). A display label; see
            `SavedShipEntry.facilityOrdinal`.
        facilityOrdinal:
          description: |-
            `SavedShipEntry.facility`'s KSP ORDINAL, typed to `KspEditorFacility`.

            This one is not a display concern. A client sends the facility straight back
            as the `ksp.launch` command's `facility` argument, so never substitute a
            default editor for a value it does not recognise: a substituted default that
            becomes a dispatched argument launches a spaceplane from the launchpad.
            KSP's enum also declares `None`.

            `null` when the capture carried no facility, which is a third value and must
            not be read as either editor.
          anyOf:
            - $ref: "#/components/schemas/KspEditorFacility"
              x-sitrep-unit: enum
            - type: "null"
        requiresFunds:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            Funds needed before this can launch, the full craft cost
            (`CraftProfileInfo.totalCost`).
        missingParts:
          type:
            - array
            - "null"
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            Parts referenced by the craft that are not yet unlocked/purchased
            (`CraftProfileInfo.UnavailableShipParts`); an empty array when the craft is
            buildable as-is.
    ScetAlarm:
      type: object
      description: |-
        One SCET alarm as the simulation host holds it: the `alarm.scet` channel is
        a bare array of these.

        The roster exists so an operator can see which alarms are still set after a
        reconnect, and so a client can remove an entry it no longer remembers. The
        roster is held in memory for the game session and is not written to the
        save: when the session ends it is gone, and a client sets its alarms again.
        It is ground-side bookkeeping, a list of things somebody asked for rather
        than a reading of any craft, which is why the channel does not ride the
        reveal clock.
      required:
        - id
        - name
        - armedBy
        - vantage
        - subject
        - condition
        - state
        - onFire
        - actsOn
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            The client's own id for the alarm, minted where the alarm was created and
            carried unchanged. Setting an alarm under an id already held REPLACES it, so
            repeating `alarm.scet.arm` is idempotent and a reconnect cannot duplicate a
            row.
        name:
          type: string
          x-sitrep-unit: text
          description: |-
            What the operator called it. Echoed so a roster row a client no longer
            recognises can still be named on screen.
        armedBy:
          type: string
          x-sitrep-unit: id
          description: |-
            The command centre the `alarm.scet.arm` command was sent from, as a
            `commandCentre.roster` id.

            Who ASKED for the alarm, never where it is read. That is
            `ScetAlarm.vantage`, and the two are separate jobs: this is also the one
            field a screen at a different vantage may render, because the condition and
            the target would tell it something about a craft faster than the light
            carrying it.
        vantage:
          type: string
          x-sitrep-unit: id
          description: |-
            The place whose knowledge the condition is read against, and therefore the
            place that decides WHEN this alarm comes due. A `commandCentre.roster` id
            (`"ground:<name>"`, `"vessel:<guid>"`). An empty vantage in the command is
            resolved to the alarm's own `ScetAlarm.subject` when the alarm is set.

            A vantage that IS the subject reads the craft's true state, so the alarm
            comes due at the instant the condition is met. Any other vantage reads what
            that place has been told, which is a light-time old and different
            everywhere, so the same condition comes due there when the light carrying it
            lands. The vantage decides when, never whether.

            **Distinct from `ScetAlarm.armedBy`, which is provenance.** That says where
            the command came from and nothing else. An operator at one centre may
            legitimately ask when ANOTHER centre will know, and where the command
            entered cannot express that.

            A place, never a connection. Two operators sharing a command centre share
            its knowledge and its result, and a browser reconnecting is the same place
            it was before, so the simulation never learns that clients exist.
        subject:
          type: string
          x-sitrep-unit: id
          description: |-
            What the condition is about: `"vessel:<guid>"` for a craft, or `"game"` for
            something the whole simulation shares. The same vocabulary `meta.source`
            uses.

            A time condition is always `"game"`: universal time is the game's, and a
            clock has no craft to belong to. A threshold names the craft, and this is
            what stops it silently re-aiming when the player switches vessels: the
            simulation compares this against the `meta.source` stamped on the payload it
            read, and a reading about somebody else's craft is ignored.

            A threshold on something the save owns rather than a craft is `"game"` too,
            and `career.status` is the one core publishes: there is one career, and no
            vessel switch can change which one is being read, so there is nothing for a
            third token to tell apart. That is the rule for a contributed Topic as well,
            not a special case for this one.
        condition:
          description: What the alarm watches for, as it was set.
          allOf:
            - $ref: "#/components/schemas/ScetAlarmCondition"
        state:
          description: |-
            Where the alarm has got to: still watching, fired, unreachable or cancelled.
            See `ScetAlarmState`.
          allOf:
            - $ref: "#/components/schemas/ScetAlarmState"
              x-sitrep-unit: enum
        firedAtUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time the alarm fired at, or `null` until it has fired. On the
            craft's clock, like `ScetAlarmCondition.ut`.
        onFire:
          type: array
          items:
            $ref: "#/components/schemas/ScetAlarmAction"
          description: |-
            What the craft does when this alarm fires, in order. Empty for an alarm that
            only stops the warp and says so. See `ScetAlarmAction`.
        actsOn:
          type: string
          x-sitrep-unit: id
          description: |-
            The craft `ScetAlarm.onFire` acts on, as `"vessel:<guid>"`, or empty while
            there are no actions.

            The actions run only if this craft is the one being flown when the alarm
            fires, and are withheld otherwise: a time condition belongs to the game
            rather than to any craft, so after a vessel switch its actions would
            otherwise land on whatever happened to be active.
    ScetAlarmAction:
      type: object
      description: |-
        One thing the craft does in the frame its alarm fires, as a flight computer
        would: evaluated aboard, fired aboard, acted aboard.

        Held only by an alarm read at its own subject's vantage. An alarm judged
        against what a command centre has been told comes due a light-time after the
        craft passed the condition, and acting on the craft in that same frame would
        carry the ground's decision to the craft faster than light, so
        `alarm.scet.arm` refuses such an alarm. A ground-side alarm's action travels
        as an ordinary command instead.

        Every kind but `ScetAlarmActionKind.Stage` TOGGLES, against the state the
        craft reports at the moment of the fire, which is what pressing the group's
        key does.
      required:
        - kind
        - group
      properties:
        kind:
          description: |-
            What the action does: a stock singleton such as staging or SAS, or the
            custom group named by `ScetAlarmAction.group`.
          allOf:
            - $ref: "#/components/schemas/ScetAlarmActionKind"
              x-sitrep-unit: enum
        group:
          type: number
          x-sitrep-unit: id
          description: |-
            `ScetAlarmActionKind.ActionGroup` only: the custom group's 1-based index, as
            `vessel.control.setActionGroup` takes it. Zero for every other kind.
    ScetAlarmActionKind:
      type: integer
      description: |-
        What a SCET alarm's onboard action does to the craft when the alarm fires.

        A typed member for each stock singleton and one for every custom group, so
        no name ever crosses the wire. A player may call a custom group "Stage", and
        two custom groups may share a name, so a name is not an identity: a custom
        group is addressed by its index in `ScetAlarmAction.group`, and cannot be
        read as the stage command however it is labelled.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: ActionGroup
          description: Toggle the custom action group whose index is `ScetAlarmAction.group`.
        - const: 1
          title: Stage
          description: Activate the next stage.
        - const: 2
          title: Sas
          description: Toggle SAS.
        - const: 3
          title: Rcs
          description: Toggle RCS.
        - const: 4
          title: Lights
          description: Toggle the lights.
        - const: 5
          title: Gear
          description: Toggle the landing gear.
        - const: 6
          title: Brakes
          description: Toggle the brakes.
        - const: 7
          title: Abort
          description: Toggle the abort action group.
    ScetAlarmArmArgs:
      type: object
      description: |-
        `alarm.scet.arm`'s args: register an alarm with the simulation host, or
        replace one already registered under the same `ScetAlarmArmArgs.id`.

        Never delayed. Setting an alarm changes nothing aboard the craft, so there
        is no light-time fiction to honour, and the same reasoning as
        `time.setWarpIndex` applies: this is a control on the simulation, not a
        signal to a spacecraft. Delayed it would also be unusable, because an alarm
        for an event less than one light-time away could never be set in time, and a
        delayed command is dropped outright during a blackout, which is exactly when
        a SCET alarm earns its keep.
      required:
        - id
        - name
        - vantage
        - subject
        - condition
        - onFire
        - actsOn
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            The client's own id for the alarm, echoed as `ScetAlarm.id`. An id already
            held is replaced rather than duplicated.
        name:
          type: string
          x-sitrep-unit: text
          description: What the operator called the alarm, echoed as `ScetAlarm.name`.
        vantage:
          type: string
          x-sitrep-unit: id
          description: |-
            See `ScetAlarm.vantage`. Empty is accepted and resolved to
            `ScetAlarmArmArgs.subject` when the alarm is set, so the alarm is read at
            its own subject.
        subject:
          type: string
          x-sitrep-unit: id
          description: See `ScetAlarm.subject`. Empty is read as `"game"`.
        condition:
          description: What the alarm watches for. See `ScetAlarmCondition`.
          allOf:
            - $ref: "#/components/schemas/ScetAlarmCondition"
        onFire:
          type: array
          items:
            $ref: "#/components/schemas/ScetAlarmAction"
          description: |-
            See `ScetAlarm.onFire`. Non-empty only where the alarm is read at its own
            subject's vantage and that subject is a craft, or the condition is a time on
            the game's clock; any other alarm carrying actions is refused rather than
            accepted with them dropped.
        actsOn:
          type: string
          x-sitrep-unit: id
          description: |-
            See `ScetAlarm.actsOn`. A time condition carrying actions must name the
            craft the operator means them for. A threshold on a craft acts on that
            craft, so empty resolves to its subject and any other craft is refused.
    ScetAlarmCondition:
      type: object
      description: |-
        What a SCET alarm watches for, on the craft's own clock.

        A discriminated shape: `ScetAlarmCondition.kind` says which of the fields
        below carry meaning. For `ScetAlarmConditionKind.Time` that is
        `ScetAlarmCondition.ut` and `ScetAlarmCondition.leadSeconds`; for
        `ScetAlarmConditionKind.Threshold` it is `ScetAlarmCondition.topic`,
        `ScetAlarmCondition.fieldPath`, `ScetAlarmCondition.op`,
        `ScetAlarmCondition.threshold` and `ScetAlarmCondition.sustainSeconds`; for
        `ScetAlarmConditionKind.ContractParameter` it is
        `ScetAlarmCondition.contractId`, `ScetAlarmCondition.parameterTitle`,
        `ScetAlarmCondition.targetState` and `ScetAlarmCondition.sustainSeconds`.
      required:
        - kind
        - ut
        - leadSeconds
        - topic
        - fieldPath
        - op
        - threshold
        - sustainSeconds
        - contractId
        - parameterTitle
        - targetState
      properties:
        kind:
          description: |-
            Which kind of condition this is, and so which of the other fields carry
            meaning. The rest are left at their defaults and ignored.
          allOf:
            - $ref: "#/components/schemas/ScetAlarmConditionKind"
              x-sitrep-unit: enum
        ut:
          type: number
          x-sitrep-unit: ut
          description: |-
            The instant the alarm is set for, as a universal time on the CRAFT's clock
            rather than on the clock the command centre is reading.

            The difference between the two is the one-way light time, and it moves
            continuously as the craft does. A client that subtracts it once, at the
            moment the operator clicks, is right only for that instant; this field is
            the instant itself, compared against the game's own clock every tick, so the
            result stays right however the geometry changes between setting the alarm
            and its firing.
        leadSeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            How long before `ScetAlarmCondition.ut` warp is stopped, in seconds, so the
            operator has real time in hand before the instant they set the alarm for.
            Zero stops the warp at the instant itself.

            The stop and the notice are two separate moments: warp halts at `Ut -
            LeadSeconds`, and the alarm fires at `Ut`, which arrives in real time
            because the warp is already stopped.
        topic:
          type: string
          x-sitrep-unit: id
          description: |-
            Threshold only: the Topic whose payload carries the value to watch, as the
            client spells a Topic (`"vessel.flight"`).

            A Topic and a path into it, rather than one flat key. The flat key space is
            the client's own and has no meaning to the simulation, which holds Topics
            and the payloads it builds for them; addressing a reading the way the wire
            addresses it is what lets an operator point at a value they can already see
            on screen.
        fieldPath:
          type: string
          x-sitrep-unit: id
          description: |-
            Threshold only: the dotted path to the value inside
            `ScetAlarmCondition.topic`'s payload (`"altitudeAsl"`,
            `"relativePosition.x"`). Empty addresses the payload itself, which is never
            a number, so it never matches.
        op:
          description: |-
            Threshold only: how the reading is compared to
            `ScetAlarmCondition.threshold`.
          allOf:
            - $ref: "#/components/schemas/ScetAlarmThresholdOp"
              x-sitrep-unit: enum
        threshold:
          type: number
          x-sitrep-unit: n/a
          description: |-
            Threshold only: the number the operator chose, in whatever unit
            `ScetAlarmCondition.fieldPath` is published in.

            Declared with no unit of its own because it genuinely has none until the
            field beside it is resolved: the same field says metres for one alarm and
            kilonewtons for the next. A consumer that wants to render it looks up the
            unit of the addressed field.
        sustainSeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            Threshold and contract parameter: how long the condition must hold, in
            seconds, before the alarm fires. Zero fires on the first reading that
            matches.

            **Warp is stopped at the first match, not at the fire.** A sustain window is
            a span of the craft's time, and under warp one tick covers thousands of
            seconds of it, so a window measured across warped ticks would be satisfied
            by two samples and mean nothing. Stopping first is what gives the window
            real ticks to be measured over. The cost is that a condition that matches
            once and then stops matching has still stopped the warp; that is the
            fail-safe side to err on, because the operator keeps their game and loses
            only the time they were skipping.
        contractId:
          type: string
          x-sitrep-unit: id
          description: |-
            Contract parameter only: the contract's id, as
            `career.status.contracts.active` carries it.
        parameterTitle:
          type: string
          x-sitrep-unit: text
          description: |-
            Contract parameter only: the objective's title within that contract, matched
            exactly. The first objective with the title is the one watched.
        targetState:
          description: "Contract parameter only: the state the objective must reach."
          allOf:
            - $ref: "#/components/schemas/KspParameterState"
              x-sitrep-unit: enum
    ScetAlarmConditionKind:
      type: integer
      description: |-
        Which kind of condition a SCET alarm watches for.

        Every alarm has a vantage, so a kind is only about WHAT is watched, and each
        kind names its own matcher: a threshold walks a dotted path to a number, and
        a contract parameter, which lives in a list no path can index, finds its
        contract and objective by identity.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Time
          description: An instant on the craft's own clock, as a universal time.
        - const: 1
          title: Threshold
          description: |-
            A value aboard the craft crossing a number the operator chose, compared
            against the reading the simulation actually holds rather than against the
            one the command centre has been told.

            This is the kind that cannot be done anywhere else. A time alarm needs only
            a clock, and a client has one; a threshold needs the craft's true state,
            which reaches the ground a light-time late and by then no longer says
            whether it is above 100 km NOW.
        - const: 2
          title: ContractParameter
          description: |-
            One objective of one active contract reaching a state the operator chose, as
            `career.status.contracts.active` reports it.

            Level rather than edge, like the threshold: an objective already in its
            target state when the alarm is set is a condition that holds. A contract no
            longer active leaves the condition unmet for ever, which is the fail-safe
            outcome for a contract that was completed, failed or withdrawn by some other
            route.
    ScetAlarmDisarmArgs:
      type: object
      description: |-
        `alarm.scet.disarm`'s args: forget the alarm with this id. Silently succeeds
        for an id the host does not hold, so a client reconciling its list against
        the roster never has to ask first.

        Never delayed, for the reason its opposite is not: the inverse of an instant
        act must not be slower than the act.
      required:
        - id
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: The `ScetAlarm.id` of the alarm to remove.
    ScetAlarmFired:
      type: object
      description: |-
        The notice that a SCET alarm has fired and the warp has been stopped.

        **It says THAT one fired and WHEN, and deliberately nothing about the
        craft.** The stop is universal, because warp is; the telemetry is not, and
        stays a light-time behind. So an operator can be told their alarm went off
        while every reading beside it still shows the craft as it was minutes ago,
        and this payload carries nothing that would close that gap early. Whatever
        the craft was doing at `ScetAlarmFired.firedAtUt` arrives when it arrives.

        The id and the instant are the honest minimum. The id is the operator's own
        handle, which tells them nothing they did not already write down. The
        instant is inseparable from the stop: without it a warp that halted at one
        universal time is indistinguishable from one that halted at another, and the
        operator cannot tell which of two alarms stopped them. The other fields say
        where it was learned and whether its actions were withheld for want of the
        right craft, and neither is a reading of the craft.

        The condition is not echoed: for a threshold it would be a claim about the
        craft ahead of the light that carries it. A client that wants to name the
        alarm reads the roster.
      required:
        - id
        - firedAtUt
        - vantage
        - actionsWithheld
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: Which alarm, as the `ScetAlarm.id` it was set under.
        firedAtUt:
          type: number
          x-sitrep-unit: ut
          description: The universal time it fired at, on the craft's clock.
        vantage:
          type: string
          x-sitrep-unit: id
          description: |-
            The place that learned it, echoing the alarm's `ScetAlarm.vantage`.

            Carried rather than left to the client to look up, because a reader that has
            to consult the roster first is a reader that will act on the wrong notice. A
            notice at the subject's own vantage is a fact about the craft at the instant
            it happened; a notice at anywhere else is a statement about what that place
            has been told, true only there.
        actionsWithheld:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the alarm held onboard actions and they were withheld because the
            craft named by `ScetAlarm.actsOn` was not the one being flown. False for an
            alarm with no actions.

            Says nothing about how the craft responded to an action that WAS sent. That
            is a fact aboard the craft, and it reaches the ground the way every other
            one does, a light-time later in the craft's own telemetry: this notice
            travels at once and must not carry it.
    ScetAlarmState:
      type: integer
      description: |-
        Where a SCET alarm has got to.

        A latch, not a level: `ScetAlarmState.Fired` is reached once and stays, so a
        condition that keeps holding cannot stop the warp again on the next tick.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Armed
          description: Watching. The condition has not been met.
        - const: 1
          title: Fired
          description: The condition was met, warp was stopped, and the notice went out.
        - const: 2
          title: Unreachable
          description: |-
            The craft the condition watches no longer exists, so the alarm can never
            come due.

            Only a threshold reaches this: a time condition has no subject to lose,
            because universal time belongs to the game. It is on the roster because the
            simulation knows the craft is gone and the command centre does not, and a
            row that will never fire must read as dead rather than as pending forever.
        - const: 3
          title: Cancelled
          description: |-
            The player switched to a different craft before the alarm came due, so it
            will never fire. An alarm belongs to the craft being flown when it was set,
            whatever its condition reads, and a switch ends every alarm still watching.
            A kerbal on EVA counts as the craft they stepped out of.
    ScetAlarmThresholdOp:
      type: integer
      description: |-
        How a threshold condition compares the reading to the operator's number.

        The same six the client's own alarm list offers, so an alarm set on the
        command vantage and the same alarm set on the craft's clock mean the same
        thing and can be checked against each other at zero delay.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: GreaterThan
          description: Reading is greater than the threshold.
        - const: 1
          title: GreaterThanOrEqual
          description: Reading is greater than or equal to the threshold.
        - const: 2
          title: LessThan
          description: Reading is less than the threshold.
        - const: 3
          title: LessThanOrEqual
          description: Reading is less than or equal to the threshold.
        - const: 4
          title: Equal
          description: |-
            Reading equals the threshold exactly.

            Offered for parity with the client's list, and a knife edge on anything
            continuous: the reading is a sample, and under warp the samples are
            thousands of game-seconds apart, so a craft can pass straight through the
            value without one landing on it. An inequality is almost always the
            condition an operator actually means.
        - const: 5
          title: NotEqual
          description: |-
            Reading differs from the threshold. The inverse of
            `ScetAlarmThresholdOp.Equal`, and just as much a knife edge on anything
            continuous.
    ScienceTransmission:
      type: object
      description: |-
        A science result the craft has started sending home, as
        `science.experiment.transmit` returns it: when the stream began at the craft
        and how long the transmitter needs to send all of it. The result has left
        the craft at `ScienceTransmission.startedAt` plus
        `ScienceTransmission.streamSeconds`, and it lands one light-time after that.

        Absent from the reply when the backend cannot say, as a modelling mod that
        drains results continuously cannot. A client then has nothing to draw the
        transmission from, which is the truth: an absent transmission is never a
        zero-length one.
      required:
        - subjectId
        - title
        - startedAt
        - streamSeconds
        - dataAmount
      properties:
        subjectId:
          type: string
          x-sitrep-unit: id
          description: |-
            The research subject's id (`ScienceSubject.id`), the same key
            `currency.<guid>.science` credits it under.
        title:
          type: string
          x-sitrep-unit: text
          description: The result's human title, e.g. "Crew Report from Kerbin's Shores".
        startedAt:
          type: number
          x-sitrep-unit: ut
          description: Universal Time at the craft when the transmitter was handed the result.
        streamSeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            How long the transmitter takes to send every packet, from its packet size
            and interval. A floor: a transmitter starved of charge holds between
            packets, and one already busy sends this after what it is holding.
        dataAmount:
          type: number
          x-sitrep-unit: Mit
          description: The amount of data sent.
    SensorEntry:
      type: object
      description: |-
        One entry in the `science.sensors` channel payload: a single
        environmental-sensor module (`ModuleEnviroSensor`: thermometer, barometer,
        gravioli detector, accelerometer, and any modded sensor sharing the module)
        on the ACTIVE vessel. The channel payload is a BARE ARRAY (`SensorEntry[]`)
        or `null` when there is no active vessel or it carries no sensor module.

        One entry per sensor module, with `SensorEntry.type` carrying the raw
        `SensorType` enum name (`TEMP`/`PRES`/`GRAV`/`ACC`/...) as a string, so
        modded sensor types and several instances of the same type each get their
        own row. Group and label by `SensorEntry.type`.

        Every field is nullable, and is `null` whenever the raw value is absent.
      properties:
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Flight-scoped `part.flightID` as a string (null when it is KSP's unset
            value, 0), the join key that tells symmetric same-named sensor parts apart.
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Display title of the sensor part (the part's `partInfo.title`, or its
            internal name when that is missing).
        type:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The raw `SensorType` enum name (`TEMP`/`PRES`/`GRAV`/`ACC`/...) passed
            through as a string so modded types survive.
        readout:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The sensor's current human-readable readout string (KSP's `readoutInfo`,
            e.g. "293.1K" or "Off").
        active:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether the sensor is switched on (KSP's `ModuleEnviroSensor.sensorActive`).
    ServoEntry:
      type: object
      description: |-
        One entry in the `robotics.servos` channel payload, a single Breaking Ground
        robotic servo on the active vessel. The payload is a BARE ARRAY of these, or
        `null` when there is no active vessel or it carries no servo; read
        `robotics.available` to tell those two apart.

        `ServoEntry.type` is the servo kind as a plain string, not an enum. The
        kinds are `"rotor"`, `"hinge"`, `"rotationServo"` and `"piston"`, plus
        `"servo"` for a servo of a kind not recognised (a part pack's own, or one a
        later KSP adds), which carries only the readings every servo has.

        **This list is a description, not a rule.** The kinds are derived from KSP's
        `BaseServo` itself rather than from any written-down set. A consumer should
        switch on the kinds it can draw and ignore the rest, never assume this
        sentence is exhaustive.

        Fields that belong to one kind are `null` on every other kind: angles on
        hinges and rotation servos, extensions on pistons, and the rpm, output,
        brake, direction and torque fields on rotors.
      properties:
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The part's display title (KSP's `Part.partInfo.title`), or its internal name
            when it has no part info.
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The part's `Part.flightID` as a string: unique per part for the life of the
            flight, so it tells apart symmetric servos that share a name. Null when the
            part has no flight id yet.
        type:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The servo kind: `"rotor"`, `"hinge"`, `"rotationServo"`, `"piston"`, or
            `"servo"` for a kind not recognised. See this type's summary.
        servoIsLocked:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: True when the servo is locked in place (KSP's `BaseServo.servoIsLocked`).
        servoIsMotorized:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: True when the servo has a motor (KSP's `BaseServo.servoIsMotorized`).
        servoMotorIsEngaged:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            True when the servo's motor is engaged (KSP's
            `BaseServo.servoMotorIsEngaged`).
        servoMotorLimit:
          type:
            - number
            - "null"
          x-sitrep-unit: "%"
          description: |-
            The motor's torque limit as a percentage (KSP's
            `BaseServo.servoMotorLimit`). On a rotor it is a percentage of
            `ServoEntry.maxTorque`.
        motorState:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The motor's state text as KSP displays it (`BaseServo.motorState`). Free
            text, not a fixed vocabulary.
        currentAngle:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: Current angle in degrees. Hinges and rotation servos only.
        targetAngle:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: Angle the servo is driving to, in degrees. Hinges and rotation servos only.
        traverseVelocity:
          type:
            - number
            - "null"
          x-sitrep-unit: n/a
          description: |-
            KSP's `traverseVelocity` setting for hinges, rotation servos and pistons.
            Its unit follows the kind (KSP drives angles for the first two and an
            extension for a piston), so no single unit is declared.
        currentRPM:
          type:
            - number
            - "null"
          x-sitrep-unit: rpm
          description: The rotor's current speed in revolutions per minute. Rotors only.
        rpmLimit:
          type:
            - number
            - "null"
          x-sitrep-unit: rpm
          description: The rotor's rpm limit setting. Rotors only.
        normalizedOutput:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            The rotor's normalised output (KSP's
            `ModuleRoboticServoRotor.normalizedOutput`). Rotors only.
        brakePercentage:
          type:
            - number
            - "null"
          x-sitrep-unit: "%"
          description: |-
            The rotor's brake setting as a percentage (KSP's `brakePercentage`). Rotors
            only.
        currentExtension:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: The piston's current extension in metres. Pistons only.
        targetExtension:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: The extension the piston is driving to, in metres. Pistons only.
        counterClockwise:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Rotor spin direction (rotor entries only, `null` for every other kind).
            KSP's `ModuleRoboticServoRotor.rotateCounterClockwise`: `true` means the
            rotor spins counter-clockwise.
        maxTorque:
          type:
            - number
            - "null"
          x-sitrep-unit: kN
          description: |-
            Rotor torque ceiling in kN (rotor entries only, `null` for every other
            kind). KSP's `ModuleRoboticServoRotor.maxTorque`: the scale
            `ServoEntry.servoMotorLimit` (a percentage) is a fraction of.

            The unit is kN because that is how KSP's own editor UI labels it:
            `maxTorque` feeds the part's editor-visible motor output line (localization
            token `#autoLOC_8002342`, "<<1>>kN max: Extra mass <<2>>t"). The same value
            also feeds a Unity angular drive's `maximumForce`, which on an angular drive
            is technically a moment.
    ServoSetEnabledArgs:
      type: object
      description: |-
        Args shared by every robotics boolean actuation
        (`robotics.servo.setMotor`/`setLock` and
        `robotics.rotor.setMotor`/`setLock`): an absolute state to apply, never a
        toggle, like every other actuation command (see `SetEnabledArgs`). Keyed by
        `ServoSetEnabledArgs.partId`, the `flightID` string `parts.robotics`
        publishes.
      required:
        - partId
        - enabled
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's `flightID.ToString()`: the id the read side stamps on each
            `parts.robotics` entry.
        enabled:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            The state to apply: for `setMotor`, `true` engages the part's motor and
            `false` disengages it; for `setLock`, `true` locks the part and `false`
            unlocks it. `setMotor` on a servo with no motor fails with
            `CommandErrorCode.CapabilityMismatch`.
    ServoSetTargetArgs:
      type: object
      description: |-
        Args for the servo target commands (`robotics.servo.setTarget`), the
        ABSOLUTE angle (hinge) or extension (piston) to drive to, keyed by the
        part's `ServoSetTargetArgs.partId`. `ServoSetTargetArgs.partId` is the same
        `flightID` string `parts.robotics` publishes on each servo entry, so a
        widget sends back the exact id it displays. A rotor has no target (it spins
        continuously); a `setTarget` aimed at one fails with
        `CommandResult.errorCode` `CommandErrorCode.ModeUnavailable`.
      required:
        - partId
        - value
      properties:
        partId:
          type: string
          x-sitrep-unit: id
          description: |-
            The part's `flightID.ToString()`: the id the read side stamps on each
            `parts.robotics` entry.
        value:
          type: number
          x-sitrep-unit: ratio
          description: "Absolute target: hinge angle (degrees) or piston extension."
    SetActionGroupArgs:
      type: object
      description: |-
        `vessel.control.setActionGroup`'s args: set a numbered custom action group
        on or off. Gear, brakes, lights and abort are their own commands
        (`SetEnabledArgs`), so a client never string-matches a group name to lower
        the landing gear.
      required:
        - group
        - state
      properties:
        group:
          type: number
          x-sitrep-unit: id
          description: |-
            The custom action group number, from 1. The upper bound belongs to the
            installed action-groups provider: 10 in stock KSP (ag1 to ag10), and more
            where a mod adds them. A group below 1 or beyond that bound fails with
            `CommandErrorCode.Range`.
        state:
          type: boolean
          x-sitrep-unit: flag
          description: "`true` to switch the group on, `false` to switch it off."
    SetControlAxesArgs:
      type: object
      description: |-
        `vessel.control.setAxes`'s args: a partial update of the held fly-by-wire
        override. Every field is nullable, and only the fields you set change their
        held value, so one axis can be driven on its own without disturbing the
        others.

        Every value is -1..1 and analog: a value between the ends gives a
        proportional input (for example proportional RCS from a mapped analog
        stick). A value outside -1..1 is clamped rather than refused. The trims are
        re-applied every frame alongside the axes while the override is on, so SAS
        does not overwrite them.

        Held values only act on the vessel while the override is on (see
        `vessel.control.setFlyByWire`); values set while it is off are held and take
        effect when it is turned on. The command fails when there is no active
        vessel or the vessel cannot currently be controlled. The applied axes read
        back on `vessel.control`.
      properties:
        pitch:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Pitch input, -1..1. Null leaves the held value unchanged.
        yaw:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Yaw input, -1..1. Null leaves the held value unchanged.
        roll:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Roll input, -1..1. Null leaves the held value unchanged.
        x:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Translation X input (RCS right/left), -1..1. Null leaves the held value
            unchanged.
        y:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Translation Y input (RCS up/down), -1..1. Null leaves the held value
            unchanged.
        z:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            Translation Z input (RCS forward/back), -1..1. Null leaves the held value
            unchanged.
        pitchTrim:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Pitch trim, -1..1. Null leaves the held value unchanged.
        yawTrim:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Yaw trim, -1..1. Null leaves the held value unchanged.
        rollTrim:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: Roll trim, -1..1. Null leaves the held value unchanged.
    SetControlFrameArgs:
      type: object
      description: |-
        `system.frame.set`'s args: the frame to put the view in.

        A caller names the pair, not the sets. Unlike `ControlFrame`, which reports
        `PrimaryBodies` and `SecondaryBodies`, this carries only the two heads: the
        producer decides which bodies fall on each side of a pulsating frame from
        its own body tree.

        Refusal is normal: stock KSP's frame follows the active vessel's reference
        body and cannot be set, so the command fails with `ModeUnavailable`.
      required:
        - kind
      properties:
        kind:
          description: The kind of frame to select.
          allOf:
            - $ref: "#/components/schemas/ControlFrameKind"
              x-sitrep-unit: enum
        centreBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: The `bodyName` to centre on. Required for the centred frames.
        primaryBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The `bodyName` a rotating frame turns about. Required for the rotating
            frames.
        secondaryBody:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The `bodyName` a rotating frame is anchored to. Required for the rotating
            frames.
        targetFrameSelected:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            `true` to ask for the target frame, which sits beside
            `SetControlFrameArgs.kind` rather than inside it.
    SetEnabledArgs:
      type: object
      description: |-
        Args shared by every plain on/off actuation command (`setSas`, `setRcs`,
        `setGear`, `setBrakes`, `setLights`, `setAbort`): an absolute state to
        apply, never a toggle. Under light-time delay a toggle that arrives after
        unknown intervening changes would race them, so there are no toggle
        commands.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          x-sitrep-unit: flag
          description: "`true` to switch the system on (or fire abort), `false` to switch it off."
    SetFlyByWireArgs:
      type: object
      description: |-
        `vessel.control.setFlyByWire`'s args: turn the fly-by-wire override on or
        off. Unlike the other `vessel.control.*` commands this is not a one-shot
        actuation: KSP resets the raw control axes every physics frame, so while the
        override is on the mod re-applies the held axes and trims (set with
        `vessel.control.setAxes`) every frame.

        Turning it on resumes the held values (0 until an axis has been set).
        Turning it off stops the override and resets every held axis and trim to 0,
        so control returns to the player and SAS with nothing left over. Turning it
        on fails when there is no active vessel or the vessel cannot currently be
        controlled; turning it off is never refused for control reasons.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            `true` turns the override on, `false` turns it off and resets the held axes
            and trims to 0.
    SetPausedArgs:
      type: object
      description: "`time.setPaused`'s arguments: whether the game is paused."
      required:
        - paused
      properties:
        paused:
          type: boolean
          x-sitrep-unit: flag
          description: True to pause the game, false to resume it.
    SetSasModeArgs:
      type: object
      description: "`vessel.control.setSasMode`'s arguments: the SAS mode to hold."
      required:
        - mode
      properties:
        mode:
          description: The SAS mode to hold.
          allOf:
            - $ref: "#/components/schemas/SasMode"
              x-sitrep-unit: enum
    SetTargetArgs:
      type: object
      description: |-
        `vessel.target.set`'s args: a discriminated union, written as
        `SetTargetArgs.kind` plus the fields that kind uses.
        `SetTargetArgs.vesselId` is the stable vessel id, never an array index, and
        a vessel id and a body index travel in separate fields so they cannot be
        confused.

        A request missing a field its kind needs, or with `TargetKind.Other`, fails
        with `CommandErrorCode.NotFound`, as does a well-formed request that matches
        no live vessel, part, body or position.
      required:
        - kind
      properties:
        kind:
          description: |-
            What kind of thing to target; decides which of the other fields are
            required.
          allOf:
            - $ref: "#/components/schemas/TargetKind"
              x-sitrep-unit: enum
        vesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The target vessel's guid. Required when `SetTargetArgs.kind` is
            `TargetKind.Vessel`, and also when it is `TargetKind.Part`, where it names
            the vessel that owns the target part (a part id is unique only within its
            vessel).
        partId:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            The docking port's KSP `Part.flightID`, looked up among the parts of the
            vessel named by `SetTargetArgs.vesselId`. Required when `SetTargetArgs.kind`
            is `TargetKind.Part`; `null` for every other kind.
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            The body's `system.bodies` index, the same index
            `VesselOrbit.referenceBodyIndex` uses. Required when `SetTargetArgs.kind` is
            `TargetKind.Body`, and also when it is `TargetKind.Position`, where it names
            the body `SetTargetArgs.latitude` and `SetTargetArgs.longitude` are measured
            on.
        latitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            The target position's latitude, in degrees. Required when
            `SetTargetArgs.kind` is `TargetKind.Position` (a surface point picked on a
            map, e.g. a `spaceCenter.pois` entry's coordinate).
        longitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            The target position's longitude, in degrees. Required when
            `SetTargetArgs.kind` is `TargetKind.Position`.
    SetThrottleArgs:
      type: object
      description: "`vessel.control.setThrottle`'s arguments: the main throttle setting."
      required:
        - value
      properties:
        value:
          type: number
          x-sitrep-unit: ratio
          description: |-
            The throttle from 0 to 1. A value outside that range is refused with
            `CommandErrorCode.Range` rather than clamped.
    SetVantage:
      type: object
      description: |-
        Client-to-server: select the command centre this connection commands from
        and observes at. Governs both the downlink cursor read and the
        command-dispatch vantage. The id must name a currently-active command
        centre, or the request is refused with an `unknownVantage` error and the
        connection keeps the vantage it had.

        A connection that has never sent one observes at the home command (the
        roster entry whose `isHome` is true), and follows it if home moves. When no
        home is identified it observes at the first ground station in ordinal id
        order, and while no command centre is active at all (the main menu) at none,
        stamping its frames with an empty `vantage`. Every frame's `meta.vantage`
        says which of these is in force.
      required:
        - type
        - centreId
      properties:
        type:
          type: string
          const: set-vantage
          x-sitrep-unit: id
          description: The frame type, always `"set-vantage"`.
        centreId:
          type: string
          x-sitrep-unit: id
          description: The command centre Id to adopt as this connection's vantage.
    SetWarpIndexArgs:
      type: object
      description: |-
        `time.setWarpIndex`'s args: select a time-warp rate. This is a control of
        the simulation, not of a craft, so it is never delayed by light time.
      required:
        - index
      properties:
        index:
          type: number
          x-sitrep-unit: id
          description: |-
            The index into this install's high (on-rails) warp rate table, the
            `time.warp` `WarpRates` array, where 0 is normal time. An index below 0 or
            beyond the table fails with `CommandErrorCode.Range`.
    SettingKind:
      type: integer
      description: |-
        What a setting may hold, the mod's own or an Uplink's.

        The set is deliberately small and closed. A setting that needs more than
        these is a `SettingKind.Text` row that the Uplink checks when it reads it.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Text
          description: |-
            A single line of text. Also the fallback for anything the other kinds cannot
            express.
        - const: 1
          title: Bool
          description: True or false.
        - const: 2
          title: Number
          description: |-
            A number, written with a full stop for the decimal point whatever the
            player's locale.
    SettingsChange:
      type: object
      description: One row's new value in a `SaveSettingsArgs`.
      required:
        - path
        - value
      properties:
        path:
          type: string
          x-sitrep-unit: id
          description: The row, as `SettingsRowState.path` names it.
        value:
          type: string
          x-sitrep-unit: text
          description: The new value, spelled as `SettingsRowState.value` is.
    SettingsDeclarationFailure:
      type: object
      description: An Uplink whose settings could not be declared this session.
      required:
        - uplinkId
        - reason
      properties:
        uplinkId:
          type: string
          x-sitrep-unit: id
          description: The id of the Uplink whose settings could not be declared.
        reason:
          type: string
          x-sitrep-unit: text
          description: Why, for an operator to read.
    SettingsModel:
      type: object
      description: |-
        The `settings.gonogo` channel payload: every setting the mod and its Uplinks
        declared, what each holds now, and whether the settings file on the KSP
        machine holds the same.

        The whole model is on one Topic. A client draws a control per row from the
        row's own description, so a setting an Uplink adds needs no client code of
        its own.

        It is never delayed by light time: a setting configures the system the
        operator is sitting at, not a craft.

        This is where a client learns whether a save landed. A save command can time
        out and still land, so read the outcome here, never from the command's
        reply.
      required:
        - rows
        - persistence
        - undeclared
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SettingsRowState"
          description: |-
            Every declared setting, in declaration order: the mod's own first, then each
            Uplink's.
        persistence:
          description: Whether the values here are the ones the settings file holds.
          allOf:
            - $ref: "#/components/schemas/SettingsPersistence"
        undeclared:
          type: array
          items:
            $ref: "#/components/schemas/SettingsDeclarationFailure"
          description: |-
            Uplinks that are running but whose settings could not be declared this
            session. Their settings are at their defaults and are not listed in
            `SettingsModel.rows`; what the file holds for them is kept as it is.
    SettingsPersistence:
      type: object
      description: Whether the settings file holds what is in force.
      required:
        - state
        - path
      properties:
        state:
          description: Where the settings in force stand against the file.
          allOf:
            - $ref: "#/components/schemas/SettingsPersistenceState"
              x-sitrep-unit: enum
        path:
          type: string
          x-sitrep-unit: text
          description: The path of the settings file on the KSP machine.
        savedAtUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The UT of the last save that wrote the file, or `null` when none has this
            session.
        reason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Why the file could not be written or read, for an operator to read. `null`
            when nothing went wrong.
    SettingsPersistenceState:
      type: integer
      description: Where the settings in force stand against the settings file.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Saved
          description: |-
            The file holds these values: it was read at start-up, or the last save wrote
            it.
        - const: 1
          title: MemoryOnly
          description: |-
            The last save could not write the file. The values are in force for this
            session only and revert when KSP restarts; `SettingsPersistence.reason` says
            why.
        - const: 2
          title: Recovered
          description: |-
            The file was missing, empty or damaged at start-up, and its backup was read
            instead. Anything saved after that backup was taken is lost. Clears at the
            next successful save.
        - const: 3
          title: Defaults
          description: |-
            No settings file exists yet: a first run, every setting at its default until
            the first save.
        - const: 4
          title: Unreadable
          description: |-
            A settings file exists but neither it nor a backup could be read, so every
            setting is at its default. Clears at the next successful save, which
            replaces the unreadable file.
    SettingsRowState:
      type: object
      description: |-
        One declared setting, described well enough for a client to draw its
        control.
      required:
        - path
        - owner
        - kind
        - label
        - description
        - value
        - default
      properties:
        path:
          type: string
          x-sitrep-unit: id
          description: |-
            Where the setting lives, as blocks and a name separated by `/`:
            `SIGNAL_DELAY/enabled`, or `Uplinks/<id>/<name>` for an Uplink's own. This
            is the path a save names.
        owner:
          type: string
          x-sitrep-unit: id
          description: "Who declared it: `\"gonogo\"` for the mod itself, or the Uplink's id."
        kind:
          description: What the value may be, and so which control draws it.
          allOf:
            - $ref: "#/components/schemas/SettingKind"
              x-sitrep-unit: enum
        label:
          type: string
          x-sitrep-unit: text
          description: What an operator reads beside the control. May be empty.
        description:
          type: string
          x-sitrep-unit: text
          description: |-
            Why the setting matters or what it needs, read under the label. May be
            empty.
        value:
          type: string
          x-sitrep-unit: text
          description: |-
            The value in force, as text: `True` or `False` for a `SettingKind.Bool`, a
            number written with a full stop for a `SettingKind.Number`.
        default:
          type: string
          x-sitrep-unit: text
          description: |-
            The value in force when the settings file holds none for this row, in the
            same spelling as `SettingsRowState.value`.
    Situation:
      type: integer
      description: |-
        A vessel's flight situation, KSP's `Vessel.situation` (the
        `Vessel.Situations` enum) in this contract's PascalCase spelling.
        `Situation.Unknown` stands for a value this contract does not recognise,
        such as a situation added by a later KSP version.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Landed
          description: Resting on the surface of a body (KSP `LANDED`).
        - const: 1
          title: Splashed
          description: Floating on water (KSP `SPLASHED`).
        - const: 2
          title: PreLaunch
          description: On the launch pad or runway and not yet launched (KSP `PRELAUNCH`).
        - const: 3
          title: Orbiting
          description: |-
            In a closed orbit that does not intersect the surface or atmosphere (KSP
            `ORBITING`).
        - const: 4
          title: Escaping
          description: |-
            On a trajectory that leaves the current body's sphere of influence (KSP
            `ESCAPING`).
        - const: 5
          title: Flying
          description: In the atmosphere and off the ground (KSP `FLYING`).
        - const: 6
          title: SubOrbital
          description: |-
            Above the atmosphere on a trajectory that meets the surface or atmosphere
            again (KSP `SUB_ORBITAL`).
        - const: 7
          title: Docked
          description: Docked to another vessel (KSP `DOCKED`).
        - const: 8
          title: Unknown
          description: A situation this contract does not recognise.
    SolarPanelEntry:
      type: object
      description: |-
        One deployable solar panel module in the `parts.power` payload's
        `solarPanels` array. A part with several panel modules contributes one entry
        per module. Every field is `null` when its value could not be read, never a
        sentinel.
      properties:
        partName:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The part's display title (KSP's `Part.partInfo.title`), or its internal name
            when it has no part info.
        partId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The part's `Part.flightID` as a string: unique per part for the life of the
            flight, so it tells apart symmetric parts that share a name. Null when the
            part has no flight id yet.
        deployState:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The panel's deploy state, KSP's `ModuleDeployablePart.DeployState` name
            as-is: `"RETRACTED"`, `"EXTENDING"`, `"EXTENDED"`, `"RETRACTING"` or
            `"BROKEN"`.
        flowRate:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            The panel's current electric-charge output (KSP's `flowRate`), in EC per
            second. This is what counts toward `PartsPower.totalProductionEc`.
        chargeRate:
          type:
            - number
            - "null"
          x-sitrep-unit: units/s
          description: |-
            The panel's rated charge rate from its part configuration (KSP's
            `chargeRate`), in EC per second, before sun exposure and distance are
            applied.
        sunAOA:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            KSP's `ModuleDeployableSolarPanel.sunAOA`: despite the name and the declared
            unit, a sun-exposure factor from 0 (no sunlight on the panel) to 1 (facing
            the sun squarely), not an angle.
    SpaceCenterPartsAvailable:
      type: object
      description: |-
        The `spaceCenter.partsAvailable` channel payload: a wrapper carrying the
        count of parts the player can place right now (tech-unlocked AND purchased
        in career; the full `PartLoader` catalogue in sandbox).

        A wrapper object, because a bare scalar has no Topic shape: read
        `spaceCenter.partsAvailable.count`. The whole payload is `null` when no
        sample has arrived yet. Held at the home command.
      properties:
        count:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            How many parts the player can place right now. `null` when it could not be
            counted.
    SpaceCenterPoiEntry:
      type: object
      description: |-
        One point of interest in the `spaceCenter.pois` channel: the union of every
        launch site (`ksc`/`launchSite` kinds, the same sites as `LaunchSiteEntry`,
        limited to sites with a set spawn-point coordinate) and every surface
        contract waypoint whose contract is Active or Offered (`contractTarget`
        kind, from `FinePrint.WaypointManager`).

        The channel is a BARE ARRAY of these entries, one per POI keyed by
        `SpaceCenterPoiEntry.id`. The whole payload is `null` (not an empty array)
        when no sample has arrived yet, which tells "no data yet" apart from "zero
        POIs". Held at the home command, like `LaunchSiteEntry`.
      properties:
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            `"launchSite:<LaunchSite.name>"` for `ksc`/`launchSite` kinds,
            `"contract:<Waypoint.navigationId>"` for `contractTarget`.
        kind:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: "`\"ksc\"` | `\"launchSite\"` | `\"contractTarget\"`."
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index into `SystemBodies`; null when absent or unresolved (never a sentinel
            like -1).
        latitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Latitude on the body: the spawn point for a launch site (always present,
            since sites without one are left out), the waypoint's latitude for a
            contract target. `null` when a waypoint's value is unreadable.
        longitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Longitude on the body, from the same source as
            `SpaceCenterPoiEntry.latitude` and with the same null rule.
        label:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: "Display label: the launch site's display name, or the contract's title."
        status:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: "`\"active\"` | `\"available\"` (null for `ksc`/`launchSite` kinds)."
        contractAgent:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: Contract-issuing agent name; null for `ksc`/`launchSite` kinds.
        contractFundsAdvance:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            Funds the contract pays on acceptance (`Contract.FundsAdvance`); null for
            `ksc`/`launchSite` kinds.
        contractFundsCompletion:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: |-
            Funds the contract pays on completion (`Contract.FundsCompletion`); null for
            `ksc`/`launchSite` kinds.
        contractDateDeadline:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            When the contract must be completed by (`Contract.DateDeadline`). `null`
            when the contract has no deadline (KSP stores that as `0`, which is never
            passed through), and for `ksc`/`launchSite` kinds.
    SpaceCenterScene:
      type: object
      description: |-
        The `spaceCenter.scene` channel payload: the single current KSP game scene.
        `SpaceCenterScene.scene` carries exactly one of the six strings
        `{"Flight","SpaceCenter","Editor","TrackingStation","MainMenu","Other"}`:
        KSP's `GameScenes` enum folded onto that fixed set, with any scene outside
        the five named ones (`LOADING`, `PSYSTEM`, `MISSIONBUILDER`, ...) mapped to
        `"Other"`.

        A wrapper object `{ "scene": string }`. The whole payload is `null` when no
        sample has arrived yet. No per-payload `meta` (it rides the envelope). Never
        delayed (DelayRole.TrueNow): a ground-side game-state fact, the same class
        as `SystemBodies`.
      properties:
        scene:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The current scene, one of
            `"Flight"`/`"SpaceCenter"`/`"Editor"`/`"TrackingStation"`/`"MainMenu"`/`"Other"`.
        launchSite:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The launch site currently selected in the editor
            (`EditorLogic.launchSiteName`). Null outside the editor scene, never a
            fabricated default.
    StageDeltaVEntry:
      type: object
      description: |-
        One ΔV-producing stage of the active vessel, straight from KSP's STOCK
        `VesselDeltaV` stage simulation: the same numbers the in-game ΔV app shows,
        with atmosphere, ISP, crossfeed and staging all handled by the game. Only
        the stages that actually produce ΔV appear, the same set the in-game app
        lists rather than the raw stage list, so stage numbers can be sparse.

        The `dv.stages` payload is a BARE ARRAY of these or `null`: never a wrapper
        object. The whole array is `null` when the stock simulation is not ready or
        there is no active vessel.

        **Every field is nullable, and `null` is never a sentinel.** A field is
        `null` whenever the raw value is absent OR non-finite, so a stage the
        simulation reports as `NaN` or `Infinity` reaches you as `null` rather than
        as a number you would have to test.

        Carries no `meta` of its own: provenance rides the envelope
        (`StreamData.Meta`), never the payload body.
      properties:
        stage:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: "`DeltaVStageInfo.stage`: the stage number this entry describes."
        dvVac:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: "`DeltaVStageInfo.deltaVinVac`: stage ΔV in vacuum (m/s)."
        dvAsl:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: "`DeltaVStageInfo.deltaVatASL`: stage ΔV at sea level (m/s)."
        dvActual:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: "`DeltaVStageInfo.deltaVActual`: stage ΔV at the current situation (m/s)."
        burnTime:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: "`DeltaVStageInfo.stageBurnTime`: full-throttle burn time for the stage (s)."
        twrVac:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: "`DeltaVStageInfo.TWRVac`: thrust-to-weight ratio in vacuum."
        twrAsl:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: "`DeltaVStageInfo.TWRASL`: thrust-to-weight ratio at sea level."
        twrActual:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            `DeltaVStageInfo.TWRActual`: thrust-to-weight ratio at the current
            situation.
        thrustVac:
          type:
            - number
            - "null"
          x-sitrep-unit: kN
          description: "`DeltaVStageInfo.thrustVac`: stage thrust in vacuum (kN)."
        thrustAsl:
          type:
            - number
            - "null"
          x-sitrep-unit: kN
          description: "`DeltaVStageInfo.thrustASL`: stage thrust at sea level (kN)."
        thrustActual:
          type:
            - number
            - "null"
          x-sitrep-unit: kN
          description: "`DeltaVStageInfo.thrustActual`: stage thrust at the current situation (kN)."
        startMass:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: "`DeltaVStageInfo.startMass`: stage start mass (tonnes)."
        endMass:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: "`DeltaVStageInfo.endMass`: stage end (burnout) mass (tonnes)."
        dryMass:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: "`DeltaVStageInfo.dryMass`: stage dry mass (tonnes)."
        fuelMass:
          type:
            - number
            - "null"
          x-sitrep-unit: t
          description: "`DeltaVStageInfo.fuelMass`: stage fuel mass (tonnes)."
        resources:
          type:
            - object
            - "null"
          additionalProperties:
            $ref: "#/components/schemas/ResourceAmount"
          description: |-
            Per-resource current and maximum amounts for the parts active in this stage,
            keyed by resource name, as opposed to `vessel.resources`'s vessel-wide
            totals. Summed from each part's `DeltaVPartInfo.stageFuelMass` for this
            stage number, since `DeltaVStageInfo` itself has only aggregate masses. Sent
            as an empty map, never null, when no tracked resource is active in this
            stage.
    StageDeltaVSummary:
      type: object
      description: |-
        The `dv.summary` channel payload: the whole-vessel ΔV rollup KSP's stock
        `VesselDeltaV` exposes alongside the per-stage `StageDeltaVEntry` list: the
        ΔV-producing stage count plus the vacuum, sea-level and current totals and
        total burn time. A single object, or `null` when the stock simulation is not
        ready or there is no active vessel. Every field is `null` when its raw value
        is absent or non-finite. Carries no `meta` of its own: provenance rides the
        envelope.
      properties:
        stageCount:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: "`VesselDeltaV.OperatingStageInfo.Count`: the number of ΔV-producing stages."
        totalDvVac:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: "`VesselDeltaV.TotalDeltaVVac`: total vessel ΔV in vacuum (m/s)."
        totalDvAsl:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: "`VesselDeltaV.TotalDeltaVASL`: total vessel ΔV at sea level (m/s)."
        totalDvActual:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            `VesselDeltaV.TotalDeltaVActual`: total vessel ΔV at the current situation
            (m/s).
        totalBurnTime:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            `VesselDeltaV.TotalBurnTime`: total full-throttle burn time across all
            stages (s).
    Staleness:
      type: integer
      description: |-
        How current a delivered sample is, as the mod knows it (a client infers the
        rest from its own heartbeat tracking).

        `Staleness.Fresh` is a sample delivered on its own schedule.
        `Staleness.Held` and `Staleness.LastBeforeBlackout` are catch-up grades for
        a late or reconnecting subscriber. `Staleness.Recorded` is different in kind
        from all three: the sample is exact as of its own `Meta.validAt`, it simply
        did not travel at the time it was taken. It was held aboard through a loss
        of signal and dumped on acquisition, so it arrives long after the instant it
        describes, and its `Meta.deliveredAt` is the real arrival, not `validAt +
        light-time`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Fresh
          description: |-
            Delivered on its own schedule. An old `validAt` on a Topic that sends only
            on change is still fresh.
        - const: 1
          title: Held
          description: |-
            Sent to a subscriber that joined while contact was lost, and taken after
            contact was lost.
        - const: 2
          title: LastBeforeBlackout
          description: |-
            Sent to a subscriber that joined while contact was lost: the last sample
            that got out before contact was lost.
        - const: 3
          title: Recorded
          description: |-
            Recovered from the subject's own recorder: taken while it was out of
            contact, replayed on reacquisition. Precisely dated and never a guess, but
            not a live reading, and never the subject's current state.
    StreamData:
      type: object
      description: |-
        One Topic sample as the server sends it: the Topic id, its payload, and the
        envelope `StreamData.meta` saying when the payload was true and when it
        arrived.

        The envelope every telemetry frame arrives in.

        `topic` is the channel's `address` and `payload` is that channel's own
        shape; each channel's `stream-data` message pins both, so this is the shape to
        route on and that one is the shape to read. `meta` is stamped by the mod on
        every frame and describes the DELIVERY rather than the value, which is where
        `validAt`, `deliveredAt` and staleness live.
      required:
        - type
        - topic
        - payload
        - meta
      properties:
        type:
          type: string
          const: stream-data
          x-sitrep-unit: id
        topic:
          type: string
          x-sitrep-unit: id
          description: The Topic id this sample belongs to.
        payload:
          description: The topic's own value. Each channel's `stream-data` message narrows this to that channel's payload schema.
        meta:
          $ref: "#/components/schemas/Meta"
      examples:
        - type: stream-data
          topic: vessel.flight
          payload:
            latitude: -0.0972
            longitude: -74.5577
            altitudeAsl: 72840.31
            altitudeTerrain: 72837.02
            verticalSpeed: -4.2
            surfaceSpeed: 2287.4
            orbitalSpeed: 2301.8
            gForce: 0.02
            dynamicPressureKPa: 0.0004
            mach: 7.63
            atmDensity: 0.0000012
            externalTemperature: 231.4
            atmosphericTemperature: 228.9
            meta:
              source: vessel:8f2c1d40-97ab-4a2e-9c1f-6d0b3e5a7c11
          meta: *a5
    Subscribe:
      type: object
      description: Asks the server to start sending a Topic to this connection.
      required:
        - type
        - topic
      properties:
        type:
          type: string
          const: subscribe
          x-sitrep-unit: id
          description: The frame type, always `"subscribe"`.
        topic:
          type: string
          x-sitrep-unit: id
          description: The Topic id to start receiving.
    SwitchVesselArgs:
      type: object
      description: |-
        `ksp.switchVessel`'s args: the STABLE opaque vessel id
        (`vessel.id.ToString()`, the same id `SetTargetArgs.vesselId` uses),
        resolved server-side against `FlightGlobals.Vessels`, never a roster array
        index. An empty id fails with `CommandErrorCode.NotFound` before the game is
        ever touched. Works from the flight scene, where it changes the active
        vessel, and from the Tracking Station, where it saves and then loads the
        vessel's flight. Refused with `CommandErrorCode.WrongScene` in any other
        scene, and with `CommandErrorCode.NotClearToProceed` for a vessel that is
        not tracked as ours.
      required:
        - vesselId
      properties:
        vesselId:
          type: string
          x-sitrep-unit: id
          description: |-
            The vessel to switch to: KSP's `Vessel.id` guid as a string, as
            `system.vessels` carries it.
    SystemBodies:
      type: object
      description: |-
        The `system.bodies` channel payload: every celestial body in the game, as a
        tree, wrapped as `{ "bodies": [ ... ] }`. The whole payload is `null`, not
        an empty list, when no sample has been taken yet, so "no data yet" and "zero
        bodies" stay distinct.

        Carries no `Meta` field: unlike the `vessel.*` family, its `Meta` rides the
        envelope (`StreamData.Meta`), never the payload body.
      required:
        - bodies
      properties:
        bodies:
          type: array
          items:
            $ref: "#/components/schemas/BodyEntry"
          description: Every body. The tree is expressed through `BodyEntry.parentIndex`.
    SystemVessels:
      type: object
      description: |-
        The `system.vessels` channel payload: every known vessel, not just the
        active one (for a "what could I target" listing), wrapped as `{ "vessels": [
        ... ] }`. The whole payload is `null` when nothing is loaded (the main
        menu), distinct from an empty roster when the game reports zero vessels.
        Like `SystemBodies`, it carries no per-payload `Meta`: that rides the
        envelope.
      required:
        - vessels
      properties:
        vessels:
          type: array
          items:
            $ref: "#/components/schemas/VesselRosterEntry"
          description: |-
            Every known vessel with a resolvable id, loaded or not. Debris and asteroids
            are included.
    TargetAvailable:
      type: object
      description: |-
        The `target.available` channel payload: the list of everything targetable
        from the active vessel. Wrapper object `{ "entries": [ ... ] }`, like
        `system.vessels`. A full keyframe arrives on subscribe (a late subscriber
        gets the last one), then the list is re-sent whenever the set changes (a
        target enters or leaves range, or the current target changes) and on a slow
        periodic re-send, which is what refreshes each `TargetListEntry.distance`.
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/TargetListEntry"
          description: Every current target candidate. Empty, never null, when there is none.
    TargetKind:
      type: integer
      description: |-
        Coarse classification of what `vessel.target` points at: a vessel, a
        celestial body, a part of a vessel (a docking port), or `TargetKind.Other`
        for anything not classified more finely (a waypoint, for instance). A more
        specific kind may be added later; treat an unrecognised value as
        `TargetKind.Other`.

        Member order is wire-significant, so members are only ever appended.

        `TargetKind.Position` is used ONLY as an input to `vessel.target.set` (see
        `SetTargetArgs.latitude` and `SetTargetArgs.longitude`): a map-picked
        latitude and longitude that no live KSP target object backs, so it never
        appears as `vessel.target`'s own reported `VesselTarget.kind`.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Vessel
          description: A vessel. `VesselTarget.vesselId` carries its guid.
        - const: 1
          title: Body
          description: |-
            A celestial body. `VesselTarget.bodyIndex` carries its `system.bodies`
            index.
        - const: 2
          title: Other
          description: Anything not classified more finely, such as a waypoint. Carries no id.
        - const: 3
          title: Position
          description: |-
            A surface latitude and longitude, used only as a `vessel.target.set` input
            and never reported.
        - const: 4
          title: Part
          description: |-
            A part of a vessel: in practice a docking port (`ModuleDockingNode`, which
            implements `ITargetable`). Identity is the owning vessel's
            `VesselTarget.vesselId` guid PLUS the part's `VesselTarget.partId` (KSP
            `Part.flightID`): a part id alone is not globally unique, only within its
            vessel.
    TargetListEntry:
      type: object
      description: |-
        One entry in the `target.available` list: anything the active vessel could
        set as its target right now. Built from KSP's `ITargetable` (Vessel /
        CelestialBody / ModuleDockingNode all implement it) and classified by
        concrete type into a `TargetListEntry.kind` plus its stable id, so a modded
        `ITargetable` appears as `TargetKind.Other`. The stable id per kind
        (`TargetListEntry.vesselId` guid / `TargetListEntry.bodyIndex` /
        `TargetListEntry.partId` flightID) is the SAME id `SetTargetArgs` takes, so
        a widget hands an entry straight back into `vessel.target.set` with no
        lookup.
      required:
        - kind
        - name
        - isCurrent
      properties:
        kind:
          description: |-
            What sort of target this is, which says which id field is set:
            `TargetListEntry.vesselId` for a vessel, `TargetListEntry.bodyIndex` for a
            body, `TargetListEntry.partId` (with `TargetListEntry.vesselId`) for a part.
          allOf:
            - $ref: "#/components/schemas/TargetKind"
              x-sitrep-unit: enum
        name:
          type: string
          x-sitrep-unit: text
          description: Clean display name (KSP `GetDisplayName()`, falling back to `GetName()`).
        vesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            Stable vessel guid: set for `TargetKind.Vessel`, and the OWNING vessel for a
            `TargetKind.Part`. Null otherwise.
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: "Index into `system.bodies`: set for `TargetKind.Body`. Null otherwise."
        partId:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            KSP `Part.flightID`: set for `TargetKind.Part` (scoped by
            `TargetListEntry.vesselId`). Null otherwise.
        vesselType:
          description: |-
            Vessel type: set for `TargetKind.Vessel` / `TargetKind.Part` (the owning
            vessel's type). Null otherwise.
          anyOf:
            - $ref: "#/components/schemas/VesselType"
              x-sitrep-unit: enum
            - type: "null"
        situation:
          description: "Flight situation: set for `TargetKind.Vessel`. Null otherwise."
          anyOf:
            - $ref: "#/components/schemas/Situation"
              x-sitrep-unit: enum
            - type: "null"
        distance:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Distance from the active vessel, as of the last emission. A coarse sort aid
            for a picker, NOT a live readout: it moves every tick but is only refreshed
            on the channel's slow periodic re-send, and a change in it alone does not
            trigger an emission. Live distance for the CURRENT target comes off
            `vessel.target`. Null when a position was not available this tick.
        isCurrent:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when this entry is the active vessel's current target
            (`FlightGlobals.fetch.VesselTarget`) right now.
    ThermalHottestPart:
      type: object
      description: |-
        Raw readings for whichever part is hottest by internal-temperature ratio;
        see `VesselThermal.hottestPart`.
      required:
        - internalTemp
        - maxTemp
        - skinTemp
        - skinMaxTemp
        - name
      properties:
        internalTemp:
          type: number
          x-sitrep-unit: K
          description: |-
            Kelvin (KSP's `Part.temperature`). All four readings on this record share
            the unit, which is what makes the ratios on `VesselThermal` dimensionless.
        maxTemp:
          type: number
          x-sitrep-unit: K
          description: |-
            The part's maximum internal temperature, Kelvin (`Part.maxTemp`). Always
            greater than 0, since only a part with a valid maximum can be the hottest.
        skinTemp:
          type: number
          x-sitrep-unit: K
          description: The part's current skin temperature, Kelvin (`Part.skinTemperature`).
        skinMaxTemp:
          type: number
          x-sitrep-unit: K
          description: |-
            The part's maximum skin temperature, Kelvin (`Part.skinMaxTemp`), passed
            through raw: KSP reports `-1` for a part with no skin-thermal model, and
            that value arrives here unchanged.
        name:
          type: string
          x-sitrep-unit: text
          description: |-
            Display name of the hottest part (`Part.partInfo.title`, falling back to
            `Part.name`, same convention as `VesselPart.title`). Never null when
            `VesselThermal.hottestPart` itself is non-null.
        id:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            `Part.flightID` stringified, the same join key as `VesselPart.id`, so a
            client can tell WHICH part is hottest where several share
            `ThermalHottestPart.name` (a symmetric craft). `null` when the part has no
            live flight id yet.
    TimeCalendar:
      type: object
      description: |-
        The `time.calendar` channel payload: how long a minute, hour, day and year
        are, and what real-world instant UT 0 is (when the game has one), as the
        running game defines them.

        Every duration on the wire is SI seconds. To express one in days or years,
        divide by these values rather than by a constant: 21,600 seconds per day is
        right only for stock KSP on Kerbin time.

        - **Stock, no mods.** `GameSettings.KERBIN_TIME` is a setting a player can
          turn off, and KSP's own UI then reads in 24-hour days and 365-day years.
        - **A planet pack.** RSS and anything else built on Kopernicus replaces
          `KSPUtil.dateTimeFormatter`, so a day becomes 86,400 s and a year 365
          days. Dividing by 21,600 reports four times too many days, in a number
          that looks plausible.
        - **Anything else.** The formatter has a public setter, so a mod can put any
          calendar behind it.

        The values are read straight off `KSPUtil.dateTimeFormatter`, whose
        `Minute`, `Hour`, `Day` and `Year` are each a count of seconds: whatever the
        game uses to print its own clock is what this channel carries.

        It can change mid-session: the KERBIN_TIME setting is reachable from the
        in-game settings menu at any time.

        The whole payload is `null` when the calendar cannot be read or any of the
        four durations is missing or not positive, so a consumer never divides by
        zero. There is no days-per-year field: divide `TimeCalendar.yearSeconds` by
        `TimeCalendar.daySeconds`, which is exact.
      required:
        - minuteSeconds
        - hourSeconds
        - daySeconds
        - yearSeconds
        - kerbinTime
        - meta
      properties:
        minuteSeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            Seconds in one minute, as the game's date formatter defines it. 60 in every
            known calendar. Always positive.
        hourSeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            Seconds in one hour, as the game's date formatter defines it. Always
            positive.
        daySeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            Seconds in one day: 21,600 on stock Kerbin time, 86,400 under Earth time or
            a planet pack. Always positive.
        yearSeconds:
          type: number
          x-sitrep-unit: s
          description: |-
            Seconds in one year: 9,201,600 on stock Kerbin time (426 days), 31,536,000
            under a 365-day Earth calendar. Always positive.
        epoch:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The real-world instant UT 0 corresponds to, ISO-8601 in UTC
            (`1951-01-01T00:00:00Z`), or `null` when the running game has no such
            instant. Never an empty string.

            The durations say how long a day is; this says which day it is. Every
            `Units.UniversalTime` field is an offset from UT 0, so with an epoch a
            deadline can be shown as `14 Mar 1957` rather than `Y3 D122`.

            It is read from the date formatter itself. Formatters that model a real
            calendar (RSSTimeFormatter, Kronometer) hold an anchor date; the stock
            formatter holds none.

            `null` is the normal value, and it is not zero. Stock KSP has no real
            calendar: its own UI prints Year 1, Day 1, and so should every consumer.
            That holds for a planet pack too whenever no date-based formatter is
            installed alongside it. Do not render a default anchor for those games.
        kerbinTime:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            The stock `GameSettings.KERBIN_TIME` flag, for a consumer that wants to
            label the calendar ("Kerbin time" against "Earth time"). Do not do
            arithmetic with it: the seconds fields above already account for this flag
            and for anything a planet pack did on top of it. `true` when the setting
            cannot be read.
        meta:
          description: |-
            Payload provenance. `Source` is always `"game"`: the calendar describes the
            session, not a craft.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    TrajectoryKind:
      type: integer
      description: |-
        What kind of thing an element set describes: a closed-form conic, or a
        snapshot of an integrated path.

        `TrajectoryKind.Unspecified` is 0 for the same reason as
        `PropagationHorizonKind.Unspecified`: a producer that does not set the field
        gets the value that withholds rather than the one that permits.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Unspecified
          description: No provider stated one. Treat the shape as unknown.
        - const: 1
          title: Analytic
          description: |-
            A closed-form conic. The orbit IS an ellipse, so a conic renderer is exactly
            right and stays right for as long as the horizon allows.
        - const: 2
          title: Integrated
          description: |-
            A numerically integrated path. The osculating conic on the wire is a
            snapshot of it, true at the sample instant and never the path itself, so a
            client that draws a closed ellipse from it is drawing something the craft
            will not fly.
    TransitionType:
      type: integer
      description: |-
        How an orbit patch begins or ends, KSP's `Orbit.PatchTransitionType` (read
        from `Orbit.patchStartTransition` and `Orbit.patchEndTransition`). Member
        names follow KSP's except `TransitionType.Collision`, which is KSP's
        `IMPACT`. `TransitionType.Unknown` stands for a value this contract does not
        recognise.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Initial
          description: |-
            The patch starts at the vessel's current position: the first patch of a
            trajectory.
        - const: 1
          title: Final
          description: |-
            The patch does not end in a transition: the trajectory continues on it
            indefinitely.
        - const: 2
          title: Encounter
          description: The trajectory enters another body's sphere of influence.
        - const: 3
          title: Escape
          description: The trajectory leaves the current body's sphere of influence.
        - const: 4
          title: Maneuver
          description: The patch ends or begins at a planned maneuver node.
        - const: 5
          title: Collision
          description: |-
            The trajectory meets the body's surface (KSP `IMPACT`), with or without an
            atmosphere.
        - const: 6
          title: Unknown
          description: A transition this contract does not recognise.
    UnlockTechArgs:
      type: object
      description: |-
        `career.tech.unlock`'s args: the tech node's `techID`, the same id
        `career.status` publishes for each tech node as `tech.nodes[].id`. Unlocking
        deducts the node's science cost.
      required:
        - techId
      properties:
        techId:
          type: string
          x-sitrep-unit: id
          description: |-
            The tech node to unlock: its KSP `techID` (e.g. `"basicRocketry"`), as
            `career.status`'s `tech.nodes[].id` carries it.
    Unsubscribe:
      type: object
      description: Asks the server to stop sending a Topic to this connection.
      required:
        - type
        - topic
      properties:
        type:
          type: string
          const: unsubscribe
          x-sitrep-unit: id
          description: The frame type, always `"unsubscribe"`.
        topic:
          type: string
          x-sitrep-unit: id
          description: The Topic id to stop receiving.
    UpdateManeuverNodeArgs:
      type: object
      description: |-
        `vessel.maneuver.update`'s args: replace an existing node's time and
        delta-v. The node is named by its opaque `UpdateManeuverNodeArgs.nodeId`,
        never a positional index, so adding or removing another node never changes
        which node an update reaches. A client will not send the command if it would
        arrive at the craft at or after `UpdateManeuverNodeArgs.ut`.
      required:
        - nodeId
        - ut
        - prograde
        - normal
        - radialOut
      properties:
        nodeId:
          type: string
          x-sitrep-unit: id
          description: |-
            The node to update: the id `vessel.maneuver.add` returned, or a
            `ManeuverNode.id` from `vessel.maneuver`. An unknown id fails with
            `CommandErrorCode.NotFound`.
        ut:
          type: number
          x-sitrep-unit: ut
          description: The node's new time, in UT seconds.
        prograde:
          type: number
          x-sitrep-unit: m/s
          description: |-
            The delta-v component along the orbit's prograde direction at the node, in
            m/s.
        normal:
          type: number
          x-sitrep-unit: m/s
          description: The delta-v component along the orbit normal at the node, in m/s.
        radialOut:
          type: number
          x-sitrep-unit: m/s
          description: The delta-v component along the radial-out direction at the node, in m/s.
    UpgradeFacilityArgs:
      type: object
      description: |-
        `career.facility.upgrade`'s args: the facility's `SpaceCenterFacility` enum
        name (e.g. `"VehicleAssemblyBuilding"`, `"LaunchPad"`), the same key
        `CareerFacilities`'s `facilities` map uses on the `career.facilities`
        channel (the buildings are not on `career.status`). Upgrading raises the
        facility one tier and deducts its upgrade cost from funds.
      required:
        - facilityId
      properties:
        facilityId:
          type: string
          x-sitrep-unit: id
          description: |-
            The facility to upgrade: its `SpaceCenterFacility` enum name, as a key of
            `career.facilities`' `facilities` map.
    VesselAttitude:
      type: object
      description: |-
        The `vessel.attitude` channel payload: pitch, heading and roll of the
        vessel's control reference (`Vessel.GetTransform()`) against the local
        surface up and north, in two named frames.

        `VesselAttitude.pitch`, `VesselAttitude.heading` and `VesselAttitude.roll`
        are the primary frame, with up and north measured at `Vessel.CoM` (MechJeb's
        construction). `VesselAttitude.pitchRootFrame`,
        `VesselAttitude.headingRootFrame` and `VesselAttitude.rollRootFrame` measure
        up and north at the root part's position instead. The orientation is the
        same in both; the two differ only when the root part sits away from the
        centre of mass. Without a root part the root frame repeats the primary one.

        Absent when the vessel has no reference body. Attitude is not derivable from
        orbital elements, so it is streamed raw.
      required:
        - pitch
        - heading
        - roll
        - pitchRootFrame
        - headingRootFrame
        - rollRootFrame
        - meta
      properties:
        pitch:
          type: number
          x-sitrep-unit: °
          description: |-
            Pitch above the horizon, measured at the centre of mass. Degrees, -90 (nose
            down) to 90 (nose up).
        heading:
          type: number
          x-sitrep-unit: °
          description: |-
            Compass heading, measured at the centre of mass. Degrees, 0 to 360,
            clockwise from north.
        roll:
          type: number
          x-sitrep-unit: °
          description: Roll, measured at the centre of mass. Degrees, -180 to 180.
        pitchRootFrame:
          type: number
          x-sitrep-unit: °
          description: As `VesselAttitude.pitch`, measured at the root part. Degrees, -90 to 90.
        headingRootFrame:
          type: number
          x-sitrep-unit: °
          description: As `VesselAttitude.heading`, measured at the root part. Degrees, 0 to 360.
        rollRootFrame:
          type: number
          x-sitrep-unit: °
          description: As `VesselAttitude.roll`, measured at the root part. Degrees, -180 to 180.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselComms:
      type: object
      description: |-
        The `vessel.comms` channel payload: the active vessel's own CommNet
        connection, from KSP's `vessel.connection`. The whole payload is null when
        the vessel has no CommNet connection object; there is no zero or
        disconnected placeholder reading.

        This is what the vessel itself reports. Signal delay and link modelling are
        on the `comms.*` channels (`comms.delay` for the delay), not here.
      required:
        - connected
        - signalStrength
        - controlState
        - meta
      properties:
        connected:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            Whether the vessel has a CommNet connection home, from
            `vessel.connection.IsConnected`.
        signalStrength:
          type: number
          x-sitrep-unit: ratio
          description: |-
            The connection's signal strength, from `vessel.connection.SignalStrength`: a
            ratio from `0` (none) to `1` (full).
        controlState:
          description: |-
            What is controlling the vessel and how much control it has, from
            `vessel.connection.ControlState`.
          allOf:
            - $ref: "#/components/schemas/ControlState"
              x-sitrep-unit: enum
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselControl:
      type: object
      description: |-
        The `vessel.control` channel payload: the active vessel's control state (the
        stock toggles, SAS mode, throttle, the commanded fly-by-wire axes and the
        custom action groups). The payload is present whenever there is an active
        vessel; each field is individually nullable, and `null` means that input
        could not be read this tick (for example no flight input state, or no
        action-group data), never a default.

        Each control field that can be changed is paired with its command through
        its control channel, so the confirmed state and the command that changes it
        are one handle. The confirmed value lags a command by the round trip,
        including any comms delay.

        `VesselControl.throttle` is 0..1 nominally, but KSP does not clamp
        `Vessel.ctrlState.mainThrottle`: a throttle driven by kOS or another mod can
        read above 1. The value is passed through unclamped.
      required:
        - meta
      properties:
        sas:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether SAS is on. Changed with `vessel.control.setSas`.
        sasAvailable:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the vessel has a source that can hold SAS on: a Pilot aboard, or a
            probe core whose SAS tier allows it (KSP's `VesselSAS.CanEngageSAS`). When
            false, `vessel.control.setSas` refuses to turn SAS on, so a client can show
            the control unavailable before it is pressed; turning SAS off is never
            refused. Null when the vessel has no autopilot to ask.
        sasUnavailableReason:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Why SAS cannot be turned on, in the words the refusal uses, when
            `VesselControl.sasAvailable` is false. Null whenever SAS is available or
            unknown.
        sasMode:
          description: The SAS hold mode. Changed with `vessel.control.setSasMode`.
          anyOf:
            - $ref: "#/components/schemas/SasMode"
              x-sitrep-unit: enum
            - type: "null"
        rcs:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: Whether RCS is on. Changed with `vessel.control.setRcs`.
        gear:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the Gear action group is engaged (landing gear deployed). Changed
            with `vessel.control.setGear`.
        brakes:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the Brakes action group is engaged. Changed with
            `vessel.control.setBrakes`.
        lights:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the Lights action group is engaged. Changed with
            `vessel.control.setLights`.
        abort:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether the Abort action group is engaged. Changed with
            `vessel.control.setAbort`.
        precisionControl:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Precision-control (fine-control / caps-lock) mode. Mirrors KSP's
            `FlightInputHandler.fetch.precisionMode`. Null when there is no active
            flight scene.
        throttle:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            Main throttle, KSP's `Vessel.ctrlState.mainThrottle`: 0..1 nominally, but
            not clamped, so a mod-driven throttle can read above 1. Changed with
            `vessel.control.setThrottle`.
        pitch:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The applied pitch axis input, -1..1, from KSP's `Vessel.ctrlState.pitch`.
            Null when the vessel has no control state. Set with
            `vessel.control.setAxes`.
        yaw:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The applied yaw axis input, -1..1, from KSP's `Vessel.ctrlState.yaw`. Null
            when the vessel has no control state. Set with `vessel.control.setAxes`.
        roll:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The applied roll axis input, -1..1, from KSP's `Vessel.ctrlState.roll`. Null
            when the vessel has no control state. Set with `vessel.control.setAxes`.
        translationX:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The applied translation X input (RCS right/left), -1..1, from KSP's
            `Vessel.ctrlState.X`. Null when the vessel has no control state. Set with
            `vessel.control.setAxes`.
        translationY:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The applied translation Y input (RCS up/down), -1..1, from KSP's
            `Vessel.ctrlState.Y`. Null when the vessel has no control state. Set with
            `vessel.control.setAxes`.
        translationZ:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The applied translation Z input (RCS forward/back), -1..1, from KSP's
            `Vessel.ctrlState.Z`. Null when the vessel has no control state. Set with
            `vessel.control.setAxes`.
        actionGroups:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ActionGroupState"
          description: |-
            Every custom action group the vessel has, each NAMED and carrying its own
            index (see `ActionGroupState`). Stock KSP yields ten entries (`AG1..AG10`);
            an AGX backend may yield up to 250 with the player's own names. Null when
            action-group data wasn't available this tick; never a partial list. Order is
            by `ActionGroupState.index` ascending, but read `ActionGroupState.index`
            rather than relying on array position: position does not carry identity
            here.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselCrew:
      type: object
      description: |-
        The `vessel.crew` payload: who is aboard the active vessel and how many
        seats it has.
      required:
        - count
        - capacity
        - crew
        - meta
      properties:
        count:
          type: number
          x-sitrep-unit: count
          description: How many crew are aboard.
        capacity:
          type: number
          x-sitrep-unit: count
          description: How many crew seats the vessel has.
        crew:
          type: array
          items:
            $ref: "#/components/schemas/CrewMember"
          description: Each crew member aboard.
        meta:
          description: Which vessel this describes.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselFlight:
      type: object
      description: |-
        The `vessel.flight` channel payload: MEASUREMENTS, not evaluations:
        quantities the game measures that aren't derivable from orbital elements
        (terrain height, aero state) or that serve as off-rails ground truth
        (speeds). One field per quantity.

        The channel is absent when there is no active vessel or any of its fields
        could not be read; there is never a `(0,0)` lat/long placeholder. There is
        no mission time field: see `VesselIdentity.launchUt`.
      required:
        - latitude
        - longitude
        - altitudeAsl
        - altitudeTerrain
        - verticalSpeed
        - surfaceSpeed
        - orbitalSpeed
        - gForce
        - dynamicPressureKPa
        - mach
        - atmDensity
        - externalTemperature
        - atmosphericTemperature
        - meta
      properties:
        latitude:
          type: number
          x-sitrep-unit: °
          description: |-
            Latitude of the vessel's position on its reference body, degrees (KSP's
            `Vessel.latitude`). Present means valid: there is no `(0,0)` no-data
            placeholder, and absence is the whole channel being unavailable.
        longitude:
          type: number
          x-sitrep-unit: °
          description: |-
            Longitude of the vessel's position on its reference body, degrees (KSP's
            `Vessel.longitude`, passed through without normalising its range). Same
            presence rule as `VesselFlight.latitude`.
        altitudeAsl:
          type: number
          x-sitrep-unit: m
          description: Altitude above sea level, metres (KSP's `Vessel.altitude`).
        altitudeTerrain:
          type: number
          x-sitrep-unit: m
          description: |-
            Height above terrain (AGL, KSP's `Vessel.radarAltitude`), metres. Not
            derivable from orbital elements, so it is streamed as measured.
        verticalSpeed:
          type: number
          x-sitrep-unit: m/s
          description: |-
            Metres per second (KSP's `Vessel.verticalSpeed`), signed: negative is
            descending.
        surfaceSpeed:
          type: number
          x-sitrep-unit: m/s
          description: Speed relative to the surface, metres per second (KSP's `Vessel.srfSpeed`).
        orbitalSpeed:
          type: number
          x-sitrep-unit: m/s
          description: |-
            Speed relative to the parent body's inertial frame, metres per second (KSP's
            `Vessel.obt_speed`).
        gForce:
          type: number
          x-sitrep-unit: g
          description: Multiples of standard gravity (KSP's `Vessel.geeForce`).
        dynamicPressureKPa:
          type: number
          x-sitrep-unit: kPa
          description: |-
            Dynamic pressure on the vessel, kilopascals (KSP's
            `Vessel.dynamicPressurekPa`). `0` outside an atmosphere.
        mach:
          type: number
          x-sitrep-unit: "1"
          description: Mach number (KSP's `Vessel.mach`), dimensionless.
        atmDensity:
          type: number
          x-sitrep-unit: kg/m³
          description: |-
            Atmospheric density at the vessel's position, kg/m³ (KSP's
            `Vessel.atmDensity`).
        externalTemperature:
          type: number
          x-sitrep-unit: K
          description: |-
            Skin/ambient external temperature the vessel is exposed to, Kelvin
            (Vessel.externalTemperature).
        atmosphericTemperature:
          type: number
          x-sitrep-unit: K
          description: |-
            Ambient atmospheric temperature at the vessel's position, Kelvin
            (Vessel.atmosphericTemperature).
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselIdentity:
      type: object
      description: |-
        The `vessel.identity` channel payload: who the active vessel is, what kind
        of craft it is, and where it is.

        There is no mission time field. `VesselIdentity.launchUt` is fixed after
        liftoff, so mission elapsed time is `viewUt - launchUt`, computed by the
        client.
      required:
        - vesselId
        - name
        - vesselType
        - situation
        - meta
      properties:
        vesselId:
          type: string
          x-sitrep-unit: id
          description: |-
            The stable subject id: KSP's `Vessel.id` GUID as a string. The id
            vessel-scoped commands take, and the `<guid>` in `VesselIdentity.meta`'s
            `"vessel:<guid>"` source.
        name:
          type: string
          x-sitrep-unit: text
          description: |-
            The vessel's name, KSP's `Vessel.vesselName`. Empty when it could not be
            read.
        vesselType:
          description: The vessel's type, from KSP's `Vessel.vesselType`.
          allOf:
            - $ref: "#/components/schemas/VesselType"
              x-sitrep-unit: enum
        situation:
          description: |-
            The vessel's situation (landed, flying, orbiting and so on), from KSP's
            `Vessel.situation`.
          allOf:
            - $ref: "#/components/schemas/Situation"
              x-sitrep-unit: enum
        parentBodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index into `system.bodies` of the body the vessel orbits; null when the
            vessel has no orbit yet (for example a just-spawned EVA kerbal).
        launchUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            The universal time the vessel's mission clock started from, fixed from
            liftoff. `null` while the vessel is in `PreLaunch` and whenever the clock is
            unknown, never the current time.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselInventory:
      type: object
      description: |-
        The stock cargo a vessel's PARTS are carrying: the supply aboard.

        **Why the crew's own inventories are not here.** A kerbal carries the same
        KSP module, `ModuleInventoryPart`, but the two say different things. This
        channel says "what is aboard, and where", which is SUPPLY. `vessel.crew`
        says "who is here, are they qualified, and what are they holding", which is
        the ACTOR list, and that is where a kerbal's two slots belong: beside the
        trait and experience level that decide whether they may do the job at all.

        **Why location is carried rather than a per-vessel total.** A kerbal has two
        slots, forty volume and a 65kg limit, one slot of which defaults to a
        parachute; a cargo container has far more. A craft can be carrying plenty of
        something while the kerbal who needs it has none, and a single total reports
        the reassuring half of that.

        This is STOCK, and deliberately not any Uplink's. Stock KSP's own repair
        mechanic consumes stock cargo, so a stock-career player has inventories
        worth showing whether or not a modelling mod is installed.
      required:
        - stores
      properties:
        stores:
          type: array
          items:
            $ref: "#/components/schemas/InventoryStore"
          description: |-
            Every part-hosted inventory on the active vessel this tick, in vessel
            part-list order. Always present (possibly empty); a vessel-less tick yields
            a `null` payload, not an empty list.
    VesselLanding:
      type: object
      description: |-
        The `vessel.landing` channel payload: landing data for the active vessel
        that needs KSP's PQS terrain heightmap (slope, roughness and elevation at
        the touchdown site), plus an atmosphere-aware descent estimate built from
        the vessel's measured drag. The vacuum ballistic figures (which need no
        terrain) are not here; a client solves those itself.

        The whole payload is absent unless the vessel is descending toward a solid
        surface: the body must have a solid surface and PQS terrain, and the vessel
        must be descending towards it within the prediction horizon. So it never
        carries a leftover reading from orbit, or a 0 from a body with no terrain.

        Every field is nullable, and null means that input is unavailable this tick
        (no terrain fit, not in an atmosphere, and so on), never an unverified 0.
      required:
        - meta
      properties:
        outcome:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Which class of landing readout is valid this tick, so a client can render
            the state rather than infer it from which fields are null. One of
            `"atmospheric-aware"` (the atmospheric descent fields are solved),
            `"terrain-assessed"` (no atmospheric solution, but a terrain slope fit
            exists) or `"vacuum-solved"` (neither). `"no-solution"` is part of the
            vocabulary but not currently produced.
        sampleSource:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Where the terrain fields were sampled this tick: `"predicted"` (at the mod's
            predicted touchdown point, the site the vessel is heading for) or
            `"sub-vessel"` (directly under the vessel, when there is no touchdown
            prediction). Show it, so the operator knows whether they are seeing
            downrange or under-ship terrain. Null when no terrain was sampled.
        terrainElevationUnderVessel:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Terrain elevation in metres above the body's mean radius directly beneath
            the vessel. Not currently produced, so always null: when
            `VesselLanding.sampleSource` is `"sub-vessel"`,
            `VesselLanding.predictedTerrainElevation` carries the under-ship elevation.
        slopeAngleUnderVessel:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Terrain slope directly beneath the vessel in degrees, 0 flat. Not currently
            produced, so always null: when `VesselLanding.sampleSource` is
            `"sub-vessel"`, `VesselLanding.predictedSlopeAngle` carries the under-ship
            slope.
        predictedLatitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Latitude in degrees of the point the terrain fields were sampled at: the
            predicted touchdown point, or the vessel's own latitude when
            `VesselLanding.sampleSource` is `"sub-vessel"`.
        predictedLongitude:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Longitude in degrees of the sampled point, on the same terms as
            `VesselLanding.predictedLatitude` and always present together with it.
        predictedTerrainElevation:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Terrain elevation in metres at the sampled point, KSP's
            `CelestialBody.TerrainAltitude(lat, lon, allowNegative: true)`, so ocean
            floor reads as negative rather than clamping to 0.
        predictedSlopeAngle:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Terrain slope in degrees at the sampled point, from a plane fit over sampled
            heights (so a bowl is not mistaken for an incline). The tip-over risk
            readout, available while still descending. Null when the plane fit fails.
        predictedSlopeHeading:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            The downhill direction at the sampled point in degrees, 0 north, clockwise:
            which way the lander falls if it tips. Null when the slope is below the
            noise floor.
        predictedRoughness:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            The residual standard deviation, in metres, of sampled terrain height at the
            sampled point after the fitted slope plane is removed (so tilt is not
            counted as roughness), over `VesselLanding.roughnessFootprintMeters`. The
            boulder-risk proxy.
        roughnessFootprintMeters:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            The footprint radius in metres that `VesselLanding.predictedRoughness` was
            sampled over, so a client can label and grade it.
        slopeSampleRadiusMeters:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: The radius in metres the slope plane-fit samples span.
        predictedBiome:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's biome name at the sampled point (for the vessel's current position,
            read `vessel.surface.biome`), from `ScienceUtil.GetExperimentBiome`. Null
            when the body has no biome map.
        terrainPatch:
          type:
            - array
            - "null"
          items:
            type: number
            x-sitrep-unit: m
          description: |-
            A flattened row-major NxN grid of terrain elevations in metres around the
            sampled point, for a shaded relief view; its length is
            `VesselLanding.terrainPatchSize` squared. Not currently produced, so always
            null.
        terrainPatchSize:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            The N of the NxN `VesselLanding.terrainPatch` grid. Null when there is no
            patch, which is currently always.
        terrainPatchExtentMeters:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            The full width in metres the `VesselLanding.terrainPatch` grid spans. Null
            when there is no patch, which is currently always.
        terminalVelocity:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            Terminal velocity in m/s at the current altitude and configuration, from the
            measured aggregate drag force against local gravity. An estimate that
            assumes the current configuration holds (same attitude, no parachute yet to
            open). Null outside an atmosphere, or when the vessel's parts could not be
            read.
        projectedTouchdownSpeed:
          type:
            - number
            - "null"
          x-sitrep-unit: m/s
          description: |-
            Projected touchdown speed in m/s under a terminal descent to the ground
            (terminal velocity scaled to ground-level density). In an atmosphere, use
            this rather than a vacuum impact speed. Null outside an atmosphere.
        atmosphericTimeToImpact:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            Atmosphere-aware time to impact in seconds, integrating the
            terminal-velocity profile down the density column. Null outside an
            atmosphere.
        descentRegime:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The instantaneous descent regime: `"at-terminal"`, `"decelerating"` or
            `"accelerating"`. Null outside an atmosphere.
        dragToWeightRatio:
          type:
            - number
            - "null"
          x-sitrep-unit: "1"
          description: |-
            The aggregate aerodynamic drag force divided by the vessel's weight (local
            gravity): the numeric form of `VesselLanding.descentRegime`. >1 decelerating
            (drag beats gravity), 1 at terminal, <1 still accelerating. A dimensionless
            ratio from 0 upward like TWR, not a 0..1 fraction. Null outside an
            atmosphere, and for a weightless vessel.
        parachuteState:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            Parachute state affecting the estimate: `"none"` (no parachute is staged or
            open), `"armed"` (a parachute is staged and waiting to open: a future jump
            in drag the estimate cannot see, so flag it) or `"deployed"` (a parachute is
            open or semi-deployed, so its drag is already in the measurement). Null
            outside an atmosphere.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselManeuver:
      type: object
      description: |-
        The `vessel.maneuver` channel payload: the active vessel's planned burns.
        `VesselManeuver.nodes` is ALWAYS an array, empty when no burn is queued,
        never null.

        **`VesselManeuver.nodes` is ordered by execution**, earliest
        `ManeuverNode.ut` first, and that ordering IS the plan: burn N is flown
        after burn N-1 and acts on what burn N-1 left behind. No separate ordinal or
        predecessor field is carried: array position says it. The per-burn patch
        chain expresses the same linkage again, in a form only a patched-conic
        planner can produce; see `ManeuverNode.patches`.
      required:
        - nodes
        - meta
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ManeuverNode"
          description: |-
            Every queued burn, earliest `ManeuverNode.ut` first. Empty when none is
            queued, never null.
        planner:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The elected maneuver-plan provider's id, or null when THERE IS NO PLANNER AT
            ALL.

            That is not the same fact as an empty plan, and stock reaches it on its own:
            an un-upgraded Tracking Station leaves `Vessel.patchedConicSolver` null, so
            an early-career craft cannot hold a plan rather than merely not holding one.
            Without this field both arrive as `Nodes: []` and an operator is told their
            plan is empty when the truth is that they cannot make one.

            Nothing outside the election may branch on the VALUE: a provider says what
            it is so a readout can name it and a diagnostic can record it, never so a
            consumer can special-case one. Present-versus-null is the only part anything
            should test.
        meta:
          description: The payload's provenance (`"vessel:<guid>"` or `"game"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselOrbit:
      type: object
      description: |-
        The `vessel.orbit` channel payload: the active vessel's orbital elements.
        Elements are the cause; every kinematic quantity (position, velocity,
        apsides, anomalies, period) is derived by the consumer at its view UT
        through the propagation capability, and is not streamed here. The one
        exception is the pair of apsis countdowns under physics,
        `VesselOrbit.timeToAp` and `VesselOrbit.timeToPe`.

        Units: `VesselOrbit.sma` in metres; `VesselOrbit.inc`, `VesselOrbit.lan` and
        `VesselOrbit.argPe` in DEGREES; and `VesselOrbit.meanAnomalyAtEpoch` in
        RADIANS. The degrees/radians split is KSP's own and is kept so every value
        matches KSP's `Orbit`.

        Only `VesselOrbit.meanAnomalyAtEpoch` and `VesselOrbit.epoch` are
        reckonable: a coast changes the craft's phase and nothing else, and the
        other elements are constants of the orbit. A consumer wanting a whole
        modelled orbit overlays those two on the observed payload.
      required:
        - referenceBodyIndex
        - sma
        - ecc
        - inc
        - meanAnomalyAtEpoch
        - epoch
        - mu
        - patches
        - horizon
        - meta
      properties:
        referenceBodyIndex:
          type: number
          x-sitrep-unit: id
          description: Index into `system.bodies` of the body this orbit is around.
        sma:
          type: number
          x-sitrep-unit: m
          description: Semi-major axis, in metres.
        ecc:
          type: number
          x-sitrep-unit: "1"
          description: |-
            Eccentricity. Below 1 for a closed orbit, 1 or above for an escape
            trajectory.
        inc:
          type: number
          x-sitrep-unit: °
          description: Inclination, in degrees (KSP's `Orbit.inclination`).
        lan:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Longitude of ascending node, degrees; `null` only when absent, never NaN and
            never 0 as a stand-in. An equatorial orbit still has one.
        argPe:
          type:
            - number
            - "null"
          x-sitrep-unit: °
          description: |-
            Argument of periapsis, degrees; `null` only when absent, never NaN and never
            0 as a stand-in. A circular orbit still has one.
        meanAnomalyAtEpoch:
          type: number
          x-sitrep-unit: rad
          description: |-
            Mean anomaly at `VesselOrbit.epoch`, in RADIANS, not degrees, matching KSP's
            `Orbit.meanAnomalyAtEpoch`. Reckonable by Kepler propagation, from
            `VesselOrbit.sma`, `VesselOrbit.mu`, `VesselOrbit.horizon` and
            `system.bodies`.
        epoch:
          type: number
          x-sitrep-unit: ut
          description: |-
            The reference epoch of `VesselOrbit.meanAnomalyAtEpoch`, as a universal time
            in seconds (KSP's `Orbit.epoch`). Reckonable with
            `VesselOrbit.meanAnomalyAtEpoch` by the same model.
        mu:
          type: number
          x-sitrep-unit: m³/s²
          description: |-
            The reference body's standard gravitational parameter (GM), so the elements
            propagate without a separate body lookup.
        timeToAp:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            Seconds from this sample's `validAt` until the craft next reaches apoapsis
            on the orbit these elements describe, as KSP computes it (`Orbit.timeToAp`).
            Carried only while the craft is under physics (`meta.quality` `Loaded`): on
            rails the same figure follows exactly from the elements, and the field is
            null. Also null on a hyperbolic orbit, which has no apoapsis. Never a
            sentinel in place of null.

            True at `validAt`. A reader at a later instant subtracts the elapsed time,
            wrapping by the period once the apsis has passed.
        timeToPe:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            Seconds from this sample's `validAt` until the craft next reaches periapsis,
            as KSP computes it (`Orbit.timeToPe`). Carried under the same rule as
            `VesselOrbit.timeToAp`: only while `meta.quality` is `Loaded`, null on
            rails. On a hyperbolic orbit it is null once the periapsis has been passed,
            since there is no next one. Never a sentinel in place of null.
        encounter:
          description: |-
            The next sphere-of-influence transition on the current trajectory. Null when
            there is none (the common case), never a sentinel.
          anyOf:
            - $ref: "#/components/schemas/OrbitEncounter"
            - type: "null"
        patches:
          type: array
          items:
            $ref: "#/components/schemas/OrbitPatch"
          description: |-
            The vessel's future-orbit patch chain. Element 0 is the current patch (the
            same elements as the fields above, restated in `OrbitPatch`'s shape so a
            client walks one list), followed by any later sphere-of-influence patches
            KSP's patched-conic solver has already resolved. Always an array, empty
            rather than null when there is no chain.
        horizon:
          description: |-
            How far ahead these elements may be propagated before they stop being
            trustworthy. Never null: a producer that does not state a horizon leaves it
            `PropagationHorizonKind.Unspecified`, which reads as unpropagatable.

            A client cannot compute this: it depends on the perturbation environment
            (which bodies are near, how massive, how far), so it arrives on the sample.
            It rides here, beside the elements, because a horizon and the elements it
            bounds share one `validAt`; carried separately, a client could hold one
            sample's elements beside another's horizon.
          allOf:
            - $ref: "#/components/schemas/PropagationHorizon"
        meta:
          description: |-
            Payload provenance. `Source` is `"vessel:<guid>"` for the active vessel;
            `Quality` is `Loaded` under physics and `OnRails` otherwise.
          allOf:
            - $ref: "#/components/schemas/OrbitPayloadMeta"
    VesselOrbitTruth:
      type: object
      description: |-
        The `vessel.orbit.truth` channel payload: KSP's own maintained state vector
        for the active vessel (`Orbit.pos` and `Orbit.vel`), relative to the body it
        orbits. A development channel for checking element-to-position math against
        KSP's own state, not a source of altitude or velocity for a widget: read
        `vessel.orbit` for those. Absent when the state vector or the frame flag
        could not be read.

        `VesselOrbitTruth.frameRotating` says which frame the vectors are in, and a
        comparison must gate on it. When it is false they are in the fixed,
        non-rotating frame the orbital elements are defined against, and are
        directly comparable to a Kepler propagation of those elements. When it is
        true (KSP switches to this below a body's `inverseRotThresholdAltitude`: low
        orbit, atmospheric flight, landed) they are in a frame co-rotating with the
        body's spin, and differ from a fixed-frame propagation by a rotation about
        the polar axis that grows with time.
      required:
        - position
        - velocity
        - frameRotating
        - meta
      properties:
        position:
          type: object
          description: |-
            Position in metres relative to the body the vessel orbits, KSP's
            `Orbit.pos`, in the frame `VesselOrbitTruth.frameRotating` names.

            To check element-to-position math, compare against the reported value, never
            a reckoned one: reckoning applies the same Kepler propagator being checked,
            so it agrees with itself by construction.
          required:
            - x
            - y
            - z
          properties:
            x: &a6
              type: number
              x-sitrep-unit: m
            y: *a6
            z: *a6
        velocity:
          type: object
          description: |-
            Velocity in m/s relative to the body the vessel orbits, KSP's `Orbit.vel`,
            in the frame `VesselOrbitTruth.frameRotating` names.
          required:
            - x
            - y
            - z
          properties:
            x: &a7
              type: number
              x-sitrep-unit: m/s
            y: *a7
            z: *a7
        frameRotating:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            The reference body's `CelestialBody.inverseRotation`: true when
            `VesselOrbitTruth.position` and `VesselOrbitTruth.velocity` are in a frame
            co-rotating with the body, false when they are in the fixed inertial frame.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselPart:
      type: object
      description: |-
        One part in the `VesselParts.parts` tree. `VesselPart.id`,
        `VesselPart.name`, `VesselPart.position`, `VesselPart.dryMass`,
        `VesselPart.inverseStage` and `VesselPart.maxTemp` are always present;
        `VesselPart.parentId` (null for the root), `VesselPart.up`, the current and
        skin temperatures (unset before physics runs) and
        `VesselPart.fuelLineTargetId` are nullable.

        **Join key.** `VesselPart.id` is `Part.flightID` as a string, the same form
        the `partId` of `parts.power` and `parts.robotics` uses, so a part can be
        joined across those channels. `VesselPart.parentId` and
        `VesselPart.fuelLineTargetId` use the same form. Whether a flightID survives
        docking and undocking is up to KSP.
      required:
        - id
        - name
        - title
        - position
        - bounds
        - dryMass
        - inverseStage
        - maxTemp
        - category
        - modules
        - isRobotics
        - isPowerRelated
        - resources
        - moduleStates
        - actionBindings
      properties:
        id:
          type: string
          x-sitrep-unit: id
          description: |-
            `Part.flightID` as a string: the join key within the tree and across
            channels. Empty only when KSP has not yet assigned a flight id (its
            uninitialised 0).
        parentId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: The parent part's `flightID` as a string; `null` for the root part.
        name:
          type: string
          x-sitrep-unit: text
          description: |-
            `Part.partInfo.name` (the `AvailablePart.name` config id, e.g.
            `"solarPanels1"`).
        title:
          type: string
          x-sitrep-unit: text
          description: |-
            `Part.partInfo.title` (the display title, e.g. `"OX-STAT Photovoltaic
            Panels"`).
        position:
          type: object
          description: |-
            `Part.orgPos`: the part's original vessel-local position (metres, vessel
            frame).
          required:
            - x
            - y
            - z
          properties:
            x: &a8
              type: number
              x-sitrep-unit: m
            y: *a8
            z: *a8
        up:
          type:
            - object
            - "null"
          description: |-
            The part's local up axis (`Part.orgRot * Vector3.up`), for orienting flow or
            thrust glyphs, as a unit vector in the vessel's frame. `null` when absent.
          required:
            - x
            - y
            - z
          properties:
            x: &a9
              type: number
              x-sitrep-unit: "1"
            y: *a9
            z: *a9
        bounds:
          description: The part's bounding box, in the part's own frame. Always present.
          allOf:
            - $ref: "#/components/schemas/PartBounds"
        dryMass:
          type: number
          x-sitrep-unit: t
          description: "`Part.mass`: dry mass (tonnes)."
        inverseStage:
          type: number
          x-sitrep-unit: id
          description: |-
            `Part.inverseStage`, in KSP's own inverted staging numbering, unchanged; see
            `VesselStructure.currentStage`.
        maxTemp:
          type: number
          x-sitrep-unit: K
          description: "`Part.maxTemp`: internal max temperature (K)."
        skinMaxTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            `Part.skinMaxTemp`: maximum skin temperature (K); `null` where KSP reports
            `-1`, no skin-thermal model.
        currentTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            `Part.temperature`: current internal temperature (K); `null` where KSP
            reports `-1`, not yet simulated.
        skinTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            `Part.skinTemperature`: current skin temperature (K); `null` when absent,
            such as before physics runs.
        category:
          type: string
          x-sitrep-unit: text
          description: |-
            `Part.partInfo.category` (`PartCategories` enum name, e.g. `"Engine"`). A
            display label; see `VesselPart.categoryOrdinal`.
        categoryOrdinal:
          description: |-
            `VesselPart.category`'s KSP ORDINAL, typed to `KspPartCategory`.

            Classify by this rather than by `VesselPart.category`'s name, which is a
            display label and changes if KSP renames a member.

            `null` when the part had no `partInfo` to read, the same case that leaves
            `VesselPart.category` empty. `PartCategories.none` is `-1` and is a real
            value, not an absence.
          anyOf:
            - $ref: "#/components/schemas/KspPartCategory"
              x-sitrep-unit: enum
            - type: "null"
        modules:
          type: array
          items:
            type: string
            x-sitrep-unit: text
          description: |-
            Each `PartModule`'s CLR class name (e.g. `"ModuleEngines"`,
            `"CModuleFuelLine"`), which is what a client classifies a part by.
        isRobotics:
          type: boolean
          x-sitrep-unit: flag
          description: "`Part.isRobotic()`: a Breaking Ground robotic servo part."
        isPowerRelated:
          type: boolean
          x-sitrep-unit: flag
          description: |-
            True when the part carries a solar panel, alternator, EC-producing
            converter, or an ElectricCharge resource capacity.
        fuelLineTargetId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            For a fuel-line part, the stringified `flightID` of the part it feeds;
            `null` otherwise.
        resources:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PartResourceFlow"
          description: |-
            Every resource this part carries, keyed by resource name (e.g.
            `"ElectricCharge"`): storage plus live production or consumption. Empty when
            the part carries no resources.
        moduleStates:
          type: array
          items:
            $ref: "#/components/schemas/PartModuleState"
          description: |-
            Per-module behavioural state (solar panel deployed, engine firing, parachute
            waiting to deploy, and so on): one entry per module on the part that maps to
            `PartModuleState`'s vocabulary, in `Part.Modules` order. Empty when the part
            carries no module of a mapped type.
        actionBindings:
          type: array
          items:
            $ref: "#/components/schemas/ActionBinding"
          description: |-
            Action-group bindings on this part: one entry per bound part action
            (`ActionBinding.action` = `BaseAction.guiName`, and the named groups its
            `BaseAction.actionGroup` Flags bitmask decodes to). Per action, not per
            part. Empty when no action on the part is bound to any group. Derive an
            action group's human-readable caption from this.
    VesselParts:
      type: object
      description: |-
        The `vessel.parts` channel payload: the active vessel's full part tree, with
        each part's position, mass, temperatures, resources, module states and
        action-group bindings. A single object, or `null` when there is no active
        vessel.

        Per-part temperatures ride each `VesselPart` (`VesselPart.currentTemp`,
        `VesselPart.maxTemp`, `VesselPart.skinTemp`, `VesselPart.skinMaxTemp`), so a
        hottest-part, engine or heat-shield rollup can be derived from this channel.
        `vessel.thermal` carries a ready-made hottest-part rollup.
      required:
        - parts
        - meta
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/VesselPart"
          description: |-
            Every part on the active vessel this tick, in vessel part-list order. Always
            present (possibly empty); a tick with no vessel yields a `null` payload, not
            an empty list.
        meta:
          description: The payload's provenance, always `"vessel:<guid>"` for the active vessel.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselPhysicsMode:
      type: object
      description: |-
        The `vessel.physics.mode` Topic payload: the active vessel's physics regime
        (`PhysicsMode`). Delayed (DelayRole) like every other vessel-derived
        channel: it describes the vessel itself, so the ground learns about it at
        UT+delay, not as a ground-side fact. Absent when there is no active vessel.
      required:
        - mode
        - meta
      properties:
        mode:
          description: The active vessel's physics regime.
          allOf:
            - $ref: "#/components/schemas/PhysicsMode"
              x-sitrep-unit: enum
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselPropulsion:
      type: object
      description: |-
        The `vessel.propulsion` channel payload: the active vessel's mass and
        thrust, the inputs to thrust-to-weight and burn-time figures. Mass is in
        tonnes and thrust in kN, so `thrust / (mass · g)` is a thrust-to-weight
        ratio directly.

        TWR, maximum TWR and a vessel-level burn-time estimate are derived by the
        client from these fields, and are not streamed here.
      required:
        - totalMass
        - dryMass
        - currentThrust
        - availableThrust
        - meta
      properties:
        totalMass:
          type: number
          x-sitrep-unit: t
          description: |-
            The vessel's total mass including resources, in tonnes (KSP's
            `Vessel.totalMass`).
        dryMass:
          type: number
          x-sitrep-unit: t
          description: |-
            The vessel's mass without resources, in tonnes: the sum of every part's
            `Part.mass`.
        currentThrust:
          type: number
          x-sitrep-unit: kN
          description: |-
            The thrust every engine on the vessel is producing now, in kN (the sum of
            `ModuleEngines.finalThrust`). Zero when nothing is firing.
        availableThrust:
          type: number
          x-sitrep-unit: kN
          description: |-
            The thrust the vessel can produce right now, in kN: the maximum thrust
            (`ModuleEngines.GetMaxThrust`) of every engine that is ignited and not
            flamed out. A shut-down or flamed-out engine contributes nothing, so this is
            not the vessel's rated maximum.
        thrustStartedUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            UT the craft's CURRENT continuous period of thrust began, or null when it is
            not under thrust as of the last measurable reading.

            **An observation instant.** It says when something was SEEN to be true,
            which is a different kind of UT from a plan's `ManeuverNode.Ut` or an
            orbit's `epoch`, and the `ut` token does not separate them. Subtracting this
            from a planned instant is type-legal and meaningless; the only duration it
            belongs in is one measured against the reader's own view clock.

            Latched rather than sent as an edge: every vessel channel is
            `Delivery.LossyLatest`, so a one-shot "thrust just started" event could be
            dropped, and a consumer that missed it could not tell that from nothing
            having happened. A latched instant is on every subsequent frame until it
            changes.

            Held, not cleared, while thrust is unmeasurable (an on-rails or packed craft
            has no parts to read). Otherwise switching away from a burning craft would
            read as its engines quitting.
        lastThrustEndUt:
          type:
            - number
            - "null"
          x-sitrep-unit: ut
          description: |-
            UT the craft's most recent period of thrust ENDED, or null when no period of
            thrust has been observed to end since this craft became the subject. Same
            observation-instant reading as `VesselPropulsion.thrustStartedUt`.

            **Present here with a null `VesselPropulsion.thrustStartedUt` is the fact
            nothing else on the wire can state:** the engines ran, and they have
            stopped. `VesselPropulsion.currentThrust` at zero cannot say it (a craft
            that never lit reads the same), and `vessel.control.throttle` certainly
            cannot: that is where the pilot left the lever, and it sits at full through
            a flameout, a dry tank and an unlit stage.

            It does NOT say why the engines stopped, and no reading can. A burn paused
            to be re-planned and a burn abandoned produce the same instant, because the
            difference between them is whether the operator comes back, which has not
            happened yet. A consumer may report that thrust ceased with delta-v owed; it
            may not report a shortfall.
        meta:
          description: Payload provenance. `Source` is `"vessel:<guid>"` for the active vessel.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselResources:
      type: object
      description: |-
        The `vessel.resources` channel payload: a keyframed map, keyed by resource
        name. No value is ever a sentinel such as `-1`.

        Only these stock resources are reported: `LiquidFuel`, `Oxidizer`,
        `SolidFuel`, `MonoPropellant`, `ElectricCharge`, `XenonGas`, `Ore` and
        `Ablator`.

        **Three-way typed absence:**

        - **Key ABSENT** from `VesselResources.resources`: structural: this vessel
          does not carry the resource at all (its capacity is zero). Changes only on
          staging/docking.
        - **Key present, `{current: 0, max: > 0}`**, carried but currently empty (a
          real, meaningful reading, not an error).
        - **Whole channel absent**: no vessel at all, the same convention as every
          other `vessel.*` channel.

        Because every emission is the FULL map (a structured, keyframed channel,
        never a delta), a key disappearing between two emissions is itself a real
        structural statement (the vessel stopped carrying that resource, e.g. a tank
        was staged away), never an ambiguous "did it change or did the stream just
        drop it".

        Carries amounts only, no flow or rate: a vessel-total flow would be a number
        that is not the game's own.
      required:
        - resources
        - meta
      properties:
        resources:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ResourceAmount"
          description: |-
            DYNAMIC-KEY MAP keyed by KSP resource name (e.g. `"LiquidFuel"`): enumerate
            the keys rather than reaching for one you expect. Empty, never null, for a
            vessel carrying none of the reported resources.
        meta:
          description: "Provenance: `\"vessel:<guid>\"` for the vessel the amounts belong to."
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselRosterEntry:
      type: object
      description: |-
        One vessel in the `SystemVessels` roster. A vessel with no resolvable stable
        id is left out rather than given a made-up one, so
        `VesselRosterEntry.vesselId` is always present.
      required:
        - vesselId
        - name
        - vesselType
        - situation
      properties:
        vesselId:
          type: string
          x-sitrep-unit: id
          description: |-
            Stable subject id (KSP vessel GUID). Always present, entries without one are
            dropped.
        name:
          type: string
          x-sitrep-unit: text
          description: Display name; defaults to the empty string, never null.
        vesselType:
          description: Vessel type, as the numeric value of `VesselType`.
          allOf:
            - $ref: "#/components/schemas/VesselType"
              x-sitrep-unit: enum
        situation:
          description: Flight situation, as the numeric value of `Situation`.
          allOf:
            - $ref: "#/components/schemas/Situation"
              x-sitrep-unit: enum
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            Index into `SystemBodies` of this vessel's main body; null when absent or
            unresolved.
        crewCount:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Kerbals aboard right now, read from the loaded vessel when it is loaded and
            from its saved state otherwise, so an unloaded background vessel still
            reports a real count. 0 is an uncrewed vessel; null means only that the read
            failed.
        crewCapacity:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Seat capacity, read the same way as `VesselRosterEntry.crewCount`. Null only
            if the read failed.
        commsConnected:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            Whether stock CommNet reports a live control link home for this vessel right
            now (`Vessel.connection.IsConnected`), read for every roster vessel, loaded
            or not. This is stock's reading, not the active vessel's `comms.*` channels,
            which a comms mod may provide.

            Null when CommNet has no connection to read for this vessel, which means
            unknown, not "no link". Two causes: rarely, a scene transition; and always,
            for the `Debris`, `SpaceObject` (asteroids and comets) and `Unknown` vessel
            types, which CommNet never gives a connection
            (`CommNet.CommNetVessel.OnStart`). A debris or asteroid entry carries null
            here on every sample.
        commsControlSource:
          description: |-
            The same connection's control level. Null under the same condition as
            `VesselRosterEntry.commsConnected`, including the permanent Debris,
            SpaceObject and Unknown vessel-type case described there.
          anyOf:
            - $ref: "#/components/schemas/RosterCommsControlSource"
              x-sitrep-unit: enum
            - type: "null"
        orbit:
          description: |-
            This vessel's own orbital elements, the same shape as `BodyEntry.orbit`,
            about the body at `VesselRosterEntry.bodyIndex`. This is what positions a
            roster vessel: there is no separate position field, so derive its position
            from this orbit, joined by `VesselRosterEntry.vesselId`. Null when the
            vessel has no orbit yet (during a scene transition), never a sentinel.
          anyOf:
            - $ref: "#/components/schemas/OrbitEntry"
            - type: "null"
    VesselStructure:
      type: object
      description: |-
        The `vessel.structure` channel payload: the active vessel's stage and part
        counts. Absent when there is no active vessel.

        `VesselStructure.currentStage` uses KSP's own staging numbering unchanged,
        which runs inverted relative to the staging list as drawn: this contract
        does not renumber it. The part tree itself is on `vessel.parts`.
      required:
        - currentStage
        - meta
      properties:
        currentStage:
          type: number
          x-sitrep-unit: id
          description: |-
            KSP's own `Vessel.currentStage` numbering (capsule/high stages have LOW
            numbers); see the class doc comment.
        stageCount:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Number of stages: the highest `Part.inverseStage` on the vessel plus one.
            Null when the vessel has no parts this tick.
        partCount:
          type:
            - number
            - "null"
          x-sitrep-unit: count
          description: |-
            Number of parts on the vessel. Null when the vessel's part list could not be
            read this tick.
        meta:
          description: The payload's provenance (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselSurface:
      type: object
      description: |-
        The `vessel.surface` channel payload: surface data a landing widget needs
        that `vessel.flight` doesn't already carry. `vessel.flight.AltitudeTerrain`
        is the height of the vessel's root part above the terrain;
        `VesselSurface.heightFromTerrain` is the height of the vessel's LOWEST
        point, the number a landing-gear or suicide-burn readout cares about. The
        two differ by how far the vessel reaches below its root.

        Whole-channel absence means the vessel has no reference body yet. The
        channel is present in every situation, orbiting included.
      required:
        - meta
      properties:
        biome:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            KSP's biome name at the vessel's current lat/long (e.g. "Highlands",
            "Shores"). Null when the body has no biome map (e.g. gas giants) or the
            lookup failed this tick.
        landedAt:
          type:
            - string
            - "null"
          x-sitrep-unit: text
          description: |-
            The named launch/landing site the vessel is currently at (e.g.
            "KSC_LaunchPad", "Runway"), null when landed/splashed somewhere with no
            named site, or when not landed/splashed at all.
        heightFromTerrain:
          type:
            - number
            - "null"
          x-sitrep-unit: m
          description: |-
            Metres from the vessel's lowest point down to the terrain, never below 0.
            Null whenever KSP did not measure the terrain beneath the vessel this tick:
            its terrain raycast found nothing below, or the vessel is packed or unloaded
            and KSP is holding an earlier value.
        meta:
          description: Payload provenance. `Source` is `"vessel:<guid>"` for the active vessel.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselTarget:
      type: object
      description: |-
        The `vessel.target` channel payload: the active vessel's CURRENT target
        only. `VesselTarget.relativePosition`/`VesselTarget.relativeVelocity` both
        use the one `Vec3` shape.

        `VesselTarget.orbit` reuses `VesselOrbit` itself (not a separate "target
        orbit" shape), so the SDK propagates a target with the same code path as the
        active vessel and both are evaluated at the same view time. Its nested
        `VesselTarget.meta` is stamped with the SAME subject (the active vessel
        producing this sample), not the target's; `VesselTarget.vesselId` and
        `VesselTarget.bodyIndex` carry the target's own identity.

        A null payload means nothing is targeted, the common case, never a
        zero-distance or zero-vector record.
      required:
        - name
        - kind
        - meta
      properties:
        name:
          type: string
          x-sitrep-unit: text
          description: |-
            The target's name as KSP gives it (`ITargetable.GetName()`). Empty string
            when none was read.
        kind:
          description: What kind of thing is targeted. Never `TargetKind.Position`.
          allOf:
            - $ref: "#/components/schemas/TargetKind"
              x-sitrep-unit: enum
        vesselId:
          type:
            - string
            - "null"
          x-sitrep-unit: id
          description: |-
            The target's own stable id, populated when `VesselTarget.kind` is
            `TargetKind.Vessel` (KSP's `Vessel.id` guid) or `TargetKind.Part` (the
            owning vessel's guid). The same opaque id `system.vessels`' roster and
            `SetTargetArgs.vesselId` use, so a widget can hand it straight back into a
            re-target command with no extra lookup. Null for a body or other target; see
            `VesselTarget.bodyIndex` for the body case.
        bodyIndex:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            The target's `system.bodies` index, populated ONLY when `VesselTarget.kind`
            is `TargetKind.Body`, matching `SetTargetArgs.bodyIndex`. Null for any other
            target, or when the body name could not be resolved against `system.bodies`
            this tick.
        partId:
          type:
            - number
            - "null"
          x-sitrep-unit: id
          description: |-
            The target part's KSP `Part.flightID`: populated ONLY when
            `VesselTarget.kind` is `TargetKind.Part` (a docking port), scoped by
            `VesselTarget.vesselId` (which carries the owning vessel's guid in the Part
            case). Null for every other kind. A widget reads this pair straight off
            `vessel.target` and hands it back into `SetTargetArgs.partId` to re-target
            the same port.
        relativePosition:
          type:
            - object
            - "null"
          description: |-
            The target's position relative to the active vessel, in metres. Null only
            when the transform data needed to compute it was not available this tick.
          required:
            - x
            - y
            - z
          properties:
            x: &a10
              type: number
              x-sitrep-unit: m
            y: *a10
            z: *a10
        relativeVelocity:
          type:
            - object
            - "null"
          description: |-
            The target's velocity relative to the active vessel, in m/s. Null (never
            `(0,0,0)`) when the transform data needed to compute it was not available
            this tick.
          required:
            - x
            - y
            - z
          properties:
            x: &a11
              type: number
              x-sitrep-unit: m/s
            y: *a11
            z: *a11
        orbit:
          description: |-
            The target's orbit. Null when the target has no orbit (it is landed, say, or
            its orbit could not be resolved this tick).
          anyOf:
            - $ref: "#/components/schemas/VesselOrbit"
            - type: "null"
        closestApproach:
          description: |-
            Next closest approach, from the mod's elected propagation provider. Null
            when there is no encounter to report; see `ClosestApproach`.
          anyOf:
            - $ref: "#/components/schemas/ClosestApproach"
            - type: "null"
        meta:
          description: |-
            The payload's provenance, stamped with the active vessel
            (`"vessel:<guid>"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselThermal:
      type: object
      description: |-
        The `vessel.thermal` channel payload: the active vessel's thermal rollup,
        its hottest part, heat shield and engine. Each ratio is null when no part
        had a valid maximum temperature this tick, never 0, so "no valid part" and
        "coldest possible part" stay distinct.

        The whole payload is null when the vessel has no parts at all, a different,
        coarser absence than an individual null ratio. For every part's temperatures
        rather than a rollup, see `vessel.parts`.
      required:
        - meta
      properties:
        maxSkinTempRatio:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            The highest skin-temperature ratio (`skinTemperature / skinMaxTemp`) of any
            part this tick; 1 is at the limit. Not necessarily
            `VesselThermal.hottestPart`'s. Null when no part had a valid (> 0)
            `skinMaxTemp`, never 0.
        maxInternalTempRatio:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            The highest internal-temperature ratio (`temperature / maxTemp`) of any part
            this tick, which is `VesselThermal.hottestPart`'s; 1 is at the limit. Null
            when no part had a valid (> 0) `maxTemp`, never 0.
        hottestPart:
          description: |-
            The part with the highest internal-temperature ratio. Null when no part
            qualified, the same condition as a null
            `VesselThermal.maxInternalTempRatio`.
          anyOf:
            - $ref: "#/components/schemas/ThermalHottestPart"
            - type: "null"
        heatShieldTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            Hottest heat-shield part's internal temperature (K, raw: the part carrying a
            `ModuleAblator`, `Part.temperature`). Null when the vessel carries no
            ablative heat shield this tick.
        heatShieldFlux:
          type:
            - number
            - "null"
          x-sitrep-unit: kW
          description: |-
            The same heat shield's ablative heat flux (`ModuleAblator.flux`, kW). Null
            when the vessel carries no ablative heat shield this tick.
        hottestEngineTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            Internal temperature (K) of whichever part carrying a `ModuleEngines` or
            `ModuleEnginesFX` module has the highest internal-temperature ratio. Null
            when the vessel carries no engine part with a valid `maxTemp` this tick.
        hottestEngineMaxTemp:
          type:
            - number
            - "null"
          x-sitrep-unit: K
          description: |-
            That same engine part's max internal temperature (K, raw). Null under the
            same no-engine-parts condition as `VesselThermal.hottestEngineTemp`.
        hottestEngineTempRatio:
          type:
            - number
            - "null"
          x-sitrep-unit: ratio
          description: |-
            That same engine part's internal-temperature ratio (`temperature /
            maxTemp`). Null under the same no-engine-parts condition as
            `VesselThermal.hottestEngineTemp`.
        anyEnginesOverheating:
          type:
            - boolean
            - "null"
          x-sitrep-unit: flag
          description: |-
            True when any engine part's internal-temperature ratio is at or above 0.9.
            False, not null, whenever the vessel has an engine part and none crosses it;
            null only alongside a null `VesselThermal.hottestEngineTempRatio`, when no
            engine part with a valid `maxTemp` was found this tick.
        meta:
          description: The payload's provenance, `"vessel:<guid>"` for the active vessel.
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    VesselType:
      type: integer
      description: |-
        A vessel's type, KSP's `Vessel.vesselType` (the `VesselType` enum), with the
        same member names. `VesselType.Unknown` is both KSP's own `Unknown` type and
        the value for a type this contract does not recognise.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: Ship
          description: A crewed or general-purpose ship.
        - const: 1
          title: Station
          description: A space station.
        - const: 2
          title: Lander
          description: A lander.
        - const: 3
          title: Probe
          description: An uncrewed probe.
        - const: 4
          title: Rover
          description: A rover.
        - const: 5
          title: Base
          description: A surface base.
        - const: 6
          title: Relay
          description: A communications relay.
        - const: 7
          title: EVA
          description: A kerbal on EVA.
        - const: 8
          title: Flag
          description: A planted flag.
        - const: 9
          title: Debris
          description: Debris, such as a spent stage or a jettisoned fairing.
        - const: 10
          title: SpaceObject
          description: An asteroid or comet.
        - const: 11
          title: DeployedScienceController
          description: A deployed science station's central control unit (Breaking Ground).
        - const: 12
          title: DeployedSciencePart
          description: |-
            A deployed science experiment or power part other than the controller
            (Breaking Ground).
        - const: 13
          title: DroppedPart
          description: A part dropped from a vessel, such as a piece of ground equipment.
        - const: 14
          title: Unknown
          description: KSP's own unknown type, or a type this contract does not recognise.
    WarpMode:
      type: integer
      description: |-
        KSP's time-warp mode, mirroring its `TimeWarp.Modes` enum, which has only
        `HIGH` and `LOW`. `WarpMode.Unknown` covers a raw value KSP reports that
        neither matches.
      x-sitrep-enum-kind: ordinal
      oneOf:
        - const: 0
          title: High
          description: On-rails time warp (KSP's `HIGH` mode).
        - const: 1
          title: Low
          description: Physics warp (KSP's `LOW` mode).
        - const: 2
          title: Unknown
          description: KSP reported a mode this contract does not know.
    WarpState:
      type: object
      description: |-
        The `time.warp` channel payload: the game's time-warp and pause state, as
        separate typed fields.

        Current UT is not a field here (or anywhere in this contract):
        `meta.validAt` stamps every sample, and the SDK's view clock is the "what
        time is it" surface.

        Warp and pause are GLOBAL game state, so `WarpState.meta` is stamped `Source
        = "game"`, not `"vessel:<guid>"`, and the channel emits at the Space Center
        and Tracking Station as well as in flight, with or without an active vessel.
      required:
        - warpRate
        - warpRateIndex
        - warpMode
        - paused
        - keyframeFloorSec
        - sampleIntervalUt
        - meta
      properties:
        warpRate:
          type: number
          x-sitrep-unit: "1"
          description: |-
            The current time-warp multiplier (KSP's `TimeWarp.CurrentRate`): `1` is real
            time, `1000` is game time passing a thousand times faster.
        warpRateIndex:
          type: number
          x-sitrep-unit: id
          description: |-
            The current rung of the warp rate table (KSP's `TimeWarp.CurrentRateIndex`),
            `0` at real time. Under `WarpMode.High` it indexes `WarpState.warpRates`.
        warpMode:
          description: |-
            Which warp mode is in force, on-rails or physics (KSP's
            `TimeWarp.WarpMode`).
          allOf:
            - $ref: "#/components/schemas/WarpMode"
              x-sitrep-unit: enum
        paused:
          type: boolean
          x-sitrep-unit: flag
          description: Whether the game is paused (KSP's `FlightDriver.Pause`).
        warpRates:
          type:
            - array
            - "null"
          items:
            type: number
            x-sitrep-unit: "1"
          description: |-
            What every HIGH-warp rung of THIS install actually runs at, indexed by
            `WarpState.warpRateIndex`, so `warpRates[i]` is the multiplier
            `time.setWarpIndex` with `index = i` produces. Null when the game has no
            warp controller to read it off (no scene that can warp).

            The table is CONFIG, not a constant: Kopernicus and RealSolarSystem both
            republish it, so a rung stock runs at 100x may run at 10000x on another
            install. Read the rate here rather than assuming stock's table.
        keyframeFloorSec:
          type: number
          x-sitrep-unit: s
          description: |-
            The shortest real time the mod leaves between two periodic keyframes on one
            channel, in seconds.

            Keyframe cadences are declared in UT, and under warp UT can pass a cadence
            on every tick, so the mod also waits at least this long in real time. The
            gap a client sees between two keyframes of a quiet channel is therefore at
            least `keyframeFloorSec × warpRate` UT. A client that infers staleness from
            keyframe cadence has to allow for that, or every quiet channel reads as held
            too long just after a warp step-up.

            On this topic because its only use is that product, and both halves then
            arrive in the same sample.
        observationQuantumUt:
          type:
            - number
            - "null"
          x-sitrep-unit: s
          description: |-
            The UT that actually passes between two samples at the current warp rate, in
            seconds, or `null` where the host did not report its physics step.

            `WarpState.sampleIntervalUt` up to 10x. Above that the mod samples at most
            ten times a real second, so this is a tenth of a second of game time at the
            current rate (10,000 at 100,000x), or one physics tick where a tick advances
            the game further than that. Nothing between two consecutive samples was
            observed, so a line drawn between two samples that differ asserts a path
            across this span that only a model of the value can stand behind. Two
            samples further apart than this are a channel that did not change in
            between.

            On this topic beside `WarpState.keyframeFloorSec` because it is the other
            thing warp does to cadence, and it changes only when the rate does. A client
            judging a gap reads the quantum in force when the later sample was taken.
        sampleIntervalUt:
          type: number
          x-sitrep-unit: s
          description: |-
            The UT between two samples while warp is not thinning them, in seconds: the
            finest spacing the record ever has, and `WarpState.observationQuantumUt` at
            1x. Constant for the life of the mod.

            The chord between two samples this far apart is the resolution every channel
            is sampled at, and a chart can draw it. Where the quantum is wider, the span
            beyond this is one the sampling skipped because of warp, and a line across
            it that no model of the value carries asserts a path nothing observed.
        meta:
          description: The payload's provenance (always `"game"`).
          allOf:
            - $ref: "#/components/schemas/PayloadMeta"
    WriteModSettingArgs:
      type: object
      description: |-
        Arguments to `settings.mod.write`: change one of a host mod's own settings
        through its Uplink, at once.

        **Safe to send again.** It sets the value named, so repeating one that
        already landed changes nothing.

        Refused, with nothing changed, when the Uplink lists no such setting, when
        the setting is not writable, when the value is not one its kind can hold, or
        when the Uplink refuses it. What the mod holds after any of those is on
        `settings.<uplink>`.
      required:
        - uplink
        - id
        - value
      properties:
        uplink:
          type: string
          x-sitrep-unit: id
          description: The Uplink the setting is read through.
        id:
          type: string
          x-sitrep-unit: id
          description: The setting, as `ModSettingRow.id` names it.
        value:
          type: string
          x-sitrep-unit: text
          description: The new value, spelled as `ModSettingRow.value` is.
