        fundsCompletion:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: Funds paid when the contract is completed.
        fundsFailure:
          type:
            - number
            - "null"
          x-sitrep-unit: funds
          description: Funds taken when the contract fails.
        scienceCompletion:
          type:
            - number
            - "null"
          x-sitrep-unit: science
