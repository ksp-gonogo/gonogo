        $ref: "#/components/messages/commandRequest.robotics.servo.setMotor"
      commandResponse:
        $ref: "#/components/messages/commandResponse.robotics.servo.setMotor"
  robotics.servos:
    address: robotics.servos
    description: |-
      Carries an array of `ServoEntry`.

      One entry in the `robotics.servos` Topic payload, a single Breaking Ground
      robotic servo on the active vessel. The payload is a bare array of these, or
      `null` when there is no active vessel or it carries no servo; read
      `robotics.available` to tell those two apart.

      `ServoEntry.type` is the servo kind as a plain string, not an enum. The
      kinds are `"rotor"`, `"hinge"`, `"rotationServo"` and `"piston"`, plus
      `"servo"` for a servo of a kind not recognised (a part pack's own, or one a
      later KSP adds), which carries only the readings every servo has.

      **Open set.** The kinds follow KSP's own `BaseServo` types, so more may
      appear. Switch on the kinds you can draw and ignore the rest.

      Fields that belong to one kind are `null` on every other kind: angles on
      hinges and rotation servos, extensions on pistons, and the rpm, output,
      brake, direction and torque fields on rotors.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.robotics.servos"
      event:
        $ref: "#/components/messages/event"
  science.archive:
    address: science.archive
    description: |-
      Carries an array of `ArchiveEntry`.

      One entry in the `science.archive` Topic payload: a single subject out of
      the whole-career R&D archive (`ResearchAndDevelopment.GetSubjects()`). That
      is every subject the career has ever collected or recovered, across every
      mission and every body, not scoped to the active vessel.

      The Topic payload is a bare array (`ArchiveEntry[]`), or `null` when the
      save has no R&D to walk (Sandbox mode). A save with R&D but nothing
      collected yet emits an empty array, so an empty array and `null` mean
      different things here.

      Distinct from `ExperimentBreakdownEntry`: that one rolls up the active
      vessel's currently stored results and is null with no vessel flying; this
      one is career-wide and streams at the Space Center with nothing flying at
      all.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    x-sitrep-held-at-home: true
    messages:
      streamData:
        $ref: "#/components/messages/streamData.science.archive"
      event:
        $ref: "#/components/messages/event"
  science.experiment.deploy:
    address: science.experiment.deploy
    description: |-
      Takes `ExperimentActionArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      Args shared by every science-experiment actuation command
      (`science.experiment.deploy` and `science.experiment.transmit`): the
      experiment is named by `ExperimentActionArgs.partId`, the part's
      `flightID.ToString()`, the same id `science.instruments` carries on each
      experiment entry. It is looked up among the active vessel's parts, never by
      array index. An empty or unknown `ExperimentActionArgs.partId` fails with
      `CommandErrorCode.NotFound`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.science.experiment.deploy"
      commandResponse:
        $ref: "#/components/messages/commandResponse.science.experiment.deploy"
  science.experiment.transmit:
    address: science.experiment.transmit
    description: |-
      Takes `ExperimentActionArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      Args shared by every science-experiment actuation command
      (`science.experiment.deploy` and `science.experiment.transmit`): the
      experiment is named by `ExperimentActionArgs.partId`, the part's
      `flightID.ToString()`, the same id `science.instruments` carries on each
      experiment entry. It is looked up among the active vessel's parts, never by
      array index. An empty or unknown `ExperimentActionArgs.partId` fails with
      `CommandErrorCode.NotFound`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.science.experiment.transmit"
      commandResponse:
        $ref: "#/components/messages/commandResponse.science.experiment.transmit"
  science.experimentBreakdown:
    address: science.experimentBreakdown
    description: |-
      Carries an array of `ExperimentBreakdownEntry`.

      One entry in the `science.experimentBreakdown` Topic payload: a per-subject
      rollup of the stored science results that `science.experiments` lists one
      row per result. One row per distinct subject id: several stored results for
      the same subject (for example two crew reports from the same biome) collapse
      into one entry with `ExperimentBreakdownEntry.dataMits` summed across them.

      The Topic payload is a bare array (`ExperimentBreakdownEntry[]`) or `null`,
      never a wrapper object. The whole array is `null` when there is no active
      vessel or the vessel holds no stored science data; there is no separate
      empty-array state. Every field is nullable, and is `null` whenever the raw
      value is absent or non-finite.

      `ExperimentBreakdownEntry.biome` and `ExperimentBreakdownEntry.situation`
      are parsed from the subject id by KSP's
      `ScienceUtil.GetExperimentFieldsFromScienceID`, not from the vessel's
      current position, so a subject collected earlier in the flight keeps its own
      biome and situation.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.science.experimentBreakdown"
      event:
        $ref: "#/components/messages/event"
  science.experiments:
    address: science.experiments
    description: |-
      Carries an array of `ExperimentEntry`.

      One entry in the `science.experiments` Topic payload: a single stored
      science result on the active vessel, held either by the science module that
      collected it or by a container part. The channel payload is a bare array of
      these (`ExperimentEntry[]`) or `null`, never a wrapper object. The whole
      array is `null` when there is no active vessel or the vessel holds no stored
      science data; there is no separate empty-array state.

      One row per stored `ScienceData`: a module that holds no data produces no
      row (see `InstrumentEntry` for one row per module). Every field is nullable,
      and is `null` whenever the raw value is absent or non-finite.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.science.experiments"
      event:
        $ref: "#/components/messages/event"
  science.instruments:
    address: science.instruments
    description: |-
      Carries an array of `InstrumentEntry`.

      One entry in the `science.instruments` Topic payload: a single
      `ModuleScienceExperiment` on the active vessel, as an inventory and status
      row keyed by `InstrumentEntry.partId` (the part's KSP `flightID`).

      Distinct from `ExperimentEntry`: `science.experiments` walks the same
      modules but yields one row per stored result (a module with no data produces
      no row), whereas `science.instruments` yields one row per module whether or
      not it holds data. It is the operability picture (deployed, inoperable,
      rerunnable, resettable, collectable) an operator needs to decide what to run
      next.

      The Topic payload is a bare array (`InstrumentEntry[]`) or `null` when there
      is no active vessel or it carries no experiment module. Every field is
      nullable, and is `null` whenever the raw value is absent.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.science.instruments"
      event:
        $ref: "#/components/messages/event"
  science.lab:
    address: science.lab
    description: |-
      Carries an array of `LabEntry`.

      One entry in the `science.lab` Topic payload: a Mobile Processing Lab (KSP's
      `ModuleScienceLab`) on the active vessel. The channel payload is a bare
      array (`LabEntry[]`) or `null` when there is no active vessel or it carries
      no lab. Every field is nullable, and is `null` whenever the raw value is
      absent or non-finite.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.science.lab"
      event:
        $ref: "#/components/messages/event"
  science.sensors:
    address: science.sensors
    description: |-
      Carries an array of `SensorEntry`.

      One entry in the `science.sensors` Topic payload: a single
      environmental-sensor module (`ModuleEnviroSensor`: thermometer, barometer,
      gravioli detector, accelerometer, and any modded sensor sharing the module)
      on the active vessel. The Topic payload is a bare array (`SensorEntry[]`) or
      `null` when there is no active vessel or it carries no sensor module.

      One entry per sensor module, with `SensorEntry.type` carrying the raw
      `SensorType` enum name (`TEMP`/`PRES`/`GRAV`/`ACC`/...) as a string, so
      modded sensor types and several instances of the same type each get their
      own row. Group and label by `SensorEntry.type`.

      Every field is nullable, and is `null` whenever the raw value is absent.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.science.sensors"
      event:
        $ref: "#/components/messages/event"
  session:
    title: Connection session
    description: |-
      Frames that belong to the connection rather than to any one channel.

      `subscribe` and `unsubscribe` name a topic and are how a client opens and
      closes delivery on it: see the subscription gate in the document description.
      `set-vantage` selects the command centre this connection commands from and
      observes at, which governs both what it reads and how long its commands take.
      The mod opens every connection with a `hello` naming the run it has reached,
      and answers a `ping` with a `pong` at once, in any scene and with nothing
      subscribed, which is how a client tells a quiet connection from a dead one.
      An `error` frame carries a code and, when it answers a dispatch, the
      `requestId` it refers to.

      This channel has no `address` because these frames are not routed by one: they
      are typed by their own `type` field and belong to the socket itself.
    servers:
      - $ref: "#/servers/mod"
    messages:
      subscribe:
        $ref: "#/components/messages/subscribe"
      unsubscribe:
        $ref: "#/components/messages/unsubscribe"
      setVantage:
        $ref: "#/components/messages/setVantage"
      ping:
        $ref: "#/components/messages/ping"
      hello:
        $ref: "#/components/messages/hello"
      pong:
        $ref: "#/components/messages/pong"
      error:
        $ref: "#/components/messages/error"
  settings.gonogo:
    address: settings.gonogo
    description: |-
      Carries a `SettingsModel`.

      The `settings.gonogo` Topic payload: every setting the mod and its Uplinks
      declared, what each holds now, and whether the settings file on the KSP
      machine holds the same.

      The whole model is on one Topic. A client draws a control per row from the
      row's own description, so a setting an Uplink adds needs no client code of
      its own.

      It is never delayed by light time, the time a signal takes to cross between
      a craft and the command centre (the screen an operator sends commands from):
      a setting configures the system the operator is sitting at, not a craft.

      This is where a client learns whether a save landed. The `settings.save`
      command can time out and still land, so read the outcome here, never from
      the command's reply.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: true-now
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.settings.gonogo"
      event:
        $ref: "#/components/messages/event"
  settings.mod.write:
    address: settings.mod.write
    description: |-
      Takes `WriteModSettingArgs`.

      **Not delayed.** This command takes effect immediately, because it is ground-side bookkeeping rather than a signal to a craft.

      Arguments to `settings.mod.write`: change one of a host mod's own settings
      through its Uplink, at once.

      Safe to send again: it sets the value named, so repeating one that already
      landed changes nothing.

      Refused, with nothing changed, when the Uplink lists no such setting, when
      the setting is not writable, when the value is not one its kind can hold, or
      when the Uplink refuses it. What the mod holds after any of those is on
      `settings.<uplink>`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: false
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.settings.mod.write"
      commandResponse:
        $ref: "#/components/messages/commandResponse.settings.mod.write"
  settings.save:
    address: settings.save
    description: |-
      Takes `SaveSettingsArgs`.

      **Not delayed.** This command takes effect immediately, because it is ground-side bookkeeping rather than a signal to a craft.

      Arguments to `settings.save`: one Save press, applied together and written
      to the settings file once. Never delayed by light time.

      Safe to send again. A save sets each row to the value named, so repeating
      one that already landed changes nothing. That matters because a save that
      times out may still land.

      Refused, with nothing changed, when any row is not declared or any value is
      not one its row can hold. A save that changes the values but cannot write
      the file is not refused: the values are in force, and `settings.gonogo`'s
      `SettingsModel.persistence` says the file was not written.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: false
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.settings.save"
      commandResponse:
        $ref: "#/components/messages/commandResponse.settings.save"
  spaceCenter.astronautComplex:
    address: spaceCenter.astronautComplex
    description: |-
      Carries a `AstronautComplexInfo`.

      The `spaceCenter.astronautComplex` Topic payload: the Astronaut Complex hire
      tab, the rolling pool of applicants the operator can recruit, plus the
      roster-cap context a hire is gated on.

      A wrapper object, not a bare array, so the applicant list arrives with the
      facility's crew cap, the current active-crew count and the hire price, which
      a hire control needs together. The current roster is on the separate
      `spaceCenter.crewRoster` channel. The whole payload is `null` in sandbox,
      outside career and with no game loaded, when no applicant pool exists; a
      career save whose pool is empty sends a non-null payload with an empty
      `AstronautComplexInfo.applicants` list.

      Held at the home command, like `CrewRosterEntry`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    x-sitrep-held-at-home: true
    messages:
      streamData:
        $ref: "#/components/messages/streamData.spaceCenter.astronautComplex"
      event:
        $ref: "#/components/messages/event"
  spaceCenter.crewRoster:
    address: spaceCenter.crewRoster
    description: |-
      Carries an array of `CrewRosterEntry`.

      One kerbal in the `spaceCenter.crewRoster` channel (the hired-crew roster:
      KSP's `KerbalRoster.Crew`, owned crew that is either available or currently
      assigned to a mission), and the same shape for every entry in
      `AstronautComplexInfo.applicants`: one shape for a kerbal whether hired or
      still a candidate.

      The `spaceCenter.crewRoster` channel is a bare array of these entries, one
      per crew member keyed by `CrewRosterEntry.name`. The whole payload is `null`
      (not an empty array) when no sample has arrived yet, which tells "no data
      yet" apart from "zero crew".

      Held at the home command, like `LaunchSiteEntry`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    x-sitrep-held-at-home: true
    messages:
      streamData:
        $ref: "#/components/messages/streamData.spaceCenter.crewRoster"
      event:
        $ref: "#/components/messages/event"
  spaceCenter.launchSites:
    address: spaceCenter.launchSites
    description: |-
      Carries an array of `LaunchSiteEntry`.

      One launch site in the `spaceCenter.launchSites` channel: the stock KSC pad
      and runway, any Making History sites, and any Kerbal Konstructs sites, which
      is everything registered in KSP's `PSystemSetup.Instance.LaunchSites`.

      The channel is a bare array of these entries, not a wrapper object and not a
      single KSC record: KSP has many launch sites, keyed by
      `LaunchSiteEntry.name`. The whole payload is `null` (not an empty array)
      when no sample has arrived yet, which tells "no data yet" apart from "zero
      sites". It carries no `meta` of its own.

      Held at the home command: each vantage receives a change after its own delay
      to home, at once on the ground network.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    x-sitrep-held-at-home: true
    messages:
      streamData:
        $ref: "#/components/messages/streamData.spaceCenter.launchSites"
      event:
        $ref: "#/components/messages/event"
  spaceCenter.partsAvailable:
    address: spaceCenter.partsAvailable
    description: |-
      Carries a `SpaceCenterPartsAvailable`.

      The `spaceCenter.partsAvailable` Topic payload: a wrapper carrying the count
      of parts the player can place right now (tech-unlocked and purchased in
      career; the full `PartLoader` catalogue in sandbox).

      A wrapper object, because a bare scalar has no Topic shape: read
      `spaceCenter.partsAvailable.count`. The whole payload is `null` when no
      sample has arrived yet. Held at the home command.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    x-sitrep-held-at-home: true
    messages:
      streamData:
        $ref: "#/components/messages/streamData.spaceCenter.partsAvailable"
      event:
        $ref: "#/components/messages/event"
  spaceCenter.pois:
    address: spaceCenter.pois
    description: |-
      Carries an array of `SpaceCenterPoiEntry`.

      One point of interest in the `spaceCenter.pois` channel: the union of every
      launch site (`ksc`/`launchSite` kinds, the same sites as `LaunchSiteEntry`,
      limited to sites with a set spawn-point coordinate) and every surface
      contract waypoint whose contract is Active or Offered (`contractTarget`
      kind, from `FinePrint.WaypointManager`).

      The channel is a bare array of these entries, one per POI keyed by
      `SpaceCenterPoiEntry.id`. The whole payload is `null` (not an empty array)
      when no sample has arrived yet, which tells "no data yet" apart from "zero
      POIs". Held at the home command, like `LaunchSiteEntry`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    x-sitrep-held-at-home: true
    messages:
      streamData:
        $ref: "#/components/messages/streamData.spaceCenter.pois"
      event:
        $ref: "#/components/messages/event"
  spaceCenter.savedShips:
    address: spaceCenter.savedShips
    description: |-
      Carries an array of `SavedShipEntry`.

      One craft file in the `spaceCenter.savedShips` channel, a saved VAB or SPH
      design the player can launch, read from the save's craft folders via the
      stock `CraftProfileInfo` metadata loader.

      The channel is a bare array of these entries, one per `.craft` file keyed by
      `SavedShipEntry.file`. The whole payload is `null` (not an empty array) when
      no sample has arrived yet. Held at the home command.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    x-sitrep-held-at-home: true
    messages:
      streamData:
        $ref: "#/components/messages/streamData.spaceCenter.savedShips"
      event:
        $ref: "#/components/messages/event"
  spaceCenter.scene:
    address: spaceCenter.scene
    description: |-
      Carries a `SpaceCenterScene`.

      The `spaceCenter.scene` Topic payload: the single current KSP game scene.
      `SpaceCenterScene.scene` carries exactly one of the six strings
      `{"Flight","SpaceCenter","Editor","TrackingStation","MainMenu","Other"}`:
      KSP's `GameScenes` enum folded onto that fixed set, with any scene outside
      the five named ones (`LOADING`, `PSYSTEM`, `MISSIONBUILDER`, ...) mapped to
      `"Other"`.

      An object holding the scene and, in the editor, the launch site picked
      there. The whole payload is `null` when no sample has arrived yet. Its
      `meta` is on the envelope. Never delayed (DelayRole.TrueNow): it is a fact
      about the game, not a craft.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: true-now
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.spaceCenter.scene"
      event:
        $ref: "#/components/messages/event"
  system.bodies:
    address: system.bodies
    description: |-
      Carries a `SystemBodies`.

      The `system.bodies` Topic payload: every celestial body in the game, as a
      tree, wrapped as `{ "bodies": [ ... ] }`. The whole payload is `null`, not
      an empty list, when no sample has been taken yet, so "no data yet" and "zero
      bodies" stay distinct.

      Carries no `Meta` field: unlike the `vessel.*` family, its `Meta` rides the
      envelope (`StreamData.Meta`), never the payload body.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: true-now
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.system.bodies"
      event:
        $ref: "#/components/messages/event"
  system.bodies.statesAt:
    address: system.bodies.statesAt
    description: |-
      Takes `BodyStatesRequest`.

      **Not delayed.** This command takes effect immediately, because it is ground-side bookkeeping rather than a signal to a craft.

      Args for `system.bodies.statesAt`: where one body is at each of a list of
      instants, from the propagation provider in use on this install. The instants
      are the caller's own, such as the departure and arrival times a transfer
      search tries.

      The command centre is the sender's, taken from the connection the command
      arrives on; there is no field to name another.

      A centre body is required, with no default: the reply is expressed relative
      to it. For a transfer search, name the parent both endpoints orbit; the same
      request works for a moon system.

      `BodyStatesRequest.certification` is required too: the caller states whether
      it accepts results past the span the provider vouches for, and a request
      that does not say is refused.

      The result is a conic (two-body) solve, so no ephemeris horizon applies to
      it.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: false
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.system.bodies.statesAt"
      commandResponse:
        $ref: "#/components/messages/commandResponse.system.bodies.statesAt"
  system.frame:
    address: system.frame
    description: |-
      Carries a `ControlFrame`.

      The frame the game's own navigation view is expressed in: what the player is
      looking at, and what a burn expressed relative to the control frame is held
      fixed against.

      This is not a widget's own read frame, which nothing else sees. It belongs
      to the game, there is one at a time, and it can be written as well as read
      (`SetControlFrameArgs`), so a command centre can put the player's view where
      a plan is being discussed.

      Bodies are named by `bodyName`, the key of every other body table on the
      wire, `system.bodies` included.

      A pulsating frame turns about two groups of bodies, and its origin is
      defined by the mass of each whole group, so the sets travel as well as the
      pair. `ControlFrame.primaryBodies` always leads with
      `ControlFrame.primaryBody`: take the heads for the pair, or the sets to
      compute the frame.

      The whole payload is `null` when the frame could not be read. With stock KSP
      the frame is always `ControlFrameKind.BodyCentredInertial` about the active
      vessel's reference body.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: true-now
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.system.frame"
      event:
        $ref: "#/components/messages/event"
  system.frame.set:
    address: system.frame.set
    description: |-
      Takes `SetControlFrameArgs`.

      **Not delayed.** This command takes effect immediately, because it is ground-side bookkeeping rather than a signal to a craft.

      `system.frame.set`'s args: the frame to put the view in.

      It names the two head bodies, not the sets: where `ControlFrame` reports
      `PrimaryBodies` and `SecondaryBodies`, the mod that owns the view works out
      which bodies fall on each side of a pulsating frame.

      Refusal is normal: stock KSP's frame follows the active vessel's reference
      body and cannot be set, so the command fails with `ModeUnavailable`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: false
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.system.frame.set"
      commandResponse:
        $ref: "#/components/messages/commandResponse.system.frame.set"
  system.uplink.cancel:
    address: system.uplink.cancel
    description: |-
      Takes `UplinkCancelRequest`.

      **Not delayed.** This command takes effect immediately, because it is ground-side bookkeeping rather than a signal to a craft.

      Cancels a held or travelling command: its lane number alone, or it and every
      later number this centre had sent on the lane when it was pressed. A command
      this centre is still holding stops at once; for one it has sent, a cancel
      goes to the craft, stopping the command wherever it is held and refusing it
      at the craft if it arrives there first. What it stopped arrives as journey
      reports.

      The reply says the cancel was sent, never that the command was stopped. A
      command sent less than twice its light time ago may have been lost on the
      way, in which case it is still this centre's, but the centre cannot know
      that yet, so the cancel is sent after it all the same and the command is
      reported cancelled here only once it is known to have come back.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: false
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.system.uplink.cancel"
      commandResponse:
        $ref: "#/components/messages/commandResponse.system.uplink.cancel"
  system.uplink.resend:
    address: system.uplink.resend
    description: |-
      Takes `UplinkResendRequest`.

      **Not delayed.** This command takes effect immediately, because it is ground-side bookkeeping rather than a signal to a craft.

      Sends a held or overdue command again in its own place on its lane: a new
      copy with the same lane number, which must arrive before the commands behind
      it stop waiting for it. Whichever copy reaches the craft first runs; any
      other is discarded.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: false
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.system.uplink.resend"
      commandResponse:
        $ref: "#/components/messages/commandResponse.system.uplink.resend"
  system.vessels:
    address: system.vessels
    description: |-
      Carries a `SystemVessels`.

      The `system.vessels` Topic payload: every vessel the receiving command
      centre knows of, wrapped as `{ "vessels": [ ... ] }`. Like `SystemBodies`,
      it carries no per-payload `Meta`: that rides the envelope.

      Each command centre is sent its own list and no other centre's. A centre
      knows a vessel in two ways, and an entry is made of both.

      **By sight: where it is.** A vessel's orbit, its situation and its body are
      tracked by looking at it, whether or not it has a radio and whether or not
      it is in contact. That reaches a centre in a straight line at light speed,
      through no relay, so a burn far away shows here after the distance between
      the vessel and this centre and no sooner. A vessel with no radio at all
      (debris, an asteroid, a flag, a crewed vessel with no antenna) is known this
      way only: it is listed once its light has arrived, with its name and kind,
      and leaves when the light of its going has.

      **By radio: everything else.** A vessel's crew and its link are its own to
      say, and arrive over its radio's route at that route's light-time. A vessel
      that has been seen and not yet heard has no crew count and no link state,
      which are absent and not zero. Where a vessel has a radio its location is as
      fresh as the newer of the two.

      What can be tracked by sight is the game's own tracking station rule at the
      station's current level. Where the game lets the station place no vessel at
      all, nothing is known by sight and every entry is what was heard.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.system.vessels"
      event:
        $ref: "#/components/messages/event"
  target.available:
    address: target.available
    description: |-
      Carries a `TargetAvailable`.

      The `target.available` Topic payload: the list of everything targetable from
      the active vessel, as the active vessel knows it. Wrapper object `{
      "entries": [ ... ] }`, like `system.vessels`.

      A vessel is on the list once the active vessel has come to know of it, by
      whichever of three ways tells it soonest: it is within physics range and
      seen as it is; its radio reaches the active vessel directly, one light-time
      of that link ago; or the active vessel's command centre knows of it and has
      said so over the control route, that route's light-time ago. Each entry says
      which (`TargetListEntry.source`) and how old (`TargetListEntry.asOfUt`). A
      vessel with no route home and nothing in range keeps the list it last had:
      entries age, none is added. A vessel the active vessel has been told is gone
      leaves the list.

      Delayed like the rest of the active vessel's telemetry: a centre reads the
      list one of its own light-times after the vessel held it.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.target.available"
      event:
        $ref: "#/components/messages/event"
  time.calendar:
    address: time.calendar
    description: |-
      Carries a `TimeCalendar`.

      The `time.calendar` Topic payload: how long a minute, hour, day and year
      are, and what real-world instant UT 0 is (when the game has one), as the
      running game defines them.

      Every duration on the wire is SI seconds. To express one in days or years,
      divide by these values rather than by a constant: 21,600 seconds per day is
      right only for stock KSP on Kerbin time.

      Three things change them:

      - **Stock, no mods.** `GameSettings.KERBIN_TIME` is a setting a player can
        turn off, and KSP's own UI then reads in 24-hour days and 365-day years.
      - **A planet pack.** RSS and anything else built on Kopernicus replaces
        `KSPUtil.dateTimeFormatter`, so a day becomes 86,400 s and a year 365
        days.
      - **Anything else.** The formatter has a public setter, so a mod can put any
        calendar behind it.

      The values are read straight off `KSPUtil.dateTimeFormatter`, whose
      `Minute`, `Hour`, `Day` and `Year` are each a count of seconds: whatever the
      game uses to print its own clock is what this channel carries.

      It can change mid-session: the KERBIN_TIME setting is reachable from the
      in-game settings menu at any time.

      The whole payload is `null` when the calendar cannot be read or any of the
      four durations is missing or not positive, so a consumer never divides by
      zero. There is no days-per-year field: divide `TimeCalendar.yearSeconds` by
      `TimeCalendar.daySeconds`, which is exact.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: true-now
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.time.calendar"
      event:
        $ref: "#/components/messages/event"
  time.setPaused:
    address: time.setPaused
    description: |-
      Takes `SetPausedArgs`.

      **Not delayed.** This command takes effect immediately, because it is ground-side bookkeeping rather than a signal to a craft.

      `time.setPaused`'s arguments: whether the game is paused.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: false
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.time.setPaused"
      commandResponse:
        $ref: "#/components/messages/commandResponse.time.setPaused"
  time.setWarpIndex:
    address: time.setWarpIndex
    description: |-
      Takes `SetWarpIndexArgs`.

      **Not delayed.** This command takes effect immediately, because it is ground-side bookkeeping rather than a signal to a craft.

      `time.setWarpIndex`'s args: select a time-warp rate. This is a control of
      the simulation, not of a craft, so it is never delayed by light time.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: false
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.time.setWarpIndex"
      commandResponse:
        $ref: "#/components/messages/commandResponse.time.setWarpIndex"
  time.warp:
    address: time.warp
    description: |-
      Carries a `WarpState`.

      The `time.warp` Topic payload: the game's time-warp and pause state, as
      separate typed fields.

      Current UT is not a field here, nor on any other Topic of the wire contract:
      `meta.validAt` stamps every sample with the UT it describes, and a client
      asks what time it is with the SDK's `useViewUt`.

      Warp and pause are game-wide state, so `WarpState.meta` is stamped `Source =
      "game"`, not `"vessel:<guid>"`, and the channel emits at the Space Center
      and Tracking Station as well as in flight, with or without an active vessel.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: true-now
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.time.warp"
      event:
        $ref: "#/components/messages/event"
  vessel.attitude:
    address: vessel.attitude
    description: |-
      Carries a `VesselAttitude`.

      The `vessel.attitude` Topic payload: pitch, heading and roll of the vessel's
      control reference (`Vessel.GetTransform()`) against the local surface up and
      north, in two named frames.

      `VesselAttitude.pitch`, `VesselAttitude.heading` and `VesselAttitude.roll`
      are the primary frame, with up and north measured at `Vessel.CoM` (MechJeb's
      construction). `VesselAttitude.pitchRootFrame`,
      `VesselAttitude.headingRootFrame` and `VesselAttitude.rollRootFrame` measure
      up and north at the root part's position instead. The orientation is the
      same in both; the two differ only when the root part sits away from the
      centre of mass. Without a root part the root frame repeats the primary one.

      Absent when the vessel has no reference body. Attitude is not derivable from
      orbital elements, so it is streamed raw.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.attitude"
      event:
        $ref: "#/components/messages/event"
  vessel.comms:
    address: vessel.comms
    description: |-
      Carries a `VesselComms`.

      The `vessel.comms` Topic payload: the active vessel's own CommNet
      connection, from KSP's `vessel.connection`. The whole payload is null when
      the vessel has no CommNet connection object; there is no zero or
      disconnected placeholder reading.

      This is what the vessel itself reports. Signal delay and link modelling are
      on the `comms.*` channels (`comms.delay` for the delay), not here.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.comms"
      event:
        $ref: "#/components/messages/event"
  vessel.control:
    address: vessel.control
    description: |-
      Carries a `VesselControl`.

      The `vessel.control` Topic payload: the active vessel's control state (the
      stock toggles, SAS mode, throttle, the commanded fly-by-wire axes and the
      custom action groups). The payload is present whenever there is an active
      vessel; each field is individually nullable, and `null` means that input
      could not be read this tick (for example no flight input state, or no
      action-group data), never a default.

      Each control field that can be changed is paired with its command through
      its control channel, so the confirmed state and the command that changes it
      are one handle. The confirmed value lags a command by the round trip,
      including any comms delay.

      `VesselControl.throttle` is 0..1 nominally, but KSP does not clamp
      `Vessel.ctrlState.mainThrottle`: a throttle driven by kOS or another mod can
      read above 1. The value is passed through unclamped.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delivery: lossy-latest
    x-sitrep-delay-role: delayed
    x-sitrep-keyframe-interval-ut: 30
    messages:
      streamData:
        $ref: "#/components/messages/streamData.vessel.control"
      event:
        $ref: "#/components/messages/event"
  vessel.control.setAbort:
    address: vessel.control.setAbort
    description: |-
      Takes `SetEnabledArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      Args shared by every plain on/off actuation command (`setSas`, `setRcs`,
      `setGear`, `setBrakes`, `setLights`, `setAbort`): an absolute state to
      apply, never a toggle. Under light-time delay a toggle that arrives after
      unknown intervening changes would race them, so there are no toggle
      commands.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.control.setAbort"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.control.setAbort"
  vessel.control.setActionGroup:
    address: vessel.control.setActionGroup
    description: |-
      Takes `SetActionGroupArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      `vessel.control.setActionGroup`'s args: set a numbered custom action group
      on or off. Gear, brakes, lights and abort are not set through this: each has
      its own command (`SetEnabledArgs`).
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.control.setActionGroup"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.control.setActionGroup"
  vessel.control.setAxes:
    address: vessel.control.setAxes
    description: |-
      Takes `SetControlAxesArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      `vessel.control.setAxes`'s args: a partial update of the held fly-by-wire
      override. Every field is nullable, and only the fields you set change their
      held value, so one axis can be driven on its own without disturbing the
      others.

      Every value is -1..1 and analog: a value between the ends gives a
      proportional input (for example proportional RCS from a mapped analog
      stick). A value outside -1..1 is clamped rather than refused. The trims are
      re-applied every frame alongside the axes while the override is on, so SAS
      does not overwrite them.

      Held values only act on the vessel while the override is on (see
      `vessel.control.setFlyByWire`); values set while it is off are held and take
      effect when it is turned on. The command fails when there is no active
      vessel or the vessel cannot currently be controlled. The applied axes read
      back on `vessel.control`.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.control.setAxes"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.control.setAxes"
  vessel.control.setBrakes:
    address: vessel.control.setBrakes
    description: |-
      Takes `SetEnabledArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      Args shared by every plain on/off actuation command (`setSas`, `setRcs`,
      `setGear`, `setBrakes`, `setLights`, `setAbort`): an absolute state to
      apply, never a toggle. Under light-time delay a toggle that arrives after
      unknown intervening changes would race them, so there are no toggle
      commands.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.control.setBrakes"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.control.setBrakes"
  vessel.control.setFlyByWire:
    address: vessel.control.setFlyByWire
    description: |-
      Takes `SetFlyByWireArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      `vessel.control.setFlyByWire`'s args: turn the fly-by-wire override on or
      off. Unlike the other `vessel.control.*` commands this is not a one-shot
      actuation: KSP resets the raw control axes every physics frame, so while the
      override is on the mod re-applies the held axes and trims (set with
      `vessel.control.setAxes`) every frame.

      Turning it on resumes the held values (0 until an axis has been set).
      Turning it off stops the override and resets every held axis and trim to 0,
      so control returns to the player and SAS with nothing left over. Turning it
      on fails when there is no active vessel or the vessel cannot currently be
      controlled; turning it off is never refused for control reasons.
    servers:
      - $ref: "#/servers/mod"
    x-sitrep-delayed: true
    messages:
      commandRequest:
        $ref: "#/components/messages/commandRequest.vessel.control.setFlyByWire"
      commandResponse:
        $ref: "#/components/messages/commandResponse.vessel.control.setFlyByWire"
  vessel.control.setGear:
