    address: vessel.control.setSasMode
    description: |-
      Takes `SetSasModeArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      The contract carries no doc comment for `vessel.control.setSasMode`'s args type. Add a `<summary>` to the C# and it will appear here.
    servers:
