      commandResponse:
        $ref: "#/components/messages/commandResponse.robotics.servo.setExtension"
  robotics.servo.setLock:
    address: robotics.servo.setLock
    description: |-
      Takes `ServoSetEnabledArgs`.

      **Delayed.** This command rides the uplink: it takes effect at UT plus light-time to the craft, not when it is sent.

      Args shared by every robotics boolean actuation
      (`robotics.servo.setMotor`/`setLock` and
      `robotics.rotor.setMotor`/`setLock`): an absolute state to apply, never a
      toggle, like every other actuation command (see `SetEnabledArgs`). Keyed by
      `ServoSetEnabledArgs.partId`, the `flightID` string `parts.robotics`
      publishes.
    servers:
