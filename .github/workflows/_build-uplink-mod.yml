name: Build and publish one Uplink mod

# Reusable workflow_call: builds a single mod's GameData zip and, on the
# release channel, publishes it straight to SpaceDock. One job, build and
# SpaceDock share the freshly-built zip, no artifact round-trip needed.
#
# This is the shared per-mod pipeline behind publish-mods.yml's matrix
# (first-party monorepo). It's written so a future third-party Uplink repo
# (P7 marketplace) can call it too: `uses: ksp-gonogo/gonogo/.github/workflows/_build-uplink-mod.yml@main`
# with its own csproj/dll/gamedata inputs and `secrets: inherit` (or its own
# KSP_MANAGED_TOKEN / SPACEDOCK_* secrets): no changes needed here.
#
# version/ref/channel are computed by the CALLER, not derived here, so this
# workflow stays a pure "build+publish what I'm told" step; see
# docs/superpowers/plans/2026-07-11-mod-release-pipeline-design.md §4c.

on:
  workflow_call:
    inputs:
      id:
        description: "Mod id: used for artifact name, zip filename, log messages"
        required: true
        type: string
      csproj:
        description: "Path to the mod's .csproj"
        required: true
        type: string
      dll:
        description: "Built DLL filename to bundle"
        required: true
        type: string
      gamedata:
        description: "GameData/<gamedata>/ folder name"
        required: true
        type: string
      extra_dlls:
        description: "Space-separated DLLs to ASSERT are in the built zip (everything in bin/Release ships regardless)"
        required: false
        type: string
        default: ""
      notice:
        description: "Path to a NOTICE file to bundle, if any"
        required: false
        type: string
        default: ""
      channel:
        description: "dev or release"
        required: true
        type: string
      ref:
        description: "gonogo commit/tag to checkout and build"
        required: true
        type: string
      version:
        description: "Version string to stamp into build-info.txt and use for the zip/SpaceDock upload"
        required: true
        type: string
      spacedock_mod_id:
        description: "Resolved SpaceDock listing id (release channel only)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # fetch-depth 20 (not the default shallow 1) so the SpaceDock
          # changelog step below has real history to summarize on the
          # release channel: matches the old publish-spacedock job's
          # checkout.
          fetch-depth: 20

      # ksp-managed is a private repo of non-redistributable KSP/Unity
      # (and here, third-party mod) reference assemblies: see the
      # OUTSTANDING PREREQS block at the top of publish-mods.yml. Token
      # carries its own cross-repo Contents:read, hence `permissions:
      # contents: read` at the workflow level rather than anything broader.
      - name: Checkout KSP assemblies
        uses: actions/checkout@v5
        with:
          repository: ksp-gonogo/ksp-managed
          token: ${{ secrets.KSP_MANAGED_TOKEN }}
          path: ksp-managed

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # An Uplink vouches for its client bundle through `ExpectedClientHash.g.cs`,
      # which is a SOURCE file: the hash has to be baked before the compile below
      # or the DLL ships vouching for whatever was in the tree. The committed
      # scaffold is the opt-in, so an Uplink with no client, or one whose
      # UplinkManifest names no ExpectedClientHash, skips the whole block and
      # ships the two-way index==bytes check it already had.
      #
      # The `packages/app` test is not belt-and-braces. This workflow is written
      # to be `workflow_call`ed by a future third-party Uplink repo, and there the
      # bundle is built by the author's own `gonogo-uplink bundle`, not by an app
      # that does not exist in their checkout. Their bake belongs in their caller.
      - name: Does ${{ inputs.id }} vouch for a client bundle
        id: vouches
        run: |
          if [ -f "mod/${{ inputs.id }}/client/package.json" ] \
            && [ -f "mod/${{ inputs.id }}/ExpectedClientHash.g.cs" ] \
            && [ -f "packages/app/uplink-bundle-targets.ts" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ inputs.id }} has no ExpectedClientHash scaffold this workflow can fill; its DLL will vouch for no client bundle"
          fi

      - uses: actions/setup-node@v6
        if: steps.vouches.outputs.armed == 'true'
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v6
        if: steps.vouches.outputs.armed == 'true'
        with:
          run_install: false

      - name: Install workspace dependencies
        if: steps.vouches.outputs.armed == 'true'
        run: pnpm install --frozen-lockfile

      # Rebuilt here rather than trusted, and then held to the value the tree
      # already carries. The committed hash is what the app's own build writes
      # into the registry index, so a release whose bundle hashes differently is
      # a mod and an app that will refuse each other at load: the operator sees
      # the Uplink quarantine with "tampered or wrong URL" and nothing says the
      # release was built from a tree that was never rebaked.
      - name: Bake ${{ inputs.id }}'s client hash before the compile
        if: steps.vouches.outputs.armed == 'true'
        run: |
          set -euo pipefail
          pnpm --filter @ksp-gonogo/app bake-uplink-hash "${{ inputs.id }}"
          if ! git diff --exit-code -- "mod/${{ inputs.id }}/ExpectedClientHash.g.cs"; then
            echo "::error::${{ inputs.id }}'s client bundle hashes differently here than the committed"
            echo "ExpectedClientHash.g.cs claims. The DLL and the app that ships beside it would refuse"
            echo "each other at load. Rebake on the branch and commit:"
            echo "  pnpm --filter @ksp-gonogo/app bake-uplink-hash ${{ inputs.id }}"
            exit 1
          fi
          node scripts/client-hash-armed.mjs --require "${{ inputs.id }}"

      - name: Build ${{ inputs.dll }}
        run: |
          dotnet build "${{ inputs.csproj }}" -c Release \
            /p:KspManaged="${{ github.workspace }}/ksp-managed/KSP_Data/Managed" \
            /p:KspGameData="${{ github.workspace }}/ksp-managed/GameData"

      # Per-mod GameData/<folder>/Plugins/ tree: see
      # docs/superpowers/plans/2026-07-11-mod-release-pipeline-design.md §2.
      # `AppendTargetFrameworkToOutputPath=false` on every KSP-facing
      # csproj means the built DLL always lands directly in bin/Release/,
      # no TFM subfolder to account for.
      - name: Assemble GameData/${{ inputs.gamedata }}
        run: |
          set -euo pipefail
          csproj_dir="$(dirname "${{ inputs.csproj }}")"
          out_dir="${csproj_dir}/bin/Release"
          plugins_dir="GameData/${{ inputs.gamedata }}/Plugins"
          mkdir -p "$plugins_dir"

          if [ ! -f "$out_dir/${{ inputs.dll }}" ]; then
            echo "::error::${{ inputs.dll }} not produced at $out_dir"
            exit 1
          fi

          # Ship EVERY dll MSBuild copied into bin/Release, not a hand-written
          # subset. What lands there is precisely the runtime closure: a
          # reference-only dependency carries Private="false" (kOS, SCANsat,
          # MechJeb2, Harmony, Sitrep.Contract, the KSP/Unity set) and never
          # copies, while a dependency the assembly needs at load time does.
          #
          # The hand-written list was wrong in both directions and neither
          # showed up as a failure. Four Uplink legs passed extra_dlls: "" while
          # every one of them ProjectReferences its own <Uplink>.Contract slice,
          # which holds the command-arg DTOs its handlers are typed on: those
          # zips shipped a dll that cannot load. Core named four Sitrep dlls and
          # omitted Sitrep.Propagation.dll, which Sitrep.Host links for the
          # orbital-period solve. The live install carries all of them, because
          # the local deploy helper globs instead of listing.
          shipped=0
          for dll in "$out_dir"/*.dll; do
            [ -f "$dll" ] || continue
            cp "$dll" "$plugins_dir/"
            shipped=$((shipped + 1))
          done
          if [ "$shipped" -eq 0 ]; then
            echo "::error::no dlls found in $out_dir: the build produced nothing to ship"
            exit 1
          fi

          # extra_dlls is now an ASSERTION rather than the shipping list: name a
          # dll here and this leg fails if the build stops producing it. A glob
          # that silently narrows ships a smaller zip and reports success, so
          # the legs whose bundled set is load-bearing say so out loud.
          for extra in ${{ inputs.extra_dlls }}; do
            if [ ! -f "$plugins_dir/$extra" ]; then
              echo "::error::expected bundled dependency $extra was not produced at $out_dir"
              exit 1
            fi
          done

          # Licensing gap fix (design doc §6): ship each Uplink's
          # attribution notice inside the zip. Core has no third-party
          # notice to bundle.
          if [ -n "${{ inputs.notice }}" ]; then
            cp "${{ inputs.notice }}" "$plugins_dir/"
          fi

          # And the LICENSE beside it, when the project directory carries one.
          # Three Uplinks are GPL-3.0-only by linking a copyleft mod (Kos,
          # Scansat, MechJeb) and each keeps the full GPLv3 text next to its
          # csproj. GPLv3 requires conveying that text WITH the work, and each
          # Uplink ships as its own standalone CKAN package, so the zip is the
          # work: a NOTICE that says "the licence travels with this folder" is
          # only true if the licence is in the folder.
          #
          # Derived from the csproj path rather than added as a matrix input,
          # because a per-leg input is a second place to forget: an Uplink that
          # gains a LICENSE gets it shipped without anyone editing this file, and
          # one that has none is silently skipped, which is correct for the MIT
          # Uplinks covered by the repository-root LICENSE.
          uplink_license="$(dirname "${{ inputs.csproj }}")/LICENSE"
          if [ -f "$uplink_license" ]; then
            cp "$uplink_license" "$plugins_dir/"
            echo "bundled $uplink_license"
          fi

          {
            echo "version=${{ inputs.version }}"
            echo "git_sha=${GITHUB_SHA}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$plugins_dir/build-info.txt"

          echo "GameData/${{ inputs.gamedata }} tree:"
          find "GameData/${{ inputs.gamedata }}" -type f | sort

      - name: Zip GameData/${{ inputs.gamedata }}
        run: |
          ZIP_NAME="${{ inputs.id }}-${{ inputs.version }}.zip"
          zip -r "$ZIP_NAME" "GameData/${{ inputs.gamedata }}"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.id }}-zip
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      # Mirrors kerbcam release.yml's "Publish to SpaceDock" step: cookie-based
      # login (SpaceDock has no API tokens), multipart upload to
      # /api/mod/<id>/update. Per-mod listing id is passed in as
      # spacedock_mod_id: see OUTSTANDING PREREQS §2 in publish-mods.yml.
      # No KSP-AVC `.version` manifest exists for any gonogo mod yet (design
      # doc §2/§6 gap), so game-version is a hardcoded placeholder pending
      # that follow-up. Uses the zip just built above, no artifact download.
      - name: Publish ${{ inputs.id }} to SpaceDock
        if: ${{ inputs.channel == 'release' }}
        env:
          SPACEDOCK_USERNAME: ${{ secrets.SPACEDOCK_USERNAME }}
          SPACEDOCK_PASSWORD: ${{ secrets.SPACEDOCK_PASSWORD }}
          SPACEDOCK_MOD_ID: ${{ inputs.spacedock_mod_id }}
        run: |
          set -euo pipefail
          if [ -z "${SPACEDOCK_USERNAME:-}" ] || [ -z "${SPACEDOCK_PASSWORD:-}" ] || [ -z "${SPACEDOCK_MOD_ID:-}" ]; then
            echo "::warning::SpaceDock not configured for ${{ inputs.id }} (need secrets SPACEDOCK_USERNAME, SPACEDOCK_PASSWORD and a spacedock_mod_id input); skipping upload"
            exit 0
          fi

          ZIP="${{ env.ZIP_NAME }}"
          VERSION="${{ inputs.version }}"
          # Placeholder until a Gonogo.version / KSP-AVC manifest exists
          # (design doc §2 gap): the mod targets KSP 1.12.3 per
          # docs/superpowers/plans/2026-07-06-m5b-first-run.md.
          GAME_VERSION="1.12.3"
          git log --oneline -20 > sd-changelog.md

          login="$(curl -sS -F username="$SPACEDOCK_USERNAME" -F password="$SPACEDOCK_PASSWORD" -c ./sd-cookies https://spacedock.info/api/login)"
          if printf '%s' "$login" | grep -q '"error"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::SpaceDock login failed: $login"; exit 1
          fi
          resp="$(curl -sS -b ./sd-cookies \
            -F version="$VERSION" \
            -F "changelog=<sd-changelog.md" \
            -F game-version="$GAME_VERSION" \
            -F notify-followers=yes \
            -F zipball=@"$ZIP" \
            "https://spacedock.info/api/mod/${SPACEDOCK_MOD_ID}/update")"
          if printf '%s' "$resp" | grep -q '"error"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::SpaceDock upload failed: $resp"; exit 1
          fi
          rm -f ./sd-cookies sd-changelog.md
          echo "SpaceDock mod ${SPACEDOCK_MOD_ID} (${{ inputs.id }}) updated to ${VERSION} (KSP ${GAME_VERSION})"
