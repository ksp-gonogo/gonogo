name: Uplink page staleness

# Does every generated Uplink page still describe the code? Regenerate each one
# in memory and fail on any difference.
#
# ## The gate, now that nothing heals a page for you
#
# A page is generated here and committed with the change that moved it, the same
# as `contract.ts` and `asyncapi.yaml`. No workflow commits a page back: the
# `uplink-docs.yml` bot did, and every commit it pushed to `staging` broke a
# fast-forward for whoever was landing. So this check is the only thing between
# a stale page and the branch, and its failure message names the heal command.
#
# ## Why it is its own workflow
#
# It was a step of `ci.yml`'s `test` job until 2026-09-02, then moved out because
# the bot's asymmetric heal left runs red that nothing could turn green. That
# reason is gone with the bot, but the job is a chromium render of every Uplink,
# so it stays a separate workflow that runs in parallel with `ci.yml`.
#
# ## What it asks that nothing else can
#
# Not "did the pixels drift" (`visual`) and not "did the harness render anything"
# (`probe-render-smoke`), but "does the page still describe the Uplink the code
# actually is". That covers `README.md`, `gonogo-uplink.json` (the manifest the
# app refuses to load when stale) and the asset set. A page that quietly stops
# listing a widget reads exactly like an Uplink with fewer widgets.
#
# Asset BYTES are never compared: rasterisation is per-engine and per-OS, and a
# motion scene re-encodes to different bytes from an unchanged tree. What is
# compared is each asset's SHAPE, the rendered DOM reduced to what the CSS
# cascade computes rather than what a glyph rasteriser measures.
#
# ## Healing
#
# `pnpm uplink-pages` fixes the prose and the manifest on any machine, with no
# browser. `pnpm uplink-docs` also re-renders the pictures, and belongs on Linux.
# Commit the result with the change that moved it.

on:
  push:
    branches: [main, ci-dev, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

# Latest push on a ref wins. This reports rather than gates, so an older run's
# verdict is of no use once a newer commit exists.
concurrency:
  group: uplink-staleness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # `components` alongside ui-kit, and pnpm cannot infer it: five Uplinks
      # declare a `gonogo.renderWith` host naming a PATH into
      # packages/components/src rather than a package, so nothing in the
      # dependency graph says the harness will bundle that source. Without it the
      # generator dies with unresolved imports on exactly those five and the
      # check reports them stale for a reason that has nothing to do with their
      # pictures. `ci.yml` and `uplink-docs.yml` both carry the same filter.
      #
      # `uplink-tools` joined the filter when the render harness left ui-kit: the
      # sdk CLI resolves `@ksp-gonogo/uplink-tools` from the client being
      # documented, so an unbuilt `dist` is a module-not-found naming a path
      # inside the Uplink rather than the package that was never built.
      - name: Build
        run: pnpm --filter @ksp-gonogo/ui-kit... --filter @ksp-gonogo/components... --filter @ksp-gonogo/uplink-tools... build

      # Asking whether the committed renders are current means rendering them.
      # Chromium alone, the engine the page harness launches.
      - name: Install the browser the page harness renders in
        run: pnpm exec playwright install --with-deps chromium

      # `set -o pipefail` is load-bearing: the runner's default shell is
      # `bash -e`, which does not set it, and without it `tee` decides the step's
      # exit status and a stale page reports green.
      - name: Uplink pages are not stale
        id: check
        run: |
          set -o pipefail
          pnpm uplink-docs:check 2>&1 | tee "$RUNNER_TEMP/staleness.log"

      # The finding on the run's SUMMARY page, not only at the bottom of a log.
      # Nothing forces anyone to open a job that blocks nothing, and a signal
      # that costs a click to read is a signal that gets ignored.
      #
      # BOTH halves of the condition are load-bearing, and a run of this workflow
      # is what proved it. `failure()` alone fires on a failure in any earlier
      # step, so a broken install would print a staleness heading over a log file
      # that was never written and then go red itself for the missing file: two
      # misleading reds for one unrelated fault. The outcome test alone SKIPS,
      # because a step with no status function carries an implicit `success()`
      # and nothing after a failed step satisfies that. Written that way it was
      # skipped on the run that was checking it, and the finding never reached
      # the summary page.
      - name: Say which pages are stale, on the summary page
        if: failure() && steps.check.outcome == 'failure'
        run: |
          {
            echo "## Uplink pages no longer describe the code"
            echo
            echo '```'
            tail -40 "$RUNNER_TEMP/staleness.log"
            echo '```'
            echo
            echo "The pages are generated, so the fix is never to edit one by hand."
            echo "Regenerate and commit them with the change that moved them:"
            echo
            echo '```'
            echo "pnpm uplink-pages   # prose and manifest, any machine"
            echo "pnpm uplink-docs    # everything, pictures included, on Linux"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
