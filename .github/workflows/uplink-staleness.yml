name: Uplink page staleness

# Does every generated Uplink page still describe the code? Regenerate each one
# in memory and fail on any difference.
#
# ## Why this is its own workflow, and why it does not block
#
# It was a step of `ci.yml`'s `test` job until 2026-09-02, when four runs went
# red on it in one day (fc061fdd2, 5840d306b, 84a00db309, 69b1564b5) with
# `pnpm test` passing 46/46 on each. The pages are DERIVED and the only
# sanctioned regeneration is `uplink-docs.yml`, which runs nightly or on manual
# dispatch, so each red stayed red until a human dispatched a heal. Two of those
# four SHAs are merges of staging into staging, so the subject line does not name
# the cause; the causes were an ellipsis sweep changing kOS terminal copy, a
# ui-kit `CommandDelay` change moving a Principia GIF, and a `RECORDED` badge
# moving eight assets across two Uplinks. Every one a change worth landing. A
# gate whose only fix is a manual dispatch blocks more than it protects.
#
# What moved is WHERE the finding lands, not whether it is made. Same script,
# same build filter, same triggers as `test`, and this job still goes RED on a
# stale page: a check that exits 0 with a warning is a check nobody reads. What
# it no longer does is fail the `CI` workflow, so it no longer holds up a merge
# or the dev-channel deploy that gates on CI's conclusion.
#
# ## Why not fold it into `uplink.yml`, which already asks this
#
# `uplink.yml`'s matrix carries a per-Uplink "Pages are not stale" step on these
# same triggers, and it has never been able to report one: that job is
# `continue-on-error: true` for the extraction probe's sake, so a stale page there
# is a green leg, and the aggregate job downgrades the whole matrix to a
# `::notice::`. Green-with-a-warning is the state this file exists to leave. Its
# step stays where it is (it is per-Uplink, and it belongs to the extraction
# story); this one is the whole set, and its conclusion is unambiguous.
#
# The duplication is paid in runner time, and it is worth naming: this job repeats
# an install, the ui-kit + components build and a chromium download that the
# `test` job also does. Against that, `test` no longer renders ten Uplinks, so the
# net is roughly a wash, and the two run in parallel.
#
# ## What the check asks that nothing else can
#
# Not "did the pixels drift" (`visual`, which is red on purpose) and not "did the
# harness render anything" (`probe-render-smoke`), but "does the page still
# describe the Uplink the code actually is". A page that quietly stops listing a
# widget reads exactly like an Uplink with fewer widgets.
#
# Asset BYTES are not compared: rasterisation is per-engine and per-OS, so a byte
# comparison would fail on every machine but the one that generated it. What is
# compared is each asset's SHAPE, the rendered DOM reduced to what the CSS
# cascade computes rather than what a glyph rasteriser measures, so it is the
# same on any machine. Without it the check read the PROSE of a page whose
# content is pictures, and Vehicle Assembly's showed a layout the code had
# stopped producing for five commits with every run agreeing.
#
# `uplink-docs.yml` is the repair and stays nightly. Making it per-push was tried
# and cost four lost pushes in one evening: it commits, and a commit landing while
# a developer's pre-push hook is still running rejects that push as
# non-fast-forward. The division is deliberate: the CHECK is per-push because
# staleness should be visible immediately, the REPAIR is nightly because it writes.

on:
  push:
    branches: [main, ci-dev, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Latest push on a ref wins. This reports rather than gates, so an older run's
# verdict is of no use once a newer commit exists.
concurrency:
  group: uplink-staleness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staleness:
    runs-on: ubuntu-latest
    # TEMPORARILY DISABLED, 2026-09-05, at the operator's instruction, alongside
    # the `visual` job in ci.yml and for the same reason.
    #
    # RESTORE THIS BEFORE THE MAIN MERGE. The pages are derived and the only
    # sanctioned regeneration is `uplink-docs.yml`, so this check goes red
    # whenever a contract edit lands ahead of the nightly, heals itself, and goes
    # red again. It never blocked anything. What it cost was attention: a job
    # that is red most of the time is a job people stop reading, and the habit
    # generalises to the whole run.
    #
    # Nothing is lost while it is off that the nightly does not already fix. What
    # IS lost is the signal on a pull request, which is the reason it exists, so
    # this comes back on before anything merges to main.
    if: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        env:
          # .npmrc references ${GITHUB_TOKEN} for the @jonpepler scope
          # registry on GitHub Packages.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      # `components` alongside ui-kit, and pnpm cannot infer it: five Uplinks
      # declare a `gonogo.renderWith` host naming a PATH into
      # packages/components/src rather than a package, so nothing in the
      # dependency graph says the harness will bundle that source. Without it the
      # generator dies with unresolved imports on exactly those five and the
      # check reports them stale for a reason that has nothing to do with their
      # pictures. `ci.yml` and `uplink-docs.yml` both carry the same filter.
      - name: Build
        run: pnpm --filter @ksp-gonogo/ui-kit... --filter @ksp-gonogo/components... build

      # Asking whether the committed renders are current means rendering them.
      # Chromium alone, the engine the page harness launches.
      - name: Install the browser the page harness renders in
        run: pnpm exec playwright install --with-deps chromium

      # `set -o pipefail` is load-bearing: the runner's default shell is
      # `bash -e`, which does not set it, and without it `tee` decides the step's
      # exit status and a stale page reports green.
      - name: Uplink pages are not stale
        id: check
        run: |
          set -o pipefail
          pnpm uplink-docs:check 2>&1 | tee "$RUNNER_TEMP/staleness.log"

      # The finding on the run's SUMMARY page, not only at the bottom of a log.
      # Nothing forces anyone to open a job that blocks nothing, and a signal
      # that costs a click to read is a signal that gets ignored.
      #
      # BOTH halves of the condition are load-bearing, and a run of this workflow
      # is what proved it. `failure()` alone fires on a failure in any earlier
      # step, so a broken install would print a staleness heading over a log file
      # that was never written and then go red itself for the missing file: two
      # misleading reds for one unrelated fault. The outcome test alone SKIPS,
      # because a step with no status function carries an implicit `success()`
      # and nothing after a failed step satisfies that. Written that way it was
      # skipped on the run that was checking it, and the finding never reached
      # the summary page.
      - name: Say which pages are stale, on the summary page
        if: failure() && steps.check.outcome == 'failure'
        # `github.ref_name` is `<n>/merge` on a pull_request, which is not a ref
        # anyone can dispatch against. `head_ref` is the source branch, and is
        # empty on a push, where `ref_name` is already right. Bound through env
        # rather than interpolated into the script, so a branch name is data.
        env:
          HEAL_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          {
            echo "## Uplink pages no longer describe the code"
            echo
            echo '```'
            tail -40 "$RUNNER_TEMP/staleness.log"
            echo '```'
            echo
            echo "The pages are generated, so the fix is never to edit one by hand:"
            echo
            echo '```'
            echo "gh workflow run uplink-docs.yml --ref $HEAL_REF"
            echo '```'
            echo
            echo "This job does not block \`CI\`. Left alone, the nightly run of"
            echo "\`uplink-docs.yml\` heals these pages within a day."
          } >> "$GITHUB_STEP_SUMMARY"
