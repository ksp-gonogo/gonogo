name: Refresh promoted assets

# Re-render the PROMOTED widgets' release/docs assets (GIFs + static stills) on
# the CI runner (Linux) and commit them back to the triggering branch, so
# README / release / marketing assets never go stale. Like the visual
# baselines, these MUST be produced on Linux, OS font rasterisation differs, so
# rendering on a dev's macOS and committing would drift the fonts.
#
# This is an ASSETS job, NOT a gate: it lives in its own workflow (never in
# ci.yml), so a failure here can never block a merge.
#
# Promote a widget by adding an entry to
# `packages/components/scripts/promoted-widgets.ts`: then this runs it.
#
#   gh workflow run refresh-promoted-assets.yml --ref <branch>                    # all promoted
#   gh workflow run refresh-promoted-assets.yml --ref <branch> -f widget=landing-status
#
# It also runs automatically when a promoted widget's source (or the manifest /
# render script) changes on main. The commit-back only touches docs/assets/,
# which is NOT in the trigger paths, so it never re-triggers itself.

on:
  workflow_dispatch:
    inputs:
      widget:
        description: 'Promoted widget id to scope the refresh to (blank = all)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'packages/components/scripts/promoted-widgets.ts'
      - 'packages/components/scripts/render-promoted-assets.ts'
      - 'packages/components/scripts/synthesize-landing-descent.ts'
      - 'packages/components/src/LandingStatus/**'

# contents: write so the job can commit refreshed assets back.
# packages: read so pnpm install can pull @jonpepler/kerbcast.
permissions:
  contents: write
  packages: read

# One refresh per branch at a time; a newer push supersedes an in-flight run.
concurrency:
  group: refresh-promoted-assets-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Build render dependencies
        run: pnpm --filter "@ksp-gonogo/components..." build

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install ImageMagick (GIF assembly)
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Render promoted assets
        env:
          WIDGET: ${{ inputs.widget }}
        run: |
          if [ -n "$WIDGET" ]; then
            pnpm --filter @ksp-gonogo/components render-promoted-assets --widget "$WIDGET"
          else
            pnpm --filter @ksp-gonogo/components render-promoted-assets
          fi

      - name: Commit and push refreshed assets
        env:
          WIDGET: ${{ inputs.widget }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets
          if git diff --cached --quiet; then
            echo "No promoted-asset changes to commit."
          else
            # --no-verify: this commit only carries regenerated PNG/GIF assets.
            # The local pre-commit (biome/typecheck) and pre-push (full test)
            # hooks are irrelevant to binary assets and would only slow/flake the
            # push; CI still gates the resulting commit. (Same rationale as
            # update-baselines.yml.)
            git commit --no-verify -m "chore: refresh promoted assets (${WIDGET:-all})"
            git push --no-verify origin HEAD:${{ github.ref_name }}
          fi
