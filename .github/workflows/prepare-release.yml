name: prepare-release

# Cuts a release: analyzes conventional commits since the last v* tag to
# determine the bump (or takes an explicit bump or an exact version), moves
# every version the release carries, commits `release: vX.Y.Z`, tags, pushes,
# and dispatches release.yml on the new tag: same model as kerbcast's
# prepare-release. The version is the single release number for the whole
# deploy surface: the Pages site, all three GHCR images, the peer hello
# handshake, the mod zips, and every published package (sitrep-sdk, ui-kit,
# uplink-tools on npm, KspGonogo.Sitrep.Contract on nuget.org). It is refused
# unless it sorts above every version any of those packages has published and
# its tag is unspent (scripts/release-packages.mjs).
#
# One manual dispatch does the whole cut, run on `staging` where the work lands:
#   gh workflow run prepare-release.yml --ref staging
# (or the Actions tab: Actions -> prepare-release -> Run workflow, branch
# staging). It fast-forwards `main` to `staging`, refusing a non-fast-forward,
# commits the version bump on top, and pushes that to `main`. Dispatching any
# other ref is refused, so a release cannot be cut from a tree that is not the
# integration branch.
#
# The published surface ledgers (mod/sitrep-sdk/extension-api.ledger.json and
# packages/uplink-tools/api-surface.ledger.json) collect declared changes in a
# `pending` entry. The cut freezes both in the same commit, moves
# EXTENSION_API_VERSION by its own rule, and moves the app and every published
# package to the release version; it fails when a pending entry has an empty
# note. Run it with `-f dry_run=true` to print what would be frozen and moved
# and push nothing.
#
# The bump size states the wire-compatibility promise (see
# docs/DEPLOYMENT.md): patch = compatible/silent, minor = advisory
# mismatch banner on skewed stations, major = peer protocol broke.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto = analyze commits since last tag)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: 'An exact X.Y.Z instead of the bump, to reset the version line or name a 1.0'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Print what would be bumped and frozen; commit, tag and push nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      # Where the work actually lands. main moves only here, at a release.
      INTEGRATION_BRANCH: staging
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The release is `staging`'s tree moved onto main. Pushing it is a
      # fast-forward only when main has nothing staging lacks; a main that
      # diverged (a hotfix, or a release commit not yet returned to staging)
      # must be reconciled by hand rather than overwritten.
      - name: Run on the integration branch, and main must fast-forward to it
        run: |
          if [ "${GITHUB_REF_NAME}" != "${INTEGRATION_BRANCH}" ]; then
            echo "::error::dispatch this on ${INTEGRATION_BRANCH}, not ${GITHUB_REF_NAME}: gh workflow run prepare-release.yml --ref ${INTEGRATION_BRANCH}"
            exit 1
          fi
          git fetch --no-tags origin main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "main is an ancestor of ${INTEGRATION_BRANCH}: the push below is a fast-forward."
            exit 0
          fi
          AHEAD="$(git rev-list --count HEAD..FETCH_HEAD)"
          echo "::error::main has ${AHEAD} commit(s) that ${INTEGRATION_BRANCH} lacks, so it cannot be fast-forwarded. Merge main into ${INTEGRATION_BRANCH} and land that first."
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Refused unless the version sorts above everything any published package
      # has on npm or nuget.org and its v* tag is unspent. `auto` reads the
      # conventional commits since the last v* tag: a break moves the major, a
      # feature the minor, anything else the patch, and an empty range fails.
      - name: Work out the release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_VERSION" ]; then
            CHOICE=(--version "$RELEASE_VERSION")
          else
            CHOICE=(--bump "$BUMP")
          fi
          node scripts/release-packages.mjs plan "${CHOICE[@]}" > "$RUNNER_TEMP/plan.json"
          NEW="$(node -p 'require(process.argv[1]).release' "$RUNNER_TEMP/plan.json")"
          echo "Releasing ${NEW}"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: ${{ !inputs.dry_run }}
        with:
          run_install: false

      # The freeze reads the surface the packages emit, so it needs their dist.
      - name: Install and build
        if: ${{ !inputs.dry_run }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Freeze the published surface ledgers and move every version
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then FLAGS="--dry-run"; fi
          node scripts/freeze-published-surface.mjs --release "${{ steps.version.outputs.new }}" --note "Release ${{ steps.version.outputs.tag }}" $FLAGS

      # Every committed gonogo-uplink.json states the sdk version that wrote it,
      # and the extension API version it was built against. The freeze has just
      # moved the first and may have moved the second, so the pages are written
      # again on every release: the app refuses a stale manifest, and the
      # staleness check would fail the release commit over one.
      - name: Regenerate the Uplink pages for the versions the freeze moved
        if: ${{ !inputs.dry_run }}
        run: pnpm uplink-pages

      - name: Show what the cut changes
        run: git status --short

      - name: Commit, tag, push
        if: ${{ !inputs.dry_run }}
        run: |
          NEW="${{ steps.version.outputs.new }}"
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "release: v${NEW}"
          git tag "${TAG}"
          git push origin HEAD:main "${TAG}"

      # Without this the release commit exists only on `main`, and `main` can
      # never be fast-forwarded from the integration branch again: it carries a
      # commit that branch lacks, so the next release's guard refuses.
      # Fail-soft, the release itself is already done and the branch may have
      # moved while this ran.
      - name: Return the release commit to the integration branch
        if: ${{ !inputs.dry_run }}
        run: |
          if git push origin "HEAD:${INTEGRATION_BRANCH}"; then
            echo "Release commit is on ${INTEGRATION_BRANCH} too."
          else
            echo "::warning::could not fast-forward ${INTEGRATION_BRANCH} onto the release commit, it has probably moved. Merge main into ${INTEGRATION_BRANCH} by hand, otherwise the next release is refused."
          fi

      # ci-dev-forward.yml fast-forwards staging to a validated ci-dev commit and
      # refuses when staging has a commit ci-dev lacks. So the release commit
      # must reach ci-dev as well, or the next forward is refused. ci-dev is
      # fast-forwarded when it is an ancestor of the release commit; when it holds
      # work staging has not received yet, the release commit is merged into it
      # instead, so ci-dev still contains every commit on staging and the next
      # forward stays a fast-forward. Nothing is forced, and either way ci-dev
      # ends as a descendant of staging. Fail-soft for the same reason as above.
      - name: Keep ci-dev a superset of the integration branch
        if: ${{ !inputs.dry_run }}
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin ci-dev
          if git merge-base --is-ancestor FETCH_HEAD "$RELEASE_SHA"; then
            git push origin "$RELEASE_SHA:refs/heads/ci-dev" && echo "ci-dev fast-forwarded to the release commit."
          else
            git checkout -q -B ci-dev-merge FETCH_HEAD
            if git merge --no-edit -m "Merge release commit into ci-dev" "$RELEASE_SHA"; then
              git push origin HEAD:refs/heads/ci-dev && echo "release commit merged into ci-dev."
            else
              git merge --abort || true
              echo "::warning::could not merge the release commit into ci-dev. Merge it by hand, otherwise ci-dev-forward.yml refuses to forward."
            fi
          fi

      - name: Trigger release workflow
        if: ${{ !inputs.dry_run }}
        # GITHUB_TOKEN pushes don't fire push-tag triggers in other
        # workflows. workflow_dispatch does, so dispatch release.yml on
        # the new tag explicitly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.version.outputs.tag }}"
