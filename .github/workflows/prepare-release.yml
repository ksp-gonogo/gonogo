name: prepare-release

# Cuts a release: analyzes conventional commits since the last v* tag to
# determine the bump (or takes an explicit override), bumps
# packages/app/package.json, commits `release: vX.Y.Z`, tags, pushes, and
# dispatches release.yml on the new tag: same model as kerbcast's
# prepare-release. The version is the single release number for the whole
# deploy surface: the Pages site, all three GHCR images, and the peer
# hello handshake.
#
# Work lands on `staging` and only `main` deploys, so a release is two steps:
#   git push origin origin/staging:main
#   gh workflow run prepare-release.yml --ref main
# (or the Actions tab: Actions -> prepare-release -> Run workflow). The first
# step is not optional and not a convention: the guard below fails the run when
# the dispatched ref is behind the integration branch.
#
# The bump size states the wire-compatibility promise (see
# docs/DEPLOYMENT.md): patch = compatible/silent, minor = advisory
# mismatch banner on skewed stations, major = peer protocol broke.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (auto = analyze commits since last tag)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      # Where the work actually lands. Everything that deploys gates on `main`,
      # but nothing develops there, so the two have to be reconciled before a
      # release means anything.
      INTEGRATION_BRANCH: staging
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A release cut from a `main` that has not been fast-forwarded ships the
      # tree main happens to be sitting on and says nothing about it: the run is
      # green, the tag is real, and none of the work anyone wanted is in it.
      # Refuse that outright rather than leaving it to whoever reads the docs.
      - name: The release ref must carry the integration branch
        run: |
          git fetch --no-tags origin "$INTEGRATION_BRANCH"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "${GITHUB_REF_NAME} carries every commit on ${INTEGRATION_BRANCH}."
            exit 0
          fi
          BEHIND="$(git rev-list --count HEAD..FETCH_HEAD)"
          echo "::error::${GITHUB_REF_NAME} is missing ${BEHIND} commit(s) that are on ${INTEGRATION_BRANCH}, so a release cut here would ship none of them. Fast-forward first: git push origin origin/${INTEGRATION_BRANCH}:main"
          exit 1

      - name: Determine bump level
        id: bump
        run: |
          BUMP="${{ inputs.bump }}"

          if [ "$BUMP" = "auto" ]; then
            LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -n "$LAST_TAG" ]; then
              LOG="$(git log "${LAST_TAG}..HEAD" --format='%s%n%b')"
            else
              LOG="$(git log --format='%s%n%b')"
            fi

            echo "Commits since ${LAST_TAG:-the beginning}:"
            echo "$LOG"

            # An empty range means the last tag is this exact tree. `auto` would
            # read no commits, fall through to `patch`, and cut a second release
            # of an already-released tree.
            if [ -z "$(echo "$LOG" | tr -d '[:space:]')" ]; then
              echo "::error::no commits since ${LAST_TAG}: this tree is already released. Nothing to cut."
              exit 1
            fi

            # BREAKING CHANGE in body, or ! after type/scope -> major
            # feat -> minor, everything else -> patch
            if echo "$LOG" | grep -qE '(^BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:)'; then
              BUMP=major
            elif echo "$LOG" | grep -qE '^feat(\([^)]+\))?:'; then
              BUMP=minor
            else
              BUMP=patch
            fi
          fi

          echo "Bump level: $BUMP"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump packages/app/package.json
        id: version
        run: |
          NEW="$(node -e "
            const fs = require('fs');
            const path = 'packages/app/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            const [maj, min, pat] = pkg.version.split('.').map(Number);
            const bump = '${{ steps.bump.outputs.bump }}';
            const next =
              bump === 'major' ? [maj + 1, 0, 0] :
              bump === 'minor' ? [maj, min + 1, 0] :
                                 [maj, min, pat + 1];
            pkg.version = next.join('.');
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log(pkg.version);
          ")"
          echo "Releasing ${NEW}"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, push
        run: |
          NEW="${{ steps.version.outputs.new }}"
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/app/package.json
          git commit -m "release: v${NEW}"
          git tag "${TAG}"
          git push origin HEAD:main "${TAG}"

      # Without this the release commit exists only on `main`, and `main` can
      # never be fast-forwarded from the integration branch again: it carries a
      # commit that branch lacks, so the next release's first step is rejected.
      # Fail-soft, the release itself is already done and the branch may have
      # moved while this ran.
      - name: Return the release commit to the integration branch
        run: |
          if git push origin "HEAD:${INTEGRATION_BRANCH}"; then
            echo "Release commit is on ${INTEGRATION_BRANCH} too."
          else
            echo "::warning::could not fast-forward ${INTEGRATION_BRANCH} onto the release commit, it has probably moved. Merge main into ${INTEGRATION_BRANCH} by hand, otherwise the next 'git push origin origin/${INTEGRATION_BRANCH}:main' is rejected."
          fi

      - name: Trigger release workflow
        # GITHUB_TOKEN pushes don't fire push-tag triggers in other
        # workflows. workflow_dispatch does, so dispatch release.yml on
        # the new tag explicitly.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.version.outputs.tag }}"
