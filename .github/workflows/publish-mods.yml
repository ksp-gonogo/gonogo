name: Publish mod zips

# WHAT BOUNDS THIS MATRIX: an Uplink gets a leg here when it declares a CKAN
# identity (its own .netkan) AND its plugin assembly compiles against the
# reference set vendored in ksp-gonogo/ksp-managed. Seven Uplinks carry a
# .netkan; six of them compile, so six have legs, alongside Gonogo core.
#
# The seventh is GonogoMechJebUplink. MechJeb2.dll is not in ksp-managed and the
# Uplink binds MuMech types at compile time (MechJebController.cs,
# MechJebUplink.Ksp.cs), so it cannot be built or published here. It is exempt in
# scripts/uplink-mod-build.sh for the same reason, and that exemption expires by
# itself the moment the dll lands.
#
# Compile-time binding is not what makes it the odd one out: GonogoScansatUplink
# names SCANUtil/SCANcontroller/SCANexperiment and GonogoKosUplink names
# kOS.Module/kOS.Safe.Screen/kOS.UserIO, and both of those mod dlls ARE vendored
# in ksp-managed, which is why both have legs here. Vendoring MechJeb2.dll is the
# same one-file operation done a third time, and it is the resolution this leg
# waits on. Evidence: local_docs/design/mechjeb-provider-and-vendoring.md.
#
# The Uplinks with no .netkan (Avionics, Kerbalism, Rp1, TestFlight) are not
# omitted for a build reason: all four compile. They have declared no CKAN
# identity yet, so there is nothing to publish them AS. Give one a .netkan and
# it earns a leg here.
#
# OUTSTANDING PREREQ: SpaceDock publish needs a repo VARIABLE per mod that does
# not exist yet (vars.SPACEDOCK_MOD_ID_*, one per matrix entry below). Until
# each is set, that mod's SpaceDock upload step no-ops with a `::warning::`
# (same pattern as kerbcam's release.yml) rather than failing the run.
#
# Two publish channels, mirroring publish-images.yml:
#
#   dev      every CI-green push to main (workflow_run). Builds each mod's
#            GameData zip and upload-artifacts it: this validates the
#            packaging pipeline on every push. No GitHub Release attach,
#            no SpaceDock.
#   release  dispatched by release.yml on a v* tag, with channel=release.
#            Builds each mod zip, attaches it to the GitHub Release
#            release.yml already created (`gh release upload`), AND
#            publishes each mod to SpaceDock. The manual
#            `prepare-release.yml` dispatch is the sole user gate (same
#            as the app release), there is no separate SpaceDock approval.
#
# Secrets required:
#   KSP_MANAGED_TOKEN: fine-grained PAT (Contents: read) for
#                        ksp-gonogo/ksp-managed, org-level.
#   SPACEDOCK_USERNAME / SPACEDOCK_PASSWORD: org-level; SpaceDock has no
#                        API tokens, auth is cookie-based (see
#                        _build-uplink-mod.yml's "Publish to SpaceDock" step).
#
# The per-mod build→package→SpaceDock logic lives in the reusable
# `_build-uplink-mod.yml` (workflow_call) so a future third-party Uplink
# repo (P7 marketplace) can call the exact same pipeline for its own mod
# instead of us re-implementing it per repo. This file is just the
# first-party matrix caller plus the cross-mod GitHub-Release aggregator.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Publish channel"
        required: false
        default: dev
        type: choice
        options:
          - dev
          - release

permissions:
  contents: read

concurrency:
  group: publish-mods-${{ inputs.channel || 'dev' }}
  cancel-in-progress: false

env:
  # workflow_run events have no inputs, they're always the dev channel.
  CHANNEL: ${{ inputs.channel || 'dev' }}

jobs:
  # Computed once and fanned out to every matrix leg below, rather than
  # each leg re-deriving it: the reusable workflow takes version as an
  # input instead of computing it itself.
  version:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Compute version string
        id: version
        run: |
          if [ "$CHANNEL" = "dev" ]; then
            SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "value=dev-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  build-mod:
    needs: version
    # Only build when CI passed. workflow_dispatch skips the check.
    # (Redundant with `needs: version` skip-propagation, kept explicit for
    # parity with the pre-refactor condition.)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: Gonogo
            csproj: mod/Gonogo.KSP/Gonogo.KSP.csproj
            dll: Gonogo.dll
            gamedata: Gonogo
            extra_dlls: "Sitrep.Host.dll Sitrep.Contract.dll Sitrep.Transport.dll Sitrep.Core.dll Sitrep.Propagation.dll"
            notice: ""
            mod_id_var: SPACEDOCK_MOD_ID_GONOGO
          - id: GonogoScansatUplink
            csproj: mod/GonogoScansatUplink/GonogoScansatUplink.csproj
            dll: GonogoScansatUplink.dll
            gamedata: GonogoScansatUplink
            extra_dlls: "GonogoScansatUplink.Contract.dll"
            notice: mod/GonogoScansatUplink/NOTICE-SCANSAT.txt
            mod_id_var: SPACEDOCK_MOD_ID_GONOGOSCANSATUPLINK
          - id: GonogoRealAntennasUplink
            csproj: mod/GonogoRealAntennasUplink/GonogoRealAntennasUplink.csproj
            dll: GonogoRealAntennasUplink.dll
            gamedata: GonogoRealAntennasUplink
            extra_dlls: "GonogoRealAntennasUplink.Contract.dll"
            notice: mod/GonogoRealAntennasUplink/NOTICE-REALANTENNAS.txt
            mod_id_var: SPACEDOCK_MOD_ID_GONOGOREALANTENNASUPLINK
          - id: GonogoKerbcastUplink
            csproj: mod/GonogoKerbcastUplink/GonogoKerbcastUplink.csproj
            dll: GonogoKerbcastUplink.dll
            gamedata: GonogoKerbcastUplink
            extra_dlls: "GonogoKerbcastUplink.Contract.dll"
            notice: mod/GonogoKerbcastUplink/NOTICE-KERBCAST.txt
            mod_id_var: SPACEDOCK_MOD_ID_GONOGOKERBCASTUPLINK
          - id: GonogoKosUplink
            csproj: mod/GonogoKosUplink/GonogoKosUplink.csproj
            dll: GonogoKosUplink.dll
            gamedata: GonogoKosUplink
            extra_dlls: "GonogoKosUplink.Contract.dll"
            notice: mod/GonogoKosUplink/NOTICE-KOS.txt
            mod_id_var: SPACEDOCK_MOD_ID_GONOGOKOSUPLINK
          - id: GonogoPrincipiaUplink
            csproj: mod/GonogoPrincipiaUplink/GonogoPrincipiaUplink.csproj
            dll: GonogoPrincipiaUplink.dll
            gamedata: GonogoPrincipiaUplink
            extra_dlls: "GonogoPrincipiaUplink.Contract.dll"
            notice: mod/GonogoPrincipiaUplink/NOTICE-PRINCIPIA.txt
            mod_id_var: SPACEDOCK_MOD_ID_GONOGOPRINCIPIAUPLINK
          - id: GonogoActionGroupsExtendedUplink
            csproj: mod/GonogoActionGroupsExtendedUplink/GonogoActionGroupsExtendedUplink.csproj
            dll: GonogoActionGroupsExtendedUplink.dll
            gamedata: GonogoActionGroupsExtendedUplink
            # No .Contract slice: this Uplink carries no command-arg DTOs, it
            # elects a backend and publishes through Sitrep.Contract's own types.
            extra_dlls: ""
            notice: mod/GonogoActionGroupsExtendedUplink/NOTICE-AGEXT.txt
            mod_id_var: SPACEDOCK_MOD_ID_GONOGOACTIONGROUPSEXTENDEDUPLINK
    uses: ./.github/workflows/_build-uplink-mod.yml
    with:
      id: ${{ matrix.id }}
      csproj: ${{ matrix.csproj }}
      dll: ${{ matrix.dll }}
      gamedata: ${{ matrix.gamedata }}
      extra_dlls: ${{ matrix.extra_dlls }}
      notice: ${{ matrix.notice }}
      channel: ${{ inputs.channel || 'dev' }}
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      version: ${{ needs.version.outputs.value }}
      spacedock_mod_id: ${{ vars[matrix.mod_id_var] }}
    secrets: inherit

  # Attaches every mod zip to the GitHub Release release.yml already
  # created for this tag. Needs its own contents:write, the workflow-level
  # default stays contents:read since only this job writes anything. This
  # is the first-party-monorepo-specific aggregation step, it stays here
  # rather than in the reusable per-Uplink workflow.
  attach-to-release:
    needs: build-mod
    if: ${{ inputs.channel == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download mod zips
        uses: actions/download-artifact@v4
        with:
          path: mod-zips
          pattern: "*-zip"

      - name: Attach mod zips to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" mod-zips/*/*.zip \
            --repo "${{ github.repository }}" \
            --clobber
