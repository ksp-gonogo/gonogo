name: Deploy to GitHub Pages

# Channel model: the Pages site carries BOTH channels in one artifact.
#
#   /gonogo/        the latest RELEASE build: downloaded from the newest
#                   GitHub Release's site asset (uploaded by release.yml).
#                   End users and the README only ever see this.
#   /gonogo/rc/     the release-candidate channel: rebuilt from the ref it is
#                   given, version-suffixed `-rc.<shortsha>` so stations and
#                   the hello handshake identify it.
#
# Until the first GitHub Release exists, the RC build is served at the root
# too, which matches the pre-channel behaviour.
#
# Nothing triggers this on a push. rc.yml calls it for the nightly and on-demand
# RC, and release.yml dispatches it right after uploading a new site asset, so a
# release re-composes the root without waiting for the next RC.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build the RC from (default: the calling ref)"
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - id: sha
        run: |
          SHA="${{ inputs.ref || github.sha }}"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Confirm Axiom token presence
        env:
          VITE_AXIOM_TOKEN: ${{ secrets.VITE_AXIOM_TOKEN }}
        # Length only: never the value. GitHub masks the secret in logs
        # but the workflow run UI doesn't tell you whether a referenced
        # secret actually had a value, so this gives us an explicit
        # success/skip signal per deploy.
        run: |
          if [ -n "$VITE_AXIOM_TOKEN" ]; then
            echo "Axiom token present (len=${#VITE_AXIOM_TOKEN}): remote logging enabled."
          else
            echo "Axiom token MISSING: remote logging disabled for this deploy."
          fi

      - name: Build RC-channel app
        run: pnpm turbo build --filter=@ksp-gonogo/app...
        env:
          VITE_BASE_PATH: /gonogo/rc/
          GONOGO_VERSION_SUFFIX: -rc.${{ steps.sha.outputs.short }}
          # Axiom ingest. If the secret isn't set the logger silently
          # skips installing the Axiom transport, so dropping the secret
          # is a clean way to disable remote logging.
          VITE_AXIOM_TOKEN: ${{ secrets.VITE_AXIOM_TOKEN }}

      - name: Fetch latest release site
        id: prod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prod-site
          if gh release download --repo "${{ github.repository }}" \
               --pattern gonogo-site.tar.gz --dir . 2>/dev/null; then
            tar -xzf gonogo-site.tar.gz -C prod-site
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Root will serve the latest release site asset."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No release site asset yet: RC build will serve the root too."
          fi

      - name: Compose site (release at /, RC at /rc/)
        run: |
          mkdir -p site site/rc
          cp -R packages/app/dist/. site/rc/
          if [ "${{ steps.prod.outputs.found }}" = "true" ]; then
            cp -R prod-site/. site/
          else
            # Bootstrap: no release exists yet, so the RC channel serves
            # the root as well. The /rc/ copy above was built with base
            # /gonogo/rc/; the root needs its own base.
            VITE_BASE_PATH=/gonogo/ \
            GONOGO_VERSION_SUFFIX="-rc.${{ steps.sha.outputs.short }}" \
            VITE_AXIOM_TOKEN="${{ secrets.VITE_AXIOM_TOKEN }}" \
              pnpm --filter @ksp-gonogo/app build
            cp -R packages/app/dist/. site/
          fi
          # Pages only serves the ROOT 404.html as the SPA fallback, and
          # after composition that's the release build: a deep link to
          # /gonogo/rc/station would boot the wrong app. Materialise the
          # RC SPA's routes as real files instead.
          mkdir -p site/rc/station
          cp site/rc/index.html site/rc/station/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
