name: Uplink pages

# Regenerate every Uplink's page on a push to main and commit the result back.
#
# The pages are DERIVED: from each Uplink's registrations, its generated contract
# slice, its renders, and the one `uplink.md` an author writes. Nothing about them
# is a decision, so nothing about them should need a human to remember. A widget
# gaining a channel, a contract field gaining a unit, a fixture being renamed:
# each of those changes the page, and each of them lands in a commit whose author
# was thinking about something else.
#
# ## Why this and the PR check both exist
#
# `ci.yml`'s "Uplink pages are not stale" step fails a pull request whose pages
# have moved, and it is not made redundant by this. A workflow that silently
# fixes main means nobody ever sees a generator that has quietly stopped emitting
# a section: the page would keep being "current" against a generator that no
# longer produces the wire table, and every run would agree. The PR check is
# where a person looks; this is what keeps main from carrying a page it could
# have fixed itself.
#
# ## Why this cannot loop
#
# It commits with GITHUB_TOKEN, and a push made with that token does NOT trigger
# workflow runs. So the commit this makes does not start another run of this
# workflow, and there is no loop to guard against with an actor check or a
# `[skip ci]` marker. That is the same property `update-baselines.yml` relies on,
# and the same one that made `ci.yml` grow a `workflow_dispatch` so a regenerated
# tip could be given a CI run by hand.
#
# ## Renders are committed, and the pictures a GitHub page loads depend on it
#
# `renders/` is gitignored (review output, regenerated on demand) and
# `docs/assets/` is NOT, because the generated page references that path and a
# gitignored image is an image GitHub renders as a broken icon. The same class of
# mistake has bitten this project three times in a day (`artifacts/`, `dist/`,
# `bin/`), always silently, always only visible from a run.
#
# ## Why the whole set every time
#
# Cheaper to reason about than a paths filter, and correct where a filter is
# subtly wrong: an edit to `packages/ui-kit`'s generator changes all ten pages, an
# edit to a widget changes one, and a `paths:` list that tried to express that
# would be a hand-kept map of which file affects which page. Ten legs of the
# matrix render in parallel, so the wall time is one leg either way.

# `staging` as well as `main`, because `staging` is where the work lands. This
# read `[main]` alone while every branch in the repo merged to `staging`, so the
# self-heal below did not run once for the whole time development sat there, and
# the pull-request check kept passing because it compares the PROSE. Five commits
# of Vehicle Assembly's page showed a layout the code had stopped producing.
on:
  push:
    branches: [main, staging]
  # By hand, for any ref: useful after a generator change lands on a branch, and
  # necessary because a GITHUB_TOKEN push gives no run of its own.
  workflow_dispatch:

# contents: write so the job can commit the regenerated pages back.
# packages: read so pnpm install can pull @jonpepler/kerbcast.
permissions:
  contents: write
  packages: read

# One run at a time on a ref, and the later one wins. Two concurrent runs would
# both regenerate and both try to push, and the loser's push is rejected as
# non-fast-forward after paying for ten browser renders.
concurrency:
  group: uplink-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      # `...` pulls the dependency graph so the pages are generated against a
      # freshly built ui-kit dist rather than whatever a cache happened to hold.
      # ui-kit is a direct dependency of every Uplink client, so its generator
      # comes along with them.
      - name: Build
        run: pnpm --filter @ksp-gonogo/ui-kit... build

      # Chromium alone: the page harness launches nothing else, and the renders
      # embedded in a page are whatever THIS engine produced. That is also why
      # the images are generated here rather than accepted from a contributor's
      # machine, the same reason the visual baselines are Linux-only.
      - name: Install the browser the page harness renders in
        run: pnpm exec playwright install --with-deps chromium

      # The same script `ci.yml` runs with `--check`, so what heals main and what
      # fails a pull request cannot disagree about which Uplinks they cover. It
      # refuses rather than exiting clean when discovery hands it nothing, since a
      # run that regenerates nothing commits nothing and reports success.
      - name: Regenerate every Uplink page
        run: pnpm uplink-docs

      # The existence gate, AFTER generating, asking whether the run actually
      # left a page behind. Not the same question as the step above: that one
      # fails when the CLI errors (an Uplink with no `uplink.md`, the one part of
      # a page a generator cannot write and this job cannot heal), and this one
      # fails when it exited 0 having written nothing.
      - name: Every Uplink has a generated page
        run: node scripts/uplink-docs-gate.mjs

      - name: Commit and push the pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The pages and the images they reference, and nothing else: a
          # regenerate must never carry along an unrelated file the build wrote.
          git add 'mod/*/client/README.md' 'mod/*/client/gonogo-uplink.json'

          # Assets by NAME, never by bytes, which is the same policy
          # `docs --check` applies and for a sharper reason here. A PNG re-renders
          # byte-identically on the same runner, but a motion scene's GIF does
          # NOT: measured on `jogwheel-rate-mode--default.gif`, three
          # regenerations in a row produced three different files from an
          # unchanged tree. Staging byte changes would therefore commit a churn
          # GIF on every single push to main, forever, and a commit that always
          # appears is a commit nobody reads.
          #
          # So an asset ADDED (a new fixture) or DELETED (a fixture removed) is
          # real drift and is committed; an asset whose bytes merely moved is
          # discarded. `git status --porcelain` gives `??` for untracked and `D`
          # for deleted once `read` has eaten the leading status column's space.
          #
          # The pathspec ends `/*` and that is load-bearing. A git pathspec
          # containing a wildcard is matched as a PATTERN against whole paths
          # rather than resolved as a directory prefix, so
          # `mod/*/client/docs/assets` matches the directory and none of the files
          # in it: it reported zero changes against a tree with a modified GIF in
          # it, which would have made this whole block a no-op nobody could see.
          git status --porcelain -- 'mod/*/client/docs/assets/*' |
            while read -r code path; do
              case "$code" in
                '??' | 'D') git add -A -- "$path" ;;
                *) git checkout -- "$path" ;;
              esac
            done

          if git diff --cached --quiet; then
            echo "Every Uplink page already describes the code. Nothing to commit."
          else
            git diff --cached --name-status
            # --no-verify: this commit carries only generated pages and their
            # renders. The local pre-commit (biome/typecheck) and pre-push (full
            # pnpm test) hooks are for authored code, and the pre-push suite has
            # been flaky enough to block a generated push outright. CI re-runs on
            # the resulting commit through the workflow_dispatch above.
            git commit --no-verify -m "chore: regenerate Uplink pages"
            # Rebase once and retry, because `staging` receives merges while this
            # runs and a losing push is rejected as non-fast-forward. The
            # concurrency group above stops two runs of THIS workflow racing; it
            # says nothing about somebody else pushing in the ninety seconds
            # between checkout and push. Going red for that would be a red run
            # with nothing wrong in it, and a job that cries wolf is a job whose
            # output nobody reads.
            git push --no-verify origin HEAD:${{ github.ref_name }} || {
              git pull --rebase --no-verify origin ${{ github.ref_name }}
              git push --no-verify origin HEAD:${{ github.ref_name }}
            }
          fi
