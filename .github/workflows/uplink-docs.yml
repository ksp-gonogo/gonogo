name: Uplink pages

# Regenerate every Uplink's page on a push, and commit the result back.
#
# The pages are DERIVED: from each Uplink's registrations, its generated contract
# slice, its renders, and the one `uplink.md` an author writes. Nothing about them
# is a decision, so nothing about them should need a human to remember. A widget
# gaining a channel, a contract field gaining a unit, a fixture being renamed:
# each of those changes the page, and each of them lands in a commit whose author
# was thinking about something else.
#
# ## Why this and the check both exist
#
# `uplink-staleness.yml` fails on a branch or a pull request whose pages have
# moved, and it is not made redundant by this. A workflow that silently fixes a
# branch means nobody ever sees a generator that has quietly stopped emitting a
# section: the page would keep being "current" against a generator that no longer
# produces the wire table, and every run would agree. The check is where a person
# looks; this is what keeps the branch from carrying a page it could have fixed
# itself.
#
# ## Why this cannot loop
#
# It commits with GITHUB_TOKEN, and a push made with that token does NOT trigger
# workflow runs. So the commit this makes does not start another run of this
# workflow, and there is no loop to guard against with an actor check or a
# `[skip ci]` marker. That is the same property `update-baselines.yml` relies on,
# and the same one that made `ci.yml` grow a `workflow_dispatch` so a regenerated
# tip could be given a CI run by hand.
#
# ## Renders are committed, and the pictures a GitHub page loads depend on it
#
# `renders/` is gitignored (review output, regenerated on demand) and
# `docs/assets/` is NOT, because the generated page references that path and a
# gitignored image is an image GitHub renders as a broken icon. The same class of
# mistake has bitten this project three times in a day (`artifacts/`, `dist/`,
# `bin/`), always silently, always only visible from a run.
#
# ## Why the whole set every time
#
# Cheaper to reason about than a paths filter, and correct where a filter is
# subtly wrong: an edit to `packages/ui-kit`'s generator changes all ten pages, an
# edit to a widget changes one, and a `paths:` list that tried to express that
# would be a hand-kept map of which file affects which page. Ten legs of the
# matrix render in parallel, so the wall time is one leg either way.

# PER-PUSH ON `staging`, with the nightly kept as a floor, so a stale page is
# repaired by the run that made it stale instead of sitting stale for up to a day.
#
# THE COST OF PER-PUSH IS MEASURED, not hypothetical, so nobody has to rediscover
# it: this job COMMITS regenerated pages back to the branch, and a commit landing
# while a developer's pre-push hook is still running (that hook is the full suite,
# minutes long) rejects that push as non-fast-forward and the hook runs again on
# the merge. Four pushes were lost that way in one evening, which is what moved
# this to nightly-only for a while. The nightly alone traded that race for pages
# that could be stale all day, and since 2026-09-02 `uplink-staleness.yml` reports
# rather than blocks, so nothing forces anyone to act on the red in between.
#
# The division stands either way: the CHECK is per-push because staleness should
# be visible immediately, the REPAIR writes and so is the half that has to be
# scheduled around people.
#
# The history: this read `[main]` alone while every branch merged to `staging`,
# so the self-heal did not run once for the whole time development sat there,
# and the pull-request check kept passing because it compared only the PROSE.
# Five commits of Vehicle Assembly's page showed a layout the code had stopped
# producing.
on:
  # On every push to the integration branch, so a stale page is repaired by the
  # run that made it stale rather than waiting for the night. A GITHUB_TOKEN
  # push triggers no workflow, so committing back cannot loop.
  push:
    branches: [staging]
  schedule:
    # 03:00 UTC, well clear of a working day in either direction.
    - cron: "0 3 * * *"
  # By hand, for any ref: useful after a generator change lands on a branch,
  # necessary because a GITHUB_TOKEN push gives no run of its own, and now also
  # the way to heal a page without waiting for the night.
  workflow_dispatch:

# contents: write so the job can commit the regenerated pages back.
# packages: read so pnpm install can pull @jonpepler/kerbcast.
permissions:
  contents: write
  packages: read

# One run at a time on a ref, and the later one wins. Two concurrent runs would
# both regenerate and both try to push, and the loser's push is rejected as
# non-fast-forward after paying for ten browser renders.
concurrency:
  group: uplink-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      # `...` pulls the dependency graph so the pages are generated against a
      # freshly built ui-kit dist rather than whatever a cache happened to hold.
      # ui-kit is a direct dependency of every Uplink client, so its generator
      # comes along with them.
      #
      # `components` is the other half and pnpm cannot infer it. Five Uplinks
      # declare a `gonogo.renderWith` host, and every one of them names a PATH
      # into packages/components/src rather than a package, so nothing in the
      # dependency graph says the harness will bundle that source. Without this
      # filter its imports of core and ui resolve against no dist and the
      # generator dies with 109 unresolved-import errors on exactly those five.
      #
      # `uplink.yml` learned this on 2026-08-31 and grew a RENDER_HOSTS loop for
      # it. This workflow did not, because it was pinned to `branches: [main]`
      # and had never once run: a dead job cannot report that the fix its
      # sibling just took also applies to it.
      #
      # `uplink-tools` joined the filter when the render harness left ui-kit: the
      # sdk CLI resolves `@ksp-gonogo/uplink-tools` from the client being
      # documented, so an unbuilt `dist` is a module-not-found naming a path
      # inside the Uplink rather than the package that was never built.
      - name: Build
        run: pnpm --filter @ksp-gonogo/ui-kit... --filter @ksp-gonogo/components... --filter @ksp-gonogo/uplink-tools... build

      # Chromium alone: the page harness launches nothing else, and the renders
      # embedded in a page are whatever THIS engine produced. That is also why
      # the images are generated here rather than accepted from a contributor's
      # machine, the same reason the visual baselines are Linux-only.
      - name: Install the browser the page harness renders in
        run: pnpm exec playwright install --with-deps chromium

      # The same script `uplink-staleness.yml` runs with `--check`, so what heals
      # a branch and what reports on it cannot disagree about which Uplinks they
      # cover. It refuses rather than exiting clean when discovery hands it
      # nothing, since a run that regenerates nothing commits nothing and reports
      # success.
      - name: Regenerate every Uplink page
        run: pnpm uplink-docs

      # The existence gate, AFTER generating, asking whether the run actually
      # left a page behind. Not the same question as the step above: that one
      # fails when the CLI errors (an Uplink with no `uplink.md`, the one part of
      # a page a generator cannot write and this job cannot heal), and this one
      # fails when it exited 0 having written nothing.
      - name: Every Uplink has a generated page
        run: node scripts/uplink-docs-gate.mjs

      - name: Commit and push the pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The pages and the images they reference, and nothing else: a
          # regenerate must never carry along an unrelated file the build wrote.
          git add 'mod/*/client/README.md' 'mod/*/client/gonogo-uplink.json'
          # Looped rather than a wildcard pathspec: `git add 'mod/*/client/docs/assets'`
          # aborts the whole step with exit 128 when any one Uplink has no assets
          # directory, and the publish-only Uplinks do not.
          for assets in mod/*/client/docs/assets; do
            [ -d "$assets" ] && git add "$assets"
          done

          # No filter: whatever the regenerate produced is what the page needs.
          # A shape-based filter and `docs --check` compared different things, so
          # an asset the check called stale was discarded as churn and the pair
          # never converged. Staging the whole set costs a churn commit on motion
          # scenes and buys a heal that always reaches the state the check wants.

          if git diff --cached --quiet; then
            echo "Every Uplink page already describes the code. Nothing to commit."
          else
            git diff --cached --name-status
            # --no-verify: this commit carries only generated pages and their
            # renders. The local pre-commit (biome/typecheck) and pre-push (full
            # pnpm test) hooks are for authored code, and the pre-push suite has
            # been flaky enough to block a generated push outright. CI re-runs on
            # the resulting commit through the workflow_dispatch above.
            git commit --no-verify -m "chore: regenerate Uplink pages"
            # Rebase once and retry, because `staging` receives merges while this
            # runs and a losing push is rejected as non-fast-forward. The
            # concurrency group above stops two runs of THIS workflow racing; it
            # says nothing about somebody else pushing in the ninety seconds
            # between checkout and push. Going red for that would be a red run
            # with nothing wrong in it, and a job that cries wolf is a job whose
            # output nobody reads.
            git push --no-verify origin HEAD:${{ github.ref_name }} || {
              git pull --rebase --no-verify origin ${{ github.ref_name }}
              git push --no-verify origin HEAD:${{ github.ref_name }}
            }
          fi
