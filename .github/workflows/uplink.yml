name: Uplinks

# Per-Uplink CI, one leg per Uplink, discovered rather than listed.
#
# Two things this asks that `ci.yml` structurally cannot:
#
#   1. can each Uplink still BUILD AND TEST on its own, rather than as one cell
#      of a turbo run where a failure names the whole graph
#   2. can each Uplink LEAVE. On the client side: does it compile against the
#      PUBLISHED `@ksp-gonogo/sitrep-sdk` and `@ksp-gonogo/ui-kit` rather than
#      the workspace copies pnpm links in. On the C# side: does its plugin
#      assembly compile OUTSIDE `mod/`, against the one `Sitrep.Contract.dll`
#      GonogoCore installs, rather than against contract source with
#      `Directory.Build.props` overhead
#
# The second is the reason this file exists. The isolation ratchets
# (`packages/core/src/uplink-isolation.test.ts`, `UplinkIsolationTests.cs`) check
# IMPORTS and are correct, and both are blind to it: the build still resolves
# through workspace links, so an Uplink can import only permitted packages, pass
# every gate, and depend on API that has never been published. Measured on
# 2026-08-25, 249 of 292 distinct import bindings across the ten clients did not
# resolve against what was actually on npm, with every gate in the tree green.
#
# NON-BLOCKING FOR NOW (`continue-on-error` on the matrix job). Everything here
# still runs in `ci.yml` too, so this duplicates rather than replaces while the
# raggedness assumptions and the flake profile are observed. Removing the
# duplication is a later, separate step, and `pnpm test` keeps running the Uplink
# suites until these legs are proven equivalent: turbo's filter graph guarantees
# each suite runs against freshly built dependencies and `--filter` here does not
# carry that for free.
#
# What deliberately does NOT move:
#   - `visual`, which is RED ON PURPOSE. Not referenced here, baselines untouched
#   - `act-warnings`, whose self-test would run once per leg and whose per-file
#     debt would fragment at the shard boundary
#   - the isolation ratchets and every other check that reads a debt list at a
#     base git ref. That is the rule: if it reads a debt list at a base ref, it
#     stays repo-wide
#   - COMPILING the Uplink plugin assemblies, which `scripts/uplink-mod-build.sh`
#     still does once for all eleven as a step of ci.yml's `mod` job. The C#
#     extraction probe below is a different question, not that one moved: it asks
#     whether each assembly compiles ALONE, which only has an answer per Uplink

on:
  push:
    branches: [main, ci-dev, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # The matrix axis, computed from disk. `uplink-matrix.mjs` refuses to emit a
  # short list, because an empty matrix produces a job GitHub Actions SKIPS, and
  # a skipped matrix job reports as successful.
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - id: matrix
        run: node scripts/uplink-matrix.mjs --github >> "$GITHUB_OUTPUT"
      - name: What the matrix will run
        run: node scripts/uplink-matrix.mjs

  uplink:
    needs: discover
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      # A leg that applies to nothing is the failure this matrix exists to
      # prevent, not a free pass. Twelve directories are ragged: ten have a
      # client, eleven a plugin csproj, one is client-only and two are C#-only.
      # A directory that is neither is a mistake, and this is the only thing that
      # would notice.
      - uses: actions/checkout@v5

      - name: This leg has something to do
        run: |
          set -euo pipefail
          if [ '${{ matrix.uplink.client }}' != 'true' ] && [ '${{ matrix.uplink.csproj }}' != 'true' ]; then
            echo "::error::${{ matrix.uplink.id }} has neither a client nor a plugin csproj, so this leg would run nothing and report green."
            exit 1
          fi
          if [ '${{ matrix.uplink.client }}' != 'true' ]; then
            echo "::notice::${{ matrix.uplink.id }} is C#-only, so the client steps below do not apply. Its plugin assembly is compiled by scripts/uplink-mod-build.sh in ci.yml's mod job, and the C# extraction probe still runs here."
          fi

      - uses: actions/setup-node@v6
        if: matrix.uplink.client
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        if: matrix.uplink.client
        with:
          run_install: false

      - name: Get pnpm store path
        if: matrix.uplink.client
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        if: matrix.uplink.client
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        if: matrix.uplink.client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      # `...` pulls the dependency graph, so the suites run against freshly built
      # dists rather than whatever a cache happened to hold.
      - name: Build
        if: matrix.uplink.client
        run: pnpm --filter '${{ matrix.uplink.pkg }}...' build

      - name: Test
        if: matrix.uplink.client
        run: pnpm --filter '${{ matrix.uplink.pkg }}' test

      - name: Typecheck
        if: matrix.uplink.client && matrix.uplink.typecheck
        run: pnpm --filter '${{ matrix.uplink.pkg }}' typecheck

      # The `if:` is load-bearing, not tidiness. `biome check` on a directory
      # holding no JS or TS exits 1 with "No files were processed in the
      # specified paths", so running this on the two C#-only Uplinks would fail
      # their legs for a reason that has nothing to do with their code.
      # Warnings do not fail it; several Uplinks carry some today and exit 0.
      - name: Lint
        if: matrix.uplink.client
        run: pnpm exec biome check 'mod/${{ matrix.uplink.id }}'

      # `gonogo-uplink docs --check` renders the page through the harness, which
      # launches chromium. A runner has no browser until something installs one,
      # so both `docsCheck` legs failed here from the day this workflow landed,
      # with "Executable doesn't exist at .../chrome-headless-shell". `ci.yml`
      # never hit it because its `e2e` job installs browsers for its own reasons.
      #
      # A step that CANNOT pass is the mirror of one that cannot fail: it reports
      # the same red whatever the tree does, so it stops carrying information and
      # the leg gets read as noise. Chromium alone, because the harness launches
      # nothing else.
      - name: Install the browser the page harness renders in
        if: matrix.uplink.client && matrix.uplink.docsCheck
        run: pnpm exec playwright install --with-deps chromium

      - name: Pages are not stale
        if: matrix.uplink.client && matrix.uplink.docsCheck
        run: pnpm --filter '${{ matrix.uplink.pkg }}' docs:check

      # The extraction probe. Materialises this Uplink OUTSIDE the pnpm
      # workspace, installs it against tarballs packed exactly as a release would
      # publish them, and typechecks. Escaping the workspace is the whole trick:
      # a filtered `pnpm install`, however scoped, still resolves `workspace:*` to
      # the directory next door, which is what hid this for the life of the repo.
      #
      # It also EXECUTES an import of every published entry point, and asserts
      # that the types it typechecked against came out of `dist` rather than the
      # `src` the sdk also ships. Neither is a stricter typecheck; both are a
      # different kind of check, and the reason is that the sdk shipped six weeks
      # of unloadable ESM while a typecheck-only probe reported zero errors.
      #
      # It proves its own instrument first: an import of an export the sdk does
      # not have must fail to typecheck, and an import of a subpath it does not
      # publish must fail to load. Either one succeeding exits BLIND.
      - name: Can this Uplink leave
        if: matrix.uplink.client
        run: node scripts/uplink-extraction-probe.mjs --only '${{ matrix.uplink.id }}'

      # The C# half of the same question. The reference gate
      # (`UplinkIsolationTests.cs`) reads what a csproj NAMES and the closure of
      # what it names, so it cannot see what arrives unnamed: `Directory.Build.props`
      # supplying `KspManaged` to everything under `mod/`, the difference between
      # compiling against contract SOURCE and the one shipped assembly an author
      # installs, or a `<Compile Include>` reaching sideways into a private project.
      #
      # That last one is not hypothetical. Planted on 2026-08-26, a
      # `<Compile Include="..\Sitrep.Host\ControlFrameElection.cs" />` in an Uplink
      # left the reference gate at 4 of 4 passing and failed the probe below.
      #
      # This is the per-leg cost of treating an Uplink as its own repository: a
      # dotnet setup and a reference-set checkout on each C# leg rather than one
      # for all eleven. The plugin assemblies are still compiled once, together,
      # by `scripts/uplink-mod-build.sh` in ci.yml's `mod` job; this asks the
      # different question of whether each one still compiles ALONE.
      - uses: actions/setup-dotnet@v5
        if: matrix.uplink.csproj
        with:
          dotnet-version: '10.0.x'

      - name: Checkout KSP reference assemblies
        id: kspmanaged
        if: matrix.uplink.csproj
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ksp-gonogo/ksp-managed
          token: ${{ secrets.KSP_MANAGED_TOKEN }}
          path: ksp-managed

      # A leg that cannot compile anything must not report that it compiled.
      # The probe itself refuses without a reference set; this says so where the
      # reason is legible, and keeps the fork soft-degrade ci.yml already grants,
      # since a fork PR never had `KSP_MANAGED_TOKEN` to begin with.
      - name: Can this Uplink's plugin assembly leave
        if: matrix.uplink.csproj
        env:
          KSP_GAMEDATA: ${{ github.workspace }}/ksp-managed/GameData
          KSP_MANAGED: ${{ github.workspace }}/ksp-managed/KSP_Data/Managed
        run: |
          set -euo pipefail
          if [ ! -f "$KSP_MANAGED/Assembly-CSharp.dll" ]; then
            if [ '${{ github.event_name }}' = 'pull_request' ] \
               && [ '${{ github.event.pull_request.head.repo.full_name }}' != '${{ github.repository }}' ]; then
              echo "::warning::KSP reference assemblies absent on a fork PR: the C# extraction probe for ${{ matrix.uplink.id }} did NOT run."
              exit 0
            fi
            echo "::error::KSP reference assemblies absent, so the C# extraction probe for ${{ matrix.uplink.id }} cannot compile anything. Check the ksp-gonogo/ksp-managed checkout and the KSP_MANAGED_TOKEN secret."
            exit 1
          fi
          node scripts/uplink-csharp-extraction-probe.mjs --only '${{ matrix.uplink.id }}'

  # Branch protection cannot require a matrix leg: the legs vary in number and
  # name with the tree, which is the point of discovering them. It also cannot
  # tell a leg that was SKIPPED from one that passed. So the required check is
  # this, and it reads the matrix job's result rather than its own.
  #
  # Currently informational, matching the matrix job's `continue-on-error`. When
  # this becomes the blocking check, drop that and turn the notice into `exit 1`.
  uplink-matrix-result:
    needs: uplink
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Uplink leg passed
        run: |
          set -euo pipefail
          RESULT='${{ needs.uplink.result }}'
          echo "matrix result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::notice::At least one Uplink leg did not pass ($RESULT). This job is informational while uplink.yml runs alongside ci.yml; it becomes the blocking check once the duplication is removed."
          fi
