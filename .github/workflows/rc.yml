name: RC

# Builds the release-candidate channel from the head of `staging`, every night
# and on demand:
#
#   Pages app       /gonogo/rc/ (stations: /gonogo/rc/station)   deploy.yml
#   images          ghcr.io/ksp-gonogo/gonogo{,-relay}:rc         publish-images.yml
#   mod zips        build artifacts, version rc-<shortsha>        publish-mods.yml
#   app version     X.Y.Z-rc.<shortsha>
#
# Nothing here touches `main`, a release tag, npm, nuget or SpaceDock. A release
# is prepare-release.yml's job.
#
# THREE RULES, each one a trap that was hit on the way here:
#
#   1. It does nothing when staging's head already has an RC. The record is a
#      tag `rc-<shortsha>`, written only after every publisher succeeded. A tag
#      is durable, needs no API to read back, shows on the repo page, and a failed
#      RC leaves no tag so the next night retries. `force` rebuilds a sha that
#      already has one (the tag is then left alone).
#   2. It validates the sha before anything publishes. If every CI run of it on
#      ci-dev is green (scripts/ci-dev-forward-verdict.sh, the forwarder's own
#      rule) the tests are not repeated and the gate passes. Otherwise (no
#      ci-dev run, one pending or red, the run list unreadable) it calls ci.yml
#      against the sha and publishes only if that passes. `staging` gets no CI of
#      its own from the forwarder (a GITHUB_TOKEN push starts no workflow), which
#      is why the ci-dev run is the usual evidence. `force` bypasses neither.
#   3. `schedule` always runs the copy of this file on the DEFAULT branch
#      (`main`), which moves only at a release. So this one file is the same on
#      both branches and behaves by where it runs: a scheduled run is a trampoline
#      that only dispatches rc.yml with `--ref staging` and exits; every real job
#      runs only when github.ref is refs/heads/staging. The trampoline needs
#      nothing but this file (the `gh` CLI and GITHUB_TOKEN), and the real run
#      uses staging's ci.yml and publishers via `./`, so rc.yml alone has to
#      reach main for the nightly to start.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even when staging's head already has an RC (CI still runs and must pass)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trampoline:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch this workflow on staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rc.yml --repo "$GITHUB_REPOSITORY" --ref staging

  gate:
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      ci: ${{ steps.decide.outputs.ci }}
      sha: ${{ steps.decide.outputs.sha }}
      short: ${{ steps.decide.outputs.short }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          short="${sha:0:7}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "staging head: $sha"

          if [ -n "$(git tag --points-at "$sha" 'v*')" ]; then
            echo "::notice::staging's head is a release commit ($(git tag --points-at "$sha" 'v*' | head -1)), nothing to candidate."
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/rc-$short" >/dev/null && [ "$FORCE" != "true" ]; then
            echo "::notice::rc-$short already exists, staging has not moved since the last RC."
            exit 0
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"

          if bash scripts/ci-dev-forward-verdict.sh "$GITHUB_REPOSITORY" "$sha"; then
            echo "ci=reuse" >> "$GITHUB_OUTPUT"
            echo "::notice::every ci-dev CI run of $short is green, the tests are not repeated."
          else
            echo "ci=run" >> "$GITHUB_OUTPUT"
            echo "::notice::no green ci-dev verdict for $short, running ci.yml against it."
          fi

  ci:
    needs: gate
    if: needs.gate.outputs.build == 'true' && needs.gate.outputs.ci == 'run'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
    secrets: inherit

  pages:
    needs: [gate, ci]
    if: ${{ !cancelled() && needs.gate.outputs.build == 'true' && needs.ci.result != 'failure' && needs.ci.result != 'cancelled' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
    secrets: inherit

  images:
    needs: [gate, ci]
    if: ${{ !cancelled() && needs.gate.outputs.build == 'true' && needs.ci.result != 'failure' && needs.ci.result != 'cancelled' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      channel: rc
      ref: ${{ needs.gate.outputs.sha }}
    secrets: inherit

  mods:
    needs: [gate, ci]
    if: ${{ !cancelled() && needs.gate.outputs.build == 'true' && needs.ci.result != 'failure' && needs.ci.result != 'cancelled' }}
    # contents: write because GitHub checks a called workflow's permissions before
    # running anything: publish-mods.yml's attach-to-release job asks for it, and
    # it runs only on the release channel, so an RC never uses the grant.
    permissions:
      contents: write
    uses: ./.github/workflows/publish-mods.yml
    with:
      channel: rc
      ref: ${{ needs.gate.outputs.sha }}
    secrets: inherit

  record:
    needs: [gate, ci, pages, images, mods]
    if: ${{ !cancelled() && needs.pages.result == 'success' && needs.images.result == 'success' && needs.mods.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0

      - name: Tag the sha every publisher finished
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          SHORT: ${{ needs.gate.outputs.short }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/rc-$SHORT" >/dev/null; then
            echo "rc-$SHORT already exists (forced rebuild), left as it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "rc-$SHORT" "$SHA"
          git push origin "refs/tags/rc-$SHORT"
          echo "### RC built: rc-$SHORT" >> "$GITHUB_STEP_SUMMARY"
