name: release

# Publishes a release from a v* tag (normally dispatched by
# prepare-release.yml: GITHUB_TOKEN tag pushes don't fire push triggers,
# so the tag-push trigger below only matters for manually pushed tags).
#
# A release is the deliberate act that moves what users see; pushes to
# rc.yml only ever moves the RC channel (/rc/ + `:rc` images).
# This workflow:
#
#   1. runs the full test suite at the tag (the release commit was pushed
#      with GITHUB_TOKEN, so the CI workflow never ran on it, the gate
#      lives here),
#   2. builds the production site and uploads it as the GitHub Release
#      asset `gonogo-site.tar.gz` (deploy.yml publishes the newest
#      release's asset at ksp-gonogo.github.io/app/),
#   3. dispatches publish-images.yml with channel=release so both GHCR
#      images (gonogo, gonogo-relay) get `<version>` + `latest` tags,
#   4. dispatches publish-mods.yml with channel=release so every mod
#      GameData zip in that workflow's matrix gets attached to this release
#      and pushed to SpaceDock,
#   5. dispatches deploy.yml with channel=release, which writes this release
#      to /app/ along with the landing page and the old-URL redirects,
#   6. publishes every @ksp-gonogo package to public npm at the release
#      version (see the publish-packages job),
#   7. publishes KspGonogo.Sitrep.Contract to nuget.org at the release
#      version (see the publish-nuget job at the bottom).
#
# WHY PACKAGE PUBLISHING LIVES HERE
#
# npm's trusted publisher for @ksp-gonogo/ui-kit, @ksp-gonogo/sitrep-sdk and
# @ksp-gonogo/uplink-tools names *this file*, and so does nuget.org's policy
# for the ksp-gonogo organisation. That pin is absolute: a publish from any
# other workflow filename is refused, so this is the only place in the repo
# that can publish.
#
# It also matches the cadence we want: every published package carries ONE
# version, the release version, which is the app's own and the tag's. The
# release commit moved every manifest to it (freeze-published-surface.mjs), the
# NuGet package derives it from the app's manifest, and each packed manifest
# pins its siblings to it exactly (release-packages.mjs). So every release
# publishes every package. The wire contract's Major.Minor and
# EXTENSION_API_VERSION are compatibility stamps inside the packages, not their
# versions.
#
# RELEASE CANDIDATES
#
# `gh workflow run release.yml --ref staging -f rc=true` publishes a release
# candidate of every published package instead, and nothing else: no app
# release, no tag, no commit, no ledger freeze. Every package gets the same RC,
# `<next release>-rc.<run number>`, applied to the packed tarball only; the next
# release is what prepare-release.yml would cut (`scripts/release-packages.mjs`
# says how), or the `version` input. npm gets it under the `rc` dist-tag, moved
# for every package together once all of them exist, and leaves an existing
# `latest` alone (a package with no earlier version may see its first version, the RC,
# become `latest`, and the job summary says so); NuGet gets it as a SemVer
# prerelease. Every gate the release runs before a publish runs on the
# RC's own artifact. It runs only on refs/heads/staging, and only on dispatch.
# Add `-f dry_run=true` to do everything but the login and the push.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      packages_only:
        description: >-
          Publish the npm and NuGet packages only. Skips the app release
          entirely, no GitHub Release, no images, no mod zips, no Pages flip.
        type: boolean
        default: false
      dry_run:
        description: >-
          npm and NuGet packages: build, pack and verify, but do not publish.
        type: boolean
        default: false
      rc:
        description: >-
          Publish a release candidate of every package (npm dist-tag `rc`, NuGet
          prerelease) instead of a release. staging only; skips the app release.
        type: boolean
        default: false
      tag_probe:
        description: >-
          Find out whether this workflow may move npm dist-tags, without moving
          one anybody installs by: adds a throwaway tag to a version already on
          npm and removes it again, for each package. Use it with dry_run.
        type: boolean
        default: false
      version:
        description: >-
          rc only: the release the RC is a candidate for, X.Y.Z, instead of what
          prepare-release.yml's auto bump would cut. Give prepare-release.yml the
          same version when it is time to release it.
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # A packages_only dispatch skips the app release outright, so the escape
    # hatch for an out-of-band package publish can't be mistaken for, or
    # accidentally become, a release of the app.
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.packages_only || inputs.rc)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify the ref is a release tag matching package.json
        id: version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::release.yml must run on a v* tag ref (got $GITHUB_REF). Cut releases via prepare-release.yml."
            exit 1
          fi
          VERSION="$(node -p "require('./packages/app/package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::tag ${TAG} does not match packages/app/package.json version ${VERSION}. Cut releases via prepare-release.yml so the two move together."
            exit 1
          fi
          for MANIFEST in mod/sitrep-sdk/package.json packages/ui-kit/package.json packages/uplink-tools/package.json; do
            OWN="$(node -p "require('./$MANIFEST').version")"
            if [ "$OWN" != "$VERSION" ]; then
              echo "::error::$MANIFEST is at $OWN, not the release version $VERSION. Every published package moves with the release in the release commit; cut releases via prepare-release.yml."
              exit 1
            fi
          done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build production site
        run: pnpm turbo build --filter=@ksp-gonogo/app...
        env:
          VITE_BASE_PATH: /app/
          VITE_AXIOM_TOKEN: ${{ secrets.VITE_AXIOM_TOKEN }}

      - name: Pack site asset
        run: tar -czf gonogo-site.tar.gz -C packages/app/dist .

      # `--latest` because deploy.yml serves whichever release GitHub calls latest,
      # and GitHub's automatic choice prefers the higher version: after a reset of
      # the version line, an older higher-numbered release would keep /app/.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            gonogo-site.tar.gz \
            --repo "${{ github.repository }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --latest \
            --generate-notes

      - name: Publish release images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-images.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.version.outputs.tag }}" \
            -f channel=release

      - name: Publish mod zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-mods.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ steps.version.outputs.tag }}" \
            -f channel=release

      - name: Publish the release app and the landing page to Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f channel=release

  # A real (non dry-run, non-RC) dispatch publishes whatever versions the ref's
  # manifests carry under `latest`, so it runs only on `main`, the branch a
  # release fast-forwards, or on a v* tag. Any other branch carries unreleased
  # manifests and a dry run is the way to exercise it there.
  ref-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: A real publish runs on main or a release tag only
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.rc && !inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::a non-dry-run dispatch publishes real versions and runs on refs/heads/main or a v* tag only, got $GITHUB_REF. Add -f dry_run=true to try it elsewhere, or -f rc=true --ref staging for a candidate."
            exit 1
          fi

  # The RC version every published package shares, worked out once and refused
  # unless it sorts above everything any of them has published, then proved
  # outside the workspace: the probe installs the stamped tarballs side by side,
  # so an exact pin that does not resolve fails the install before anything is
  # published.
  rc-plan:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rc }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Release candidates are cut from staging only
        run: |
          if [ "$GITHUB_REF" != refs/heads/staging ]; then
            echo "::error::rc=true runs on refs/heads/staging only, got $GITHUB_REF: gh workflow run release.yml --ref staging -f rc=true"
            exit 1
          fi

      # The whole history and its tags: `auto` reads the commits since the last
      # v* tag, and a spent tag is refused.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Plan the RC version
        id: plan
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_VERSION" ]; then
            CHOICE=(--version "$RELEASE_VERSION")
          else
            CHOICE=(--bump auto)
          fi
          node scripts/release-packages.mjs plan "${CHOICE[@]}" --rc "$GITHUB_RUN_NUMBER" \
            > "$RUNNER_TEMP/rc-plan.json" 2> "$RUNNER_TEMP/rc-plan.txt"
          cat "$RUNNER_TEMP/rc-plan.txt"
          echo "plan=$(cat "$RUNNER_TEMP/rc-plan.json")" >> "$GITHUB_OUTPUT"
          {
            echo '```'
            cat "$RUNNER_TEMP/rc-plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the published packages
        run: pnpm exec turbo build --filter=@ksp-gonogo/sitrep-sdk --filter=@ksp-gonogo/ui-kit --filter=@ksp-gonogo/uplink-tools

      - name: The RCs install and load together outside the workspace
        run: node scripts/published-packages-probe.mjs --version "$(node -p 'require(process.argv[1]).version' "$RUNNER_TEMP/rc-plan.json")"

  # Publishes each package at the release version (or the run's RC), via npm
  # OIDC trusted publishing: no NPM_TOKEN, nothing to rotate, provenance on
  # every publish. See local_docs/oidc-publishing-guide.md.
  #
  # Runs per package, after `release`, so a failed app release never publishes.
  # A version already on the registry is a re-run attempt (or a packages_only
  # dispatch of a released tree) and is skipped with a notice, once the fossil
  # check below has shown the published copy is this content.
  #
  # THE PACKAGES ARE PUBLISHED AS A SET. These jobs finish minutes apart, and
  # while each moved its own dist-tag as it finished, an author installing in
  # between got two packages at the new version and one at the old, which do not
  # resolve together; a job that failed left the set mixed until someone ran it
  # again. So the order is:
  #
  #   publish-nuget     push the C# package, which nuget.org accepts at once and
  #                     lists up to twenty minutes later
  #   nuget-listed      wait until it is listed; a scaffold restoring it before
  #                     then fails, so nothing an author installs by moves first
  #   publish-packages  publish each npm package under the `pending` tag, which
  #                     nobody installs by: `rc` and `latest` stay where they are
  #   packages-present  read each version back from the registry
  #   move-tags         move `rc` (or `latest`) for all three, seconds apart, and
  #                     put back the ones already moved if one cannot be
  #
  # A failure anywhere leaves every tag naming the previous set and the run red.
  # Running the workflow again finishes the job: a version already published is
  # skipped, and the tags are moved for whatever still needs it.
  publish-packages:
    needs: [ref-guard, release, rc-plan, nuget-listed]
    # `needs` alone would skip this whenever `release` is skipped, which is
    # exactly the packages_only case. Naming the results keeps a *failed*
    # release from publishing while letting a deliberately skipped one through.
    # An RC additionally needs its plan, which is where the staging-only refusal
    # lives. Nothing is published to npm until nuget.org lists the C# package.
    if: ${{ !cancelled() && needs.ref-guard.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && (needs.rc-plan.result == 'success' || (needs.rc-plan.result == 'skipped' && !inputs.rc)) && needs.nuget-listed.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
    env:
      RC: ${{ inputs.rc && 'true' || 'false' }}
      RC_PLAN: ${{ needs.rc-plan.outputs.plan }}
    # Scoped to this job on purpose: `release` above keeps the workflow-level
    # contents/actions write it needs, and never gets an OIDC identity. This
    # job trades those for id-token and nothing more.
    permissions:
      contents: read
      id-token: write
    strategy:
      # One package's failure must not cancel the other's publish.
      fail-fast: false
      matrix:
        include:
          - package: '@ksp-gonogo/ui-kit'
            dir: packages/ui-kit
          - package: '@ksp-gonogo/sitrep-sdk'
            dir: mod/sitrep-sdk
          - package: '@ksp-gonogo/uplink-tools'
            dir: packages/uplink-tools
    steps:
      - uses: actions/checkout@v5

      - name: Read the version this run publishes
        id: pkg
        run: |
          DIR='${{ matrix.dir }}'
          # @ksp-gonogo/theme is private and bundled into ui-kit's dist by
          # tsup. It is absent from the matrix above and would fail the
          # artifact check below, but refuse it here too, this is the cheap
          # guard that also catches a publishable package being marked private
          # by mistake.
          if [ "$(node -p "require('./$DIR/package.json').private === true")" = "true" ]; then
            echo "::error::${{ matrix.package }} is marked private and must never be published."
            exit 1
          fi
          NAME="$(node -p "require('./$DIR/package.json').name")"
          if [ "$NAME" != '${{ matrix.package }}' ]; then
            echo "::error::$DIR is $NAME, expected ${{ matrix.package }}, the matrix and the tree disagree."
            exit 1
          fi
          FIRST=false
          if [ "$RC" = true ]; then
            VERSION="$(node -p 'JSON.parse(process.env.RC_PLAN).version')"
            FIRST="$(node -p 'JSON.parse(process.env.RC_PLAN).packages[process.argv[1]].firstVersion' "$NAME")"
          else
            VERSION="$(node -p "require('./packages/app/package.json').version")"
            OWN="$(node -p "require('./$DIR/package.json').version")"
            if [ "$OWN" != "$VERSION" ]; then
              echo "::error::$DIR is at $OWN, not the release version $VERSION. Every published package moves with the release in the release commit; cut releases via prepare-release.yml."
              exit 1
            fi
          fi
          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "first=$FIRST"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Is this version already on npm?
        id: published
        run: |
          NAME='${{ steps.pkg.outputs.name }}'
          VERSION='${{ steps.pkg.outputs.version }}'
          echo "latest=$(npm view "$NAME" dist-tags.latest 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          # A non-zero exit is an E404 (not published) or a registry blip.
          # Both fall through to a publish attempt, and npm refuses to
          # overwrite an existing version anyway: the registry stays the
          # authority; this check only keeps an unchanged package green.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already published, no version change."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is not on npm yet."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # "Already published" is the right answer for a package nobody touched and
      # exactly the wrong one for a package whose version never moves. The sdk
      # sat at 0.0.1 on both sides from its first publish onwards, so this step's
      # predecessor said "nothing to do" on every release while the workspace
      # surface grew past the registry copy: 249 of 292 Uplink import bindings
      # stopped resolving against it, and nothing anywhere said so, because a
      # correct skip and a fossil skip print the same green step.
      #
      # So the skip has to be earned on CONTENT. This packs what the tree builds
      # and diffs its `dist` against the published tarball; a difference fails
      # the release asking for a version bump.
      #
      # Only when skipping: on the publish path the version has already moved and
      # there is nothing to compare against.
      - name: The published copy is not a fossil
        if: steps.published.outputs.skip == 'true'
        run: |
          set -euo pipefail
          NAME='${{ steps.pkg.outputs.name }}'
          VERSION='${{ steps.pkg.outputs.version }}'
          pnpm exec turbo build --filter="$NAME"
          TARBALL="$(node scripts/pack-publishable.mjs '${{ matrix.dir }}' "$RUNNER_TEMP")"
          node scripts/published-version-is-current.mjs "$NAME" "$VERSION" "$TARBALL"

      # `npm pack` does not run a build, and ui-kit's dist is tsup's output
      # plus a copy of the theme's tokens.css. Packing without this ships a
      # stale or empty dist, and it only breaks for whoever installs it. turbo
      # builds dependencies first, so the theme's dist exists before ui-kit's
      # build copies out of it.
      - name: Build
        if: steps.published.outputs.skip == 'false'
        run: pnpm exec turbo build --filter='${{ steps.pkg.outputs.name }}'

      # Packed through `pack-publishable.mjs` rather than by `npm pack` directly,
      # because npm does not apply `publishConfig` field overrides and says so:
      # `npm publish --dry-run` in `mod/sitrep-sdk` prints "Unknown publishConfig
      # config" for `main`, `types` and `exports`. That package points those at
      # `./src/*.ts` for the workspace and redirects them at `./dist/*.js` for
      # consumers through `publishConfig`, which is the pnpm convention; we
      # publish with npm, for OIDC provenance.
      #
      # A plain `npm pack` therefore produces a tarball whose manifest sends
      # consumers to TypeScript source. `files` ships `src`, so it installs and
      # resolves, and breaks later inside somebody else's bundler. The script
      # applies the overrides to the extracted manifest and re-tars; the file set
      # is whatever npm chose, untouched.
      #
      # `verify-package-artifact.mjs` below fails on exactly this manifest, so
      # the two are belt and braces rather than one doing the other's job.
      #
      # Packed into a side directory, then stamped with the version this run
      # publishes and every sibling pinned to it exactly, into the one tarball
      # the steps below gate and publish. A release's version is already the
      # tree's; the stamp still adds the sdk peer ui-kit and uplink-tools leave
      # undeclared in the workspace.
      - name: Pack
        if: steps.published.outputs.skip == 'false'
        run: |
          set -euo pipefail
          PACKED="$(node scripts/pack-publishable.mjs '${{ matrix.dir }}' "$RUNNER_TEMP/packed")"
          node scripts/release-packages.mjs stamp "$PACKED" '${{ steps.pkg.outputs.version }}' "$RUNNER_TEMP"

      # Gate the tarball, then publish that same file, what was checked is
      # exactly what ships, rather than a re-pack that could differ.
      - name: Verify the packed artifact
        if: steps.published.outputs.skip == 'false'
        run: |
          set -euo pipefail
          TARBALL="$(ls "$RUNNER_TEMP"/*.tgz)"
          echo "Verifying $TARBALL"
          node scripts/verify-package-artifact.mjs "$TARBALL"
          node scripts/release-packages.mjs check "$TARBALL" '${{ steps.pkg.outputs.version }}'
          echo "tarball=$TARBALL" >> "$GITHUB_ENV"

      # Deliberately after `pnpm install`: `registry-url` writes an .npmrc
      # containing a literal ${NODE_AUTH_TOKEN}, and pnpm fails outright on an
      # env var it can't expand. Only publishing needs the registry set, so
      # only publishing gets it.
      - uses: actions/setup-node@v6
        if: steps.published.outputs.skip == 'false'
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports OIDC (>= 11.5.1)
        if: steps.published.outputs.skip == 'false'
        run: |
          npm install -g npm@latest
          npm -v

      - name: Publish to npm
        if: steps.published.outputs.skip == 'false' && !inputs.dry_run
        # No NODE_AUTH_TOKEN / NPM_TOKEN: npm detects OIDC from the
        # `id-token: write` permission and exchanges it with the registry.
        #
        # Under the holding tag, for a release and a candidate alike: `move-tags`
        # below is the only job that moves `rc` or `latest`.
        run: npm publish "$tarball" --access public --provenance --tag pending

      - name: Publish (dry run)
        if: steps.published.outputs.skip == 'false' && inputs.dry_run
        run: npm publish "$tarball" --access public --provenance --tag pending --dry-run

      # Publishing under `pending` must move nothing else, for a release too:
      # its `latest` moves in `move-tags`, with the others. A package with no
      # version before this one had no `latest` to protect: npm points it at the
      # first version whatever the tag, so that case reports where it points and
      # passes.
      - name: Publishing left npm's latest where it was
        if: steps.published.outputs.skip == 'false' && !inputs.dry_run
        run: |
          NAME='${{ steps.pkg.outputs.name }}'
          BEFORE='${{ steps.published.outputs.latest }}'
          AFTER="$(npm view "$NAME" dist-tags.latest)"
          if [ -z "$BEFORE" ]; then
            echo "$NAME had no earlier version, so \`latest\` now points at ${AFTER:-nothing}, the version just published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$AFTER" != "$BEFORE" ]; then
            echo "::error::$NAME's latest moved from $BEFORE to $AFTER. Restore it: npm dist-tag add $NAME@$BEFORE latest"
            exit 1
          fi
          echo "$NAME latest is still $BEFORE; the new version is under the pending dist-tag."

      - name: Summary
        run: |
          NAME='${{ steps.pkg.outputs.name }}'
          VERSION='${{ steps.pkg.outputs.version }}'
          if [ '${{ steps.published.outputs.skip }}' = 'true' ]; then
            echo "⏭ $NAME@$VERSION: already on npm, no version change." >> "$GITHUB_STEP_SUMMARY"
          elif [ '${{ inputs.dry_run }}' = 'true' ]; then
            echo "🧪 $NAME@$VERSION: packed and verified, not published (dry run)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "📦 Published $NAME@$VERSION with provenance under the pending dist-tag; move-tags moves $([ "$RC" = true ] && echo rc || echo latest) for the set." >> "$GITHUB_STEP_SUMMARY"
            echo "https://www.npmjs.com/package/$NAME/v/$VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Reads each version back from the registry before any tag moves, by the
  # version's own document and a request for its tarball, with every cache asked
  # for the registry's own answer: the packument a client resolves a tag from is
  # cached and is exactly what must not be trusted here.
  packages-present:
    needs: [publish-packages]
    if: ${{ !cancelled() && needs.publish-packages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      names: ${{ steps.names.outputs.names }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # From the tree's own manifests, the same list `release-packages.mjs` plans
      # with, so a fourth published package is waited for without an edit here.
      - name: Which packages are published
        id: names
        run: |
          NAMES="$(node -e "import('./scripts/release-packages.mjs').then((m) => console.log(m.publishedPackages().map((p) => p.name).join(' ')))")"
          echo "names=$NAMES" >> "$GITHUB_OUTPUT"

      - name: The registry serves every package at this version
        run: node scripts/release-tags.mjs npm-present '${{ needs.publish-packages.outputs.version }}' ${{ steps.names.outputs.names }} ${{ inputs.dry_run && '--dry-run' || '' }}

  # The only job that moves a dist-tag anyone installs by. It needs "Allow npm
  # dist-tag" ticked on each package's trusted publisher on npmjs.com, which is
  # separate from the permission to publish, and npm 11.21.0 or later.
  #
  # A dry run prints the moves and makes none. Nothing it can READ shows whether
  # the permission is there, because a public package's tags are readable by
  # anyone, so `tag_probe` asks the one way that does: a throwaway tag added to
  # a version already published and removed again.
  move-tags:
    needs: [publish-packages, packages-present]
    if: ${{ !cancelled() && needs.packages-present.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.rc && 'rc' || 'latest' }}
      VERSION: ${{ needs.publish-packages.outputs.version }}
      NAMES: ${{ needs.packages-present.outputs.names }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Ensure npm can move a dist-tag under OIDC (>= 11.21.0)
        run: |
          npm install -g npm@latest
          node -e "
            const [major, minor] = process.argv[1].split('.').map(Number);
            if (major < 11 || (major === 11 && minor < 21)) {
              console.error('::error::npm ' + process.argv[1] + ' cannot move a dist-tag under trusted publishing; 11.21.0 or later can.');
              process.exit(1);
            }
          " "$(npm -v)"
          npm -v

      - name: This workflow may move dist-tags
        if: inputs.tag_probe
        run: node scripts/release-tags.mjs probe $NAMES

      - name: Move the tag for every package together
        run: node scripts/release-tags.mjs move "$TAG" "$VERSION" $NAMES ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Summary
        run: |
          if [ '${{ inputs.dry_run }}' = 'true' ]; then
            echo "🧪 $TAG would move to $VERSION for: $NAMES (dry run, no tag moved)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🏷 $TAG is $VERSION for: $NAMES." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The C# half of the Uplink surface. nuget.org's trusted-publishing policy for
  # the ksp-gonogo organisation names this file and no environment, so this is
  # the only place that can push, and it authenticates with the job's OIDC token
  # exchanged for a one-hour key. There is no stored API key to add.
  #
  # One file is packed and every check runs against it: the package gate, then
  # the extraction probe building a real Uplink against it outside the repo, then
  # the plant proving the probe could have failed. The push sends that same file,
  # never a re-pack, so what shipped is what was tested.
  #
  # It is pushed FIRST, before any npm package, and `nuget-listed` then waits
  # for it: see the note above `publish-packages`.
  publish-nuget:
    needs: [ref-guard, release, rc-plan]
    if: ${{ !cancelled() && needs.ref-guard.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && (needs.rc-plan.result == 'success' || (needs.rc-plan.result == 'skipped' && !inputs.rc)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.pack.outputs.version }}
    env:
      RC: ${{ inputs.rc && 'true' || 'false' }}
      RC_PLAN: ${{ needs.rc-plan.outputs.plan }}
      PACKAGE_ID: KspGonogo.Sitrep.Contract
      KSP_GAMEDATA: ${{ github.workspace }}/ksp-managed/GameData
      KSP_MANAGED: ${{ github.workspace }}/ksp-managed/KSP_Data/Managed
    steps:
      - uses: actions/checkout@v5

      # The probe compiles a KSP plugin, so it needs the reference assemblies.
      # No soft-degrade here: a release that could not run the probe has not
      # proved the package, and must not push it.
      - name: Checkout the KSP reference assemblies
        uses: actions/checkout@v5
        with:
          repository: ksp-gonogo/ksp-managed
          token: ${{ secrets.KSP_MANAGED_TOKEN }}
          path: ksp-managed

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # The two determinism flags below matter only for the fossil check further
      # down: without them two builds of the identical tree at different commits
      # are not even byte-comparable after normalisation. Deliberately NOT
      # `SourceLink=false`: dropping SourceLink for raw determinism would cost
      # every consumer's debugging for a check that does not need it.
      #
      # The package version is the release version, which the csproj reads from
      # the app's manifest; an RC overrides it with the run's RC. Either way the
      # assemblies carry the contract's own Major.Minor as metadata.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          PROJECT=mod/Sitrep.Contract.Package/Sitrep.Contract.Package.csproj
          RC_ARGS=()
          if [ "$RC" = true ]; then
            RC_VERSION="$(node -p 'JSON.parse(process.env.RC_PLAN).version')"
            echo "$PACKAGE_ID: RC $RC_VERSION"
            RC_ARGS=("-p:PackageVersion=$RC_VERSION")
          fi
          dotnet pack "$PROJECT" \
            -c Release -o "$RUNNER_TEMP/nuget" --nologo \
            -p:ContinuousIntegrationBuild=true -p:IncludeSourceRevisionInInformationalVersion=false \
            "${RC_ARGS[@]}"
          NUPKG="$(ls "$RUNNER_TEMP"/nuget/"$PACKAGE_ID".*.nupkg)"
          VERSION="$(basename "$NUPKG" .nupkg)"
          VERSION="${VERSION#"$PACKAGE_ID".}"
          {
            echo "nupkg=$NUPKG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Gate the packed file
        run: |
          if [ "$RC" = true ]; then
            node scripts/nuget-contract-package-gate.mjs '${{ steps.pack.outputs.nupkg }}' --rc '${{ steps.pack.outputs.version }}'
          else
            node scripts/nuget-contract-package-gate.mjs '${{ steps.pack.outputs.nupkg }}'
          fi

      - name: An Uplink builds against the packed file, and the probe can see a gap
        run: |
          set -euo pipefail
          node scripts/nuget-extraction-probe.mjs --nupkg '${{ steps.pack.outputs.nupkg }}' --uplink GonogoProbeUplink
          node scripts/nuget-extraction-probe.mjs --nupkg '${{ steps.pack.outputs.nupkg }}' --plant --uplink GonogoProbeUplink

      # NuGet refuses a republish of an existing version, so an unchanged version
      # is skipped with a notice rather than failing the release. Only a 404 means
      # "not published": any other answer from the registry fails here, because
      # reading a registry outage as "absent" would attempt a push and reading it
      # as "present" would skip one.
      - name: Is this version already on nuget.org?
        id: published
        run: |
          set -euo pipefail
          VERSION='${{ steps.pack.outputs.version }}'
          ID_LOWER="$(echo "$PACKAGE_ID" | tr '[:upper:]' '[:lower:]')"
          STATUS="$(curl -s -o "$RUNNER_TEMP/versions.json" -w '%{http_code}' \
            "https://api.nuget.org/v3-flatcontainer/$ID_LOWER/index.json")"
          case "$STATUS" in
            404) echo "skip=false" >> "$GITHUB_OUTPUT"; echo "$PACKAGE_ID has never been published." ;;
            200)
              if node -e "process.exit(require(process.argv[1]).versions.includes(process.argv[2].toLowerCase()) ? 0 : 1)" \
                "$RUNNER_TEMP/versions.json" "$VERSION"; then
                echo "::notice::$PACKAGE_ID $VERSION is already on nuget.org, no version change."
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "$PACKAGE_ID $VERSION is not on nuget.org yet."
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *) echo "::error::nuget.org answered $STATUS for $PACKAGE_ID's version list."; exit 1 ;;
          esac

      # "Already published" and "published this content" are different facts,
      # and the skip above cannot tell them apart. The version is on nuget.org
      # already only for a re-run attempt or a packages_only dispatch of a
      # released tree, and the tree may have moved since. Compared with the five
      # build-identity regions normalised out (see the script's header); a real
      # difference fails asking for a new release rather than shipping silently
      # unchanged.
      - name: Download the published copy
        if: steps.published.outputs.skip == 'true'
        run: |
          set -euo pipefail
          VERSION='${{ steps.pack.outputs.version }}'
          ID_LOWER="$(echo "$PACKAGE_ID" | tr '[:upper:]' '[:lower:]')"
          curl -sf -o "$RUNNER_TEMP/published.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/$ID_LOWER/$VERSION/$ID_LOWER.$VERSION.nupkg"

      - name: The published copy is not a fossil
        if: steps.published.outputs.skip == 'true'
        run: node scripts/nuget-fossil-check.mjs '${{ steps.pack.outputs.nupkg }}' "$RUNNER_TEMP/published.nupkg"

      # The login action exchanges the OIDC token as a named nuget.org account,
      # the profile name that owns the policy. It is refused before the exchange
      # when unset, so a missing secret reads as that rather than as a 401.
      - name: The nuget.org account is configured
        if: steps.published.outputs.skip == 'false' && !inputs.dry_run
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::secrets.NUGET_USER is unset. It is the nuget.org profile name (not an email) of the account that owns the ksp-gonogo trusted-publishing policy."
            exit 1
          fi

      - name: NuGet login (OIDC to a one-hour key)
        if: steps.published.outputs.skip == 'false' && !inputs.dry_run
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the .snupkg beside it as well: `dotnet nuget push` sends a
      # symbols package of the same name automatically.
      - name: Publish to nuget.org
        if: steps.published.outputs.skip == 'false' && !inputs.dry_run
        run: |
          case '${{ steps.pack.outputs.version }}' in
            *-rc.*) ;;
            *) if [ "$RC" = true ]; then echo "::error::an RC run refuses to push the release version ${{ steps.pack.outputs.version }}"; exit 1; fi ;;
          esac
          dotnet nuget push '${{ steps.pack.outputs.nupkg }}' \
            --api-key '${{ steps.login.outputs.NUGET_API_KEY }}' \
            --source https://api.nuget.org/v3/index.json

      - name: Summary
        run: |
          VERSION='${{ steps.pack.outputs.version }}'
          if [ '${{ steps.published.outputs.skip }}' = 'true' ]; then
            echo "⏭ $PACKAGE_ID $VERSION: already on nuget.org, no version change." >> "$GITHUB_STEP_SUMMARY"
          elif [ '${{ inputs.dry_run }}' = 'true' ]; then
            echo "🧪 $PACKAGE_ID $VERSION: packed, gated and probed, not published (dry run)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "📦 Published $PACKAGE_ID $VERSION." >> "$GITHUB_STEP_SUMMARY"
            echo "https://www.nuget.org/packages/$PACKAGE_ID/$VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi

  # nuget.org answers a push with "Your package was pushed" and lists the
  # version only once it has validated and indexed it. One candidate was still
  # unlisted twenty minutes after its push, while npm's tag already named it, and
  # a scaffold made in that window failed to restore. So the npm half waits here.
  nuget-listed:
    needs: [publish-nuget]
    if: ${{ !cancelled() && needs.publish-nuget.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: nuget.org lists the version
        run: node scripts/release-tags.mjs nuget-listed KspGonogo.Sitrep.Contract '${{ needs.publish-nuget.outputs.version }}' --wait-minutes 45 ${{ inputs.dry_run && '--dry-run' || '' }}
