name: CI

on:
  push:
    # `ci-dev` is a throwaway iteration branch: push CI-config / flaky-test
    # experiments here to get real CI runs without churning main (main pushes
    # also fire the dev-channel deploy). Fast-forward main from ci-dev only
    # once it's green.
    #
    # `staging` is the long-lived integration branch where large multi-task
    # work accumulates before a squash to main. It MUST get CI, without it a
    # whole feature branch runs unvalidated (test/e2e/visual never fire), which
    # is exactly how a batch of e2e failures reached the branch unnoticed
    # (2026-07-17). Only main pushes trigger the deploy (deploy.yml gates on
    # main), so CI on staging validates without deploying.
    branches: [main, ci-dev, staging]
  pull_request:
    branches: [main]
  # Manual trigger: run CI on any ref on demand. Needed because a baseline
  # regen (update-baselines.yml) commits with GITHUB_TOKEN, and a token push
  # does NOT trigger a workflow run, so the regenerated-baseline tip would
  # otherwise never get a CI run to prove the visual gate is green.
  workflow_dispatch:

permissions:
  # `read:packages` is required so pnpm install can pull
  # @jonpepler/kerbcast from GitHub Packages. The other defaults
  # (contents: read) stay implicit.
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The shrink-only ratchets read their debt lists at a BASE revision
          # (`git show <ref>:<path>`) and diff them. At the default depth of 1
          # there is no other revision in the clone at all, so that read failed
          # on every CI run since those gates landed, and each of them caught the
          # failure and returned early. Five gates, green in CI throughout,
          # having never once compared anything.
          fetch-depth: 0

      # Which revision that is depends on the trigger, and on a push it is NOT
      # `origin/staging`: on a push to staging that ref IS the commit under test,
      # and a debt list diffed against itself can only ever report "unchanged".
      # The script works the answer out per trigger and refuses rather than
      # guessing; `ratchetBaseRef.ts` refuses a second time on the same two
      # grounds, so deleting this step cannot quietly restore the silence.
      - name: Resolve the ratchets' base revision
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="$(bash scripts/resolve-ratchet-base-ref.sh)"
          echo "RATCHET_BASE_REF=$base" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        env:
          # .npmrc references ${GITHUB_TOKEN} for the @jonpepler scope
          # registry on GitHub Packages.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # `pnpm typecheck` is the ONLY thing that runs the workspace's
      # `*.test-d.ts` type-level assertions: vitest goes through esbuild and
      # never typechecks, and each package's main tsconfig excludes the
      # `.test-d.ts` glob, so they are compiled solely by the per-package
      # `tsconfig.test-d.json` pass inside this script. Before it was added
      # here the local pre-commit hook was their only gate, which a
      # `--no-verify` commit or a CI-only edit walked straight past.
      #
      # It lives as a step of `test` rather than as its own job on purpose: a
      # new job has to be marked required in branch protection to gate
      # anything, and one nobody remembers to mark is the same silent pass in
      # a new place. A step in an already-required job cannot be skipped.
      - run: pnpm typecheck

      - run: pnpm test

      # Un-fed snapshot gate: re-runs the DOM snapshot specs with every stream
      # emit suppressed and fails on any that still pass, because such a test is
      # capturing a render containing none of its fixture's data.
      #
      # In the `test` job rather than `visual` deliberately: `visual` is red on
      # purpose until the end-of-run re-baseline, so a finding placed there would
      # be invisible.
      #
      # GREEN on landing, and it must stay that way. The 96 renders already un-fed
      # when it landed are recorded in `unfed-snapshot-debt.ts`, which is shrink-only
      # and enforced from both sides. Keeping this step green is the point: a step
      # that is permanently red hides the next unrelated failure behind it, which is
      # what happened to `visual`.

      - run: pnpm --filter @ksp-gonogo/components unfed-snapshot-gate

      # Says out loud which suites did not run. Three of them are gated on a
      # recording generated into `local_docs/`, which is blanket-gitignored, so
      # CI can never have it and they skip on every run. A skipped suite prints
      # as skipped, which is what a deliberately-skipped suite prints too, and
      # `pnpm test` says "passed" either way: the whole recorded-wire tier not
      # executing has never appeared anywhere a person reads.
      #
      # Exits 0 whatever it finds, deliberately. A missing fixture is the
      # permanent state here and a step that is always red hides the next real
      # failure behind it, the way `visual` already does. The register it prints
      # is held to the tree by `packages/core/src/fixture-gated-suites.test.ts`,
      # so it cannot go stale without that going red.
      - name: Which suites did not run, and what that costs
        run: pnpm fixture-gated-report

      # Probe-harness smoke check: opens each probe page in Chromium and asserts
      # the bundle installs the global its driver calls. Chromium only, since the
      # question is "does the bundle evaluate", which is engine-independent.
      #
      # In the `test` job for the same reason as the un-fed gate above, and the
      # reason is now load-bearing rather than tidy: a module-scope
      # `process.env` read reached staging in 8bd2b4e8 and the probe bundle threw
      # before installing `window.__renderProbe`, so all 42 widgets and 1442
      # baselines silently stopped being compared. `visual` was the only job that
      # could see it, and `visual` is red on purpose, so it showed the colour it
      # always shows for a day. This step asks a question `visual` cannot:
      # not "did the pixels drift" but "did the harness render anything at all".
      - name: Install Playwright browser (probe smoke)
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm --filter @ksp-gonogo/components probe-render-smoke

      # Uplink page drift: regenerate each migrated Uplink's README and
      # `gonogo-uplink.json` in memory and fail on any difference.
      #
      # In `test` for the same reason as the two steps above: `visual` is red on
      # purpose, so a finding placed there shows the colour that job always
      # shows. It asks a question neither of them can, either: not "did the
      # pixels drift" nor "did the harness render anything", but "does the page
      # still describe the Uplink the code actually is". A page that quietly
      # stops listing a widget reads exactly like an Uplink with fewer widgets.
      #
      # Asset BYTES are deliberately not compared, only which assets exist:
      # rasterisation is per-engine and per-OS, so a byte comparison would fail
      # on every machine but the one that generated it, and a gate that cries
      # wolf is a gate someone turns off.
      - name: Uplink pages are not stale
        run: |
          pnpm --filter @ksp-gonogo/ui-kit... build
          pnpm --filter @ksp-gonogo/gonogo-scansat-uplink docs:check
          pnpm --filter @ksp-gonogo/gonogo-kos-uplink docs:check

  # act() warning ratchet: per-file counts held against scripts/act-warning-debt.mjs.
  #
  # Its OWN job rather than a step in `test`, because it re-runs every suite with
  # `--reporter=verbose` and would otherwise double that job's wall time for a
  # question `test` is structurally unable to answer: vitest 4's default reporter
  # suppresses console output for tests that PASS, and an act warning does not fail
  # the test that emits it. So `pnpm test` has never been able to show one, and the
  # tree carried 103 while reporting clean on every run.
  #
  # The gate proves its own instrument before it believes any number: it plants a
  # component that updates outside act(), runs that one file, and fails as BLIND if
  # the count does not rise. Without that, a reporter change turns this job into a
  # permanently green no-op, which is exactly the state it was built to end.
  act-warnings:
    runs-on: ubuntu-latest
    steps:
      # Same checkout depth and base ref as `test`, because this job re-runs
      # every suite (the ratchets included) and treats a non-zero vitest exit as
      # its own failure. Without them the shrink-only gates would throw here on
      # an unreachable base and take this job's warning count down with them.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the ratchets' base revision
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="$(bash scripts/resolve-ratchet-base-ref.sh)"
          echo "RATCHET_BASE_REF=$base" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      # The suites import built dists from sibling packages, so the tree has to be
      # built before any of them will run at all.
      - name: Build workspace
        run: pnpm build

      - run: pnpm act-warning-gate

  # C# Sitrep mod: unit/integration tests + the contract shape-gate.
  # Runs in parallel with `test`/`e2e`/`visual`, on the same triggers.
  #
  # SCOPING: the test projects are listed explicitly rather than building
  # mod/Gonogo.sln wholesale, because Gonogo.KSP, GonogoKosUplink and
  # GonogoScansatUplink reference KSP/Unity/SCANsat/kOS assemblies via HintPaths
  # into a gitignored local KSP install and the solution build would fail on the
  # missing DLLs.
  #
  # The reference assemblies themselves are NOT missing here any more: the
  # `ksp-managed` checkout below fetches the private curated ref-DLL set, and
  # two projects already compile KSP-linked sources against it (GonogoKosUplink's
  # headless terminal harness, Gonogo.KSP.Tests' ConfigNode-backed ledger). That
  # is the follow-up this comment used to describe as outstanding; it is done,
  # and the note is kept because believing otherwise is how a KSP-facing layer
  # gets written off as untestable.
  #
  # dotnet test takes a single project, so we iterate the test-project list.
  # The shape-gate (ContractShapeGateTests) lives in Sitrep.Host.Tests and is
  # CI-safe: it reads PE metadata and the contract's own [SitrepContract]
  # marker. Reinforced.Typings is not a runtime dependency of anything here,
  # it is confined to Sitrep.Contract.Codegen, which only mod/codegen.sh builds.
  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Every generated artifact in the tree is committed, so any of them can
      # silently disagree with the source it was generated from. Two things
      # this used to be are worth remembering, because both were real drifts:
      # a topic-map comment diverged when an em-dash pass edited the generated
      # file and its source differently, and `rad/h` was added to
      # UNIT_DEFINITIONS without a regen, so ui-kit had no ratio for it and
      # <Unit format="rad/h"> quietly did nothing.
      #
      # This runs the SAME script `pnpm codegen:check` runs, rather than a
      # narrower echo of it, for two reasons. It covers every generated
      # directory instead of two: the nine Uplink ones were regenerated by the
      # old steps and diffed by neither, so a hand-edit in any of them passed
      # here AND locally. And it hashes rather than asking git, which is what
      # makes a newly added, still-untracked generated file visible; see that
      # script's own header for why `git diff --exit-code` cannot be.
      #
      # Needs no node/pnpm setup beyond what this job already has: the script
      # shells straight to codegen.sh (pure dotnet) and gen-unit-kinds.mjs.
      - name: Every generated artifact is in sync with its source
        run: bash scripts/codegen-check.sh

      # The headless kOS terminal harness (GonogoKosUplink.Tests/Headless) needs
      # kOS.Safe.dll + kOS.dll, and Gonogo.KSP.Tests' ConfigNode-backed ledger
      # suite needs Assembly-CSharp.dll; both live in the private ksp-managed
      # reference-assembly repo, the same repo the release-build workflows
      # already consume (see _build-uplink-mod.yml).
      #
      # continue-on-error keeps a fork or a contributor PR without repo access
      # able to run the KSP-free suites, but see the hard check after this step:
      # on main and staging a missing checkout is now an ERROR, because
      # soft-degrading there means the ONLY coverage those KSP-linked sources
      # have silently does not run while the job stays green, and coverage that
      # can vanish without going red is worse than none: it looks like coverage.
      # See docs/superpowers/plans/2026-07-13-kos-headless-harness-report.md.
      - name: Checkout kOS reference assemblies (for the terminal harness)
        id: kspmanaged
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: ksp-gonogo/ksp-managed
          token: ${{ secrets.KSP_MANAGED_TOKEN }}
          path: ksp-managed

      # On the paths that gate a merge or a deploy, the reference assemblies are
      # not optional: without them GonogoKosUplink.Tests' harness and
      # Gonogo.KSP.Tests' ledger suite are dropped at BUILD time and the job goes
      # green having run neither. A missing token is a broken CI configuration,
      # not a lighter test run, so it fails here where the reason is legible
      # rather than as an absence nobody reads.
      #
      # A PULL REQUEST is one of those paths, and the condition has to say so
      # separately: on the `pull_request` trigger `github.ref` is
      # `refs/pull/<n>/merge`, never `refs/heads/main`, so a check written
      # against `github.ref` alone cannot match and this step was skipped on
      # every PR into main. That is the merge gate itself, the one place a
      # silently-dropped suite decides whether code lands.
      #
      # Forks keep the soft-degrade, and `head.repo.full_name` is what
      # distinguishes them: a fork PR cannot see `KSP_MANAGED_TOKEN`, so the
      # checkout above genuinely cannot succeed there and failing would only
      # punish a contributor for a secret they were never given. A same-repo PR
      # has the secret and is held to the same bar as a push.
      #
      # `packages/core/src/ci-mandatory-steps.test.ts` evaluates this exact
      # expression against each of those event shapes, because a condition that
      # cannot match is invisible: the step reports as skipped, which is what a
      # correctly-skipped step also reports.
      - name: KSP reference assemblies are mandatory on main/staging and on PRs
        if: >-
          github.ref == 'refs/heads/main'
          || github.ref == 'refs/heads/staging'
          || (github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository
              && (github.base_ref == 'main' || github.base_ref == 'staging'))
        run: |
          set -euo pipefail
          # THE RULE: every DLL a suite's availability gate conditions on has to
          # be named here. A gate that goes false does not fail, it removes the
          # sources from the compile, so the suite runs zero tests and the job
          # stays green. Asserting a SUBSET of what the gates read is therefore a
          # check that cannot express the failure it exists to catch: it passes
          # on exactly the checkout that silently tests nothing.
          #
          # This list asserted only Assembly-CSharp.dll and kOS.dll and so had
          # that hole twice over. GonogoKosUplink.Tests' KosSafeAvailable reads
          # BOTH kOS.dll and kOS.Safe.dll, so a checkout carrying only kOS.dll
          # dropped the whole headless terminal harness and passed here.
          # Gonogo.KSP.Tests additionally resolves UnityEngine.CoreModule.dll for
          # ConfigNode's Vector3/Quaternion overload sets, and the robotics servo
          # capture needs UnityEngine.PhysicsModule.dll at TYPE LOAD, because
          # BaseServo declares ConfigurableJoint fields.
          required=(
            "KSP_Data/Managed/Assembly-CSharp.dll"
            "KSP_Data/Managed/UnityEngine.CoreModule.dll"
            "KSP_Data/Managed/UnityEngine.PhysicsModule.dll"
            "GameData/kOS/Plugins/kOS.dll"
            "GameData/kOS/Plugins/kOS.Safe.dll"
          )
          missing=""
          for rel in "${required[@]}"; do
            path="${{ github.workspace }}/ksp-managed/$rel"
            [ -f "$path" ] || missing="$missing $rel"
          done
          if [ -n "$missing" ]; then
            echo "::error::KSP reference assemblies absent on ${{ github.ref }}:$missing"
            echo "::error::The KSP-linked suites (kOS headless harness, Gonogo.KSP ConfigNode ledger, robotics servo capture) would be DROPPED at build time and this job would pass without them. Check the ksp-gonogo/ksp-managed checkout and the KSP_MANAGED_TOKEN secret."
            exit 1
          fi
          echo "KSP reference assemblies present (${#required[@]} checked): the KSP-linked suites will run."

      # The Uplink PLUGIN assemblies, which nothing else compiles.
      #
      # `dotnet test` below covers the test projects, and not one of them
      # references its own Uplink's implementation csproj: they reference the
      # `.Contract` slice, `Sitrep.Contract` and `Sitrep.Contract.TestSupport`.
      # So the eleven assemblies that actually ship in GameData were built by no
      # workflow at all (seven of them), or only by `publish-mods.yml` after CI
      # on main (the other four), which means a compile error landed on main
      # first and was reported by a publish job.
      #
      # Before `dotnet test` on purpose: a compile break should report as a
      # compile break in seconds rather than surfacing behind twenty test
      # projects each retried up to four times.
      #
      # Same soft-degrade contract as the suites below, and safe for the same
      # reason: on main, staging and same-repo PRs the mandatory-assemblies step
      # above has already failed the job if the reference set is absent, so this
      # can only skip on a fork that never had the secret.
      - name: Uplink plugin assemblies compile
        env:
          KSP_GAMEDATA: ${{ github.workspace }}/ksp-managed/GameData
          KSP_MANAGED: ${{ github.workspace }}/ksp-managed/KSP_Data/Managed
        run: |
          set -euo pipefail
          if [ ! -f "$KSP_MANAGED/Assembly-CSharp.dll" ]; then
            echo "::warning::KSP reference assemblies absent: Uplink plugin assemblies NOT COMPILED (soft-degrade, forks only)."
            exit 0
          fi
          bash scripts/uplink-mod-build.sh

      - name: dotnet test (KSP-independent Sitrep projects)
        working-directory: mod
        env:
          KSP_GAMEDATA: ${{ github.workspace }}/ksp-managed/GameData
          KSP_MANAGED: ${{ github.workspace }}/ksp-managed/KSP_Data/Managed
        run: |
          set -euo pipefail
          # Enable the headless kOS terminal harness only when the reference
          # DLLs are actually present (the checkout above may have soft-failed).
          kos_args=""
          if [ -f "$KSP_GAMEDATA/kOS/Plugins/kOS.Safe.dll" ] && [ -f "$KSP_GAMEDATA/kOS/Plugins/kOS.dll" ]; then
            kos_args="/p:KspGameData=$KSP_GAMEDATA"
            echo "kOS reference assemblies present: headless terminal harness ENABLED"
          else
            echo "::warning::kOS reference assemblies absent: headless kOS terminal harness SKIPPED (soft-degrade). Provide the ksp-gonogo/ksp-managed checkout + KSP_MANAGED_TOKEN to enable it."
          fi
          # Gonogo.KSP.Tests' PendingCreditLedgerTests touch the real
          # ConfigNode type (Assembly-CSharp.dll), same soft-degrade contract
          # as the kOS harness above: without the reference DLL the project
          # still builds and runs its pure-logic currency-delay suites, the
          # ConfigNode-backed ledger tests are dropped with a build warning.
          ksp_managed_args=""
          if [ -f "$KSP_MANAGED/Assembly-CSharp.dll" ]; then
            ksp_managed_args="/p:KspManaged=$KSP_MANAGED"
            echo "KSP reference assemblies present: PendingCreditLedgerTests ENABLED"
          else
            echo "::warning::KSP reference assemblies absent: PendingCreditLedgerTests SKIPPED (soft-degrade). Provide the ksp-gonogo/ksp-managed checkout + KSP_MANAGED_TOKEN to enable it."
          fi
          projects=(
            Sitrep.Contract.Tests
            Sitrep.Core.Tests
            Sitrep.Transport.Tests
            Sitrep.Propagation.Tests
            Sitrep.CaptureAnalysis.Tests
            Sitrep.Skeleton.Tests
            Sitrep.Host.Tests
            Sitrep.Host.IntegrationTests
            GonogoScansatUplink.Tests
            GonogoRealAntennasUplink.Tests
            GonogoKerbcastUplink.Tests
            GonogoActionGroupsExtendedUplink.Tests
            GonogoKosUplink.Tests
            GonogoKerbalismUplink.Tests
            GonogoAvionicsUplink.Tests
            GonogoTestFlightUplink.Tests
            GonogoMechJebUplink.Tests
            GonogoPrincipiaUplink.Tests
            GonogoRp1Uplink.Tests
            Gonogo.KSP.Tests
          )
          # THE OMISSION MODE HERE IS SILENT, so read this before adding a test
          # project anywhere. This list is hand-maintained by construction: the
          # solution cannot be tested wholesale because the KSP-linked projects
          # need a gitignored install (see SCOPING above), which is sound and is
          # not going to change. But nothing notices when a project joins
          # Gonogo.sln and not this array, and the result is not a warning, it is
          # a suite that silently never runs.
          #
          # Four projects drifted in over four weeks that way, absent from this
          # array, so 35 tests were gated by nothing:
          # GonogoAvionicsUplink.Tests and GonogoTestFlightUplink.Tests (both
          # 2026-07-22), GonogoMechJebUplink.Tests (2026-08-08) and
          # GonogoPrincipiaUplink.Tests (2026-08-20, found the same day it
          # landed). All four cost 343ms together, so the omission bought
          # nothing either. Added 2026-08-20.
          # EVERY project in that list is a hard gate. There is no exemption
          # mechanism here on purpose, and the history is why.
          #
          # Sitrep.Host.IntegrationTests was exempt from 2026-07-12: the
          # real-WebSocket suites hung on a slow runner because the in-process
          # server's pump was starved on the thread pool, so a ReceiveAsync never
          # resumed, a different 5-7 of the heaviest tests each run. That was
          # real, and it was FIXED on 2026-07-17 (3d83fee7), which moved the
          # client's receive pump onto a dedicated thread. The exemption outlived
          # its cause by over a month.
          #
          # What it cost in the meantime: the contract-reflection tests were
          # moved out into Sitrep.Contract.Tests purely so the fix for a
          # month-long dispatch bug would not be proven behind the exemption that
          # hid it; and a live flake in FleetDelayTests (an ordering assertion
          # that a legal LossyLatest coalesce could break, 2 of 3 runs red on
          # Linux) sat unseen because red only ever printed as a warning. Both
          # are the same failure mode: an exempted suite reports its failures to
          # nobody. Re-verified 2026-08-21 at podman --cpus=2, 10 of 10 full-suite
          # runs green, 153 passed / 1 skipped.
          #
          # If a suite ever genuinely needs to stop gating, give it its own named
          # condition and its own reason right here, rather than a name in a list
          # that outlives whoever knew why it was there.
          #
          # Retry EVERY project: a pathologically slow/loaded runner instance can
          # time out even the normally-deterministic suites (Kos, Host.Tests) on
          # their WS/async paths. A genuine regression fails all 4 attempts and is
          # still caught; only intermittent-pass flakes are absorbed.
          for p in "${projects[@]}"; do
            echo "::group::dotnet test $p"
            # Only GonogoKosUplink.Tests reads the kOS reference DLLs (its
            # headless terminal harness) and only Gonogo.KSP.Tests reads the
            # KSP_Data/Managed reference DLLs (its ConfigNode-backed ledger
            # tests); every other project is KSP-free and takes no extra args.
            extra=""
            if [ "$p" = "GonogoKosUplink.Tests" ]; then extra="$kos_args"; fi
            if [ "$p" = "Gonogo.KSP.Tests" ]; then extra="$ksp_managed_args"; fi
            attempts=4
            ok=0
            for a in $(seq 1 "$attempts"); do
              if dotnet test "$p/$p.csproj" --configuration Release $extra; then ok=1; break; fi
              echo "::warning::$p failed test attempt $a/$attempts"
            done
            echo "::endgroup::"
            if [ "$ok" != 1 ]; then
              echo "::error::$p failed after $attempts attempt(s)"; exit 1
            fi
          done

      # Sitrep.Contract.Codegen is built by nothing else in CI: it exists only
      # to feed rtcli, so a contract change that breaks it would otherwise stay
      # invisible until someone ran codegen.sh by hand. Running the real
      # generator and diffing its output checks both halves at once: that the
      # codegen project still compiles, and that the committed SDK actually
      # matches the contract it claims to be generated from.
      - name: Contract codegen is buildable and its committed output is current
        working-directory: mod
        run: |
          set -euo pipefail
          bash codegen.sh
          git diff --exit-code -- sitrep-sdk/src/__generated__

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        env:
          # .npmrc references ${GITHUB_TOKEN} for the @jonpepler scope
          # registry on GitHub Packages.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      # turbo build so the Playwright webServers (relay via tsx, app via
      # vite) have all workspace dists. Cache is local-only, so each matrix
      # job builds independently: costs CPU, not wall-time (jobs run in
      # parallel).
      - name: Build workspace
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Playwright e2e (${{ matrix.browser }})
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # Per-engine visual regression gate. Renders every widget through the probe
  # harness for one engine and diffs each against its committed baseline under
  # packages/components/visual-baselines/<engine>/. Its own matrix job with no
  # `needs`, so all three legs run concurrently with `test` and `e2e`, wall
  # time stays ≈ one engine's run. Baselines are Linux-generated (see the
  # update-baselines workflow); on drift the baseline/actual/diff PNGs upload
  # as an artifact.
  visual:
    runs-on: ubuntu-latest
    # AMBER, not silenced. The gate is deliberately red pending a whole-suite
    # re-baseline, and while that red counted towards the run conclusion it made
    # every other job's red invisible: an earth-day ratchet failure and then a
    # completely dead render harness both hid behind it. `continue-on-error`
    # keeps the job running and its findings readable while letting a real
    # failure elsewhere decide the run. "Baselines drifted" is amber here;
    # "the harness cannot render at all" is red in `test`, from probe-render-smoke.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      # The render harness esbuild-bundles component source, which imports the
      # workspace packages from their built dists: so build components and its
      # dependency graph (lighter than a full `pnpm build`; no app/relay needed
      # since the harness doesn't use Playwright webServers).
      - name: Build render dependencies
        run: pnpm --filter "@ksp-gonogo/components..." build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Visual gate (${{ matrix.browser }})
        run: pnpm --filter @ksp-gonogo/components visual-gate --engine ${{ matrix.browser }}

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ matrix.browser }}
          path: local_docs/renders/_visual-gate-diffs/
          retention-days: 7
