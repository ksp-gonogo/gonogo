name: Visual

# The per-engine visual regression gate, apart from ci.yml so a pixel diff
# never decides a landing: ci-dev-forward.yml reads the `CI` workflow alone.
# Same pushes and branches as ci.yml.
on:
  push:
    branches: [main, ci-dev, staging]
  pull_request:
    branches: [main, staging]
  # A baseline regen (update-baselines.yml) commits with GITHUB_TOKEN, which
  # does not trigger a run, so the regenerated tip needs a manual one.
  workflow_dispatch:

concurrency:
  group: visual-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Per-engine visual regression gate. Renders every widget through the probe
  # harness for one engine and diffs each against its committed baseline under
  # packages/components/visual-baselines/<engine>/. Its own matrix job with no
  # `needs`, so every leg runs at once. Each engine
  # is dealt across four shards (`--shard i/4` takes every 4th render config, so
  # each config renders in exactly one; gateScope.test.ts holds this count to a
  # partition of the real list). The job name keeps the "visual (" prefix and the
  # engine, which the mod matches. Baselines are Linux-generated (see
  # the update-baselines workflow); on drift the job fails and the
  # baseline/actual/diff PNGs upload as an artifact per shard.
  visual:
    name: visual (${{ matrix.browser }}, shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: pnpm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm install --frozen-lockfile

      # The render harness esbuild-bundles component source, which imports the
      # workspace packages from their built dists: so build components and its
      # dependency graph (lighter than a full `pnpm build`; no app/relay needed
      # since the harness doesn't use Playwright webServers).
      - name: Build render dependencies
        run: pnpm --filter "@ksp-gonogo/components..." build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Visual gate (${{ matrix.browser }})
        run: pnpm --filter @ksp-gonogo/components visual-gate --engine ${{ matrix.browser }} --shard ${{ matrix.shard }}/4

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ matrix.browser }}-${{ matrix.shard }}
          path: local_docs/renders/_visual-gate-diffs/
          retention-days: 7
