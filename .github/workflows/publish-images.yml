name: Publish proxy images

# Two publish channels share these jobs:
#
#   rc       rc.yml, nightly and on demand, calls this with channel=rc. Images
#            are tagged `rc` + `sha-...` and the bundle's app build carries a
#            `-rc.<shortsha>` version suffix. Testers run `:rc`; end users
#            never see it.
#   release  dispatched by release.yml on a `v*` tag, with channel=release.
#            Images are tagged `<version>` (from packages/app/package.json,
#            which the release commit just bumped) + `latest`. The version
#            also rides the peer `hello` handshake, so a station can tell
#            which release a host is running and the matching image tag lets
#            an operator pull (or pin) exactly that.
#
# Tag-driven `type=semver` can't work here: GITHUB_TOKEN-pushed tags never
# fire push triggers, so this workflow only ever sees call/dispatch events. The
# version is read from package.json instead.

on:
  workflow_call:
    inputs:
      channel:
        description: "Publish channel"
        required: false
        default: rc
        type: string
      ref:
        description: "Commit to build (default: the calling ref)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      channel:
        description: "Publish channel"
        required: false
        default: rc
        type: choice
        options:
          - rc
          - release

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ inputs.channel || 'rc' }}
  cancel-in-progress: false

env:
  CHANNEL: ${{ inputs.channel || 'rc' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: relay
            image: gonogo-relay
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: appver
        run: |
          echo "version=$(node -p "require('./packages/app/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: suffix
        run: |
          if [ "$CHANNEL" = "rc" ]; then
            SHA="${{ inputs.ref || github.sha }}"
            echo "value=-rc.${SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=rc,enable=${{ env.CHANNEL == 'rc' }}
            type=raw,value=${{ steps.appver.outputs.version }},enable=${{ env.CHANNEL == 'release' }}
            type=raw,value=latest,enable=${{ env.CHANNEL == 'release' }}

      - uses: docker/build-push-action@v6
        with:
          # Repo-root context so pnpm can resolve workspace deps inside
          # the build (services depend on @ksp-gonogo/logger).
          context: .
          file: ./packages/${{ matrix.package }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Runtime ENV for the services' log identity.
          build-args: |
            GONOGO_VERSION=${{ steps.appver.outputs.version }}${{ steps.suffix.outputs.value }}
            GONOGO_BUILD_TIME=${{ steps.build-time.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}

  # End-user bundle: app + relay in one image, served from
  # Dockerfile.bundle (repo-root context). Separate job from the matrix
  # because it has a different Dockerfile shape.
  publish-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: appver
        run: |
          echo "version=$(node -p "require('./packages/app/package.json').version")" >> "$GITHUB_OUTPUT"

      # RC bundles bake a prerelease suffix into the app so a host running
      # `:rc` announces e.g. 0.1.0-rc.a1b2c3d in the hello handshake.
      - id: suffix
        run: |
          if [ "$CHANNEL" = "rc" ]; then
            SHA="${{ inputs.ref || github.sha }}"
            echo "value=-rc.${SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gonogo
          tags: |
            type=sha,prefix=sha-
            type=raw,value=rc,enable=${{ env.CHANNEL == 'rc' }}
            type=raw,value=${{ steps.appver.outputs.version }},enable=${{ env.CHANNEL == 'release' }}
            type=raw,value=latest,enable=${{ env.CHANNEL == 'release' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.bundle
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_AXIOM_TOKEN=${{ secrets.VITE_AXIOM_TOKEN }}
            GONOGO_VERSION_SUFFIX=${{ steps.suffix.outputs.value }}
            GONOGO_VERSION=${{ steps.appver.outputs.version }}${{ steps.suffix.outputs.value }}
            GONOGO_BUILD_TIME=${{ steps.build-time.outputs.value }}
          cache-from: type=gha,scope=gonogo-bundle
          cache-to: type=gha,mode=max,scope=gonogo-bundle
