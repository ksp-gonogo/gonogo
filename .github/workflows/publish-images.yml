name: Publish proxy images

# Two publish channels share these jobs:
#
#   rc       rc.yml, nightly and on demand, calls this with channel=rc. Images
#            are tagged `rc` + `sha-...` and carry the `label` input
#            (X.Y.Z-rc.N or X.Y.Z-dev.<sha7>) as their version. Testers run `:rc`; end users
#            never see it.
#   release  dispatched by release.yml on a `v*` tag, with channel=release.
#            Images are tagged `<version>` (from packages/app/package.json,
#            which the release commit just bumped), plus `latest` when that
#            version is the newest release tag. The version
#            also rides the peer `hello` handshake, so a station can tell
#            which release a host is running and the matching image tag lets
#            an operator pull (or pin) exactly that.
#
# Both images are pushed by digest with no tag. One final job tags them, and
# only when both builds succeeded, so a failed build never leaves one image
# on a new release while the other stays on the old one.
#
# Tag-driven `type=semver` can't work here: GITHUB_TOKEN-pushed tags never
# fire push triggers, so this workflow only ever sees call/dispatch events. The
# version is read from package.json instead.

on:
  workflow_call:
    inputs:
      channel:
        description: "Publish channel"
        required: false
        default: rc
        type: string
      ref:
        description: "Commit to build (default: the calling ref)"
        required: false
        type: string
      label:
        description: "rc channel: the version to carry, X.Y.Z-rc.N or X.Y.Z-dev.<sha7>"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      channel:
        description: "Publish channel"
        required: false
        default: rc
        type: choice
        options:
          - rc
          - release
      label:
        description: "rc channel: the version to carry, X.Y.Z-rc.N or X.Y.Z-dev.<sha7>"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ inputs.channel || 'rc' }}
  cancel-in-progress: false

env:
  CHANNEL: ${{ inputs.channel || 'rc' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.appver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Only a release tag publishes the release channel
        if: ${{ env.CHANNEL == 'release' }}
        run: node scripts/mod-release-tag.mjs assert "${GITHUB_REF_NAME}"

      - id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: appver
        env:
          LABEL: ${{ inputs.label }}
        run: |
          VERSION="$(node -p "require('./packages/app/package.json').version")"
          if [ "$CHANNEL" = "release" ] && [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::packages/app/package.json says ${VERSION} but the tag is ${GITHUB_REF_NAME}"; exit 1
          fi
          # RC images carry the run's label so a host running `:rc` announces
          # e.g. 1.0.0-rc.41 in the hello handshake.
          if [ "$CHANNEL" = "rc" ]; then
            if [ -z "$LABEL" ]; then
              echo "::error::channel=rc needs a label (X.Y.Z-rc.N or X.Y.Z-dev.<sha7>)"; exit 1
            fi
            VERSION="$LABEL"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          # Repo-root context so pnpm can resolve workspace deps inside
          # the build (services depend on @ksp-gonogo/logger).
          context: .
          file: ./packages/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/gonogo-relay,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          # Runtime ENV for the services' log identity.
          build-args: |
            GONOGO_VERSION=${{ needs.plan.outputs.version }}
            GONOGO_BUILD_TIME=${{ steps.build-time.outputs.value }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s' "$DIGEST" > digest-relay

      - uses: actions/upload-artifact@v4
        with:
          name: digest-relay
          path: digest-relay
          if-no-files-found: error

  # End-user bundle: app + relay in one image, served from
  # Dockerfile.bundle (repo-root context). Separate job because it has a
  # different Dockerfile shape.
  publish-bundle:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.bundle
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/gonogo,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          build-args: |
            VITE_AXIOM_TOKEN=${{ secrets.VITE_AXIOM_TOKEN }}
            GONOGO_VERSION=${{ needs.plan.outputs.version }}
            GONOGO_BUILD_TIME=${{ steps.build-time.outputs.value }}
          cache-from: type=gha,scope=gonogo-bundle
          cache-to: type=gha,mode=max,scope=gonogo-bundle

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s' "$DIGEST" > digest-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: digest-bundle
          path: digest-bundle
          if-no-files-found: error

  # Runs only when both builds pushed, so the two images move together.
  # `latest` moves only for the newest stable release tag: re-running an older
  # release's publish leaves it where it is.
  tag:
    needs: [plan, publish, publish-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Tag both images
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tags=("sha-${SHA:0:7}")
          if [ "$CHANNEL" = "rc" ]; then
            tags+=("rc")
          else
            tags+=("$VERSION")
            newest="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' \
              | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
            if [ "v${VERSION}" = "$newest" ]; then
              tags+=("latest")
            else
              echo "::warning::v${VERSION} is not the newest release tag (${newest:-none}); leaving latest where it is"
            fi
          fi
          for pair in "gonogo-relay:relay" "gonogo:bundle"; do
            image="ghcr.io/${OWNER}/${pair%%:*}"
            digest="$(cat "digests/digest-${pair##*:}")"
            args=()
            for t in "${tags[@]}"; do args+=(-t "${image}:${t}"); done
            docker buildx imagetools create "${args[@]}" "${image}@${digest}"
          done
