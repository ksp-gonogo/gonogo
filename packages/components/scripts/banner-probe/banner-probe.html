<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alarm banner probe</title>
    <style id="probe-theme">/* injected by render-alarm-banner driver from packages/theme/src/tokens.css */</style>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--color-surface-app);
        color: var(--color-text-primary);
        font-family: var(--font-family-mono);
        /*
         * Hide the scrollbar; do not disable scrolling. The driver screenshots
         * the viewport at the render size, so a scrollbar would both show up in
         * the shot and narrow the box the content is centred in. Suppressing it
         * with overflow:hidden did that but took the wheel and the End key with
         * it, and this page is left on disk for a human to open in whatever
         * window they have, which is routinely shorter than the render.
         */
        scrollbar-width: none;
      }
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        display: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #root {
        position: relative;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./banner-probe-entry.bundle.js"></script>
  </body>
</html>
